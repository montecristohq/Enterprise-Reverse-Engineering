document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht: 600;\n  font-display: swap;\n  src: url(\"792338d7-bb6a-48e3-8ab6-88a08e693128\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n <span class=\"hn mono\"><\u002Fspan><span class=\"ht\">How to read this document<\u002Fspan><\u002Fh2>\n<p>This study takes the DZ BANK Group apart component by component across five volumes, then reassembles it. Each volume was researched and written as a standalone study; this master edition binds them into one document with a single set of conventions, a glossary, a canonical figures register, and a synthesis that no individual volume contains.<\u002Fp>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Part<\u002Fsc-raw-th><sc-raw-th>Volume<\u002Fsc-raw-th><sc-raw-th>Question it answers<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Front matter<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Conventions, glossary, canonical figures, how to navigate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\">Part I<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Corporate, Legal, Regulatory &amp; Institutional Anatomy<\u002Fsc-raw-td><sc-raw-td>Who owns and controls the group; how a customer-owned conglomerate is governed across five supervisory regimes<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-ii-part-ii-product-customer-distribution-and-flow-architecture\">Part II<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Product, Customer, Distribution &amp; Flow Architecture<\u002Fsc-raw-td><sc-raw-td>What the group manufactures, who sells it, and what each party earns<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-risk-infrastructure-and-organisational-des\">Part III<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Operations, Technology, Data, Risk Infrastructure &amp; Organisational Design<\u002Fsc-raw-td><sc-raw-td>How seven regulated operating models run as one federated group<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Part IV<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Financial Statements, Three Economic Engines, Unit Economics &amp; Capital<\u002Fsc-raw-td><sc-raw-td>How three incompatible economic machines and three capital regimes coexist<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-and-strategic-evolution\">Part V<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution<\u002Fsc-raw-td><sc-raw-td>Why the group persists, what is genuinely defensible, and what it becomes<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-vi-part-vi-cross-volume-synthesis\">Part VI<\u002Fa><\u002Fsc-raw-td><sc-raw-td><strong>Cross-Volume Synthesis<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>What the five volumes prove together that none proves alone<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#app-a-appendix-a-glossary-of-german-and-regulatory-terms\">Appendix A<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Glossary of German and Regulatory Terms<\u002Fsc-raw-td><sc-raw-td>Load-bearing — read before <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Part IV<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#app-b-appendix-b-canonical-figures-register\">Appendix B<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Canonical Figures Register<\u002Fsc-raw-td><sc-raw-td>The governing value for every material number, with its perimeter<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#app-c-appendix-c-reconciliation-of-cross-volume-discrepancies\">Appendix C<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Reconciliation of Cross-Volume Discrepancies<\u002Fsc-raw-td><sc-raw-td>Where the volumes disagree, and which figure governs<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#app-d-appendix-d-source-hierarchy-and-evidence-conventions\">Appendix D<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Source Hierarchy &amp; Evidence Conventions<\u002Fsc-raw-td><sc-raw-td>How claims were graded<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p><strong>Recommended reading order for a first pass:<\u002Fstrong> <a class=\"xr\" href=\"#app-a-appendix-a-glossary-of-german-and-regulatory-terms\">Appendix A<\u002Fa> (glossary) → the perimeter convention below → <a class=\"xr\" href=\"#part-vi-part-vi-cross-volume-synthesis\">Part VI<\u002Fa> (Synthesis) → <a class=\"xr\" href=\"#app-b-appendix-b-canonical-figures-register\">Appendix B<\u002Fa> → then Parts IV and V in full. Parts I, II and III are reference-depth.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-conventions-governing-the-whole-document\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Conventions governing the whole document<\u002Fspan><\u002Fh2>\n<h3 class=\"hd hd3\" id=\"s-evidence-classification\">Evidence classification<\u002Fh3>\n<p>Every material claim carries one of six labels. No inference is silently promoted to fact.<\u002Fp>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Label<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Directly supported by reliable primary evidence<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><span class=\"ev\">COMPANY CLAIM<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Stated by the group, not independently verified<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Externally reported or estimated<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Reasonably inferred from multiple known facts<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><span class=\"ev\">HYPOTHESIS<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Possible explanation requiring further evidence<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Available evidence is insufficient<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h3 class=\"hd hd3\" id=\"s-the-governing-convention-five-perimeters-read-this-before-any-figure\">The governing convention — FIVE perimeters. Read this before any figure.<\u002Fh3>\n<p>This is the single most important reading instruction in the document, and the most common source of error in third-party commentary on the group. Five distinct perimeters recur throughout, and they are <strong>never<\u002Fstrong> spliced:<\u002Fp>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>#<\u002Fsc-raw-th><sc-raw-th>Perimeter<\u002Fsc-raw-th><sc-raw-th>What it is<\u002Fsc-raw-th><sc-raw-th>Scale anchor<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td><strong>DZ BANK AG<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The parent institution alone, HGB Einzelabschluss<\u002Fsc-raw-td><sc-raw-td>Operating income €2,835m (2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td><strong>DZ BANK Group / Konzern<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>IFRS consolidated, including R+V, Union Investment, BSH, DZ HYP and the rest<\u002Fsc-raw-td><sc-raw-td>~€661bn assets; €4,282m pre-tax (2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td><strong>Genossenschaftliche FinanzGruppe<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The <strong>whole cooperative sector<\u002Fstrong>, including the ~645 primary banks — <strong>NOT DZ BANK<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>€1.68trn assets; €11.6bn pre-tax (2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td><strong>Bankenaufsichtlicher Konsolidierungskreis<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>CRR prudential scope — <strong>excludes the insurance business<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>RWA €148.6bn<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td><strong>Solvency II group (R+V)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The insurance perimeter, separately supervised<\u002Fsc-raw-td><sc-raw-td>Own funds €17.05bn; SCR €8.37bn<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n\n<figure class=\"fig\" id=\"fig-1\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 1<\u002Fspan><span class=\"fig-t\">The Five Perimeters<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n  <div style=\"border:1px solid var(--wire);padding:18px 20px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\">\n      <div><span class=\"f-lbl\">Perimeter 3<\u002Fspan><div class=\"f-name\">Genossenschaftliche FinanzGruppe — the whole sector<\u002Fdiv><\u002Fdiv>\n      <div class=\"f-num\" style=\"font-size:21px\">€1.68trn assets · €11.6bn pre-tax<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"f-meta\">~645 primary banks + the central institution + all product subsidiaries. <strong>Not DZ BANK.<\u002Fstrong><\u002Fdiv>\n    <div style=\"border:1px solid var(--wire);padding:18px 20px;margin-top:16px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\">\n        <div><span class=\"f-lbl\">Perimeter 2<\u002Fspan><div class=\"f-name\">DZ BANK Group / Konzern — IFRS consolidated<\u002Fdiv><\u002Fdiv>\n        <div class=\"f-num\" style=\"font-size:21px\">~€661bn assets · €4,282m pre-tax<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"f-meta\">Including R+V, Union Investment, BSH, DZ HYP, DZ PRIVATBANK, TeamBank, VR Smart Finanz.<\u002Fdiv>\n      <div class=\"f-box solid\" style=\"margin-top:16px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap\">\n        <div><span class=\"f-lbl\" style=\"color:var(--acc-dk)\">Perimeter 1<\u002Fspan><div class=\"f-name\">DZ BANK AG — parent only, HGB Einzelabschluss<\u002Fdiv><\u002Fdiv>\n        <div class=\"f-num\" style=\"font-size:21px\">Operating income €2,835m<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px\">\n    <div class=\"f-box\"><span class=\"f-lbl\">Perimeter 4<\u002Fspan><div class=\"f-name\">Bankenaufsichtlicher Konsolidierungskreis<\u002Fdiv><div class=\"f-meta\">CRR prudential scope — <strong>excludes the insurance business<\u002Fstrong><\u002Fdiv><div class=\"f-num acc\" style=\"font-size:19px;margin-top:8px\">RWA €148.6bn<\u002Fdiv><\u002Fdiv>\n    <div class=\"f-box\"><span class=\"f-lbl\">Perimeter 5<\u002Fspan><div class=\"f-name\">Solvency II group (R+V)<\u002Fdiv><div class=\"f-meta\">The insurance perimeter, separately supervised<\u002Fdiv><div class=\"f-num acc\" style=\"font-size:19px;margin-top:8px\">Own funds €17.05bn · SCR €8.37bn<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:22px;padding-top:16px;border-top:1px solid var(--wire2)\">\n    <div class=\"f-lbl\" style=\"margin-bottom:10px\">Total assets to scale<\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:8px\"><span class=\"mono\" style=\"font-size:14.5px;color:var(--muted);width:104px;flex:none\">Sector<\u002Fspan><span class=\"bar\" style=\"flex:1\"><span class=\"barf hi\" style=\"width:100%\"><\u002Fspan><\u002Fspan><span class=\"mono\" style=\"font-size:15px;width:96px;text-align:right\">€1.68trn<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px\"><span class=\"mono\" style=\"font-size:14.5px;color:var(--muted);width:104px;flex:none\">Group<\u002Fspan><span class=\"bar\" style=\"flex:1\"><span class=\"barf\" style=\"width:39.3%\"><\u002Fspan><\u002Fspan><span class=\"mono\" style=\"font-size:15px;width:96px;text-align:right\">€661bn<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\"><b>The sector is roughly 2.5 times the group's balance sheet and 2.7 times its profit.<\u002Fb> Conflating them is the most common error in commentary on DZ BANK.<\u002Ffigcaption><\u002Ffigure>\n\n\n<p>Perimeter 3 is quoted as though it were the group more often than any other figure in German banking commentary. It is roughly <strong>2.5 times<\u002Fstrong> the group's balance sheet and <strong>2.7 times<\u002Fstrong> its profit. Every figure in this document carries its perimeter.<\u002Fp>\n<h3 class=\"hd hd3\" id=\"s-accounting-basis-discipline\">Accounting-basis discipline<\u002Fh3>\n<p>The group reports simultaneously under <strong>IFRS<\u002Fstrong> (consolidated group), <strong>HGB<\u002Fstrong> (parent and several subsidiaries) and <strong>Solvency II<\u002Fstrong> (R+V). Three consequences matter throughout:<\u002Fp>\n<ol class=\"lst\"><li><strong>IFRS 17<\u002Fstrong> applies to insurance from 2023 and fundamentally changed presentation. \"Net income from insurance business\" is an IFRS 17 construct, <strong>not<\u002Fstrong> premium income, and pre-2023 and post-2023 insurance figures are not comparable without adjustment.<\u002Fli><li><strong>CRR III<\u002Fstrong> took effect on 1 January 2025 and lowered risk-weighted assets, which is the main reason the CET1 ratio rose from 15.8% to 18.4% without a capital raise.<\u002Fli><li><strong>Capital cannot be expressed as one number<\u002Fstrong> — see <a class=\"xr\" href=\"#app-b-appendix-b-canonical-figures-register\">Appendix B<\u002Fa> and <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Part IV<\u002Fa>.<\u002Fli><\u002Fol>\n<h3 class=\"hd hd3\" id=\"s-language\">Language<\u002Fh3>\n<p>Primary sources are overwhelmingly German. German terms are retained where translation would lose precision, and are defined in <a class=\"xr\" href=\"#app-a-appendix-a-glossary-of-german-and-regulatory-terms\">Appendix A<\u002Fa>.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<div class=\"sep\"><\u002Fdiv><\u002Fsection>\n<section class=\"sec\" data-part=\"1\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part I<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">I<\u002Fspan><\u002Fdiv><h1 id=\"part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\" class=\"part\" data-short=\"Part I — Corporate, Legal, Regulatory &amp; Institutional Anatomy\">Corporate, Legal, Regulatory &amp; Institutional Anatomy<\u002Fh1><p class=\"opener-s\">Who owns and controls the group, and how a customer-owned conglomerate is governed across five supervisory regimes.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">I<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">17<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Perimeters<\u002Fdiv><div class=\"plate-v\">Five<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-tl-dr\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR<\u002Fspan><\u002Fa><a href=\"#s-key-findings\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-i-1\"><span class=\"inpart-n\">I.1<\u002Fspan><span>Origin and Corporate History — Chronological Institutional Evolution<\u002Fspan><\u002Fa><a href=\"#s-i-2\"><span class=\"inpart-n\">I.2<\u002Fspan><span>Corporate Group Structure<\u002Fspan><\u002Fa><a href=\"#s-i-3\"><span class=\"inpart-n\">I.3<\u002Fspan><span>Ownership and Control<\u002Fspan><\u002Fa><a href=\"#s-i-4\"><span class=\"inpart-n\">I.4<\u002Fspan><span>Governance Architecture (German two-tier model)<\u002Fspan><\u002Fa><a href=\"#s-i-5\"><span class=\"inpart-n\">I.5<\u002Fspan><span>Legal Architecture (Follow-the-Legal-Entity lens)<\u002Fspan><\u002Fa><a href=\"#s-i-6\"><span class=\"inpart-n\">I.6<\u002Fspan><span>Regulatory and Supervisory Architecture — Multi-Regime Map (PRIORITY DEPTH)<\u002Fspan><\u002Fa><a href=\"#s-i-7\"><span class=\"inpart-n\">I.7<\u002Fspan><span>Own Capability vs Partner Dependency<\u002Fspan><\u002Fa><a href=\"#s-i-8\"><span class=\"inpart-n\">I.8<\u002Fspan><span>Regulation and Structure as Competitive Position<\u002Fspan><\u002Fa><a href=\"#s-i-9\"><span class=\"inpart-n\">I.9<\u002Fspan><span>Institutional Dependency Map<\u002Fspan><\u002Fa><a href=\"#s-i-10\"><span class=\"inpart-n\">I.10<\u002Fspan><span>Tax and Intercompany Architecture<\u002Fspan><\u002Fa><a href=\"#s-i-11\"><span class=\"inpart-n\">I.11<\u002Fspan><span>Corporate and Regulatory Risk Register<\u002Fspan><\u002Fa><a href=\"#s-i-12\"><span class=\"inpart-n\">I.12<\u002Fspan><span>Volume I Reconstruction — Synthesis and the Framing Questions<\u002Fspan><\u002Fa><a href=\"#s-recommendations\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a href=\"#s-caveats\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><p><em>Enterprise Reverse-Engineering Framework, Subject III. Standalone study; structural contrasts with Wise plc and Atruvia AG noted only where they illuminate DZ BANK. As of August 2026, using FY2025 (31 Dec 2025) results and mid-2026 governance.<\u002Fem><\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-tl-dr\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">TL;DR<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>DZ BANK is a customer-owned central institution wrapped inside a bank-plus-insurance financial conglomerate.<\u002Fstrong> As of 31 December 2025, ~94.8% of DZ BANK AG is held by the cooperative banks; the IFRS group (~€661bn total assets, €4.282bn pre-tax profit FY2025) is a BaFin-designated financial conglomerate combining the DZ BANK banking group (under direct ECB supervision) with one of Germany's largest insurers (R+V under Solvency II), an asset manager (Union Investment), a Bausparkasse (Schwäbisch Hall) and Germany's largest Pfandbrief bank (DZ HYP).<\u002Fli><li><strong>Actual control sits with the owner-banks, not with Frankfurt management.<\u002Fstrong> Roughly 645 primary cooperative banks (as of end-November 2025) collectively control DZ BANK through the AGM and a supervisory board of owner-bank CEOs, coordinated by the BVR. The single most distinctive institutional feature is the BVR's institutional protection scheme (IPS): no member has failed since 1934, and the scheme delivers the sector's AA-band ratings and a 0% risk weight on intra-network exposures under Article 113(7) CRR.<\u002Fli><li><strong>The most misunderstood feature is the perimeter.<\u002Fstrong> DZ BANK AG ≠ DZ BANK Group ≠ Genossenschaftliche FinanzGruppe (~€1.175trn). This report labels every figure by perimeter and corrects the frequently-repeated error that DZ BANK holds ~20% of Atruvia — it holds ~0.35%; the ~20% figure refers to Verimi.<\u002Fli><\u002Ful>\n<h2 class=\"hd hd2\" id=\"s-key-findings\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>Product of successive mergers.<\u002Fstrong> DZ BANK AG in its current form dates from the 2001 merger of DG BANK and GZ-Bank; the 2016 absorption of WGZ BANK left a single cooperative central institution for the first time; the 2018 merger of DG HYP and WL BANK created DZ HYP; DVB Bank was wound down and became defunct in 2022.<\u002Fli><li><strong>Ownership is concentrated in the sector itself.<\u002Fstrong> As of 31 December 2025, cooperative banks (direct and indirect) hold 94.8%, other cooperative enterprises 4.8%, and others 0.5% of DZ BANK AG (DZ BANK's own factsheet).<\u002Fli><li><strong>Two-tier governance populated by owner-customers.<\u002Fstrong> The eight-member Vorstand (CEO Dr Cornelius Riese) is supervised by a quasi-parity co-determined Aufsichtsrat chaired by Henning Deneke-Jöhrens, itself dominated by serving cooperative-bank CEOs — the bank's own customers and owners.<\u002Fli><li><strong>Five simultaneous supervisory regimes plus conglomerate supervision.<\u002Fstrong> Banking (ECB/SSM + BaFin/Bundesbank), insurance (Solvency II/BaFin for R+V), funds (KAGB/AIFMD/UCITS for Union Investment), Bausparkassen (BSpKG for Schwäbisch Hall), Luxembourg (CSSF for DZ PRIVATBANK), plus FKAG financial-conglomerate supplementary supervision and SRB resolution planning.<\u002Fli><li><strong>The IPS is the load-bearing wall.<\u002Fstrong> Dual structure: the older BVR-SE (institution protection, since 1934) and the statutory BVR-ISG (deposit guarantee + Article 113(7) IPS since 2015). It underpins the 0% risk-weighting of intra-network exposures and the sector's ratings.<\u002Fli><li><strong>Card business reorganisation underway.<\u002Fstrong> VR Payment's Issuing-Processing division transfers to Atruvia effective 1 January 2027 (Bundeskartellamt case B9-75/26, notified 15 July 2026), concentrating debit and credit card processing at the sector's IT utility while VR Payment refocuses on acquiring/merchant business.<\u002Fli><\u002Fol>\n<h2 class=\"hd hd2\" id=\"s-details\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Details<\u002Fspan><\u002Fh2>\n<h2 class=\"hd hd2\" id=\"s-i-1\"><span class=\"hn mono\">I.1<\u002Fspan><span class=\"ht\">Origin and Corporate History — Chronological Institutional Evolution<\u002Fspan><\u002Fh2>\n<p><span class=\"ev\">CONFIRMED FACT.<\u002Fspan> The cooperative banking movement has two nineteenth-century founders: Hermann Schulze-Delitzsch (urban credit cooperatives, from 1859) and Friedrich Wilhelm Raiffeisen (rural credit unions, 1860s). DZ BANK dates its oldest direct \"root\" to 1883, when Wilhelm Haas supported the establishment of the <strong>Landwirtschaftliche Genossenschaftsbank AG<\u002Fstrong> in Darmstadt — a central institution owned by the savings-and-loan cooperatives of Hesse, created to perform liquidity compensation and to run payments/collection for the joint procurement of agricultural commodities. It over-extended into non-cooperative business, incurred heavy losses, and was forced to restructure in 1904 — an early demonstration of the recurring hazard when a cooperative central institution strays from its Förderauftrag (a pattern later echoed by DVB Bank).<\u002Fp>\n<p>The <strong>Preußische Central-Genossenschafts-Kasse (\"Preußenkasse\")<\u002Fstrong> was founded in 1895 as a state central bank for cooperatives. Its lineage ran through the Deutsche Genossenschaftskasse, which the <strong>DG BANK Deutsche Genossenschaftsbank Act of 1975<\u002Fstrong> renamed and expanded into DG BANK, broadening its banking purview. DG BANK opened international offices (New York and Hong Kong) as early as 1976; by 1998 its balance sheet exceeded DM 500 billion. In July 1990 DG BANK took over the central-institution function in the new federal states (former East Germany) as part of a sector-wide solidarity action.<\u002Fp>\n<p><strong>Progressive consolidation of regional central institutions (Zentralbanken).<\u002Fstrong> Historically the sector ran a three-tier structure (primary banks → regional central banks → national apex) in western/south-western Germany and a two-tier structure in the north, east and south. Regional central institutions merged over decades; SGZ-Bank and GZB-Bank merged in 2000 to form GZ-Bank.<\u002Fp>\n<p><strong>2001 — DG BANK + GZ-Bank → DZ BANK.<\u002Fstrong> On 24 June 2001 (completed September 2001) DG BANK and GZ-Bank merged to form DZ BANK AG Deutsche Zentral-Genossenschaftsbank, then Germany's sixth-largest bank. <em>Structural change:<\u002Fem> a dominant national apex with a combined product-subsidiary portfolio. <em>Path dependency:<\u002Fem> WGZ BANK (western Germany) remained independent, so the sector retained two competing central institutions for a further fifteen years — a structural inefficiency that shaped the 2016 merger and its constituency politics.<\u002Fp>\n<p><strong>2016 — DZ BANK + WGZ BANK.<\u002Fstrong> DZ BANK's AGM approved the merger with WGZ BANK (Westdeutsche Genossenschafts-Zentralbank, Düsseldorf) on 22 June 2016 with 99.99% of represented capital (WGZ's AGM: 99.9%); the combined central institution began operating on 1 August 2016. <em>Structural change:<\u002Fem> for the first time a single central institution for the entire sector, completing the transformation to a two-tier structure begun in the 1980s. <em>New dependency/obligation:<\u002Fem> a north (ex-WGZ) / south (ex-DG) constituency division became embedded in the shareholder base and the supervisory board — a fault line still visible in board composition and in the co-CEO arrangement of 2019–2024.<\u002Fp>\n<p><strong>2018 — DG HYP + WL BANK → DZ HYP.<\u002Fstrong> The two cooperative real-estate banks merged (agreement 20 March 2018; AGMs 25/28 May 2018; Commercial Register entry 27 July 2018, retroactive to 1 January 2018). WL BANK was merged into DG HYP, which was renamed <strong>DZ HYP AG<\u002Fstrong> (AG Hamburg, HRB 5604). <em>Capability gained:<\u002Fem> Germany's largest Pfandbrief issuer (the two issuers had ~€45.3bn of Pfandbriefe outstanding at Q1 2017). <em>Rationale:<\u002Fem> eliminate duplication after the 2016 merger had left two cooperative real-estate banks under one roof — pure post-merger housekeeping.<\u002Fp>\n<p><strong>DVB Bank — disposal/wind-down.<\u002Fstrong> DVB Bank SE (transport finance: shipping, aviation, land transport, offshore) was crippled by the post-2008 shipping slump — a net loss of €547m and −73% RoE in H1 2017, with H1 provisions of €445m. DZ BANK squeezed out DVB minority shareholders in August 2017 (ending the Frankfurt listing), then wound down and sold in tranches: land transport to Helaba; the aviation-finance portfolio (~€5.6bn) to Japan's MUFG (agreed early 2019); shipping wound down from December 2018. DVB Bank SE became <strong>defunct on 12 August 2022<\u002Fstrong>, merged into DZ BANK. <em>Capability lost:<\u002Fem> a once-top-five global transport-finance franchise. <em>Lesson embedded:<\u002Fem> a non-core, cyclical, US-dollar-funded specialist book is a poor fit inside a cooperative apex — reinforcing the sector's preference for the \"one champion per product\" architecture.<\u002Fp>\n<p><strong>2026–2027 — card-business reorganisation.<\u002Fstrong> On 2 July 2026 Atruvia, DZ BANK and VR Payment signed contracts to reorganise the jointly-operated card business effective 1 January 2027: <strong>Atruvia acquires VR Payment's Issuing-Processing division<\u002Fstrong> and will run debit <em>and<\u002Fem> credit card processing on an integrated platform (Giro/debit/credit cards), working closely with DZ BANK; VR Payment refocuses on acquiring, POS network operation and the merchant business. The transaction was notified to the Bundeskartellamt on 15 July 2026 (<strong>case B9-75/26<\u002Fstrong>, \"Atruvia AG (D); Erwerb des Issuing Processing Geschäfts von der VR Payment GmbH\"). <em>Structural effect:<\u002Fem> effectively a partial break-up of VR Payment and the concentration of card issuing-processing in the sector's IT utility — a significant event because a large share of German credit-card transactions already runs through Atruvia's systems. <strong><span class=\"ev\">COMPANY CLAIM<\u002Fspan> / PENDING:<\u002Fstrong> completion is subject to Bundeskartellamt clearance.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-i-2\"><span class=\"hn mono\">I.2<\u002Fspan><span class=\"ht\">Corporate Group Structure<\u002Fspan><\u002Fh2>\n<p><strong>Perimeter discipline (CRITICAL).<\u002Fstrong> Three reporting bases must never be conflated:<\u002Fp>\n\n<figure class=\"fig\" id=\"fig-6\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 6<\u002Fspan><span class=\"fig-t\">Group Structure<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div class=\"node n-steel\" style=\"margin-bottom:0\"><div class=\"node-t\">DZ BANK AG — central institution, corporate bank, holding company<\u002Fdiv><div class=\"node-m\">Frankfurt am Main · consolidating parent of the IFRS group<\u002Fdiv><\u002Fdiv>\n<div class=\"conn\"><span class=\"conn-l\">holds and consolidates<\u002Fspan><\u002Fdiv>\n<div class=\"tree\">\n  <div class=\"trow-h\"><span>Entity<\u002Fspan><span>Business<\u002Fspan><span>Scale<\u002Fspan><span style=\"text-align:right\">FY2025<\u002Fspan><\u002Fdiv>\n  <div class=\"trow\"><span class=\"tr-n\">R+V Versicherung<\u002Fspan><span class=\"tr-b\">Composite insurance — life, health, P&amp;C, reinsurance<\u002Fspan><span class=\"tr-v\"><span class=\"mono\">€22.8bn gross written premiums<\u002Fspan><span class=\"mono\">&gt;18,400 staff · ~26m insured risks<\u002Fspan><\u002Fspan><span class=\"tr-e mono\">€2,144m<\u002Fspan><\u002Fdiv>\n  <div class=\"trow\"><span class=\"tr-n\">Union Investment<\u002Fspan><span class=\"tr-b\">Asset management, retail and institutional<\u002Fspan><span class=\"tr-v\"><span class=\"mono\">€534.6bn assets under management<\u002Fspan><span class=\"mono\">72.37% held<\u002Fspan><\u002Fspan><span class=\"tr-e mono\">€1,185m<\u002Fspan><\u002Fdiv>\n  <div class=\"trow\"><span class=\"tr-n\">Bausparkasse Schwäbisch Hall<\u002Fspan><span class=\"tr-b\">Bauspar and home finance<\u002Fspan><span class=\"tr-v\"><span class=\"mono\">~7m contracts<\u002Fspan><span class=\"mono\">33.3% market share<\u002Fspan><\u002Fspan><span class=\"tr-e mono\">€122m<\u002Fspan><\u002Fdiv>\n  <div class=\"trow\"><span class=\"tr-n\">DZ HYP<\u002Fspan><span class=\"tr-b\">Commercial and public-sector real estate<\u002Fspan><span class=\"tr-v\"><span class=\"mono\">€57.6bn portfolio<\u002Fspan><span class=\"mono\">largest German Pfandbrief issuer<\u002Fspan><\u002Fspan><span class=\"tr-e mono\">€338m<\u002Fspan><\u002Fdiv>\n  <div class=\"trow\"><span class=\"tr-n\">DZ PRIVATBANK<\u002Fspan><span class=\"tr-b\">Private banking, Luxembourg fund services<\u002Fspan><span class=\"tr-v\"><span class=\"mono\">€30.7bn AuM<\u002Fspan><span class=\"mono\">€181.3bn custody<\u002Fspan><\u002Fspan><span class=\"tr-e mono\">€106m<\u002Fspan><\u002Fdiv>\n  <div class=\"trow loss\"><span class=\"tr-n\">TeamBank<\u002Fspan><span class=\"tr-b\">Consumer credit — easyCredit<\u002Fspan><span class=\"tr-v\"><span class=\"mono\">€9,132m loan book<\u002Fspan><span class=\"mono acc\">loss-making<\u002Fspan><\u002Fspan><span class=\"tr-e mono\">−€29m<\u002Fspan><\u002Fdiv>\n  <div class=\"trow loss\"><span class=\"tr-n\">VR Smart Finanz<\u002Fspan><span class=\"tr-b\">SME leasing and small-ticket finance<\u002Fspan><span class=\"tr-v\"><span class=\"mono acc\">loss-making<\u002Fspan><span class=\"mono\">turnaround in progress<\u002Fspan><\u002Fspan><span class=\"tr-e mono\">−€28m<\u002Fspan><\u002Fdiv>\n  <div class=\"trow\"><span class=\"tr-n\">VR Payment<\u002Fspan><span class=\"tr-b\">Acquiring, POS, merchant business<\u002Fspan><span class=\"tr-v\"><span class=\"mono\">~248 employees<\u002Fspan><span class=\"mono\">issuing-processing to Atruvia 1 Jan 2027<\u002Fspan><\u002Fspan><span class=\"tr-e mono\">n/d<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\"><b>Münchener Hypothekenbank sits outside the group.<\u002Fb> It is an independent cooperative bank and an in-sector competitor to DZ HYP — not a subsidiary.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\">Two of the eight operating subsidiaries lost money in FY2025; both sit at the retail edge, where the group competes with platforms rather than with banks.<\u002Ffigcaption><\u002Ffigure>\n\n\n<ol class=\"lst\"><li><strong>DZ BANK AG<\u002Fstrong> — the parent institution (HGB Einzelabschluss). AG Frankfurt am Main, HRB 45651; BLZ 500 604 00; BIC GENODEFF; VAT DE114103491.<\u002Fli><li><strong>DZ BANK Group/Konzern<\u002Fstrong> — IFRS consolidated, including R+V, Union Investment (UMH), BSH, DZ HYP, DZ PRIVATBANK, TeamBank, VR Smart Finanz.<\u002Fli><li><strong>Genossenschaftliche FinanzGruppe<\u002Fstrong> — the whole sector including the ~645 primary banks (~€1.175trn total assets) — this is <strong>NOT<\u002Fstrong> DZ BANK and is the single most common source of secondary-source error.<\u002Fli><\u002Fol>\n<p>A fourth, distinct perimeter is the <strong>bankenaufsichtlicher Konsolidierungskreis<\u002Fstrong> (CRR prudential scope — the \"DZ BANK Institutsgruppe\"), which <strong>excludes<\u002Fstrong> the insurance business. That is why R+V is supervised separately under Solvency II and is only captured together with the bank at <strong>financial-conglomerate<\u002Fstrong> level.<\u002Fp>\n<p><strong>Group headline figures (DZ BANK Group, IFRS, FY2025, CONFIRMED against the 2025 Annual Report):<\u002Fstrong> profit before taxes <strong>€4,282m<\u002Fstrong> (2024: €3,303m); income taxes €1,402m; net profit <strong>€2,880m<\u002Fstrong>; total assets ~<strong>€661bn<\u002Fstrong>; cost/income ratio 49.3%; net interest income €3,839m (−17.8%); net fee &amp; commission income €3,370m (+5.6%); net income from insurance business €2,024m (+76.5%); loss allowances −€653m (2024: −€845m); administrative expenses €4,804m. Long-term ratings: <strong>S&amp;P A+, Moody's Aa2, Fitch AA-/AA<\u002Fstrong>.<\u002Fp>\n<p><strong>Segment pre-tax earnings contribution (FY2025, €m):<\u002Fstrong> R+V <strong>2,144<\u002Fstrong>; UMH (Union Investment) <strong>1,185<\u002Fstrong>; DZ BANK Central Institution &amp; Corporate Bank (CICB) <strong>864<\u002Fstrong>; DZ HYP <strong>338<\u002Fstrong>; BSH <strong>122<\u002Fstrong>; DZ PRIVATBANK <strong>106<\u002Fstrong>; TeamBank <strong>−29<\u002Fstrong>; VR Smart Finanz <strong>−28<\u002Fstrong>; DZ BANK holding function <strong>−335<\u002Fstrong>; other/consolidation <strong>−85<\u002Fstrong>. <span class=\"ev\">ANALYTICAL INFERENCE:<\u002Fspan> the group's earnings are dominated by <em>insurance and asset management<\u002Fem>, not by the bank — R+V and UMH together contributed €3.3bn of the €4.28bn pre-tax result, i.e. ~78%. This is the single most important economic fact about the group and reframes DZ BANK as a bancassurance holding whose bank is only one of several profit engines.<\u002Fp>\n<p><strong>Full material-entity table:<\u002Fstrong><\u002Fp>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Entity<\u002Fsc-raw-th><sc-raw-th>Seat / Register<\u002Fsc-raw-th><sc-raw-th>DZ BANK ownership<\u002Fsc-raw-th><sc-raw-th>Regulator / regime<\u002Fsc-raw-th><sc-raw-th>Primary business<\u002Fsc-raw-th><sc-raw-th>Scale (latest)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>DZ BANK AG<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Frankfurt; AG Frankfurt HRB 45651<\u002Fsc-raw-td><sc-raw-td>Parent (94.8% cooperative-owned)<\u002Fsc-raw-td><sc-raw-td>ECB/SSM (Significant Institution) + BaFin/Bundesbank<\u002Fsc-raw-td><sc-raw-td>Central institution, corporate &amp; investment bank, group holding<\u002Fsc-raw-td><sc-raw-td>CICB total assets ~€387.5bn; CICB pre-tax €864m; ~5,981 employees (CICB avg)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>R+V Versicherung AG (+ R+V group)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Wiesbaden<\u002Fsc-raw-td><sc-raw-td>~96%<\u002Fsc-raw-td><sc-raw-td>BaFin, Solvency II; group supervision<\u002Fsc-raw-td><sc-raw-td>Insurance (life, health, P&amp;C, active reinsurance)<\u002Fsc-raw-td><sc-raw-td>Group premiums €20.9bn (2024, +5.4%); IFRS group pre-tax €1.275bn (2024); SCR ratio 168% (end-2024, ex-transitionals)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Union Asset Management Holding AG (Union Investment)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Frankfurt<\u002Fsc-raw-td><sc-raw-td>~93%<\u002Fsc-raw-td><sc-raw-td>BaFin, KAGB / UCITS / AIFMD<\u002Fsc-raw-td><sc-raw-td>Asset management (retail + institutional)<\u002Fsc-raw-td><sc-raw-td>AuM <strong>€534.7bn<\u002Fstrong> (year-end 2025); ~6m investors; ~4,400 staff<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Bausparkasse Schwäbisch Hall AG<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Schwäbisch Hall<\u002Fsc-raw-td><sc-raw-td>~96.8%<\u002Fsc-raw-td><sc-raw-td>BaFin, Bausparkassengesetz<\u002Fsc-raw-td><sc-raw-td>Bausparkasse, home finance<\u002Fsc-raw-td><sc-raw-td>Total assets €82.7bn (2024); CET1 25.4%; Bauspar market share ~35% (largest in Germany); ~7m contracts<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>DZ HYP AG<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Hamburg &amp; Münster; AG Hamburg HRB 5604<\u002Fsc-raw-td><sc-raw-td>~98%<\u002Fsc-raw-td><sc-raw-td>BaFin/ECB, Pfandbrief Act<\u002Fsc-raw-td><sc-raw-td>Commercial real estate &amp; public-sector finance<\u002Fsc-raw-td><sc-raw-td>Germany's largest Pfandbrief issuer; pre-tax €338m (2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>DZ PRIVATBANK S.A.<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Luxembourg (+ Zurich)<\u002Fsc-raw-td><sc-raw-td>~92%<\u002Fsc-raw-td><sc-raw-td>CSSF (Luxembourg); FINMA (Switzerland)<\u002Fsc-raw-td><sc-raw-td>Private banking, fund services, FX lending<\u002Fsc-raw-td><sc-raw-td>AuM €30.7bn; AuC €181.3bn; pre-tax €105.5m (2025); &gt;1,200 employees, 8 sites<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>TeamBank AG (easyCredit / der faire Credit)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Nuremberg<\u002Fsc-raw-td><sc-raw-td>~92%<\u002Fsc-raw-td><sc-raw-td>BaFin<\u002Fsc-raw-td><sc-raw-td>Consumer lending; embedded finance<\u002Fsc-raw-td><sc-raw-td>Total assets ~€10.2bn; DE market share 3.9% (2025); Austria 12.3%; pre-tax −€29m (2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>VR Smart Finanz AG<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Eschborn (ex-VR-Leasing)<\u002Fsc-raw-td><sc-raw-td>~100%<\u002Fsc-raw-td><sc-raw-td>BaFin (leasing/finance)<\u002Fsc-raw-td><sc-raw-td>SME leasing, hire-purchase, credit<\u002Fsc-raw-td><sc-raw-td>Pre-tax −€28m (2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>VR Payment GmbH<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Frankfurt<\u002Fsc-raw-td><sc-raw-td>via DZ BANK<\u002Fsc-raw-td><sc-raw-td>ZAG / BaFin (payment services)<\u002Fsc-raw-td><sc-raw-td>Acquiring, POS, merchant business (issuing-processing until 31 Dec 2026)<\u002Fsc-raw-td><sc-raw-td>~248 employees<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>DVB Bank SE<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Frankfurt<\u002Fsc-raw-td><sc-raw-td>Defunct 12 Aug 2022<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Former transport finance<\u002Fsc-raw-td><sc-raw-td>Wound down<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p><strong>Other material / historically significant entities:<\u002Fstrong> ReiseBank AG (cash/FX services), CardProcess (card processing), VR Equitypartner (private equity; booked disposal gains in 2025), VR Factoring GmbH, GENO Broker, DZ Service. Within Union Investment: Union Investment Real Estate GmbH, Union Investment Institutional, Union Investment Luxembourg S.A., Attrax S.A. (Luxembourg fund brokerage/custody) and Quoniam Asset Management. Within R+V: R+V Allgemeine, R+V Lebensversicherung, R+V Krankenversicherung, R+V Re, and the Italian subsidiary Assimoco.<\u002Fp>\n<p><strong>Why entities are separate (Structure / Control lens).<\u002Fstrong> Regulation is the primary driver: banking, insurance, funds and Bauspar activities must sit in separately-licensed legal entities under distinct supervisory regimes — a Bausparkasse may only conduct Bauspar business under the BSpKG; an insurer cannot hold a banking licence. <strong>Jurisdiction<\u002Fstrong> explains DZ PRIVATBANK (Luxembourg fund-services hub, Swiss private-banking booking centre) and R+V's Italian Assimoco. <strong>Historical merger path-dependence<\u002Fstrong> explains DZ HYP (two banks combined) and the persistence of multiple brands. <strong>Sector-mandate logic<\u002Fstrong> explains the deliberate \"one insurer, one asset manager, one Bausparkasse, one consumer lender\" architecture: the group runs single sector champions distributed through the primary banks rather than competing internal product factories. <strong>Risk ring-fencing<\u002Fstrong> is a secondary benefit — R+V's insurance risk and DZ HYP's CRE risk are legally contained.<\u002Fp>\n<p><strong>Simplified economically-important-entities tree.<\u002Fstrong> DZ BANK AG (holding + CICB) → R+V (insurance, ~50% of group profit) → Union Investment/UMH (asset management, ~28%) → DZ HYP (CRE/public finance) → BSH (Bauspar) → DZ PRIVATBANK (private banking) → TeamBank + VR Smart Finanz (consumer/SME credit, currently loss-making) → VR Payment (payments).<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-i-3\"><span class=\"hn mono\">I.3<\u002Fspan><span class=\"ht\">Ownership and Control<\u002Fspan><\u002Fh2>\n<p><strong>Economic ownership (31 Dec 2025, DZ BANK factsheet, CONFIRMED verbatim):<\u002Fstrong> cooperative banks (direct + indirect) <strong>94.8%<\u002Fstrong>; other cooperative enterprises <strong>4.8%<\u002Fstrong>; others <strong>0.5%<\u002Fstrong>. Shares are held directly by primary banks and indirectly through cooperative holding vehicles. <strong>Contrast with Atruvia (EREF Subject II):<\u002Fstrong> Atruvia's control sits in a single pooling vehicle holding 91.63%; DZ BANK's ownership is far more dispersed across the ~645 banks, so no single owner has control — coordination must run through the BVR and the AGM, which makes governance more political and consensus-driven.<\u002Fp>\n\n<figure class=\"fig\" id=\"fig-2\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 2<\u002Fspan><span class=\"fig-t\">Ownership Cascade<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start\">\n  <div class=\"casc\">\n    <div class=\"node\"><div class=\"node-t\">~645 primary cooperative banks<\u002Fdiv><div class=\"node-m\">Independent institutions, end-November 2025 · each a shareholder and a customer<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px;padding:0 0 0 22px\">\n      <span class=\"vl\" style=\"height:44px;margin:0\"><\u002Fspan>\n      <span class=\"mono acc\" style=\"font-size:17px\">94.8% — held directly and indirectly<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"node n-steel\"><div class=\"node-t\">DZ BANK AG<\u002Fdiv><div class=\"node-m\">HRB 45651 Amtsgericht Frankfurt am Main · BIC GENODEFF · BLZ 500 604 00<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px;padding:0 0 0 22px\">\n      <span class=\"vl\" style=\"height:44px;margin:0\"><\u002Fspan>\n      <span class=\"mono\" style=\"font-size:16px;color:var(--muted)\">consolidates<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"node\"><div class=\"node-t\">R+V · Union Investment · BSH · DZ HYP · DZ PRIVATBANK · TeamBank · VR Smart Finanz<\u002Fdiv><div class=\"node-m\">The manufacturing subsidiaries — sold through the same ~645 owners<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pnl\">\n    <div class=\"pnl-k\">Shareholders, 31 Dec 2025<\u002Fdiv>\n    <div class=\"split\"><div class=\"split-r\"><span>Cooperative banks<\u002Fspan><span class=\"mono\">94.8%<\u002Fspan><\u002Fdiv><span class=\"bar\"><span class=\"barf hi\" style=\"width:94.8%\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div class=\"split\"><div class=\"split-r\"><span>Other cooperative enterprises<\u002Fspan><span class=\"mono\">4.8%<\u002Fspan><\u002Fdiv><span class=\"bar\"><span class=\"barf\" style=\"width:4.8%\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div class=\"split\"><div class=\"split-r\"><span>Others<\u002Fspan><span class=\"mono\">0.5%<\u002Fspan><\u002Fdiv><span class=\"bar\"><span class=\"barf alt\" style=\"width:0.5%\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div class=\"pnl-tot\"><span>Owner = customer<\u002Fspan><span class=\"mono\">100%<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\"><b>DZ BANK holds ~0.35% of Atruvia, not 20%.<\u002Fb> The widely-repeated 20% figure refers to Verimi, the digital-identity venture — not to the sector's IT utility.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\">Control runs upward: the banks that distribute the group's products also elect the supervisory board that appoints its management.<\u002Ffigcaption><\u002Ffigure>\n\n\n<p><strong>Voting and control (Flow-of-authority lens).<\u002Fstrong> Control is exercised at the Hauptversammlung (AGM); the primary banks collectively elect the shareholder representatives on the Aufsichtsrat, which appoints and can remove the Vorstand and approves strategy. The <strong>BVR<\u002Fstrong> (Bundesverband der Deutschen Volksbanken und Raiffeisenbanken) and the regional Genossenschaftsverbände coordinate the sector's collective interest and audit the primary banks. Economic ownership and voting control are broadly aligned (unlike a listed company with free float): the owners are also the customers and distributors. Management can be removed only by the Aufsichtsrat, which is itself controlled by owner-banks — so ultimate control sits with the membership, not with Frankfurt.<\u002Fp>\n<p><strong>Conflicts (Control / Economics lens).<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li><strong>Large vs small member banks:<\u002Fstrong> big urban Volksbanken value capital-markets access and corporate-lending capacity; small rural Raiffeisenbanken prioritise cheap standardised services and the protection scheme. Board seats and voting weight mediate this.<\u002Fli><li><strong>North (ex-WGZ) vs south (ex-DG):<\u002Fstrong> the 2016 merger embedded a regional-constituency division, still reflected in board composition and in the 2019–2024 co-CEO split.<\u002Fli><li><strong>Owner vs competitor (the central tension):<\u002Fstrong> DZ BANK competes with its own owner-banks for corporate/Mittelstand clients. This is managed by the <strong>subsidiarity principle<\u002Fstrong> — DZ BANK is contractually mandated to <em>support<\u002Fem>, not undercut, the primary banks — and by structuring corporate business as <strong>joint/consortium credit (\"Metakredit\")<\u002Fstrong> where the primary bank retains the client relationship (FY2025 joint-credit volume ~€19.3bn). The friction is nonetheless real and surfaced publicly in 2024–2025, when the BVR openly questioned the apex institution's role in sector \"Schieflagen\" (e.g. BayWa) on the very day of DZ BANK's results conference.<\u002Fli><\u002Ful>\n<h2 class=\"hd hd2\" id=\"s-i-4\"><span class=\"hn mono\">I.4<\u002Fspan><span class=\"ht\">Governance Architecture (German two-tier model)<\u002Fspan><\u002Fh2>\n<p><strong>Vorstand (Management Board) — eight members; portfolios as of / effective 1 July 2026 (CONFIRMED, DZ BANK official board page):<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li><strong>Dr Cornelius Riese — Chief Executive Officer.<\u002Fstrong> Strategy &amp; Group Development (incl. sustainability) – Group; GenoBanks/Verbund; Communications &amp; Marketing; Group Audit; Legal. Chairs the supervisory boards of BSH, R+V, TeamBank and Union Investment. In the Vorstand since March 2013; co-CEO from January 2019; <strong>sole CEO since 1 July 2024<\u002Fstrong>. Background: Accenture strategy consulting, doctorate (\"Industrialisierung von Banken\"), DG HYP restructuring, then DZ BANK from 2009 (strategy/participations/finance).<\u002Fli><li><strong>Souâd Benkredda — Deputy CEO (from 1 July 2026).<\u002Fstrong> Capital markets (institutional and retail, trading); Group Treasury; Structured Finance; foreign branches/representative offices. On the board since 2022; prior career at Deutsche Bank and Standard Chartered.<\u002Fli><li><strong>Michael Speth — Deputy CEO (from 1 July 2026) / Chief Risk Officer.<\u002Fstrong> Credit; Group Risk Controlling; Group Risk Control &amp; Services.<\u002Fli><li><strong>Stefan Beismann.<\u002Fstrong> Corporate Banking; development/investment-promotion lending. (Succeeded Uwe Berghaus.)<\u002Fli><li><strong>Dr Christian Brauckmann.<\u002Fstrong> IT and Organisation (CIO).<\u002Fli><li><strong>Ulrike Brouzi.<\u002Fstrong> Group Finance (CFO); Bank Finance; Group Financial Services; Compliance; Client Lifecycle Management.<\u002Fli><li><strong>Dr Imke Jacob.<\u002Fstrong> Transaction Banking (Transaction Management, Operations &amp; Custody, Payments &amp; Accounts). Joined from McKinsey (New York partner). (Succeeded Thomas Ullrich.)<\u002Fli><li><strong>Johannes Koch.<\u002Fstrong> Group HR (Arbeitsdirektor) and Strategy for the Central Institution &amp; Corporate Bank; Research &amp; Economics. Chairs the supervisory boards of DZ HYP, DZ PRIVATBANK and VR Smart Finanz. Prior: KfW, Boston Consulting Group.<\u002Fli><\u002Fol>\n<p><strong>The co-CEO history.<\u002Fstrong> From January 2019 DZ BANK ran a Doppelspitze: <strong>Uwe Fröhlich<\u002Fstrong> (former BVR President and Berliner Volksbank board member, responsible for the Verbund- und Geschäftsbank) and <strong>Cornelius Riese<\u002Fstrong> (holding activities). This bound the ex-WGZ/BVR political constituency into management after the 2016 merger. Fröhlich retired on 30 June 2024; Riese became sole CEO on 1 July 2024. The June-2026 appointment of <em>two<\u002Fem> deputy CEOs (Benkredda and Speth) rebalances a now single-headed board without reopening the political Doppelspitze.<\u002Fp>\n<p><strong>Aufsichtsrat (Supervisory Board).<\u002Fstrong> Chaired by <strong>Henning Deneke-Jöhrens<\u002Fstrong> (board chairman of Volksbank Hildesheim-Lehrte-Pattensen; a northern-German representative; elected chair 30 May 2018, succeeding Helmut Gottschalk who reached the statutory age limit). The board is dominated by serving cooperative-bank management-board chairs (e.g. Timm Häberle, VR-Bank Ludwigsburg; Dr Peter Hanker, Volksbank Mittelhessen; Josef Hodrus, Volksbank Allgäu-Oberschwaben; Sascha Monschauer, VR Bank RheinAhrEifel; Elke Müller-Jordan, Heidenheimer Volksbank), plus <strong>BVR President Marija Kolak<\u002Fstrong>, alongside employee representatives (from DZ BANK, BSH and R+V, and a ver.di official). <strong>Co-determination regime:<\u002Fstrong> given group headcount far above 2,000, DZ BANK falls under the <strong>Mitbestimmungsgesetz 1976<\u002Fstrong> (quasi-parity codetermination), so roughly half the seats are employee representatives, with the chair (a shareholder representative) holding a casting vote.<\u002Fp>\n<p><strong>Decision-rights map (Control lens).<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li><em>Capital allocation / risk appetite:<\u002Fem> Vorstand proposes, Aufsichtsrat approves the risk-appetite framework; CRO (Speth) and CFO (Brouzi) operationalise.<\u002Fli><li><em>Major investment / acquisitions:<\u002Fem> Vorstand decides within thresholds; above thresholds Aufsichtsrat approval required (it can block).<\u002Fli><li><em>Dividends to member banks:<\u002Fem> proposed by Vorstand, approved by AGM (dividend €448m / 25 cents per share for 2023–2025).<\u002Fli><li><em>Executive appointment/removal:<\u002Fem> sole prerogative of the Aufsichtsrat.<\u002Fli><li><em>Blocking power:<\u002Fem> the Aufsichtsrat (owner-banks + employees) can block strategy, acquisitions and appointments.<\u002Fli><\u002Ful>\n<p><strong>Governance paradox (Risk lens).<\u002Fstrong> The supervisory board is populated by the bank's own customers and owners. This maximises network alignment but weakens independent challenge and can import the owner-vs-competitor conflict directly into the boardroom — a structural governance weakness that no amount of committee formalism fully cures.<\u002Fp>\n<p><strong>Compensation.<\u002Fstrong> Disclosed under the <strong>InstitutsVergV<\u002Fstrong> and CRD remuneration rules in the remuneration report; aggregate Vorstand compensation is published, but individualised variable-pay mechanics and full deferral/malus structures are only partially transparent. <span class=\"ev\">UNKNOWN:<\u002Fspan> exact individual FY2025 Vorstand pay figures were not retrieved.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-i-5\"><span class=\"hn mono\">I.5<\u002Fspan><span class=\"ht\">Legal Architecture (Follow-the-Legal-Entity lens)<\u002Fspan><\u002Fh2>\n<p><strong>Verbund relationship.<\u002Fstrong> The legal relationship between DZ BANK and the primary banks rests on the cooperative principles of <strong>subsidiarity, decentralisation and regional market responsibility<\u002Fstrong>, reinforced by <strong>Verbundtreue<\u002Fstrong> (network loyalty). DZ BANK's mandate (\"Förderauftrag\") is to strengthen the primary banks' competitiveness, not to compete with them for retail customers. There is no single controlling-shareholder agreement in the ordinary corporate sense; coordination is via the AGM, the Aufsichtsrat and BVR governance.<\u002Fp>\n
