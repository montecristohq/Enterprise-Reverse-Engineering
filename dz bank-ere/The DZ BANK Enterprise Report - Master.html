 requirements exceed ordinary enterprise IT:<\u002Fstrong> A clearing failure at DZ BANK would halt payments for a large share of German retail banking (target ~one-third of German traffic). This is systemic infrastructure, not a single bank's back office.<\u002Fp>\n<p><strong>Availability/SLOs:<\u002Fstrong> DZ BANK does not publish formal SLOs. The design intent is 24/7/365 for instant payments (IPR mandate: settle within 10 seconds). TeamBank describes easyCredit-Ratenkauf as a \"hochverfügbares System.\" Beyond this, published SLOs are <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fp>\n<p><strong>Batch/settlement window as constraint (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> Bulk SEPA still runs on batch cycles into the Bundesbank EMZ/SEPA-Clearer with defined cut-offs; instant payments run real-time on TIPS/RT1. The coexistence of batch (legacy mainframe \"booking machine\") and real-time rails is the core reliability-engineering constraint. Year-end/long-weekend \"frozen zones\" (no changes during accounting close) are standard sector practice.<\u002Fp>\n<p><strong>Duplicate-payment prevention:<\u002Fstrong> A named risk during instant/real-time processing; consumer guidance during the July 2026 Atruvia outage explicitly warned users not to re-submit transfers to avoid duplicates — illustrating the failure mode.<\u002Fp>\n<p><strong>The Atruvia incident record (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>) — the relevant contrast:<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li><strong>November 2023:<\u002Fstrong> A central Atruvia software fault caused online-banking/app disruption; per Handelsblatt, <em>\"Potenziell seien bis zu 520 Geldhäuser betroffen … Insgesamt gibt es gut 700 Genossenschaftsbanken, für die Atruvia IT-Dienstleistungen erbringt\"<\u002Fem> — Volks- und Raiffeisenbanken in southern Germany, with customers unable to make transfers and account information returning error codes.<\u002Fli><li><strong>21 July 2026:<\u002Fstrong> Another central-systems fault; per Netzwelt (updated 21 July 2026, 15:28), app and online banking were temporarily shut down to relieve systems and <em>\"waren zwischen 9:47 Uhr und 10:38 Uhr auch die Websites der betroffenen Banken nicht erreichbar\"<\u002Fem>, with roughly 490 banks affected and the root cause in Atruvia's central systems.<\u002Fli><\u002Ful>\n<p><strong>Assessment — does DZ BANK's ZV ON€ carry comparable concentration risk? (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> <em>Different layer, similar systemic shape.<\u002Fem> Atruvia's outages hit the <strong>channel/core<\u002Fstrong> layer (customers can't see or initiate), but payments already submitted still clear. A ZV ON€ failure would hit the <strong>clearing/settlement<\u002Fstrong> layer — potentially more systemic, because it would stop settlement across banks, not just one bank's channel. The two are complementary single-points-of-failure in the cooperative sector: Atruvia = channel/core concentration; DZ BANK ZV ON€ = clearing concentration. Both are consequences of the sector's centralise-for-scale logic. DZ BANK's clean migration record is reassuring, but the tail risk is larger than Atruvia's channel outages.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-13\"><span class=\"hn mono\">III.13<\u002Fspan><span class=\"ht\">Employee Architecture<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Entity<\u002Fsc-raw-th><sc-raw-th>Headcount<\u002Fsc-raw-th><sc-raw-th>Location(s)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>DZ BANK AG / CICB<\u002Fsc-raw-td><sc-raw-td>~5,981 avg (CICB segment)<\u002Fsc-raw-td><sc-raw-td>Frankfurt HQ + 12 domestic branches; NY, HK, Singapore, London, etc.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>R+V<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>more than 18,400<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Wiesbaden (HQ) + Außendienst nationwide<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Union Investment<\u002Fsc-raw-td><sc-raw-td>~4,400<\u002Fsc-raw-td><sc-raw-td>Frankfurt; Luxembourg; Quoniam (Frankfurt)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>BSH<\u002Fsc-raw-td><sc-raw-td>~6,700 (of which ~3,200–3,300 field, ~3,300 office)<\u002Fsc-raw-td><sc-raw-td>Schwäbisch Hall<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DZ HYP<\u002Fsc-raw-td><sc-raw-td>(mid-size; not separately headlined)<\u002Fsc-raw-td><sc-raw-td>Hamburg + Münster (dual HQ)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DZ PRIVATBANK<\u002Fsc-raw-td><sc-raw-td>more than 1,200 across 8 sites<\u002Fsc-raw-td><sc-raw-td>Luxembourg, Zurich, Stuttgart + German locations<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>TeamBank<\u002Fsc-raw-td><sc-raw-td>(mid-size)<\u002Fsc-raw-td><sc-raw-td>Nuremberg; Vienna (Austria)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>VR Smart Finanz<\u002Fsc-raw-td><sc-raw-td>(small)<\u002Fsc-raw-td><sc-raw-td>Eschborn<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>VR Payment<\u002Fsc-raw-td><sc-raw-td>~248<\u002Fsc-raw-td><sc-raw-td>Ilvesheim/Frankfurt<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Group total (2024, company/Wikipedia)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>~33,837<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p>(<span class=\"ev\">CONFIRMED FACT<\u002Fspan> where sourced; note the order-of-magnitude point: R+V alone is more than half the group headcount, so \"group employees\" (~34k) and \"DZ BANK AG employees\" (~6k) must never be conflated.)<\u002Fp>\n<p><strong>Skills position (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> DZ BANK runs dual-study IT pipelines (Fachinformatik, Wirtschaftsinformatik, Softwaretechnologie) and markets SAP/S4HANA, cloud, Murex and agile skills. R+V and Union Investment compete for actuarial and quant/IT talent respectively. IT and actuarial talent are the constrained skills (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> from job-ad volume and the R+V/UMH efficiency programmes).<\u002Fp>\n<p><strong>Co-determination (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> As large German AGs, DZ BANK AG, R+V and the major subsidiaries operate under the Mitbestimmungsgesetz 1976 (parity supervisory boards) with active works councils; Johannes Koch is Arbeitsdirektor at DZ BANK (established Vol I). The Verdi warning-strike at equensWorldline illustrates the sector's active labour relations.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-14\"><span class=\"hn mono\">III.14<\u002Fspan><span class=\"ht\">Organisational Design and Decision Rights<\u002Fspan><\u002Fh2>\n<p><strong>Holding relationship &amp; board interlock (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>, Vol I):<\u002Fstrong> DZ BANK Vorstand members chair the subsidiary supervisory boards — <strong>Riese chairs BSH, R+V, TeamBank, Union Investment; Koch chairs DZ HYP, DZ PRIVATBANK, VR Smart Finanz<\u002Fstrong>. This is the primary mechanism of group control over legally autonomous, separately regulated subsidiaries.<\u002Fp>\n<p><strong>The four strategic business fields vs legal entities:<\u002Fstrong> The four fields — Privatkundengeschäft, Firmenkundengeschäft, Kapitalmarktgeschäft, Transaction Banking — are <em>market-facing constructs<\u002Fem> that cut across legal entities. Transaction Banking (Dr Imke Jacob) maps mostly to DZ BANK AG + VR Payment; Privatkundengeschäft spans BSH, Union Investment retail, TeamBank, R+V retail and DZ PRIVATBANK; Kapitalmarktgeschäft is DZ BANK AG. The matrix (business field × legal entity × supervisory regime) is the group's core organisational complexity.<\u002Fp>\n<p><strong>Where real operational power sits (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> Formal power sits with each subsidiary's own board (each is separately licensed and its board bears regulatory responsibility). <em>Actual<\u002Fem> influence sits with the DZ BANK Vorstand via (a) supervisory-board chairs, (b) the group risk-capital allocation (each Steuerungseinheit operates within DZ BANK-allocated risk capital), and (c) group treasury's control of sector liquidity. So subsidiaries are operationally autonomous but capital- and liquidity-dependent on the centre — a classic \"loose-tight\" federation.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-15\"><span class=\"hn mono\">III.15<\u002Fspan><span class=\"ht\">Operating Leverage and Cost Architecture<\u002Fspan><\u002Fh2>\n<p>Administrative expenses €4,804m in FY2025; cost/income 49.3% (established).<\u002Fp>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Process<\u002Fsc-raw-th><sc-raw-th>Leverage class<\u002Fsc-raw-th><sc-raw-th>Rationale<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Payments processing (ZV ON€)<\u002Fsc-raw-td><sc-raw-td><strong>Nearly automatic / strongly sublinear<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>7.5bn→11bn transactions on one platform; marginal cost ≈ €0.0025/transaction; adding volume barely adds cost<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Securities settlement/custody<\u002Fsc-raw-td><sc-raw-td><strong>Sublinear<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>€332bn→€380bn AuC with scale platform; headcount grows far slower than assets<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card acquiring/processing<\u002Fsc-raw-td><sc-raw-td><strong>Sublinear<\u002Fstrong> (→ step-fixed at 2027 migration)<\u002Fsc-raw-td><sc-raw-td>Scale platform; the Atruvia migration is a step-fixed reset<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Fund administration (Attrax/UI Lux)<\u002Fsc-raw-td><sc-raw-td><strong>Sublinear<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>NAV production scales with automation, not fund count linearly<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Insurance claims<\u002Fsc-raw-td><sc-raw-td><strong>Linear → sublinear<\u002Fstrong> (as automation rises)<\u002Fsc-raw-td><sc-raw-td>Claims volume tracks policies; AI/3D-scan pushing toward sublinear<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Insurance underwriting (life/health)<\u002Fsc-raw-td><sc-raw-td><strong>Linear/step-fixed<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Actuarial + advisory headcount-bound<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Credit processing (DZ HYP VR-BaufiComfort)<\u002Fsc-raw-td><sc-raw-td><strong>Sublinear<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>VR-BaufiConnect automates; 24-hour decisions; volume-sensitive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Regulatory reporting (conglomerate)<\u002Fsc-raw-td><sc-raw-td><strong>Disproportionate / step-fixed<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Each new regime/rule adds fixed cost regardless of volume — the \"conglomerate tax\"<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>IT development<\u002Fsc-raw-td><sc-raw-td><strong>Step-fixed<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Platform builds (ZV ON€: 100k+ person-days) are lumpy<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Distribution support (primary banks)<\u002Fsc-raw-td><sc-raw-td><strong>Sublinear<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Shared Verbund tooling amortised across ~640–700 banks<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p><strong>Where duplication/diseconomy lives (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> The multi-entity/multi-regime structure forces <strong>parallel control functions<\u002Fstrong> — each regulated entity needs its own risk, compliance, actuarial/finance, audit and DORA/ICT functions, on top of the group functions. The regulatory-reporting factory (triple accounting basis + six regimes) is the clearest <em>disproportionate<\u002Fem> cost: it grows with regulatory complexity, not with revenue. A monoline of the same size would carry one regime and one reporting stack. <strong>Quantification is not publicly disclosed<\u002Fstrong>, but the structural logic is unambiguous: the conglomerate pays a control/reporting premium in exchange for diversification.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-16\"><span class=\"hn mono\">III.16<\u002Fspan><span class=\"ht\">Operations and Technology as Competitive Advantage<\u002Fspan><\u002Fh2>\n<p>Scoring each on: Proprietary / Hard-to-reproduce / Cost-reducing / Quality-improving / Regulatory-control-improving / Compounds-with-volume.<\u002Fp>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Operational asset<\u002Fsc-raw-th><sc-raw-th>Prop.<\u002Fsc-raw-th><sc-raw-th>Hard<\u002Fsc-raw-th><sc-raw-th>Cost↓<\u002Fsc-raw-th><sc-raw-th>Qual↑<\u002Fsc-raw-th><sc-raw-th>Reg↑<\u002Fsc-raw-th><sc-raw-th>Compounds<\u002Fsc-raw-th><sc-raw-th>Verdict<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>ZV ON€ payments/clearing platform<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔✔<\u002Fsc-raw-td><sc-raw-td>✔✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔✔<\u002Fsc-raw-td><sc-raw-td><strong>Genuine moat<\u002Fstrong> — proprietary, sector-critical, volume-compounding, now being commercialised<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Securities/custody scale (3rd-largest DE)<\u002Fsc-raw-td><sc-raw-td>~<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>Strong scale asset; not unique<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Insurance underwriting/claims (R+V)<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>~<\u002Fsc-raw-td><sc-raw-td>Strong but discipline-specific; reproducible by any large insurer<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Fund-administration scale (UI/Attrax)<\u002Fsc-raw-td><sc-raw-td>~<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>Scale asset; SimCorp is bought, not proprietary<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Regulatory-reporting machine<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔✔<\u002Fsc-raw-td><sc-raw-td>✗<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔✔<\u002Fsc-raw-td><sc-raw-td>✗<\u002Fsc-raw-td><sc-raw-td>Hard to reproduce but a <em>cost<\u002Fem>, not a revenue moat — a licence to operate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Cooperative distribution interface<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>✔✔<\u002Fsc-raw-td><sc-raw-td>✔✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td>~<\u002Fsc-raw-td><sc-raw-td>✔<\u002Fsc-raw-td><sc-raw-td><strong>Structural moat<\u002Fstrong> — ~640–700 banks, ~30m customers, near-captive; but channel controlled by Atruvia<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p><strong>Comparison with the Sparkassen equivalent (<span class=\"ev\">CONFIRMED FACT<\u002Fspan> / <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> The two three-tier sectors are near-mirrors: BVR↔DSGV; DZ BANK↔Landesbanken; Atruvia↔<strong>Finanz Informatik (FI)<\u002Fstrong>; Union Investment↔<strong>DekaBank<\u002Fstrong>. Differences that sharpen the analysis:<\u002Fp>\n<ul class=\"lst\"><li><strong>IT utility:<\u002Fstrong> FI (Sparkassen) runs on OSPlus; Atruvia on agree21/bank21 — both single-core utilities serving hundreds of institutions. Comparable concentration.<\u002Fli><li><strong>Payments/cards:<\u002Fstrong> The Sparkassen have the Deutscher Sparkassenverlag/S-Payment and, from 2024, merged Bayern Card Services + PLuscard into <strong>\"Qards\"<\u002Fstrong> — a card-processing heavyweight. The cooperative side has <em>no direct equivalent<\u002Fem> to the DSV; the 2027 Atruvia card consolidation is partly a catch-up to Qards.<\u002Fli><li><strong>Central institution:<\u002Fstrong> The Sparkassen have <em>multiple<\u002Fem> Landesbanken (fragmented); the cooperatives have <em>one<\u002Fem> DZ BANK (consolidated since the 2016 WGZ merger) — a structural efficiency advantage for the cooperatives at the central-institution layer.<\u002Fli><li><strong>Asset management:<\u002Fstrong> Union Investment (€534.7bn) vs DekaBank — comparable scale; both sector-captive distribution.<\u002Fli><\u002Ful>\n<p><strong>The DZ BANK payments platform: genuine competitive asset or merely necessary infrastructure? (ANALYTICAL CONCLUSION):<\u002Fstrong> <em>Both, but tipping toward asset.<\u002Fem> It is necessary infrastructure (someone must clear the sector's payments). But the deliberate insourcing decision, the plan to sell processing to banks outside the sector, the on-time IPR compliance when only ~13% of European banks had a strong instant-payments technology foundation, and the ~€3bn of the primary banks' ~€6.5bn commission income that payments now generates, together make it a genuine, hard-to-reproduce, volume-compounding asset — provided DZ BANK can actually win external clients (unproven; <span class=\"ev\">COMPANY CLAIM<\u002Fspan>/aspiration, not yet demonstrated at scale).<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-17\"><span class=\"hn mono\">III.17<\u002Fspan><span class=\"ht\">Volume III Reconstruction<\u002Fspan><\u002Fh2>\n<p><strong>(1) Federated Operating-Model Diagram<\u002Fstrong> — see <a class=\"xr\" href=\"#s-iii-1\">III.1<\u002Fa>.<\u002Fp>\n<p><strong>(2) Payments &amp; Clearing Architecture:<\u002Fstrong><\u002Fp>\n<pre class=\"pre\">Primary banks (agree21/Atruvia) ──files──▶ DZ BANK ZV ON€ platform ──▶ rails:\n   • Bundesbank SEPA-Clearer/EMZ (bulk SCT/SDD)\n   • EBA CLEARING STEP2 (bulk) / RT1 (instant)\n   • TIPS (instant settlement, central-bank money)\n   • T2/TARGET2 (high-value/settlement)\n   • Visa/Mastercard (cards; issuing-processing → Atruvia 2027)\n   • SWIFT (cross-border)\nCustody: DZ BANK depositary ──▶ Clearstream/T2S<\u002Fpre>\n<p><strong>(3) Treasury/Liquidity Map:<\u002Fstrong> Primary banks' surplus deposits ▶ DZ BANK Konzern-Treasury (Liquiditätsausgleich) ▶ money/capital markets + Eurosystem; DZ HYP Pfandbrief funding; own issuance to institutionals. Collateral on Murex MX.3 (~1,400 calls/day, &gt;5,400 agreements).<\u002Fp>\n<p><strong>(4) Technology Architecture by entity<\u002Fstrong> — see <a class=\"xr\" href=\"#s-iii-4\">III.4<\u002Fa> table.<\u002Fp>\n<p><strong>(5) Build/Buy/Outsource + Atruvia boundary<\u002Fstrong> — see <a class=\"xr\" href=\"#s-iii-5\">III.5<\u002Fa> table.<\u002Fp>\n<p><strong>(6) Insurance Ops Map<\u002Fstrong> — R+V: &gt;13,000 bank branches + Außendienst ▶ underwriting ▶ claims (AI/3D-scan) ▶ investment ops + R+V Re reinsurance ▶ Solvency II/SFCR/ORSA.<\u002Fp>\n<p><strong>(7) Asset-Mgmt Ops Map<\u002Fstrong> — SimCorp front-to-back ▶ UI Lux/Attrax fund admin/NAV/TA ▶ DZ BANK depositary ▶ SFDR ESG data pipelines.<\u002Fp>\n<p><strong>(8) Credit/Real-Estate Ops Map<\u002Fstrong> — DZ HYP VR-BaufiConnect (advice at primary bank, processing at DZ HYP); BSH SAP S/4HANA + Baufinex; TeamBank easyCredit APIs.<\u002Fp>\n<p><strong>(9) Risk/Finance/Reg-Reporting Architecture<\u002Fstrong> — FKAG conglomerate coverage (Reg 342/2014 + Art 49(1) CRR); triple consolidation (IFRS/HGB/Solvency II); six-regime reporting factory.<\u002Fp>\n<p><strong>(10) Data Governance Model<\u002Fstrong> — fragmented controllership; primary banks own customer; Truuco JV signal-sharing; no group flywheel.<\u002Fp>\n<p><strong>(11) Security/Resilience Map<\u002Fstrong> — DORA across regimes; CTPs led by Atruvia, SAP, Murex, IBM, ERI, hyperscalers, Bundesbank/EBA CLEARING/Clearstream.<\u002Fp>\n<p><strong>(12) Incident Record:<\u002Fstrong><\u002Fp>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Date<\u002Fsc-raw-th><sc-raw-th>System<\u002Fsc-raw-th><sc-raw-th>Scope<\u002Fsc-raw-th><sc-raw-th>Cause<\u002Fsc-raw-th><sc-raw-th>Lesson<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Nov 2023<\u002Fsc-raw-td><sc-raw-td>Atruvia core/channel<\u002Fsc-raw-td><sc-raw-td>up to 520 of ~700 banks<\u002Fsc-raw-td><sc-raw-td>central software fault<\u002Fsc-raw-td><sc-raw-td>channel concentration<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>21 Jul 2026<\u002Fsc-raw-td><sc-raw-td>Atruvia core/channel<\u002Fsc-raw-td><sc-raw-td>~490 banks (09:47–10:38)<\u002Fsc-raw-td><sc-raw-td>central-systems fault<\u002Fsc-raw-td><sc-raw-td>channel concentration; duplicate-payment risk<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>End-2024<\u002Fsc-raw-td><sc-raw-td>DZ BANK ZV ON€ migration<\u002Fsc-raw-td><sc-raw-td>&gt;600 banks migrated<\u002Fsc-raw-td><sc-raw-td>(planned)<\u002Fsc-raw-td><sc-raw-td>clean cutover, no material outage<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>(ongoing)<\u002Fsc-raw-td><sc-raw-td>equensWorldline<\u002Fsc-raw-td><sc-raw-td>Verdi warning strikes<\u002Fsc-raw-td><sc-raw-td>labour<\u002Fsc-raw-td><sc-raw-td>legacy vendor instability<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p><strong>(13) Employee &amp; Entity Map<\u002Fstrong> — see <a class=\"xr\" href=\"#s-iii-13\">III.13<\u002Fa>.<\u002Fp>\n<p><strong>(14) Decision-Rights Map<\u002Fstrong> — supervisory-board interlock + risk-capital allocation + treasury control = loose-tight federation.<\u002Fp>\n<p><strong>(15) Operating-Leverage Matrix<\u002Fstrong> — see <a class=\"xr\" href=\"#s-iii-15\">III.15<\u002Fa>.<\u002Fp>\n<p><strong>(16) Operations Moat Assessment<\u002Fstrong> — see <a class=\"xr\" href=\"#s-iii-16\">III.16<\u002Fa>.<\u002Fp>\n<p><strong>(17) Key Unknowns:<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li>DZ PRIVATBANK's specific fund-admin/NAV/transfer-agency software product (<span class=\"ev\">UNKNOWN<\u002Fspan> — not published; only OLYMPIC/OLYNEXT core confirmed).<\u002Fli><li>DZ BANK's formal availability SLOs and DR/RTO/RPO targets (<span class=\"ev\">UNKNOWN<\u002Fspan>).<\u002Fli><li>The precise SCT/SDD/instant/card/high-value split of the 11.0bn (<span class=\"ev\">UNKNOWN<\u002Fspan> — only card sub-count published).<\u002Fli><li>Whether Cofinpro (vs the confirmed Capco) had a role in ZV ON€ (<span class=\"ev\">UNKNOWN<\u002Fspan>).<\u002Fli><li>The two named hyperscalers DZ BANK uses (<span class=\"ev\">UNKNOWN<\u002Fspan> — described only as \"two of the big hyperscalers\").<\u002Fli><li>Quantified cost of the conglomerate/multi-regime duplication (<span class=\"ev\">UNKNOWN<\u002Fspan> — not disclosed).<\u002Fli><li>VR Smart Finanz technology stack (thin/<span class=\"ev\">UNKNOWN<\u002Fspan>).<\u002Fli><\u002Ful>\n<p><strong>(18) Ten Most Important Conclusions:<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li>Two systems truly span the group — ZV ON€ payments and the FKAG risk/finance spine; everything else is entity-local.<\u002Fli><li>DZ BANK AG runs its <em>own<\u002Fem> SAP S/4HANA core + Murex + ZV ON€ — it is NOT an Atruvia customer for its own systems; Atruvia serves the primary banks.<\u002Fli><li>Payments is the most systemically critical operation and a genuine, hard-to-reproduce, volume-compounding asset — the group bet against the outsourcing trend and won on resilience (on-time IPR while only ~13% of European banks had a strong instant-payments tech base).<\u002Fli><li>The group is becoming <em>more<\u002Fem> dependent on Atruvia (channels + core + cards from 2027), an entity it owns ~0.35% of — the biggest third-party-dependency question.<\u002Fli><li>The conglomerate must consolidate under three accounting bases (IFRS/HGB/Solvency II) and report to six regimes — a disproportionate, volume-insensitive \"conglomerate tax.\"<\u002Fli><li>R+V is the largest earnings contributor and a wholly different operational discipline (incl. a real reinsurance operation); its 2025 board restructuring signals efficiency pressure.<\u002Fli><li>The cooperative model structurally prevents a single group data flywheel — the primary banks own the customer; Truuco is a federated work-around.<\u002Fli><li>Operating leverage is excellent in payments/custody/fund-admin (sublinear) but poor in regulatory reporting (disproportionate) and headcount-bound in insurance underwriting.<\u002Fli><li>The Sparkassen mirror (FI/Deka/Qards) shows the cooperatives are ahead at the <em>central-institution<\u002Fem> layer (one DZ BANK vs many Landesbanken) but were behind in <em>card processing<\u002Fem> until the 2027 Atruvia consolidation.<\u002Fli><li>A federated group under six regimes <strong>cannot<\u002Fstrong> match a single integrated institution's operational efficiency — the structure costs a permanent control/reporting premium and forgoes a unified data asset; it buys diversification, a near-captive channel, and per-platform scale in exchange.<\u002Fli><\u002Fol>\n<p><strong>Answers to the closing questions:<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li><strong>Most critical subsystem to the group and to German banking:<\u002Fstrong> the ZV ON€ payments/clearing platform (systemic for a large share of German payments) — with the FKAG risk spine most critical to the <em>group's<\u002Fem> licence to operate.<\u002Fli><li><strong>Hardest to replicate:<\u002Fstrong> the cooperative distribution interface + the ZV ON€ clearing role (both structural, decades in the making).<\u002Fli><li><strong>Scales best:<\u002Fstrong> payments, custody and fund administration (sublinear/near-automatic). <strong>Requires headcount to keep growing:<\u002Fstrong> insurance underwriting/claims and regulatory reporting.<\u002Fli><li><strong>Most dependent on third parties/institutions:<\u002Fstrong> Atruvia (channels/core/cards), then SAP, Murex, ERI, IBM, SimCorp and the market infrastructures (Bundesbank, EBA CLEARING, Clearstream).<\u002Fli><li><strong>Does federation create advantage or duplication:<\u002Fstrong> both — advantage via diversification, per-platform scale and near-captive distribution; duplication via parallel control/reporting functions across six regimes.<\u002Fli><li><strong>Payments platform — asset or infrastructure:<\u002Fstrong> necessary infrastructure that has been engineered into a genuine competitive asset, contingent on winning external clients.<\u002Fli><li><strong>Central question — can a federated group under six regimes match a single integrated institution's efficiency:<\u002Fstrong> <strong>No.<\u002Fstrong> It carries a permanent structural premium (triple accounting basis, six-regime reporting factory, duplicated control functions, no unified data asset). What that structure <em>costs<\u002Fem> is a control/reporting/coordination overhead that a monoline avoids; what it <em>buys<\u002Fem> is earnings diversification (R+V's €2.1bn cushioning bank-cycle troughs), a near-captive ~30m-customer channel, and scale platforms (payments, custody, funds) each run at sector scale. The 49.3% cost/income ratio shows the trade is being managed well — but the conglomerate tax is real and permanent.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-recommendations\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Recommendations<\u002Fspan><\u002Fh2>\n<p><strong>For an analyst/counterparty assessing the group:<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li><strong>Treat ZV ON€ concentration as the top operational-risk item.<\u002Fstrong> Benchmark: any published ZV ON€ outage affecting settlement (not just channel) would be a materially worse signal than an Atruvia channel outage. Watch for DZ BANK disclosing formal availability SLOs or a DR site — continued absence is a (mild) red flag.<\u002Fli><li><strong>Track the 1 January 2027 Atruvia card-processing cutover as a discrete event risk.<\u002Fstrong> Benchmark: a clean cutover (as with ZV ON€ in 2024) confirms the sector's migration competence; any disruption to credit-card processing would be systemic given Atruvia processes \"a significant portion of all German credit-card transactions.\" Re-rate operational risk if the cutover slips or fails.<\u002Fli><li><strong>Model the conglomerate-reporting cost as a permanent fixed overhead<\u002Fstrong>, not a variable cost — it will rise with each new regime (DORA, CRR III phase-ins, Solvency II review) regardless of revenue. Benchmark: cost/income drifting above ~52–53% without a revenue explanation would suggest the regulatory/control base is outpacing operating leverage.<\u002Fli><li><strong>Monitor whether DZ BANK wins external (non-cooperative) payments clients.<\u002Fstrong> This is the swing factor that converts ZV ON€ from \"necessary cost\" to \"growth asset.\" Benchmark: named external bank clients on ZV ON€ would validate the \"payment provider for banks outside the sector\" thesis (currently aspiration).<\u002Fli><\u002Fol>\n<p><strong>For the group itself (implied by the analysis):<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li>Reduce Atruvia single-point-of-failure exposure at the channel layer (the 2023/2026 outages are a pattern, not one-offs) — but this is largely outside DZ BANK's control given ~0.35% ownership; the lever is governance influence and the Truuco data layer.<\u002Fli><li>Publish more operational transparency (SLOs, DR posture, the payments split) — the current opacity forces analysts to infer, which understates a genuinely strong payments operation.<\u002Fli><\u002Fol>\n<p><strong>Thresholds that would change these recommendations:<\u002Fstrong> a ZV ON€ settlement-layer outage; a failed/delayed 2027 card cutover; cost/income breaching ~53%; or, positively, the signing of named external ZV ON€ clients or the publication of formal resilience SLOs.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-caveats\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Caveats<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Evidence asymmetry:<\u002Fstrong> As warned, DZ BANK publishes far less about internals than a fintech would. The richest technology evidence came from job advertisements (DZ BANK IT careers: EAI, Automic, Apptio, SAP S/4HANA, hyperscalers; DZ PRIVATBANK: OLYMPIC/OLYNEXT on IBM i), vendor case studies (Murex MX.3; SimCorp/Quoniam; Wavestone/paricon for BSH SAP; Capco for ZV ON€) and specialist press. These are reliable but not audited disclosures.<\u002Fli><li><strong>The payments split (SCT/SDD/instant/card/high-value) is inferred, not published<\u002Fstrong> — only the card sub-count is disclosed.<\u002Fli><li><strong>\"ZV ON€\" is confirmed as an in-house build; no underlying commercial payments engine is named<\u002Fstrong> — do not attribute a specific vendor product to it. Capco is confirmed as integration partner (scope April 2019–end-2024, 97 go-live events, &gt;600 banks migrated); Cofinpro's involvement is unconfirmed.<\u002Fli><li><strong>DZ PRIVATBANK's fund-administration/NAV/transfer-agency software product is <span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong> — only the OLYMPIC/OLYNEXT core-banking system (ERI Bancaire, on IBM Power/i) is confirmed, from the bank's own IT recruitment postings.<\u002Fli><li><strong>The Signa write-off characterisation was mis-attributed in the carried-forward context.<\u002Fstrong> R+V CEO Rollinger's own 3 April 2024 statement was that the Signa engagement was fully processed in the 2023 accounts; the phrase \"robuster dreistelliger Millionenbetrag\" traces to DZ BANK Co-CEO Cornelius Riese, not Rollinger. Both confirm a full write-off in FY2023.<\u002Fli><li><strong>Headcount figures mix reporting bases<\u002Fstrong> (segment averages vs entity totals vs group). The ~33,837 group figure (2024) and R+V's more-than-18,400 are from company/Wikipedia sources; treat the group total as approximate and never conflate perimeters (DZ BANK AG ~6k vs group ~34k).<\u002Fli><li><strong>Forward-looking items<\u002Fstrong> (2027 card migration, external ZV ON€ client ambitions, \"NextLevel\"/\"Fit for Future\" savings targets) are plans/claims, not accomplished facts, and are labelled as such.<\u002Fli><li><strong>Perimeter discipline:<\u002Fstrong> figures are for the DZ BANK Group (IFRS) or the named entity; the ~€1.175trn Genossenschaftliche FinanzGruppe aggregate is the <em>sector<\u002Fem>, NOT DZ BANK; the CRR prudential scope excludes insurance; and the erroneous \"DZ BANK holds ~20% of Atruvia\" claim must not be propagated (it holds ~0.35%; the ~20% figure refers to Verimi).<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<p><em>End of <a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-risk-infrastructure-and-organisational-des\">Volume III<\u002Fa>. Work paused at a logical boundary; <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Volume IV<\u002Fa> (economics, capital, profitability, strategy) not begun, per scope.<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv><\u002Fsection>\n<section class=\"sec\" data-part=\"4\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part IV<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">IV<\u002Fspan><\u002Fdiv><h1 id=\"part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\" class=\"part\" data-short=\"Part IV — Financial Statements, The Three Economic Engines, Unit Economics &amp; Capital\">Financial Statements, The Three Economic Engines, Unit Economics &amp; Capital<\u002Fh1><p class=\"opener-s\">How three incompatible economic machines and three capital regimes coexist inside one balance sheet.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">IV<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">26<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Pre-tax, FY2025<\u002Fdiv><div class=\"plate-v\">€4,282m<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-tl-dr\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR<\u002Fspan><\u002Fa><a href=\"#s-key-findings\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-iv-1\"><span class=\"inpart-n\">IV.1<\u002Fspan><span>Multi-Year Financial History<\u002Fspan><\u002Fa><a href=\"#s-iv-2\"><span class=\"inpart-n\">IV.2<\u002Fspan><span>The Three Economic Engines<\u002Fspan><\u002Fa><a href=\"#s-iv-3\"><span class=\"inpart-n\">IV.3<\u002Fspan><span>Revenue Architecture and Quality<\u002Fspan><\u002Fa><a href=\"#s-iv-4\"><span class=\"inpart-n\">IV.4<\u002Fspan><span>Banking Economics in Detail<\u002Fspan><\u002Fa><a href=\"#s-iv-5\"><span class=\"inpart-n\">IV.5<\u002Fspan><span>Insurance Economics in Detail (R+V)<\u002Fspan><\u002Fa><a href=\"#s-iv-6\"><span class=\"inpart-n\">IV.6<\u002Fspan><span>Asset-Management Economics (Union Investment) with peer benchmark<\u002Fspan><\u002Fa><a href=\"#s-iv-7\"><span class=\"inpart-n\">IV.7<\u002Fspan><span>Cost Architecture<\u002Fspan><\u002Fa><a href=\"#s-iv-8\"><span class=\"inpart-n\">IV.8<\u002Fspan><span>Unit Economics Across Incompatible Units [ANALYTICAL INFERENCE, arithmetic shown]<\u002Fspan><\u002Fa><a href=\"#s-iv-9\"><span class=\"inpart-n\">IV.9<\u002Fspan><span>Segment and Entity Economics — all nine<\u002Fspan><\u002Fa><a href=\"#s-iv-10\"><span class=\"inpart-n\">IV.10<\u002Fspan><span>Income Statement Teardown<\u002Fspan><\u002Fa><a href=\"#s-iv-11\"><span class=\"inpart-n\">IV.11<\u002Fspan><span>Balance Sheet Teardown<\u002Fspan><\u002Fa><a href=\"#s-iv-12\"><span class=\"inpart-n\">IV.12<\u002Fspan><span>The Three Capital Regimes — Reconciliation<\u002Fspan><\u002Fa><a href=\"#s-iv-13\"><span class=\"inpart-n\">IV.13<\u002Fspan><span>Funding, Liquidity, Rating<\u002Fspan><\u002Fa><a href=\"#s-iv-14\"><span class=\"inpart-n\">IV.14<\u002Fspan><span>Cash Flow, Dividend, Retention<\u002Fspan><\u002Fa><a href=\"#s-iv-15\"><span class=\"inpart-n\">IV.15<\u002Fspan><span>Capital Allocation<\u002Fspan><\u002Fa><a href=\"#s-iv-16\"><span class=\"inpart-n\">IV.16<\u002Fspan><span>Return to Whom, and For What Purpose<\u002Fspan><\u002Fa><a href=\"#s-iv-17\"><span class=\"inpart-n\">IV.17<\u002Fspan><span>One Euro of Group Revenue [ANALYTICAL INFERENCE]<\u002Fspan><\u002Fa><a href=\"#s-iv-18\"><span class=\"inpart-n\">IV.18<\u002Fspan><span>Economic Driver Tree — the variables that matter most<\u002Fspan><\u002Fa><a href=\"#s-iv-19\"><span class=\"inpart-n\">IV.19<\u002Fspan><span>Scenario and Sensitivity Analysis [ANALYTICAL INFERENCE / HYPOTHESIS]<\u002Fspan><\u002Fa><a href=\"#s-iv-20\"><span class=\"inpart-n\">IV.20<\u002Fspan><span>Profitability Decomposition and Normalisation [ANALYTICAL INFERENCE]<\u002Fspan><\u002Fa><a href=\"#s-volume-iv-reconstruction-answers-to-the-central-questions\"><span class=\"inpart-n\"><\u002Fspan><span>Volume IV Reconstruction — Answers to the Central Questions<\u002Fspan><\u002Fa><a href=\"#s-recommendations\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a href=\"#s-caveats\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats\" style=\"max-width:520px\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">18.4% / 203.8% / 136.1%<\u002Fdiv><div class=\"stat-l\">CET1 · Solvency II · conglomerate coverage<\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 class=\"hd hd2\" id=\"s-tl-dr\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">TL;DR<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li>The DZ BANK Group's real economic engine in FY2025 was <strong>insurance<\u002Fstrong> (R+V, €2,144m segment pre-tax, ~50% of group) and <strong>asset management<\u002Fstrong> (Union Investment, €1,185m, ~28%) — together ~78% of a €4,282m pre-tax result — <strong>not<\u002Fstrong> the eponymous bank; but roughly €1.0–1.3bn of that result was a non-repeating low-claims/market windfall, which is exactly why management guides FY2026 down to <strong>around €3.0bn<\u002Fstrong> (CEO Cornelius Riese: \"we are unlikely to see a repetition of the one-off items that had a positive effect in 2025, particularly in the insurance segment … we anticipate a profit before taxes for 2026 of around €3.0 billion\").<\u002Fli><li>The group runs three incompatible capital regimes that do not reconcile to one number: CRR/CRD (CET1 18.4%, RWA €148.6bn, banking only), Solvency II (R+V own funds €17.05bn / SCR €8.37bn = 203.8% preliminary end-2025), and the FKAG conglomerate coverage (136.1% end-2024, €37.45bn own funds / €27.52bn requirements) that arithmetically sums the two and gives no diversification credit.<\u002Fli><li>Conventional ROE/valuation is category-inappropriate: DZ BANK is unlisted, 94.8% cooperatively owned, and runs a Förderauftrag. The owner-banks extract value mainly through distribution commissions and subsidised Verbund services, not the €448m dividend (15.6% payout). CET1 far above requirements reflects the conglomerate deduction logic and cooperative prudence, not productive over-capitalisation.<\u002Fli><\u002Ful>\n<h2 class=\"hd hd2\" id=\"s-key-findings\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>FY2025 group pre-tax profit was €4,282m (net €2,880m), up 29.6%<\u002Fstrong> — but the headline masks three moving parts pulling in opposite directions. Net interest income fell 17.8% to €3,839m while the trading result swung from −€842m to +€281m; these are two halves of the same accounting artefact (2024 NII was inflated by valuation effects with a countervailing trading loss). Net income from insurance rose 76.5% to €2,024m on an exceptionally benign claims year.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>The three engines are genuinely incompatible machines.<\u002Fstrong> Banking (CICB, DZ HYP, BSH, DZ PRIVATBANK, TeamBank, VR Smart Finanz) is measured in NII, fees and RWA; insurance (R+V) in premiums, combined ratio and the IFRS 17 contractual service margin (R+V's \"Vertragliche Servicemarge\"/VSM, €6.68bn at YE2025); asset management (Union Investment, €534.6bn AuM) in basis-point margin (~45.7bps). No single revenue narrative can hold all three.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>Insurance is the highest-quality-in-scale but most cyclical engine.<\u002Fstrong> R+V's segment pre-tax of €2,144m (group perimeter) / €2,221m (R+V's own IFRS group) rode a P&amp;C combined ratio that fell from 94.9% to 86.6% and a reinsurance combined ratio from 82.5% to 58.9% — a once-in-several-years low-claims outcome. The investment result actually fell (Kapitalanlageergebnis −54.5% to €2,368m), so the profit surge is underwriting-driven, not investment-driven, and not an IFRS 17 presentation illusion.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>Asset management is the highest-quality recurring engine.<\u002Fstrong> Union Investment earned €1,185m pre-tax on €534.6bn AuM at a ~53% cost/income ratio — essentially an annuity on the primary banks' distribution reach — but its margin is thin (~45.7bps of AuM) and market-dependent.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>The banking engine is the lowest-return, highest-capital-intensity engine<\u002Fstrong> and exists substantially to serve the Förderauftrag: it consumes essentially all of the group's €148.6bn RWA, produced CICB pre-tax of €864m, and carries two structural loss-makers (TeamBank −€29m, VR Smart Finanz −€28m).<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>Capital cannot be expressed as one number.<\u002Fstrong> CET1 18.4% (banking, up from 15.8% mainly on CRR III lowering RWA); R+V SCR 203.8%; conglomerate 136.1%. The conglomerate ratio sits far below the banking CET1 headroom because it sums two full requirement stacks and strips diversification.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>The FY2026 ~€3.0bn guidance is realistic-to-slightly-conservative<\u002Fstrong>, implying ~€1.3bn of non-repeating 2025 result — overwhelmingly the R+V low-claims windfall plus normalising loss allowances and trading.<\u002Fli><\u002Fol>\n<h2 class=\"hd hd2\" id=\"s-details\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Details<\u002Fspan><\u002Fh2>\n<h2 class=\"hd hd2\" id=\"s-iv-1\"><span class=\"hn mono\">IV.1<\u002Fspan><span class=\"ht\">Multi-Year Financial History<\u002Fspan><\u002Fh2>\n<p><strong>Perimeter warning.<\u002Fstrong> Four perimeters recur below and must never be blended: <strong>(1) DZ BANK AG<\u002Fstrong> (HGB parent); <strong>(2) DZ BANK Group/Konzern<\u002Fstrong> (IFRS, ~€661bn); <strong>(3) Genossenschaftliche FinanzGruppe<\u002Fstrong> (the whole sector — €1.68trn total assets and, per BVR President Marija Kolak on 15 July 2026, a consolidated pre-tax profit of €11.6bn in 2025, €7.4bn net after €4.2bn income taxes, cost/income 58.3% — this is NOT DZ BANK and is the most commonly misquoted figure); <strong>(4) bankenaufsichtlicher Konsolidierungskreis<\u002Fstrong> (CRR scope, RWA €148.6bn, EXCLUDES insurance). A fifth, the <strong>Solvency II group<\u002Fstrong> for R+V, is used only in <a class=\"xr\" href=\"#s-iv-5\">IV.5<\u002Fa>/<a class=\"xr\" href=\"#s-iv-12\">IV.12<\u002Fa>.<\u002Fp>\n<p><strong>Table 1 — DZ BANK Group (IFRS), €m [CONFIRMED, company disclosure, preliminary FY2025]<\u002Fstrong><\u002Fp>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Line<\u002Fsc-raw-th><sc-raw-th>FY2024<\u002Fsc-raw-th><sc-raw-th>FY2025<\u002Fsc-raw-th><sc-raw-th>Δ%<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Net interest income<\u002Fsc-raw-td><sc-raw-td>4,670<\u002Fsc-raw-td><sc-raw-td>3,839<\u002Fsc-raw-td><sc-raw-td>−17.8<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Net fee &amp; commission income<\u002Fsc-raw-td><sc-raw-td>3,191<\u002Fsc-raw-td><sc-raw-td>3,370<\u002Fsc-raw-td><sc-raw-td>+5.6<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Trading result<\u002Fsc-raw-td><sc-raw-td>−842<\u002Fsc-raw-td><sc-raw-td>281<\u002Fsc-raw-td><sc-raw-td>&gt;100<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Gains/losses on investments<\u002Fsc-raw-td><sc-raw-td>65<\u002Fsc-raw-td><sc-raw-td>105<\u002Fsc-raw-td><sc-raw-td>+61.5<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Other valuation result (fin. instr.)<\u002Fsc-raw-td><sc-raw-td>229<\u002Fsc-raw-td><sc-raw-td>−127<\u002Fsc-raw-td><sc-raw-td>&gt;100<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Result from derecognition (AC)<\u002Fsc-raw-td><sc-raw-td>40<\u002Fsc-raw-td><sc-raw-td>28<\u002Fsc-raw-td><sc-raw-td>−30.0<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Net income from insurance business<\u002Fsc-raw-td><sc-raw-td>1,147<\u002Fsc-raw-td><sc-raw-td>2,024<\u002Fsc-raw-td><sc-raw-td>+76.5<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Loss allowances<\u002Fsc-raw-td><sc-raw-td>−845<\u002Fsc-raw-td><sc-raw-td>−653<\u002Fsc-raw-td><sc-raw-td>−22.7<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Administrative expenses<\u002Fsc-raw-td><sc-raw-td>−4,552<\u002Fsc-raw-td><sc-raw-td>−4,804<\u002Fsc-raw-td><sc-raw-td>+5.5<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Other operating result<\u002Fsc-raw-td><sc-raw-td>200<\u002Fsc-raw-td><sc-raw-td>219<\u002Fsc-raw-td><sc-raw-td>+9.5<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Profit before taxes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>3,303<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>4,282<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>+29.6<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Income taxes<\u002Fsc-raw-td><sc-raw-td>−913<\u002Fsc-raw-td><sc-raw-td>−1,402<\u002Fsc-raw-td><sc-raw-td>+53.6<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Net profit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>2,390<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>2,880<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>+20.5<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Total assets (€bn)<\u002Fsc-raw-td><sc-raw-td>~660<\u002Fsc-raw-td><sc-raw-td>~661 (H1 2025: 666)<\u002Fsc-raw-td><sc-raw-td>~flat<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>CET1 ratio (%)<\u002Fsc-raw-td><sc-raw-td>15.8<\u002Fsc-raw-td><sc-raw-td>18.4<\u002Fsc-raw-td><sc-raw-td>+2.6pp<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Leverage ratio (%)<\u002Fsc-raw-td><sc-raw-td>6.6<\u002Fsc-raw-td><sc-raw-td>7.0<\u002Fsc-raw-td><sc-raw-td>+0.4pp<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cost/income ratio (%)<\u002Fsc-raw-td><sc-raw-td>52.3<\u002Fsc-raw-td><sc-raw-td>49.3<\u002Fsc-raw-td><sc-raw-td>−3.0pp<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Dividend (€m)<\u002Fsc-raw-td><sc-raw-td>448<\u002Fsc-raw-td><sc-raw-td>448 (proposed)<\u002Fsc-raw-td><sc-raw-td>flat<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p>Longer-run context [CONFIRMED]: pre-tax profit was €3.2bn (2023) and €3.3bn (2024). The FY2023 introduction of IFRS 17 makes the \"net income from insurance business\" line non-comparable to any pre-2023 premium-based presentation; pre- and post-2023 insurance figures must never be compared without adjustment.<\u002Fp>\n<p><strong>Table 2 — DZ BANK AG (HGB parent, standalone), €m [CONFIRMED]<\u002Fstrong><\u002Fp>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Line<\u002Fsc-raw-th><sc-raw-th>FY2024<\u002Fsc-raw-th><sc-raw-th>FY2025<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Zinsüberschuss (incl. participation income)<\u002Fsc-raw-td><sc-raw-td>1,653<\u002Fsc-raw-td><sc-raw-td>1,487<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Operating income (operative Erträge)<\u002Fsc-raw-td><sc-raw-td>2,704<\u002Fsc-raw-td><sc-raw-td>2,835<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Administrative expenses<\u002Fsc-raw-td><sc-raw-td>−1,662<\u002Fsc-raw-td><sc-raw-td>−1,762<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cost/income ratio (%)<\u002Fsc-raw-td><sc-raw-td>61.5<\u002Fsc-raw-td><sc-raw-td>62.2<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Betriebsergebnis vor Risikovorsorge<\u002Fsc-raw-td><sc-raw-td>1,042<\u002Fsc-raw-td><sc-raw-td>1,073*<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Risikovorsorge<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>−106<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Betriebsergebnis<\u002Fsc-raw-td><sc-raw-td>519<\u002Fsc-raw-td><sc-raw-td>967<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p>*derived (2,835 − 1,762 = 1,073). The AG's cost/income ratio (62.2%) is far worse than the group's (49.3%) — because the AG carries the central-institution and holding cost base without the high-margin insurance and asset-management subsidiaries. This is the clearest single demonstration that the \"bank\" and the \"group\" are different economic objects.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-2\"><span class=\"hn mono\">IV.2<\u002Fspan><span class=\"ht\">The Three Economic Engines<\u002Fspan><\u002Fh2>\n<p><strong>Engine 1 — Banking.<\u002Fstrong> Segments and FY2025 pre-tax: CICB (Verbund- und Geschäftsbank) €864m; DZ HYP €338m; BSH €122m; DZ PRIVATBANK €106m; TeamBank −€29m; VR Smart Finanz −€28m. Aggregate banking pre-tax ≈ €1,373m before the holding function (−€335m) and consolidation (−€85m). Revenue drivers: net interest income (deposit-taking from owner-banks, lending to corporates), fees (transaction banking, capital markets), trading. Capital: this engine consumes essentially all of the group's €148.6bn RWA. Cyclicality: moderate; highly sensitive to the rate cycle and to corporate credit.<\u002Fp>\n\n<figure class=\"fig\" id=\"fig-3\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 3<\u002Fspan><span class=\"fig-t\">The Three Economic Engines<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div class=\"f-lbl\" style=\"margin-bottom:14px\">Segment result before taxes, FY2025 · €m · IFRS group perimeter<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:9px\">\n  <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr) 78px;gap:14px;align-items:center\"><span style=\"font-size:16px\">R+V <span class=\"muted\">insurance<\u002Fspan><\u002Fspan><span class=\"bar\" style=\"height:22px\"><span class=\"barf hi\" style=\"height:22px;width:100%\"><\u002Fspan><\u002Fspan><span class=\"mono\" style=\"text-align:right;font-size:17px\">2,144<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr) 78px;gap:14px;align-items:center\"><span style=\"font-size:16px\">Union Investment <span class=\"muted\">AM<\u002Fspan><\u002Fspan><span class=\"bar\" style=\"height:22px\"><span class=\"barf hi\" style=\"height:22px;width:55.3%\"><\u002Fspan><\u002Fspan><span class=\"mono\" style=\"text-align:right;font-size:17px\">1,185<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr) 78px;gap:14px;align-items:center\"><span style=\"font-size:16px\">CICB <span class=\"muted\">the bank<\u002Fspan><\u002Fspan><span class=\"bar\" style=\"height:22px\"><span class=\"barf\" style=\"height:22px;width:40.3%\"><\u002Fspan><\u002Fspan><span class=\"mono\" style=\"text-align:right;font-size:17px\">864<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr) 78px;gap:14px;align-items:center\"><span style=\"font-size:16px\">DZ HYP<\u002Fspan><span class=\"bar\" style=\"height:22px\"><span class=\"barf\" style=\"height:22px;width:15.8%\"><\u002Fspan><\u002Fspan><span class=\"mono\" style=\"text-align:right;font-size:17px\">338<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr) 78px;gap:14px;align-items:center\"><span style=\"font-size:16px\">BSH<\u002Fspan><span class=\"bar\" style=\"height:22px\"><span class=\"barf\" style=\"height:22px;width:5.7%\"><\u002Fspan><\u002Fspan><span class=\"mono\" style=\"text-align:right;font-size:17px\">122<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr) 78px;gap:14px;align-items:center\"><span style=\"font-size:16px\">DZ PRIVATBANK<\u002Fspan><span class=\"bar\" style=\"height:22px\"><span class=\"barf\" style=\"height:22px;width:4.9%\"><\u002Fspan><\u002Fspan><span class=\"mono\" style=\"text-align:right;font-size:17px\">106<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr) 78px;gap:14px;align-items:center\"><span style=\"font-size:16px\">TeamBank<\u002Fspan><span class=\"bar\" style=\"height:22px;position:relative\"><span class=\"barf alt\" style=\"height:22px;width:1.4%\"><\u002Fspan><\u002Fspan><span class=\"mono acc\" style=\"text-align:right;font-size:17px\">−29<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr) 78px;gap:14px;align-items:center\"><span style=\"font-size:16px\">VR Smart Finanz<\u002Fspan><span class=\"bar\" style=\"height:22px\"><span class=\"barf alt\" style=\"height:22px;width:1.3%\"><\u002Fspan><\u002Fspan><span class=\"mono acc\" style=\"text-align:right;font-size:17px\">−28<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr) 78px;gap:14px;align-items:center\"><span style=\"font-size:16px\">Holding<\u002Fspan><span class=\"bar\" style=\"height:22px\"><span class=\"barf alt\" style=\"height:22px;width:15.6%\"><\u002Fspan><\u002Fspan><span class=\"mono acc\" style=\"text-align:right;font-size:17px\">−335<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr) 78px;gap:14px;align-items:center\"><span style=\"font-size:16px\">Other / consolidation<\u002Fspan><span class=\"bar\" style=\"height:22px\"><span class=\"barf alt\" style=\"height:22px;width:4%\"><\u002Fspan><\u002Fspan><span class=\"mono acc\" style=\"text-align:right;font-size:17px\">−85<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px\">\n  <div class=\"cal\"><div class=\"cal-k\">Insurance + asset management<\u002Fdiv><div class=\"cal-b\"><span class=\"mono\">€3,329m<\u002Fspan> of pre-tax profit — <strong>~78% of the group<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box\"><div class=\"f-lbl\">Group total, FY2025<\u002Fdiv><div class=\"f-num\" style=\"font-size:26px\">€4,282m<\u002Fdiv><div class=\"f-meta\">Profit before taxes, IFRS consolidated<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"lgd\"><span class=\"key acc\"><\u002Fspan>Insurance and asset management<span style=\"width:26px\"><\u002Fspan><span class=\"key\"><\u002Fspan>Banking and other engines<span style=\"width:26px\"><\u002Fspan><span class=\"key\" style=\"background:var(--color-neutral-300);border-color:var(--color-neutral-300)\"><\u002Fspan>Loss-making / holding<\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\"><b>The bank is the third-largest contributor to its own group.<\u002Fb> Two non-banking engines produce roughly four euros in five of the profit.<\u002Ffigcaption><\u002Ffigure>\n\n\n<p><strong>Why NII fell 17.8%.<\u002Fstrong> The €831m fall in NII (€4,670m→€3,839m) is largely mirrored by the €1,123m improvement in trading (−€842m→+€281m). DZ BANK states plainly that 2024 NII was \"unusually high due to accounting-related effects that had a positive impact on net interest income but a countervailing negative impact on gains and losses on trading activities\" [<span class=\"ev\">COMPANY CLAIM<\u002Fspan>, corroborated by the offsetting swings]. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: the genuine economic decline in NII is far smaller than 17.8%; combined NII+trading rose from €3,828m to €4,120m (+7.6%).<\u002Fp>\n<p><strong>Engine 2 — Insurance (R+V).<\u002Fstrong> IFRS 17 basis (group segment presentation): insurance service result (versicherungstechnisches Ergebnis) €2,597m (2024: €1,371m); investment &amp; other insurance result €2,368m (2024: €5,210m, −54.5%); insurance finance expense (versicherungstechnisches Finanzergebnis) −€2,853m (2024: −€5,351m). The net income from insurance business line reported at group level was €2,024m; R+V's segment pre-tax €2,144m. Gross written premiums €22.8bn (+9.1%): Leben/Kranken €10.8bn, Schaden/Unfall €8.5bn, assumed reinsurance €3.4bn. R+V's own IFRS group reported €2,221m pre-tax, €1,455m net, 17.9% RoE, €12.4bn equity. The contractual service margin (VSM) rose to €6,680m (2024: €6,035m) — the store of unearned future profit; that it grew means new-business value more than replaced the amortised release (a positive quality signal).<\u002Fp>\n<p><strong>Engine 3 — Asset management (Union Investment/UMH).<\u002Fstrong> AuM €534.6bn (2024: €504.7bn; 2023: €455.2bn), a record high (\"neuer Höchststand\"), split retail €270.8bn / institutional €263.8bn. Total net inflows €23.3bn (2024: €17.3bn): retail €13.5bn (second-best in the company's history), institutional €9.8bn (more than doubled from €4.7bn). Fund savings plans surpassed 4 million (6.55m including Riester/VL). Segment revenue is dominated by net commission income of €2,377m. <strong>Basis-point margin (derived):<\u002Fstrong> €2,377m ÷ average AuM ((504.7+534.6)/2 = €519.65bn) = <strong>45.7bps<\u002Fstrong> [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]. Cost/income: administrative expenses €1,352m ÷ operating income (~€2,536m) = <strong>~53%<\u002Fstrong>. Pre-tax margin ~46.7% of revenue. Performance-related management fees are volatile: in FY2023 UMH's success-fee income was only €12.3m [CONFIRMED, UMH GB2023]. Pre-tax fell 4.5% to €1,185m (2024: €1,241m; 2023: €974m) despite record AuM because 2024 benefited from positive valuation effects (Sonstiges Bewertungsergebnis €85m vs €19m in 2025); CEO Hans Joachim Reinke called it a \"robustes Ergebnis.\"<\u002Fp>\n<p><strong>Interaction / correlation risk.<\u002Fstrong> The insurance and asset-management engines share one systematic exposure: equity and credit markets. A drawdown simultaneously lowers Union AuM (and thus fee income) and R+V's investment result and Solvency II own funds. This is the group's single most important correlation risk (modelled in <a class=\"xr\" href=\"#s-iv-19\">IV.19<\u002Fa>).<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-3\"><span class=\"hn mono\">IV.3<\u002Fspan><span class=\"ht\">Revenue Architecture and Quality<\u002Fspan><\u002Fh2>\n<p>Recurring, high-quality streams: Union Investment management fees (annuity on €534.6bn AuM); BSH and DZ HYP net interest (spread businesses); R+V premium/underwriting. Market-dependent/lower-quality: trading result, performance fees, investment result within insurance, own-issuance valuation effects. Of the FY2025 €4,282m, <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> puts ~€2.9–3.1bn as structural earnings power and ~€1.2–1.4bn as a rate-cycle/low-claims/market windfall — consistent with management's ~€3.0bn FY2026 guide and with Riese's statement that 2025's one-off items, \"particularly in the insurance segment,\" are unlikely to repeat.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-4\"><span class=\"hn mono\">IV.4<\u002Fspan><span class=\"ht\">Banking Economics in Detail<\u002Fspan><\u002Fh2>\n<p>CICB: NII €1,487m, fees €691m, trading €452m, loss allowances −€241m (down from −€457m, which had carried BayWa), CIR 58.0%. Corporate loan commitments +8% to €97.4bn; joint/consortium credit (Metakredit) €19.3bn; renewable-energy lending +21% to €9.7bn. DZ HYP: NII €819m, portfolio €57.6bn, loss allowances €105m, but pre-tax fell to €338m because own-issuance valuation effects (Sonstiges Bewertungsergebnis) hit −€138m. BSH: NII €684m (+27.4%), pre-tax €122m (+90.6%), Bauspar new business fell to €17.6bn, market share 33.3%. The Metakredit model: DZ BANK supplies balance sheet and RWA while the primary bank retains the customer relationship — a Förderauftrag mechanism, not a profit-maximising one.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-5\"><span class=\"hn mono\">IV.5<\u002Fspan><span class=\"ht\">Insurance Economics in Detail (R+V)<\u002Fspan><\u002Fh2>\n<p>Combined ratios [CONFIRMED, DZ BANK segment disclosure, net EOM basis]: P&amp;C 86.6% (2024: 94.9%); assumed reinsurance 58.9% (2024: 82.5%). On an HGB basis R+V reports motor combined ratio improved to 96% (from 103%). Segment pre-tax by line: Schaden/Unfall €979m (from €407m); Leben/Kranken €452m (from €479m); assumed reinsurance €713m (from €355m). Investments €127bn (IFRS Kapitalanlagen €101.3bn plus €26.8bn unit-linked). Portfolio ~84% FVOCI, debt-heavy (~€90.8bn fixed income); equities ~€5.1bn; investment property €3.5bn. Solvency II (R+V \"Versicherungsgruppe\", preliminary/unaudited, end-2025): own funds €17,053m, SCR €8,368m, ratio <strong>203.8%<\u002Fstrong> (end-2024 restated to 172.5% from the 168% originally cited); the §352 VAG Rückstellungstransitional now has <strong>zero<\u002Fstrong> effect (revaluation to null at 1 Jan 2024); the volatility adjustment is applied for individual life/health entities. Economic (internal) capital adequacy 335.9% at end-2025. VSM €6,680m; VSM release €378m (life/health) + €254m (reinsurance) + €19m (P&amp;C); risk-adjustment release €70m (life/health) + €48m (reinsurance). Of R+V's €2,144m, the overwhelming majority is underwriting (insurance service result €2,597m) rather than investment, which fell — confirming the profit surge is genuine underwriting, not accounting.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-6\"><span class=\"hn mono\">IV.6<\u002Fspan><span class=\"ht\">Asset-Management Economics (Union Investment) with peer benchmark<\u002Fspan><\u002Fh2>\n<p>UMH €1,185m pre-tax on €534.6bn AuM. Margin ~45.7bps; cost/income ~53%. Benchmark [THIRD-PARTY, CONFIRMED]: DWS reported a FY2025 cost-income ratio of <strong>58.0%<\u002Fstrong> (improved 7.6pp vs FY2024; net income €928m, revenues €3,155m) — UMH's ~53% is thus meaningfully more efficient than its largest listed German peer, reflecting the captive Volksbanken distribution which lowers acquisition cost but requires trailer commissions paid to the primary banks (a Verbund cost, discussed in <a class=\"xr\" href=\"#s-iv-16\">IV.16<\u002Fa>). Net flow quality is high — ratierliches Sparen (regular savings plans, now &gt;4m contracts) provides sticky retail inflows and Riester leadership.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-7\"><span class=\"hn mono\">IV.7<\u002Fspan><span class=\"ht\">Cost Architecture<\u002Fspan><\u002Fh2>\n<p>Group administrative expenses €4,804m (+5.5%), driven by investment in personnel and IT. By segment: UMH €1,352m; CICB €1,526m; holding €213m; DZ PRIVATBANK €320m; BSH €527m; DZ HYP €256m; TeamBank €279m; VR Smart Finanz €82m. Group employees ~33,837 (R+V alone &gt;18,400). Cost per employee (crude, group admin ÷ headcount) ≈ €142,000 — but this blends insurance and bank cost structures and is not a clean unit. The \"conglomerate tax\" (parallel CRR + Solvency II + FKAG reporting, three audit/accounting bases) is real but not separately quantified by the company — label <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-8\"><span class=\"hn mono\">IV.8<\u002Fspan><span class=\"ht\">Unit Economics Across Incompatible Units [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, arithmetic shown]<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Per member bank<\u002Fstrong> (~645 institutions): pre-tax €4,282m ÷ 645 = <strong>€6.64m<\u002Fstrong>; net €2,880m ÷ 645 = <strong>€4.47m<\u002Fstrong>.<\u002Fli><li><strong>Per euro of AuM<\u002Fstrong> (Union): <strong>45.7bps<\u002Fstrong> revenue margin (€2,377m ÷ €519.65bn average AuM).<\u002Fli><li><strong>Per payment transaction<\u002Fstrong> (11.0bn): if VR Payment revenue is ~€200m, ~<strong>1.8 cents<\u002Fstrong> per transaction — a critical figure showing the payments business is a scale/utility play, not a margin play.<\u002Fli><li><strong>Per euro of RWA<\u002Fstrong> (€148.6bn, banking only): banking-attributable pre-tax ÷ RWA ≈ <strong>~0.9%<\u002Fstrong> (using ~€1.37bn banking segment pre-tax) — the insurance and AM engines earn outside RWA entirely.<\u002Fli><li><strong>Per employee<\u002Fstrong>: net €2,880m ÷ 33,837 = <strong>€85,120<\u002Fstrong>.<\u002Fli><li><strong>Governing unit:<\u002Fstrong> none of the conventional bank units governs. <strong>The member bank is the true unit of account<\u002Fstrong> — the group exists to serve ~645 owners; every other metric (per customer, per transaction, per euro RWA) misleads because the group neither owns the 30m+ end customers nor optimises RWA return.<\u002Fli><\u002Ful>\n<h2 class=\"hd hd2\" id=\"s-iv-9\"><span class=\"hn mono\">IV.9<\u002Fspan><span class=\"ht\">Segment and Entity Economics — all nine<\u002Fspan><\u002Fh2>\n<p>R+V €2,144m; UMH €1,185m; CICB €864m; DZ HYP €338m; BSH €122m; DZ PRIVATBANK €106m; TeamBank −€29m; VR Smart Finanz −€28m; holding function −€335m; other/consolidation −€85m. The two loss-makers are consumer/SME credit units hit by rising loss allowances in a weak economy (TeamBank risk provision −€233m; VR Smart Finanz −€51m). The holding function −€335m comprises negative NII (−€122m, funding/AT1 costs) and administrative expenses (−€213m) for group-level commercial-law, tax and prudential-supervision functions. These are structurally different businesses; the loss-makers are tolerated because they serve the Förderauftrag (consumer and SME credit reach for the Volksbanken) — a clear case of Förderauftrag cross-subsidy.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-10\"><span class=\"hn mono\">IV.10<\u002Fspan><span class=\"ht\">Income Statement Teardown<\u002Fspan><\u002Fh2>\n<p>Effective tax rate <strong>32.7%<\u002Fstrong> (€1,402m ÷ €4,282m) — high, reflecting German corporate + trade tax and non-deductible items. Key accounting judgements: IFRS 17 measurement models (all three used — general measurement model, premium allocation approach, variable fee approach, with usage varying by segment); IFRS 9 ECL staging (loss allowances €653m); fair-value trading; and own-issuance valuation effects that depressed DZ HYP (−€138m) and helped CICB.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-11\"><span class=\"hn mono\">IV.11<\u002Fspan><span class=\"ht\">Balance Sheet Teardown<\u002Fspan><\u002Fh2>\n<p>Total assets ~€661bn. Dominant lines: loans to banks (primary-bank placements), loans to customers, insurance investments (~€101bn) and unit-linked assets (~€27bn), the trading portfolio, Pfandbrief-backed lending at DZ HYP, deposits from banks (structural funding core), insurance contract liabilities under IFRS 17 (Deckungsrückstellung €101,089m including the €6,680m VSM), debt certificates including Pfandbriefe, subordinated capital, and equity. Asset encumbrance arises from DZ HYP Pfandbrief issuance and from cover-pool eligibility of claims against sector members.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-12\"><span class=\"hn mono\">IV.12<\u002Fspan><span class=\"ht\">The Three Capital Regimes — Reconciliation<\u002Fspan><\u002Fh2>\n<p>(a) <strong>CRR/CRD banking group<\u002Fstrong> [CONFIRMED, Pillar 3]: CET1 18.4% (Q3 2025: 18.10%), Tier 1 20.5%, total 23.6%, leverage 7.0%. Total risk exposure amount (RWA) €148,617m at 30 Sept 2025 (down from €162,563m at end-2024 and €151,425m at H1 2025 — CRR III lowered RWA, the main reason CET1 rose from 15.8% to 18.4%). CET1 capital ~€26,905m. Requirement stack: P2R 1.80% (2026), capital conservation buffer 2.5%, O-SII 1.00% (from 1 Jan 2026), CCyB 0.75%, sectoral SyRB on residential real estate reduced to 1% (from 1 May 2025). MREL 40.8% of RWA (subordinated 34.1%), 13.9% of leverage exposure. (b) <strong>Solvency II (R+V, preliminary)<\u002Fstrong>: own funds €17,053m, SCR €8,368m, ratio 203.8%. (c) <strong>FKAG conglomerate<\u002Fstrong> [CONFIRMED, §25(3)/(4) FKAG report]: end-2024 own funds €37,450m ÷ requirements €27,522m = <strong>136.1%<\u002Fstrong> (down from 152.5% end-2023, reduced mainly by the R+V transitional revaluation to zero and higher requirements); H1 2025 rose to 142.2% (own funds +€1,396m, requirements −€204m). External minimum 100%, internal minimum 113%, internal observation threshold 123% (raised from 121%). Computed under Delegated Regulation (EU) 342/2014 with Article 49(1) CRR. <strong>Why they don't reconcile:<\u002Fstrong> the conglomerate ratio sums a banking requirement (Pillar 1 + buffers on RWA) and an insurance requirement (SCR) and divides into summed own funds, giving no credit for cross-sector diversification. So an 18.4% banking CET1 (huge headroom) coexists with a 136.1% conglomerate ratio (comfortable but not lavish) — because the same capital cannot be counted twice and the deductions bite. <strong>No single \"group solvency number\" exists; anyone quoting one is conflating perimeters.<\u002Fstrong> The internal 113% threshold implies management runs the conglomerate with a deliberately modest ~23-point buffer to the observation threshold, signalling disciplined but not excessive risk appetite at the whole-group level even as the banking CET1 looks lavish.<\u002Fp>\n\n<figure class=\"fig\" id=\"fig-4\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 4<\u002Fspan><span class=\"fig-t\">The Three Capital Regimes Do Not Reconcile<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 41px minmax(0,1fr) 41px minmax(0,1fr);gap:0;align-items:stretch\">\n  <div class=\"f-box\"><div class=\"f-lbl\">Regime 1 · CRR / CRD<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">CET1 ratio<\u002Fdiv><div class=\"f-num\" style=\"font-size:40px;line-height:1;margin:12px 0 6px\">18.4%<\u002Fdiv><div class=\"f-meta\">Banking group only — <strong>excludes insurance<\u002Fstrong>. RWA €148.6bn. CRR III lowered RWA from 1 Jan 2025.<\u002Fdiv>\n    <div style=\"margin-top:14px\"><span class=\"bar\" style=\"height:10px\"><span class=\"barf hi\" style=\"height:10px;width:100%\"><\u002Fspan><\u002Fspan><div class=\"split-r\"><span class=\"muted\" style=\"font-size:13.5px\">requirement stack ~10.5%<\u002Fspan><span class=\"mono\" style=\"font-size:13.5px\">headroom ~7.9pp<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:34px;color:var(--muted)\">≠<\u002Fdiv>\n  <div class=\"f-box\"><div class=\"f-lbl\">Regime 2 · Solvency II<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">SCR coverage<\u002Fdiv><div class=\"f-num\" style=\"font-size:40px;line-height:1;margin:12px 0 6px\">203.8%<\u002Fdiv><div class=\"f-meta\">R+V only. Own funds €17.05bn against an SCR of €8.37bn. Separate supervision, separate requirement.<\u002Fdiv>\n    <div style=\"margin-top:14px\"><span class=\"bar\" style=\"height:10px\"><span class=\"barf hi\" style=\"height:10px;width:100%\"><\u002Fspan><\u002Fspan><div class=\"split-r\"><span class=\"muted\" style=\"font-size:13.5px\">requirement 100%<\u002Fspan><span class=\"mono\" style=\"font-size:13.5px\">2.04× covered<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:34px;color:var(--muted)\">≠<\u002Fdiv>\n  <div class=\"f-box gold\"><div class=\"f-lbl\">Regime 3 · FKAG<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">Conglomerate coverage<\u002Fdiv><div class=\"f-num\" style=\"font-size:40px;line-height:1;margin:12px 0 6px\">136.1%<\u002Fdiv><div class=\"f-meta\">The whole group. Sums two full requirement stacks with <strong>no diversification credit<\u002Fstrong>.<\u002Fdiv>\n    <div style=\"margin-top:14px\">\n      <svg sc-camel-view-box=\"0 0 420 50\" width=\"100%\" height=\"50\" style=\"display:block\" aria-hidden=\"true\">\n        <rect x=\"0\" y=\"6\" width=\"420\" height=\"12\" fill=\"none\" stroke=\"var(--wire)\" stroke-width=\"1\"><\u002Frect>\n        <rect x=\"0\" y=\"6\" width=\"311\" height=\"12\" fill=\"var(--acc-solid)\"><\u002Frect>\n        <line x1=\"228\" y1=\"2\" x2=\"228\" y2=\"26\" stroke=\"var(--ink)\" stroke-width=\"1\"><\u002Fline>\n        <line x1=\"258\" y1=\"2\" x2=\"258\" y2=\"26\" stroke=\"var(--ink)\" stroke-width=\"1\" stroke-dasharray=\"3 2\"><\u002Fline>\n        <line x1=\"281\" y1=\"2\" x2=\"281\" y2=\"26\" stroke=\"var(--ink)\" stroke-width=\"1\" stroke-dasharray=\"3 2\"><\u002Fline>\n        <text x=\"228\" y=\"42\" font-size=\"12\" fill=\"var(--muted)\" text-anchor=\"middle\">100<\u002Ftext>\n        <text x=\"258\" y=\"42\" font-size=\"12\" fill=\"var(--muted)\" text-anchor=\"middle\">113<\u002Ftext>\n        <text x=\"281\" y=\"42\" font-size=\"12\" fill=\"var(--muted)\" text-anchor=\"middle\">123<\u002Ftext>\n        <text x=\"311\" y=\"42\" font-size=\"12\" fill=\"var(--ink)\" text-anchor=\"middle\">136.1<\u002Ftext>\n      <\u002Fsvg>\n      <div class=\"split-r\"><span class=\"muted\" style=\"font-size:13.5px\">external · internal · observation<\u002Fspan><span class=\"mono\" style=\"font-size:13.5px\">headroom ~13pp to 123%<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\"><b>The conglomerate ratio sums two full requirement stacks with no diversification credit.<\u002Fb> It, not the CET1 ratio, is the binding constraint on the group's capital.<\u002Ffigcaption><\u002Ffigure>\n\n\n<h2 class=\"hd hd2\" id=\"s-iv-13\"><span class=\"hn mono\">IV.13<\u002Fspan><span class=\"ht\">Funding, Liquidity, Rating<\u002Fspan><\u002Fh2>\n<p>Funding core: deposits from the primary banks (structural, cheap, sticky); DZ HYP covered bonds/Pfandbriefe; senior preferred/non-preferred; AT1/T2; central-bank access (incl. $15bn US CP programme, NY Fed access). LCR 156.4%, NSFR 126% — conservative. <strong>Rating drivers:<\u002Fstrong> S&amp;P A+ is anchored on the 'a+' group credit profile of the cooperative sector and its protection scheme (S&amp;P adds no ALAC uplift because sector support is deemed \"the strongest support element\" and a bail-in \"highly unlikely\"). Moody's Aa2: DZ BANK's standalone Baseline Credit Assessment is baa2, lifted to an <strong>a3 Adjusted BCA<\u002Fstrong> by \"a very high probability of cross-sector support from Genossenschaftliche FinanzGruppe\" through the institutional protection scheme — i.e. roughly two notches of the rating derive from scheme membership, not standalone strength [CONFIRMED, Moody's]. This is the single most important qualitative fact about the group's funding cost: the AA-band rating is substantially a sector-solidarity rating, not a standalone one.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-14\"><span class=\"hn mono\">IV.14<\u002Fspan><span class=\"ht\">Cash Flow, Dividend, Retention<\u002Fspan><\u002Fh2>\n<p>Dividend €448m (25 cents/share) proposed for FY2025, the third consecutive year at that level (the payout also carries a variable 3-cent component dependent on business performance); payout <strong>15.6%<\u002Fstrong> of €2,880m net. Retention is high because (i) the owner-banks want the central institution strongly capitalised as their risk backstop, (ii) the conglomerate ratio (136.1%) is the binding constraint, not the banking CET1, and (iii) CRR III/Solvency II reviews create prudent capital targets. Retained earnings build conglomerate own funds.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-15\"><span class=\"hn mono\">IV.15<\u002Fspan><span class=\"ht\">Capital Allocation<\u002Fspan><\u002Fh2>\n<p>Deployments: organic growth (renewable-energy lending +21% to €9.7bn; corporate credit +8%); the ZV ON€ payments platform (three-digit-million build); depositary-business acquisitions (AuD €380.7bn, third-largest in Germany); the disposal of VR Payment's issuing-processing to Atruvia effective 1 Jan 2027; support for loss-making TeamBank/VR Smart Finanz; and high retention. Discipline is evident (exiting sub-scale payments processing, consolidating depositary, participation in Wallee) but returns on the payments build are not yet separately disclosed — <span class=\"ev\">UNKNOWN<\u002Fspan>. Note: DZ BANK holds ~0.35% of Atruvia (the ~20% figure that circulates refers to Verimi).<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-16\"><span class=\"hn mono\">IV.16<\u002Fspan><span class=\"ht\">Return to Whom, and For What Purpose<\u002Fspan><\u002Fh2>\n<p>Nominal group RoE for reference: net €2,880m ÷ equity (~€28–29bn) ≈ <strong>~10%<\u002Fstrong> [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] — respectable but not the governing metric. The economic value to owner-banks flows in several forms: (1) the <strong>€448m dividend<\u002Fstrong> (small); (2) <strong>distribution commissions<\u002Fstrong> paid by the group's product factories to the primary banks for selling funds, insurance and Bauspar — Verbund commission income was €2.8bn in 2021 (last year BVR published that specific line), within total primary-bank net commission income that reached €9.5bn (BVR consolidated 2024); (3) <strong>subsidised/cost-based central services<\u002Fstrong> (payments, custody, liquidity); (4) <strong>risk capacity<\u002Fstrong> via Metakredit (€19.3bn); (5) <strong>protection-scheme membership<\u002Fstrong> underpinning every member's rating. On the central question — is CET1 18.4% over-capitalisation? — the answer is <strong>no, it is not productively deployable \"excess\"<\u002Fstrong>: the binding constraint is the 136.1% conglomerate ratio, and cooperative owners rationally prefer a fortress balance sheet at their central institution to a higher dividend. The owner-banks are better off with the current low-price/high-service/high-retention model than with a higher payout; the true \"return\" is the competitiveness the Verbund confers on 645 local banks, not a per-share yield.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-iv-17\"><span class=\"hn mono\">IV.17<\u002Fspan><span class=\"ht\">One Euro of Group Revenue [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]<\u002Fspan><\u002Fh2>\n<p>Because the three engines have fundamentally different shapes, a single group waterfall misleads and is therefore presented separately. For the <strong>bank<\u002Fstrong>, of €1 of income: ~€0.49–0.58 admin cost (group CIR 49.3%; AG 62.2%), a material slice to loss allowances, then tax and residual retention. For the <strong>asset manager<\u002Fstrong>: ~€0.53
