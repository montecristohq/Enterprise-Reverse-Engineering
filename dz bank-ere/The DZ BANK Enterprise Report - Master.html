aw-tr><sc-raw-td><strong>VR Smart Finanz<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>New business €1.18bn; portfolio €3.12bn; cost/income 78.6%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>VR Payment<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>~248 employees; revenue &gt;€200m; issuing-processing to Atruvia 1 Jan 2027<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-operations\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Operations<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Figure<\u002Fsc-raw-th><sc-raw-th>Canonical value<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Payment transactions<\u002Fsc-raw-td><sc-raw-td><strong>11.0bn<\u002Fstrong> (FY2025); 10.2bn (2024); 9.9bn (2023)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Payments platform<\u002Fsc-raw-td><sc-raw-td>ZV ON€, insourced, migration completed 2024 (~500 people, ~5 years, 100,000+ person-days, &gt;600 banks)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Depositary / custody<\u002Fsc-raw-td><sc-raw-td>€380.7bn — Germany's third largest<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Joint/consortium credit (Metakredit)<\u002Fsc-raw-td><sc-raw-td>~€19.3bn<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Own core systems<\u002Fsc-raw-td><sc-raw-td>SAP S/4HANA + Murex MX.3 — <strong>not<\u002Fstrong> Atruvia<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-ratings-and-the-protection-scheme\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Ratings and the protection scheme<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Figure<\u002Fsc-raw-th><sc-raw-th>Canonical value<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>S&amp;P<\u002Fsc-raw-td><sc-raw-td><strong>A+<\u002Fstrong> — equalised to the sector's 'a+' group credit profile; no ALAC uplift<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Moody's<\u002Fsc-raw-td><sc-raw-td><strong>Aa2<\u002Fstrong> — Adjusted BCA a3; standalone BCA baa2, upgraded to baa1 in November 2025<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Fitch<\u002Fsc-raw-td><sc-raw-td><strong>AA-/AA<\u002Fstrong> — a single group rating covering DZ BANK and ~700 primary banks<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Morningstar DBRS<\u002Fsc-raw-td><sc-raw-td>AA (low) — one notch of uplift from the protection scheme<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Rating uplift attributable to the IPS<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>~1–2 notches<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-sector-context-genossenschaftliche-finanzgruppe-perimeter-not-dz-bank\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Sector context — Genossenschaftliche FinanzGruppe perimeter, NOT DZ BANK<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Figure<\u002Fsc-raw-th><sc-raw-th>Canonical value<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Sector total assets<\u002Fsc-raw-td><sc-raw-td><strong>€1.68trn<\u002Fstrong> (2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sector pre-tax profit<\u002Fsc-raw-td><sc-raw-td><strong>€11.6bn<\u002Fstrong> (2025); €7.4bn net after €4.2bn taxes<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sector cost/income ratio<\u002Fsc-raw-td><sc-raw-td>58.3%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Primary banks' net commission income<\u002Fsc-raw-td><sc-raw-td>€6.5bn (2024), ~€3bn of it from payments<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>End customers<\u002Fsc-raw-td><sc-raw-td>30m+<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<div class=\"sep\"><\u002Fdiv><\u002Fsection>\n<section class=\"sec\" data-part=\"9\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Appendix C<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">C<\u002Fspan><\u002Fdiv><h1 id=\"app-c-appendix-c-reconciliation-of-cross-volume-discrepancies\" class=\"part\" data-short=\"Appendix C — Reconciliation of Cross-Volume Discrepancies\">Reconciliation of Cross-Volume Discrepancies<\u002Fh1><p class=\"opener-s\">Where the volumes disagree, which figure governs, and which differences are not errors at all.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Appendix<\u002Fdiv><div class=\"plate-v\">C<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">3<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">As of<\u002Fdiv><div class=\"plate-v\">9 August 2026<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-perimeter-date-and-basis-differences-not-errors\"><span class=\"inpart-n\"><\u002Fspan><span>Perimeter, date and basis differences — not errors<\u002Fspan><\u002Fa><a href=\"#s-genuine-errors-and-corrections\"><span class=\"inpart-n\"><\u002Fspan><span>Genuine errors and corrections<\u002Fspan><\u002Fa><a href=\"#s-known-unknowns-carried-forward\"><span class=\"inpart-n\"><\u002Fspan><span>Known unknowns carried forward<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><p>The volumes were written sequentially against a moving evidence base, and DZ BANK's figures conflict for two reasons that must be kept apart: <strong>perimeter and date differences<\u002Fstrong>, which are legitimate, and <strong>genuine errors<\u002Fstrong>, which are not.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-perimeter-date-and-basis-differences-not-errors\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Perimeter, date and basis differences — not errors<\u002Fspan><\u002Fh2>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>#<\u002Fsc-raw-th><sc-raw-th>Item<\u002Fsc-raw-th><sc-raw-th>Appears as<\u002Fsc-raw-th><sc-raw-th>Resolution<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td><strong>Genossenschaftliche FinanzGruppe scale<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>€1.175trn (Volumes I–III) versus €1.68trn (Volumes IV–V)<\u002Fsc-raw-td><sc-raw-td><strong>Different years and measures.<\u002Fstrong> The earlier figure is the primary banks' aggregate balance sheet as reported for 2022; €1.68trn is the sector total for 2025 per BVR President Kolak on 15 July 2026. Neither is the DZ BANK Group (~€661bn).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td><strong>Sector pre-tax profit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>€9.5bn (2024) versus €11.6bn (2025)<\u002Fsc-raw-td><sc-raw-td>Different years, both sector perimeter — not the group's €4,282m.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td><strong>Primary bank count<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>~645 / 672 / ~700 / \"rund 800\"<\u002Fsc-raw-td><sc-raw-td>A <strong>falling series<\u002Fstrong> measured at different dates: ~800 in older sources, 672 at end-2024, ~645 by late 2025, with ~700 used loosely by DZ BANK and Fitch for the rating perimeter.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td><strong>R+V gross written premiums<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>€20.9bn versus €22.8bn<\u002Fsc-raw-td><sc-raw-td>2024 versus 2025. The 2025 figure is +8.6%.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td><strong>R+V pre-tax result<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>€2,144m versus €2,221m<\u002Fsc-raw-td><sc-raw-td><strong>DZ BANK segment perimeter versus R+V's own IFRS group perimeter.<\u002Fstrong> Both correct; do not use interchangeably.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td><strong>R+V Solvency II ratio<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>168% → 172.5% → 203.8%<\u002Fsc-raw-td><sc-raw-td>168% was the originally-published end-2024 figure, later <strong>restated to 172.5%<\u002Fstrong>; 203.8% is preliminary end-2025. The restatement follows the §352 VAG transitional revaluing to zero.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td><strong>FKAG conglomerate coverage<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>\"&gt;100%, &gt;113% internal\" (<a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\">Volume I<\u002Fa>) versus 136.1% / 142.2% (<a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Volume IV<\u002Fa>)<\u002Fsc-raw-td><sc-raw-td><a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\">Volume I<\u002Fa> reported the thresholds; <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Volume IV<\u002Fa> obtained the actual ratios. <strong>136.1% at end-2024, 142.2% at H1 2025 governs.<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td><strong>Payment transactions<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>9.9bn / 10.2bn / 11.0bn<\u002Fsc-raw-td><sc-raw-td>A rising series: FY2023 / FY2024 / FY2025.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td><strong>CET1 ratio<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>15.8% versus 18.4%<\u002Fsc-raw-td><sc-raw-td>2024 versus 2025. The rise is <strong>mainly CRR III lowering RWA<\u002Fstrong>, not a capital raise.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>10<\u002Fsc-raw-td><sc-raw-td><strong>Net interest income −17.8%<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Presented as a decline<\u002Fsc-raw-td><sc-raw-td>Largely an <strong>accounting artefact<\u002Fstrong>: 2024 NII was inflated by valuation effects with a countervailing trading loss. NII plus trading rose 7.6%.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>11<\u002Fsc-raw-td><sc-raw-td><strong>Union Investment AuM<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>€534.7bn versus €534.6bn<\u002Fsc-raw-td><sc-raw-td>Rounding between sources; €534.6bn is the later figure.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>12<\u002Fsc-raw-td><sc-raw-td><strong>BSH ownership<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>96.8% versus 97.6%<\u002Fsc-raw-td><sc-raw-td>Both appear in group materials; treat as approximate.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>13<\u002Fsc-raw-td><sc-raw-td><strong>BSH Bauspar market share<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>33.3% versus ~34–35%<\u002Fsc-raw-td><sc-raw-td>Different measurement bases — total contracts versus \"eingelöstes Neugeschäft.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>14<\u002Fsc-raw-td><sc-raw-td><strong>Moody's standalone BCA<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>baa2 versus baa1<\u002Fsc-raw-td><sc-raw-td><strong>baa2 before November 2025; upgraded one notch to baa1<\u002Fstrong> in the methodology-driven action of 18–20 November 2025, with the Adjusted BCA affirmed at a3 — so the scheme uplift compressed from two notches to one while the Aa2 rating was unchanged.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-genuine-errors-and-corrections\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Genuine errors and corrections<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>#<\u002Fsc-raw-th><sc-raw-th>Item<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>15<\u002Fsc-raw-td><sc-raw-td><strong>\"DZ BANK holds ~20% of Atruvia\"<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>FALSE.<\u002Fstrong> DZ BANK holds approximately <strong>0.35%<\u002Fstrong>. The ~20% figure belongs to <strong>Verimi<\u002Fstrong>. This error circulates widely and should be expected in further sources. DZ BANK is a <em>customer-side counterparty<\u002Fem> to Atruvia, not its controller.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>16<\u002Fsc-raw-td><sc-raw-td><strong>Union Investment stake \"~93%\"<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Superseded.<\u002Fstrong> <a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\">Volume I<\u002Fa> carried ~93%; <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-distribution-and-flow-architecture\">Volume II<\u002Fa> established <strong>72.37%<\u002Fstrong> as of 31 December 2025, with BBBank and the regional cooperative associations holding the residual ~27.6%. The higher figure reflects the pre-2016 structure in which WGZ BANK held 17.72% alongside DZ BANK's 54.44%; the WGZ stake was absorbed in the 2016 merger.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>17<\u002Fsc-raw-td><sc-raw-td><strong>Münchener Hypothekenbank treated as a group entity<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>FALSE.<\u002Fstrong> It is an <strong>independent cooperative mortgage bank outside the DZ BANK Group<\u002Fstrong>, ECB-supervised, and therefore an in-sector competitor to DZ HYP and BSH. The BVR consolidated accounts treat it as a \"rechtlich selbstständiges, gleichgeordnetes Mutterunternehmen\" alongside the DZ BANK Konzern. Its existence is the standing exception to any strict \"one champion per product\" reading.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>18<\u002Fsc-raw-td><sc-raw-td><strong>The Signa write-off quotation<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Mis-attributed in an earlier volume.<\u002Fstrong> R+V CEO Norbert Rollinger stated on 3 April 2024 that the Signa engagement was fully processed in the 2023 accounts. The phrase \"robuster dreistelliger Millionenbetrag\" traces to <strong>DZ BANK CEO Cornelius Riese<\u002Fstrong>, not Rollinger. Both confirm a full FY2023 write-off.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>19<\u002Fsc-raw-td><sc-raw-td><strong>R+V bank distribution reach<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Two figures appear:<\u002Fstrong> \"more than 7,500 Bankstellen\" (<a class=\"xr\" href=\"#part-ii-part-ii-product-customer-distribution-and-flow-architecture\">Volume II<\u002Fa>) and \"more than 13,000 cooperative bank branches\" (<a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-and-strategic-evolution\">Volume V<\u002Fa>). These are <strong>not reconciled<\u002Fstrong>. The lower figure likely counts branches with embedded R+V field staff; the higher counts all cooperative branches through which R+V products are available. Treat both as approximate and do not sum or average. <strong>UNRESOLVED.<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-known-unknowns-carried-forward\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Known unknowns carried forward<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li>Individual executive compensation (InstitutsVergV discloses aggregate only).<\u002Fli><li>Per-product commission rates and the precise Verbund versus non-Verbund revenue split.<\u002Fli><li>The register of control and profit-transfer agreements (BGAVs) across subsidiaries.<\u002Fli><li>Intercompany service pricing and cost-allocation terms.<\u002Fli><li>The quantified cost of the multi-regime \"conglomerate tax.\"<\u002Fli><li>DZ PRIVATBANK's fund-administration and transfer-agency software product.<\u002Fli><li>Formal availability SLOs, RTO and RPO for the ZV ON€ platform.<\u002Fli><li>The VR Payment issuing-processing transaction price and the year-end 2025 conglomerate ratio.<\u002Fli><li>Precise post-November-2025 Moody's BCA label (baa1 is inferred from a one-notch upgrade).<\u002Fli><li>The reconciliation of the 7,500 versus 13,000 branch-reach figures.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv><\u002Fsection>\n<section class=\"sec\" data-part=\"10\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Appendix D<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">D<\u002Fspan><\u002Fdiv><h1 id=\"app-d-appendix-d-source-hierarchy-and-evidence-conventions\" class=\"part\" data-short=\"Appendix D — Source Hierarchy &amp; Evidence Conventions\">Source Hierarchy &amp; Evidence Conventions<\u002Fh1><p class=\"opener-s\">How every claim in this study was graded.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Appendix<\u002Fdiv><div class=\"plate-v\">D<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">0<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Evidence grades<\u002Fdiv><div class=\"plate-v\">Six<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><p>Sources were prioritised as follows, with primary evidence preferred wherever it existed:<\u002Fp>\n<ol class=\"lst\"><li><strong>DZ BANK Geschäftsberichte and Konzernabschlüsse<\u002Fstrong> (IFRS consolidated and HGB parent), half-year reports, the Risikobericht, and the <strong>Offenlegungsbericht / Pillar 3 disclosure<\u002Fstrong> — collectively a materially richer evidence base than either prior EREF subject afforded.<\u002Fli><li><strong>The §25(3)/(4) FKAG conglomerate report<\u002Fstrong> — the sole public source for the conglomerate coverage ratio, and therefore for the group's binding capital constraint.<\u002Fli><li><strong>Subsidiary annual reports and, for R+V, the Solvency and Financial Condition Report (SFCR)<\u002Fstrong> — the SFCR is unusually informative on insurance operations, own funds and sensitivities.<\u002Fli><li><strong>Rating agency reports<\u002Fstrong> — Moody's, S&amp;P, Fitch and Morningstar DBRS — which are more explicit than any company disclosure about the institutional protection scheme's contribution to the rating and about group-support assumptions.<\u002Fli><li><strong>ECB, BaFin, Bundesbank, EBA and the SRB<\u002Fstrong> — SREP and Pillar 2 publications, buffer decisions, stress-test results and resolution material.<\u002Fli><li><strong>BVR<\u002Fstrong> publications, the consolidated financial statements of the Genossenschaftliche FinanzGruppe, and statements by BVR President Marija Kolak.<\u002Fli><li><strong>Bundesanzeiger<\u002Fstrong> filings and <strong>Handelsregister<\u002Fstrong> records for material entities.<\u002Fli><li><strong>German specialist press<\u002Fstrong> — Börsen-Zeitung, Handelsblatt, Finanz-Szene, DER PLATOW Brief, procontra, Versicherungswirtschaft and FONDS professionell — which carry executive interviews and sector reporting unavailable elsewhere.<\u002Fli><li><strong>EU policy material on the CMDI package<\u002Fstrong>, decisive for the institutional protection scheme's future treatment.<\u002Fli><li>Competitor and benchmark material: DekaBank, DWS, Allianz, Provinzial/SV, LBS, Wüstenrot, Santander Consumer Bank, Worldline, Nexi, Münchener Hypothekenbank and the Sparkassen-Finanzgruppe.<\u002Fli><\u002Fol>\n<p>SEO-oriented aggregators were not relied on where primary evidence existed. For strategically significant claims, sources were triangulated. Where reputable sources disagreed, the disagreement is identified, perimeters and dates compared, and uncertainty preserved rather than resolved by false precision.<\u002Fp>\n<p><strong>A note on the prohibition against invented architecture.<\u002Fstrong> <a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-risk-infrastructure-and-organisational-des\">Volume III<\u002Fa> in particular was written under an absolute rule: where the group has published nothing about an internal mechanism, the report says <span class=\"ev\">UNKNOWN<\u002Fspan> rather than describing plausible-sounding but unevidenced internals. A bank of this size discloses far less about its systems than a fintech does, and several sections are consequently shorter than their headings might suggest. That is deliberate.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<p><em>End of the DZ BANK Enterprise Reverse-Engineering Study.<\u002Fem><\u002Fp><\u002Fsection><\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const scroller = () => {\n      let n = document.querySelector('.doc');\n      while (n && n !== document.body) {\n        const s = getComputedStyle(n);\n        if (/(auto|scroll)/.test(s.overflowY) && n.scrollHeight > n.clientHeight + 4) return n;\n        n = n.parentElement;\n      }\n      const de = document.documentElement;\n      return de.scrollHeight > de.clientHeight + 4 ? de : (document.body.scrollHeight > document.body.clientHeight + 4 ? document.body : de);\n    };\n    const upd = () => {\n      const hs = Array.prototype.slice.call(document.querySelectorAll('h1.part'));\n      if (!hs.length) return;\n      let idx = 0;\n      for (let i = 0; i < hs.length; i++) { if (hs[i].getBoundingClientRect().top <= 200) idx = i; }\n      const items = document.querySelectorAll('.p-i');\n      for (let i = 0; i < items.length; i++) items[i].classList.toggle('on', i === idx);\n      const cur = document.getElementById('nav-cur');\n      if (cur && hs[idx]) cur.textContent = hs[idx].getAttribute('data-short') || '';\n      const bar = document.getElementById('nav-bar');\n      if (bar) {\n        const d = scroller();\n        const p = d.scrollTop / Math.max(1, d.scrollHeight - d.clientHeight);\n        bar.style.width = (Math.min(1, Math.max(0, p)) * 100).toFixed(2) + '%';\n      }\n      const on = document.querySelector('.p-i.on');\n      if (on && this._last !== idx) {\n        this._last = idx;\n        const nav = document.querySelector('.side');\n        if (nav) {\n          const r = on.getBoundingClientRect(), nr = nav.getBoundingClientRect();\n          if (r.top < nr.top + 60 || r.bottom > nr.bottom - 40) nav.scrollTop += r.top - nr.top - 120;\n        }\n      }\n    };\n    let tick = false;\n    this._onScroll = () => { if (tick) return; tick = true; requestAnimationFrame(() => { tick = false; upd(); }); };\n    window.addEventListener('scroll', this._onScroll, { passive: true, capture: true });\n    document.addEventListener('scroll', this._onScroll, { passive: true, capture: true });\n    window.addEventListener('resize', this._onScroll, { passive: true });\n    window.addEventListener('hashchange', this._onScroll);\n    this._iv = setInterval(upd, 700);\n    upd();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll, true);\n    document.removeEventListener('scroll', this._onScroll, true);\n    window.removeEventListener('resize', this._onScroll);\n    window.removeEventListener('hashchange', this._onScroll);\n    clearInterval(this._iv);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
