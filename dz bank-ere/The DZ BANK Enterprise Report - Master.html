<p><strong>Intra-group agreements.<\u002Fstrong> DZ BANK AG is the holding company for the specialised institutions. <span class=\"ev\">ANALYTICAL INFERENCE:<\u002Fspan> because the group holds <em>majority but not 100%<\u002Fem> stakes in R+V (~96%), UMH (~93%), BSH (~96.8%), TeamBank (~92%) and DZ HYP (~98%) — with the minorities largely being primary banks — the scope for full <strong>Beherrschungs- und Gewinnabführungsverträge<\u002Fstrong> (control and profit-transfer agreements) across the whole group is constrained by minority-protection law. <strong>VR Smart Finanz (~100%)<\u002Fstrong> is the clearest candidate for a full control/profit-transfer arrangement. <span class=\"ev\">UNKNOWN:<\u002Fspan> the precise register of which subsidiaries have BGAVs versus Patronatserklärungen (letters of comfort).<\u002Fp>\n<p><strong>Clearing / central-institution relationship.<\u002Fstrong> DZ BANK is the cash-clearing, settlement and custody hub for the cooperative banks: it holds their liquidity, provides refinancing, and is their gateway to TARGET2/T2, SEPA and securities settlement. This is the legal-operational core of the \"central institution\" function and cannot be exited by a primary bank without leaving the network.<\u002Fp>\n<p><strong>Customer contracts by entity.<\u002Fstrong> Each regulated activity is contracted through its own licensed entity: insurance policies with R+V entities; fund contracts with Union Investment KVGs; Bauspar contracts with BSH; consumer loans with TeamBank; corporate/capital-markets contracts with DZ BANK AG; Pfandbrief/CRE loans with DZ HYP; private-banking mandates with DZ PRIVATBANK S.A. This entity-by-entity contracting is what makes the \"one champion per product, distributed by ~645 banks\" model legally workable.<\u002Fp>\n<p><strong>Litigation / enforcement.<\u002Fstrong> Material exposures surfaced through credit events rather than conduct enforcement: <strong>R+V's investment losses on the Signa group<\u002Fstrong> (called a \"Fehlinvestition\" by Riese) and the group's exposure to <strong>BayWa<\u002Fstrong> (Bavarian agricultural-trading group; DZ BANK and LBBW participated in a rescue package), both of which drove elevated loss allowances in 2023–2024. <span class=\"ev\">UNKNOWN:<\u002Fspan> any current active regulatory enforcement action against DZ BANK AG specifically.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-i-6\"><span class=\"hn mono\">I.6<\u002Fspan><span class=\"ht\">Regulatory and Supervisory Architecture — Multi-Regime Map (PRIORITY DEPTH)<\u002Fspan><\u002Fh2>\n<p><strong>(a) Banking — ECB/SSM.<\u002Fstrong> DZ BANK AG is a <strong>Significant Institution<\u002Fstrong> under the SSM, <strong>directly supervised by the ECB<\u002Fstrong>, with BaFin and Bundesbank in national/joint-supervisory-team roles. It is subject to CRR/CRD, annual SREP, Pillar 2 requirements/guidance, capital buffers and MREL.<\u002Fp>\n\n<figure class=\"fig\" id=\"fig-5\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 5<\u002Fspan><span class=\"fig-t\">The Protection Scheme and the Rating<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;align-items:start\">\n  <div>\n    <div class=\"f-lbl\" style=\"margin-bottom:14px\">Moody's — where the rating comes from<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:0\">\n      <div class=\"f-box\" style=\"margin-left:0\"><div class=\"f-lbl\">Step 1 · standalone<\u002Fdiv><div class=\"f-name\">Baseline Credit Assessment <span class=\"mono acc\">baa2<\u002Fspan><\u002Fdiv><div class=\"f-meta\">Upgraded to <span class=\"mono\">baa1<\u002Fspan> in the methodology-driven action of November 2025<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0 8px 34px\"><span class=\"vl\" style=\"height:26px;margin:0\"><\u002Fspan><span class=\"mono acc\" style=\"font-size:15.5px\">+ institutional protection scheme support<\u002Fspan><\u002Fdiv>\n      <div class=\"f-box\" style=\"margin-left:34px\"><div class=\"f-lbl\">Step 2 · scheme<\u002Fdiv><div class=\"f-name\">Adjusted BCA <span class=\"mono acc\">a3<\u002Fspan><\u002Fdiv><div class=\"f-meta\">Cross-support from the BVR schemes lifts the assessment above standalone strength<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;padding:8px 0 8px 68px\"><span class=\"vl\" style=\"height:26px;margin:0\"><\u002Fspan><span class=\"mono acc\" style=\"font-size:15.5px\">+ loss-given-failure uplift<\u002Fspan><\u002Fdiv>\n      <div class=\"f-box solid\" style=\"margin-left:68px\"><div class=\"f-lbl\" style=\"color:var(--acc-dk)\">Step 3 · issued<\u002Fdiv><div class=\"f-name\">Long-term deposit / senior <span class=\"mono\">Aa2<\u002Fspan><\u002Fdiv><div class=\"f-meta\">Three notches above the standalone assessment<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pnl\">\n    <div class=\"pnl-k\">The other three agencies<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div><div class=\"f-name\" style=\"font-size:16px\">S&amp;P <span class=\"mono acc\">A+<\u002Fspan><\u002Fdiv><div class=\"f-meta\">Equalised to the sector's <span class=\"mono\">a+<\u002Fspan> group credit profile. No ALAC uplift.<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"f-name\" style=\"font-size:16px\">Fitch <span class=\"mono acc\">AA− / AA<\u002Fspan><\u002Fdiv><div class=\"f-meta\">A single group rating covering DZ BANK and ~700 primary banks together.<\u002Fdiv><\u002Fdiv>\n      <div><div class=\"f-name\" style=\"font-size:16px\">DBRS <span class=\"mono acc\">AA (low)<\u002Fspan><\u002Fdiv><div class=\"f-meta\">One notch of scheme uplift.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pnl-tot\"><span>Uplift from the scheme<\u002Fspan><span class=\"mono\">~1–2 notches<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\"><b>One to two notches of the rating come from the scheme, not from standalone strength.<\u002Fb> Rated alone, the parent would sit in the single-A band at best.<\u002Ffigcaption><\u002Ffigure>\n\n\n<ul class=\"lst\"><li><strong>O-SII / A-SRI buffer: 1.00%<\u002Fstrong> of the total risk exposure amount, held in CET1. BaFin/Bundesbank set it under §10g KWG, effective from 1 January 2026 and stable across 2024–2026. BaFin's ranking places DZ BANK below Deutsche Bank (2.00%) and Commerzbank / J.P. Morgan SE (1.25%), level with KfW and Goldman Sachs Bank Europe (1.00%). <strong>DZ BANK has been classified an O-SII by BaFin since 2016<\u002Fstrong> (its own Pillar 3 report).<\u002Fli><li><strong>Pillar 2 Requirement (consolidated, ECB-published):<\u002Fstrong> <strong>1.88% (2024), 1.93% (2025), 1.80% (2026)<\u002Fstrong> — the 2026 reduction reflects the latest SREP cycle. No leverage-ratio P2R applies. Under Art. 104a CRD, ≥56.25% must be met in CET1 and ≥75% in Tier 1.<\u002Fli><li><strong>Other buffers:<\u002Fstrong> the German <strong>sectoral systemic-risk buffer<\u002Fstrong> on residential-real-estate-secured domestic loans (§10e(1) KWG), set at 2% and <strong>reduced to 1% effective 1 May 2025<\u002Fstrong>; and the domestic <strong>countercyclical buffer<\u002Fstrong> of 0.75% (effective 1 February 2022).<\u002Fli><li><strong>Capital &amp; MREL (DZ BANK banking group, 31 Dec 2025):<\u002Fstrong> <strong>CET1 18.4%<\u002Fstrong> (2024: 15.8% — the jump partly reflects CRR III in force from 1 Jan 2025); <strong>Tier 1 20.5%<\u002Fstrong>; <strong>total capital 23.6%<\u002Fstrong>; <strong>leverage 7.0%<\u002Fstrong>; <strong>MREL 40.8% of RWA<\u002Fstrong> and 13.9% of LRE (subordinated MREL 34.1% of RWA); <strong>LCR 156.4%; NSFR 126%<\u002Fstrong>. The 40.8% is the ratio <em>held<\u002Fem>, comfortably above the SRB-set requirement. <span class=\"ev\">UNKNOWN:<\u002Fspan> precise current MREL <em>requirement<\u002Fem> (%) — a dated third-party (Daiwa, May 2024) cited ~25.1% of RWA, to be verified against table EU KM2 in the FY2025 Pillar 3 report.<\u002Fli><li><strong>Resolution:<\u002Fstrong> DZ BANK falls under the SRB/SRMR; it participates annually in preparing the group resolution plan under §40 SAG.<\u002Fli><\u002Ful>\n<p><strong>(b) Insurance — Solvency II.<\u002Fstrong> R+V is supervised by BaFin under Solvency II with its own SCR/MCR, ORSA and group supervision. <strong>SCR ratio 168% at end-2024<\u002Fstrong> (excluding transitional provisions), confirmed by S&amp;P (5 June 2025). R+V is <strong>not<\u002Fstrong> in the CRR prudential scope of the banking group; it enters supervision at the conglomerate level. <strong>Because R+V's rating \"automatically follows the network rating,\" the insurer's A+ (S&amp;P) financial-strength rating is a function of the cooperative network, not standalone underwriting — a direct consequence of the IPS.<\u002Fstrong><\u002Fp>\n\n<figure class=\"fig\" id=\"fig-7\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 7<\u002Fspan><span class=\"fig-t\">Five Supervisory Regimes Plus Conglomerate Supervision<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"min-width:520px\"><div class=\"vs-head\" style=\"grid-template-columns:230px repeat(5,minmax(0,1fr))\"><span class=\"vs-l\">Entity<\u002Fspan><span class=\"vs-l\">ECB / SSM<\u002Fspan><span class=\"vs-l\">Solvency II<\u002Fspan><span class=\"vs-l\">KAGB · UCITS<\u002Fspan><span class=\"vs-l\">BSpKG<\u002Fspan><span class=\"vs-l\">CSSF Lux<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column\">\n  <div class=\"vs\" style=\"grid-template-columns:230px repeat(5,minmax(0,1fr));padding:9px 0;border-bottom:1px solid var(--wire2)\"><span class=\"vs-m hi\">DZ BANK AG<\u002Fspan><span class=\"mono acc\">■ direct<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><\u002Fdiv>\n  <div class=\"vs\" style=\"grid-template-columns:230px repeat(5,minmax(0,1fr));padding:9px 0;border-bottom:1px solid var(--wire2)\"><span class=\"vs-m\">DZ HYP<\u002Fspan><span class=\"mono acc\">■ direct<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><\u002Fdiv>\n  <div class=\"vs\" style=\"grid-template-columns:230px repeat(5,minmax(0,1fr));padding:9px 0;border-bottom:1px solid var(--wire2)\"><span class=\"vs-m\">R+V Versicherung<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"mono acc\">■ BaFin<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><\u002Fdiv>\n  <div class=\"vs\" style=\"grid-template-columns:230px repeat(5,minmax(0,1fr));padding:9px 0;border-bottom:1px solid var(--wire2)\"><span class=\"vs-m\">Union Investment<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"mono acc\">■ AIFMD<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><\u002Fdiv>\n  <div class=\"vs\" style=\"grid-template-columns:230px repeat(5,minmax(0,1fr));padding:9px 0;border-bottom:1px solid var(--wire2)\"><span class=\"vs-m\">Bausparkasse Schwäbisch Hall<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"mono acc\">■ BSpKG<\u002Fspan><span class=\"muted\">·<\u002Fspan><\u002Fdiv>\n  <div class=\"vs\" style=\"grid-template-columns:230px repeat(5,minmax(0,1fr));padding:9px 0\"><span class=\"vs-m\">DZ PRIVATBANK<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"muted\">·<\u002Fspan><span class=\"mono acc\">■ CSSF<\u002Fspan><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box solid\" style=\"margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\"><div><div class=\"f-lbl\" style=\"color:var(--acc-dk)\">Spanning all five<\u002Fdiv><div class=\"f-name\">FKAG financial-conglomerate supplementary supervision<\u002Fdiv><\u002Fdiv><div class=\"f-num\">136.1% coverage<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px\">\n  <div class=\"f-box\"><div class=\"f-lbl\">Resolution<\u002Fdiv><div class=\"f-meta\" style=\"margin-top:4px\">SRB resolution planning across the banking perimeter<\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box\"><div class=\"f-lbl\">Operational resilience<\u002Fdiv><div class=\"f-meta\" style=\"margin-top:4px\">DORA — ICT risk and third-party oversight<\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box\"><div class=\"f-lbl\">Financial crime<\u002Fdiv><div class=\"f-meta\" style=\"margin-top:4px\">GwG — anti-money-laundering duties<\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box\"><div class=\"f-lbl\">Conduct<\u002Fdiv><div class=\"f-meta\" style=\"margin-top:4px\">MiFID II — advice, suitability, product governance<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\">Five entity-level regimes, four cross-cutting regimes, and one supplementary regime sitting on top of all of them. No single supervisor sees the whole institution.<\u002Ffigcaption><\u002Ffigure>\n\n\n<p><strong>(c) Asset management — KAGB.<\u002Fstrong> Union Investment's management companies are <strong>Kapitalverwaltungsgesellschaften<\u002Fstrong> under the KAGB, running UCITS funds (UCITS Directive) and AIFs (AIFMD), supervised by BaFin. Luxembourg fund vehicles add CSSF touchpoints via Attrax/Union Investment Luxembourg.<\u002Fp>\n<p><strong>(d) Building society — Bausparkassengesetz.<\u002Fstrong> Bausparkasse Schwäbisch Hall operates under the <strong>BSpKG<\u002Fstrong> and is supervised by BaFin; its business is legally restricted to Bauspar and related home-finance activities. CET1 ratio 25.4% (2024) — very high, reflecting the low-risk collateralised model.<\u002Fp>\n<p><strong>(e) Luxembourg — CSSF.<\u002Fstrong> DZ PRIVATBANK S.A. is a Luxembourg credit institution supervised by the <strong>CSSF<\u002Fstrong> (and, as part of a Significant Group, indirectly within the SSM); the Swiss unit is under FINMA.<\u002Fp>\n<p><strong>(f) Financial conglomerate — FKAG / FiCoD.<\u002Fstrong> BaFin has <strong>classified the DZ BANK Group as a financial conglomerate<\u002Fstrong> under §1(20)/§1(2) FKAG (the German transposition of Directive 2002/87/EC, FiCoD I). DZ BANK publishes an annual FKAG report under §25(3)/(4) FKAG. The conglomerate comprises principally the <strong>DZ BANK Institutsgruppe<\u002Fstrong> (banking) and the <strong>R+V Versicherungsgruppe<\u002Fstrong> (insurance). Supplementary supervision covers <strong>conglomerate solvency<\u002Fstrong> (a Bedeckungssatz computed under Delegated Regulation (EU) 342/2014 in conjunction with Art. 49(1) CRR), <strong>risk concentrations<\u002Fstrong>, <strong>intra-group transactions<\u002Fstrong> and <strong>conglomerate-wide risk management<\u002Fstrong> (drawing on §25a KWG/MaRisk BA for the bank, §26/§27 VAG for the insurer, and §28 KAGB/MaRisk for the funds). <strong>This is the mechanism that captures the banking-plus-insurance combination that the CRR banking scope alone omits<\u002Fstrong> — and it is the reason the group carries a heavier, more fragmented supervisory load than a pure bank of similar size.<\u002Fp>\n<p><strong>(g) The institutional protection scheme (IPS) — dedicated treatment.<\u002Fstrong> The BVR runs a <strong>dual<\u002Fstrong> protection architecture, jointly the \"backbone of the FinanzGruppe's risk management\" and monitored by BaFin:<\u002Fp>\n<ul class=\"lst\"><li><strong>BVR-SE (Sicherungseinrichtung):<\u002Fstrong> the older scheme (since 1934), comprising a <strong>Garantiefonds<\u002Fstrong> (guarantee fund) and a <strong>Garantieverbund<\u002Fstrong> (guarantee network). It is an <em>institution<\u002Fem> protection scheme — it protects the member institution <em>as a whole<\u002Fem> (all its liabilities, unlimited in size), not just deposits, by <strong>preventive intervention<\u002Fstrong>: recapitalising, restructuring or merging a troubled member <em>before<\u002Fem> it fails. It is privately financed, with no state support, and <strong>no member has failed since 1934<\u002Fstrong>.<\u002Fli><li><strong>BVR Institutssicherung GmbH (BVR-ISG):<\u002Fstrong> since <strong>1 July 2015<\u002Fstrong> the statutory deposit-guarantee scheme recognised under the Einlagensicherungsgesetz (EinSiG §43), and simultaneously an <strong>IPS within the meaning of Article 113(7) CRR<\u002Fstrong>. If BaFin declares a compensation event (§10 EinSiG), BVR-ISG compensates depositors up to <strong>€100,000 per person per institution<\u002Fstrong> (§§5–16 EinSiG). BVR is its sole shareholder.<\u002Fli><li><strong>Mechanics &amp; funding (Flow lens).<\u002Fstrong> Members sign a <strong>Beitritts- und Verpflichtungserklärung<\u002Fstrong> binding them to all obligations under the EinSiG and Art. 113(7) CRR. The schemes are funded by member contributions (ex-ante funds plus mutualised, callable commitments). Membership enables a <strong>0% risk weight on intra-scheme exposures under Art. 113(7) CRR<\u002Fstrong>, and the FinanzGruppe reports consolidated regulatory capital using the <strong>extended aggregated calculation under Art. 49(3) in conjunction with Art. 113(7) CRR<\u002Fstrong>. Recognition rests on ongoing BaFin approval.<\u002Fli><li><strong>What it means for DZ BANK (Economics / Risk lens).<\u002Fstrong> The IPS is the reason DZ BANK's exposures to primary banks (and vice versa) can be zero-weighted — materially lowering sector-wide RWAs and freeing capital. It is the primary driver of the AA-band external ratings (agencies rate the <em>network<\u002Fem>), which in turn set R+V's and the subsidiaries' ratings. It converts ~645 legally independent banks into a single de facto risk community. <strong>Without it:<\u002Fstrong> each institution would be rated and capitalised standalone; intra-network exposures would attract positive risk weights (a large capital hit sector-wide); funding costs would rise; and the decentralised model would be materially more fragile. The IPS is, in effect, the price of admission for a decentralised cooperative sector to enjoy the ratings and capital efficiency of a single large bank.<\u002Fli><\u002Ful>\n<p><strong>(h) Other regimes.<\u002Fstrong> <strong>DORA<\u002Fstrong> (Digital Operational Resilience Act) applies to DZ BANK and its regulated subsidiaries and governs ICT third-party arrangements — critically the Atruvia relationship, which deepens from 2027. <strong>AML/CFT<\u002Fstrong> under the GwG, BaFin-supervised. <strong>MiFID II<\u002Fstrong> governs the capital-markets/investment-services business. <strong>MREL/TLAC:<\u002Fstrong> DZ BANK is <strong>not<\u002Fstrong> a G-SII, so it faces SRB-set MREL rather than the TLAC minimum reserved for G-SIIs.<\u002Fp>\n<p><strong>Regulatory matrix (summary):<\u002Fstrong><\u002Fp>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Regime<\u002Fsc-raw-th><sc-raw-th>Lead authority<\u002Fsc-raw-th><sc-raw-th>Perimeter<\u002Fsc-raw-th><sc-raw-th>Key requirement<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>CRR/CRD banking<\u002Fsc-raw-td><sc-raw-td>ECB/SSM (+ BaFin/Bundesbank)<\u002Fsc-raw-td><sc-raw-td>DZ BANK Institutsgruppe<\u002Fsc-raw-td><sc-raw-td>CET1, P2R 1.80% (2026), O-SII 1.00%, MREL<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Solvency II<\u002Fsc-raw-td><sc-raw-td>BaFin<\u002Fsc-raw-td><sc-raw-td>R+V group<\u002Fsc-raw-td><sc-raw-td>SCR/MCR, ORSA (SCR 168%)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>KAGB / UCITS / AIFMD<\u002Fsc-raw-td><sc-raw-td>BaFin<\u002Fsc-raw-td><sc-raw-td>Union Investment KVGs<\u002Fsc-raw-td><sc-raw-td>Fund/manager rules<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Bausparkassengesetz<\u002Fsc-raw-td><sc-raw-td>BaFin<\u002Fsc-raw-td><sc-raw-td>BSH<\u002Fsc-raw-td><sc-raw-td>Restricted Bauspar activity<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>CSSF<\u002Fsc-raw-td><sc-raw-td>CSSF (Luxembourg)<\u002Fsc-raw-td><sc-raw-td>DZ PRIVATBANK S.A.<\u002Fsc-raw-td><sc-raw-td>Lux banking rules<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FKAG / FiCoD<\u002Fsc-raw-td><sc-raw-td>BaFin<\u002Fsc-raw-td><sc-raw-td>DZ BANK conglomerate<\u002Fsc-raw-td><sc-raw-td>Conglomerate solvency, concentrations, intra-group<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>SRMR/SAG resolution<\u002Fsc-raw-td><sc-raw-td>SRB<\u002Fsc-raw-td><sc-raw-td>Group<\u002Fsc-raw-td><sc-raw-td>Resolution plan, MREL<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DGS/IPS<\u002Fsc-raw-td><sc-raw-td>BaFin (BVR-SE/ISG)<\u002Fsc-raw-td><sc-raw-td>FinanzGruppe<\u002Fsc-raw-td><sc-raw-td>Deposit + institution protection<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DORA / GwG / MiFID II<\u002Fsc-raw-td><sc-raw-td>BaFin/ESMA<\u002Fsc-raw-td><sc-raw-td>Group<\u002Fsc-raw-td><sc-raw-td>Resilience, AML, conduct<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-i-7\"><span class=\"hn mono\">I.7<\u002Fspan><span class=\"ht\">Own Capability vs Partner Dependency<\u002Fspan><\u002Fh2>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Capability<\u002Fsc-raw-th><sc-raw-th>Model<\u002Fsc-raw-th><sc-raw-th>Provider<\u002Fsc-raw-th><sc-raw-th>Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Core banking IT (primary banks)<\u002Fsc-raw-td><sc-raw-td>Sector partner<\u002Fsc-raw-td><sc-raw-td><strong>Atruvia AG<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Serves the ~645 primary banks. <strong>DZ BANK holds only ~0.35% of Atruvia directly — NOT ~20% (that figure is Verimi).<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DZ BANK's own IT<\u002Fsc-raw-td><sc-raw-td>Mix (own + partners)<\u002Fsc-raw-td><sc-raw-td>DZ BANK IT/Organisation (Brauckmann)<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">ANALYTICAL INFERENCE:<\u002Fspan> DZ BANK runs its own core systems distinct from Atruvia's primary-bank platform; Atruvia is not DZ BANK's core-banking provider.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Payments/clearing<\u002Fsc-raw-td><sc-raw-td>Own<\u002Fsc-raw-td><sc-raw-td>DZ BANK Transaction Banking<\u002Fsc-raw-td><sc-raw-td>Central clearer; TARGET2/T2 and SEPA gateway; ~9bn payment transactions/yr.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card issuing-processing<\u002Fsc-raw-td><sc-raw-td>Sector partner (from 2027)<\u002Fsc-raw-td><sc-raw-td>VR Payment → <strong>Atruvia<\u002Fstrong> (1 Jan 2027)<\u002Fsc-raw-td><sc-raw-td>Debit + credit processing consolidated at Atruvia.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card acquiring/merchant<\u002Fsc-raw-td><sc-raw-td>Own<\u002Fsc-raw-td><sc-raw-td>VR Payment<\u002Fsc-raw-td><sc-raw-td>Refocused post-2027; took a stake in Wallee.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Securities settlement/custody<\u002Fsc-raw-td><sc-raw-td>Own<\u002Fsc-raw-td><sc-raw-td>DZ BANK<\u002Fsc-raw-td><sc-raw-td>Custodian for the network and institutions (AuD ~€97.4bn).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Asset-management operations<\u002Fsc-raw-td><sc-raw-td>Own<\u002Fsc-raw-td><sc-raw-td>Union Investment (+ Attrax, Luxembourg)<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Insurance underwriting/claims<\u002Fsc-raw-td><sc-raw-td>Own<\u002Fsc-raw-td><sc-raw-td>R+V (incl. R+V Re)<\u002Fsc-raw-td><sc-raw-td>Active reinsurance in-house.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Treasury/funding<\u002Fsc-raw-td><sc-raw-td>Own<\u002Fsc-raw-td><sc-raw-td>DZ BANK Group Treasury<\u002Fsc-raw-td><sc-raw-td>Central group funding; Pfandbrief via DZ HYP.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Ratings<\u002Fsc-raw-td><sc-raw-td>Bought<\u002Fsc-raw-td><sc-raw-td>S&amp;P, Moody's, Fitch<\u002Fsc-raw-td><sc-raw-td>Network rating drives subsidiary ratings.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-i-8\"><span class=\"hn mono\">I.8<\u002Fspan><span class=\"ht\">Regulation and Structure as Competitive Position<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Central-institution mandate:<\u002Fstrong> effectively <strong>exclusive<\u002Fstrong> — since 2016 there is a single cooperative central institution, a structural monopoly within the sector. Barrier to entry: near-absolute (a competitor cannot conjure ~645 owner-banks).<\u002Fli><li><strong>IPS as funding/ratings asset:<\u002Fstrong> a <strong>genuine moat<\u002Fstrong> — AA-band ratings, low funding costs, 0% intra-network risk weights, and depositor confidence that has prevented any visible failure since 1934.<\u002Fli><li><strong>Conglomerate structure:<\u002Fstrong> <strong>diversification<\u002Fstrong> (insurance + asset management smoothed the bank's weaker FY2025 net interest income, contributing ~78% of pre-tax profit) but at the <strong>cost<\u002Fstrong> of FKAG supplementary supervision and organisational complexity.<\u002Fli><li><strong>Owner-competitor tension:<\u002Fstrong> a <strong>strategic constraint<\u002Fstrong> on how aggressively DZ BANK can pursue corporate clients — a self-imposed ceiling on the corporate bank's growth.<\u002Fli><li><strong>Caveat (do not over-score the moat):<\u002Fstrong> captive ownership is not automatically a good outcome. It can dull cost discipline, entrench legacy brands, and slow decisions. The fifteen-year DZ/WGZ duplication, the DVB misadventure, and the persistent losses at TeamBank and VR Smart Finanz show that a protected structure can also shelter underperformance. The moat protects the <em>system<\u002Fem>; it does not guarantee <em>efficiency<\u002Fem>.<\u002Fli><\u002Ful>\n<h2 class=\"hd hd2\" id=\"s-i-9\"><span class=\"hn mono\">I.9<\u002Fspan><span class=\"ht\">Institutional Dependency Map<\u002Fspan><\u002Fh2>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Dependency<\u002Fsc-raw-th><sc-raw-th>Criticality<\u002Fsc-raw-th><sc-raw-th>Function<\u002Fsc-raw-th><sc-raw-th>Substitutability<\u002Fsc-raw-th><sc-raw-th>Bargaining power / switching<\u002Fsc-raw-th><sc-raw-th>Failure impact<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Primary cooperative banks (~645)<\u002Fsc-raw-td><sc-raw-td><strong>Critical<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Owners, funders, distributors, customers<\u002Fsc-raw-td><sc-raw-td>None<\u002Fsc-raw-td><sc-raw-td>They control DZ BANK<\u002Fsc-raw-td><sc-raw-td>Existential<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>BVR &amp; the IPS<\u002Fsc-raw-td><sc-raw-td><strong>Critical<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Protection, ratings, coordination<\u002Fsc-raw-td><sc-raw-td>None<\u002Fsc-raw-td><sc-raw-td>Mutual<\u002Fsc-raw-td><sc-raw-td>Loss of AA ratings + RWA shock<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>ECB / BaFin / Bundesbank / SRB<\u002Fsc-raw-td><sc-raw-td><strong>Critical<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Authorisation, capital, resolution<\u002Fsc-raw-td><sc-raw-td>None<\u002Fsc-raw-td><sc-raw-td>One-directional<\u002Fsc-raw-td><sc-raw-td>Licence/operational<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>TARGET2/T2 &amp; Eurosystem<\u002Fsc-raw-td><sc-raw-td><strong>Critical<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Settlement/liquidity<\u002Fsc-raw-td><sc-raw-td>None<\u002Fsc-raw-td><sc-raw-td>One-directional<\u002Fsc-raw-td><sc-raw-td>Payment gridlock<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Atruvia<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>IT for primary banks; card issuing-processing from 2027<\u002Fsc-raw-td><sc-raw-td>Very low<\u002Fsc-raw-td><sc-raw-td>Captive sector partner<\u002Fsc-raw-td><sc-raw-td>Sector operational outage<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Rating agencies<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Funding access<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Funding-cost spike<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wholesale funding markets<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Group/DZ HYP funding<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Market-driven<\u002Fsc-raw-td><sc-raw-td>Liquidity stress<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>EBA CLEARING / SEPA<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Retail payments<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Collective<\u002Fsc-raw-td><sc-raw-td>Payment disruption<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Reinsurers (for R+V)<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Risk transfer<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Market-driven<\u002Fsc-raw-td><sc-raw-td>Earnings volatility<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Deutsche Kreditwirtschaft / schemes<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Standards/governance<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Collective<\u002Fsc-raw-td><sc-raw-td>Strategic drift<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p><strong>Single points of institutional failure:<\u002Fstrong> the <strong>IPS<\u002Fstrong> and <strong>Atruvia<\u002Fstrong>. <strong>Converse — DZ BANK's own systemic importance:<\u002Fstrong> as an O-SII and the settlement/liquidity/custody hub for ~645 banks and ~30m customers, <strong>DZ BANK is itself the single point of failure for the German cooperative sector<\u002Fstrong> and is nationally systemically important — which is precisely why the ECB supervises it directly and why the IPS exists to make its failure unthinkable.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-i-10\"><span class=\"hn mono\">I.10<\u002Fspan><span class=\"ht\">Tax and Intercompany Architecture<\u002Fspan><\u002Fh2>\n<p><strong>Evidence-limited.<\u002Fstrong> Material entities are German tax-resident except <strong>DZ PRIVATBANK S.A.<\u002Fstrong> (Luxembourg) and the Swiss booking centre. <strong>VR Smart Finanz (~100%)<\u002Fstrong> is the most plausible Organschaft/profit-transfer entity; the majority-but-not-wholly-owned subsidiaries (R+V, UMH, BSH, TeamBank, DZ HYP) limit full tax-grouping because of minority (primary-bank) shareholders. Group income taxes were <strong>€1,402m on €4,282m pre-tax profit in FY2025<\u002Fstrong> (effective rate ~32.7%), consistent with German corporate income tax + solidarity surcharge + trade tax and the partial non-deductibility of certain insurance items — i.e. a <em>high<\u002Fem>, not optimised, effective rate. <span class=\"ev\">ANALYTICAL INFERENCE:<\u002Fspan> the Luxembourg/Swiss entities exist for fund-services and private-banking <em>market access<\u002Fem>, not tax arbitrage — DZ PRIVATBANK's economic rationale (Luxembourg is Europe's fund-administration hub) precedes any tax consideration. <span class=\"ev\">UNKNOWN:<\u002Fspan> intercompany service/cost-allocation terms; deferred-tax and uncertain-tax-position detail.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-i-11\"><span class=\"hn mono\">I.11<\u002Fspan><span class=\"ht\">Corporate and Regulatory Risk Register<\u002Fspan><\u002Fh2>\n<div class=\"tw wide\"><sc- c-raw-td><sc-raw-td>R+V<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Interest-rate risk in banking book<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>ALM/hedging; NII decline already absorbed<\u002Fsc-raw-td><sc-raw-td>Group Treasury<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Credit concentration (BayWa/Signa-type single names)<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med-High<\u002Fsc-raw-td><sc-raw-td>Loss allowances €653m FY2025; single-name limits<\u002Fsc-raw-td><sc-raw-td>CRO<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Owner-competitor conflict escalates<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Subsidiarity; joint/consortium credit<\u002Fsc-raw-td><sc-raw-td>CEO/Verbund board<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Member-bank consolidation shrinks owner base<\u002Fsc-raw-td><sc-raw-td>High (structural)<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Scale efficiencies; 23 mergers in 2025 alone<\u002Fsc-raw-td><sc-raw-td>BVR/CEO<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cyber/operational (DORA) incl. Atruvia concentration<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>DORA programme; resilience testing; step-in rights<\u002Fsc-raw-td><sc-raw-td>CIO<\u002Fsc-raw-td><sc-raw-td>Med-High<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>AML/sanctions enforcement<\u002Fsc-raw-td><sc-raw-td>Low-Med<\u002Fsc-raw-td><sc-raw-td>Med-High<\u002Fsc-raw-td><sc-raw-td>Compliance function; MaRisk<\u002Fsc-raw-td><sc-raw-td>CFO/Compliance<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Ratings downgrade<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>IPS/network rating anchor<\u002Fsc-raw-td><sc-raw-td>Group Treasury<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Reputational contagion across the Verbund brand<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>IPS prevents visible failures; shared brand governance<\u002Fsc-raw-td><sc-raw-td>BVR<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-i-12\"><span class=\"hn mono\">I.12<\u002Fspan><span class=\"ht\">Volume I Reconstruction — Synthesis and the Framing Questions<\u002Fspan><\u002Fh2>\n<p><strong>The twelve reconstructions (1)–(11)<\u002Fstrong> are delivered in the sections above: Corporate Entity Diagram and Simplified Group Structure (<a class=\"xr\" href=\"#s-i-2\">I.2<\u002Fa>); Ownership and Control (<a class=\"xr\" href=\"#s-i-3\">I.3<\u002Fa>); Governance and Decision-Rights Map (<a class=\"xr\" href=\"#s-i-4\">I.4<\u002Fa>); Multi-Regime Regulatory Map and IPS Diagram (<a class=\"xr\" href=\"#s-i-6\">I.6<\u002Fa>); Legal Responsibility Map (<a class=\"xr\" href=\"#s-i-5\">I.5<\u002Fa>); Own-vs-Partner Capability Matrix (<a class=\"xr\" href=\"#s-i-7\">I.7<\u002Fa>); Institutional Dependency Map (<a class=\"xr\" href=\"#s-i-9\">I.9<\u002Fa>); Tax/Intercompany Map (<a class=\"xr\" href=\"#s-i-10\">I.10<\u002Fa>); Chronological Corporate Evolution (<a class=\"xr\" href=\"#s-i-1\">I.1<\u002Fa>); and Structure-as-Competitive-Position (<a class=\"xr\" href=\"#s-i-8\">I.8<\u002Fa>) and the Risk Register (<a class=\"xr\" href=\"#s-i-11\">I.11<\u002Fa>).<\u002Fp>\n<p><strong>(15) Ten most important conclusions.<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li>The network owns the bank, not the reverse — 94.8% cooperative ownership means control flows <em>up<\u002Fem> from ~645 primary banks.<\u002Fli><li>DZ BANK is economically a bancassurance holding: R+V and Union Investment generated ~78% of FY2025 pre-tax profit; the bank itself is a minority contributor.<\u002Fli><li>The IPS (Art. 113(7) CRR) is the structural keystone — it delivers 0% intra-network risk weights, AA-band ratings, and a 90-year zero-failure record.<\u002Fli><li>Four perimeters (AG / Group / FinanzGruppe / prudential Institutsgruppe) must be kept distinct; secondary sources routinely splice them.<\u002Fli><li>DZ BANK carries an unusually heavy supervisory load: five sector regimes <em>plus<\u002Fem> FKAG conglomerate supervision — a real cost of the diversified model.<\u002Fli><li>The single-central-institution mandate (post-2016) is a structural monopoly and near-absolute barrier to entry within the sector.<\u002Fli><li>Capital is strong and strengthening (CET1 18.4%, up from 15.8%, partly via CRR III), and the 2026 P2R fell to 1.80% — the regulator is comfortable.<\u002Fli><li>The owner-competitor conflict is permanent and only <em>managed<\u002Fem>, not resolved — via subsidiarity and consortium credit.<\u002Fli><li>The structure shelters underperformers (TeamBank, VR Smart Finanz loss-making; DVB a past failure) — the moat protects the system, not efficiency.<\u002Fli><li>Atruvia's role rises sharply from 1 Jan 2027 (card issuing-processing), concentrating operational risk in the sector's IT utility — a new critical dependency.<\u002Fli><\u002Fol>\n<p><strong>Direct answers to the framing questions.<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li><strong>Most strategically important legal entity:<\u002Fstrong> <strong>DZ BANK AG itself<\u002Fstrong> — the exclusive central institution, group holding company, clearer, custodian and funding hub. R+V and Union Investment are the biggest <em>earners<\u002Fem>, but only the AG is <em>load-bearing<\u002Fem> for the network's plumbing.<\u002Fli><li><strong>Where actual control sits:<\u002Fstrong> with the ~645 primary cooperative banks collectively, exercised through the AGM and an Aufsichtsrat of owner-bank CEOs, coordinated by the BVR — not with Frankfurt management.<\u002Fli><li><strong>Greatest regulatory constraint:<\u002Fstrong> ECB/SSM banking supervision (SREP, P2R, buffers, MREL) layered with <strong>FKAG conglomerate supervision<\u002Fstrong> — the dual banking-plus-insurance perimeter creates the heaviest compliance burden of any EREF subject to date.<\u002Fli><li><strong>What the IPS does / life without it:<\u002Fstrong> it mutualises solvency and liquidity so no member fails, delivering 0% intra-network risk weights and AA ratings. Without it, the sector fragments into standalone-rated, standalone-capitalised banks with higher funding costs and far greater fragility — the decentralised model would likely not survive in its current form.<\u002Fli><li><strong>Greatest external dependency:<\u002Fstrong> the <strong>Eurosystem/ECB nexus<\u002Fstrong> (direct supervision + TARGET2/T2 settlement + monetary operations). Among sector partners, <strong>Atruvia<\u002Fstrong> rises to near-critical from 2027.<\u002Fli><li><strong>Managing owner-vs-competitor conflict:<\u002Fstrong> via the subsidiarity principle, joint/consortium credit that preserves the primary bank's client relationship, and board governance — imperfectly, with periodic public friction (BVR vs DZ BANK over sector Schieflagen).<\u002Fli><li><strong>Most misunderstood by outsiders:<\u002Fstrong> the <strong>perimeter confusion<\u002Fstrong> (AG vs Group vs FinanzGruppe) and the myth that DZ BANK \"owns\" the network — in fact the network owns DZ BANK; plus the false ~20% Atruvia stake (actually ~0.35%; the ~20% is Verimi).<\u002Fli><li><strong>What would take longest to rebuild from zero:<\u002Fstrong> the <strong>IPS's ~90-year track record of zero failures<\u002Fstrong> and the trust and ratings it confers. Capital can be raised in months; a credible, tested, unlimited mutual-protection reputation cannot be manufactured — it is the product of nine decades of not failing.<\u002Fli><\u002Ful>\n<p><strong>(14) Key unknowns.<\u002Fstrong> Precise current MREL requirement (%); individual FY2025 Vorstand remuneration; the register of BGAVs/Patronatserklärungen across subsidiaries; intercompany service-pricing and cost-allocation terms; detailed deferred-tax and uncertain-tax-position figures; any active conduct-enforcement actions.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-recommendations\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Recommendations<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>For an analyst/counterparty:<\u002Fstrong> anchor the credit view on the <strong>network rating and IPS<\u002Fstrong>, not DZ BANK AG's standalone metrics. Monitor BVR-SE/ISG fund adequacy and, above all, any move to change <strong>Article 113(7) CRR<\u002Fstrong> treatment — an EU CMDI (crisis-management/deposit-insurance) reform that removed or diluted IPS privileges would be the single most material negative catalyst for the whole sector. <strong>Threshold:<\u002Fstrong> any EBA/Commission proposal to restrict IPS risk-weighting or force IPS members to co-fund a central EU deposit scheme should trigger a full re-underwrite.<\u002Fli><li><strong>For a competitor:<\u002Fstrong> do not attempt to contest the central-institution mandate directly (structurally impossible). Compete at the <strong>product-factory level<\u002Fstrong> — asset management, consumer credit, payments — where TeamBank (−€29m, losing share to 3.9%) and VR Smart Finanz (−€28m) are visibly under pressure. <strong>Benchmark:<\u002Fstrong> a second consecutive year of TeamBank/VR Smart Finanz losses is the clearest sign of a contestable flank.<\u002Fli><li><strong>For the group itself:<\u002Fstrong> the FY2027 Atruvia card migration concentrates operational risk — DORA-grade resilience, exit and step-in rights should be stress-tested before go-live. As the owner count falls (23 mergers in 2025 alone, to 645 banks), governance weight should shift from constituency politics toward efficiency and independent challenge on the Aufsichtsrat.<\u002Fli><li><strong>Escalation trigger to watch:<\u002Fstrong> a repeat of BayWa/Signa-scale credit events <em>concurrent<\u002Fem> with an R+V investment drawdown would test the P&amp;L and the FKAG conglomerate solvency cover simultaneously — the scenario most likely to force an IPS intervention and the one that would most quickly move the network rating.<\u002Fli><\u002Fol>\n<h2 class=\"hd hd2\" id=\"s-caveats\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Caveats<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Perimeter:<\u002Fstrong> figures are labelled AG / Group / FinanzGruppe / banking-group; do not splice. The €1.175trn figure is the <strong>FinanzGruppe<\u002Fstrong>, not DZ BANK. R+V sits outside the CRR banking-group scope and is captured only at conglomerate level.<\u002Fli><li><strong>Ownership percentages<\u002Fstrong> in subsidiaries are \"rounded\" per DZ BANK's own presentation and vary slightly between sources (e.g. BSH cited as both 96.8% and 97.6%; the investors' presentation shows 98%/92%/93%/97%/96%/93%/100% for the subsidiary block); treated as approximate.<\u002Fli><li><strong>Bank count:<\u002Fstrong> ~645 institutions as of end-November 2025 (23 mergers recorded in 2025, per consultancy zeb) — DZ BANK's own materials still round to \"~700\" or occasionally \"~800,\" reflecting different dates; the owner base is shrinking structurally.<\u002Fli><li><strong><span class=\"ev\">UNKNOWN<\u002Fspan>s flagged<\u002Fstrong> in <a class=\"xr\" href=\"#s-i-12\">I.12<\u002Fa> are genuine evidence gaps, labelled rather than estimated.<\u002Fli><li><strong>Forward-looking / pending items<\u002Fstrong> — FY2026 group PBT guidance of ~€3bn; the card transfer completing 1 January 2027 subject to Bundeskartellamt clearance (case B9-75/26); R+V's €25bn premium / €1.5bn profit 2030 targets — are <strong>company statements or pending approvals, not accomplished facts<\u002Fstrong>.<\u002Fli><li>Some scale figures (VR Payment headcount, DZ PRIVATBANK AuM/AuC) derive from company/secondary profiles and may lag the latest year-end.<\u002Fli><\u002Ful>\n<p><em>End of <a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\">Volume I<\u002Fa>. <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-distribution-and-flow-architecture\">Volume II<\u002Fa> (business model, product economics, flows and competitive dynamics) not begun, per instruction. Work paused at the natural boundary between institutional anatomy and operating economics.<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv><\u002Fsection>\n<section class=\"sec\" data-part=\"2\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part II<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">II<\u002Fspan><\u002Fdiv><h1 id=\"part-ii-part-ii-product-customer-distribution-and-flow-architecture\" class=\"part\" data-short=\"Part II — Product, Customer, Distribution &amp; Flow Architecture\">Product, Customer, Distribution &amp; Flow Architecture<\u002Fh1><p class=\"opener-s\">What the group manufactures, who sells it, and what each party earns for doing so.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">II<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">18<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Commission to primary banks<\u002Fdiv><div class=\"plate-v\">~€1.57bn / yr<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-tl-dr\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR<\u002Fspan><\u002Fa><a href=\"#s-key-findings\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-ii-1\"><span class=\"inpart-n\">II.1<\u002Fspan><span>Product Universe — by Manufacturing Entity<\u002Fspan><\u002Fa><a href=\"#s-ii-2\"><span class=\"inpart-n\">II.2<\u002Fspan><span>The Three-Tier Customer Structure (unusual weight)<\u002Fspan><\u002Fa><a href=\"#s-ii-3\"><span class=\"inpart-n\">II.3<\u002Fspan><span>Customer Segmentation<\u002Fspan><\u002Fa><a href=\"#s-ii-4\"><span class=\"inpart-n\">II.4<\u002Fspan><span>Jobs to Be Done<\u002Fspan><\u002Fa><a href=\"#s-ii-5\"><span class=\"inpart-n\">II.5<\u002Fspan><span>The Distribution Model and Its Economics (priority depth)<\u002Fspan><\u002Fa><a href=\"#s-ii-6\"><span class=\"inpart-n\">II.6<\u002Fspan><span>Money Movement and Clearing<\u002Fspan><\u002Fa><a href=\"#s-ii-7\"><span class=\"inpart-n\">II.7<\u002Fspan><span>Channel Architecture (all channels mapped)<\u002Fspan><\u002Fa><a href=\"#s-ii-8\"><span class=\"inpart-n\">II.8<\u002Fspan><span>Pricing and Revenue Architecture; net extractor or contributor?<\u002Fspan><\u002Fa><a href=\"#s-ii-9\"><span class=\"inpart-n\">II.9<\u002Fspan><span>Product Dependency and Cross-Sell Map<\u002Fspan><\u002Fa><a href=\"#s-ii-11\"><span class=\"inpart-n\">II.11<\u002Fspan><span>The Non-Cooperative Business<\u002Fspan><\u002Fa><a href=\"#s-ii-12\"><span class=\"inpart-n\">II.12<\u002Fspan><span>Failure and Exception Paths<\u002Fspan><\u002Fa><a href=\"#s-ii-13\"><span class=\"inpart-n\">II.13<\u002Fspan><span>Product-Market Evolution (timeline)<\u002Fspan><\u002Fa><a href=\"#s-ii-14\"><span class=\"inpart-n\">II.14<\u002Fspan><span>Volume II Reconstruction<\u002Fspan><\u002Fa><a href=\"#s-recommendations\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a href=\"#s-caveats\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">€534.6bn<\u002Fdiv><div class=\"stat-l\">Union Investment assets under management<\u002Fdiv><\u002Fdiv><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">€22.8bn<\u002Fdiv><div class=\"stat-l\">R+V gross written premiums<\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 class=\"hd hd2\" id=\"s-tl-dr\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">TL;DR<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li>The DZ BANK Group is best understood not as a bank but as a <strong>captive-but-contestable bancassurance and asset-management manufacturing house<\u002Fstrong> whose value lies overwhelmingly in its subsidiaries: in FY2025 R+V (€2,144m pre-tax) and Union Investment (€1,185m) alone produced ~78% of group pre-tax profit of €4,282m (2024: €3,303m), while the parent bank's own franchise (Central Institution &amp; Corporate Bank, €864m) is secondary. The group manufactures products centrally and distributes them through ~645 legally independent cooperative banks (672 at year-end 2024) it does not control but which collectively own it (94.8%).<\u002Fli><li><strong>Distribution is contractually optional, not captive.<\u002Fstrong> Primary banks are free to — and demonstrably do — sell third-party products (documented: Volksbank Mittelhessen brokers Allianz Leben and Generali/Proxalto Leben alongside R+V). The group's dominance rests on Verbundtreue, economic alignment, deep technical embedding in Atruvia's digital rails and habit — not on legal exclusivity. This makes the primary banks the group's customers, distributors, owners and governors simultaneously — a four-role identity that structurally caps how hard the group can push.<\u002Fli><li>The single most important commercial fact is that <strong>value accrues at the point of customer ownership — the primary banks — not at the manufacturer.<\u002Fstrong> The primary banks earned €6.5bn total net commission income in 2024 (of which payments generates ~€3bn, ≈40%); DZ BANK Group's own net fee and commission income was €3,370m in FY2025. The group is simultaneously a net contributor (commissions + dividends flowing down) and a value-retainer (compounding stock margins kept centrally), and on balance functions as a manufacturing utility for its owners rather than a profit-maximiser against them.<\u002Fli><\u002Ful>\n<h2 class=\"hd hd2\" id=\"s-key-findings\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>The two <a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\">Volume I<\u002Fa> discrepancies are resolved.<\u002Fstrong> (a) DZ BANK holds <strong>72.37% of Union Asset Management Holding AG<\u002Fstrong> as of 31 December 2025 (CONFIRMED, Union Investment corporate site/Wikipedia: \"The primary shareholders in Union Investment are DZ Bank with 72.37%… Other shareholders include BBBank and the credit unions through their membership associations\"). The older \"54.44% DZ BANK + 17.72% WGZ BANK\" figure is the pre-2016 structure; the WGZ stake was absorbed when WGZ BANK merged into DZ BANK in 2016, leaving BBBank and the regional cooperative associations holding the residual ~27.6%. (b) <strong>Münchener Hypothekenbank eG is genuinely outside the DZ BANK Group<\u002Fstrong> — an independent registered cooperative (eG) owned by other cooperative banks and ~60,000 cooperative members, an ECB-supervised Significant Institution, and Germany's 2nd-largest mortgage bank (32.2% of the mortgage-bank segment, 2024). The BVR consolidated accounts explicitly treat it as a \"rechtlich selbstständiges, gleichgeordnetes Mutterunternehmen\" <strong>alongside<\u002Fstrong> the DZ BANK Konzern, NOT as a DZ BANK subsidiary. It is therefore an in-sector competitor to DZ HYP and BSH for the same home-financing customer — a standing exception that contradicts a strict \"one champion per product\" reading.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>The product universe decomposes into nine principal manufacturers plus specialist units<\u002Fstrong> (full map in Details), for almost all of which the primary bank contracts as intermediary, the group subsidiary manufactures and books the asset/liability, and the commission flows back to the primary bank.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>The three-tier customer structure is the defining architecture<\u002Fstrong> and differs fundamentally from a normal bank: in tier one, owners = customers = distributors = governors.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>Distribution economics: the manufacturer captures the recurring margin; the distributor captures the commission and owns the relationship and the data.<\u002Fstrong> The clearest published proxy — BVR's \"Provisionserträge aus dem Verbundgeschäft\" — was €2.8bn in 2021 (+15.6%); this specific line was discontinued in the BVR online Jahresberichte after 2021, but the aggregate primary-bank Provisionsüberschuss was €6.5bn in both 2023 and 2024 (BVR Jahresbericht 2024: \"Der Provisionsüberschuss erreichte 2024 insgesamt 6,5 Milliarden Euro beziehungsweise 0,55 Prozent der DBS. Er stieg damit um 3,9 Prozent … der größte Anteil … im Zahlungsverkehr generiert, gefolgt vom Vermittlungs- und Wertpapiergeschäft\").<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>Money movement: DZ BANK is the sector's clearing house<\u002Fstrong>, processing ~9.9bn transactions/year (up from ~7.5bn in 2018), now consolidated onto a single insourced payments platform (migrated 2024), acting as gateway to T2/TARGET2, the SEPA Clearer/EMZ, SCT Inst and the card schemes. Payments has become a genuine profit centre.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>The card business is being restructured<\u002Fstrong>: VR Payment's Issuing-Processing division transfers to Atruvia effective 1 January 2027 (Bundeskartellamt case B9-75/26, notified 15 July 2026). Per Atruvia (2 July 2026), Atruvia will assume \"neben dem Issuing Processing für Debit auch das Kredit-Processing, das bisher bei der DZ BANK Tochter VR Payment lag,\" building one integrated platform spanning girocard, debit and credit; VR Payment refocuses on acquiring, POS network operation and merchant business.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>Failure paths are real and recent.<\u002Fstrong> BayWa: per Handelsblatt (25 Feb 2025), quoting CEO Cornelius Riese, DZ BANK's loss provisions \"mehr als verfünffachte auf 456 Millionen Euro,\" a \"Großteil\" BayWa-related. Signa: per CEO Norbert Rollinger (Bilanzpressekonferenz, 3 April 2024), the engagement was \"in unserem Jahresabschluss 2023 komplett verarbeitet,\" a \"robuster dreistelliger Millionenbetrag,\" yet R+V still posted a ~€1bn IFRS result in 2023 on a +€3.5bn investment result. Both show the group and sector bear real losses and that the shared brand transmits reputational damage into the advisory conversation.<\u002Fli><\u002Fol>\n<h2 class=\"hd hd2\" id=\"s-details\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Details<\u002Fspan><\u002Fh2>\n<h2 class=\"hd hd2\" id=\"s-ii-1\"><span class=\"hn mono\">II.1<\u002Fspan><span class=\"ht\">Product Universe — by Manufacturing Entity<\u002Fspan><\u002Fh2>\n<p>The follow-the-legal-entity rule is decisive: for almost every retail product, the <strong>primary bank contracts as intermediary/agent, the group subsidiary is the manufacturer and books the asset/liability and bears the product risk, and the commission flows back to the primary bank<\u002Fstrong>, which keeps the relationship and the data.<\u002Fp>\n<p><strong>DZ BANK AG — Central Institution &amp; Corporate Bank (CICB) — FY2025 segment €864m pre-tax.<\u002Fstrong> Products: (1) corporate/Mittelstand lending; (2) joint/consortium credit (\"Metakredit\", ~€19.3bn FY2025) where the primary bank keeps the relationship and DZ BANK supplies balance-sheet capacity; (3) structured, project and export finance; (4) intermediation of KfW and Landesförderinstitut promotional loans; (5) capital markets — DZ BANK is <strong>Germany's market leader in structured retail products (Zertifikate)<\u002Fstrong>, especially Zinsanleihen, ahead of LBBW and DekaBank (Handelsblatt); (6) institutional sales, research, FX, rates, derivatives, CLN/securitisation; (7) Treasury; (8) transaction banking (payments, accounts, cash management, trade finance); (9) depositary/custody (custody assets ~€97.4bn, growing via acquisitions); (10) Verbund-specific services to primary banks (liquidity, refinancing, product supply, risk-taking capacity). Classification: mixed direct/external (capital markets, corporates) and Verbund-exclusive (central-bank services).<\u002Fp>\n<p><strong>R+V Versicherung — FY2025 segment €2,144m pre-tax (the single largest profit contributor).<\u002Fstrong> Gross written premiums rose to €22.8bn (2024: €20.9bn). Lines: life/pension, health (first time over €1bn), property/casualty, motor, agricultural and credit insurance, occupational pensions, active reinsurance (R+V Re), and the Italian subsidiary Assimoco (which grew strongly). The Volks- und Raiffeisenbanken are the \"Hauptvertriebsweg,\" with R+V field staff (Außendienst) embedded in \"mehr als 7.500 Bankstellen\"; secondary channels are R+V's own Generalagenturen/Hauptvertretungen, brokers, the Straßenverkehrsgenossenschaften, and (since integrating R+V24 in July 2022) direct. R+V's disclosure that bank-to-insurer referrals (\"Überleitungen\") fell from up to ~320,000 to under 200,000/year as branch visits declined quantifies the erosion of the traditional handoff — a strategic concern that prompted the \"NextLevel\" digitalisation programme. Classification: dual-channel, Verbund-led.<\u002Fp>\n<p><strong>Union Investment (UMH) — FY2025 segment €1,185m pre-tax; AuM €534.7bn year-end 2025.<\u002Fstrong> Retail net inflows €13.5bn (2nd-best year ever, 2024: €12.6bn); institutional net inflows €9.8bn (more than double 2024's €4.7bn); institutional assets €263.8bn; retail assets €270.8bn — a roughly <strong>51/49 retail/institutional split<\u002Fstrong>. Classic fund savings plans passed 4 million (6.55m including Riester/VL). Products: UniFonds retail family, institutional Spezialfonds and mandates, Union Investment Real Estate, Article 8/9 sustainability products, UniProfiRente (Riester), plus Quoniam (quant, ~$22bn) and Attrax. Retail distribution runs through the primary banks and BSH's field force; institutional is won in open competition. Classification: dual (retail Verbund-led; institutional externally competitive).<\u002Fp>\n<p><strong>Bausparkasse Schwäbisch Hall — FY2025 segment €122m pre-tax (doubled from €64m in 2024).<\u002Fstrong> ~7m customers/contracts (&gt;€328bn Bausparsumme in stock); Bauspar market share 33.3% (unchallenged leader). New Bauspar business normalised to €17.6bn (2024: €28.1bn) after the post-rate-shock surge, but jointly-originated Baufinanzierung new business rose 16% to €15.8bn. Owned 97.6% by DZ BANK, ~2.4% by primary banks; ~6,700–6,800 inside/field staff, whose field force <strong>also distributes Union Investment funds<\u002Fstrong>. Additional units: Schwäbisch Hall Wohnen (subsidiary digital advisory channel), the Baufinex B2B marketplace (JV with Hypoport; &gt;8,000 unbound intermediaries, &gt;560 product partners, transaction volume +~40% to €8.3bn). Classification: Verbund-exclusive core (Bauspar) plus platform extensions.<\u002Fp>\n<p><strong>DZ HYP — FY2025 segment €338m pre-tax (down from €479m in 2024 on IFRS own-issuance valuation effects; operating business positive).<\u002Fstrong> Corporate (commercial real estate) new business rose to €9.2bn (2024: €7.2bn); retail new business €1.6bn; total financing portfolio stable at ~€57.6bn; risk provisioning an unremarkable €105m. <strong>Germany's largest Pfandbrief issuer<\u002Fstrong> (multiple €1bn benchmarks placed in 2025). Retail residential lending is intermediated by primary banks via the VR-BaufiComfort cooperation model (bank advises; DZ HYP does full credit processing); DZ HYP paid €45.7m (2023: €32.2m) in Vermittlungsleistungen to primary banks in 2024. The group's \"subsidiäre Betreuung\" of the primary banks is the central element of DZ HYP's model. Classification: dual (direct CRE/public-sector; intermediated retail).<\u002Fp>\n<p><strong>DZ PRIVATBANK — FY2025 segment €106m pre-tax (2024: €112m; dip from lower rates).<\u002Fstrong> Private-banking AuM rose to €30.7bn (2024: €26.1bn), &gt;60% in pure discretionary mandates; AuC ~€181.3bn. Model: HNW clients referred by primary banks under a joint-sales cooperation (\"Verbundvertrieb statt teurem Standalone-Private-Banking\"); the BVR anchored Private Banking as a distinct group business field, seeing \"erhebliches Ertragspotenzial.\" Also: Luxembourg fund services/depositary and foreign-currency lending. Note the Asset Servicing headwind — Flossbach von Storch (&gt;€50bn) departed as a custody client, hitting the FY2025 comparison. Zuwendungsfreie Provisionen paid to primary banks exceeded €130m (up &gt;50% since 2019). Classification: dual (Verbund-referred private banking; third-party Lux fund services).<\u002Fp>\n<p><strong>TeamBank (easyCredit) — FY2025 segment −€29m pre-tax (a loss).<\u002Fstrong> ~1.067m customers (2024: 1.071m); loan book €9,132m (−3.7%); German market share 3.9% (second consecutive slight decline); Austrian (\"der faire Credit\") 12.3%. Products: easyCredit and \"der faire Credit\" instalment loans, plus easyCredit-Ratenkauf/-Rechnung embedded/POS finance (financing €200–10,000; from July 2025 also invoice), with a uniform Ratenkauf rate of 12.99% eff. p.a. regardless of term or credit score; &gt;2,500 cooperative corporate/multichannel merchant partners; 94% of partner banks connected. TeamBank takes the default risk on Ratenkauf. Classification: dual (Verbund consumer lending + externally competitive embedded finance).<\u002Fp>\n<p><strong>VR Smart Finanz — FY2025 segment −€28m pre-tax (a loss; company-reported EGT −€28.3m, prior year −€23.4m).<\u002Fstrong> Total new business €1.18bn (−4.5%); object finance (leasing/hire-purchase) €547m (−10%); Unternehmerkredit (VR Smart flexibel express loan + VR Smart basis) €636m (+1%); portfolio €3.12bn; ~113,000 customers; cost/income 78.6%. Positioned as \"subsidiärer Partner für einfachste Mittelstandslösungen,\" sold via the cooperative online platforms. Classification: Verbund-exclusive SME finance.<\u002Fp>\n<p><strong>VR Payment — ~248 employees.<\u002Fstrong> Merchant acquiring, POS network operation, omnichannel/e-commerce payment, and card issuing-processing (until 31 December 2026, then to Atruvia). Classification: Verbund infrastructure + externally competitive acquiring.<\u002Fp>\n<p><strong>Others:<\u002Fstrong> ReiseBank (cash/FX/precious metals/international cash transfer); CardProcess; VR Equitypartner (PE/mezzanine); VR Factoring; GENO Broker (online brokerage). Classification: mostly Verbund niche.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-2\"><span class=\"hn mono\">II.2<\u002Fspan><span class=\"ht\">The Three-Tier Customer Structure (unusual weight)<\u002Fspan><\u002Fh2>\n<p><strong>Tier (a): the ~645 primary cooperative banks (672 at year-end 2024; ~23–25 mergers/year).<\u002Fstrong> They are simultaneously <strong>owners<\u002Fstrong> (94.8%), <strong>customers<\u002Fstrong> (buying liquidity, refinancing, risk capacity, product supply, transaction infrastructure), <strong>distributors<\u002Fstrong> (selling group products to their own customers and earning commission), and <strong>governors<\u002Fstrong> (populating the Aufsichtsrat, controlling the AGM, and — via the BVR — setting sector strategy). This four-in-one identity is the central structural fact. When the manufacturer's interest (maximise product margin) conflicts with the distributor-owner's interest (maximise retained commission and protect the local relationship), governance is stacked toward the primary banks because they own and govern the manufacturer. This is precisely why the group operates under a <strong>Förderauftrag<\u002Fstrong> — a mandate to strengthen the primary banks' competitiveness — rather than a mandate to maximise its own profit against them. The spread of institutions is wide: average balance sheet ~€1.8bn but median only €0.78bn, ranging from ~€37m (smallest) to ~€52bn (largest) — so \"the primary bank\" is not a homogeneous counterparty.<\u002Fp>\n<p><strong>Tier (b): the primary banks' &gt;30m end customers.<\u002Fstrong> They buy R+V policies, UniFonds, Schwäbisch Hall Bauspar contracts, TeamBank loans and DZ HYP mortgages — largely without knowing DZ BANK exists. The manufacturer books the contract; the local bank owns the relationship and the data. This is the crux of the group's economics: it manufactures for customers it does not own and cannot see directly.<\u002Fp>\n<p><strong>Tier (c): direct clients of DZ BANK AG and subsidiaries<\u002Fstrong> — corporates, institutional investors, other banks/insurers, third-party fund-services clients. This is the genuinely contestable, market-priced business (capital markets, Union institutional mandates, DZ HYP direct CRE, DZ PRIVATBANK Luxembourg fund services, TeamBank external embedded finance).<\u002Fp>\n<p><strong>Product governance (who sets requirements).<\u002Fstrong> The BVR is the sector's strategic apex and holds — unusually, and more than the DSGV does on the Sparkassen side — genuine \"strategische Führungskompetenz,\" setting sector strategy across five defined fields (Finanzmarktstabilität, Zahlungsverkehr, Wettbewerb, Nachhaltigkeit, Wohlstandssicherung). Product entry into the Verbund catalogue and cross-subsidiary arbitration run through BVR committees and Fachräte and the group's product-governance processes. The manufacturers hold the product economics, but the primary banks — through the BVR and the Aufsichtsrat — hold the ultimate go/no-go on what the network pushes. (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> where specific committee names are not individually published; the BVR's strategic-leadership role and the Fachrat structure are CONFIRMED.)<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-3\"><span class=\"hn mono\">II.3<\u002Fspan><span class=\"ht\">Customer Segmentation<\u002Fspan><\u002Fh2>\n<p><strong>Tier (a) primary banks:<\u002Fstrong> by size (large urban Volksbanken with tens of billions in assets vs small rural Raiffeisenbanken under €100m); by region (the persistent ex-DG south vs ex-WGZ north constituency); by product-adoption depth; and by whether they are net placers or net takers of liquidity with DZ BANK. Roughly one in ten also runs a Warengeschäft (commodity trading) — 49 institutions in 2024 (2023: 55) — the sub-segment most directly exposed to BayWa-type agricultural-commodity risk. <strong>Tier (b) end customers:<\u002Fstrong> retail; private banking/HNW (DZ PRIVATBANK); self-employed/Mittelstand (VR Smart Finanz, CICB); agricultural (R+V, the Warengeschäft banks); public sector (DZ HYP). <strong>Tier (c) direct clients:<\u002Fstrong> large corporates; institutional investors (Union €263.8bn institutional); other financial institutions (Zertifikate buyers, custody clients); international clients through foreign branches. Earnings-driver mapping: R+V and Union dominate group profit (~78%); CICB drives corporate/capital-markets earnings; BSH/DZ HYP the housing chain; TeamBank/VR Smart Finanz are currently loss-making.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-4\"><span class=\"hn mono\">II.4<\u002Fspan><span class=\"ht\">Jobs to Be Done<\u002Fspan><\u002Fh2>\n<p>For a <strong>primary bank<\u002Fstrong>: \"give me products I cannot manufacture\" (all subsidiaries); \"give me liquidity/refinancing and risk-taking capacity\" (CICB, Metakredit ~€19.3bn); \"give me capital-markets access\" (CICB); \"give me payment/settlement infrastructure\" (DZ BANK clearing, ~9.9bn transactions); \"let me stay a full-service bank at small scale\" — the meta-job the entire group exists to serve. For <strong>end customers<\u002Fstrong>: Bauspar = disciplined home-savings plus rate insurance; UniFonds savings plan = automated long-horizon wealth-building; R+V policy = risk protection; sc-camel-easy-credit = fair, transparent instalment liquidity. Competitive substitutes: DekaBank/LBS/Provinzial-SV (the near-identical Sparkassen manufacture-and-distribute model — the single most useful benchmark) and direct players ING, DWS, Allianz, Check24/Smava. For <strong>direct clients<\u002Fstrong>: cooperative-sector reach, Pfandbrief funding depth, strong ratings (S&amp;P A+, Moody's Aa2, Fitch AA-) and a non-listed, stable counterparty.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-5\"><span class=\"hn mono\">II.5<\u002Fspan><span class=\"ht\">The Distribution Model and Its Economics (priority depth)<\u002Fspan><\u002Fh2>\n<p><strong>The manufacture-and-distribute chain (6 steps):<\u002Fstrong> (1) a subsidiary manufactures the product; (2) it enters the Verbund catalogue; (3) each primary bank independently decides whether to sell it; (4) the bank's adviser sells to the end customer; (5) the contract sits with the manufacturing entity, which books the asset/liability and bears the product risk; (6) commission flows back to the primary bank, which keeps the relationship and the data.<\u002Fp>\n\n<figure class=\"fig\" id=\"fig-8\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 8<\u002Fspan><span class=\"fig-t\">The Manufacture-and-Distribute Chain<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px\">\n  <div class=\"f-box\"><div class=\"f-lbl\">Step 1<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">Subsidiary manufactures<\u002Fdiv><div class=\"f-meta\">R+V, Union Investment, BSH, DZ HYP, TeamBank build and carry the product<\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box\"><div class=\"f-lbl\">Step 2<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">Product enters the Verbund catalogue<\u002Fdiv><div class=\"f-meta\">Offered to the ~645 primary banks as one option among several<\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box gold\"><div class=\"f-lbl\">Step 3 · the hinge<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">The primary bank chooses whether to sell<\u002Fdiv><div class=\"f-meta\"><strong>Legally optional.<\u002Fstrong> No contract compels distribution of a group product.<\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box\"><div class=\"f-lbl\">Step 4<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">Adviser sells to the end customer<\u002Fdiv><div class=\"f-meta\">In the branch, in the app, or through the bank's own advisory channel<\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box\"><div class=\"f-lbl\">Step 5<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">Contract sits with the manufacturer<\u002Fdiv><div class=\"f-meta\">Balance-sheet risk, reserves and capital stay with the subsidiary<\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box solid\"><div class=\"f-lbl\" style=\"color:var(--acc-dk)\">Step 6<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">Commission flows back to the primary bank<\u002Fdiv><div class=\"f-meta\">Which keeps the customer relationship — and the data<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px\">\n  <div class=\"cal\"><div class=\"cal-k\">What the group buys each year<\u002Fdiv><div class=\"cal-b\">Roughly <span class=\"mono\">€1.57bn<\u002Fspan> in commissions paid to the owner-banks for shelf space<\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box\"><div class=\"f-lbl\">What the group does not own<\u002Fdiv><div class=\"f-meta\" style=\"margin-top:4px\">The customer relationship, the branch, the adviser, and the decision to sell at all<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\"><b>No contract compels a primary bank to sell group products.<\u002Fb> Shelf space is won on merit and roughly €1.57bn a year in commissions.<\u002Ffigcaption><\u002Ffigure>\n\n\n<p><strong>Is distribution exclusive or optional? — OPTIONAL. This is the single most important commercial finding of the volume.<\u002Fstrong> A primary bank is NOT contractually obliged to sell only group products. Documented evidence: Volksbank Mittelhessen operates as a tied insurance agent (gebundener Versicherungsvertreter, §34d Abs. 7 Nr. 1 GewO) on the basis of R+V products, <strong>but its own mandatory disclosure states it simultaneously brokers Allianz Lebensversicherung and Generali/Proxalto Leben<\u002Fstrong> and receives commission from each. German case law (BGH, 30 January 2014, I ZR 19/13) confirms that tied agents may sell third-party products complementing the principal's range. The commercial implication is profound: the group must compete for shelf space inside its own network. Its dominance therefore rests on Verbundtreue (loyalty norms), economic alignment (the banks own the manufacturers and share the upside), deep technical embedding in Atruvia's rails, and inertia — not on captivity. Where a competing product is materially better or better-remunerated, a primary bank can and sometimes does place it. Münchener Hyp's independent existence as an in-sector mortgage alternative is the structural proof.<\u002Fp>\n<p><strong>The commission economics.<\u002Fstrong> The clearest published measure of what the primary banks earn from distributing group products is the BVR series \"Provisionserträge der Genossenschaftsbanken aus dem Verbundgeschäft,\" which was <strong>€2.8bn in 2021 (+15.6%)<\u002Fstrong> against off-balance-sheet customer volume of €588bn (investments €473bn, credit €115bn). CAVEAT: this specific line was not carried forward in the same wording in the BVR online Jahresberichte for 2022–2024; it may survive only in the downloadable statistical annex. The available proxy is the aggregate primary-bank Provisionsüberschuss: €6.5bn in 2023 (0.56% of average total assets, +4.3%) and €6.5bn again in 2024 (0.55%, +3.9%), with payments the largest component (~€3bn) and the Vermittlungs-/Wertpapiergeschäft (brokering Verbund products) the second. Set against DZ BANK Group's own net fee and commission income of €3,370m (FY2025), the two sides are of comparable magnitude: <strong>the network captures roughly as much in distribution commission as the manufacturer captures in total net fees.<\u002Fstrong> Value is split — the manufacturer captures the recurring management/underwriting margin (which compounds on stock: Union's €534.7bn AuM, R+V's premium base), while the distributor captures the up-front and trailing commission plus, crucially, the relationship and the data. (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: because the ~€2.8bn Verbund figure and the €6.5bn aggregate overlap but are not on identical perimeters, they should not be summed.)<\u002Fp>\n<p><strong>Verbund-internal competition<\u002Fstrong> is real and only partly managed: Union Investment vs R+V for the same savings euro; BSH vs DZ HYP vs the independent Münchener Hyp for the same home-financing customer; TeamBank vs the primary bank's own overdraft for consumer credit. The \"one champion per product\" principle mitigates but does not eliminate this, and Münchener Hyp's independence is a permanent exception.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-6\"><span class=\"hn mono\">II.6<\u002Fspan><span class=\"ht\">Money Movement and Clearing<\u002Fspan><\u002Fh2>\n<p>DZ BANK is the sector's cash-clearing, settlement and gateway institution, handling ~9.9bn transactions/year (up from ~7.5bn in 2018), now consolidated onto a single <strong>insourced<\u002Fstrong> platform (migration completed 2024, deliberately one year later than planned to absorb T2 consolidation, ISO 20022 and SEPA changes). The company contrasts its insourcing approach with Commerzbank's outsourcing. Flows kept analytically separate:<\u002Fp>\n<p>(a) <strong>Payments/clearing<\u002Fstrong> — gateway to T2/TARGET2 for large-value interbank settlement (staggered pricing, ~€0.80/transaction at low volume), the SEPA Clearer/EMZ for retail bulk (~€0.0025 per transaction in bulk files of up to 100,000), SCT Inst, and the card schemes. (b) <strong>Liquidity<\u002Fstrong> — primary banks' surplus deposits placed with, and refinancing drawn from, DZ BANK, which manages the resulting balance sheet. (c) <strong>Securities settlement/custody<\u002Fstrong> (~€97.4bn custody). (d) <strong>Risk transfer<\u002Fstrong> — Metakredit ~€19.3bn, syndication, risk participation. (e) <strong>Commissions/revenue-share<\u002Fstrong> back to primary banks. (f) <strong>Capital and dividends<\u002Fstrong> up to the owner-banks. Payments is now an explicit profit centre: ~€3bn of the primary banks' commission income (≈40% of their commission earnings) is payments-related, up from ~€1.8bn a decade earlier.<\u002Fp>\n<p><strong>Representative end-to-end flows.<\u002Fstrong> A <em>SEPA credit transfer<\u002Fem> initiated at a Volksbank routes through Atruvia's core system → DZ BANK as the bank's clearer → the SEPA Clearer/EMZ (near-zero marginal cost) → beneficiary bank; DZ BANK earns a thin per-transaction fee, the primary bank books account/payment commission, DZ BANK holds settlement risk intraday, the primary bank holds the regulatory customer relationship. A <em>SEPA instant payment<\u002Fem> routes in real time via the RT1/TIPS rails with DZ BANK as gateway. A <em>girocard/credit-card transaction<\u002Fem> today runs acquiring via VR Payment and issuing-processing via VR Payment (credit) / Atruvia (debit); <strong>from 1 January 2027 all issuing-processing consolidates at Atruvia<\u002Fstrong> and VR Payment retains acquiring/POS/merchant. A <em>corporate loan<\u002Fem> jointly originated by a primary bank and DZ BANK (Metakredit) leaves the relationship and covenant with the primary bank while DZ BANK books its participation and shares the credit risk. A <em>Union fund purchase<\u002Fem> is advised and booked by the primary bank as intermediary, the fund sits at Union, Union earns the management fee and pays the bank trailing commission. An <em>R+V policy sale<\u002Fem> is written by R+V, contracted with the customer via the tied-agent bank, with R+V bearing underwriting risk and paying the bank acquisition/renewal commission.<\u002Fp>\n<p>A critical control fact: <strong>DZ BANK holds only ~0.35% of Atruvia<\u002Fstrong> (the ~20% figure sometimes cited refers to Verimi and is erroneous). The sector's primary digital rail — the VR Banking App, OnlineBanking, the BankingWorkspace and the Omnikanalplattform (live since 2019) — is controlled by Atruvia, not DZ BANK. The group manufactures the products but does not own the increasingly dominant digital channel through which they are sold, and from 2027 will not own card issuing-processing either.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-7\"><span class=\"hn mono\">II.7<\u002Fspan><span class=\"ht\">Channel Architecture (all channels mapped)<\u002Fspan><\u002Fh2>\n<p>(1) <strong>Primary-bank branch network<\u002Fstrong> (~7,000 Bankstellen) — the dominant channel; not DZ-controlled. (2) <strong>Primary-bank digital channels on Atruvia's platform<\u002Fstrong> (VR Banking App — one of the best-rated German banking apps at 4.5/4.7 stars, increasingly a sales channel via \"Produktabschlussstrecken\") — Atruvia-controlled. (3) <strong>Subsidiary-direct digital<\u002Fstrong> (easyCredit embedded finance,
