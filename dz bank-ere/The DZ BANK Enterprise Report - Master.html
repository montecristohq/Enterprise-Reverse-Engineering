Union online, R+V direct, GENO Broker) — DZ-group-controlled. (4) <strong>BSH's and R+V's own field forces<\u002Fstrong> (R+V embedded in bank branches; BSH field force also sells Union funds). (5) <strong>DZ BANK AG direct corporate/institutional coverage.<\u002Fstrong> (6) <strong>Foreign branches/representative offices.<\u002Fstrong> (7) <strong>Broker/intermediary channels<\u002Fstrong> (Baufinex; R+V brokers). (8) <strong>Third-party/embedded distribution outside the sector<\u002Fstrong> (easyCredit-Ratenkauf merchants; Atruvia itself now serving non-cooperative clients such as Bankhaus C.L. Seeliger and ADAC). Strategic importance is shifting from (1) toward (2), which raises the Atruvia channel-control question.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-8\"><span class=\"hn mono\">II.8<\u002Fspan><span class=\"ht\">Pricing and Revenue Architecture; net extractor or contributor?<\u002Fspan><\u002Fh2>\n<p>Pricing to <strong>tier (a)<\u002Fstrong> primary banks blends cost-plus/subsidised central-bank services (liquidity, refinancing, product supply) with market-based capital-markets pricing. To <strong>tier (b)<\u002Fstrong> end customers, retail product pricing is largely set by the <strong>manufacturer<\u002Fstrong> (easyCredit's uniform 12.99% Ratenkauf rate; BSH tariffs; Union fund fees), with the distributor earning commission. To <strong>tier (c)<\u002Fstrong> direct clients, full market pricing applies. The <strong>Förderauftrag<\u002Fstrong> means DZ BANK is expected to operate for its owners' benefit rather than to maximise profit against them.<\u002Fp>\n<p><strong>Testing the \"captive supplier's profit is a levy in disguise\" hypothesis<\u002Fstrong> (carried from the Atruvia finding): DZ BANK pays dividends up to the owner-banks AND pays them distribution commissions, while retaining product margins centrally. On balance the group is best read as a <strong>net contributor / manufacturing utility at the flow level<\u002Fstrong>: the €6.5bn of commission income the primary banks earn (a large share Verbund-derived) plus the dividend stream materially exceeds what a stand-alone profit-maximiser would return, and the stated mandate constrains extraction. <strong>However, at the stock level the group is a value-retainer<\u002Fstrong>: the manufacturers keep the compounding AuM/premium margins the primary banks never see. So the correct characterisation is nuanced — a contributor on annual flows, a retainer of durable franchise value. Unlike the pure-levy Atruvia case, DZ BANK's reported profit is not simply a disguised charge on the owners, because most of it is generated in genuinely external markets (insurance underwriting, capital markets, institutional asset management) rather than extracted from the network.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-9\"><span class=\"hn mono\">II.9<\u002Fspan><span class=\"ht\">Product Dependency and Cross-Sell Map<\u002Fspan><\u002Fh2>\n<p>Prerequisite/anchor: the current account at the primary bank, with DZ BANK payment services behind it. From there: savings → Union funds; home → BSH Bauspar + DZ HYP mortgage; protection → R+V; consumer credit → TeamBank; SME → VR Smart Finanz + VR Payment. Highest-margin (stock-compounding): Union AuM and R+V life/health. Retention products: current account and Bauspar (long contractual life). Current loss leaders: TeamBank and VR Smart Finanz (both loss-making FY2025). The binding constraint on cross-sell is that the <strong>primary bank owns the relationship and the data<\u002Fstrong>, so group-wide cross-sell depends on the bank's willingness and on Atruvia's Smart-Data tools (Truuco, the DZ BANK/Atruvia JV founded November 2022) rather than on manufacturer initiative. The fall in R+V referrals from ~320,000 to &lt;200,000/year is the sharpest available evidence that the traditional cross-sell handoff is weakening as footfall declines — which is precisely why the group is investing in data-driven omnichannel cross-sell.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-11\"><span class=\"hn mono\">II.11<\u002Fspan><span class=\"ht\">The Non-Cooperative Business<\u002Fspan><\u002Fh2>\n<p>Genuinely competitive revenue: DZ BANK AG direct corporate/Mittelstand lending and capital-markets/Zertifikate sold to non-cooperative institutions (market leader in Zertifikate); Union Investment institutional mandates (€263.8bn; net inflows doubled to €9.8bn in 2025) won in open competition; R+V non-Verbund distribution (brokers; Assimoco/Italy; the CCB and ICCREA bancassurance partnerships in Italy); DZ HYP direct CRE and public-sector lending; DZ PRIVATBANK Luxembourg third-party fund services; TeamBank external embedded finance (&gt;2,500 merchant partners). The owner-competitor conflict is managed by the joint/consortium-credit convention (the primary bank keeps the corporate relationship even when DZ BANK provides the balance sheet), but friction surfaced publicly in 2024–2025 (BVR vs DZ BANK over sector Schieflagen including BayWa; R+V's Signa losses). The non-cooperative business is a deliberate growth strategy in institutional asset management, custody and capital markets, and more of a by-product in retail lines. (Exact Verbund vs non-Verbund revenue split is <span class=\"ev\">UNKNOWN<\u002Fspan> at group level — not disclosed.)<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-12\"><span class=\"hn mono\">II.12<\u002Fspan><span class=\"ht\">Failure and Exception Paths<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Credit event on a joint/consortium loan — BayWa (documented):<\u002Fstrong> per Handelsblatt (25 Feb 2025) quoting CEO Cornelius Riese, DZ BANK's loss provisions \"mehr als verfünffachte auf 456 Millionen Euro,\" a \"Großteil\" BayWa-related. The Bavarian cooperative banks hold ~one-third of BayWa via their BRB vehicle and had already written down 60% of a €220m Schuldscheindarlehen (€132m) in the 2024 accounts, with further write-downs to potential total loss flagged by the GVB; DZ BANK and HVB were negotiating a standstill to autumn 2026. Loss borne by the lending banks and DZ BANK; end customers unaffected; reputational damage to the shared brand and a governance flashpoint between the sector and DZ BANK.<\u002Fli><li><strong>Investment loss at R+V — Signa (documented):<\u002Fstrong> fully written off in the 2023 accounts as a \"robuster dreistelliger Millionenbetrag\" (CEO Rollinger: \"in unserem Jahresabschluss 2023 komplett verarbeitet\"), yet R+V still posted a ~€1bn IFRS result on a +€3.5bn investment result. Loss borne by R+V's balance sheet; policyholders unaffected — but Rollinger acknowledged the topic recurs in customer advisory conversations, direct evidence that shared-brand reputational risk transmits to the sales front line.<\u002Fli><li><strong>Payment/clearing outage:<\u002Fstrong> DZ BANK owns the problem as central clearer; the consolidation onto one insourced platform raises single-point concentration risk against the efficiency gain.<\u002Fli><li><strong>Mis-selling / claims / fund liquidity / primary bank in difficulty:<\u002Fstrong> the BVR's dual protection scheme (Sicherungseinrichtung des BVR + BVR Institutssicherung GmbH) backstops a primary bank in difficulty, funded sector-wide and focused on prevention of Schieflagen. This mutualisation of failure is the ultimate reason distribution loyalty holds: the banks are bound together by a shared safety net, which reinforces Verbundtreue even though product distribution itself is legally optional.<\u002Fli><\u002Ful>\n<h2 class=\"hd hd2\" id=\"s-ii-13\"><span class=\"hn mono\">II.13<\u002Fspan><span class=\"ht\">Product-Market Evolution (timeline)<\u002Fspan><\u002Fh2>\n<p>2001 DG BANK/GZ-Bank merger → DZ BANK; 2016 WGZ BANK merger (also absorbing WGZ's Union stake); 2018 DZ HYP formed from DG HYP + WL BANK; 2019 Atruvia Omnikanalplattform live; <strong>12 August 2022 DVB Bank defunct<\u002Fstrong> (exit from non-core, non-Verbund product lines — the clearest signal of the \"one champion per product\" discipline); November 2022 DZ BANK/Atruvia Smart-Data JV (Truuco, live April 2023); 2023 growth of insurance + asset management to ~78% of group profit; 2024 payments consolidated onto one platform; 2 July 2026 card-business reorganisation announced (issuing-processing to Atruvia from 1 January 2027); ongoing strategy programmes \"Verbund First 4.0\" (DZ BANK), \"NextLevel\" (R+V), \"#Fokus100\" (BSH), \"Fit for Future\" (UMH), \"Strategie 2028\" (TeamBank), \"DZ PRIVATBANK 2030.\" Direction of travel under the current Vorstand (sole CEO Cornelius Riese since 1 July 2024): consolidate infrastructure, deepen the Verbund distribution rail digitally, and lean on insurance and asset management as the profit engine.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-ii-14\"><span class=\"hn mono\">II.14<\u002Fspan><span class=\"ht\">Volume II Reconstruction<\u002Fspan><\u002Fh2>\n<p><strong>(1) Product architecture by manufacturer:<\u002Fstrong> CICB (corporate/capital-markets/transaction/central-bank); R+V (insurance/reinsurance); Union (funds/mandates); BSH (Bauspar/Baufi); DZ HYP (CRE/public/Pfandbrief); DZ PRIVATBANK (wealth/Lux fund services); TeamBank (consumer/embedded credit); VR Smart Finanz (SME leasing/loans); VR Payment (acquiring/POS/issuing to 2026); specialists (ReiseBank, CardProcess, VR Equitypartner, VR Factoring, GENO Broker).<\u002Fp>\n<p><strong>(2) Three-tier customer map:<\u002Fstrong> (a) ~645–672 primary banks = owners+customers+distributors+governors; (b) &gt;30m end customers owned by the primary banks; (c) direct corporate/institutional/third-party clients.<\u002Fp>\n<p><strong>(3) Customer-segment map:<\u002Fstrong> primary banks by size/region/product-depth/liquidity-position (incl. 49 Warengeschäft banks); end customers by retail/HNW/Mittelstand/agricultural/public; direct clients by corporate/institutional/FI/international.<\u002Fp>\n<p><strong>(4) Jobs-to-be-done:<\u002Fstrong> primary banks buy manufacturing, liquidity, risk capacity, capital-markets access and payment infrastructure to remain full-service at small scale; end customers buy home-savings, wealth-building, protection and liquidity.<\u002Fp>\n<p><strong>(5) Manufacture-and-distribute chain:<\u002Fstrong> manufacture → catalogue → optional bank adoption → adviser sale → contract with manufacturer → commission to bank (bank keeps relationship + data).<\u002Fp>\n<p><strong>(6) Commission/revenue-share economics:<\u002Fstrong> €2.8bn Verbund commission (2021, last confirmed) within €6.5bn aggregate primary-bank Provisionsüberschuss (2023 &amp; 2024); vs DZ BANK Group net fee income €3,370m (FY2025). Manufacturer keeps stock margin; distributor keeps flow commission + relationship.<\u002Fp>\n<p><strong>(7) Money-movement/clearing flows:<\u002Fstrong> ~9.9bn transactions/year via one insourced platform; T2/SEPA/SCT Inst/cards; liquidity, custody, risk-transfer, commissions and dividends as separate flows; card issuing-processing to Atruvia 2027.<\u002Fp>\n<p><strong>(8) Channel architecture:<\u002Fstrong> 8 channels; shift from branch to Atruvia digital rail (which DZ BANK does not control).<\u002Fp>\n<p><strong>(9) Pricing by tier:<\u002Fstrong> subsidised/cost-plus + market to primary banks; manufacturer-set retail pricing; market pricing to direct clients.<\u002Fp>\n<p><strong>(10) Product dependency/cross-sell:<\u002Fstrong> current account anchor → funds/home/protection/credit; Union &amp; R+V highest-margin; cross-sell gated by primary banks' relationship ownership.<\u002Fp>\n<p><strong>(11) Verbund vs non-Verbund:<\u002Fstrong> growing genuine external business in institutional AM, custody, capital markets, Italy; exact split <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fp>\n<p><strong>(12) Failure/exception map:<\u002Fstrong> BayWa (€456m provisions), Signa (three-digit-million write-off), clearing concentration, IPS mutualisation.<\u002Fp>\n<p><strong>(13) Product-market evolution:<\u002Fstrong> consolidation to one-champion, DVB exit, insurance/AM ascendancy, digital distribution, payments/card restructuring.<\u002Fp>\n<p><strong>(14) Key unknowns:<\u002Fstrong> per-product commission rates and revenue splits; exact Verbund vs non-Verbund revenue split; R+V in-branch Außendienst headcount; number of cooperative banks connected to VR Smart Finanz; the post-2021 Verbundgeschäft commission series.<\u002Fp>\n<p><strong>(15) Ten most important conclusions:<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li>Value lives in the subsidiaries (R+V + Union = ~78% of profit); the parent bank is a utility.<\u002Fli><li>Distribution is legally optional — the group competes for its own shelf space.<\u002Fli><li>The primary banks own the relationship and the data; the group manufactures blind to the end customer.<\u002Fli><li>The manufacturer keeps the compounding stock margin; the distributor keeps the flow commission.<\u002Fli><li>Best economics: Union Investment (asset-light, compounding fees) and R+V life/health.<\u002Fli><li>Worst economics: TeamBank and VR Smart Finanz (both loss-making FY2025).<\u002Fli><li>Strategically most important despite not being the largest: payments/transaction banking — the infrastructural glue and now a profit centre feeding ~40% of the primary banks' commission.<\u002Fli><li>The owner-competitor conflict is resolved by the Förderauftrag plus the joint-credit convention, but friction is real (BayWa).<\u002Fli><li>The group does not control its own primary digital channel (Atruvia, ~0.35% stake) — a growing strategic vulnerability.<\u002Fli><li>Münchener Hyp's independence is a permanent breach in the \"one champion per product\" ideal.<\u002Fli><\u002Fol>\n<p><strong>Central question — is DZ BANK Group a bank, a bancassurance manufacturer, a distribution utility, or a holding company?<\u002Fstrong> It is primarily a <strong>holding company whose value lies in its subsidiaries, operating as a bancassurance/asset-management manufacturer for a distribution network it does not control and cannot compel.<\u002Fstrong> It is a bank only in the narrow CICB/clearing sense. The defining tension — manufacturing for owners who are also its distributors and governors — means it behaves less like a profit-maximising financial conglomerate and more like a <strong>member-serving manufacturing-and-infrastructure utility<\u002Fstrong> whose profitability is a means to the Förderauftrag, not the end.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-recommendations\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Recommendations<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>Value the group sum-of-the-parts, leading with the subsidiaries.<\u002Fstrong> R+V and Union Investment are the crown jewels; the parent bank is a utility. Any analysis that leads with \"the bank\" misreads the entity. Threshold to revisit: if R+V + UMH fall below ~60% of group pre-tax profit for two consecutive years.<\u002Fli><li><strong>Monitor distribution loyalty, not distribution contracts.<\u002Fstrong> Because distribution is legally optional, the leading indicator of group health is the primary banks' continued willingness to sell group products. Track the aggregate primary-bank Provisionsüberschuss and (if republished) the Verbundgeschäft commission line; a sustained fall in the Vermittlungs-/Wertpapier component alongside rising third-party placement would signal shelf-space erosion.<\u002Fli><li><strong>Treat the Atruvia channel-control question as the top strategic risk.<\u002Fstrong> The group manufactures products but does not control the digital rail (VR Banking App) or, from 2027, card issuing-processing. Watch whether Atruvia begins onboarding non-Verbund product manufacturers into the app's Abschlussstrecken — that would directly threaten the group's captive shelf.<\u002Fli><li><strong>Put TeamBank and VR Smart Finanz on watch.<\u002Fstrong> Two consecutive loss years plus declining market share (TeamBank 3.9%) raise the question of whether they remain \"champions\" or become DVB-style disposal candidates. Trigger: a third loss year or a strategic review announcement.<\u002Fli><li><strong>Price the shared-brand reputational channel.<\u002Fstrong> BayWa and Signa show that sector-level events transmit into the advisory conversation and into DZ BANK's own P&amp;L. Any single-name exposure large enough to require sector IPS discussion should be treated as a group-brand event, not merely a balance-sheet event.<\u002Fli><\u002Fol>\n<h2 class=\"hd hd2\" id=\"s-caveats\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Caveats<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Product-level economics remain the hard limit.<\u002Fstrong> Commission rates, revenue splits with primary banks and per-product margins are largely unpublished. The €2.8bn Verbundgeschäft commission figure is 2021 and the specific line appears discontinued in the BVR online Jahresberichte thereafter; the €6.5bn aggregate Provisionsüberschuss (2023 and 2024) is a broader proxy that includes non-Verbund commission. The two are on different perimeters and must not be summed. Where exact splits are unavailable they are labelled <span class=\"ev\">UNKNOWN<\u002Fspan> rather than estimated.<\u002Fli><li>The precise headcount of R+V Außendienst staff working inside bank branches is not disclosed (only \"7,500+ Bankstellen served\"); the exact number of cooperative banks connected to VR Smart Finanz is not in the primary 2025 source.<\u002Fli><li>The \"subsidiäre Betreuung\" model is confirmed for DZ HYP generally but not quoted verbatim in 2025 releases.<\u002Fli><li>Segment pre-tax figures are IFRS group-segment values; several subsidiary press releases quote HGB or sub-group numbers on slightly different perimeters, labelled where they diverge (e.g. R+V group IFRS pre-tax ~€2.22bn vs DZ BANK segment €2,144m; BSH €122m IFRS). The four perimeters (DZ BANK AG / DZ BANK Group IFRS / Genossenschaftliche FinanzGruppe ~€1.175trn / CRR prudential scope) are kept distinct throughout; product volumes routinely quoted at sector level (Bauspar contracts, insured risks, &gt;30m customers) belong to the FinanzGruppe, not the DZ BANK Group.<\u002Fli><li>Forward-looking items (2026 guidance ~€3.0bn group pre-tax; DZ HYP's expected lower 2026 distributable result) are management projections, not facts.<\u002Fli><li>This is <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-distribution-and-flow-architecture\">Volume II<\u002Fa> (Product, Customer, Distribution &amp; Flow). Detailed financial analysis (margins, capital, per-segment profitability decomposition) belongs to <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Volume IV<\u002Fa> and is deliberately not attempted here.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv><\u002Fsection>\n<section class=\"sec\" data-part=\"3\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part III<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">III<\u002Fspan><\u002Fdiv><h1 id=\"part-iii-part-iii-operations-technology-data-risk-infrastructure-and-organisational-des\" class=\"part\" data-short=\"Part III — Operations, Technology, Data, Risk Infrastructure &amp; Organisational Design\">Operations, Technology, Data, Risk Infrastructure &amp; Organisational Design<\u002Fh1><p class=\"opener-s\">How seven regulated operating models run as one federated group — and where the rails are not owned.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">III<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">23<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Own core systems<\u002Fdiv><div class=\"plate-v\">SAP S/4HANA · Murex<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-the-dz-bank-group-as-a-federated-operating-model\"><span class=\"inpart-n\"><\u002Fspan><span>The DZ BANK Group as a Federated Operating Model<\u002Fspan><\u002Fa><a href=\"#s-tl-dr\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR<\u002Fspan><\u002Fa><a href=\"#s-key-findings\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-iii-1\"><span class=\"inpart-n\">III.1<\u002Fspan><span>The Federated Operating Model<\u002Fspan><\u002Fa><a href=\"#s-iii-2\"><span class=\"inpart-n\">III.2<\u002Fspan><span>Payments, Clearing and Settlement Operations — PRIORITY DEPTH<\u002Fspan><\u002Fa><a href=\"#s-iii-3\"><span class=\"inpart-n\">III.3<\u002Fspan><span>Treasury, Liquidity and Balance-Sheet Operations<\u002Fspan><\u002Fa><a href=\"#s-iii-4\"><span class=\"inpart-n\">III.4<\u002Fspan><span>Technology Architecture — PRIORITY DEPTH, MOST EVIDENCE-CONSTRAINED<\u002Fspan><\u002Fa><a href=\"#s-iii-5\"><span class=\"inpart-n\">III.5<\u002Fspan><span>Build, Buy, Outsource and the Atruvia Boundary<\u002Fspan><\u002Fa><a href=\"#s-iii-6\"><span class=\"inpart-n\">III.6<\u002Fspan><span>Insurance Operations (R+V) — real depth<\u002Fspan><\u002Fa><a href=\"#s-iii-7\"><span class=\"inpart-n\">III.7<\u002Fspan><span>Asset-Management Operations (Union Investment) — depth<\u002Fspan><\u002Fa><a href=\"#s-iii-8\"><span class=\"inpart-n\">III.8<\u002Fspan><span>Credit, Lending and Real-Estate Operations<\u002Fspan><\u002Fa><a href=\"#s-iii-9\"><span class=\"inpart-n\">III.9<\u002Fspan><span>Risk, Finance and Regulatory-Reporting Infrastructure — PRIORITY DEPTH<\u002Fspan><\u002Fa><a href=\"#s-iii-10\"><span class=\"inpart-n\">III.10<\u002Fspan><span>Data Architecture and Governance<\u002Fspan><\u002Fa><a href=\"#s-iii-11\"><span class=\"inpart-n\">III.11<\u002Fspan><span>Cyber, Security and Operational Resilience<\u002Fspan><\u002Fa><a href=\"#s-iii-12\"><span class=\"inpart-n\">III.12<\u002Fspan><span>Reliability Engineering and Failure Paths<\u002Fspan><\u002Fa><a href=\"#s-iii-13\"><span class=\"inpart-n\">III.13<\u002Fspan><span>Employee Architecture<\u002Fspan><\u002Fa><a href=\"#s-iii-14\"><span class=\"inpart-n\">III.14<\u002Fspan><span>Organisational Design and Decision Rights<\u002Fspan><\u002Fa><a href=\"#s-iii-15\"><span class=\"inpart-n\">III.15<\u002Fspan><span>Operating Leverage and Cost Architecture<\u002Fspan><\u002Fa><a href=\"#s-iii-16\"><span class=\"inpart-n\">III.16<\u002Fspan><span>Operations and Technology as Competitive Advantage<\u002Fspan><\u002Fa><a href=\"#s-iii-17\"><span class=\"inpart-n\">III.17<\u002Fspan><span>Volume III Reconstruction<\u002Fspan><\u002Fa><a href=\"#s-recommendations\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a href=\"#s-caveats\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats\" style=\"max-width:520px\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">11.0bn<\u002Fdiv><div class=\"stat-l\">payment transactions per year<\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 class=\"hd hd2\" id=\"s-the-dz-bank-group-as-a-federated-operating-model\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">The DZ BANK Group as a Federated Operating Model<\u002Fspan><\u002Fh2>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-tl-dr\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">TL;DR<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>The DZ BANK Group runs not one operating model but at least seven separately licensed operational stacks<\u002Fstrong> federated under a holding company. Only two systems genuinely span the group: the insourced payments/clearing platform (\"ZV ON€\", completed October 2024, 11.0bn transactions in FY2025) and the financial-conglomerate risk/finance/regulatory-reporting infrastructure required under §25 FKAG. Everything else — insurance policy administration (R+V), fund accounting (Union Investment), Bauspar contract management (BSH), Pfandbrief cover-pool management (DZ HYP), private-bank/fund services (DZ PRIVATBANK) — is run locally on entity-specific technology.<\u002Fli><li><strong>The single most systemically important operation is the payments platform.<\u002Fstrong> DZ BANK is the clearing institution for ~640–700 cooperative banks; a failure would halt payments for a large share of German retail banking. DZ BANK deliberately <em>insourced<\u002Fem> this (an in-house build on SAP-based infrastructure, integration by Capco) while Commerzbank <em>outsourced<\u002Fem> to Worldline — the opposite strategic bet. It is both necessary infrastructure and, increasingly, a genuine competitive asset now being commercialised.<\u002Fli><li><strong>The federated structure cannot achieve single-institution efficiency, and is not meant to.<\u002Fstrong> Six supervisory regimes (ECB/SSM, BaFin/Solvency II, KAGB/AIFMD, Bausparkassengesetz, CSSF, and FKAG conglomerate supervision) force duplicated control functions, parallel reporting factories and separate technology estates. The group's 49.3% cost/income ratio is good <em>for a conglomerate<\u002Fem>, but the multi-entity/multi-regime design imposes a structural \"conglomerate tax\" — most visible in the regulatory-reporting burden — that a monoline would avoid. The offset is earnings diversification and a near-captive cooperative distribution channel.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-key-findings\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>Operating model = holding company with autonomous, separately regulated operating units, plus two shared group-spanning systems.<\u002Fstrong> DZ BANK AG centralises group finance, group risk, group treasury, group compliance and group audit (the FKAG-mandated conglomerate functions). It does NOT centralise the production engines of its subsidiaries. R+V underwrites and settles claims on its own stack in Wiesbaden; Union Investment runs portfolio management on SimCorp; BSH runs a SAP S/4HANA core; DZ HYP runs its own VR-BaufiConnect lending engine; DZ PRIVATBANK runs OLYMPIC/OLYNEXT on IBM i in Luxembourg. This is a hybrid tilted strongly toward <strong>federation<\u002Fstrong>, not shared services.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>The Atruvia boundary is the defining structural fact of the group's technology estate.<\u002Fstrong> Atruvia AG is the IT utility for the ~640–700 <em>primary<\u002Fem> cooperative banks — it runs their core banking (agree21/bank21), the VR Banking App, OnlineBanking and the Omnikanalplattform. DZ BANK holds only ~0.35% of Atruvia and does <strong>not<\u002Fstrong> run its own systems on Atruvia. DZ BANK AG runs its own core banking and general ledger on <strong>SAP / S/4HANA<\u002Fstrong> (with SAP Fioneer), its capital-markets stack on <strong>Murex MX.3<\u002Fstrong>, and its payments on the in-house <strong>ZV ON€<\u002Fstrong> platform. From 1 January 2027, card issuing-processing (debit + credit) moves from VR Payment to Atruvia (Bundeskartellamt case B9-75/26, notified 15 July 2026) — meaning DZ BANK will manufacture card products but not control their processing.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>Payments scale is confirmed and rising:<\u002Fstrong> 9.9bn transactions (FY2023) → 10.2bn (FY2024) → <strong>11.0bn (FY2025)<\u002Fstrong> on the single ZV ON€ platform. The build took roughly 500 people, five years and over 100,000 person-days, with a budget in the three-digit millions of euros. Migration of more than 600 cooperative banks completed end-2024 without material public incident.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>Risk/finance infrastructure is the second group-spanning system and the largest hidden operational cost driver.<\u002Fstrong> The group must consolidate simultaneously under IFRS (group), HGB (parent), and Solvency II (R+V), then compute a financial-conglomerate coverage ratio under Delegated Regulation (EU) 342/2014 in conjunction with Article 49(1) CRR — because the CRR prudential scope <em>excludes<\u002Fem> insurance and Solvency II covers <em>only<\u002Fem> R+V. This produces an annual §25(3)/(4) FKAG report on top of Pillar 3, SREP/ICAAP/ILAAP, SRB resolution planning, DORA, and the CSSF/BaFin/Bundesbank/ESA reporting stack.<\u002Fli><\u002Fol>\n<ol class=\"lst\"><li><strong>The insurance operation (R+V) is the largest earnings contributor and an entirely different operational discipline<\u002Fstrong> — more than 18,400 employees, ~9m customers, ~26m insured risks, gross written premiums €22.8bn (2025). It restructured its board in 2025 to create a dedicated \"Operations und IT\" division (Klaus Endres, from 1 April 2025), signalling operational-efficiency pressure under the \"NextLevel\" strategy, which delivered ~€100m of savings in 2025.<\u002Fli><\u002Fol>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-details\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Details<\u002Fspan><\u002Fh2>\n<h2 class=\"hd hd2\" id=\"s-iii-1\"><span class=\"hn mono\">III.1<\u002Fspan><span class=\"ht\">The Federated Operating Model<\u002Fspan><\u002Fh2>\n<p><strong>What it is.<\u002Fstrong> The DZ BANK Group is a financial conglomerate: a central cooperative bank (DZ BANK AG), a composite insurer (R+V), an asset manager (Union Investment/UMH), a Bausparkasse (BSH), a Pfandbrief mortgage bank (DZ HYP), a Luxembourg private bank and fund-services house (DZ PRIVATBANK), a consumer lender (TeamBank) and a small-business finance/leasing company (VR Smart Finanz), plus the payments company VR Payment and specialist units. Each material entity is separately licensed and separately supervised.<\u002Fp>\n<p><strong>Structure — what is centralised vs local.<\u002Fstrong><\u002Fp>\n<pre class=\"pre\">DZ BANK AG (holding + operating central institution)\n│\n├─ CENTRALISED AT PARENT (conglomerate functions):\n│   • Group Finance (Konzern-Finanzen): IFRS consolidation, group controlling, group prudential\n│   • Group Risk (Konzern-Risikocontrolling / Konzern-Risikosteuerung &amp; Services)\n│   • Group Treasury (Liquiditätsausgleichsfunktion for the whole GFG)\n│   • Group Compliance / AML / Client Lifecycle Management\n│   • Group Audit\n│   • Transaction Banking (payments, cards oversight, custody/depositary)\n│\n├─ ENTITY-LOCAL PRODUCTION ENGINES (run by each subsidiary):\n│   • R+V — underwriting, claims, actuarial, investment ops, reinsurance (Wiesbaden)\n│   • Union Investment — portfolio mgmt, fund accounting, NAV, admin (Frankfurt/Luxembourg)\n│   • BSH — Bauspar contract management, credit servicing (Schwäbisch Hall)\n│   • DZ HYP — commercial + retail real-estate lending, cover-pool mgmt (Hamburg/Münster)\n│   • DZ PRIVATBANK — private banking + fund services (Luxembourg/Zurich/Stuttgart)\n│   • TeamBank — consumer-loan underwriting + easyCredit embedded finance (Nuremberg)\n│   • VR Smart Finanz — leasing + express-loan (Eschborn)\n│   • VR Payment — card acquiring, POS, terminals (Ilvesheim/Frankfurt)<\u002Fpre>\n<p><strong>Direction of travel.<\u002Fstrong> The evidence points to <em>more<\u002Fem> federation of production but <em>more<\u002Fem> centralisation of platforms where scale economics dominate. The clearest signals: (a) DZ BANK insourcing payments into one platform for the whole sector; (b) the 2027 consolidation of card issuing-processing into Atruvia (removing it from DZ BANK/VR Payment); (c) R+V's creation of a combined \"Operations und IT\" board division; (d) BSH's migration to a single SAP S/4HANA core. Each is a \"one platform, run it at scale\" move — but the platforms sit in <em>different<\u002Fem> legal entities (DZ BANK for payments, Atruvia for cards, R+V for insurance ops), so the group is federating around several scale centres rather than one.<\u002Fp>\n<p><strong>Governance model classification (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> This is a <strong>holding-company model with autonomous operating units and selective shared platforms<\u002Fstrong> — not a true shared-services model. The unifying glue is (i) the FKAG conglomerate risk/finance spine and (ii) supervisory-board interlock (Riese chairs BSH, R+V, TeamBank, Union Investment; Koch chairs DZ HYP, DZ PRIVATBANK, VR Smart Finanz — established in <a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\">Volume I<\u002Fa>).<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-2\"><span class=\"hn mono\">III.2<\u002Fspan><span class=\"ht\">Payments, Clearing and Settlement Operations — PRIORITY DEPTH<\u002Fspan><\u002Fh2>\n<p><strong>The single most systemically important operation in the group.<\u002Fstrong><\u002Fp>\n\n<figure class=\"fig\" id=\"fig-12\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 12<\u002Fspan><span class=\"fig-t\">Payments Scale<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:34px;align-items:start\">\n  <div>\n    <div class=\"f-lbl\" style=\"margin-bottom:14px\">Transactions processed on the insourced ZV ON€ platform · bn per year<\u002Fdiv>\n    <div class=\"chart\" style=\"margin-bottom:44px\">\n      <div class=\"ax-y\" style=\"height:260px\"><span>12<\u002Fspan><span>9<\u002Fspan><span>6<\u002Fspan><span>3<\u002Fspan><span>0<\u002Fspan><\u002Fdiv>\n      <div class=\"plot\" style=\"height:260px\">\n        <div class=\"gl\" style=\"bottom:65px\"><\u002Fdiv><div class=\"gl\" style=\"bottom:130px\"><\u002Fdiv><div class=\"gl\" style=\"bottom:195px\"><\u002Fdiv>\n        <div class=\"grp\"><div class=\"pair one\" style=\"height:100%\"><div class=\"cb\" style=\"height:82.5%\"><span class=\"cbv mono\">9.9<\u002Fspan><\u002Fdiv><\u002Fdiv><span class=\"grp-l\">FY2023<\u002Fspan><\u002Fdiv>\n        <div class=\"grp\"><div class=\"pair one\" style=\"height:100%\"><div class=\"cb\" style=\"height:85%\"><span class=\"cbv mono\">10.2<\u002Fspan><\u002Fdiv><\u002Fdiv><span class=\"grp-l\">FY2024<\u002Fspan><\u002Fdiv>\n        <div class=\"grp\"><div class=\"pair one\" style=\"height:100%\"><div class=\"cb acc\" style=\"height:91.7%\"><span class=\"cbv mono\">11.0<\u002Fspan><\u002Fdiv><\u002Fdiv><span class=\"grp-l\">FY2025<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pnl\">\n    <div class=\"pnl-k\">What it took to insource<\u002Fdiv>\n    <div class=\"ann\"><span class=\"mono\">~500<\u002Fspan><span>people on the migration<\u002Fspan><\u002Fdiv>\n    <div class=\"ann\"><span class=\"mono\">5 years<\u002Fspan><span>from decision to completion<\u002Fspan><\u002Fdiv>\n    <div class=\"ann\"><span class=\"mono\">100,000+<\u002Fspan><span>person-days of effort<\u002Fspan><\u002Fdiv>\n    <div class=\"ann\"><span class=\"mono\">&gt;600<\u002Fspan><span>banks migrated by end-2024<\u002Fspan><\u002Fdiv>\n    <div class=\"pnl-tot\"><span>Revenue per transaction<\u002Fspan><span class=\"mono\">~1.8 cents<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\">Volume grew 11% in two years while the platform was being rebuilt underneath it. At roughly 1.8 cents a transaction, scale is the entire business model.<\u002Ffigcaption><\u002Ffigure>\n\n\n<h3 class=\"hd hd3\" id=\"s-the-insourced-platform-zv-on\">The insourced platform: \"ZV ON€\"<\u002Fh3>\n<ul class=\"lst\"><li><strong>What it is (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> DZ BANK's 2024 annual report (DZ BANK AG, HGB accounts, filed to the Bundestag Lobbyregister) states: <em>\"Durch das Projekt „ZV ON€\" wurde der gesamte Zahlungsverkehr der Genossenschaftlichen FinanzGruppe auf eine leistungsfähige In-House-Plattform vereint.\"<\u002Fem> It is an <strong>in-house build<\u002Fstrong>, not a packaged vendor product — evolved from the legacy WGZ Bank in-house payments platform inherited in the 2016 merger.<\u002Fli><li><strong>Who built it (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> ~500 people, five years, over 100,000 person-days, per DZ BANK payments head Matthias Ehringer via Payment &amp; Banking: <em>\"Insgesamt etwa 500 Mitarbeiter:innen, fünf Jahre und über 100.000 Arbeitstage brauchte es.\"<\u002Fem> The project effectively began with the 2016 WGZ Bank merger. Systems-integration and IT-strategy partner: <strong>Capco<\u002Fstrong>, whose own case study puts its scope from April 2019 to end-2024, comprising \"fünf großen ZV-Migrationen,\" \"97 einzelne Go-Live Events,\" \"63 Projektdrehbücher mit bis zu 1.281 Einzelaktivitäten,\" and the migration of \"Mehr als 600 Banken sowie tausende Firmenkunden.\" Budget: three-digit-million euros (DZ BANK Group report 2024). Atruvia contributed to the target-picture design.<\u002Fli><li><strong>What it replaced:<\u002Fstrong> A split estate — the historical DZ BANK side had partly used Equens/equensWorldline (DZ BANK's payments-processing subsidiary was carved out in 2003 into the Transaktionsinstitut, merged into Equens in 2006; DZ BANK sold its residual equensWorldline stake to Worldline effective 30 September 2019), while the smaller WGZ Bank side processed in-house. The merger forced a single target.<\u002Fli><li><strong>Why insourcing (<span class=\"ev\">COMPANY CLAIM<\u002Fspan>, Thomas Ullrich, then-Vorstand, Börsen-Zeitung):<\u002Fstrong> <em>\"Während die Commerzbank beim Zahlungsverkehr einen Outsourcing-Ansatz verfolgt, betreibt die DZ Bank ein Insourcing.\"<\u002Fem> The stated rationale (Ehringer): development cost is high but long-term cheaper than per-transaction fees to an external clearing/authorisation provider, given the sector's volume. Strategic goal: become a payment provider not just for the ~700 cooperative institutes but for banks outside the sector, and monetise (\"versilbern\") the platform.<\u002Fli><li><strong>Why delayed one year:<\u002Fstrong> Migration was planned to 2023 but pushed to end-2024 to absorb T2/TARGET2 consolidation, ISO 20022 migration and SEPA-standard changes concurrently.<\u002Fli><\u002Ful>\n<h3 class=\"hd hd3\" id=\"s-processing-scale-and-profile\">Processing scale and profile<\u002Fh3>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Metric<\u002Fsc-raw-th><sc-raw-th>FY2023<\u002Fsc-raw-th><sc-raw-th>FY2024<\u002Fsc-raw-th><sc-raw-th>FY2025<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Payment transactions (ZV ON€)<\u002Fsc-raw-td><sc-raw-td>9.9bn<\u002Fsc-raw-td><sc-raw-td>10.2bn<\u002Fsc-raw-td><sc-raw-td><strong>11.0bn<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>H1 transactions<\u002Fsc-raw-td><sc-raw-td>4.8→5.1bn<\u002Fsc-raw-td><sc-raw-td>5.1bn<\u002Fsc-raw-td><sc-raw-td>5.3bn<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Credit-card transactions<\u002Fsc-raw-td><sc-raw-td>365.9m<\u002Fsc-raw-td><sc-raw-td>457.1m<\u002Fsc-raw-td><sc-raw-td>+23% YoY<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cards issued<\u002Fsc-raw-td><sc-raw-td>6.7m<\u002Fsc-raw-td><sc-raw-td>7.2m<\u002Fsc-raw-td><sc-raw-td>+11% card sales<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Depositary/custody fund volume<\u002Fsc-raw-td><sc-raw-td>€332.5bn<\u002Fsc-raw-td><sc-raw-td>€369.9bn<\u002Fsc-raw-td><sc-raw-td>€380.7bn<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p>(<span class=\"ev\">CONFIRMED FACT<\u002Fspan>, DZ BANK preliminary-results releases 2024–2026.) Note the definitional perimeter: the figure counts <em>processed payment transactions on the ZV ON€ platform for the cooperative FinanzGruppe<\u002Fem> — i.e. bulk SEPA credit transfers, direct debits, instant payments and cross-border/SWIFT, plus card-scheme messages. It is a throughput count, not a value figure. DZ BANK targets up to <strong>one-third of all German payment traffic<\u002Fstrong> running across the platform.<\u002Fp>\n<p><strong>Split (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> — the group does not publish a clean breakdown):<\u002Fstrong> The overwhelming majority of the 11.0bn are SEPA bulk (SCT + SDD) processed through the Bundesbank SEPA-Clearer/EMZ; card transactions are a separately-reported and much smaller count (hundreds of millions); instant payments a fast-growing minority; high-value/SWIFT a small count but high value. <span class=\"ev\">HYPOTHESIS<\u002Fspan>: SCT+SDD &gt;80% of volume.<\u002Fp>\n<h3 class=\"hd hd3\" id=\"s-rails-and-gateways-confirmed-fact-from-product-pages-sector-structure\">Rails and gateways (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>, from product pages + sector structure)<\u002Fh3>\n<ul class=\"lst\"><li><strong>T2/TARGET2:<\u002Fstrong> DZ BANK is a direct T2 participant and settlement-account holder; it provides indirect access and settlement for cooperative banks.<\u002Fli><li><strong>SEPA-Clearer/EMZ (Deutsche Bundesbank):<\u002Fstrong> the bulk-file rail; bulk files up to 100,000 items, ~€0.0025/transaction (established Vol II).<\u002Fli><li><strong>EBA CLEARING:<\u002Fstrong> STEP2 (bulk SEPA) and RT1 (instant); DZ BANK is a participant.<\u002Fli><li><strong>TIPS:<\u002Fstrong> the Eurosystem instant-settlement layer used for SCT Inst.<\u002Fli><li><strong>Card schemes:<\u002Fstrong> DZ BANK is a scheme member of Visa and Mastercard; also engaged in EPI/Wero (P2P live July 2024).<\u002Fli><\u002Ful>\n<h3 class=\"hd hd3\" id=\"s-eu-instant-payments-regulation-compliance-confirmed-fact\">EU Instant Payments Regulation compliance (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>)<\u002Fh3>\n<p>The IPR ((EU) 2024/886) imposed: receive instant payments by <strong>9 January 2025<\u002Fstrong>; send instant payments plus Verification of Payee (VoP) by <strong>9 October 2025<\u002Fstrong>; removal of the €100,000 scheme cap. DZ BANK met the deadlines on time — notable given how few European banks were technically ready. Per the Capgemini Research Institute's <em>World Payments Report 2025<\u002Fem> (10 September 2024), <em>\"only 13% of European banks can claim a strong technology foundation for instant payments\"<\u002Fem> — i.e. roughly 87% lacked a robust instant-payments tech base (EU 13% vs Asia-Pacific 30%, Americas 26%). Ullrich publicly argued for removing the €100,000 cap and for allowing premium pricing on large instant transactions — a revenue concern given the IPR bars charging more for instant than standard SCT.<\u002Fp>\n<h3 class=\"hd hd3\" id=\"s-the-card-operation-pre-and-post-1-january-2027-confirmed-fact\">The card operation, pre- and post-1 January 2027 (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>)<\u002Fh3>\n<ul class=\"lst\"><li><strong>Today:<\u002Fstrong> VR Payment (a DZ BANK subsidiary, ~248 employees, revenue over €200m) is the cooperative sector's full-service acquirer — POS network operation, terminals, card acceptance, e-commerce, plus <strong>issuing-processing<\u002Fstrong> for debit and credit. DZ BANK is the card-issuing bank/scheme member.<\u002Fli><li><strong>From 1 January 2027:<\u002Fstrong> Atruvia acquires VR Payment's <strong>issuing-processing<\u002Fstrong> business (Bundeskartellamt B9-75/26, notified 15 July 2026; announced 2 July 2026). Atruvia will run debit + credit issuing-processing on one <strong>integrated card platform<\u002Fstrong> (girocard/debit/credit unified). VR Payment refocuses on <strong>acquiring, POS-network operation and omnichannel merchant solutions<\u002Fstrong>. Dr Imke Jacob (DZ BANK Vorstand Transaction Banking) chairs VR Payment's supervisory board and co-leads the realignment.<\u002Fli><li><strong>Operational risk of the migration (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> Moving live issuing-processing for a large share of German credit-card transactions onto Atruvia's platform is a high-stakes cutover. Legal counsel (McDermott) publicly noted <em>\"Ein wesentlicher Teil aller Kreditkartentransaktionen in Deutschland wird über die Systeme von Atruvia abgewickelt.\"<\u002Fem> Concentration risk rises: card processing joins core banking under one utility that DZ BANK barely owns.<\u002Fli><\u002Ful>\n<h3 class=\"hd hd3\" id=\"s-securities-settlement-and-custody-confirmed-fact\">Securities settlement and custody (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>)<\u002Fh3>\n<p>DZ BANK is the <strong>third-largest depositary (Verwahrstelle) in Germany<\u002Fstrong>, fund volume €380.7bn at end-2025, grown partly by acquisition (e.g. the apoBank depositary business). It connects to Clearstream/T2S for settlement. The Luxembourg fund-services operations sit at Attrax (Union Investment group) and DZ PRIVATBANK/IPConcept. DZ BANK also operates a crypto-securities registrar / crypto-custody capability for institutional clients and is active in DLT-based (blockchain) bond issuance and custody.<\u002Fp>\n<p><strong>Collateral operations (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>, Murex):<\u002Fstrong> DZ BANK processes ~1,400 collateral calls per day across more than 5,400 collateral agreements on Murex MX.3 for Collateral Management (Rüdiger Welsch, head of operations IT, DZ BANK) — one of the largest MX.3 platforms in Central Europe.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-3\"><span class=\"hn mono\">III.3<\u002Fspan><span class=\"ht\">Treasury, Liquidity and Balance-Sheet Operations<\u002Fspan><\u002Fh2>\n<p><strong>Mandate (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> DZ BANK's Konzern-Treasury performs the <strong>Liquiditätsausgleichsfunktion<\u002Fstrong> for the entire Genossenschaftliche FinanzGruppe — the daily netting of surplus and deficit liquidity across the cooperative banks — and secures access to money/capital markets and central-bank liquidity. It is the competence centre for unsecured and secured funding.<\u002Fp>\n<p><strong>How surplus deposits are managed:<\u002Fstrong> The ~640–700 primary banks are structurally deposit-rich (retail funding exceeds local lending). They place surplus liquidity with DZ BANK (the Depot-A relationship), which aggregates and reinvests it and provides refinancing to deficit institutions. DZ BANK thus intermediates the sector's internal balance sheet.<\u002Fp>\n<p><strong>Systems supporting the primary banks (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> DZ BANK offers GENO-SAVE and EGon to the cooperative banks for own-account business (Eigengeschäft), regulatory reporting (Meldewesen) and accounting — i.e. DZ BANK is a <em>provider of treasury/reporting tooling<\u002Fem> to the primary banks, not just their counterparty.<\u002Fp>\n<p><strong>Funding/issuance:<\u002Fstrong> DZ BANK optimises its own funding via securities issuance placed through its own sales and via intermediaries to institutional clients (insurers, funds) in Germany and abroad. DZ HYP runs the Pfandbrief funding operation (incl. Green Pfandbriefe). Under \"Verbund First 4.0,\" DZ BANK expanded a dedicated \"Treasury/Refinanzierung\" work package.<\u002Fp>\n<p><strong>ALM relevance:<\u002Fstrong> Net interest income fell 17.8% in FY2025 (established), making interest-rate-risk management and ALM operationally central. Treasury <em>economics<\u002Fem> belong to <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Volume IV<\u002Fa>; here the point is operational: intraday liquidity, collateral mobilisation with the Eurosystem (managed on Murex MX.3), and the settlement-account plumbing into T2.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-4\"><span class=\"hn mono\">III.4<\u002Fspan><span class=\"ht\">Technology Architecture — PRIORITY DEPTH, MOST EVIDENCE-CONSTRAINED<\u002Fspan><\u002Fh2>\n<h3 class=\"hd hd3\" id=\"s-dz-bank-ags-own-core-systems-confirmed-fact-resolved\">DZ BANK AG's own core systems (<span class=\"ev\">CONFIRMED FACT<\u002Fspan> — resolved)<\u002Fh3>\n<p>The open question \"who provides DZ BANK's own core banking?\" is now answered from DZ BANK's own careers/technology page:<\u002Fp>\n<div class=\"quote\"><p><em>\"Unter allen deutschen Banken haben wir in der DZ BANK die meisten SAP-Anwendungen im Banking im Einsatz und dabei bauen wir komplett auf S/4 HANA. Angefangen vom SAP Business Partner über das gesamte SAP Core Banking bis zur Aufbereitung und Analyse im SAP BW oder in SAP BO nutzen wir Software vom Marktführer aus Walldorf.\"<\u002Fem><\u002Fp><\u002Fdiv>\n<ul class=\"lst\"><li><strong>Core banking + general ledger/finance:<\u002Fstrong> <strong>SAP<\u002Fstrong>, standardising on <strong>S/4HANA<\u002Fstrong> (mid-migration from SAP R/3), plus <strong>SAP Fioneer<\u002Fstrong>. SAP BW/BO for analytics/reporting. DZ BANK describes itself as the most SAP-intensive bank in Germany and a \"Fast Follower.\"<\u002Fli><li><strong>Capital markets / trading:<\u002Fstrong> <strong>Murex MX.3<\u002Fstrong> (front-to-back, collateral, securities finance) — confirmed by Murex case studies and a third-party integrator noting data feeds \"aus dem DZ BANK-Handelssystem Murex.\"<\u002Fli><li><strong>Payments:<\u002Fstrong> in-house <strong>ZV ON€<\u002Fstrong> (see <a class=\"xr\" href=\"#s-iii-2\">III.2<\u002Fa>).<\u002Fli><li><strong>Integration backbone (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>, DZ BANK IT careers):<\u002Fstrong> an <strong>EAI (Enterprise Application Integration) platform<\u002Fstrong> — \"eine der größten Plattformen ihrer Art im D-A-CH Raum,\" with ~500 internal/external applications exchanging data; job scheduling via <strong>Automic Automation Engine<\u002Fstrong>; IT-cost transparency via <strong>Apptio<\u002Fstrong>.<\u002Fli><\u002Ful>\n<h3 class=\"hd hd3\" id=\"s-data-centres-and-infrastructure-confirmed-fact-dz-bank-it-careers\">Data centres and infrastructure (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>, DZ BANK IT careers)<\u002Fh3>\n<div class=\"quote\"><p><em>\"Unsere Systeme betreiben wir selbst in den besten Rechenzentren Frankfurts sowie bei zwei der großen Cloud-Hyperscalern.\"<\u002Fem><\u002Fp><\u002Fdiv>\n<ul class=\"lst\"><li>On-prem data centres in Frankfurt (self-operated); classic virtualised Linux/Windows server estate.<\u002Fli><li><strong>Two hyperscalers<\u002Fstrong> used (unnamed publicly); container technologies; a \"Virtual Hybrid IT-Infrastructure\" model integrating cloud into the on-prem estate. Mainframe/batch legacy retained as an \"efficient booking machine in the background\" (DZ BANK Innovation LAB, 2020: \"intelligenter Rück- und Umbau\" of legacy core systems).<\u002Fli><\u002Ful>\n<h3 class=\"hd hd3\" id=\"s-subsidiary-technology-estates\">Subsidiary technology estates<\u002Fh3>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Entity<\u002Fsc-raw-th><sc-raw-th>Core / production systems<\u002Fsc-raw-th><sc-raw-th>Evidence class<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>R+V<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Bespoke software for the insurance core (Beratung, Verkauf, Bestandsführung, Schaden) <strong>plus<\u002Fstrong> standard software from <strong>Salesforce, SAP, Microsoft, IBM<\u002Fstrong>; new \"Operations und IT\" board division from April 2025; VR/3D-scan claims tooling (\"AssureXR\" w/ Fraunhofer IGD)<\u002Fsc-raw-td><sc-raw-td>CONFIRMED (CIO.de; R+V PR)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Union Investment<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>SimCorp<\u002Fstrong> (portfolio/investment management; SimCorp partnership with Quoniam confirmed 2024); <strong>Attrax S.A.<\u002Fstrong> Luxembourg fund-services/brokerage platform (transfer agent, fund administration)<\u002Fsc-raw-td><sc-raw-td>CONFIRMED (SimCorp; Attrax)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>BSH<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>SAP S/4HANA<\u002Fstrong> core banking (\"NEXT\" migration; role-model SAP real-estate-credit standard; migration tooling by paricon; programme support by Wavestone); Bauspar processing being migrated onto SAP progressively<\u002Fsc-raw-td><sc-raw-td>CONFIRMED (Wavestone; paricon; Bank Blog)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>DZ HYP<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>VR-BaufiConnect<\u002Fstrong> proprietary processing software behind VR-BaufiComfort; connected to Genopace, Baufinex, Europace and Atruvia Omnikanalplattform; \"FK Digital\" for corporate-credit digitalisation<\u002Fsc-raw-td><sc-raw-td>CONFIRMED (Börsen-Zeitung; DZ HYP)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>DZ PRIVATBANK<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>OLYMPIC / OLYNEXT<\u002Fstrong> core banking (ERI Bancaire) on <strong>IBM Power / IBM i (OS/400)<\u002Fstrong>; Oracle PL/SQL + APEX application landscape; SAP BusinessObjects/Crystal Reports/Tableau for reporting; fund-admin/NAV/TA product <strong>not publicly named<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>CONFIRMED core (job ads); fund-admin <span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>TeamBank<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>easyCredit consumer-loan platform + <strong>easyCredit-Ratenkauf / -Rechnung<\u002Fstrong> embedded-finance APIs; merchant plugins (open-source on GitHub, Vue.js transaction manager); CTO Reinhold Rehbichler; more than 2,500 merchant partners<\u002Fsc-raw-td><sc-raw-td>CONFIRMED (TeamBank; GitHub)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>VR Payment<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Acquiring/POS/terminal platform; issuing-processing (moving to Atruvia 2027); stake in Wallee<\u002Fsc-raw-td><sc-raw-td>CONFIRMED<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>VR Smart Finanz<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Leasing + express-loan (\"VR Smart flexibel\") digital processing<\u002Fsc-raw-td><sc-raw-td>THIN — little published<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h3 class=\"hd hd3\" id=\"s-engineering-practice-confirmed-fact\">Engineering practice (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>)<\u002Fh3>\n<p>DZ BANK IT publicly emphasises agile transformation, container/cloud CI-CD, and dual-study (Wirtschaftsinformatik/Softwaretechnologie) talent pipelines. R+V transformed its IT into an agile organisation under former CIO Tillmann Lukosch (2018–2025). TeamBank publishes open-source merchant SDKs. <strong>Where nothing is published:<\u002Fstrong> the group does not disclose detailed SLOs, deployment frequencies, or internal architecture beyond the above — marked <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-5\"><span class=\"hn mono\">III.5<\u002Fspan><span class=\"ht\">Build, Buy, Outsource and the Atruvia Boundary<\u002Fspan><\u002Fh2>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Capability<\u002Fsc-raw-th><sc-raw-th>Sourcing model<\u002Fsc-raw-th><sc-raw-th>Owner/vendor<\u002Fsc-raw-th><sc-raw-th>Reasoning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Primary-bank core banking + digital channels<\u002Fsc-raw-td><sc-raw-td><strong>Utility (sector utility)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Atruvia<\u002Fstrong> (DZ BANK ~0.35%)<\u002Fsc-raw-td><sc-raw-td>Sector-wide scale; not DZ BANK's to control<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DZ BANK AG core banking / GL<\u002Fsc-raw-td><sc-raw-td><strong>Buy + heavy config<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>SAP S/4HANA / Fioneer<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Standard bank-in-a-box; deep SAP investment<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Capital-markets front-to-back<\u002Fsc-raw-td><sc-raw-td><strong>Buy<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Murex MX.3<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Industry standard; one of largest MX.3 in C. Europe<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Payments processing<\u002Fsc-raw-td><sc-raw-td><strong>Insourced / build<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>ZV ON€ (in-house)<\u002Fstrong>, Capco integration<\u002Fsc-raw-td><sc-raw-td>Volume economics; strategic control; monetisation<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card issuing-processing<\u002Fsc-raw-td><sc-raw-td><strong>Moving to utility (2027)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>VR Payment → <strong>Atruvia<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Scale consolidation; loss of DZ BANK control<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card acquiring / POS<\u002Fsc-raw-td><sc-raw-td><strong>In-house subsidiary<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>VR Payment<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Merchant-side differentiation<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Securities settlement/custody<\u002Fsc-raw-td><sc-raw-td><strong>Build + market infra<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>DZ BANK depositary + <strong>Clearstream/T2S<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>3rd-largest German depositary; scale<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Insurance policy admin/claims<\u002Fsc-raw-td><sc-raw-td><strong>Build + buy<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>R+V bespoke + SAP/Salesforce/IBM<\u002Fsc-raw-td><sc-raw-td>Insurance is a distinct discipline<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Fund administration/depositary<\u002Fsc-raw-td><sc-raw-td><strong>Build (entity-local)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Union Investment + <strong>Attrax<\u002Fstrong>; DZ PRIVATBANK + <strong>IPConcept/OLYMPIC<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Luxembourg regulatory + scale<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Risk &amp; regulatory reporting<\u002Fsc-raw-td><sc-raw-td><strong>Build (group)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>DZ BANK Konzern-Finanzen/-Risiko on SAP + EAI<\u002Fsc-raw-td><sc-raw-td>Conglomerate-specific<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Data &amp; analytics (next-best-action)<\u002Fsc-raw-td><sc-raw-td><strong>JV<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Truuco<\u002Fstrong> (DZ BANK/Atruvia JV, live April 2023)<\u002Fsc-raw-td><sc-raw-td>Access to primary-bank data<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cloud &amp; infra<\u002Fsc-raw-td><sc-raw-td><strong>Hybrid<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Own Frankfurt DCs + 2 hyperscalers<\u002Fsc-raw-td><sc-raw-td>Sovereignty + scalability<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p><strong>The Atruvia boundary — assessment.<\u002Fstrong> DZ BANK <strong>manufactures<\u002Fstrong> products (payments rails, funds, insurance, loans, cards) but does <strong>not<\u002Fstrong> control the primary banks' digital channel (Atruvia), and from 2027 will <strong>not<\u002Fstrong> control card issuing-processing (Atruvia). This is a structural asymmetry: the group's route to ~30m end customers runs through software it barely owns.<\u002Fp>\n<ul class=\"lst\"><li><strong>Operational control:<\u002Fstrong> Weakened on the customer-facing edge; strong on the manufacturing core (payments, custody, capital markets, insurance, funds).<\u002Fli><li><strong>Cost:<\u002Fstrong> Atruvia's utility model spreads IT cost across ~640–700 banks — cheaper than DZ BANK could achieve alone for channel/core — but DZ BANK cannot capture that margin.<\u002Fli><li><strong>Strategic optionality:<\u002Fstrong> Reduced. If Atruvia's roadmap diverges from DZ BANK's product ambitions (Wero, Request-to-Pay, digital euro), DZ BANK must negotiate rather than direct. The Truuco JV is the mechanism to regain some data/analytics leverage.<\u002Fli><li><strong>Direction (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> The group is becoming <em>more<\u002Fem> dependent on Atruvia (channels + core + cards from 2027), not less. This is the single biggest third-party-dependency question in the group.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-6\"><span class=\"hn mono\">III.6<\u002Fspan><span class=\"ht\">Insurance Operations (R+V) — real depth<\u002Fspan><\u002Fh2>\n<p><strong>Scale (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> more than 18,400 employees; ~9m customers; ~26m insured risks; gross written premiums €22.8bn (2025); record 2024/2025 group results; the largest segment pre-tax contributor (€2,144m in FY2025).<\u002Fp>\n<p><strong>Lines:<\u002Fstrong> life, health, property/casualty, motor, accident, legal-protection, credit/surety, and a large agricultural book (R+V is the cooperative sector's agricultural insurer). Composite structure across multiple legal entities: R+V Lebensversicherung AG, R+V Krankenversicherung AG, R+V Allgemeine Versicherung AG, R+V Direktversicherung, KRAVAG (transport/motor for the haulage sector), plus R+V Versicherung AG as group parent and central reinsurer.<\u002Fp>\n<p><strong>Underwriting &amp; claims operations:<\u002Fstrong> Distribution runs primarily through <strong>more than 13,000 cooperative bank branches<\u002Fstrong> plus R+V's own Außendienst (general agencies and Hauptvertretungen). Claims automation is a \"NextLevel\" priority — R+V reports two-digit-million-euro savings from AI in advisory, underwriting and fraud detection, and is piloting 3D-scan/VR claims capture (\"AssureXR\" with Fraunhofer IGD) to cut manual steps in property-damage adjustment.<\u002Fp>\n<p><strong>Reinsurance (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>, SFCR):<\u002Fstrong> R+V Versicherung AG is the <strong>central reinsurer<\u002Fstrong> of the group's primary insurers and independently writes worldwide non-life reinsurance from Wiesbaden (2024 gross written premiums €4,106m at the AG level). This makes R+V one of the few bank-owned groups running a genuine reinsurance operation.<\u002Fp>\n<p><strong>Investment operation:<\u002Fstrong> R+V runs the group's second-largest balance sheet after the bank; its capital-investment result (R+V Lebensversicherung ordinary investment income above €1.6bn per year) is managed via a Finance/Risk board division (created autumn 2024) and an investment committee. <strong>Signa exposure<\u002Fstrong> was fully written off in R+V's 2023 accounts. R+V CEO Norbert Rollinger stated on 3 April 2024: <em>\"Wir haben das Signa-Engagement in unserem Jahresabschluss 2023 komplett verarbeitet.\"<\u002Fem> The widely-quoted characterisation \"robuster dreistelliger Millionenbetrag\" in fact originated not with Rollinger but with DZ BANK Co-CEO / R+V supervisory-board chair Cornelius Riese (per procontra). Either way, the episode illustrates how single-name real-estate/private-market exposures are managed through reserving and write-down rather than group contagion.<\u002Fp>\n<p><strong>Solvency II operations (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> R+V produces annual SFCRs per legal entity, runs ORSA, and applies transitional measures (§352 VAG Rückstellungstransitional) and the volatility adjustment on the life book. SCR coverage was 168% at end-2024. R+V has a <em>modified<\u002Fem> risk-governance structure reflecting its Solvency II (not CRR) regime — explicitly noted in the group risk report.<\u002Fp>\n<p><strong>Board restructuring (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> From 1 April 2025, R+V created a combined <strong>\"Operations und IT\"<\u002Fstrong> division (Klaus Endres), integrating the former \"IT, Digitalisierung und Prozesse\" division — a clear operational-efficiency signal. \"NextLevel\" is a five-year strategy to 2030; an efficiency programme delivered ~€100m savings in 2025.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-7\"><span class=\"hn mono\">III.7<\u002Fspan><span class=\"ht\">Asset-Management Operations (Union Investment) — depth<\u002Fspan><\u002Fh2>\n<p><strong>Scale:<\u002Fstrong> AuM €534.7bn (retail €270.8bn / institutional €263.8bn); ~4,400 staff; segment pre-tax €1,185m FY2025.<\u002Fp>\n<p><strong>Portfolio management &amp; trading (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> Union Investment runs <strong>SimCorp<\u002Fstrong> for investment management; its quant subsidiary <strong>Quoniam<\u002Fstrong> signed a SimCorp partnership in 2024 (AI/ML/big-data systematic investing on SimCorp's platform plus research-cloud). This places Union Investment on the same class of front-to-back IBOR platform used by other large European managers.<\u002Fp>\n<p><strong>Fund administration &amp; NAV / depositary:<\u002Fstrong> Fund administration and NAV production for the Luxembourg range run through <strong>Union Investment Luxembourg S.A.<\u002Fstrong> (35+ years, one of the most experienced Luxembourg ManCos) and <strong>Attrax Financial Services S.A.<\u002Fstrong> (CSSF-regulated, §24-1/24-2; a \"one-stop\" fund brokerage, administration and transfer-agency house). The depositary function for German funds is provided by DZ BANK's depositary (see <a class=\"xr\" href=\"#s-iii-2\">III.2<\u002Fa>).<\u002Fp>\n<p><strong>Sustainability data / SFDR classification (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> Article 8/9 assets reached €153.7bn at end-2025 (from €146.6bn end-2024); an internal \"sustainable minimum-standards\" figure is separately reported (€127.1bn end-2024). This is a substantial data-operations burden — SFDR classification requires per-instrument ESG data pipelines.<\u002Fp>\n<p><strong>Distribution operations:<\u002Fstrong> Retail distribution runs through the primary cooperative banks (and BSH's field force for building-society-linked products); institutional client servicing is direct. Programme: \"Fit for Future\" (efficiency/operating-model).<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-8\"><span class=\"hn mono\">III.8<\u002Fspan><span class=\"ht\">Credit, Lending and Real-Estate Operations<\u002Fspan><\u002Fh2>\n<p><strong>DZ BANK corporate credit &amp; Metakredit (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> DZ BANK acts <em>subsidiarily<\u002Fem> to the primary banks in corporate lending, and runs the consortium/joint-credit (\"Metakredit\") model (~€19.3bn, established Vol II) in which DZ BANK and primary banks share exposures. Corporate-credit digitalisation runs under a dedicated programme.<\u002Fp>\n<p><strong>DZ HYP VR-BaufiComfort — how it works operationally (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> This is the clearest example of <em>manufacturing/distribution division of labour<\u002Fem> in the group. In the retail model:<\u002Fp>\n<ol class=\"lst\"><li>The Volksbank/Raiffeisenbank adviser handles <strong>customer advice<\u002Fstrong> on the Verbund platforms <strong>Genopace<\u002Fstrong> and <strong>Baufinex<\u002Fstrong> (and, from 2024, Atruvia's Omnikanalplattform).<\u002Fli><li><strong>Without needing a framework contract with DZ HYP<\u002Fstrong>, the adviser submits the application; DZ HYP then <strong>takes over the entire process from application onward<\u002Fstrong> — credit check, approval, and all downstream steps through to disbursement.<\u002Fli><li>The technical backbone is DZ HYP's proprietary <strong>VR-BaufiConnect<\u002Fstrong> software, enabling media-break-free data processing from the sales systems and standardised/automated flows that can produce a <strong>credit decision plus contract within 24 hours<\u002Fstrong>. (Context: Bundesbank reported private-construction new business +21.4% to €240.9bn in 2025.)<\u002Fli><\u002Fol>\n<p><strong>Pfandbrief cover-pool management:<\u002Fstrong> DZ HYP manages its Pfandbrief cover pools and reporting (incl. Green Pfandbrief framework), financing portfolio ~€57.6bn (established). VR WERT provides property valuations/appraisals.<\u002Fp>\n<p><strong>BSH Bauspar contract administration (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> ~7m contracts on the new <strong>SAP S/4HANA<\u002Fstrong> core (\"NEXT\" programme; migration tooling by paricon; Wavestone support) — a \"role-model\" SAP real-estate-credit migration in Germany. The <strong>Baufinex<\u002Fstrong> B2B marketplace (JV with Hypoport) carries more than 8,000 intermediaries and more than 560 product partners; transaction volume +~40% to €8.3bn (established).<\u002Fp>\n<p><strong>TeamBank easyCredit-Ratenkauf merchant integration (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> easyCredit-Ratenkauf (€200–€10,000) and easyCredit-Rechnung (€50–€5,000) are embedded-finance/BNPL products with instant online credit checks; TeamBank bears the default risk and pays merchants within ~3 days. Integration via store plugins (JTL, PlentyONE, e-vendo, modified, etc.) and a Vue.js merchant \"Transaction Manager\" (open-source on GitHub). More than 2,500 cooperative-sector merchant partners; run as a \"hochverfügbares System.\" Loan book €9,132m; ~1.067m customers (established).<\u002Fp>\n<p><strong>VR Smart Finanz:<\u002Fstrong> leasing and express small-business loans (\"VR Smart flexibel\"), cost/income 78.6% (established) — the least-automated, thinnest-margin operation; little technology detail published (<span class=\"ev\">UNKNOWN<\u002Fspan>).<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-9\"><span class=\"hn mono\">III.9<\u002Fspan><span class=\"ht\">Risk, Finance and Regulatory-Reporting Infrastructure — PRIORITY DEPTH<\u002Fspan><\u002Fh2>\n<p><strong>The second genuinely group-spanning system.<\u002Fstrong><\u002Fp>\n<p><strong>The conglomerate aggregation problem (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> The DZ BANK financial conglomerate = <strong>DZ BANK Institutsgruppe (CRR scope, excludes insurance) + R+V (Solvency II)<\u002Fstrong>. Because no single prudential regime covers both, the group computes a <strong>financial-conglomerate coverage ratio (Bedeckungssatz)<\u002Fstrong> under <strong>Delegated Regulation (EU) 342/2014 in conjunction with Article 49(1) CRR<\u002Fstrong> — the quotient of (sum of eligible own funds) over (sum of solvency requirements) across banking and insurance. BaFin is the conglomerate supervisor (FKAG, in force since 4 July 2013, transposing Directive 2011/89/EU).<\u002Fp>\n<ul class=\"lst\"><li><strong>Coverage at end-2024:<\u002Fstrong> exceeded the external minimum of 100.0%, the internal minimum threshold of 113.0%, and the internal observation threshold.<\u002Fli><li><strong>Historical anchor:<\u002Fstrong> end-2020 eligible own funds €35,805m vs requirements €24,516m = 146.0% coverage.<\u002Fli><li><strong>Economic vs normative:<\u002Fstrong> the conglomerate coverage and economic capital adequacy are both anchored on Solvency II-style market-consistent valuation (marktnahe Bewertung), so the CRR III transition does not disturb the market-value basis.<\u002Fli><\u002Ful>\n<p><strong>Risk governance (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> Three-lines-of-defence model; R+V runs a <em>modified<\u002Fem> governance reflecting Solvency II. Central units: <strong>Konzern-Risikocontrolling, Konzern-Risikosteuerung &amp; Services, Konzern-Finanzen<\u002Fstrong>. Group-wide risk reporting across all material risk types is built on prescribed minimum standards and harmonised methods; each Steuerungseinheit's risk-controlling ensures transparency and method currency against DZ BANK-allocated risk capital. Compliance framework reviewed annually; R+V may deviate where special/insurance law requires (documented).<\u002Fp>\n<p><strong>The reporting factory (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> + CONFIRMED components):<\u002Fstrong> DZ BANK must simultaneously satisfy:<\u002Fp>\n<ul class=\"lst\"><li><strong>ECB/SSM<\u002Fstrong> (banking; P2R 1.80% for 2026, O-SII buffer 1.00%) — SREP, ICAAP, ILAAP, COREP/FINREP, stress tests (the EBA 2025 test confirmed CET1 of 17.9% at H1 2025).<\u002Fli><li><strong>BaFin<\u002Fstrong> — conglomerate supervision (§25 FKAG report, around 15 May annually), plus national reporting.<\u002Fli><li><strong>Bundesbank<\u002Fstrong> — payment-system and statistical reporting.<\u002Fli><li><strong>Solvency II<\u002Fstrong> (R+V) — SFCRs, RSR, ORSA, QRTs.<\u002Fli><li><strong>KAGB/UCITS/AIFMD<\u002Fstrong> (Union Investment) — CSSF (Luxembourg) + BaFin.<\u002Fli><li><strong>CSSF<\u002Fstrong> — DZ PRIVATBANK, Attrax, IPConcept.<\u002Fli><li><strong>SRB<\u002Fstrong> — resolution planning (MREL, resolution reporting).<\u002Fli><li><strong>DORA, GwG/AML, MiFID II<\u002Fstrong> — cross-cutting.<\u002Fli><li><strong>CRR III<\u002Fstrong> in force from 1 January 2025 (output floor, RWA changes) — a driver of CET1 rising from 15.8% to 18.4%.<\u002Fli><\u002Ful>\n<p>Group finance consolidates under <strong>IFRS (group), HGB (parent) and Solvency II (R+V) simultaneously<\u002Fstrong> — three accounting/valuation bases running in parallel on the SAP/BW estate. This triple-basis consolidation is the core operational cost driver of the conglomerate structure.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-10\"><span class=\"hn mono\">III.10<\u002Fspan><span class=\"ht\">Data Architecture and Governance<\u002Fspan><\u002Fh2>\n<p><strong>The central tension (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, well-grounded):<\u002Fstrong> The <strong>primary banks own the end-customer relationship and data<\u002Fstrong> (they are the account-holding institutions on Atruvia's core). DZ BANK Group manufactures products but does not own the customer. So how does it get the data to manufacture, price and cross-sell?<\u002Fp>\n<ul class=\"lst\"><li><strong>Truuco (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>):<\u002Fstrong> the DZ BANK/Atruvia JV (founded November 2022, live April 2023) provides Smart-Data and next-best-action capability <em>to the primary banks<\u002Fem>. It is the mechanism by which product-relevant signals flow — but the analytics run <em>for<\u002Fem> the primary banks, whose data governance and customer consent gate the flow. Truuco is effectively the group's attempt to build a data capability <em>on top of<\u002Fem> Atruvia's data estate without owning it.<\u002Fli><li><strong>GDPR controller/processor allocation (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> The primary bank is controller for its customers; Atruvia is processor for core/channel; DZ BANK entities are controllers for their own manufactured products (a fund investor, an insurance policyholder, a Bauspar contract holder become customers of the respective subsidiary). This creates a <strong>fragmented controllership map<\u002Fstrong> — no single group entity is controller for the ~30m end customers.<\u002Fli><li><strong>Data warehousing/analytics:<\u002Fstrong> DZ BANK runs SAP BW/BO for finance/risk; a Financial Data Warehouse integrates trading data from Murex. R+V, Union Investment (SFDR ESG data pipelines) and BSH run their own analytics estates. AI/ML: R+V (underwriting/fraud/advisory), Union Investment/Quoniam (systematic investing), DZ BANK (generative-AI work package under Verbund First 4.0).<\u002Fli><\u002Ful>\n<p><strong>Does a group-wide data flywheel exist? (<span class=\"ev\">HYPOTHESIS<\u002Fspan> / <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> No — not a true group flywheel. The relationship-ownership structure of the cooperative model <em>structurally prevents<\u002Fem> a single group data asset. The group has <em>entity-level<\u002Fem> flywheels (Union Investment's fund data, R+V's claims/actuarial data, TeamBank's credit-decision data, DZ BANK's payments data) and a <em>federated<\u002Fem> signal-sharing layer (Truuco), but not the unified customer-360 that an integrated bank or a fintech would build. This is the sharpest data question in the group, and the answer is: the cooperative structure trades data-integration upside for local relationship ownership.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-11\"><span class=\"hn mono\">III.11<\u002Fspan><span class=\"ht\">Cyber, Security and Operational Resilience<\u002Fspan><\u002Fh2>\n<p><strong>DORA implementation (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> + CONFIRMED regime):<\u002Fstrong> DORA applies across the whole multi-entity, multi-regime group from January 2025. The operational challenge is acute precisely because the group spans banking, insurance and asset-management regimes — the ICT third-party register and critical-third-party identification must span DZ BANK AG, R+V (insurance), Union Investment (AIFMD), and the Luxembourg CSSF entities.<\u002Fp>\n<p><strong>Critical third parties (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, well-grounded):<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li><strong>Atruvia<\u002Fstrong> — channels/core for the primary banks; cards from 2027 (the dominant CTP).<\u002Fli><li><strong>SAP / SAP Fioneer<\u002Fstrong> — DZ BANK core banking/GL.<\u002Fli><li><strong>Murex<\u002Fstrong> — capital markets.<\u002Fli><li><strong>ERI Bancaire (OLYMPIC)<\u002Fstrong> — DZ PRIVATBANK core.<\u002Fli><li><strong>SimCorp<\u002Fstrong> — Union Investment.<\u002Fli><li><strong>IBM<\u002Fstrong> — DZ PRIVATBANK infrastructure (IBM Power/i); R+V software stack.<\u002Fli><li><strong>Hyperscalers<\u002Fstrong> (two, unnamed publicly) — DZ BANK cloud.<\u002Fli><li><strong>Deutsche Bundesbank (SEPA-Clearer/EMZ, T2), EBA CLEARING (STEP2/RT1), Clearstream/T2S<\u002Fstrong> — market infrastructures.<\u002Fli><li><strong>Worldline/equensWorldline<\u002Fstrong> — legacy/residual.<\u002Fli><\u002Ful>\n<p><strong>Concentration risk from single-platform payments (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> Consolidating 11bn transactions onto one ZV ON€ platform creates a single point of failure for a large share of German retail payments. DZ BANK's own project lead acknowledged: <em>\"Bei einem Problem im Rahmen der Migration des SEPA-ZV hätte der Zahlungsverkehr in ganz Europa zum Stillstand kommen können.\"<\u002Fem> The mitigation is the platform's design for high availability and the deliberately \"geräuschlos\" (noiseless) migration, but the structural concentration is real and rising.<\u002Fp>\n<p><strong>Operational-risk framework:<\u002Fstrong> Managed within the group risk architecture (Pillar 1 op-risk capital under CRR; op-risk is a named risk type in the group risk report). R+V carries op-risk under Solvency II SCR.<\u002Fp>\n<p><strong>Published incidents:<\u002Fstrong> No major public outage of DZ BANK's own ZV ON€ platform has been reported (the migration was completed without material public disruption). See <a class=\"xr\" href=\"#s-iii-12\">III.12<\u002Fa> for the sector's Atruvia incident record.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-iii-12\"><span class=\"hn mono\">III.12<\u002Fspan><span class=\"ht\">Reliability Engineering and Failure Paths<\u002Fspan><\u002Fh2>\n<p><strong>Why reliability
