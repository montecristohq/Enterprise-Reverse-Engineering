><sc-raw-th>Horizon<\u002Fsc-raw-th><sc-raw-th>Residual<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>1<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Correlated equity/credit drawdown hitting R+V + Union simultaneously<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>0–3y<\u002Fsc-raw-td><sc-raw-td><strong>The only event that damages two of three engines at once.<\u002Fstrong> R+V investment result + Solvency II own funds AND Union AuM fees fall together. Buffers: R+V SAA/hedging, VSM €6.68bn, Solvency II 204%; residual HIGH<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>2<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>CMDI/deposit-insurance reform curtailing IPS Art. 113(7) treatment<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Low (post-2026)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Existential<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>3–7y<\u002Fsc-raw-td><sc-raw-td>Underpins 0% intra-network risk-weighting AND ~1–2 rating notches. 2025–26 CMDI round PRESERVED IPS treatment; residual now LOW but permanent tail<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>Nat-cat year reversing R+V combined-ratio windfall<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>0–2y<\u002Fsc-raw-td><sc-raw-td>2025's 86.6% CR is unrepeatable; guidance reflects this<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>German CRE deterioration at DZ HYP<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med-High<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>0–3y<\u002Fsc-raw-td><sc-raw-td>€57.6bn book; Pfandbrief-covered<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>Second BayWa (single-name Mittelstand)<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>0–3y<\u002Fsc-raw-td><sc-raw-td>Provisioning \"verfünffachte auf 456 Mio\"; sector-shared<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>Member-bank consolidation shrinking owner base<\u002Fsc-raw-td><sc-raw-td>High (certain)<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>ongoing<\u002Fsc-raw-td><sc-raw-td>23–25/yr; erodes distribution<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td>Erosion of Verbundtreue / loss of shelf space<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>2–7y<\u002Fsc-raw-td><sc-raw-td>Legally optional distribution<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td>Atruvia dependency + 2027 card migration<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>2027<\u002Fsc-raw-td><sc-raw-td>Execution + supplier-power risk<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td>Passive/ETF disruption of Union<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med-High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>ongoing<\u002Fsc-raw-td><sc-raw-td>Highest-quality earnings at risk<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>10<\u002Fsc-raw-td><sc-raw-td>Branch-decline erosion of bancassurance<\u002Fsc-raw-td><sc-raw-td>High (certain)<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>ongoing<\u002Fsc-raw-td><sc-raw-td>Documented referral collapse<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>11<\u002Fsc-raw-td><sc-raw-td>Rate normalisation compressing NII<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Low-Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>0–2y<\u002Fsc-raw-td><sc-raw-td>Offset by trading/insurance<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>12<\u002Fsc-raw-td><sc-raw-td>Key-person/succession on recently reconstituted Vorstand<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>0–3y<\u002Fsc-raw-td><sc-raw-td>Riese chairs 4 boards; two new deputies from 1 July 2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>13<\u002Fsc-raw-td><sc-raw-td>Cyber / operational resilience<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>ongoing<\u002Fsc-raw-td><sc-raw-td>DORA; own S/4HANA+Murex<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>14<\u002Fsc-raw-td><sc-raw-td>Conglomerate capital constraint (136–142%)<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>ongoing<\u002Fsc-raw-td><sc-raw-td>The true binding constraint<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>15<\u002Fsc-raw-td><sc-raw-td>Reputational contagion across shared Verbund brand<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med-High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>ongoing<\u002Fsc-raw-td><sc-raw-td>Schieflagen; BVR friction<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n\n<figure class=\"fig\" id=\"fig-10\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 10<\u002Fspan><span class=\"fig-t\">The Correlation Risk<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div class=\"f-box solid\" style=\"text-align:center\"><div class=\"f-lbl\" style=\"color:var(--acc-dk)\">Single shock<\u002Fdiv><div class=\"f-name\" style=\"font-size:21px;margin-top:4px\">A correlated equity and credit drawdown<\u002Fdiv><\u002Fdiv>\n<div class=\"conn\"><span class=\"conn-l\">strikes both engines at once<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n  <div class=\"f-box gold\"><div class=\"f-lbl\">Engine 1<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">R+V<\u002Fdiv><div class=\"f-meta\">Investment result falls · Solvency II own funds fall · SCR coverage tightens<\u002Fdiv><div class=\"f-num acc\" style=\"font-size:22px;margin-top:10px\">€2,144m — 50% of group profit<\u002Fdiv><\u002Fdiv>\n  <div class=\"f-box gold\"><div class=\"f-lbl\">Engine 2<\u002Fdiv><div class=\"f-name\" style=\"margin-top:4px\">Union Investment<\u002Fdiv><div class=\"f-meta\">AuM-based fees fall with the market, immediately and mechanically<\u002Fdiv><div class=\"f-num acc\" style=\"font-size:22px;margin-top:10px\">€1,185m — 28% of group profit<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"conn\"><span class=\"conn-l\">converge<\u002Fspan><\u002Fdiv>\n<div class=\"f-box\" style=\"text-align:center;border-color:var(--acc-solid)\"><div class=\"f-name\" style=\"font-size:21px\">~78% of group profit moves on one variable<\u002Fdiv><div class=\"f-meta\">Diversification across seven operating models does not diversify this exposure<\u002Fdiv><\u002Fdiv>\n<div class=\"conn\"><span class=\"conn-l\">and then<\u002Fspan><\u002Fdiv>\n<div class=\"f-box\" style=\"text-align:center\"><div class=\"f-name\" style=\"font-size:19px\">The FKAG conglomerate ratio tightens at the same moment<\u002Fdiv><div class=\"f-meta\">Both requirement stacks deteriorate together, with no diversification credit to absorb it<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\"><b>Federation across seven operating models gives no protection against the one risk that matters.<\u002Fb> The group is diversified against idiosyncratic shocks and concentrated against systematic ones.<\u002Ffigcaption><\u002Ffigure>\n\n\n<div class=\"sep\"><\u002Fdiv>\n\n<figure class=\"fig\" id=\"fig-15\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 15<\u002Fspan><span class=\"fig-t\">Risk Heatmap<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div class=\"heat\">\n  <div class=\"heat-lbl\"><\u002Fdiv>\n  <div class=\"heat-lbl\">Low<\u002Fdiv><div class=\"heat-lbl\">Med<\u002Fdiv><div class=\"heat-lbl\">Med-High<\u002Fdiv><div class=\"heat-lbl\">High<\u002Fdiv><div class=\"heat-lbl\">Existential<\u002Fdiv>\n\n  <div class=\"heat-row\">High<br><span style=\"font-size:11px;letter-spacing:.04em\">probability<\u002Fspan><\u002Fdiv>\n  <div class=\"heat-c l1\"><\u002Fdiv>\n  <div class=\"heat-c l3\"><span class=\"risk\">Nat-cat year at R+V<\u002Fspan><span class=\"risk\">Member-bank consolidation<\u002Fspan><span class=\"risk\">Branch-decline erosion<\u002Fspan><\u002Fdiv>\n  <div class=\"heat-c l4\"><span class=\"risk\">Passive / ETF disruption of Union<\u002Fspan><\u002Fdiv>\n  <div class=\"heat-c l4\"><\u002Fdiv>\n  <div class=\"heat-c l5\"><\u002Fdiv>\n\n  <div class=\"heat-row\">Med<\u002Fdiv>\n  <div class=\"heat-c l2\"><span class=\"risk\">Rate normalisation <span class=\"muted\">(low–med)<\u002Fspan><\u002Fspan><\u002Fdiv>\n  <div class=\"heat-c l3\"><span class=\"risk\">Second BayWa<\u002Fspan><span class=\"risk\">Atruvia dependency · 2027 migration<\u002Fspan><span class=\"risk\">Key-person and succession<\u002Fspan><\u002Fdiv>\n  <div class=\"heat-c l3\"><span class=\"risk\">German CRE deterioration<\u002Fspan><span class=\"risk\">Reputational contagion<\u002Fspan><\u002Fdiv>\n  <div class=\"heat-c l4\"><span class=\"risk\">Correlated equity / credit drawdown<\u002Fspan><span class=\"risk\">Erosion of Verbundtreue<\u002Fspan><span class=\"risk\">Cyber and resilience<\u002Fspan><\u002Fdiv>\n  <div class=\"heat-c l5\"><\u002Fdiv>\n\n  <div class=\"heat-row\">Low<\u002Fdiv>\n  <div class=\"heat-c l1\"><\u002Fdiv>\n  <div class=\"heat-c l1\"><\u002Fdiv>\n  <div class=\"heat-c l2\"><\u002Fdiv>\n  <div class=\"heat-c l3\"><span class=\"risk\">Conglomerate capital constraint<\u002Fspan><\u002Fdiv>\n  <div class=\"heat-c l4\"><span class=\"risk\">CMDI reform curtailing the IPS<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"fig-note\">Severity →&nbsp;&nbsp;·&nbsp;&nbsp;fifteen registered risks, scored on the evidence assembled in Part V<\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\">One risk sits alone in the existential column, and it is a legislative one: the CMDI package's treatment of institutional protection schemes.<\u002Ffigcaption><\u002Ffigure>\n\n\n<h2 class=\"hd hd2\" id=\"s-v-17\"><span class=\"hn mono\">V.17<\u002Fspan><span class=\"ht\">Stress Tests (strategic)<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>20–30% equity drawdown + spread widening:<\u002Fstrong> hits R+V investment result (already fell 54.5% to €2,368m in 2025) and Solvency II own funds (204% buffer absorbs much) AND Union AuM fees together. CET1 largely unaffected (insurance out of CRR scope), but the <strong>conglomerate ratio tightens materially<\u002Fstrong> — the scenario that hits the binding constraint. Survivable; earnings reset lower 1–2 years.<\u002Fli><li><strong>Major nat-cat year at R+V:<\u002Fstrong> combined ratio reverts toward/above 100%; segment pre-tax could fall from €2,144m toward or below €1bn; group toward the low end of the €2.5–3.0bn \"natural\" range. Reinsurance mitigates the tail.<\u002Fli><li><strong>CMDI reform removing IPS privileges (did NOT occur in 2025–26):<\u002Fstrong> would raise intra-network risk weights from 0% and cut ~1–2 rating notches, raising funding cost sector-wide. Existential-adjacent; low probability post-2026.<\u002Fli><li><strong>German CRE crisis:<\u002Fstrong> DZ HYP losses; Pfandbrief cover protects investors; segment pre-tax compresses from €338m.<\u002Fli><li><strong>Second BayWa:<\u002Fstrong> another ~€400–450m provision; absorbable at group level, sector-shared via BRB-type vehicles.<\u002Fli><li><strong>Consolidation to &lt;400 primary banks:<\u002Fstrong> fewer, larger, more demanding owners; accelerates external sourcing; strategic more than financial threat.<\u002Fli><li><strong>A large primary bank publicly sourcing insurance/funds outside the Verbund:<\u002Fstrong> reputationally and economically corrosive; the Volksbank Mittelhessen precedent shows it already happens at the margin.<\u002Fli><li><strong>2027 Atruvia card migration failing:<\u002Fstrong> operational disruption across &gt;600 banks; the VR Payment split adds execution risk.<\u002Fli><li><strong>Sustained ETF/neobroker shift halving Union retail net inflows:<\u002Fstrong> retail from €13.5bn toward ~€6–7bn; slow degradation of the highest-quality earnings stream.<\u002Fli><li><strong>Ratings downgrade:<\u002Fstrong> most likely trigger is IPS/scheme weakening, not standalone deterioration (since ~1–2 notches are scheme-derived).<\u002Fli><li><strong>Multiple simultaneous Vorstand departures:<\u002Fstrong> elevated by Riese's four-board concentration; mitigated by the 1 July 2026 deputy appointments.<\u002Fli><li><strong>Digital-euro rollout displacing payment revenue:<\u002Fstrong> slow-burn; erodes ZV ON€/VR Payment economics; timing uncertain.<\u002Fli><\u002Fol>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-v-18\"><span class=\"hn mono\">V.18<\u002Fspan><span class=\"ht\">What Could Make the Group Obsolete?<\u002Fspan><\u002Fh2>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Disruption<\u002Fsc-raw-th><sc-raw-th>Removes customer problem?<\u002Fsc-raw-th><sc-raw-th>Can group adopt?<\u002Fsc-raw-th><sc-raw-th>Assets still useful?<\u002Fsc-raw-th><sc-raw-th>Strands capital?<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Terminal branch-distribution decline<\u002Fsc-raw-td><sc-raw-td>No (advice demand persists)<\u002Fsc-raw-td><sc-raw-td>Partially (omnichannel)<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Some<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Passive/neobroker commoditisation of retail AM<\u002Fsc-raw-td><sc-raw-td>No<\u002Fsc-raw-td><sc-raw-td>Reluctantly (Union refuses ETFs)<\u002Fsc-raw-td><sc-raw-td>Partly<\u002Fsc-raw-td><sc-raw-td>Union franchise value<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Embedded finance/BNPL displacing consumer credit<\u002Fsc-raw-td><sc-raw-td>Partly<\u002Fsc-raw-td><sc-raw-td>Yes (easyCredit-Ratenkauf)<\u002Fsc-raw-td><sc-raw-td>TeamBank licence<\u002Fsc-raw-td><sc-raw-td>Yes if unadapted<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Digital euro disintermediating payments<\u002Fsc-raw-td><sc-raw-td>Partly<\u002Fsc-raw-td><sc-raw-td>Must (sector infra)<\u002Fsc-raw-td><sc-raw-td>ZV ON€ partly<\u002Fsc-raw-td><sc-raw-td>Payments capex<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Platform mortgage intermediaries<\u002Fsc-raw-td><sc-raw-td>No (funding still needed)<\u002Fsc-raw-td><sc-raw-td>Yes (BAUFINEX)<\u002Fsc-raw-td><sc-raw-td>Pfandbrief franchise<\u002Fsc-raw-td><sc-raw-td>No<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Primary-bank consolidation into self-manufacturers<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>No<\u002Fsc-raw-td><sc-raw-td>Central role redundant<\u002Fsc-raw-td><sc-raw-td><strong>Yes — the true obsolescence path<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Merger of cooperative + Sparkassen infrastructure<\u002Fsc-raw-td><sc-raw-td>Reshapes, not removes<\u002Fsc-raw-td><sc-raw-td>Politically hard<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Possibly<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p><strong>Verdict:<\u002Fstrong> technology alone does not make the group obsolete — it can adopt most disruptions and its regulated core stays useful. The one genuine obsolescence path is <strong>owner-side<\u002Fstrong>: consolidation into primary banks large enough to self-manufacture, plus eroding Verbundtreue, hollowing the central factory from within.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-v-19\"><span class=\"hn mono\">V.19<\u002Fspan><span class=\"ht\">Strategic Optionality<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Option<\u002Fsc-raw-th><sc-raw-th>Classification<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Sell ZV ON€ payments processing to non-cooperative banks<\u002Fsc-raw-td><sc-raw-td><strong>Plausible adjacency<\u002Fstrong> (stated ambition; 2027 Atruvia hand-off complicates)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Expand Union institutional business beyond the Verbund<\u002Fsc-raw-td><sc-raw-td><strong>Natural adjacency<\u002Fstrong> (institutional inflows doubled to €9.8bn in 2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>R+V international (Assimoco/Italy; CCB/ICCREA partnerships)<\u002Fsc-raw-td><sc-raw-td><strong>Plausible adjacency<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DZ PRIVATBANK third-party Luxembourg fund services<\u002Fsc-raw-td><sc-raw-td><strong>Natural adjacency<\u002Fstrong> (Frankfurt HQ from Jan 2026; Luxembourg fund-servicing retained)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Grow custody/depositary by acquisition<\u002Fsc-raw-td><sc-raw-td><strong>Natural adjacency<\u002Fstrong> (already #3 at €380.7bn)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Consolidation with a Landesbank<\u002Fsc-raw-td><sc-raw-td><strong>Stretch<\u002Fstrong> (cross-pillar, political)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Atruvia–Finanz Informatik merger<\u002Fsc-raw-td><sc-raw-td><strong>Strategic fantasy<\u002Fstrong> (the 2027 card deal shows deeper Atruvia dependence, not convergence)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Tokenisation / digital-asset custody<\u002Fsc-raw-td><sc-raw-td><strong>Plausible adjacency<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Become a pure holding, divest the banking stub<\u002Fsc-raw-td><sc-raw-td><strong>Stretch/fantasy<\u002Fstrong> — contradicts the central-institution mandate that is the group's reason to exist<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-v-20\"><span class=\"hn mono\">V.20<\u002Fspan><span class=\"ht\">What Is the Group Becoming? (ranked)<\u002Fspan><\u002Fh2>\n<div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Hypothesis<\u002Fsc-raw-th><sc-raw-th>Probability<\u002Fsc-raw-th><sc-raw-th>Evidence for<\u002Fsc-raw-th><sc-raw-th>Evidence against<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>H2: bancassurance + AM holding, bank a minority utility<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>~35%<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>~78% of pre-tax profit from insurance + AM; only ~27% from the banking business (Finanz-Szene)<\u002Fsc-raw-td><sc-raw-td>Central-institution mandate is legally core; cannot divest the bank<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>H4: progressively disintermediated at retail edges, regulated wholesale core retained<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>~30%<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>TeamBank share loss; referral collapse; ETF/neobroker threat; 2027 processing hand-off<\u002Fsc-raw-td><sc-raw-td>Union/R+V/BSH still winning shelf space on merit<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>H1: unchanged central institution + product factory<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>~20%<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Structural inertia; IPS intact post-CMDI; owners won't dismantle<\u002Fsc-raw-td><sc-raw-td>Distribution premise eroding<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>H3: national payments/transaction-banking infra beyond the sector<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>~8%<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>ZV ON€ ambition; Jacob hire<\u002Fsc-raw-td><sc-raw-td>2027 Atruvia hand-off removes issuing-processing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>H5: consolidates with Sparkassen infra or a Landesbank<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>~5%<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Sector-consolidation logic<\u002Fsc-raw-td><sc-raw-td>Cross-pillar politics near-prohibitive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>H6: restructured after a capital/credit/governance crisis<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>~2%<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>BayWa/Signa; BVR friction<\u002Fsc-raw-td><sc-raw-td>Strong buffers; IPS<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p><strong>Most likely trajectory (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> a blend of H2 and H4 — the group increasingly IS an insurance-and-asset-management holding wrapped around a regulated wholesale core, while its retail product edges are slowly contested. The bank does not disappear; it becomes the smaller, utility-like anchor of a group whose value is manufactured by R+V and Union.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-v-21\"><span class=\"hn mono\">V.21<\u002Fspan><span class=\"ht\">Five- and Ten-Year Strategic Map<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Base case:<\u002Fstrong> group pre-tax reverts to the €2.5–3.0bn \"natural\" range (FY2026 guidance ~€3.0bn); R+V and Union remain ~75–80% of profit; owner base drifts below ~600 then ~550; CET1 stays high, the conglomerate ratio the binding constraint; moat intact at core, contested at edge.<\u002Fli><li><strong>Strong execution:<\u002Fstrong> Union institutional scaling + BAUFINEX + payments repositioning + R+V NextLevel (€25bn premium target by 2030) lift the natural range; cost/income holds near 49%.<\u002Fli><li><strong>Market shock:<\u002Fstrong> correlated drawdown compresses R+V + Union together; conglomerate ratio tightens; earnings reset 1–2 years; survivable.<\u002Fli><li><strong>Regulatory shock (CMDI/IPS reform):<\u002Fstrong> low probability post-2026 but the one scenario that threatens the identity via funding cost + rating.<\u002Fli><li><strong>Technology disruption:<\u002Fstrong> ETF/neobroker + digital euro slowly erode retail AM and payments; the group adapts at lower margin.<\u002Fli><li><strong>Sector consolidation:<\u002Fstrong> &lt;400 banks; shelf-space contest intensifies; central factory hollows if Verbundtreue weakens.<\u002Fli><li><strong>Major credit/operational failure:<\u002Fstrong> BayWa-scale repeat or Atruvia migration failure; reputational; financially absorbable.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-v-22\"><span class=\"hn mono\">V.22<\u002Fspan><span class=\"ht\">What the Market and Sector May Misunderstand<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>\"DZ BANK is a bank.\"<\u002Fstrong> Reality: ~78% of FY2025 pre-tax profit is insurance + asset management; Finanz-Szene calculates only ~27% from the banking business. Persists because of the name and balance sheet. Implication: value and risk-manage it as a conglomerate; the conglomerate ratio, not CET1, is the constraint.<\u002Fli><li><strong>\"The FinanzGruppe's €1.68trn / €11.6bn are DZ BANK figures.\"<\u002Fstrong> Reality: those are SECTOR figures (per BVR President Kolak, 15 July 2026); the DZ BANK Group is ~€661bn / €4,282m pre-tax FY2025. The most commonly misquoted numbers in the sector.<\u002Fli><li><strong>\"The primary banks are captive distributors.\"<\u002Fstrong> Reality: distribution is legally optional; Volksbank Mittelhessen already brokers Allianz Leben and Generali/Proxalto alongside R+V. Shelf space is contested and won on merit.<\u002Fli><li><strong>\"18.4% CET1 means over-capitalised.\"<\u002Fstrong> Reality: the binding constraint is the FKAG conglomerate ratio (136.1% end-2024 / 142.2% H1 2025) against a 100% external minimum, 113% internal minimum and 123% observation threshold — not CET1.<\u002Fli><li><strong>\"The AA rating reflects standalone strength.\"<\u002Fstrong> Reality: the scheme provides material uplift (<a class=\"xr\" href=\"#s-v-9\">V.9<\u002Fa>/<a class=\"xr\" href=\"#s-v-24\">V.24<\u002Fa>); the standalone assessment is investment-grade but below the supported rating.<\u002Fli><li><strong>\"DZ BANK controls the cooperative sector's IT.\"<\u002Fstrong> Reality: DZ BANK holds ~0.35% of Atruvia; the ~20% figure that circulates refers to Verimi. The 2027 card deal shows DZ BANK is a customer-side counterparty to Atruvia, not its controller.<\u002Fli><li><strong>\"The FY2025 €4.28bn is the run-rate.\"<\u002Fstrong> Reality: guidance is ~€3.0bn; Riese: a result of that size \"wäre ohne begünstigende Faktoren, insbesondere bei der R+V Versicherung, nicht möglich gewesen.\"<\u002Fli><\u002Fol>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-v-23\"><span class=\"hn mono\">V.23<\u002Fspan><span class=\"ht\">Management and Capital-Allocation Judgement<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Decision<\u002Fsc-raw-th><sc-raw-th>Verdict<\u002Fsc-raw-th><sc-raw-th>Evidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>2016 WGZ merger<\u002Fsc-raw-td><sc-raw-td><strong>Value-creating / strategically necessary<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Created the single cooperative central institution<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DVB wind-down<\u002Fsc-raw-td><sc-raw-td><strong>Value-creating<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Killed a chronic loss-maker; aviation sold to MUFG 2019; defunct 2022<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2018 DZ HYP formation (DG HYP + WL BANK)<\u002Fsc-raw-td><sc-raw-td><strong>Value-creating<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Germany's largest Pfandbrief issuer; €338m FY2025<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Payments insourcing (ZV ON€)<\u002Fsc-raw-td><sc-raw-td><strong>Strategically necessary; too early to fully judge<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>~11bn tx; 2027 issuing-processing exit qualifies the ROI<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>VR Payment issuing-processing → Atruvia (2027)<\u002Fsc-raw-td><sc-raw-td><strong>Questionable / strategically rational<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Concentrates card processing sector-wide but increases Atruvia supplier power over DZ BANK<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Depositary acquisitions<\u002Fsc-raw-td><sc-raw-td><strong>Value-creating<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>#3 at €380.7bn<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sustained support for TeamBank / VR Smart Finanz<\u002Fsc-raw-td><sc-raw-td><strong>Questionable on returns; consistent with Förderauftrag<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>−€29m / −€28m FY2025; share falling<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>High-retention, low-payout capital policy<\u002Fsc-raw-td><sc-raw-td><strong>Value-creating for sector resilience<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>~15.6% payout; builds conglomerate buffer<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Response to BayWa/Signa<\u002Fsc-raw-td><sc-raw-td><strong>Strategically necessary<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Provisioned/written off; but BVR publicly contested DZ BANK's role<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Current Vorstand appointment pattern<\u002Fsc-raw-td><sc-raw-td><strong>Too early to judge; directionally sound<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>External capital-markets/consulting hires + WGZ continuity<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<div class=\"sep\"><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-v-24\"><span class=\"hn mono\">V.24<\u002Fspan><span class=\"ht\">Volume V Reconstruction — synthesis and closing questions<\u002Fspan><\u002Fh2>\n<h3 class=\"hd hd3\" id=\"s-the-rating-architecture-integrated-primary-source-evidence-the-quantified-moat\">The rating architecture (integrated primary-source evidence — the quantified moat)<\u002Fh3>\n<p>The single most important fact underpinning the group's moat is how rating agencies treat the institutional protection scheme:<\u002Fp>\n<ul class=\"lst\"><li><strong>Moody's (Aa2, stable).<\u002Fstrong> Pre-November 2025, DZ BANK's standalone Baseline Credit Assessment was <strong>baa2<\u002Fstrong> and its Adjusted BCA <strong>a3<\u002Fstrong> — <strong>two notches of uplift<\u002Fstrong> from \"a very high probability of cross-sector support from Genossenschaftliche FinanzGruppe\" via the institutional protection scheme (Moody's Credit Opinion, 28 May 2025: the a3 Adjusted BCA \"results in two notches of rating uplift from DZ BANK's baa2 BCA\"). In the 18–20 November 2025 methodology-driven action on ~69 Western European banking groups, Moody's <strong>upgraded the BCA one notch (to baa1) while affirming the Adjusted BCA at a3<\u002Fstrong>, compressing the affiliate-support uplift to <strong>one notch<\u002Fstrong>; the final Aa2 rating (Adjusted BCA a3 + three notches of Advanced LGF uplift) was unchanged. The BCA upgrade \"predominantly considers the improved assessment of the bank's funding position, taking into account its access to stable funding from the cooperative sector.\" (Note: the post-November-2025 \"baa1\" label is inferred from a one-notch upgrade, not a captured verbatim quote — to confirm against the next Credit Opinion.)<\u002Fli><li><strong>S&amp;P (A+, stable).<\u002Fstrong> S&amp;P <strong>equalises DZ BANK with the 'a+' group credit profile<\u002Fstrong> on \"core group status,\" adds <strong>zero ALAC uplift<\u002Fstrong>, calls \"group support… the strongest support element,\" and deems a bail-in \"highly unlikely… would imply solidarity within the sector had ceased.\" The rating is thus not merely uplifted by the scheme — it <em>is<\u002Fem> the scheme's group credit profile.<\u002Fli><li><strong>Fitch (AA-/F1+; senior preferred AA).<\u002Fstrong> Fitch assigns a <strong>single group rating<\u002Fstrong> to Genossenschaftliche FinanzGruppe (Viability Rating 'aa-'), covering DZ BANK and ~700 primary banks together; DZ BANK is not rated standalone but carries the group viability rating, with senior preferred/deposits notched <strong>+1 to AA<\u002Fstrong> for resolution-buffer protection (reaffirmed 20/21 January 2026).<\u002Fli><li><strong>Morningstar DBRS (context): AA (low)<\u002Fstrong>, with an explicit <strong>one-notch uplift<\u002Fstrong> from the A (high) Intrinsic Assessment driven by the BVR protection scheme (SA1, 30 October 2024).<\u002Fli><\u002Ful>\n<p><strong>Bottom line on the moat:<\u002Fstrong> across the agencies, the cooperative scheme is worth on the order of <strong>one to two notches of rating<\u002Fstrong>, and at S&amp;P and Fitch it is the very basis of the rating (equalised to / anchored on the group). The moat is real, quantified and — uniquely — the ONE moat that does not depend on the primary banks choosing to distribute.<\u002Fp>\n<h3 class=\"hd hd3\" id=\"s-closing-questions\">Closing questions<\u002Fh3>\n<p><strong>Why does the group persist, and would it be created today?<\u002Fstrong> It persists because the IPS + central-institution mandate make it a regulatory fortress with a rating the sector cannot replicate individually, and because it genuinely subsidises its owners (Förderauftrag). Would it be created today? The wholesale/IPS core — yes. The sprawling manufacture-and-distribute conglomerate spanning insurance, asset management, Bauspar, consumer credit and payments — <strong>probably not in this exact form<\u002Fstrong>; a green-field designer would likely <em>buy<\u002Fem> several retail product modules (funds, consumer credit, payments-processing) rather than own them — exactly as the substitution analysis and the 2027 Atruvia hand-off already imply.<\u002Fp>\n<p><strong>Defensible vs merely structurally protected:<\u002Fstrong> genuinely defensible = the IPS rating uplift, the central-institution clearing role, Union's active-AM scale and efficiency, R+V's national bancassurance reach vs the region-bound öffentliche Versicherer, BSH's Bauspar dominance. Merely structurally protected = the loss-making Verbund-service units and the assumption of captive distribution.<\u002Fp>\n<p><strong>Hardest vs easiest to replicate:<\u002Fstrong> hardest = the IPS, the central-institution role, the ~645-bank distribution relationship (unbuyable). Easiest = the retail product modules — several already substitutable today (MünchenerHyp proves it).<\u002Fp>\n<p><strong>Current bottleneck:<\u002Fstrong> the willingness/capacity of a shrinking, consolidating, branch-declining primary-bank base to keep distributing on merit. <strong>Next bottleneck if solved:<\u002Fstrong> the conglomerate capital ratio under a correlated market drawdown.<\u002Fp>\n<p><strong>Single greatest structural risk:<\u002Fstrong> the correlated equity/credit drawdown that simultaneously hits R+V (investment result + Solvency II own funds) and Union (AuM fees) — the only event that damages two of three engines at once and tightens the binding conglomerate ratio. The CMDI/IPS tail risk is more severe if it crystallises but is now low-probability, having been substantially preserved in the 2025–26 CMDI outcome.<\u002Fp>\n<p><strong>Most dangerous competitor/force, and horizon:<\u002Fstrong> over 0–3 years, benign-year reversion and correlated-market risk; over 3–10 years, the <strong>structural erosion of branch distribution combined with neobroker/ETF disintermediation of the retail edge and owner-bank consolidation<\u002Fstrong> — a slow negative flywheel, not a single rival. Trade Republic/Scalable and BlackRock/iShares are the sharpest individual embodiments.<\u002Fp>\n<p><strong>Could it be made obsolete, or would it adapt?<\u002Fstrong> It would adapt to technology; the genuine obsolescence path is owner-side (consolidation into self-manufacturers + eroding Verbundtreue).<\u002Fp>\n<p><strong>Are the owner-banks well served?<\u002Fstrong> On current evidence, yes — Union pays them ~€1.57bn+ in commissions, R+V and BSH give them competitive products, and the IPS gives their depositors a AA-rated safety net. But they are served by a structure whose distribution premise is quietly eroding beneath it.<\u002Fp>\n<p><strong>The central question — durable structure or mid-twentieth-century architecture?<\u002Fstrong> Verdict: the <strong>regulated wholesale core (central institution + IPS) is durable for the next decade and beyond<\u002Fstrong> — a genuine, quantified, near-unreplicable moat. The <strong>manufacture-and-distribute retail superstructure is a mid-twentieth-century architecture whose distribution premise is eroding<\u002Fstrong> — legally optional distribution, a shrinking owner base, collapsing referrals and neobroker/ETF disintermediation all pull in one direction. The group is durable; the <em>conglomerate form<\u002Fem> is contingent on continuing to win shelf space on merit. It is doing so today. The decade ahead is a race between the compounding value of the fortress core and the compounding erosion of the distribution edge.<\u002Fp>\n<h3 class=\"hd hd3\" id=\"s-key-unknowns\">Key Unknowns<\u002Fh3>\n<ul class=\"lst\"><li>Individual executive compensation (InstitutsVergV aggregate only) — <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fli><li>Exact post-November-2025 Moody's DZ BANK standalone BCA label (\"baa1\" is inferred) — <strong>to confirm against the next Credit Opinion<\u002Fstrong>.<\u002Fli><li>Internal board deliberations, strategy documents, and the precise economics of the VR Payment/Atruvia transaction — <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fli><li>Final FY2025 R+V Solvency II (204% preliminary) and year-end 2025 conglomerate ratio — preliminary/H1 figures used.<\u002Fli><\u002Ful>\n<h3 class=\"hd hd3\" id=\"s-ten-most-important-conclusions\">Ten Most Important Conclusions<\u002Fh3>\n<ol class=\"lst\"><li>The group is ~78% insurance + asset management by profit; it is a conglomerate, not a bank (~27% banking).<\u002Fli><li>The IPS is the master moat — worth ~1–2 rating notches, the basis of S&amp;P's and Fitch's ratings — and the only moat independent of the banks' choice to distribute.<\u002Fli><li>Distribution is legally optional and contested; the retail moat must be re-won every year on merit (and currently is).<\u002Fli><li>The binding capital constraint is the FKAG conglomerate ratio (~136–142%), not the 18.4% CET1.<\u002Fli><li>The FY2025 €4.28bn is a windfall; ~€3.0bn is the run-rate — an unusually honest management guide.<\u002Fli><li>The single greatest structural risk is a correlated equity/credit drawdown hitting R+V and Union together.<\u002Fli><li>The CMDI 2025–26 outcome preserved Article 113(7)/IPS treatment — the sector's biggest legal tail risk did not crystallise.<\u002Fli><li>The strategic bottleneck is the shrinking, branch-declining, consolidating owner-distribution base (672 end-2024 → ~645; 23–25 mergers/year).<\u002Fli><li>Management follows the Förderauftrag in revealed behaviour (subsidised units, low payout, commissions to owners), not just speeches — but governance is a negotiated compromise, evidenced by the 2024–25 BVR friction.<\u002Fli><li>The wholesale core is durable for the decade; the conglomerate superstructure is a legacy architecture whose distribution premise is eroding — a durable group in a contingent form.<\u002Fli><\u002Fol>\n<p><em><a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-and-strategic-evolution\">Volume V<\u002Fa> complete. No cross-volume synthesis undertaken, per scope.<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv><\u002Fsection>\n<section class=\"sec\" data-part=\"6\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part VI<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">VI<\u002Fspan><\u002Fdiv><h1 id=\"part-vi-part-vi-cross-volume-synthesis\" class=\"part\" data-short=\"Part VI — Cross-Volume Synthesis\">Cross-Volume Synthesis<\u002Fh1><p class=\"opener-s\">What the five volumes prove together that none of them proves alone.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">VI<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">8<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Status<\u002Fdiv><div class=\"plate-v\">Master edition only<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-vi-1\"><span class=\"inpart-n\">VI.1<\u002Fspan><span>The name is the first mistake<\u002Fspan><\u002Fa><a href=\"#s-vi-2\"><span class=\"inpart-n\">VI.2<\u002Fspan><span>The single causal model — a fortress core and a contested edge<\u002Fspan><\u002Fa><a href=\"#s-vi-3\"><span class=\"inpart-n\">VI.3<\u002Fspan><span>What the volumes prove together that none proves alone<\u002Fspan><\u002Fa><a href=\"#s-vi-4\"><span class=\"inpart-n\">VI.4<\u002Fspan><span>The central tension<\u002Fspan><\u002Fa><a href=\"#s-vi-5\"><span class=\"inpart-n\">VI.5<\u002Fspan><span>What would falsify this reading<\u002Fspan><\u002Fa><a href=\"#s-vi-6\"><span class=\"inpart-n\">VI.6<\u002Fspan><span>What the group is becoming<\u002Fspan><\u002Fa><a href=\"#s-vi-7\"><span class=\"inpart-n\">VI.7<\u002Fspan><span>Implications for a fintech builder<\u002Fspan><\u002Fa><a href=\"#s-vi-8\"><span class=\"inpart-n\">VI.8<\u002Fspan><span>Ten cross-volume conclusions<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats\" style=\"max-width:520px\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">~€3.0bn<\u002Fdiv><div class=\"stat-l\">FY2026 guidance, down from €4,282m<\u002Fdiv><\u002Fdiv><\u002Fdiv><p><em>This section is new. It exists only in the master edition and draws on all five volumes.<\u002Fem><\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-vi-1\"><span class=\"hn mono\">VI.1<\u002Fspan><span class=\"ht\">The name is the first mistake<\u002Fspan><\u002Fh2>\n<p>Almost every error made about this institution follows from its name.<\u002Fp>\n<p><strong>DZ BANK is not, in economic substance, a bank.<\u002Fstrong> In FY2025 the group earned €4,282m before tax, of which R+V (insurance) contributed €2,144m and Union Investment (asset management) €1,185m — together roughly <strong>78%<\u002Fstrong>. The Central Institution and Corporate Bank segment, the part that actually is a bank, contributed €864m. Finanz-Szene put it more bluntly: only about <strong>27%<\u002Fstrong> of the record result came from the banking business.<\u002Fp>\n<p>Reading the group as a bank produces a chain of category errors:<\u002Fp>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Read as a bank<\u002Fsc-raw-th><sc-raw-th>Actually<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>CET1 18.4% means large capital headroom<\u002Fsc-raw-td><sc-raw-td>The binding constraint is the FKAG conglomerate ratio at 136.1%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Its competitors are Commerzbank and the Landesbanken<\u002Fsc-raw-td><sc-raw-td>Its competitors are Allianz, DWS, BlackRock, Santander and Worldline — different firms in every engine<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Net interest income falling 17.8% is a serious problem<\u002Fsc-raw-td><sc-raw-td>Largely an accounting artefact, offset by trading swinging from −€842m to +€281m<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Return on equity is the governing metric<\u002Fsc-raw-td><sc-raw-td>It is unlisted, cooperatively owned, and runs a Förderauftrag<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>The FY2025 result is the run-rate<\u002Fsc-raw-td><sc-raw-td>Guidance for FY2026 is ~€3.0bn<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p>The correct frame is a <strong>financial conglomerate under FKAG supervision<\u002Fstrong>: a banking group and a Solvency II insurance group bound together by a supplementary capital regime, with an asset manager and a Bausparkasse alongside — wrapped around a regulated central-institution core.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-vi-2\"><span class=\"hn mono\">VI.2<\u002Fspan><span class=\"ht\">The single causal model — a fortress core and a contested edge<\u002Fspan><\u002Fh2>\n<pre class=\"pre\">        INSTITUTIONAL PROTECTION SCHEME (BVR-SE / BVR-ISG)\n                            │\n        Article 113(7) CRR → 0% intra-network risk weight\n        + 1–2 notches of rating uplift (S&amp;P equalises to the\n          group; Fitch rates the sector, not the bank)\n                            ↓\n              cheap, stable funding at AA-band\n                            ↓\n    ┌───────────── THE FORTRESS CORE ─────────────┐\n    │  Central-institution mandate (exclusive)     │\n    │  Clearing: ~11.0bn payments/yr               │\n    │  Liquidity management for the whole sector   │\n    │  Conglomerate-supervision capability         │\n    └──────────────────────────────────────────────┘\n                            ↓\n    products manufactured centrally by R+V, Union,\n    BSH, DZ HYP, TeamBank, VR Smart Finanz\n                            ↓\n    ┌──────────── THE CONTESTED EDGE ─────────────┐\n    │  ~645 primary banks CHOOSE whether to sell   │\n    │  (distribution is LEGALLY OPTIONAL)          │\n    │  Won today on merit + ~€1.57bn+ commissions  │\n    └──────────────────────────────────────────────┘\n                            ↓\n              30m+ end customers, owned by\n              the primary banks — not the group\n                            ↓\n    ┌─────────── THE EROSION ──────────────────────┐\n    │  Branch decline → R+V referrals 320k → &lt;200k │\n    │  Consolidation → 672 (2024) → ~645 banks     │\n    │  ETF/neobrokers capture first-time savers    │\n    │    before a branch ever sees them            │\n    └──────────────────────────────────────────────┘\n                            ⟲ back to distribution<\u002Fpre>\n<p><strong>The defining property: the core and the edge have opposite dynamics.<\u002Fstrong> The wholesale core is getting stronger — CRR III lifted capital, the 2025–26 CMDI package preserved the IPS, the payments platform consolidated. The retail edge is getting weaker — referrals down 38%, TeamBank's share falling, branch footfall in structural decline. The group's earnings come overwhelmingly from the edge; its durability comes overwhelmingly from the core.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-vi-3\"><span class=\"hn mono\">VI.3<\u002Fspan><span class=\"ht\">What the volumes prove together that none proves alone<\u002Fspan><\u002Fh2>\n<p><strong>1. The only moat independent of owner choice is the protection scheme.<\u002Fstrong><\u002Fp>\n<p><a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\">Volume I<\u002Fa> established the mechanism: the BVR's Sicherungseinrichtung and BVR-ISG constitute an institutional protection scheme recognised under Article 113(7) CRR, permitting a 0% risk weight on intra-network exposures, with no member bank having failed since 1934. <a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-and-strategic-evolution\">Volume V<\u002Fa> quantified its worth: Moody's lifts the standalone Baseline Credit Assessment by one to two notches to an a3 Adjusted BCA; S&amp;P equalises DZ BANK to the sector's 'a+' group credit profile and adds no ALAC uplift because sector support is \"the strongest support element\"; Fitch does not rate DZ BANK standalone at all, assigning a single group rating covering the bank and ~700 primary banks together.<\u002Fp>\n<p><a class=\"xr\" href=\"#part-ii-part-ii-product-customer-distribution-and-flow-architecture\">Volume II<\u002Fa> established the countervailing fact: <strong>distribution is legally optional.<\u002Fstrong> Volksbank Mittelhessen operates as a tied R+V agent while simultaneously brokering Allianz Leben and Generali/Proxalto, and German case law permits it.<\u002Fp>\n<p>Chain these and the structure appears: <strong>every advantage the group has except the protection scheme and the central-institution mandate depends on ~645 independent banks continuing to choose to sell its products.<\u002Fstrong> The scheme is the one asset that does not.<\u002Fp>\n<p><strong>2. The binding capital constraint is not the one anyone looks at.<\u002Fstrong><\u002Fp>\n<p><a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\">Volume I<\u002Fa> established why the CRR prudential scope excludes insurance. <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Volume IV<\u002Fa> established the consequence: three capital regimes that cannot be reconciled to a single number — CET1 18.4% (banking only), Solvency II 203.8% (R+V only), and the FKAG conglomerate coverage at 136.1% (end-2024) rising to 142.2% (H1 2025). The conglomerate ratio arithmetically sums two full requirement stacks and gives <strong>no credit for cross-sector diversification<\u002Fstrong>, which is why a banking CET1 that looks lavish coexists with a conglomerate ratio that is merely comfortable.<\u002Fp>\n<p><strong>Anyone reading 18.4% as deployable headroom has misread the group.<\u002Fstrong> The internal thresholds — 113% minimum, 123% observation — are where management actually operates.<\u002Fp>\n<p><strong>3. Federation gives no protection against the one risk that matters.<\u002Fstrong><\u002Fp>\n<p><a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-risk-infrastructure-and-organisational-des\">Volume III<\u002Fa> established that the group runs seven separate operating models with separate technology estates, separate regulators and separate production engines — a genuinely federated structure. <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Volume IV<\u002Fa> established that R+V and Union Investment together are ~78% of profit. <a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-and-strategic-evolution\">Volume V<\u002Fa> established that both are exposed to the same variable: equity and credit markets. A drawdown reduces Union's AuM-based fees and R+V's investment result and Solvency II own funds <strong>simultaneously<\u002Fstrong>, and tightens the conglomerate ratio directly.<\u002Fp>\n<p><strong>Operational federation delivers no diversification against the correlated market risk that dominates the group's earnings.<\u002Fstrong> The diversification is real against idiosyncratic risk — a BayWa credit event, a nat-cat year — and largely illusory against systematic risk.<\u002Fp>\n<p><strong>4. The group does not control its own distribution rail, and is becoming more dependent on it.<\u002Fstrong><\u002Fp>\n<p><a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-risk-infrastructure-and-organisational-des\">Volume III<\u002Fa> established that DZ BANK runs its own SAP S/4HANA core and Murex — it is not an Atruvia customer for its own systems. But <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-distribution-and-flow-architecture\">Volume II<\u002Fa> established that the growing retail channel is the VR Banking App, which Atruvia controls; <a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-and-institutional-anatomy\">Volume I<\u002Fa> and <a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-and-strategic-evolution\">Volume V<\u002Fa> established that <strong>DZ BANK holds approximately 0.35% of Atruvia<\u002Fstrong> (the widely-repeated ~20% figure refers to Verimi); and from 1 January 2027 card issuing-processing transfers from VR Payment to Atruvia.<\u002Fp>\n<p><strong>The group manufactures products, and is progressively ceding control of the rails through which they reach customers, to an entity it barely owns.<\u002Fstrong><\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-vi-4\"><span class=\"hn mono\">VI.4<\u002Fspan><span class=\"ht\">The central tension<\u002Fspan><\u002Fh2>\n<p>The DZ BANK Group exists so that roughly 645 small cooperative banks can remain independent full-service institutions. It succeeds at that. But its own economics now depend on those banks' branch networks — and branch-based distribution is precisely what is being disrupted.<\u002Fp>\n<p>Every actor is behaving rationally. A primary bank closing branches is responding to cost pressure. A saver opening a Trade Republic account rather than visiting a Volksbank is responding to convenience and price. Union Investment declining to launch ETFs is protecting a margin its owners depend on. R+V investing in digital referral tools is doing what it can.<\u002Fp>\n<p>And the aggregate outcome is that the manufacturing superstructure is optimised for a distribution channel in secular decline. <strong>The fortress core cannot save the contested edge, because the edge is where the earnings are.<\u002Fstrong><\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-vi-5\"><span class=\"hn mono\">VI.5<\u002Fspan><span class=\"ht\">What would falsify this reading<\u002Fspan><\u002Fh2>\n<p>Specific, checkable markers, so the study can be audited against reality:<\u002Fp>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>If this happens<\u002Fsc-raw-th><sc-raw-th>The reading weakens because<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Group pre-tax holds above ~€3.5bn for two consecutive years without a benign claims year<\u002Fsc-raw-td><sc-raw-td>The FY2025 result was less of a windfall than assessed<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>R+V bank referrals stabilise or recover above ~250,000/year<\u002Fsc-raw-td><sc-raw-td>The distribution erosion is cyclical, not structural<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Union Investment's retail net inflows hold above ~€12bn while ETF share keeps rising<\u002Fsc-raw-td><sc-raw-td>The active/captive model is more resilient than assessed<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>A future CMDI or Basel review curtails Article 113(7) IPS treatment<\u002Fsc-raw-td><sc-raw-td>The fortress core is less secure than assessed — this is the tail risk<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>TeamBank's German market share stabilises above ~3.9%<\u002Fsc-raw-td><sc-raw-td>The retail-edge erosion is arrestable<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>The conglomerate ratio moves toward the 123% observation threshold<\u002Fsc-raw-td><sc-raw-td>Capital, not distribution, becomes the binding constraint sooner<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>A top-20 primary bank publicly sources insurance or funds outside the Verbund<\u002Fsc-raw-td><sc-raw-td>Shelf-space erosion has moved from marginal to material<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>The 2027 Atruvia card migration completes cleanly and DZ BANK wins external ZV ON€ clients<\u002Fsc-raw-td><sc-raw-td>The payments platform is a genuine growth asset, not just infrastructure<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-vi-6\"><span class=\"hn mono\">VI.6<\u002Fspan><span class=\"ht\">What the group is becoming<\u002Fspan><\u002Fh2>\n<p>Ranked by probability on the evidence assembled across all five volumes:<\u002Fp>\n\n<figure class=\"fig\" id=\"fig-16\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 16<\u002Fspan><span class=\"fig-t\">What the Group Is Becoming<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div class=\"f-lbl\" style=\"margin-bottom:16px\">Ranked by probability on the evidence assembled across all five volumes<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n  <div><div class=\"split-r\" style=\"margin-top:0\"><span style=\"font-size:17px\">A bancassurance and asset-management holding company<\u002Fspan><span class=\"mono\" style=\"font-size:19px\">35%<\u002Fspan><\u002Fdiv><span class=\"bar\" style=\"height:12px\"><span class=\"barf hi\" style=\"height:12px;width:35%\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n  <div><div class=\"split-r\" style=\"margin-top:0\"><span style=\"font-size:17px\">Progressively disintermediated at the retail edge<\u002Fspan><span class=\"mono\" style=\"font-size:19px\">30%<\u002Fspan><\u002Fdiv><span class=\"bar\" style=\"height:12px\"><span class=\"barf hi\" style=\"height:12px;width:30%\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n  <div><div class=\"split-r\" style=\"margin-top:0\"><span style=\"font-size:17px\">An unchanged central institution<\u002Fspan><span class=\"mono\" style=\"font-size:19px\">20%<\u002Fspan><\u002Fdiv><span class=\"bar\" style=\"height:12px\"><span class=\"barf\" style=\"height:12px;width:20%\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n  <div><div class=\"split-r\" style=\"margin-top:0\"><span style=\"font-size:17px\">A national payments infrastructure<\u002Fspan><span class=\"mono\" style=\"font-size:19px\">8%<\u002Fspan><\u002Fdiv><span class=\"bar\" style=\"height:12px\"><span class=\"barf\" style=\"height:12px;width:8%\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n  <div><div class=\"split-r\" style=\"margin-top:0\"><span style=\"font-size:17px\">Consolidates with Sparkassen infrastructure<\u002Fspan><span class=\"mono\" style=\"font-size:19px\">5%<\u002Fspan><\u002Fdiv><span class=\"bar\" style=\"height:12px\"><span class=\"barf alt\" style=\"height:12px;width:5%\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n  <div><div class=\"split-r\" style=\"margin-top:0\"><span style=\"font-size:17px\">Restructured after a crisis<\u002Fspan><span class=\"mono\" style=\"font-size:19px\">2%<\u002Fspan><\u002Fdiv><span class=\"bar\" style=\"height:12px\"><span class=\"barf alt\" style=\"height:12px;width:2%\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\"><b>The synthesis is a blend of the first two.<\u002Fb> The group is already, in substance, an insurance-and-asset-management holding wrapped around a regulated wholesale core — and its retail edges are slowly being taken.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption class=\"fig-c\">Two outcomes carry two-thirds of the probability mass, and they are not alternatives: the group can become a bancassurance holding <em>because<\u002Fem> it is being disintermediated at the edge.<\u002Ffigcaption><\u002Ffigure>\n\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Hypothesis<\u002Fsc-raw-th><sc-raw-th>Probability<\u002Fsc-raw-th><sc-raw-th>Strongest evidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Bancassurance and asset-management holding, bank a minority utility<\u002Fsc-raw-td><sc-raw-td>~35%<\u002Fsc-raw-td><sc-raw-td>~78% of pre-tax profit already from insurance and AM<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Progressively disintermediated at the retail edge, regulated core retained<\u002Fsc-raw-td><sc-raw-td>~30%<\u002Fsc-raw-td><sc-raw-td>Referral collapse; TeamBank share loss; ETF and neobroker growth<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Unchanged central institution and product factory<\u002Fsc-raw-td><sc-raw-td>~20%<\u002Fsc-raw-td><sc-raw-td>Structural inertia; IPS preserved in the 2025–26 CMDI outcome<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>National payments and transaction-banking infrastructure beyond the sector<\u002Fsc-raw-td><sc-raw-td>~8%<\u002Fsc-raw-td><sc-raw-td>ZV ON€ ambition; but issuing-processing leaves for Atruvia in 2027<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Consolidates with Sparkassen infrastructure or a Landesbank<\u002Fsc-raw-td><sc-raw-td>~5%<\u002Fsc-raw-td><sc-raw-td>Sector logic; cross-pillar politics near-prohibitive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Restructured after a capital, credit or governance crisis<\u002Fsc-raw-td><sc-raw-td>~2%<\u002Fsc-raw-td><sc-raw-td>BayWa and Signa; strong buffers argue against<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p><strong>Synthesis:<\u002Fstrong> a blend of the first two. The group is already, in substance, an insurance-and-asset-management holding wrapped around a regulated wholesale core, and its retail edges are slowly being contested. The bank does not disappear; it becomes the smaller, utility-like anchor of a group whose value is manufactured elsewhere.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-vi-7\"><span class=\"hn mono\">VI.7<\u002Fspan><span class=\"ht\">Implications for a fintech builder<\u002Fspan><\u002Fh2>\n<p><em>This section applies the study to the reader's own context rather than to DZ BANK. Analytical inference throughout.<\u002Fem><\u002Fp>\n<p><strong>The protection scheme explains why German cooperative deposits are so hard to compete with.<\u002Fstrong> A Volksbank's depositor is protected by a scheme that has not let a member fail since 1934, and its funding carries an AA-band rating it did not earn standalone. If your model depends on attracting German retail deposits away from cooperative or savings banks on safety grounds, that argument does not work. Compete on product, convenience and price — not on security.<\u002Fp>\n<p><strong>The distribution premise is the opening, and someone is already through it.<\u002Fstrong> The single most actionable finding in this study is that R+V's bank referrals fell from roughly 320,000 to under 200,000 a year, while Trade Republic passed ten million customers with 70% of them first-time investors. The incumbent's manufacturing scale is intact; its route to the next generation of customers is not. Whatever you are building, the question worth asking is whether it reaches a customer before a branch does.<\u002Fp>\n<p><strong>Understand what a bank partner's capital constraint actually is.<\u002Fstrong> If you partner with a European bancassurance group, its willingness to deploy balance sheet is not governed by the CET1 ratio in its press release. For a conglomerate it may be the FKAG-equivalent coverage ratio; for a monoline it may be MREL or the leverage ratio. Ask which constraint binds before assuming headroom exists.<\u002Fp>\n<p><strong>\"Optional distribution\" is a business model, not a weakness — but it must be re-won annually.<\u002Fstrong> DZ BANK's manufacturers keep their shelf space by paying roughly €1.57bn a year in commissions and by performing. If you are building a product distributed through partners you do not own, that is the discipline: no contract makes them sell it, and the commission is the price of the relationship, not the reward for it.<\u002Fp>\n<p><strong>Insurance and asset management are where the money is, not payments.<\u002Fstrong> This is worth internalising against fintech convention. In the largest cooperative financial group in Germany, payments processes 11 billion transactions a year and earns roughly 1.8 cents each; asset management earns 45.7 basis points on €534.6bn without touching a payment. Payments buys the customer relationship. Manufacturing monetises it.<\u002Fp>\n<p><strong>Finally, on conglomerates.<\u002Fstrong> This study is a detailed demonstration that combining banking, insurance and asset management produces genuine earnings diversification against idiosyncratic shocks and almost none against systematic ones — while imposing a permanent, volume-insensitive supervisory cost. If you are ever tempted to add a regulated business line to another regulated business line, read <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Part IV<\u002Fa> first.<\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-vi-8\"><span class=\"hn mono\">VI.8<\u002Fspan><span class=\"ht\">Ten cross-volume conclusions<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li>DZ BANK is a financial conglomerate, not a bank — roughly 78% of profit comes from insurance and asset management.<\u002Fli><li>The institutional protection scheme is the master moat, worth one to two rating notches, and the only advantage independent of the owner-banks' choice to distribute.<\u002Fli><li>Distribution is legally optional; shelf space is contested and must be re-won every year on merit and commission.<\u002Fli><li>The binding capital constraint is the FKAG conglomerate ratio at ~136–142%, not the 18.4% CET1.<\u002Fli><li>Federation across seven operating models gives no protection against the correlated equity and credit risk that dominates group earnings.<\u002Fli><li>The FY2025 result of €4,282m was a windfall; management guides FY2026 to approximately €3.0bn.<\u002Fli><li>The group is becoming more dependent on Atruvia — an entity it holds approximately 0.35% of — as channels and card processing consolidate there.<\u002Fli><li>The wholesale core is strengthening while the retail edge erodes; the earnings sit at the edge.<\u002Fli><li>The 2025–26 CMDI package preserved Article 113(7) IPS treatment — the sector's largest legal tail risk did not crystallise this round.<\u002Fli><li>The group exists to keep small banks independent, and its economics depend on the branch networks that digital distribution is dismantling.<\u002Fli><\u002Fol>\n<div class=\"sep\"><\u002Fdiv><\u002Fsection>\n<section class=\"sec\" data-part=\"7\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Appendix A<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">A<\u002Fspan><\u002Fdiv><h1 id=\"app-a-appendix-a-glossary-of-german-and-regulatory-terms\" class=\"part\" data-short=\"Appendix A — Glossary of German and Regulatory Terms\">Glossary of German and Regulatory Terms<\u002Fh1><p class=\"opener-s\">Load-bearing. Read before Part IV.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Appendix<\u002Fdiv><div class=\"plate-v\">A<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">6<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Use<\u002Fdiv><div class=\"plate-v\">Before Part IV<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-sector-and-institutional\"><span class=\"inpart-n\"><\u002Fspan><span>Sector and institutional<\u002Fspan><\u002Fa><a href=\"#s-protection-scheme\"><span class=\"inpart-n\"><\u002Fspan><span>Protection scheme<\u002Fspan><\u002Fa><a href=\"#s-accounting-and-financial\"><span class=\"inpart-n\"><\u002Fspan><span>Accounting and financial<\u002Fspan><\u002Fa><a href=\"#s-corporate-and-governance\"><span class=\"inpart-n\"><\u002Fspan><span>Corporate and governance<\u002Fspan><\u002Fa><a href=\"#s-products\"><span class=\"inpart-n\"><\u002Fspan><span>Products<\u002Fspan><\u002Fa><a href=\"#s-regulatory\"><span class=\"inpart-n\"><\u002Fspan><span>Regulatory<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><p><em>Load-bearing. Read before <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-the-three-economic-engines-unit-economics-and-cap\">Part IV<\u002Fa>.<\u002Fem><\u002Fp>\n<h2 class=\"hd hd2\" id=\"s-sector-and-institutional\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Sector and institutional<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Term<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Genossenschaftliche FinanzGruppe (GFG)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The whole German cooperative financial network — the ~645 primary banks plus DZ BANK Group and associated institutions. <strong>Not<\u002Fstrong> the DZ BANK Group<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Zentralinstitut / Spitzeninstitut<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Central institution — DZ BANK's role as the apex bank for the sector<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Primärbank<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A primary (local) cooperative bank: a Volksbank or Raiffeisenbank<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Verbund<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The network or alliance of cooperative institutions<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Verbundtreue<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Network loyalty — the informal norm that binds primary banks to Verbund products<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Förderauftrag<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Statutory promotional mandate — DZ BANK exists to strengthen the primary banks' competitiveness, not to maximise its own profit<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Subsidiaritätsprinzip<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Subsidiarity — the central institution supports rather than competes with the primary banks<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>BVR<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Bundesverband der Deutschen Volksbanken und Raiffeisenbanken — the sector association<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Metakredit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Joint or consortium credit, where DZ BANK supplies balance sheet while the primary bank keeps the customer relationship<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-protection-scheme\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Protection scheme<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Term<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Sicherungseinrichtung (BVR-SE)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The BVR's institutional protection scheme, operating since 1934; protects the institution as a whole, not merely deposits, through preventive intervention<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>BVR Institutssicherung GmbH (BVR-ISG)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The statutory deposit-guarantee scheme since 1 July 2015, and simultaneously an IPS under Article 113(7) CRR<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Institutional Protection Scheme (IPS)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The recognised arrangement permitting a 0% risk weight on intra-network exposures under Article 113(7) CRR<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Schieflage<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A distressed situation at a member institution, potentially triggering scheme intervention<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-accounting-and-financial\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Accounting and financial<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Term<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Zinsüberschuss<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Net interest income<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Provisionsüberschuss<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Net fee and commission income<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Betriebsergebnis<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Operating result<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Jahresüberschuss<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Net income for the year<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Verwaltungsaufwendungen<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Administrative expenses<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Risikovorsorge<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Loss allowances / credit-risk provisioning<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Bilanzsumme<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Total assets<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Einzelabschluss / Konzernabschluss<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Parent-only accounts / consolidated group accounts<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>HGB<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Handelsgesetzbuch — the German Commercial Code; the parent's accounting basis<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Vertragliche Servicemarge (VSM) / CSM<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Contractual service margin — under IFRS 17, the store of unearned future insurance profit<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Kapitalanlageergebnis<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Investment result<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Zinszusatzreserve (ZZR)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Additional interest reserve in German life insurance (an HGB concept)<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<h2 class=\"hd hd2\" id=\"s-corporate-and-governance\"><span class=\"hn mono\"><\u002Fspan><span class=\"ht\">Corporate and governance<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Term<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Vorstand<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Management board (executive)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Aufsichtsrat<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Supervisory board (non-executive) — German two-tier structure<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Doppelspitze<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A co-CEO arrangement; DZ BANK ran one from 2019 to 2024<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Arbeitsdirektor<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Labour director — a board member with mandatory HR responsibility under co-determination<\u002Fsc-raw-td><\u002Fsc-raw-tr
