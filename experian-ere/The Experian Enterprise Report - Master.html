e royalty US$4.95/score (mortgage originations, from 2025; a per-score channel still averages ~US$10/score to lenders). Per CHLA/HousingWire, total per-loan credit-report cost rose from <em>\"about $50 in 2022 to roughly $540 in 2026,\"<\u002Fem> and the FICO tri-merge base price from <em>\"$1.80 in late 2022 to $30 in 2026 — a more than 1,500% increase.\"<\u002Fem> <strong>What this means for Experian's margin on a score sale:<\u002Fstrong> FICO's US$4.95 is a pass-through cost; <em>\"all amounts above $4.95 per score are collected and retained by the credit bureaus or their tri-merge resellers—not FICO\"<\u002Fem> (Jim Wehmann, FICO). So the recent mortgage price escalation is retained largely by the bureaus/resellers, not FICO — consistent with Experian's 45% FY26 mortgage-revenue growth on flat volume.<\u002Fli><li><strong>Ascend / PowerCurve:<\u002Fstrong> platform subscription + consumption. <span class=\"ev unk\">UNKNOWN<\u002Fspan> specifics.<\u002Fli><li><strong>Consumer subscription:<\u002Fstrong> US CreditWorks Premium US$24.99/mo (US$4.99 first month); IdentityWorks Premium US$24.99/mo, Family US$34.99/mo. UK CreditExpert paid; CreditMatcher free.<\u002Fli><li><strong>Marketplace:<\u002Fstrong> CPA / revenue-share, per-approval or per-origination. <span class=\"ev unk\">UNKNOWN<\u002Fspan> rates.<\u002Fli><li><strong>Serasa:<\u002Fstrong> consumer Score/Limpa Nome free; Serasa Premium subscription (BRL, undisclosed USD); creditor-paid recovery fees on Limpa Nome (undisclosed).<\u002Fli><li><strong>Pricing-power verdict:<\u002Fstrong> on the buy side Experian has structural power (tri-merge non-substitutability + switching costs), tempered by reciprocity on the supply side and by FICO's royalty capture on scores.<\u002Fli><\u002Ful>\n<h2 id=\"s-ii-9\" class=\"hd hd2\"><span class=\"hn mono\">II.9<\u002Fspan><span class=\"ht\">Product Dependency and Cross-Sell Map<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Prerequisite:<\u002Fstrong> the bureau file underpins scores, attributes, prescreen, monitoring, the consumer product and the marketplace pre-qualification.<\u002Fli><li><strong>Highest margin:<\u002Fstrong> North America B2B bureau/attributes (34.2% regional EBIT margin; B2B line 30.9%).<\u002Fli><li><strong>Retention products:<\u002Fstrong> Ascend/PowerCurve (embedded, high switching cost) and enterprise master contracts.<\u002Fli><li><strong>Loss leaders / acquisition:<\u002Fstrong> free membership, Boost, Go, free Serasa Score — they acquire the consumer and generate consented data and marketplace inventory.<\u002Fli><li><strong>Identity graph<\u002Fstrong> underpins <em>both<\u002Fem> fraud (CrossCore/Precise ID/NeuroID) and marketing (Graph/Tapad/Audigent/AtData) — a genuine shared asset.<\u002Fli><li><strong>Survival test if the bureau file were removed:<\u002Fstrong> Experian Health (payer/identity infrastructure), Automotive/AutoCheck (DMV/vehicle data), Marketing Services (independent identity graph and third-party data), illion BankStatements/Open Data, and much of the fraud stack would survive as standalone businesses. Scores, attributes, prescreen, monitoring, and marketplace pre-qualification would <strong>collapse<\u002Fstrong> — they are bureau-file-derivative. <strong>Conclusion:<\u002Fstrong> roughly the Verticals (US$1,705m) and parts of fraud/identity are bureau-independent; the Financial Services core (US$4,463m) and most of Consumer Services are not.<\u002Fli><\u002Ful>\n<h2 id=\"s-ii-10\" class=\"hd hd2\"><span class=\"hn mono\">II.10<\u002Fspan><span class=\"ht\">Customer Economics and the Triple Monetisation of the Consumer — PRIORITY<\u002Fspan><\u002Fh2>\n<p><strong>Per-unit economics (arithmetic shown; all analytical inference unless labelled):<\u002Fstrong><\u002Fp>\n<figure class=\"fig\" id=\"figure-10\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 10<\u002Fspan><span class=\"fig-t\">The Triple Monetisation of the Consumer<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"text-align:center\"><div style=\"display:inline-block;min-width:320px\"><div class=\"f-box solid\"><div class=\"f-name\">ONE CONSUMER<\u002Fdiv><div class=\"f-meta\">One file. Three independent revenue routes, none of which requires the consumer to be a paying customer.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<svg viewBox=\"0 0 1000 26\" width=\"100%\" height=\"34\" preserveAspectRatio=\"none\" style=\"display:block\" aria-hidden=\"true\">\n<line x1=\"500\" y1=\"0\" x2=\"500\" y2=\"10\" style=\"stroke:var(--acc-solid);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"167\" y1=\"10\" x2=\"833\" y2=\"10\" style=\"stroke:var(--acc-solid);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"167\" y1=\"10\" x2=\"167\" y2=\"26\" style=\"stroke:var(--acc-solid);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"500\" y1=\"10\" x2=\"500\" y2=\"26\" style=\"stroke:var(--acc-solid);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"833\" y1=\"10\" x2=\"833\" y2=\"26\" style=\"stroke:var(--acc-solid);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<\u002Fsvg>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n<div class=\"pnl\"><div class=\"pnl-k\">Route 1 — data sold to lenders<\u002Fdiv><div class=\"pnl-b\"><strong>B2B; the largest of the three.<\u002Fstrong> The consumer has no contract with the buyer and receives no payment. The lawful basis is permissible purpose, not consent.<\u002Fdiv><div class=\"split-r\"><span class=\"f-lbl\">Scale<\u002Fspan><span class=\"mono acc\">Largest<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"pnl\"><div class=\"pnl-k\">Route 2 — subscription sold to the consumer<\u002Fdiv><div class=\"pnl-b\">Premium membership, monitoring and score access sold directly, at up to <strong>~US$300 per year<\u002Fstrong> at the top of the range.<\u002Fdiv><div class=\"split-r\"><span class=\"f-lbl\">Ceiling<\u002Fspan><span class=\"mono acc\">~US$300/yr<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"pnl\"><div class=\"pnl-k\">Route 3 — referral fee<\u002Fdiv><div class=\"pnl-b\">A fee for sending the consumer <em>back<\u002Fem> to a lender through the marketplace — the <strong>fastest-growing<\u002Fstrong> of the three.<\u002Fdiv><div class=\"split-r\"><span class=\"f-lbl\">Growth<\u002Fspan><span class=\"mono acc\">Fastest<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\">The consumer is customer and product simultaneously. All three are lawful and disclosed; the arrangement depends on never being fully priced.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>One consumer at the centre, three revenue arrows out. The three routes are not alternatives — a single free member can be monetised on all three at once, and the free tier is what makes routes two and three possible at scale.<\u002Ffigcaption>\n<\u002Ffigure>\n<ul class=\"lst\"><li>Blended revenue per free member = US$2,257m Consumer Services ÷ 215m members = <strong>~US$10.5/member/yr<\u002Fstrong> (mixes free and paid; a small cohort carries it).<\u002Fli><li>A single US premium subscriber at CreditWorks Premium US$24.99/mo = <strong>~US$300/yr<\u002Fstrong> gross — i.e. one paid subscriber ≈ ~28 average members.<\u002Fli><li>B2B revenue per pull: <span class=\"ev unk\">UNKNOWN<\u002Fspan> at list, but the group monetises ~1.3bn US updates monthly on the supply side and sells pulls on the demand side; Financial Services US$4,463m spread across the buying base implies large enterprise ARPU (<span class=\"ev unk\">UNKNOWN<\u002Fspan> precise).<\u002Fli><\u002Ful>\n<p><strong>The triple monetisation of one consumer, X:<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li><strong>B2B data sale:<\u002Fstrong> every time a lender/insurer/landlord pulls X's report or score, Experian is paid. X has <em>no contract with the buyer and receives no payment.<\u002Fem><\u002Fli><li><strong>D2C subscription:<\u002Fstrong> Experian sells X monitoring/identity protection (up to US$300+/yr) — protecting X from the very data ecosystem Experian operates.<\u002Fli><li><strong>Marketplace referral:<\u002Fstrong> Experian sends X back to a lender and is paid a referral/origination fee — now the <em>primary<\u002Fem> consumer growth driver.<\u002Fli><\u002Fol>\n<p><strong>Which is largest?<\u002Fstrong> At the group level, B2B (US$6,168m) dwarfs Consumer Services (US$2,257m); within Consumer Services, management states the <em>marketplace<\u002Fem> has overtaken subscriptions as the growth driver. So for the <em>institution<\u002Fem>, the B2B sale of the consumer's data is by far the largest monetisation; for the <em>consumer-facing segment<\u002Fem>, marketplace referral is now ascendant.<\u002Fp>\n<p><strong>Is this a conflict of interest? Test, don't adopt the framing.<\u002Fstrong> Experian frames all three as <em>\"helping consumers improve their financial health.\"<\u002Fem> The mechanics say otherwise in specific, testable ways:<\u002Fp>\n<ul class=\"lst\"><li>The subscription sells protection against risks (identity theft, errors) that arise <em>from the credit-reporting system itself<\u002Fem> — a system Experian co-operates and profits from. A consumer advocate would call this selling the cure for a disease you help spread. On the record: <strong>Chi Chi Wu, senior attorney at the National Consumer Law Center<\u002Fstrong>, stated (January 2025): <em>\"For decades, Experian and others have conducted terrible and perfunctory so-called investigations when consumers tried to fix errors on their credit reports – 'sham' is exactly right.\"<\u002Fem><\u002Fli><li>The marketplace referral aligns Experian's revenue with <em>placement<\u002Fem>, not necessarily with the <em>best consumer outcome<\u002Fem>: Experian is paid when X takes a product, creating an incentive to surface remunerative offers. \"No Ding Decline\" genuinely improves consumer experience, but it also increases application throughput (and thus referral revenue).<\u002Fli><li>The B2B sale monetises X's data without X's payment or direct consent to the specific buyer — lawful under FCRA/GDPR/LGPD, but the consumer is unambiguously the <em>product<\u002Fem> in this leg.<\u002Fli><li><strong>A regulator's view is already on the record:<\u002Fstrong> the CFPB's suit implies the consumer-protection machinery (disputes) is under-resourced relative to the revenue the data generates. The absence (per <a class=\"xr\" href=\"#part-i\">Volume I<\u002Fa>) of any board-level data-ethics/privacy committee is a governance gap directly relevant to managing this three-way conflict.<\u002Fli><\u002Ful>\n<p><strong>Verdict:<\u002Fstrong> the consumer is <em>both<\u002Fem> customer and product, and the roles can coexist legally but not frictionlessly; the \"financial health\" narrative is partially true (Boost, Go, Limpa Nome do help some consumers) and partially a re-description of monetisation.<\u002Fp>\n<h2 id=\"s-ii-11\" class=\"hd hd2\"><span class=\"hn mono\">II.11<\u002Fspan><span class=\"ht\">Capacity and Supply Constraints<\u002Fspan><\u002Fh2>\n<p>The binding constraint is <strong>data coverage and freshness<\u002Fstrong>, not compute. US file coverage ~245m credit-active consumers, but ~28m \"credit invisible\" + ~21m \"unscorable\" thin-file (Experian research) — a coverage gap Experian addresses with <strong>Boost<\u002Fstrong> (alternative/positive data to the Experian file), <strong>Go<\u002Fstrong> (file establishment), rental/utility reporting, cashflow attributes (~6,000 predictive attributes from transaction data), and, in Brazil, the <strong>Cadastro Positivo<\u002Fstrong> (which structurally converted a negative-only system into a positive-history system, ~55% of Serasa Score weight). Freshness: ~1.3bn US updates monthly; recency depends on furnisher reporting cadence (typically monthly). Furnisher-participation completeness varies by category — full for banks/cards, thinner for rent/utilities, which is exactly why Boost exists. Coverage gaps constrain the <em>addressable lending population<\u002Fem> and hence B2B volume; closing them (alternative data) is both a growth lever and a financial-inclusion claim.<\u002Fp>\n<h2 id=\"s-ii-12\" class=\"hd hd2\"><span class=\"hn mono\">II.12<\u002Fspan><span class=\"ht\">Failure and Exception Paths<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Inaccurate tradeline:<\u002Fstrong> owner = furnisher (<span class=\"nb\">§623<\u002Fspan>) + bureau (<span class=\"nb\">§611<\u002Fspan>); deadline 30 days; remedy = reinvestigation. Litigation exposure high (FCRA statutory damages).<\u002Fli><li><strong>Mixed file<\u002Fstrong> (two consumers merged): the most damaging error; owner = bureau (matching failure); driver of the highest-severity FCRA suits.<\u002Fli><li><strong>Identity theft / fraudulent accounts:<\u002Fstrong> consumer files dispute + fraud alert/freeze; bureau must block; Experian's own fraud stack is sold to prevent this on the B2B side.<\u002Fli><li><strong>Disputed item:<\u002Fstrong> the <span class=\"nb\">§611<\u002Fspan> path the CFPB attacks.<\u002Fli><li><strong>Security freeze blocking a legitimate pull:<\u002Fstrong> consumer-controlled; friction but consumer-protective.<\u002Fli><li><strong>Contested adverse-action decision:<\u002Fstrong> consumer routes via dispute; lender relies on FCRA safe-harbour if it used the report properly.<\u002Fli><li><strong>Reinserted-after-deletion data:<\u002Fstrong> a <em>specific CFPB allegation<\u002Fem> — Experian allegedly fails to match new reporting against previously deleted items, so errors reappear under a new furnisher name.<\u002Fli><li><strong>Breach:<\u002Fstrong> notification duties; Experian's own Partner Solutions data-breach contracts (two large ones winding down in FY26) show it monetises <em>others'<\u002Fem> breaches.<\u002Fli><li><strong>Furnisher supplying systematically bad data:<\u002Fstrong> bureau's duty to consider furnisher unreliability — the CFPB says Experian ignores \"improbable or illogical\" furnisher responses.<\u002Fli><\u002Ful>\n<p><strong>This section is disproportionately important because dispute handling is simultaneously the largest consumer-facing cost, the core consumer-protection obligation, and the subject of live federal litigation.<\u002Fstrong> Credit/consumer-reporting complaints are the single largest category in the CFPB complaint database — accounting for roughly 80% of all complaints in recent years — with the most common sub-issue being incorrect information on a report. The 2012–2013 FTC Section 319 FACTA accuracy study found that roughly one in five consumers had an error corrected after dispute on at least one of their three reports, 26% reported a potential material error and filed a dispute (half of whom saw a score change), and ~5% had errors serious enough to raise the cost of credit — the empirical backdrop against which the CFPB's \"sham investigations\" theory is being litigated.<\u002Fp>\n<h2 id=\"s-ii-13\" class=\"hd hd2\"><span class=\"hn mono\">II.13<\u002Fspan><span class=\"ht\">Product-Market Evolution<\u002Fspan><\u002Fh2>\n<p>From a credit-checking bureau, Experian moved: → decisioning/analytics (PowerCurve, then cloud-native Ascend) → direct-to-consumer (driven by free-score consumer demand, breach-response contracts, and the realisation that the consumer relationship is both a data source and a marketplace funnel) → fraud/identity build-out (CrossCore, NeuroID, ClearSale, KYC360, AtData — a response to digital-first fraud and to the fact that identity is the connective tissue across all products) → marketing-services expansion (Tapad/Audigent/AtData) and its <strong>regulatory collision<\u002Fstrong> (the ICO case) → healthcare adjacency (infrastructure reuse) → marketplace/lead-generation (the highest-growth consumer model, extended into mortgage via Own Up and insurance via Gabi) → recent identity/RegTech/mortgage-marketplace M&amp;A (FY26 acquisitions totalling US$792m). <strong>Assessment:<\u002Fstrong> the expansion is <em>coherent around one axis — identity and permissioned data<\u002Fem> — rather than accretive drift. The through-line is: own the identity graph, then apply it to every domain where matching a person to a record has value (credit, fraud, marketing, health, automotive, and now agentic-commerce via \"Experian Agent Trust\"). The marketing collision is the exception that proves the rule: it is the one domain where the permission does <em>not<\u002Fem> travel with the data, which is why it drew enforcement. Management claims <em>\"over US$15bn of AI-enabled addressable market opportunities\"<\u002Fem> across Health, agentic commerce, Ascend expansion and embedded consumer marketplaces [<span class=\"ev\">COMPANY CLAIM<\u002Fspan> — forward-looking, not realised].<\u002Fp>\n<h2 id=\"s-ii-14\" class=\"hd hd2\"><span class=\"hn mono\">II.14<\u002Fspan><span class=\"ht\">Volume II Reconstruction<\u002Fspan><\u002Fh2>\n<p><strong>(1) Full Product Architecture by entity and legal basis<\u002Fstrong> — see <a class=\"xr\" href=\"#s-ii-1\">II.1<\u002Fa> (families A–J; Experian Information Solutions Inc. = US bureau/FCRA; Experian Limited = UK bureau/UK GDPR; ConsumerInfo.com dba Experian Consumer Services = US D2C; Experian Marketing Solutions LLC = marketing/legitimate interests; Experian Health Inc. = RCM/infrastructure; Serasa S.A. = Brazil/LGPD+Cadastro Positivo; illion = ANZ/Privacy Act+CDR).<\u002Fp>\n<p><strong>(2) Three-Sided Customer Map<\u002Fstrong> — furnisher (free-in, reciprocal access) / buyer (per-pull cash) / marketplace advertiser (referral fee); one institution occupies all three; reciprocity arbitrates power (<a class=\"xr\" href=\"#s-ii-2\">II.2<\u002Fa>).<\u002Fp>\n<p><strong>(3) Customer-Segment Map<\u002Fstrong> — Financial Services (US$4,463m) dominant; Verticals (US$1,705m: Automotive, Health, Marketing Services) bureau-independent; Consumer Services (US$2,257m) subscription + marketplace.<\u002Fp>\n<p><strong>(4) Jobs-to-Be-Done Matrix<\u002Fstrong> — lenders buy an auditable decision basis; consumers buy access/protection/clearance; other buyers buy identity/coverage/risk (<a class=\"xr\" href=\"#s-ii-3\">II.3<\u002Fa>).<\u002Fp>\n<p><strong>(5) B2B and Consumer Journeys<\u002Fstrong> — enterprise integration → renewal (100% NA); consumer free sign-up → subscription <em>or<\u002Fem> marketplace (<a class=\"xr\" href=\"#s-ii-4\">II.4<\u002Fa>).<\u002Fp>\n<p><strong>(6) Inverted Value-Flow Diagram<\u002Fstrong> — free inflow → matching/attributes/scores (value creation + IP ownership) → paid outflow; split <span class=\"nb\">§623<\u002Fspan>/<span class=\"nb\">§611<\u002Fspan> liability (<a class=\"xr\" href=\"#s-ii-5\">II.5<\u002Fa>).<\u002Fp>\n<p><strong>(7) Transaction Teardowns<\u002Fstrong> — US card app; UK affordability; prescreen; the CFPB dispute; Limpa Nome; marketplace referral (<a class=\"xr\" href=\"#s-ii-6\">II.6<\u002Fa>).<\u002Fp>\n<p><strong>(8) Distribution Architecture<\u002Fstrong> — eight routes, enterprise-direct highest value, embedded/Partner Solutions rising (<a class=\"xr\" href=\"#s-ii-7\">II.7<\u002Fa>).<\u002Fp>\n<p><strong>(9) Pricing Architecture<\u002Fstrong> — buy-side power tempered by reciprocity and FICO royalty capture; most rates <span class=\"ev unk\">UNKNOWN<\u002Fspan>; mortgage tri-merge the public window (<a class=\"xr\" href=\"#s-ii-8\">II.8<\u002Fa>).<\u002Fp>\n<p><strong>(10) Product Dependency Map<\u002Fstrong> — bureau file is prerequisite; Verticals + fraud/identity survive its removal; Financial Services core + Consumer Services collapse (<a class=\"xr\" href=\"#s-ii-9\">II.9<\u002Fa>).<\u002Fp>\n<p><strong>(11) Triple-Monetisation Analysis<\u002Fstrong> — B2B data sale (largest, institution-wide) &gt; marketplace referral (rising, consumer-segment) ≈ subscription; consumer is both customer and product; conflict real, lawful, frictional (<a class=\"xr\" href=\"#s-ii-10\">II.10<\u002Fa>).<\u002Fp>\n<p><strong>(12) Capacity and Coverage Map<\u002Fstrong> — coverage/freshness the binding constraint; ~49m thin/invisible in US addressed by Boost/Go/alt-data; Cadastro Positivo in Brazil (<a class=\"xr\" href=\"#s-ii-11\">II.11<\u002Fa>).<\u002Fp>\n<p><strong>(13) Failure/Exception Map<\u002Fstrong> — mixed files and reinsertion are the highest-severity paths; dispute handling is duty, cost and litigation at once (<a class=\"xr\" href=\"#s-ii-12\">II.12<\u002Fa>).<\u002Fp>\n<p><strong>(14) Product-Market Evolution<\u002Fstrong> — coherent expansion along the identity/permissioned-data axis; marketing the one domain where permission doesn't travel (<a class=\"xr\" href=\"#s-ii-13\">II.13<\u002Fa>).<\u002Fp>\n<p><strong>(15) Key Unknowns<\u002Fstrong> — per-inquiry and score list prices; Ascend/PowerCurve pricing; marketplace CPA/revenue-share rates; Limpa Nome creditor take-rate; the paid-conversion rate of the 215m free base; the split of Consumer Services between subscription and marketplace; Own Up deal value (undisclosed); the eventual CFPB outcome and any mandated dispute-system remediation cost.<\u002Fp>\n<p><strong>(16) Ten Most Important Conclusions:<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li>The product sold is a <strong>network position plus derived IP<\u002Fstrong>, not raw data — the data is borrowed, the aggregation and models are owned.<\u002Fli><li>The <strong>inverted value flow<\u002Fstrong> (free input from the same parties who buy the output) is the enterprise's defining economic mechanism and the source of its structurally high margin.<\u002Fli><li><strong>Reciprocity is the true moat and the true price-discipline<\u002Fstrong> — it locks furnishers in and simultaneously prevents Experian from over-charging its own suppliers.<\u002Fli><li><strong>Pricing power is real but asymmetric<\u002Fstrong> — strong on the buy side (tri-merge non-substitutability), constrained on the supply side (reciprocity) and shared with FICO on scores.<\u002Fli><li>The <strong>consumer is monetised three times<\u002Fstrong> and is unambiguously the product in the largest (B2B) leg; the \"financial health\" framing is a partial truth layered over monetisation.<\u002Fli><li><strong>Marketplace referral has overtaken subscription<\u002Fstrong> as the consumer growth engine, widening the conflict-of-interest surface and shifting revenue quality toward transactional.<\u002Fli><li><strong>Dispute handling is the fault line<\u002Fstrong> — the largest consumer-facing cost, the core legal duty, and the subject of live CFPB litigation that survived a motion to dismiss (October 2025).<\u002Fli><li><strong>The bureau file is load-bearing<\u002Fstrong> — remove it and Financial Services and most of Consumer Services collapse, while Verticals (Health, Automotive, Marketing) and much of fraud/identity survive as independent businesses.<\u002Fli><li><strong>The expansion is coherent<\u002Fstrong> around identity/permissioned data; the marketing-services collision (ICO) is the diagnostic exception because permission does not travel with marketing data.<\u002Fli><li><strong>Serasa is a distinct, systemically important consumer platform<\u002Fstrong> (~100m base, US$19.4bn renegotiated) with economics (Limpa Nome take-rate) that Experian does not disclose.<\u002Fli><\u002Fol>\n<p><strong>The central question answered — what is a credit bureau actually selling?<\u002Fstrong> Not data (it doesn't own the crude data), not merely a permission, and not simply a decision. It is selling <strong>access to a network position that no participant could occupy alone<\u002Fstrong> — a shared, reciprocally-funded utility whose value is precisely that it aggregates what no single bank would share bilaterally, wraps it in statutory permission and explainability, and rents that position to every side of the market, including back to the consumers who are its raw material. The most valuable relationship is the enterprise financial-services buyer that is also a furnisher (highest revenue, highest stickiness); the most fragile is the <strong>consumer relationship<\u002Fstrong>, because it rests on a \"financial health\" narrative that the dispute-handling litigation and the triple-monetisation mechanics are actively straining.<\u002Fp>\n<h2 id=\"s-recommendations-for-an-analyst-investor-counterparty-using-this-teardown\" class=\"hd hd2 n0\"><span class=\"ht\">Recommendations (for an analyst / investor / counterparty using this teardown)<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>Treat the bureau file as the crown jewel and reciprocity as the moat.<\u002Fstrong> Monitor the UK Credit Reporting Governance Body transition (CP26/7, February 2026) closely — any weakening of reciprocity or mandated data-portability is the single biggest structural risk to the free-input economics. <em>Threshold that would change the view:<\u002Fem> a regulatory move to compel data sharing on non-reciprocal terms, or to cap per-pull pricing.<\u002Fli><li><strong>Price the CFPB suit as a cost-structure signal, not just a legal contingency.<\u002Fstrong> With the motion to dismiss denied and discovery under way, a consent order mandating specific matching/reinvestigation systems would convert a variable legal risk into a fixed cost and compress the consumer-facing margin. <em>Threshold:<\u002Fem> any settlement/consent order specifying dispute-system remediation.<\u002Fli><li><strong>Watch the marketplace mix.<\u002Fstrong> As marketplace referral overtakes subscriptions, revenue quality shifts from recurring to transactional/cyclical and the conflict surface widens. <em>Benchmark:<\u002Fem> disclosure of the marketplace-vs-subscription split within Consumer Services would materially improve the segment's valuability.<\u002Fli><li><strong>Value Serasa as a separate platform.<\u002Fstrong> ~100m base, US$19.4bn renegotiated, strong LatAm consumer growth — but the Limpa Nome creditor take-rate is undisclosed; press for it. <em>Threshold:<\u002Fem> any disclosure of Limpa Nome revenue or take-rate.<\u002Fli><li><strong>Stress-test the mortgage pricing tailwind.<\u002Fstrong> The 45%-on-flat-volume mortgage effect is a pricing windfall vulnerable to (a) VantageScore 4.0 competition compressing score margins (FHFA authorised VantageScore 4.0 for GSE conforming mortgages, 8 July 2025) and (b) political pressure (CHLA/MBA) on tri-merge costs. <em>Benchmark:<\u002Fem> GSE adoption pace of VantageScore 4.0 and any FICO Mortgage Direct License disintermediation of bureau markups.<\u002Fli><\u002Fol>\n<h2 id=\"s-caveats-2\" class=\"hd hd2 n0\"><span class=\"ht\">Caveats<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Pricing opacity is pervasive.<\u002Fstrong> Per-inquiry rates, enterprise contract terms, marketplace CPA/revenue-share and Serasa's creditor fee are commercially confidential and labelled <span class=\"ev unk\">UNKNOWN<\u002Fspan>; where per-member arithmetic is shown it is explicitly analytical inference, not disclosed unit economics.<\u002Fli><li><strong>Segment figures<\u002Fstrong> are Benchmark, ongoing-activities, from the FY26 results announcement/annual report; they exclude exited B2B lines and should not be compared to prior-year statutory numbers without re-presentation. Regional revenue sums (5,587 + 1,297 + 942 + 599 = 8,425) reconcile to ongoing total; statutory revenue is US$8,445m.<\u002Fli><li><strong>Some third-party consumer-subscription aggregator pages<\u002Fstrong> show inconsistent tier names/prices; figures are anchored to Experian's own disclosures where possible and ranges are flagged.<\u002Fli><li><strong>The ICO, CFPB, tribunal, CHLA and NCLC characterisations<\u002Fstrong> are allegations/findings/estimates as stated by the respective bodies; the CFPB matter is unresolved and Experian contests it; the CHLA per-loan cost figures are a trade-association estimate disputed in part by FICO.<\u002Fli><li><strong>Forward-looking company statements<\u002Fstrong> (AI-enabled addressable market, FY27 Partner Solutions ramp, cost savings from FY27) are labelled <span class=\"ev\">COMPANY CLAIM<\u002Fspan> and are not treated as realised results.<\u002Fli><li>The <strong>\"financial health\" framing has been tested against mechanics rather than adopted<\u002Fstrong>; readers who disagree with that analytical stance should weight the company's narrative more heavily.<\u002Fli><\u002Ful>\n<p><em>End of <a class=\"xr\" href=\"#part-ii\">Volume II<\u002Fa>. <a class=\"xr\" href=\"#part-iii\">Volume III<\u002Fa> not commenced, per scope.<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" data-part=\"3\">\n<header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part III<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">III<\u002Fspan><\u002Fdiv><h1 id=\"part-iii\" class=\"part\" data-short=\"Part III — Operations, Identity Infrastructure, Data, Technology &amp; Organisational Design\">Operations, Identity Infrastructure, Data, Technology &amp; Organisational Design<\u002Fh1><p class=\"opener-s\">How records are attached to people at national scale — and what happens, commercially and legally, when that attachment is wrong.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">III<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Numbered sections<\u002Fdiv><div class=\"plate-v\">17<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Tables<\u002Fdiv><div class=\"plate-v\">4<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-operations-identity-infrastructure-data-technology-organisational-design\"><span class=\"inpart-n\"><\u002Fspan><span>Operations, Identity Infrastructure, Data, Technology &amp; Organisational Design<\u002Fspan><\u002Fa><a href=\"#s-iii-0\"><span class=\"inpart-n\">III.0<\u002Fspan><span>Framing and the central finding<\u002Fspan><\u002Fa><a href=\"#s-iii-1\"><span class=\"inpart-n\">III.1<\u002Fspan><span>Operating Model<\u002Fspan><\u002Fa><a href=\"#s-iii-2\"><span class=\"inpart-n\">III.2<\u002Fspan><span>Data Ingestion and Furnisher Operations (replaces Transaction Processing)<\u002Fspan><\u002Fa><a href=\"#s-iii-3\"><span class=\"inpart-n\">III.3<\u002Fspan><span>Identity Resolution and Matching (replaces Treasury) — PRIORITY DEPTH<\u002Fspan><\u002Fa><a href=\"#s-iii-4\"><span class=\"inpart-n\">III.4<\u002Fspan><span>Database and Platform Architecture<\u002Fspan><\u002Fa><a href=\"#s-iii-5\"><span class=\"inpart-n\">III.5<\u002Fspan><span>Decisioning and Delivery Operations<\u002Fspan><\u002Fa><a href=\"#s-iii-6\"><span class=\"inpart-n\">III.6<\u002Fspan><span>The Consumer Operation<\u002Fspan><\u002Fa><a href=\"#s-iii-7\"><span class=\"inpart-n\">III.7<\u002Fspan><span>Model Development, Governance and the Explainability Constraint — NEW SECTION, PRIORITY DEPTH<\u002Fspan><\u002Fa><a href=\"#s-iii-8\"><span class=\"inpart-n\">III.8<\u002Fspan><span>Security Architecture<\u002Fspan><\u002Fa><a href=\"#s-iii-9\"><span class=\"inpart-n\">III.9<\u002Fspan><span>The Dispute and Consumer-Rights Production Line — PRIORITY DEPTH<\u002Fspan><\u002Fa><a href=\"#s-iii-10\"><span class=\"inpart-n\">III.10<\u002Fspan><span>Data Governance and Retention<\u002Fspan><\u002Fa><a href=\"#s-iii-11\"><span class=\"inpart-n\">III.11<\u002Fspan><span>Reliability Engineering<\u002Fspan><\u002Fa><a href=\"#s-iii-12\"><span class=\"inpart-n\">III.12<\u002Fspan><span>Employee Architecture<\u002Fspan><\u002Fa><a href=\"#s-iii-13\"><span class=\"inpart-n\">III.13<\u002Fspan><span>Organisational Design and Decision Rights<\u002Fspan><\u002Fa><a href=\"#s-iii-14\"><span class=\"inpart-n\">III.14<\u002Fspan><span>Operating Leverage<\u002Fspan><\u002Fa><a href=\"#s-iii-15\"><span class=\"inpart-n\">III.15<\u002Fspan><span>Operations and Technology as Competitive Advantage<\u002Fspan><\u002Fa><a href=\"#s-iii-16\"><span class=\"inpart-n\">III.16<\u002Fspan><span>Volume III Reconstruction<\u002Fspan><\u002Fa><a href=\"#s-tl-dr-3\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR<\u002Fspan><\u002Fa><a href=\"#s-key-findings-3\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details-3\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-recommendations-2\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a href=\"#s-caveats-3\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats two\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">&gt;12m<\u002Fdiv><div class=\"stat-l\">consumer disputes a year<\u002Fdiv><\u002Fdiv><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">~US$0.57<\u002Fdiv><div class=\"stat-l\">reported cost per dispute letter<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<h2 id=\"s-operations-identity-infrastructure-data-technology-organisational-design\" class=\"hd hd2 n0\"><span class=\"ht\">Operations, Identity Infrastructure, Data, Technology &amp; Organisational Design<\u002Fspan><\u002Fh2>\n<p><em>Evidence classification used throughout:<\u002Fem> <strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan> / <span class=\"ev\">COMPANY CLAIM<\u002Fspan> / <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan> / <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> / <span class=\"ev\">HYPOTHESIS<\u002Fspan> / <span class=\"ev unk\">UNKNOWN<\u002Fspan>.<\u002Fstrong> Where Experian has published nothing about an internal mechanism, this volume writes <span class=\"ev unk\">UNKNOWN<\u002Fspan> rather than inventing plausible architecture. Litigation filings and the CFPB complaint are used as the richest public window into the matching and dispute systems, with allegations labelled as allegations.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-0\" class=\"hd hd2\"><span class=\"hn mono\">III.0<\u002Fspan><span class=\"ht\">Framing and the central finding<\u002Fspan><\u002Fh2>\n<p>The central question this volume must answer is whether identity resolution is a solved engineering problem that Experian executes well, or an irreducibly error-prone process whose failures are the unavoidable cost of the bureau model. On the evidence: <strong>it is the latter — but with a solvable excess margin that Experian has under-invested in closing.<\u002Fstrong> Matching roughly 1.3 billion monthly record updates to the right person among ~245 million consumers, with no universal identifier and with furnisher-supplied identity data of variable quality, is mathematically guaranteed to produce a non-zero rate of mixed and fragmented files. That floor is structural. But the <em>height<\u002Fem> of the floor is a policy choice — where the match threshold sits, whether reinsertion guards exist, how much discretion a dispute agent is given — and the CFPB's January 2025 complaint alleges Experian set those choices to minimise cost rather than maximise accuracy.<\u002Fp>\n<p>Company disclosure on internal systems is thin; adversarial sources (the CFPB complaint, FCRA litigation, NCLC research) are the richest window. This volume leans on them heavily.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-1\" class=\"hd hd2\"><span class=\"hn mono\">III.1<\u002Fspan><span class=\"ht\">Operating Model<\u002Fspan><\u002Fh2>\n<p><strong>Structure.<\u002Fstrong> Experian is organised as a four-region reporting matrix (North America; Latin America; UK &amp; Ireland; EMEA/Asia Pacific) overlaid on global business lines (B2B — Financial Services and Verticals; Consumer Services). <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: the FY26 Annual Report states Experian \"operate[s] across four geographic regions, which allows us to tailor our products to local market needs while sharing innovation globally.\" Headcount is roughly 25,200–25,346 across 32–33 countries (<span class=\"ev\">COMPANY CLAIM<\u002Fspan>: \"a team of 25,200 people across 33 countries\"; <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan>: Revelio Labs, 25,346 as of March 2026). Corporate HQ is Dublin; operational hubs are Nottingham, Costa Mesa and São Paulo.<\u002Fp>\n<p>The major operating functions, mapped:<\u002Fp>\n<div class=\"tw wide\"><table class=\"tbl\"><thead><tr><th>Function<\u002Fth><th>Mandate<\u002Fth><th>Key systems<\u002Fth><th>Legal entity (US)<\u002Fth><th>Automation/offshore<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Data acquisition &amp; furnisher mgmt<\u002Ftd><td>Onboard/certify furnishers, ingest Metro 2<\u002Ftd><td>Metro 2 intake, DataArc 360<\u002Ftd><td>Experian Information Solutions, Inc. (EIS)<\u002Ftd><td>High automation<\u002Ftd><\u002Ftr><tr><td>Ingestion &amp; data ops<\u002Ftd><td>Validate, normalise, QC ~1.3bn updates/mo<\u002Ftd><td>File One pipeline<\u002Ftd><td>EIS<\u002Ftd><td>High automation<\u002Ftd><\u002Ftr><tr><td>Identity resolution<\u002Ftd><td>Attach records to correct file<\u002Ftd><td>\"Find Consumer\" search-and-match<\u002Ftd><td>EIS<\u002Ftd><td>Fully automated<\u002Ftd><\u002Ftr><tr><td>Database operations<\u002Ftd><td>Maintain core files<\u002Ftd><td>File One (US); CAIS (UK)<\u002Ftd><td>EIS / Experian Ltd<\u002Ftd><td>Automated<\u002Ftd><\u002Ftr><tr><td>Analytics &amp; model dev<\u002Ftd><td>Build attributes, scores, models<\u002Ftd><td>Ascend, Ascend Intelligence Services<\u002Ftd><td>EIS / Experian Software Solutions<\u002Ftd><td>AI-augmented<\u002Ftd><\u002Ftr><tr><td>Product/platform eng<\u002Ftd><td>Build Ascend, APIs<\u002Ftd><td>AWS cloud stack<\u002Ftd><td>Group<\u002Ftd><td>Cloud-native<\u002Ftd><\u002Ftr><tr><td>Consumer operation<\u002Ftd><td>Serve 215m+ free members<\u002Ftd><td>Experian app, EVA, Boost<\u002Ftd><td>ConsumerInfo.com dba Experian Consumer Services<\u002Ftd><td>High automation<\u002Ftd><\u002Ftr><tr><td>Dispute/consumer-rights<\u002Ftd><td>FCRA <span class=\"nb\">§611<\u002Fspan> reinvestigation<\u002Ftd><td>e-OSCAR, Online Dispute Center<\u002Ftd><td>EIS<\u002Ftd><td>Highly automated + offshore<\u002Ftd><\u002Ftr><tr><td>Security<\u002Ftd><td>Protect the estate<\u002Ftd><td>zero-trust program<\u002Ftd><td>Group<\u002Ftd><td>—<\u002Ftd><\u002Ftr><tr><td>Compliance/permissible-purpose<\u002Ftd><td>Police access<\u002Ftd><td>subscriber vetting<\u002Ftd><td>EIS<\u002Ftd><td>Mixed<\u002Ftd><\u002Ftr><tr><td>Sales &amp; client integration<\u002Ftd><td>Onboard enterprise clients<\u002Ftd><td>PowerCurve, Ascend Sandbox<\u002Ftd><td>Regional<\u002Ftd><td>Manual-heavy<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>Regional operational reality vs. reporting geography.<\u002Fstrong> <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: the four regions are P&amp;L constructs; operational reality is more concentrated. The US bureau (EIS, an Ohio corporation) is the principal profit centre and runs the File One estate. Technology and analytics are increasingly centralised and cloud-based; India (Hyderabad; Experian Credit Information Co. of India, ~490 people per Revelio in the India credit entity, with a larger broader India technology footprint) is a significant technology and operations centre. Dispute processing is widely reported to rely on low-cost offshore vendors (see <a class=\"xr\" href=\"#s-iii-9\">III.9<\u002Fa>).<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-2\" class=\"hd hd2\"><span class=\"hn mono\">III.2<\u002Fspan><span class=\"ht\">Data Ingestion and Furnisher Operations (replaces Transaction Processing)<\u002Fspan><\u002Fh2>\n<p><strong>Scale and cadence.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (CFPB 2012 white paper, corroborated by Vol I/II figures): the NCRAs each maintain files on 200m+ adults and receive data from ~10,000 furnishers, who provide information on <strong>over 1.3 billion consumer credit accounts (tradelines) monthly<\u002Fstrong>. Most furnishing is monthly and highly concentrated: \"The 10 largest institutions furnishing credit information to each of the NCRAs account for more than half of all accounts,\" and retail and network-branded revolving cards are \"nearly 60% of all trade lines\" (CFPB 2012).<\u002Fp>\n<p><strong>The Metro 2 format.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: Metro 2 is the fixed-format data specification maintained by the CDIA's Metro 2 Task Force (Equifax, Experian, Innovis, TransUnion) and published in the annually-updated Credit Reporting Resource Guide (CRRG). It standardises identity fields (name, address, SSN, DOB) and account fields (balance, status, payment history, dates). Access to the format is restricted to furnishers, their processors and CRAs. Furnisher accuracy liability flows through FCRA <span class=\"nb\">§623<\u002Fspan> and Regulation V (12 CFR <span class=\"nb\">§1022<\u002Fspan>.42), which requires furnishers to maintain \"reasonable written policies and procedures regarding the accuracy and integrity\" of furnished data. Experian sells furnishers a compliance tool, DataArc 360, with \"over 130 pre-built rules\" to validate a Metro 2 file before submission (<span class=\"ev\">COMPANY CLAIM<\u002Fspan>, Experian/Edq).<\u002Fp>\n<p><strong>Onboarding, validation, screening.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (CFPB 2012): \"before accepting information from data furnishers, [the NCRAs] perform certain background and quality control checks on would-be-furnishers,\" and \"when data files are received, the NCRAs also perform quality checks prior to adding the data to credit files.\" The specific number, sequence and thresholds of Experian's internal validation stages are <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong> (not published). What is known: Metro 2 is internally consistent by design — the format is engineered so certain field combinations cannot lawfully coexist, so structurally invalid combinations can be detected at intake.<\u002Fp>\n<p><strong>Bad-furnisher detection.<\u002Fstrong> Adversarial framing (CFPB allegation): Experian \"routinely and uncritically accepts the original furnisher's response … even when that response was improbable or illogical on its face, or when Experian has other information available that suggests the furnisher is unreliable.\" This implies furnisher-reliability signals exist internally but are not consistently acted upon. Whether Experian systematically suppresses a chronically-erring furnisher's feed is <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp>\n<p><strong>Public records and the National Consumer Assistance Plan (NCAP).<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: NCAP — a settlement with 31+ state AGs, announced March 2015, phased through 2018 — imposed minimum PII standards (name, address, and SSN or DOB) and a minimum 90-day refresh on civil public records. Effective 1 July 2017 it removed <strong>all civil judgments and roughly half of tax liens<\u002Fstrong>; by April 2018 all tax liens were removed; bankruptcies remained. Experian's own analysis projected ~96% of civil-judgment data would fail the new PII standard. <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (CFPB): pre-NCAP, ~6% of consumers had a judgment or lien; post-implementation, ~1.4% had a tax lien and none had civil judgments, yet the CFPB found \"removal of public records has little effect on consumers' credit scores.\" Phase 2 restricted medical-debt reporting (180-day delay; paid medical debt removed).<\u002Fp>\n<p><strong>UK CAIS.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: Experian Limited (FCA-authorised) operates CAIS (Credit Account Information Sharing), which shares 350m+ records across ~400 institutions on a reciprocity / closed-user-group basis (data-in for data-out). Detailed CAIS validation architecture is not publicly detailed — partially <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp>\n<p><strong>Serasa (Brazil).<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: Serasa S.A. operates the Brazilian bureau covering ~100m Brazilians; positive-data sharing operates under the Cadastro Positivo regime (Lei 12.414 as amended by <span class=\"nb\">LC 166/2019<\u002Fspan>), which shifted to an opt-out (automatic inclusion) model. Serasa's internal ingestion pipeline specifics are <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp>\n<p><strong>illion (Australia/NZ).<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: illion's BankStatements retrieves 47m+ transactions weekly from 2.7m+ individuals for 5,000+ customers via open-banking / bank-statement retrieval — a real-time, consent-based ingestion model distinct from the monthly batch bureau feed.<\u002Fp>\n<p><strong>Rejection/exception rates: <span class=\"ev unk\">UNKNOWN<\u002Fspan>.<\u002Fstrong> No public figure quantifies the proportion of records rejected or held in exception at Experian intake.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-3\" class=\"hd hd2\"><span class=\"hn mono\">III.3<\u002Fspan><span class=\"ht\">Identity Resolution and Matching (replaces Treasury) — PRIORITY DEPTH<\u002Fspan><\u002Fh2>\n<p>This is the enterprise's core operation. Everything downstream — scores, reports, decisions, disputes — depends on attaching each furnished record to exactly the right consumer.<\u002Fp>\n<figure class=\"fig\" id=\"figure-8\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 08<\u002Fspan><span class=\"fig-t\">Identity Matching: The Two-Sided Error Problem<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n<div class=\"f-box\"><div class=\"f-name\">A record arrives<\u002Fdiv><div class=\"f-meta\">Name, address, date of birth, partial or full SSN, account identifiers — furnished in bulk, at varying quality, with no universal identifier.<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box\"><div class=\"f-name\">Candidate retrieval<\u002Fdiv><div class=\"f-meta\">Among ~245m credit-active US consumers, a candidate set is retrieved and each candidate scored for similarity.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"conn\"><span class=\"conn-l\">The threshold is applied<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:stretch\">\n<div class=\"pnl\" style=\"border-color:var(--acc-solid)\"><div class=\"pnl-k\">Too loose →<\u002Fdiv><div class=\"f-name\" style=\"color:var(--acc);font-size:22px\">MIXED FILE<\u002Fdiv><div class=\"pnl-b\" style=\"margin-top:8px\">Two consumers merged into one file. The most damaging error class: one person's default appears in another person's history. Historically implicated by <strong>seven-of-nine SSN matching<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box solid\" style=\"display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-width:120px\"><div class=\"f-lbl\" style=\"color:var(--acc-dk)\">Threshold<\u002Fdiv><div class=\"f-name\" style=\"font-size:22px;margin-top:6px\">POLICY<br>CHOICE<\u002Fdiv><\u002Fdiv>\n<div class=\"pnl\"><div class=\"pnl-k\">Too tight →<\u002Fdiv><div class=\"f-name\" style=\"font-size:22px\">FRAGMENTED FILE<\u002Fdiv><div class=\"pnl-b\" style=\"margin-top:8px\">One consumer's history split across two or more files. The consumer is rendered thin-file or unscorable, and is declined for reasons that are an artefact of the match, not of their behaviour.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\">The threshold is a policy choice, not a physical constant — and the commercial incentive tilts toward looser matching, because a higher hit rate is what lenders value.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Threshold diagram with error zones on either side. Both error types are inherent to probabilistic matching; what is discretionary is where the threshold sits, and who bears the cost of each error class.<\u002Ffigcaption>\n<\u002Ffigure>\n<p><strong>The engine.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (primary source, Experian 2003 filing to the Administrative Office of the U.S. Courts): \"Experian has developed a complex 'search and match' system … called 'Find Consumer.' … 'Find Consumer' locates the consumer's record in our database and a credit report can be returned in 1.8 seconds. 'Find Consumer' relies on identification information provided on the input data … Name, address and SSN are used to search our database to identify all possible candidate consumers. After all matches are found, a complex and extensive series of edits are performed using various matrixes.\" The core database is <strong>File One<\u002Fstrong> (<span class=\"ev\">COMPANY CLAIM<\u002Fspan>: \"Experian's File One℠ database of more than 245 million credit-active consumers\"). Social Search / SSN-search logic \"match[es] and retrieve[s] consumers associated with the same Social Security number.\"<\u002Fp>\n<p><strong>File architecture.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (CFPB 2012): the NCRAs use differing data architectures. \"At least one NCRA organizes its database like a traditional flat filing system so that each consumer is linked to one file. Consumers' files are distinguished through matching logic using a consumer's personal identifiers such as name, address, SSN, and date of birth. Multiple or fragmented files can occur for a single person when information is reported with different identifying information.\" Which architecture is Experian's specifically is not disclosed there — the flat-file attribution to Experian is <strong><span class=\"ev\">HYPOTHESIS<\u002Fspan><\u002Fstrong>.<\u002Fp>\n<p><strong>Identifiers and technique.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: matching uses name (and prior names), current/former addresses, SSN (including partial-SSN matching), DOB and phone. The literature distinguishes deterministic matching (exact or exact-partial, e.g. last-four SSN, with support for transpositions/typos) from probabilistic matching (a match probability from degree of similarity). Experian's exact confidence thresholds and the deterministic/probabilistic blend are <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong> (proprietary), but the \"candidate set then matrix of edits\" description in the Find Consumer filing indicates a two-stage retrieve-then-score design consistent with rule-based deterministic linkage plus tolerance edits.<\u002Fp>\n<p><strong>The two-sided error problem.<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li><strong>Over-matching → mixed file.<\u002Fstrong> Two consumers' data merged. This is the single most damaging bureau error and the source of the largest FCRA verdicts. <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (NCLC <em>Automated Injustice<\u002Fem>, citing <em>Apodaca v. Discover Fin. Servs.<\u002Fem>): bureaus \"have been known to mismerge files when the consumers' names are similar and they share seven of nine digits in their SSN.\" NCLC's recommended fix — \"merely requiring an eight of nine SSN match and a flag if that match isn't perfect\" — shows the threshold is a tunable policy dial, not a physical constant.<\u002Fli><li><strong>Under-matching → fragmented file.<\u002Fstrong> History splits across two files, suppressing score or rendering a consumer unscorable. <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (CFPB \"Data Point: Credit Invisibles,\" 5 May 2015): \"As of 2010, 26 million consumers in the United States were credit invisible, representing about 11 percent of the adult population. An additional 19 million consumers, or 8.3 percent of the adult population, had credit records that were treated as unscorable\" (9.9m insufficient + 9.6m stale). (Vol I/II's ~28m/~21m are the later-vintage figures; the 26m/19m are the CFPB's foundational 2015 measurement.)<\u002Fli><\u002Ful>\n<p><strong>Incentive asymmetry.<\u002Fstrong> <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: the two errors are not symmetric in who bears the cost. A mixed file that inserts <em>bad<\u002Fem> data harms the consumer (who is not the paying customer) and helps no lender; a loose threshold that maximises \"hits\" on a lender's inquiry improves the bureau's fill/match rate — a metric lenders value. The commercial pressure therefore tilts toward looser matching, which produces mixed files. This asymmetry, not incompetence, is the structural driver.<\u002Fp>\n<p><strong>Scale of the problem.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (FTC \"Report to Congress Under Section 319 of the FACT Act,\" Fifth Interim Report, December 2012; n=1,001 randomly selected participants): \"26 percent of consumers reported a potential material error … and half of these consumers experienced a change in their credit score. For five percent of consumers, the error … could lead to them paying more.\" 21% had a modification after dispute; the FTC's most conservative measure found 9.7% had at least one confirmed material error, and 2.2% of all reports had a material error affecting the price of credit. Common contributing factors: common names, Jr./Sr. suffix confusion, family members at one address, transposed SSN digits, thin files. A 2021 academic study (arXiv 2105.07554) illustrates real-world noise: an Infutor→TransUnion match of 80m submitted individuals returned 49m matched — a ~61% match rate under controlled conditions.<\u002Fp>\n<p><strong>The identity graph beyond credit — and the legal firewalls.<\u002Fstrong> The same matching competence powers:<\u002Fp>\n<ul class=\"lst\"><li><strong>Fraud/identity:<\u002Fstrong> CrossCore (cloud orchestration platform, launched 2016), Precise ID (US identity verification/KBA), FraudNet, Hunter, Prove-ID; plus acquired assets (Ekata/Identity Network via a Mastercard partnership).<\u002Fli><li><strong>Marketing:<\u002Fstrong> the Experian Graph and Tapad. <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (Experian PLC, completed 19 November 2020): Experian acquired \"100% of Tapad from Telenor for a cash consideration of around US$280m,\" with forecast revenue of US$55m for the 12 months to 31 December 2020, placed in its North America Data segment (Telenor had itself bought Tapad for US$360m in January 2016). Plus AtData/Audigent-type email and audience assets.<\u002Fli><li><strong>Healthcare:<\u002Fstrong> Experian Health patient-identity resolution.<\u002Fli><\u002Ful>\n<p><strong>FOLLOW-THE-DATA-RIGHT — the firewalls.<\u002Fstrong> CONFIRMED legal constraint: FCRA data assembled for a permissible purpose (credit) may not lawfully be repurposed into a marketing audience, and marketing/consumer data may not enter a credit-eligibility decision (which would make the marketing dataset a \"consumer report\" and its user subject to FCRA). Operational capability (one matching engine can link across all estates) and legal permission (the estates must be firewalled) are separate constraints. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: the technical unity of the identity graph is precisely why the legal segregation must be enforced at the data-governance and access-control layer, not at the algorithm layer — the algorithm does not \"know\" which estate it is serving.<\u002Fp>\n<p><strong>The CFPB's matching allegation (reinsertion).<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (CFPB complaint, ¶¶91–97): \"Experian has failed to implement basic matching tools that prevent or greatly reduce the likelihood of reinsertion by a new furnisher of a previously deleted tradeline. For example, Experian has not implemented procedures to compare dates of first delinquencies, recent credit balance amounts, high credit balances, or the names of original creditors, to ascertain whether a newly reported tradeline constitutes a reinsertion.\" IMPLICATION for architecture: the same debt resold to a new debt buyer arrives with a <em>new<\u002Fem> furnisher identity and is treated by the matching engine as a new record with no dedupe against the <em>deleted<\u002Fem> record's substantive fields. This is an allegation, not a proven fact; it implies matching keys on furnisher+account identity rather than on the underlying debt's economic fingerprint.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-4\" class=\"hd hd2\"><span class=\"hn mono\">III.4<\u002Fspan><span class=\"ht\">Database and Platform Architecture<\u002Fspan><\u002Fh2>\n<p><strong>Core databases.<\u002Fstrong> File One (US consumer file, EIS); CAIS (UK, Experian Limited); Serasa's Brazilian databases; illion's Australian/NZ databases. Detailed schemas are not public.<\u002Fp>\n<p><strong>Cloud position — now precisely establishable.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: on <strong>19 June 2025<\u002Fstrong> Experian and AWS announced a <strong>10-year strategic agreement<\u002Fstrong> naming AWS as Experian's \"preferred cloud\" and strategic partner for generative AI. Quantified claims from Experian CTO Rodrigo Rodrigues (<span class=\"ev\">COMPANY CLAIM<\u002Fspan>): \"By moving to AWS, we've reduced our data processing time by 60%, improved our ability to launch new products from months to weeks, and can now analyze credit data in real-time.\" The migration involves \"migrating off mainframe computers and moving multiple on-premises servers to the cloud\" and developing \"more than 100 generative AI use-cases.\" This corroborates the Vol I/II position that North America and Brazil cloud migration was substantially complete by FY26 (Health excepted), with dual-run costs expected to fall from FY27.<\u002Fp>\n<p><strong>Ascend.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: the Experian Ascend Platform is cloud-native, available in North America, Brazil and the UK, unifying data, analytics, credit decisioning and fraud in a single interface; Ascend Ops handles model registration/test/deploy/monitor across cloud environments; Ascend Sandbox provisions a data sandbox that reduces model build \"from months to hours\" (<span class=\"ev\">COMPANY CLAIM<\u002Fspan>). A Forrester Total Economic Impact study (Experian-commissioned) claimed 183% ROI / US$13.3m NPV for a composite organisation. Carry-forward: 2,300+ client solutions, 37 product capabilities, 2,100+ attributes rising to ~6,000 with cashflow/transaction blending.<\u002Fp>\n<p><strong>Storage/streaming/serving.<\u002Fstrong> Specific named components (Kafka/Confluent, Kubernetes, Snowflake, Databricks) are <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong> for Experian by name; the confirmed stack is AWS-centric with generative AI on AWS. Health remains on legacy infrastructure (Vol I/II).<\u002Fp>\n<p><strong>Benchmark.<\u002Fstrong> Equifax completed a ~US$1.5bn–US$3bn cloud transformation on <strong>Google Cloud Platform<\u002Fstrong>, built around a \"single data fabric\" that unifies 100+ data sources and explicitly enhances \"the keying and linking of our data assets … identity resolution and fraud prevention\" — a materially different architectural choice (GCP + single data fabric) from Experian's AWS-centric, platform-led (Ascend) approach.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-5\" class=\"hd hd2\"><span class=\"hn mono\">III.5<\u002Fspan><span class=\"ht\">Decisioning and Delivery Operations<\u002Fspan><\u002Fh2>\n<p><strong>Real-time pull.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (Experian's own historical figure): a credit report can be returned in ~1.8 seconds via Find Consumer. Real-time API delivery is the norm for point-of-sale/online decisions.<\u002Fp>\n<p><strong>Batch.<\u002Fstrong> Prescreen and portfolio review run as batch jobs against the file; monthly furnisher updates are the dominant batch ingestion window.<\u002Fp>\n<p><strong>Tri-merge (US mortgage).<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: mortgage lenders pull all three bureaus via a mortgage reseller; the reseller sends simultaneous inquiries to Experian, Equifax and TransUnion, each independently retrieves its file and computes a score, and the reseller merges them, dedupes tradelines and applies the \"middle score\" convention. A tri-merge can cost ~US$200+ as of early 2026 (THIRD-PARTY). Resellers are a distinct channel/tier layered on top of the bureau.<\u002Fp>\n<p><strong>Deployment models.<\u002Fstrong> PowerCurve (decisioning software, on-prem/hosted/cloud variants) and Ascend Sandbox provisioning. Enterprise onboarding is manual-heavy; switching costs are high because integrations, attribute definitions and model recalibration are lender-specific — a source of stickiness (see <a class=\"xr\" href=\"#s-iii-15\">III.15<\u002Fa>).<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-6\" class=\"hd hd2\"><span class=\"hn mono\">III.6<\u002Fspan><span class=\"ht\">The Consumer Operation<\u002Fspan><\u002Fh2>\n<p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>: 215m+ free members globally; the app is used by ~85m consumers worldwide (SiliconANGLE/company). Registration/identity verification includes Experian Go (government ID + selfie for thin/no-file consumers). Free-report obligations run through FCRA and the AnnualCreditReport.com joint venture with Equifax and TransUnion. Security freezes, fraud alerts and locks are offered; Boost links bank accounts (open banking / permissioned data) to add positive telecom/utility/rent data, and the next-generation EVA (2026) now recognises everyday spending via connected accounts. Marketplace pre-qualification monetises the free base by routing pre-qualified offers (revenue is lead-gen/affiliate — the \"inverted value flow\" of Vol II).<\u002Fp>\n<p><strong>Cost of the free tier.<\u002Fstrong> <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: the free tier's marginal cost is low (cloud-served self-service + AI assistant EVA displacing human support) and is cross-subsidised by marketplace and premium conversion; the 300bps labour-cost reduction (Vol I/II) is partly attributable to AI-driven consumer self-service. Exact unit economics are <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-7\" class=\"hd hd2\"><span class=\"hn mono\">III.7<\u002Fspan><span class=\"ht\">Model Development, Governance and the Explainability Constraint — NEW SECTION, PRIORITY DEPTH<\u002Fspan><\u002Fh2>\n<p><strong>How models are built.<\u002Fstrong> Attribute engineering on the 2,100+ / ~6,000-attribute libraries; Ascend Intelligence Services for custom model build; Ascend Ops for deploy/monitor with drift detection.<\u002Fp>\n<p><strong>Adverse-action reason codes — the binding constraint.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: under ECOA/Regulation B and FCRA, a declined consumer must be told the principal reasons for the adverse action; when a credit score drives the decision, the key factors that adversely affected the score must be disclosed. FinRegLab (independent) calls this \"the most technically difficult explainability challenge for lenders using machine learning underwriting models.\" <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: Experian holds patents (e.g., US 11,922,495; US 12,050,975; US 12,321,826) on generating adverse-action reason codes from complex ML models using SHAP (Shapley additive explanations) and grouped partial-dependence plots. Experian markets \"patent-pending ML explainability … generate adverse action codes directly from the model.\"<\u002Fp>\n<p><strong>Does this prohibit opaque models in credit?<\u002Fstrong> <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, well-supported: effectively yes for the decision itself. A fully opaque model that cannot yield stable, defensible principal-reason codes is, in Experian's own words, \"effectively … unusable\" in a credit decision. The industry response is not \"don't use ML\" but \"use ML techniques constrained to remain explainable\" (monotonic gradient-boosted trees + post-hoc SHAP reason codes). The constraint shapes <em>which<\u002Fem> ML is deployable in-decision, not whether ML is used.<\u002Fp>\n<p><strong>Fair lending / disparate impact.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: ECOA/Reg B prohibit use of protected characteristics and their proxies; Experian markets fairness-aware training and disparate-impact testing. The precise internal testing regime is partly <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp>\n<p><strong>Model risk management (SR 11-7).<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: because Experian models are deployed inside supervised banks, they inherit bank MRM expectations (Fed/OCC SR 11-7). Experian launched <strong>Experian Assistant for Model Risk Management<\u002Fstrong> (31 July 2025, powered by ValidMind), claiming it can \"reduce internal approval times by up to 70%\" by automating model documentation, validation and monitoring for US and UK regulatory requirements; it won a 2026 BIG Innovation Award.<\u002Fp>\n<p><strong>Generative and agentic AI — productivity vs. decision.<\u002Fstrong> This is the crucial distinction:<\u002Fp>\n<ul class=\"lst\"><li><strong>Productivity / model-development side (no explainability constraint on the credit decision):<\u002Fstrong> Experian Assistant (launched Money20/20, 28 October 2024) compresses model build \"from months to days—or even hours\"; built in nine months; ~100 genAI use-cases developed with AWS; internal genAI for coding assistance. The 300bps labour-cost reduction (Vol I/II) sits substantially here.<\u002Fli><li><strong>Consumer side:<\u002Fstrong> EVA (Experian Virtual Assistant), an LLM-based financial copilot for ~85m app users; \"We treat generative AI outputs with the same rigor as credit data\" (Jack Yu, Experian).<\u002Fli><li><strong>Agentic:<\u002Fstrong> Experian launched an \"Agent Operating System\" and an \"Agent Trust\" ecosystem (2026), positioning for agentic commerce.<\u002Fli><li><strong>In the credit decision itself:<\u002Fstrong> generative AI is <em>not<\u002Fem> used to make the eligibility decision — that remains the domain of explainable, reason-code-producing models. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: genAI accelerates the <em>building and documenting<\u002Fem> of decision models and the <em>serving<\u002Fem> of consumer guidance, but the adverse-action requirement fences it out of the decision boundary.<\u002Fli><\u002Ful>\n<p><strong>Relationship to FICO/VantageScore.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (Vol I/II): Experian distributes FICO under licence (US$4.95 wholesale mortgage royalty) and co-owns VantageScore equally with Equifax and TransUnion. Experian's own attributes/scores compete alongside these distributed third-party scores — Experian is simultaneously a distributor of others' models and a builder of its own.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-8\" class=\"hd hd2\"><span class=\"hn mono\">III.8<\u002Fspan><span class=\"ht\">Security Architecture<\u002Fspan><\u002Fh2>\n<p><strong>History and posture.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: the 2015 T-Mobile breach exposed ~15m consumers. Per Experian North America's 1 October 2015 statement and T-Mobile CEO John Legere's letter, the hacker \"acquired the records of approximately 15 million people, including new applicants requiring a credit check for service or device financing from September 1, 2013 through September 16, 2015\"; Experian confirmed neither its consumer credit database nor T-Mobile's network was breached (Experian held the data to process T-Mobile credit applications). It settled November 2022 with a 40-state AG coalition: <strong>US$12.67m from Experian<\u002Fstrong> (plus a separate T-Mobile settlement; combined &gt;US$15–16m). The Experian settlement mandated a comprehensive information-security program incorporating <strong>zero-trust principles<\u002Fstrong>, data minimisation (specifically reducing SSN use as an identifier), executive-level reporting, encryption, segmentation, patch management, intrusion detection, firewalls, access controls, logging/monitoring, penetration testing and risk assessments.<\u002Fp>\n<p><strong>The 2017 Equifax effect.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: the Equifax breach affected 147 million consumers (per the 2019 FTC/CFPB settlement record) and triggered a ~US$1.5–3bn Equifax cloud-plus-security transformation, resetting industry expectations. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: it raised the disclosure and board-attention bar for all three bureaus; Experian's zero-trust settlement terms and AWS security emphasis reflect the post-2017 environment. NOTE (Vol I/II): Experian has <strong>no dedicated board-level data-ethics/privacy committee<\u002Fstrong> — a governance gap against the salience of this risk.<\u002Fp>\n<p><strong>Permissible-purpose enforcement.<\u002Fstrong> CONFIRMED vector: the largest practical breach vector for a bureau is not perimeter compromise but <em>credentialled access misuse<\u002Fem> — legitimate subscribers (or fraudsters posing as them) pulling reports without permissible purpose. Experian's 2012-era incident (an identity thief posing as a private investigator to abuse an Experian subsidiary's services) exemplifies this; the 2022 settlement addressed subscriber due diligence.<\u002Fp>\n<p><strong>Named CISO / certifications.<\u002Fstrong> The current group CISO is <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong> — Experian does not prominently publish the name (contrast Equifax's very public CISO Jamil Farshchi). Certifications (ISO 27001, SOC 2, PCI DSS) are held across various products but the precise scopes are <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong> at this granularity.<\u002Fp>\n<p><strong>Concentration risk.<\u002Fstrong> <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: holding files on ~245m US consumers in one estate is systemic concentration; the commercial irony is that Experian sells identity-protection products whose demand rises with breaches (including, historically, its own and competitors'). This is a genuine conflict-of-interest tension the company does not resolve structurally.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-9\" class=\"hd hd2\"><span class=\"hn mono\">III.9<\u002Fspan><span class=\"ht\">The Dispute and Consumer-Rights Production Line — PRIORITY DEPTH<\u002Fspan><\u002Fh2>\n<p><strong>Volume.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (CFPB complaint ¶33): \"Experian typically processes over a million consumer disputes per month\" — i.e. <strong>&gt;12m disputes/year at Experian alone<\u002Fstrong>. Channels: mail, phone, website (\"Online Dispute Center\") and mobile app. Industry baseline (CFPB 2012): ~8m consumer dispute contacts in 2011 generating 32–38m disputed items across the three bureaus; no official updated cross-bureau total has replaced this figure (the CFPB now reports <em>complaints<\u002Fem>, not disputes — 4.8m credit-reporting complaints Jan 2024–Jun 2025, ~3.9m about the big three).<\u002Fp>\n<figure class=\"fig\" id=\"figure-9\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 09<\u002Fspan><span class=\"fig-t\">The Dispute Production Line<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px\">\n<div class=\"ann\"><span class=\"f-num acc\">&gt;1m<\u002Fspan><span>disputes per month<\u002Fspan><\u002Fdiv>\n<div class=\"ann\"><span class=\"f-num acc\">&gt;12m<\u002Fspan><span>disputes per year<\u002Fspan><\u002Fdiv>\n<div class=\"ann\"><span class=\"f-num acc\">30 days<\u002Fspan><span>statutory clock, <span class=\"nb\">§611<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"ann\"><span class=\"f-num acc\">~US$0.57<\u002Fspan><span>reported vendor cost per letter<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"loop-nodes\">\n<div class=\"lnode\"><span class=\"lnum\">1<\u002Fspan><div><div class=\"f-name\">Consumer submits<\u002Fdiv><div class=\"f-meta\">By mail, phone, online or in-app. Channel choice materially affects what evidence can accompany the dispute.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode\"><span class=\"lnum\">2<\u002Fspan><div><div class=\"f-name\">Agent codes the dispute into a three-digit ACDV<\u002Fdiv><div class=\"f-meta\">The consumer's narrative is compressed into a standard dispute code. <strong>Consumer documents are not forwarded by default.<\u002Fstrong><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode\"><span class=\"lnum\">3<\u002Fspan><div><div class=\"f-name\">A minority is resolved internally<\u002Fdiv><div class=\"f-meta\">Where the bureau holds enough to decide — duplicates, obvious mismatches, previously-corrected items.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode\"><span class=\"lnum\">4<\u002Fspan><div><div class=\"f-name\">The majority is transmitted via <span class=\"acc\">e-OSCAR<\u002Fspan><\u002Fdiv><div class=\"f-meta\">The industry's shared dispute-routing utility, jointly used by the bureaux — the transport layer of the whole system.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode\"><span class=\"lnum\">5<\u002Fspan><div><div class=\"f-name\">The furnisher investigates under <span class=\"nb\">§623<\u002Fspan><\u002Fdiv><div class=\"f-meta\">The party that supplied the disputed data is the party that adjudicates it. The bureau does not re-underwrite the claim.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode\"><span class=\"lnum\">6<\u002Fspan><div><div class=\"f-name\">A two-digit response code returns; the bureau updates the file<\u002Fdiv><div class=\"f-meta\">Verified, modified, deleted or unresolved — expressed as a code, not as reasoning.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode last\"><span class=\"lnum\">7<\u002Fspan><div class=\"f-box\"><div class=\"f-name\">Result notice to the consumer<\u002Fdiv><div class=\"f-meta\">Within the 30-day statutory window. <strong>The process generates no revenue.<\u002Fstrong><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\">The only process that checks whether the data is correct is the only one that produces no revenue.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Seven-step process flow with cost and volume annotations. Volumes are order-of-magnitude industry figures; the per-letter economics are as reported of vendor arrangements and are contested in the litigation described at §V.17.<\u002Ffigcaption>\n<\u002Ffigure>\n<p><strong>The process (all steps).<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li><strong>Intake:<\u002Fstrong> consumer submits via mail/phone/online/app.<\u002Fli><li><strong>Coding:<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> — a bureau agent reads the submission and converts it into an <strong>ACDV (Automated Credit Dispute Verification)<\u002Fstrong>, \"a one-page form\" carrying identity fields plus the tradeline \"as currently reported,\" a <strong>three-digit dispute code<\u002Fstrong> and \"sometimes a short free-form description\" (CFPB ¶29). The bureau does <em>not<\u002Fem> forward the consumer's actual letter/documents by default. (Example specificity from the Second Amended Complaint: for an online \"account paid in full\" dispute Experian assigns code <strong>106<\u002Fstrong> rather than the more precise code <strong>010<\u002Fstrong> \"Settlement or partial payments accepted,\" because its Online Dispute Center does not permit the more precise code.)<\u002Fli><li><strong>Internal update vs. transmission:<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (CFPB ¶36) — \"Experian resolves a minority of disputes via an internal update. If Experian does not make an internal update, it prepares an ACDV to transmit to the furnisher through e-OSCAR.\"<\u002Fli><li><strong>Transmission via e-OSCAR:<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> — e-OSCAR is the web-based system jointly operated by Equifax, Experian, Innovis and TransUnion; \"the ACDV is typically the only way CRAs and furnishers communicate during a reinvestigation\" (¶32). Historically the NCRAs forward explanatory text in only a minority of cases (26% in the 2012 data) and generally do not forward consumer documentation.<\u002Fli><li><strong>Furnisher investigation (<span class=\"nb\">§623<\u002Fspan>):<\u002Fstrong> furnisher reviews its own records and returns the ACDV with a <strong>two-digit response code<\u002Fstrong> (verify/modify/delete).<\u002Fli><li><strong>Bureau determination:<\u002Fstrong> Experian updates the file per the furnisher response.<\u002Fli><li><strong>Consumer result notice:<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (CFPB allegation) — notices are alleged to be \"confusing, ambiguous, incorrect, or internally inconsistent.\"<\u002Fli><\u002Fol>\n<p><strong>The 30-day clock.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: FCRA <span class=\"nb\">§611<\u002Fspan> requires reinvestigation within 30 days (extendable to 45 in limited cases). Operational implication: the clock forces industrialisation — high volume × hard deadline × no revenue = pressure toward maximal automation and minimal per-dispute labour.<\u002Fp>\n<p><strong>Automation and offshoring.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (NCLC <em>Automated Injustice<\u002Fem>): bureaus limit the role of dispute handlers — \"or of the foreign workers employed by their offshore vendors — to little more than selecting … two or three digit codes. Workers do not examine documents, contact consumers by phone or email, or exercise any form of human discretion.\" NCLC also documented that \"one credit bureau has reduced the amount it pays to its vendor that handles disputes to a mere US$0.57 per dispute letter.\" IMPORTANT: the CFPB complaint itself does <strong>not<\u002Fstrong> name any offshore vendor or country and does not state a seconds-per-dispute figure — those specifics come from NCLC and prior litigation, not this case. Per-dispute agent time in seconds is <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong> from primary sources.<\u002Fp>\n<p><strong>The CFPB's operational allegations, decomposed.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (allegations): (a) faulty intake that fails to convey all relevant dispute information to the furnisher; (b) failure to pass consumer documentation to furnishers (despite a company policy requiring agents to attach it — \"in some cases its agents fail to do so,\" ¶36); (c) uncritical acceptance of furnisher responses \"even when … improbable or illogical on its face\"; (d) confusing result notices; (e) reinsertion
