 of previously-deleted tradelines for want of \"basic matching tools.\" Hard numbers pleaded: <strong>&gt;2 million disputes<\u002Fstrong> not forwarded to furnishers within five business days (January 2018–October 2021); <strong>&gt;100,000 disputed tradelines<\u002Fstrong> deleted rather than reinvestigated within 30 days (February 2019–February 2020), some later reinserted; <strong>&gt;1,700 consumer files<\u002Fstrong> left inaccurately reflecting joint-user status (June–December 2020). These are allegations; discovery is ongoing. Procedural posture (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>): original complaint filed 7 January 2025; a portion dismissed as time-barred (the \"Discrete Violations,\" Jan 2018–Oct 2021) on 5 May 2025; second amended complaint 22 August 2025; <strong>motion to dismiss denied 22 October 2025<\u002Fstrong>; Experian answered 3 November 2025; CFPB motion to strike affirmative defenses granted in part 26 January 2026; discovery ongoing as of March 2026.<\u002Fp>\n<p><strong>Cost and incentive.<\u002Fstrong> <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: disputes generate no revenue; the consumer is not the paying customer; the 30-day clock is fixed. The rational cost-minimising design is exactly what critics describe — code the dispute into two/three digits, forward via e-OSCAR, accept the furnisher's response, notify. At roughly US$0.57–a-few-dollars per dispute × &gt;12m/year, the operation might cost on the order of low tens of millions of dollars annually (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>; not disclosed) — trivial against US$8,445m revenue, which is precisely the problem the CFPB alleges: the operation is <em>cheap by design<\u002Fem>.<\u002Fp>\n<p><strong>Independent assessment.<\u002Fstrong> Both framings are claims to be tested. The company's \"we resolve the vast majority promptly\" is true on throughput but silent on <em>quality<\u002Fem>; the plaintiff-bar/NCLC \"sham\" framing is well-evidenced on mechanics (code-and-forward, no document review) but the legal question — whether that constitutes an unreasonable investigation under <span class=\"nb\">§611<\u002Fspan> — is what the litigation will decide. On the mechanics, the evidence supports the critics: a system that by default does not transmit the consumer's documents or free-text to the furnisher, and that accepts furnisher verification as dispositive, cannot conduct a substantive investigation of a factual dispute that the furnisher's own records may have caused.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-10\" class=\"hd hd2\"><span class=\"hn mono\">III.10<\u002Fspan><span class=\"ht\">Data Governance and Retention<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Jurisdiction<\u002Fth><th>Core retention rule<\u002Fth><th>Entity<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>US<\u002Ftd><td>FCRA <span class=\"nb\">§605<\u002Fspan>: most adverse items 7 years; Chapter 7 bankruptcy 10 years; inquiries ~2 years<\u002Ftd><td>EIS<\u002Ftd><\u002Ftr><tr><td>UK<\u002Ftd><td>~6-year default retention of account data post-closure<\u002Ftd><td>Experian Limited<\u002Ftd><\u002Ftr><tr><td>Brazil<\u002Ftd><td>Cadastro Positivo / LGPD-governed retention<\u002Ftd><td>Serasa S.A.<\u002Ftd><\u002Ftr><tr><td>EU/EMEA<\u002Ftd><td>GDPR-governed<\u002Ftd><td>regional entities<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>: NCAP removed civil judgments/most tax liens and delayed/limited medical-debt reporting. Consumer opt-outs include the prescreen opt-out (FCRA <span class=\"nb\">§604(e)<\u002Fspan>/<span class=\"nb\">§615(d)<\u002Fspan>, via OptOutPrescreen.com, jointly operated). Controller/processor allocation: in the T-Mobile matter Experian acted as a processor for T-Mobile's data — a reminder that the same firm is controller of its bureau file but processor for client-held data, a distinction that matters for breach liability. Cross-border flows between US, UK, EU and Brazil rely on GDPR transfer mechanisms (SCCs / UK IDTA) and intragroup agreements; document-level specifics are <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-11\" class=\"hd hd2\"><span class=\"hn mono\">III.11<\u002Fspan><span class=\"ht\">Reliability Engineering<\u002Fspan><\u002Fh2>\n<p>Availability expectations for a real-time credit-decision API are effectively \"always on\" — a bureau outage stops lending decisions economy-wide. <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: Experian claims post-AWS improvements in \"performance, security and reliability\" and 60% faster data processing. Published SLAs, DR/RTO/RPO targets, the exact monthly batch window, and peak-capacity plans (month-end, tax season, Black Friday, prescreen campaigns) are <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong> (not disclosed). No major public Experian bureau outage is established in this research. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: a week-long Experian outage would be severe but not total — mortgage tri-merge would degrade to bi-merge, and many lenders could fail over to Equifax/TransUnion; the bureau oligopoly's redundancy is itself a systemic backstop. The segments most exposed are those Experian dominates (certain prescreen, auto and Experian-exclusive attribute/fraud services) and mortgage (where all three are required).<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-12\" class=\"hd hd2\"><span class=\"hn mono\">III.12<\u002Fspan><span class=\"ht\">Employee Architecture<\u002Fspan><\u002Fh2>\n<p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> / THIRD-PARTY: ~25,200 (company) to 25,346 (Revelio, March 2026) employees across 32–33 countries; up ~10.8% since 2023 (Revelio) but down ~0.3% YoY in 2026. Major sites: Nottingham, Costa Mesa, Allen (Texas), São Paulo, Dublin and Hyderabad (India). The US is the single largest workforce share. Offshore/nearshore footprint concentrates technology (India) and dispute processing (offshore vendors, per NCLC). Attrition, union/works-council presence and skills mix are partly <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong>; Revelio reports employee sentiment \"neutral but improving.\"<\u002Fp>\n<p><strong>The 300bps labour-cost reduction.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (Vol I/II): labour cost fell to 32% of revenue, &gt;300bps lower than two years earlier. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: with headcount roughly flat-to-modestly-up while revenue grew 13% in FY26, the ratio decline is predominantly <strong>operating leverage + mix shift + AI-driven productivity<\u002Fstrong>, not headcount cuts. Revenue grew faster than heads; AI (Experian Assistant internally, EVA in consumer, genAI coding) raised output per head. This is genuine productivity, not workforce reduction.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-13\" class=\"hd hd2\"><span class=\"hn mono\">III.13<\u002Fspan><span class=\"ht\">Organisational Design and Decision Rights<\u002Fspan><\u002Fh2>\n<p>The group is a <strong>matrix<\u002Fstrong>: four regional P&amp;Ls × global business lines × a global product/technology organisation. <span class=\"ev\">CONFIRMED FACT<\u002Fspan>: the FY26 report frames the four-region structure as \"tailor[ing] products to local market needs while sharing innovation globally.\" Real operational power sits with (a) North America / EIS (the profit centre and File One owner) and (b) the global software/platform organisation (Ascend, Experian Software Solutions under Alex Lintner; AI under regional GMs such as Shri Santhanam in North America; COO Craig Boundy group-wide). <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (Vol I/II): there is <strong>no dedicated board data-ethics/privacy committee<\u002Fstrong> — meaning the highest-stakes decision (how data is used and how tightly it is matched/governed) is made in management, not at board-committee level. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: the consumer (ConsumerInfo.com) and B2B (EIS) organisations share the same underlying File One data but are legally and commercially separated by permissible-purpose firewalls; tension between them is resolved operationally, not by a standing governance body.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-14\" class=\"hd hd2\"><span class=\"hn mono\">III.14<\u002Fspan><span class=\"ht\">Operating Leverage<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Process<\u002Fth><th>Leverage class<\u002Fth><th>Rationale<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Data ingestion<\u002Ftd><td>Nearly automatic / sublinear<\u002Ftd><td>Batch Metro 2 intake scales with automation; marginal cost per record tiny<\u002Ftd><\u002Ftr><tr><td>Identity matching<\u002Ftd><td>Nearly automatic<\u002Ftd><td>Find Consumer runs at ~1.8s/query; compute scales cheaply on cloud<\u002Ftd><\u002Ftr><tr><td>Report delivery<\u002Ftd><td>Nearly automatic<\u002Ftd><td>API/cloud; marginal cost ≈ compute<\u002Ftd><\u002Ftr><tr><td>Attribute computation<\u002Ftd><td>Sublinear<\u002Ftd><td>Precomputed/cloud; amortised across all clients<\u002Ftd><\u002Ftr><tr><td>Model development<\u002Ftd><td>Step-fixed → falling<\u002Ftd><td>AI (Experian Assistant) converts months→hours; big fixed skill base, falling marginal<\u002Ftd><\u002Ftr><tr><td>Dispute handling<\u002Ftd><td><strong>Linear-to-disproportionate<\u002Fstrong><\u002Ftd><td>Volume-driven labour + legal/litigation exposure; the one genuinely cost-growing, risk-laden process<\u002Ftd><\u002Ftr><tr><td>Consumer membership servicing<\u002Ftd><td>Sublinear<\u002Ftd><td>Self-service + EVA displace human cost<\u002Ftd><\u002Ftr><tr><td>Client integration<\u002Ftd><td>Step-fixed / linear<\u002Ftd><td>Manual, bespoke; grows with client count<\u002Ftd><\u002Ftr><tr><td>Marketplace<\u002Ftd><td>Nearly automatic<\u002Ftd><td>Lead-routing scales with traffic<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>Where the 28.6% Benchmark EBIT margin comes from, operationally:<\u002Fstrong> the near-zero marginal cost of matching and delivering a report against proprietary data already collected (90%+ of revenue is proprietary-data-derived), amplified by cloud (60% faster processing; dual-run costs falling from FY27) and AI productivity. Margin is highest where data is reused most (North America, 34.2% Benchmark EBIT margin) and lowest where the model is people/build-heavy or sub-scale (EMEA/AP, 6.7%).<\u002Fp>\n<p><strong>Is the dispute operation the one genuinely disproportionate cost?<\u002Fstrong> <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: yes — not in raw dollars (it is cheap per unit) but in <em>risk-adjusted<\u002Fem> cost. It is the only major process where volume, a hard legal deadline, litigation exposure and regulatory enforcement compound. The CFPB suit converts a low-dollar operation into a potentially high-dollar liability. It is the margin's structural soft spot.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-15\" class=\"hd hd2\"><span class=\"hn mono\">III.15<\u002Fspan><span class=\"ht\">Operations and Technology as Competitive Advantage<\u002Fspan><\u002Fh2>\n<p>Scoring each asset (P=proprietary, HR=hard-to-reproduce, CR=cost-reducing, QI=quality-improving, RS=regulator-satisfying, C=compounds-with-volume):<\u002Fp>\n<div class=\"tw wide\"><table class=\"tbl\"><thead><tr><th>Asset<\u002Fth><th>P<\u002Fth><th>HR<\u002Fth><th>CR<\u002Fth><th>QI<\u002Fth><th>RS<\u002Fth><th>C<\u002Fth><th>Verdict<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Identity graph / matching engine<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>~<\u002Ftd><td>~<\u002Ftd><td>✓<\u002Ftd><td>Core moat; QI is the weak axis (mixed files)<\u002Ftd><\u002Ftr><tr><td>Ingestion scale + furnisher relationships<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>Deepest moat — reciprocity (data-in-for-data-out) is self-reinforcing<\u002Ftd><\u002Ftr><tr><td>Attribute library (2,100→6,000)<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>—<\u002Ftd><td>✓<\u002Ftd><td>~<\u002Ftd><td>✓<\u002Ftd><td>Strong; differentiator vs. raw data<\u002Ftd><\u002Ftr><tr><td>Ascend platform<\u002Ftd><td>~<\u002Ftd><td>~<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>Strong but replicable (Equifax Ignite, TU equivalents)<\u002Ftd><\u002Ftr><tr><td>Fraud stack (CrossCore/Precise ID)<\u002Ftd><td>✓<\u002Ftd><td>~<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>✓<\u002Ftd><td>Strong; open-orchestration model invites partners<\u002Ftd><\u002Ftr><tr><td>Dispute infrastructure<\u002Ftd><td>—<\u002Ftd><td>—<\u002Ftd><td>✓<\u002Ftd><td>✗<\u002Ftd><td>✗<\u002Ftd><td>✗<\u002Ftd><td><strong>Not a moat — a liability;<\u002Fstrong> shared e-OSCAR, QI/RS negative<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>Comparison with Equifax and TransUnion.<\u002Fstrong> Equifax completed a heavily-publicised ~US$1.5–3bn GCP transformation with a single data fabric and public CISO leadership; it is arguably ahead on the <em>narrative<\u002Fem> of security-and-cloud remediation (forced by 2017). Experian's differentiator is the <strong>Ascend platform-led commercial model<\u002Fstrong> on AWS and its consumer franchise (215m+ members). TransUnion is the smallest of the three and the closest operational comparator on the bureau core. The three share e-OSCAR, Metro 2 and the tri-merge plumbing — meaning the <em>dispute and format infrastructure is an industry commons, not a competitive differentiator for any of them<\u002Fem>.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-iii-16\" class=\"hd hd2\"><span class=\"hn mono\">III.16<\u002Fspan><span class=\"ht\">Volume III Reconstruction<\u002Fspan><\u002Fh2>\n<p><strong>(1) Operating-Model Diagram (text).<\u002Fstrong> Furnishers (~10,000) → [Metro 2 batch, ~1.3bn/mo] → Ingestion/validation (DataArc-style QC) → <strong>Find Consumer matching → File One (245m)<\u002Fstrong> → {Report delivery API (~1.8s) | Attribute computation (2,100→6,000) | Scores: FICO/VantageScore/Experian} → Clients (lenders via API/batch/PowerCurve/Ascend; mortgage via reseller tri-merge). Parallel firewalled estates: Fraud (CrossCore/Precise ID) · Marketing (Experian Graph/Tapad) · Health (patient identity). Consumer loop: ConsumerInfo.com (215m members, EVA, Boost, Marketplace) ↔ File One (permissible-purpose gated). Dispute loop: Consumer → Online Dispute Center/mail/phone → ACDV → e-OSCAR → Furnisher <span class=\"nb\">§623<\u002Fspan> → determination → notice.<\u002Fp>\n<p><strong>(2) Ingestion Pipeline.<\u002Fstrong> Furnisher certification → Metro 2 submission (monthly) → format/structural validation → identity/quality checks → matching → file update → exception queue (rate <span class=\"ev unk\">UNKNOWN<\u002Fspan>).<\u002Fp>\n<p><strong>(3) Identity-Resolution Architecture.<\u002Fstrong> Input identity (name/address/SSN/DOB/phone) → candidate retrieval → matrix of edits/tolerance rules (deterministic + probabilistic blend, thresholds <span class=\"ev unk\">UNKNOWN<\u002Fspan>) → attach to file OR create new OR flag fragment. Failure modes: over-match→mixed file (7-of-9 SSN heuristic implicated historically); under-match→fragment/unscorable.<\u002Fp>\n<p><strong>(4) Database/Platform.<\u002Fstrong> File One (US, EIS) · CAIS (UK) · Serasa DBs · illion DBs; all US/Brazil (ex-Health) on AWS (10-yr deal, June 2025); Ascend cloud-native; Health on legacy.<\u002Fp>\n<p><strong>(5) Delivery/Integration Map.<\u002Fstrong> Real-time API · batch prescreen/portfolio · tri-merge via resellers · PowerCurve · Ascend Sandbox. High switching costs.<\u002Fp>\n<p><strong>(6) Consumer Operation Map.<\u002Fstrong> Registration/Experian Go (ID+selfie) · AnnualCreditReport.com JV · freezes/alerts/locks · Boost (open banking) · EVA (LLM) · Marketplace pre-qual.<\u002Fp>\n<p><strong>(7) Model Governance/Explainability.<\u002Fstrong> Explainable ML (monotonic GBMs + SHAP reason codes; patents 11,922,495 / 12,050,975 / 12,321,826) in-decision; genAI (Experian Assistant, EVA, Agent OS) for build/serve/support, fenced out of the decision; SR 11-7 MRM (Experian Assistant for MRM, ValidMind, \"up to 70%\" faster approvals).<\u002Fp>\n<p><strong>(8) Security Map.<\u002Fstrong> Zero-trust program (2022 settlement-mandated) · SSN-minimisation · encryption/segmentation between estates · permissible-purpose access control as top vector · concentration risk on 245m files · no board data committee · CISO name <span class=\"ev unk\">UNKNOWN<\u002Fspan>.<\u002Fp>\n<p><strong>(9) Dispute Production Line.<\u002Fstrong> &gt;1m/mo (&gt;12m/yr) → ACDV (3-digit code) → e-OSCAR → <span class=\"nb\">§623<\u002Fspan> furnisher → determination → notice; documents not forwarded by default; offshore/automated; CFPB \"sham\" allegations (&gt;2m not forwarded in 5 days; &gt;100k deleted-not-investigated; reinsertion for want of matching tools).<\u002Fp>\n<p><strong>(10) Data Governance/Retention Matrix.<\u002Fstrong> (See <a class=\"xr\" href=\"#s-iii-10\">III.10<\u002Fa> table.)<\u002Fp>\n<p><strong>(11) Reliability Assessment.<\u002Fstrong> \"Always-on\" expectation; SLAs/DR <span class=\"ev unk\">UNKNOWN<\u002Fspan>; oligopoly failover cushions a single-bureau outage; mortgage most exposed.<\u002Fp>\n<p><strong>(12) Employee/Site Map.<\u002Fstrong> ~25,200–25,346; Costa Mesa/Nottingham/Allen/São Paulo/Dublin/Hyderabad; US largest; offshore for tech + disputes; 300bps labour-ratio fall = productivity/mix, not cuts.<\u002Fp>\n<p><strong>(13) Decision-Rights Map.<\u002Fstrong> Matrix; power in NA/EIS + global software/AI org; data-use decided in management, not board committee.<\u002Fp>\n<p><strong>(14) Operating-Leverage Matrix.<\u002Fstrong> (See <a class=\"xr\" href=\"#s-iii-14\">III.14<\u002Fa> table.) Margin from data reuse at near-zero marginal cost; dispute = the disproportionate risk-adjusted cost.<\u002Fp>\n<p><strong>(15) Operations Moat Assessment.<\u002Fstrong> (See <a class=\"xr\" href=\"#s-iii-15\">III.15<\u002Fa> table.) Deepest moat = ingestion scale/furnisher reciprocity; weakest link = dispute infra (a shared liability).<\u002Fp>\n<p><strong>(16) Key Unknowns.<\u002Fstrong> Match thresholds/architecture specifics; internal validation stage count; rejection/exception rates; dispute per-unit cost and offshore-vendor identity; CISO name; SLA/DR targets; certification scopes; cross-border transfer mechanisms at document level.<\u002Fp>\n<p><strong>(17) Ten Most Important Conclusions.<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li>Identity resolution is the enterprise's core operation and its origin of worst failures; it is <em>irreducibly<\u002Fem> error-prone, but the error rate is a tunable policy choice Experian has under-optimised for accuracy.<\u002Fli><li>The match-threshold incentive is asymmetric: looser matching raises fill/match rates lenders value while the cost of mixed files lands on non-paying consumers — a structural bias toward over-matching.<\u002Fli><li>Ingestion scale plus furnisher reciprocity (data-in-for-data-out) is the deepest, most compounding moat — harder to replicate than any algorithm.<\u002Fli><li>The dispute operation is a regulated industrial line built to minimise cost, not maximise substantive investigation; its default of not forwarding consumer documents is the mechanical heart of the CFPB case.<\u002Fli><li>The dispute operation is the margin's soft spot — cheap per unit, disproportionate in risk-adjusted cost, now crystallised by live federal litigation.<\u002Fli><li>The explainability constraint does not stop AI in credit — it channels it: explainable ML in the decision, generative/agentic AI in build/serve/support.<\u002Fli><li>The 300bps labour-cost fall is genuine productivity and operating leverage (revenue +13%, heads roughly flat), aided by AI — not headcount reduction.<\u002Fli><li>Cloud is now decisively AWS (10-year deal, June 2025) with claimed 60% faster processing — a different bet from Equifax's GCP single-data-fabric.<\u002Fli><li>The identity graph is technically unified across credit/fraud/marketing/health, so the legal firewalls must be enforced at governance/access layers, not in the algorithm — a permanent control burden.<\u002Fli><li>A one-week Experian outage would badly disrupt but not halt US lending: mortgage degrades to bi-merge and many lenders fail over to the other two bureaus — the oligopoly is its own backstop.<\u002Fli><\u002Fol>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-tl-dr-3\" class=\"hd hd2 n0\"><span class=\"ht\">TL;DR<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Identity resolution is Experian's true core operation and its greatest fragility.<\u002Fstrong> Attaching ~1.3bn monthly records to ~245m consumers via the \"Find Consumer\" engine into the File One database is irreducibly error-prone (the FTC's 2012 <span class=\"nb\">§319<\u002Fspan> study found 26% of consumers reported a potential material error and ~5% had errors that could raise their cost of credit); the <em>baseline<\u002Fem> error rate is structural, but the <em>excess<\u002Fem> rate — mixed files from loose matching and reinsertion of deleted tradelines — is an avoidable, cost-driven policy choice, now the subject of the CFPB's live suit (motion to dismiss denied 22 October 2025, discovery ongoing).<\u002Fli><li><strong>The dispute production line is a deliberately cheap, highly-automated, partly-offshored operation<\u002Fstrong> handling &gt;1m disputes/month at Experian alone, coding each into a three-digit ACDV, routing it through the shared e-OSCAR system to the furnisher, and by default <em>not<\u002Fem> forwarding the consumer's documents — the mechanical heart of the CFPB's \"sham investigations\" allegation and the margin's structural soft spot (disproportionate in risk-adjusted, not dollar, terms).<\u002Fli><li><strong>The 28.6% margin comes from reusing already-collected proprietary data at near-zero marginal cost<\u002Fstrong>, now amplified by a 10-year AWS cloud deal (June 2025; claimed 60% faster processing) and AI productivity (Experian Assistant, EVA); explainability (adverse-action reason codes via patented SHAP-based methods) bars opaque models from the <em>decision<\u002Fem> but leaves generative/agentic AI free to accelerate model-building, servicing and documentation — where the 300bps labour-cost fall actually originates.<\u002Fli><\u002Ful>\n<h2 id=\"s-key-findings-3\" class=\"hd hd2 n0\"><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Cloud is AWS.<\u002Fstrong> CONFIRMED: 10-year \"preferred cloud\" + genAI partnership announced 19 June 2025; migration off mainframes; \"reduced data processing time by 60%\"; 100+ genAI use-cases. Equifax, by contrast, built its post-breach single data fabric on Google Cloud (~US$1.5–3bn).<\u002Fli><li><strong>Matching thresholds are tunable and cost-biased.<\u002Fstrong> The 7-of-9-SSN mismerge heuristic (NCLC/*Apodaca*) and the CFPB's reinsertion allegation (no comparison of first-delinquency date, balances or original creditor) both show accuracy is limited by policy, not physics.<\u002Fli><li><strong>The dispute operation's economics explain its quality.<\u002Fstrong> No revenue, a fixed 30-day clock, and reported vendor costs as low as US$0.57/dispute letter (NCLC) drive a code-and-forward design with minimal human discretion.<\u002Fli><li><strong>Explainability channels rather than blocks AI.<\u002Fstrong> Patented reason-code generation (US 11,922,495 / 12,050,975 / 12,321,826) keeps decision models explainable; genAI is deployed in development, MRM (Experian Assistant for MRM, \"up to 70%\" faster approvals) and consumer servicing (EVA, ~85m users).<\u002Fli><li><strong>Governance gap.<\u002Fstrong> No dedicated board data-ethics/privacy committee and an unnamed public CISO, against a 245m-file concentration risk and a 2022 zero-trust settlement.<\u002Fli><\u002Ful>\n<h2 id=\"s-details-3\" class=\"hd hd2 n0\"><span class=\"ht\">Details<\u002Fspan><\u002Fh2>\n<p>Full mechanism-level analysis is in sections <a class=\"xr\" href=\"#s-iii-1\">III.1<\u002Fa>–<a class=\"xr\" href=\"#s-iii-16\">III.16<\u002Fa> above, covering the operating model; the Metro 2 ingestion pipeline and NCAP public-record purge; the Find Consumer / File One matching engine and the mixed-file/fragmented-file error economics; the AWS/Ascend platform stack; delivery, tri-merge and consumer operations; the model-governance/explainability regime; the security posture and its litigation history; the e-OSCAR dispute production line and the CFPB's pleaded numbers; retention and cross-border governance; reliability; the workforce and the 300bps labour-cost analysis; decision rights; the operating-leverage classification; and the moat assessment versus Equifax and TransUnion.<\u002Fp>\n<h2 id=\"s-recommendations-2\" class=\"hd hd2 n0\"><span class=\"ht\">Recommendations<\u002Fspan><\u002Fh2>\n<p>For a reader assessing Experian operationally (investor, regulator, counterparty), staged actions and the thresholds that would change them:<\u002Fp>\n<ol class=\"lst\"><li><strong>Track the CFPB case as the single most material operational-risk item.<\u002Fstrong> Benchmark: an adverse ruling or consent order requiring routine transmission of consumer documents/free-text and substantive human review would raise the dispute operation's unit cost by an order of magnitude and set an industry precedent binding Equifax and TransUnion too. A settlement without operational mandates would confirm the status quo.<\u002Fli><li><strong>Watch for disclosure of matching-quality metrics.<\u002Fstrong> Benchmark: if Experian (or a court in discovery) publishes mixed-file rates or tightens SSN-match thresholds (e.g., to 8-of-9 with a flag), that signals genuine accuracy investment; continued silence signals the cost-minimising equilibrium persists.<\u002Fli><li><strong>Monitor cloud dual-run cost roll-off from FY27<\u002Fstrong> as the near-term margin catalyst; benchmark against the claimed 60% processing-time reduction translating into disclosed cost savings.<\u002Fli><li><strong>Distinguish AI productivity from AI decisioning in all company claims.<\u002Fstrong> Treat genAI margin claims as real (build/serve/support) but treat any suggestion of genAI <em>in the credit decision<\u002Fem> skeptically — the explainability constraint makes it unlikely and, if true, a regulatory red flag.<\u002Fli><li><strong>Press for the CISO identity, certification scopes and DR/SLA disclosure<\u002Fstrong> — their absence is itself a governance signal given the concentration risk.<\u002Fli><\u002Fol>\n<h2 id=\"s-caveats-3\" class=\"hd hd2 n0\"><span class=\"ht\">Caveats<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li>Experian publishes very little about internal systems; many architectural specifics (validation stage counts, match thresholds, rejection/exception rates, dispute unit cost, offshore-vendor identity, CISO name, SLA/DR targets, certification scopes, cross-border transfer instruments) are <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong> and are labelled as such rather than invented.<\u002Fli><li>The CFPB's operational descriptions are <strong>allegations<\u002Fstrong> subject to ongoing litigation; the pleaded numbers (&gt;2m disputes not forwarded in five days; &gt;100k deleted-not-investigated; &gt;1,700 mis-flagged joint-user files) are the Bureau's claims, not adjudicated facts.<\u002Fli><li>Several quantified accuracy and dispute-volume figures rest on the FTC's 2012 <span class=\"nb\">§319<\u002Fspan> study and the CFPB's 2012 white paper; no official cross-bureau update to the \"~8m contacts / 32–38m items\" dispute baseline has been published, and the CFPB now reports <em>complaints<\u002Fem> rather than <em>disputes<\u002Fem> — the two must not be conflated.<\u002Fli><li>Headcount figures blend a company statement (~25,200) with a third-party estimate (Revelio, 25,346) that may use a different consolidation basis.<\u002Fli><li>Some ROI and performance figures (Forrester TEI; \"up to 70%\"; \"60%\") are company or company-commissioned claims and are labelled <span class=\"ev\">COMPANY CLAIM<\u002Fspan>.<\u002Fli><\u002Ful>\n<p><em><a class=\"xr\" href=\"#part-iii\">Volume III<\u002Fa> ends here. <a class=\"xr\" href=\"#part-iv\">Volume IV<\u002Fa> not begun.<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" data-part=\"4\">\n<header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part IV<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">IV<\u002Fspan><\u002Fdiv><h1 id=\"part-iv\" class=\"part\" data-short=\"Part IV — Financial Statements, Revenue Architecture, Unit Economics &amp; Capital\">Financial Statements, Revenue Architecture, Unit Economics &amp; Capital<\u002Fh1><p class=\"opener-s\">Where a 28.6% Benchmark margin comes from when the raw material costs nothing, and what the Benchmark number leaves out.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">IV<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Numbered sections<\u002Fdiv><div class=\"plate-v\">18<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Tables<\u002Fdiv><div class=\"plate-v\">9<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-financial-statements-revenue-architecture-unit-economics-capital\"><span class=\"inpart-n\"><\u002Fspan><span>Financial Statements, Revenue Architecture, Unit Economics &amp; Capital<\u002Fspan><\u002Fa><a href=\"#s-tl-dr-the-core-answer\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR (the core answer)<\u002Fspan><\u002Fa><a href=\"#s-key-findings-4\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details-4\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-iv-1\"><span class=\"inpart-n\">IV.1<\u002Fspan><span>Multi-Year Financial History<\u002Fspan><\u002Fa><a href=\"#s-iv-2\"><span class=\"inpart-n\">IV.2<\u002Fspan><span>Revenue Taxonomy and Quality<\u002Fspan><\u002Fa><a href=\"#s-iv-3\"><span class=\"inpart-n\">IV.3<\u002Fspan><span>Revenue Recognition and Accounting Judgements<\u002Fspan><\u002Fa><a href=\"#s-iv-4\"><span class=\"inpart-n\">IV.4<\u002Fspan><span>Pricing Economics and the Mortgage Question<\u002Fspan><\u002Fa><a href=\"#s-iv-5\"><span class=\"inpart-n\">IV.5<\u002Fspan><span>The Cost Architecture of a Zero-Input-Cost Business [PRIORITY DEPTH]<\u002Fspan><\u002Fa><a href=\"#s-iv-6\"><span class=\"inpart-n\">IV.6<\u002Fspan><span>Unit Economics Across Incompatible Units<\u002Fspan><\u002Fa><a href=\"#s-iv-7\"><span class=\"inpart-n\">IV.7<\u002Fspan><span>Segment Economics<\u002Fspan><\u002Fa><a href=\"#s-iv-8\"><span class=\"inpart-n\">IV.8<\u002Fspan><span>The Statutory-to-Benchmark Forensic Reconciliation [PRIORITY DEPTH]<\u002Fspan><\u002Fa><a href=\"#s-iv-9\"><span class=\"inpart-n\">IV.9<\u002Fspan><span>Balance Sheet Teardown<\u002Fspan><\u002Fa><a href=\"#s-iv-10\"><span class=\"inpart-n\">IV.10<\u002Fspan><span>Cash Flow and Conversion<\u002Fspan><\u002Fa><a href=\"#s-iv-11\"><span class=\"inpart-n\">IV.11<\u002Fspan><span>Capital Intensity and Return on Capital<\u002Fspan><\u002Fa><a href=\"#s-iv-12\"><span class=\"inpart-n\">IV.12<\u002Fspan><span>Debt, Funding and Liquidity<\u002Fspan><\u002Fa><a href=\"#s-iv-13\"><span class=\"inpart-n\">IV.13<\u002Fspan><span>The Litigation and Regulatory Contingency<\u002Fspan><\u002Fa><a href=\"#s-iv-14\"><span class=\"inpart-n\">IV.14<\u002Fspan><span>Capital Allocation and Return on a Thirty-Year Acquisition Programme [PRIORITY DEPTH]<\u002Fspan><\u002Fa><a href=\"#s-iv-15\"><span class=\"inpart-n\">IV.15<\u002Fspan><span>One Dollar of Group Revenue (FY26, per US$1 of statutory revenue US$8,445m)<\u002Fspan><\u002Fa><a href=\"#s-iv-16\"><span class=\"inpart-n\">IV.16<\u002Fspan><span>Economic Driver Tree<\u002Fspan><\u002Fa><a href=\"#s-iv-17\"><span class=\"inpart-n\">IV.17<\u002Fspan><span>Scenario and Sensitivity Analysis [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> unless stated]<\u002Fspan><\u002Fa><a href=\"#s-iv-18\"><span class=\"inpart-n\">IV.18<\u002Fspan><span>Profitability Decomposition and Normalisation<\u002Fspan><\u002Fa><a href=\"#s-recommendations-3\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a href=\"#s-caveats-4\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats two\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono sm\">US$50 → US$540<\u002Fdiv><div class=\"stat-l\">credit-report cost per conventional loan, 2022–2026<\u002Fdiv><\u002Fdiv><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">US$271m<\u002Fdiv><div class=\"stat-l\">acquisition-intangible amortisation excluded from Benchmark<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<h2 id=\"s-financial-statements-revenue-architecture-unit-economics-capital\" class=\"hd hd2 n0\"><span class=\"ht\">Financial Statements, Revenue Architecture, Unit Economics &amp; Capital<\u002Fspan><\u002Fh2>\n<p><em>Basis convention (binding): Experian reports under IFRS in US dollars with a 31 March year-end. \"Benchmark\" denotes the company's non-GAAP suite (Benchmark EBIT, Benchmark PBT, Benchmark EBITDA, Benchmark EPS). Every figure below is labelled statutory or Benchmark, and every growth rate is labelled organic / constant-currency (CER) / actual-rate. FY26 = year to 31 March 2026; FY25 = year to 31 March 2025; and so on. Evidence tags: <span class=\"ev\">CONFIRMED FACT<\u002Fspan>, <span class=\"ev\">COMPANY CLAIM<\u002Fspan>, <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan>, <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, <span class=\"ev\">HYPOTHESIS<\u002Fspan>, <span class=\"ev unk\">UNKNOWN<\u002Fspan>. Arithmetic is shown for every derived figure so the reader can audit it.<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-tl-dr-the-core-answer\" class=\"hd hd2 n0\"><span class=\"ht\">TL;DR (the core answer)<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>The 28.6% Benchmark EBIT margin is not made by a free input; it is manufactured by three things: oligopolistic pricing power in a three-firm US bureau market, operating leverage over a largely fixed data-and-compliance platform, and net (agent) revenue recognition on the consumer marketplace. FY26 profitability is <em>mostly<\u002Fem> structural but is flattered by a non-durable US mortgage pricing windfall (mortgage revenue +45% on roughly flat volume) and depressed by cloud dual-run costs that roll off from FY27 — the two roughly offsetting.<\u002Fstrong><\u002Fli><li><strong>The Benchmark presentation is broadly fair on volatile financing items but flattering on the amortisation of acquisition intangibles (US$271m in FY26 and rising every year), which — for a company that acquires continuously — is in substance a permanent cost of strategy excluded from the headline number the market prices.<\u002Fstrong> Thirty years of acquisition created clear value in the core (North America, Latin America and UK cash-generating units have never been impaired) but destroyed roughly US$232m of goodwill at the margin in EMEA/Asia Pacific (US$53m impaired in FY21, US$179m in FY23).<\u002Fli><li><strong>The single variable that most determines earnings is US Financial Services inquiry pricing, above all mortgage. Growth is capital-light organically but capital-heavy through M&amp;A (US$792m in FY26) and an 8.6%-of-revenue capex load — so the \"capital-light information business\" label is only half true.<\u002Fstrong> ROCE of 17.2% comfortably exceeds the ~8–9% cost of capital, and leverage of 1.7x net-debt/EBITDA sits below the 2.0–2.5x target range, leaving ample capacity for both buybacks and deals.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-key-findings-4\" class=\"hd hd2 n0\"><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>Scale and shape (FY26, CONFIRMED):<\u002Fstrong> statutory revenue US$8,445m (+12% actual); ongoing revenue US$8,425m (+13% actual, +11% CER, +8% organic); Benchmark EBIT from ongoing activities US$2,407m at 28.6% margin; statutory operating profit US$2,045m; Benchmark PBT US$2,212m; statutory PBT US$1,951m (+26%); Benchmark EPS 179.8 US cents (+15% actual); statutory basic EPS 164.5 US cents (+29%); Benchmark operating cash flow US$2,221m at 93% conversion; Benchmark free cash flow US$1,583m; ROCE 17.2%; net debt US$5,179m at 1.7x Benchmark EBITDA.<\u002Fli><li><strong>The margin is a mix story, not an input story.<\u002Fstrong> North America (66.3% of revenue) earns 34.2%; EMEA/Asia Pacific earns 6.7%. The dispersion is driven by fixed-cost absorption, not pricing — the same data/platform cost base spread over vastly different revenue.<\u002Fli><li><strong>The FY26 mortgage windfall is a pricing event, not a franchise event, and it is politically exposed.<\u002Fstrong> FICO's foundational tri-merge score price rose from US$1.80 (late 2022) to US$30 (2026) — a 1,567% increase per the Community Home Lenders of America — and total per-loan credit-report cost rose from about US$50 in 2022 to roughly US$540 in 2026. Experian captured bureau/reseller mark-up on top of the US$4.95 FICO royalty pass-through.<\u002Fli><li><strong>Benchmark-to-statutory gap is persistent and partly structural.<\u002Fstrong> The FY26 bridge from Benchmark PBT US$2,212m to statutory PBT US$1,951m is a US$261m deduction, dominated by acquisition-intangible amortisation (US$271m) — an item that has risen every year (US$174m FY22 → US$211m FY25 → US$271m FY26) because the company acquires every year.<\u002Fli><li><strong>The acquisition programme is value-creating in the core and value-destructive at the edge.<\u002Fstrong> Acquired goodwill has been impaired only twice in ~15 years, both in EMEA/Asia Pacific (US$53m FY21, US$179m FY23); the North America, Latin America and UK cash-generating units have never been impaired.<\u002Fli><li><strong>The regulatory paradox is financial, not merely legal.<\u002Fstrong> The dispute machinery the CFPB alleges is inadequate is deliberately run at very low unit cost (as low as US$0.57 per dispute letter across &gt;12 million disputes a year), and that low cost is itself a contributor to the near-30% margin. Mandated remediation is the single most material adverse contingency, more than any fine.<\u002Fli><\u002Fol>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-details-4\" class=\"hd hd2 n0\"><span class=\"ht\">Details<\u002Fspan><\u002Fh2>\n<h2 id=\"s-iv-1\" class=\"hd hd2\"><span class=\"hn mono\">IV.1<\u002Fspan><span class=\"ht\">Multi-Year Financial History<\u002Fspan><\u002Fh2>\n<p><strong>Statutory revenue (US$m, actual rates) [CONFIRMED — company results; older years via Macrotrends]:<\u002Fstrong> FY19 4,861; FY20 5,179; FY21 5,372; FY22 6,288; FY23 6,619; FY24 7,097; FY25 7,523; FY26 8,445. Compound growth FY19→FY26 ≈ 8.2% p.a. (8,445 / 4,861 = 1.737 over 7 years → 1.737^(1/7) − 1 = 8.2%).<\u002Fp>\n<p><strong>Statutory profit before tax (US$m) [CONFIRMED]:<\u002Fstrong> FY20 942; FY21 1,077; FY22 1,447; FY23 1,174; FY24 1,551; FY25 1,549; FY26 1,951. The FY23 dip reflects a US$179m EMEA goodwill impairment and adverse financing remeasurements; the FY26 jump reflects revenue growth plus a swing in financing fair-value remeasurements from −US$85m (FY25) to +US$101m (FY26) and lower restructuring.<\u002Fp>\n<p><strong>Benchmark EBIT margin (ongoing) [CONFIRMED]:<\u002Fstrong> FY22 ≈26.2%; FY24 27.6%; FY25 28.1%; FY26 28.6%. A steady ~50–90bps annual climb, management-attributed to operating leverage, AI productivity and Consumer Services scaling.<\u002Fp>\n<p><strong>Benchmark EPS (US cents) [CONFIRMED]:<\u002Fstrong> FY22 124.5; FY24 144.2; FY25 156.9; FY26 179.8. <strong>Statutory basic EPS (US cents):<\u002Fstrong> FY22 127.5; FY25 127.6; FY26 164.5.<\u002Fp>\n<p><strong>Benchmark EBITDA (US$m) [CONFIRMED, company cash-flow summary]:<\u002Fstrong> FY25 2,630; FY26 3,010 (Benchmark EBIT 2,397 + amortisation/depreciation 613).<\u002Fp>\n<p><strong>ROCE (post-tax, Benchmark) [CONFIRMED]:<\u002Fstrong> FY24 ~17%; FY25 16.6%; FY26 17.2%. <strong>Net debt/Benchmark EBITDA [CONFIRMED]:<\u002Fstrong> 1.7x in FY24, FY25 and FY26.<\u002Fp>\n<p><strong>Structural vs presentational:<\u002Fstrong> The 2020–2022 US mortgage boom lifted transactional bureau revenue; the 2023–2025 rate-driven bust cut volumes, but from FY24 Experian offset volume weakness with tri-merge price escalation. Two FY26 presentational changes must be separated from economics: (a) certain Latin America and EMEA/AP B2B lines were reclassified as \"exited activities\" (US$20m revenue in FY26 vs US$48m in FY25, with a US$10m operating loss removed to arrive at ongoing Benchmark EBIT of US$2,407m vs total US$2,397m); and (b) from 1 April 2025 the B2B line was split into Financial Services and Verticals. Neither changes the underlying economics.<\u002Fp>\n<h2 id=\"s-iv-2\" class=\"hd hd2\"><span class=\"hn mono\">IV.2<\u002Fspan><span class=\"ht\">Revenue Taxonomy and Quality<\u002Fspan><\u002Fh2>\n<p>FY26 ongoing revenue US$8,425m [CONFIRMED, Appendix 2]: <strong>B2B US$6,168m<\u002Fstrong> (Financial Services US$4,463m; Verticals US$1,705m) and <strong>Consumer Services US$2,257m<\u002Fstrong>. By region: North America US$5,587m; Latin America US$1,297m; UK &amp; Ireland US$942m; EMEA &amp; Asia Pacific US$599m (sums to 8,425; North America = 5,587/8,425 = 66.3%).<\u002Fp>\n<figure class=\"fig\" id=\"figure-5\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 05<\u002Fspan><span class=\"fig-t\">Revenue Architecture<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div class=\"f-lbl\" style=\"margin-bottom:9px\">By business line — Benchmark, ongoing activities, FY26 <span class=\"mono\">US$m<\u002Fspan><\u002Fdiv>\n<div class=\"wf\">\n<div class=\"wf-s s1\" style=\"width:52.97%\">Financial Services <span class=\"mono\">&nbsp;4,463<\u002Fspan><\u002Fdiv>\n<div class=\"wf-s s2\" style=\"width:20.24%\">Verticals <span class=\"mono\">&nbsp;1,705<\u002Fspan><\u002Fdiv>\n<div class=\"wf-s s5\" style=\"width:26.79%\">Consumer Services <span class=\"mono\">&nbsp;2,257<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-lgd\">\n<div class=\"wf-r\"><span class=\"key s1\"><\u002Fspan><span>B2B — Financial Services<\u002Fspan><span class=\"mono\">US$4,463m<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key s2\"><\u002Fspan><span>B2B — Verticals (Health, Automotive, Marketing, other)<\u002Fspan><span class=\"mono\">US$1,705m<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key s1\"><\u002Fspan><span><strong>B2B total<\u002Fstrong><\u002Fspan><span class=\"mono\"><strong>US$6,168m<\u002Fstrong><\u002Fspan><\u002Fdiv>\n<div class=\"wf-r hi\"><span class=\"key s5\"><\u002Fspan><span>Consumer Services<\u002Fspan><span class=\"mono\">US$2,257m<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-lbl\" style=\"margin:34px 0 9px\">By region — Benchmark, ongoing activities, FY26 <span class=\"mono\">US$m<\u002Fspan><\u002Fdiv>\n<div class=\"wf\">\n<div class=\"wf-s s1\" style=\"width:66.31%\">North America <span class=\"mono\">&nbsp;5,587<\u002Fspan><\u002Fdiv>\n<div class=\"wf-s s2\" style=\"width:15.40%\"><span class=\"mono\">1,297<\u002Fspan><\u002Fdiv>\n<div class=\"wf-s s3\" style=\"width:11.18%\"><span class=\"mono\">942<\u002Fspan><\u002Fdiv>\n<div class=\"wf-s s4\" style=\"width:7.11%\"><span class=\"mono\">599<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-lgd\">\n<div class=\"wf-r\"><span class=\"key s1\"><\u002Fspan><span>North America<\u002Fspan><span class=\"mono\">US$5,587m · 66.3%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key s2\"><\u002Fspan><span>Latin America<\u002Fspan><span class=\"mono\">US$1,297m · 15.4%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key s3\"><\u002Fspan><span>UK &amp; Ireland<\u002Fspan><span class=\"mono\">US$942m · 11.2%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key s4\"><\u002Fspan><span>EMEA &amp; Asia Pacific<\u002Fspan><span class=\"mono\">US$599m · 7.1%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key\" style=\"border-color:var(--ink);background:none\"><\u002Fspan><span><strong>Total ongoing revenue<\u002Fstrong><\u002Fspan><span class=\"mono\"><strong>US$8,425m<\u002Fstrong><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"fig-note\">Basis: Benchmark, ongoing activities. Statutory revenue for the same year is US$8,445m — the two figures are not interchangeable.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Two stacked bars on one denominator. Both cuts total US$8,425m; the business-line and regional views are alternative decompositions of the same revenue, not additive layers.<\u002Ffigcaption>\n<\u002Ffigure>\n<p>Quality scorecard by stream:<\u002Fp>\n<ul class=\"lst\"><li><strong>Subscription / contracted platform (Ascend, PowerCurve)<\u002Fstrong> — payer: enterprise; trigger: contract; recurring; low cyclicality; highest quality. In FY26 there was a 100% renewal rate among top North America strategic accounts, with durations extended by nearly 10% to over four years and contract values up double digits on average [<span class=\"ev\">COMPANY CLAIM<\u002Fspan>]. Over 2,300 client solutions implemented on Ascend; US$2bn of FY26 revenue from \"new and scaling products\" including Ascend modules and marketplaces [<span class=\"ev\">COMPANY CLAIM<\u002Fspan>].<\u002Fli><li><strong>Per-inquiry transactional bureau<\u002Fstrong> — payer: lender; trigger: origination/permissible-purpose pull; cyclical; the primary exposure to the US mortgage and consumer-credit cycle.<\u002Fli><li><strong>Batch / prescreen<\u002Fstrong> — semi-recurring, tied to marketing spend cycles.<\u002Fli><li><strong>Consumer subscription<\u002Fstrong> — recurring but slower (\"membership revenue grew modestly\" in North America).<\u002Fli><li><strong>Marketplace / referral<\u002Fstrong> — performance-based, recognised <strong>net<\u002Fstrong>; now the primary driver of Consumer Services growth (North America marketplace +20%+; UK double-digit every quarter).<\u002Fli><li><strong>Experian Health<\u002Fstrong> — recurring, AI-led growth (Patient Access Curator, ~30% denial reduction).<\u002Fli><li><strong>Automotive<\u002Fstrong> — grew \"well ahead of underlying auto sales\"; AutoCheck now exclusive at almost every major US consumer shopping site.<\u002Fli><li><strong>Serasa (Brazil)<\u002Fstrong> — consumer marketplace + Limpa Nome (US$19.4bn of debt renegotiated, US$16.1bn written off in FY26; 30m+ agreements renegotiated).<\u002Fli><li><strong>illion (ANZ)<\u002Fstrong> — bureau, within EMEA/AP; \"near doubling of regional margins.\"<\u002Fli><\u002Ful>\n<p><strong>Recurring vs transactional [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]:<\u002Fstrong> roughly two-thirds of group revenue is recurring/contracted or subscription/marketplace-like; the transactional remainder concentrates the cyclical risk in US Financial Services. The FY26 mortgage windfall (see <a class=\"xr\" href=\"#s-iv-4\">IV.4<\u002Fa>) is the clearest single example of transactional fragility disguised as growth.<\u002Fp>\n<h2 id=\"s-iv-3\" class=\"hd hd2\"><span class=\"hn mono\">IV.3<\u002Fspan><span class=\"ht\">Revenue Recognition and Accounting Judgements<\u002Fspan><\u002Fh2>\n<p>[CONFIRMED, Revenue note]: Per-transaction bureau revenue is recognised at the point of delivery. Hosted software licences are recognised over the service period, creating contract liabilities; on-premise licences are released on delivery completion; support/maintenance is released over the maintenance term. <strong>Consumer Services marketplace and referral revenue is recognised NET<\u002Fstrong> — Experian acts as an agent, recognising only the referral/commission fee, not the gross value of the credit or insurance product placed. This is material: gross presentation would inflate reported revenue and depress the reported margin; net presentation is a structural reason Consumer Services shows a 29.6% Benchmark EBIT margin. The <strong>FICO royalty (US$4.95/score under the mortgage performance model, or US$10 traditional) is a genuine cost of sale / pass-through<\u002Fstrong> [CONFIRMED, FICO]. The accounting judgements that most affect reported results are: (1) the value and economic life of acquisition intangibles (drives the amortisation excluded from Benchmark); (2) the capitalisation and amortisation life of internally generated software (3–10 years, average ~5); and (3) the principal-vs-agent (gross/net) marketplace judgement.<\u002Fp>\n<h2 id=\"s-iv-4\" class=\"hd hd2\"><span class=\"hn mono\">IV.4<\u002Fspan><span class=\"ht\">Pricing Economics and the Mortgage Question<\u002Fspan><\u002Fh2>\n<p><strong>Mechanism:<\u002Fstrong> a conforming mortgage requires a \"tri-merge\" — a pull from all three bureaus. Per the Community Home Lenders of America (March 2026 white-paper addendum), <em>\"FICO's foundational price for a tri-merge score escalated from $1.80 in late 2022 to $30 today, marking a 1,567% increase,\"<\u002Fem> while <em>\"total credit report costs associated with closing a conventional loan have risen from about $50 in 2022 to roughly $540 in 2026\"<\u002Fem> [CONFIRMED, CHLA via HousingWire / NMP]. FICO's own disclosure: the wholesale royalty is US$4.95/score under the performance model (plus a US$33 per-borrower funded-loan fee) or US$10/score traditional; FICO states that <em>\"any amounts charged beyond … FICO's $4.95 per-score royalty … is collected by the credit bureaus or other parties but not by FICO\"<\u002Fem> [CONFIRMED]. So the escalation captured by Experian is the <strong>bureau mark-up and reseller bundle<\u002Fstrong>, not the FICO royalty.<\u002Fp>\n<figure class=\"fig\" id=\"figure-11\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 11<\u002Fspan><span class=\"fig-t\">The Mortgage Pricing Escalation<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<svg viewBox=\"0 0 1000 380\" width=\"100%\" height=\"380\" style=\"display:block;overflow:visible\" role=\"img\" aria-label=\"Mortgage credit-report cost per conventional loan rising from about US$50 in 2022 to about US$540 in 2026, alongside the FICO tri-merge base price rising from US$1.80 to US$30\">\n<line x1=\"96\" y1=\"16\" x2=\"96\" y2=\"312\" style=\"stroke:var(--wire);stroke-width:1\"><\u002Fline>\n<line x1=\"96\" y1=\"312\" x2=\"904\" y2=\"312\" style=\"stroke:var(--wire);stroke-width:1\"><\u002Fline>\n<line x1=\"904\" y1=\"16\" x2=\"904\" y2=\"312\" style=\"stroke:var(--wire);stroke-width:1\"><\u002Fline>\n<line x1=\"96\" y1=\"238\" x2=\"904\" y2=\"238\" style=\"stroke:var(--wire2);stroke-width:1\"><\u002Fline>\n<line x1=\"96\" y1=\"164\" x2=\"904\" y2=\"164\" style=\"stroke:var(--wire2);stroke-width:1\"><\u002Fline>\n<line x1=\"96\" y1=\"90\" x2=\"904\" y2=\"90\" style=\"stroke:var(--wire2);stroke-width:1\"><\u002Fline>\n<text x=\"88\" y=\"316\" text-anchor=\"end\" style=\"font:13px var(--font-body);fill:var(--muted)\">0<\u002Ftext>\n<text x=\"88\" y=\"242\" text-anchor=\"end\" style=\"font:13px var(--font-body);fill:var(--muted)\">150<\u002Ftext>\n<text x=\"88\" y=\"168\" text-anchor=\"end\" style=\"font:13px var(--font-body);fill:var(--muted)\">300<\u002Ftext>\n<text x=\"88\" y=\"94\" text-anchor=\"end\" style=\"font:13px var(--font-body);fill:var(--muted)\">450<\u002Ftext>\n<text x=\"88\" y=\"20\" text-anchor=\"end\" style=\"font:13px var(--font-body);fill:var(--muted)\">600<\u002Ftext>\n<text x=\"912\" y=\"316\" style=\"font:13px var(--font-body);fill:var(--muted)\">0<\u002Ftext>\n<text x=\"912\" y=\"242\" style=\"font:13px var(--font-body);fill:var(--muted)\">8.75<\u002Ftext>\n<text x=\"912\" y=\"168\" style=\"font:13px var(--font-body);fill:var(--muted)\">17.50<\u002Ftext>\n<text x=\"912\" y=\"94\" style=\"font:13px var(--font-body);fill:var(--muted)\">26.25<\u002Ftext>\n<text x=\"912\" y=\"20\" style=\"font:13px var(--font-body);fill:var(--muted)\">35.00<\u002Ftext>\n<text x=\"96\" y=\"348\" style=\"font:12px var(--font-heading);fill:var(--muted);letter-spacing:.14em\">LEFT AXIS — US$ TOTAL CREDIT-REPORT COST PER CONVENTIONAL LOAN<\u002Ftext>\n<text x=\"904\" y=\"348\" text-anchor=\"end\" style=\"font:12px var(--font-heading);fill:var(--muted);letter-spacing:.14em\">RIGHT AXIS — US$ FICO TRI-MERGE BASE PRICE<\u002Ftext>\n<line x1=\"177\" y1=\"312\" x2=\"177\" y2=\"318\" style=\"stroke:var(--wire);stroke-width:1\"><\u002Fline>\n<line x1=\"500\" y1=\"312\" x2=\"500\" y2=\"318\" style=\"stroke:var(--wire);stroke-width:1\"><\u002Fline>\n<line x1=\"823\" y1=\"312\" x2=\"823\" y2=\"318\" style=\"stroke:var(--wire);stroke-width:1\"><\u002Fline>\n<text x=\"177\" y=\"334\" text-anchor=\"middle\" style=\"font:14px var(--font-body);fill:var(--muted)\">2022<\u002Ftext>\n<text x=\"500\" y=\"334\" text-anchor=\"middle\" style=\"font:14px var(--font-body);fill:var(--muted)\">2024<\u002Ftext>\n<text x=\"823\" y=\"334\" text-anchor=\"middle\" style=\"font:14px var(--font-body);fill:var(--muted)\">2026<\u002Ftext>\n<line x1=\"177\" y1=\"287\" x2=\"823\" y2=\"46\" style=\"stroke:var(--color-accent);stroke-width:2;stroke-dasharray:7 5\"><\u002Fline>\n<line x1=\"177\" y1=\"311\" x2=\"823\" y2=\"58\" style=\"stroke:var(--steel);stroke-width:1.5;stroke-dasharray:4 4\"><\u002Fline>\n<circle cx=\"177\" cy=\"287\" r=\"5\" style=\"fill:var(--color-accent)\"><\u002Fcircle>\n<circle cx=\"823\" cy=\"46\" r=\"6\" style=\"fill:var(--color-accent)\"><\u002Fcircle>\n<circle cx=\"177\" cy=\"311\" r=\"4\" style=\"fill:var(--steel)\"><\u002Fcircle>\n<circle cx=\"823\" cy=\"58\" r=\"5\" style=\"fill:var(--steel)\"><\u002Fcircle>\n<text x=\"192\" y=\"283\" style=\"font:15px var(--font-heading);fill:var(--color-accent-700)\">~US$50 per loan<\u002Ftext>\n<text x=\"815\" y=\"34\" text-anchor=\"end\" style=\"font:19px var(--font-heading);fill:var(--color-accent-700)\">~US$540 per loan<\u002Ftext>\n<text x=\"815\" y=\"80\" text-anchor=\"end\" style=\"font:15px var(--font-heading);fill:var(--steel)\">FICO tri-merge base US$30<\u002Ftext>\n<text x=\"192\" y=\"326\" style=\"font:14px var(--font-heading);fill:var(--steel)\">FICO base US$1.80<\u002Ftext>\n<\u002Fsvg>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px\">\n<div class=\"pnl\"><div class=\"pnl-k\">Total cost per loan<\u002Fdiv><div class=\"pnl-b\"><span class=\"mono\">~US$50<\u002Fspan> (2022) → <span class=\"mono acc\"><strong>~US$540<\u002Fstrong><\u002Fspan> (2026)<\u002Fdiv><\u002Fdiv>\n<div class=\"pnl\"><div class=\"pnl-k\">FICO tri-merge base price<\u002Fdiv><div class=\"pnl-b\"><span class=\"mono\">US$1.80<\u002Fspan> → <span class=\"mono acc\"><strong>US$30<\u002Fstrong><\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"pnl\"><div class=\"pnl-k\">FICO wholesale royalty<\u002Fdiv><div class=\"pnl-b\"><span class=\"mono\">US$4.95<\u002Fspan> → <span class=\"mono acc\"><strong>US$10.00<\u002Fstrong><\u002Fspan> for 2026<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"cal\" style=\"margin-top:16px\"><div class=\"cal-k\">Consequence at Experian<\u002Fdiv><div class=\"cal-b\">FY26 mortgage revenue <strong>+45%<\u002Fstrong> on roughly flat volumes.<\u002Fdiv><\u002Fdiv>\n<div class=\"fig-note\">Endpoints are the published figures; the path between them is drawn as a dashed escalation because no intermediate-year series is published.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Every layer of the stack raised price at once, against a borrower who cannot shop for a bureau. The revenue is real; the durability is not.<\u002Ffigcaption>\n<\u002Ffigure>\n<p><strong>FY26 outcome:<\u002Fstrong> North America mortgage-profile revenue grew ~45% (management indicated \"45% to 50%\") on roughly flat volumes — a near-pure pricing effect [CONFIRMED]. This sits inside North America Financial Services (FY26 US$2,363m, +14% total).<\u002Fp>\n<p><strong>Competitive/regulatory threat:<\u002Fstrong> the FHFA authorised VantageScore 4.0 for conforming mortgages on 8 July 2025 [CONFIRMED]. By the Q1 FY27 update, per CFO Lloyd Pitchford, <em>\"eleven out of the 15 largest mortgage lenders are also using VantageScore 4.0, now reaching close to 30% of the U.S. mortgage market\"<\u002Fem> [<span class=\"ev\">COMPANY CLAIM<\u002Fspan>]. Deep Future Analytics, in its study \"Economic Benefits of Score Market Competition for Conforming Mortgages\" (Feb 25 2026), estimated <em>\"an estimated $648 million in savings in the first full year\"<\u002Fem> under full adoption and <em>\"up to $2.5 billion in cumulative cost savings over a five-year period,\"<\u002Fem> with a March 18 2026 update raising the first-year figure to <em>\"more than $930 million\"<\u002Fem> [<span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan>].<\u002Fp>\n<p><strong>Scenario read [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]:<\u002Fstrong> (i) <em>Price normalisation<\u002Fem> would reverse much of the FY26 uplift and is the single biggest threat to the FY26 growth optics; (ii) <em>volume recovery<\u002Fem> would partly offset — management guides modestly lower mortgage volumes into FY27; (iii) <em>VantageScore share gain<\u002Fem> is largely neutral-to-modestly-negative for Experian because Experian sells both scores and the underlying data pull persists regardless of which score is calculated — the economics that shift are chiefly FICO's royalty, not Experian's bureau revenue. The durable risk is political: a per-loan cost of ~US$540 on a government-sponsored mortgage market is an obvious target for the FHFA, the MBA and the CHLA.<\u002Fp>\n<p><strong>Beyond mortgage:<\u002Fstrong> the same pricing muscle appears in analytics/platform renewals (double-digit contract-value uplifts) and Serasa. Pricing power derives from the difficulty of replicating regulated historical datasets, switching costs once embedded in a client's decisioning workflow, and the three-firm structure of the US bureau market.<\u002Fp>\n<h2 id=\"s-iv-5\" class=\"hd hd2\"><span class=\"hn mono\">IV.5<\u002Fspan><span class=\"ht\">The Cost Architecture of a Zero-Input-Cost Business [PRIORITY DEPTH]<\u002Fspan><\u002Fh2>\n<p>FY26 total operating expenses: statutory US$6,400m; Benchmark US$6,052m [CONFIRMED, Group income statement]. The statutory income statement discloses the cost base by nature (US$m, statutory / of which Benchmark):<\u002Fp>\n<figure class=\"fig\" id=\"figure-13\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 13<\u002Fspan><span class=\"fig-t\">Cost Architecture<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div class=\"wf\" style=\"height:74px\">\n<div class=\"wf-s s1\" style=\"width:31.71%\">Labour <span class=\"mono\">&nbsp;31.8%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-s s2\" style=\"width:19.14%\">Data &amp; IT <span class=\"mono\">&nbsp;19.2%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-s s3\" style=\"width:7.28%\"><span class=\"mono\">7.3%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-s s3\" style=\"width:7.08%;opacity:.72\"><span class=\"mono\">7.1%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-s s4\" style=\"width:6.28%\"><span class=\"mono\">6.3%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-s s5\" style=\"width:28.51%\">Benchmark EBIT <span class=\"mono\">&nbsp;28.6%<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"wf-lgd\">\n<div class=\"wf-r\"><span class=\"key s1\"><\u002Fspan><span>Labour<\u002Fspan><span class=\"mono\">31.8%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key s2\"><\u002Fspan><span>Data &amp; IT<\u002Fspan><span class=\"mono\">19.2%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key s3\"><\u002Fspan><span>Amortisation and depreciation<\u002Fspan><span class=\"mono\">7.3%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key s3\" style=\"opacity:.72\"><\u002Fspan><span>Marketing and customer acquisition<\u002Fspan><span class=\"mono\">7.1%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key s4\"><\u002Fspan><span>Other operating<\u002Fspan><span class=\"mono\">6.3%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r hi\"><span class=\"key s5\"><\u002Fspan><span>Benchmark EBIT<\u002Fspan><span class=\"mono\">28.6%<\u002Fspan><\u002Fdiv>\n<div class=\"wf-r\"><span class=\"key\" style=\"border-color:var(--ink);background:none\"><\u002Fspan><span><strong>Cost of goods sold<\u002Fstrong><\u002Fspan><span class=\"mono\"><strong>none<\u002Fstrong><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\">There is no cost of goods sold. The margin is made by operating leverage over a fixed data-and-compliance platform, not by a cheap input.<\u002Fdiv>\n<div class=\"fig-note\">Proportional bar, % of Benchmark revenue, FY26. Components are rendered proportionally to their stated total.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Cost architecture as a share of revenue. Labour and the data-and-IT platform together account for just over half of revenue; neither scales with units sold, which is what produces the margin at the right-hand end of the bar.<\u002Ffigcaption>\n<\u002Ffigure>\n<div class=\"tw wide\"><table class=\"tbl\"><thead><tr><th>Cost category<\u002Fth><th>Statutory<\u002Fth><th>Benchmark<\u002Fth><th>% of revenue (Benchmark)<\u002Fth><th>Variability<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Labour<\u002Ftd><td>2,731<\u002Ftd><td>2,686<\u002Ftd><td>31.8%<\u002Ftd><td>Variable → semi-variable<\u002Ftd><\u002Ftr><tr><td>Data &amp; IT<\u002Ftd><td>1,625<\u002Ftd><td>1,625<\u002Ftd><td>19.2%<\u002Ftd><td>Increasingly fixed platform<\u002Ftd><\u002Ftr><tr><td>Amortisation &amp; depreciation<\u002Ftd><td>876<\u002Ftd><td>613<\u002Ftd><td>7.3%<\u002Ftd><td>Fixed<\u002Ftd><\u002Ftr><tr><td>Marketing &amp; customer acquisition<\u002Ftd><td>596<\u002Ftd><td>596<\u002Ftd><td>7.1%<\u002Ftd><td>Variable / discretionary<\u002Ftd><\u002Ftr><tr><td>Other operating charges<\u002Ftd><td>572<\u002Ftd><td>532<\u002Ftd><td>6.3%<\u002Ftd><td>Semi-variable<\u002Ftd><\u002Ftr><tr><td><strong>Total operating expenses<\u002Fstrong><\u002Ftd><td><strong>6,400<\u002Fstrong><\u002Ftd><td><strong>6,052<\u002Fstrong><\u002Ftd><td><strong>71.7%<\u002Fstrong><\u002Ftd><td><\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>Rebuilt from first principles into the components the task demands:<\u002Fp>\n<ul class=\"lst\"><li><strong>Labour — US$2,686m (31.8% of revenue) [CONFIRMED].<\u002Fstrong> The largest cost and the swing factor in margin. Management states labour is \"over 300 basis points lower than two years ago,\" attributed to AI (a claimed 10–15% coding-productivity uplift in FY26, 30%+ in select areas). Functionally it spans engineering, data operations, sales, dispute processing and corporate; geographically it is weighted to the US, UK, Brazil and India (India being the lowest-cost engineering/operations hub). Semi-variable: headcount (~25,200 across 33 countries) flexes with volume but slowly.<\u002Fli><li><strong>Technology and cloud — the bulk of Data &amp; IT US$1,625m [CONFIRMED].<\u002Fstrong> Includes the 10-year AWS agreement (announced 19 June 2025), the <em>dual-run<\u002Fem> cost of operating legacy data centres alongside cloud during migration, data-centre exit costs, and embedded software amortisation. Cloud migration is \"largely completed\" in North America and Brazil (ex-Health); dual-run costs \"begin to decline\" from FY27 — a step-down that management links to ~+50bps of FY27 margin. This is now largely a <strong>fixed platform cost<\u002Fstrong>, which is precisely why incremental revenue drops through at high margin.<\u002Fli><li><strong>Data operations and matching [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, embedded in Data &amp; IT].<\u002Fstrong> The cost of ingesting ~1.3 billion monthly updates and running the matching engine; management claims a 60% reduction in data-processing time from the cloud transformation. Largely fixed/step-fixed.<\u002Fli><li><strong>The dispute and consumer-rights machinery [CONFIRMED cost driver; <span class=\"ev unk\">UNKNOWN<\u002Fspan> precise line].<\u002Fstrong> Over 12 million disputes a year, coded into ACDVs and routed via e-OSCAR, at reported vendor economics as low as US$0.57 per dispute letter. Direct cost is trivial relative to revenue; the <em>risk-adjusted<\u002Fem> cost (litigation + the CFPB matter) is disproportionately large. This sits within \"Other operating charges.\"<\u002Fli><li><strong>Model development and third-party score royalties [CONFIRMED].<\u002Fstrong> Internal model development is largely capitalised (see <a class=\"xr\" href=\"#s-iv-9\">IV.9<\u002Fa>). The <strong>FICO royalty is a genuine variable cost of sale<\u002Fstrong> embedded in Data &amp; IT / cost of sale, rising with mortgage score volume.<\u002Fli><li><strong>Consumer acquisition and marketing — US$596m (7.1%) [CONFIRMED].<\u002Fstrong> The cost of acquiring and servicing 215m free members and converting a fraction to paid or marketplace revenue. This is the most discretionary/variable line and is concentrated in Consumer Services.<\u002Fli><li><strong>Regulatory, compliance and legal overhead [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, within Other operating charges + Labour].<\u002Fstrong> The cost of operating simultaneously under FCRA, UK GDPR, LGPD and multiple US state regimes. Not separately disclosed, but the FY26 non-benchmark labour charge of US$45m and non-benchmark other operating charges of US$40m give a sense of the restructuring/one-off overlay.<\u002Fli><\u002Ful>\n<p><strong>Central question — if the raw material is free, what determines the margin?<\u002Fstrong> Three levers: (1) <strong>operating leverage<\u002Fstrong> over a fixed data/platform/compliance cost base — the dominant lever, and the reason a pricing windfall drops almost entirely to EBIT; (2) <strong>labour productivity<\u002Fstrong> (the 300bps of labour-cost reduction is the visible margin engine); and (3) <strong>mix<\u002Fstrong> — high-margin North America bureau/platform and net-recognised Consumer marketplace versus sub-scale EMEA/AP. Margin <em>compresses<\u002Fem> if wage inflation outpaces productivity, if cloud dual-run overruns, if compliance/remediation steps up (the CFPB tail), or if mix shifts toward low-margin regions or gross-recognised products.<\u002Fp>\n<p><strong>Why North America earns 34.2% and EMEA/AP 6.7% — a cost-structure explanation, not a pricing one:<\u002Fstrong> both regions must carry a broadly fixed data-ingestion, matching, platform and compliance stack. North America spreads that stack over US$5,587m of revenue; EMEA/AP spreads a similar-in-kind (if smaller) stack over US$599m. The fixed cost per revenue dollar is therefore an order of magnitude higher in EMEA/AP, which is why integrating illion (adding scale) nearly doubled EMEA/AP margin from 3.4% to 6.7% in a single year.<\u002Fp>\n<h2 id=\"s-iv-6\" class=\"hd hd2\"><span class=\"hn mono\">IV.6<\u002Fspan><span class=\"ht\">Unit Economics Across Incompatible Units<\u002Fspan><\u002Fh2>\n<p>All arithmetic shown [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> unless the input is CONFIRMED]:<\u002Fp>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Candidate unit<\u002Fth><th>Computation<\u002Fth><th>Result<\u002Fth><th>Verdict<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Revenue per employee<\u002Ftd><td>8,445 / 25,200<\u002Ftd><td><strong>US$335,119<\u002Fstrong><\u002Ftd><td>Useful efficiency gauge; rising with AI<\u002Ftd><\u002Ftr><tr><td>Benchmark EBIT per employee<\u002Ftd><td>2,397 / 25,200<\u002Ftd><td>US$95,119<\u002Ftd><td>Confirms high value-add per head<\u002Ftd><\u002Ftr><tr><td>Revenue per free member (group)<\u002Ftd><td>8,445 / 215m<\u002Ftd><td>US$39<\u002Ftd><td>Misleading<\u002Ftd><\u002Ftr><tr><td>Consumer Services revenue per free member<\u002Ftd><td>2,257 / 215m<\u002Ftd><td><strong>US$10.50/member/yr<\u002Fstrong><\u002Ftd><td>Misleading in isolation<\u002Ftd><\u002Ftr><tr><td>North America members<\u002Ftd><td>—<\u002Ftd><td>85m (+8%)<\u002Ftd><td>Asset metric, not revenue metric<\u002Ftd><\u002Ftr><tr><td>Revenue per marketplace referral<\u002Ftd><td>Confidential fee<\u002Ftd><td><strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong><\u002Ftd><td>Not publicly derivable<\u002Ftd><\u002Ftr><tr><td>Revenue per credit inquiry<\u002Ftd><td>Confidential pricing<\u002Ftd><td><strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong><\u002Ftd><td>Not publicly derivable<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>Which unit governs?<\u002Fstrong> None of the per-member or per-file metrics govern. The economics are governed by (1) the <strong>enterprise B2B relationship<\u002Fstrong> — the renewing, multi-year strategic account with double-digit contract-value uplift and a four-year duration — and (2) the <strong>per-inquiry bureau pull priced to the cycle<\u002Fstrong>. Per-member and per-file metrics mislead because the overwhelming majority of the 215m free members and the hundreds of millions of consumer files generate little or no <em>direct<\u002Fem> revenue. Their value is that they constitute the proprietary data asset and consumer flywheel that (a) makes the B2B data saleable, (b) feeds the marketplace, and (c) makes the whole enterprise strategically defensible. They are the asset, not the unit of sale.<\u002Fp>\n<h2 id=\"s-iv-7\" class=\"hd hd2\"><span class=\"hn mono\">IV.7<\u002Fspan><span class=\"ht\">Segment Economics<\u002Fspan><\u002Fh2>\n<p>FY26 Benchmark EBIT and margin (ongoing) [CONFIRMED, income-statement analysis]:<\u002Fp>\n<figure class=\"fig\" id=\"figure-6\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 06<\u002Fspan><span class=\"fig-t\">Margin Dispersion by Region<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"display:grid;grid-template-columns:210px 1fr 92px;gap:11px 16px;align-items:center\">\n<div class=\"f-name\" style=\"font-size:16px\">North America<\u002Fdiv><div class=\"bar\" style=\"height:20px;margin:0\"><span class=\"barf hi\" style=\"height:20px;width:85.5%\"><\u002Fspan><\u002Fdiv><div class=\"mono\" style=\"text-align:right;font-size:17px\">34.2%<\u002Fdiv>\n<div class=\"f-name\" style=\"font-size:16px\">Latin America<\u002Fdiv><div class=\"bar\" style=\"height:20px;margin:0\"><span class=\"barf\" style=\"height:20px;width:77.0%\"><\u002Fspan><\u002Fdiv><div class=\"mono\" style=\"text-align:right;font-size:17px\">30.8%<\u002Fdiv>\n<div class=\"f-name\" style=\"font-size:16px\">UK &amp; Ireland<\u002Fdiv><div class=\"bar\" style=\"height:20px;margin:0\"><span class=\"barf\" style=\"height:20px;width:58.5%\"><\u002Fspan><\u002Fdiv><div class=\"mono\" style=\"text-align:right;font-size:17px\">23.4%<\u002Fdiv>\n<div class=\"f-name\" style=\"font-size:16px\">EMEA &amp; Asia Pacific<\u002Fdiv><div class=\"bar\" style=\"height:20px;margin:0\"><span class=\"barf alt\" style=\"height:20px;width:16.8%\"><\u002Fspan><\u002Fdiv><div class=\"mono\" style=\"text-align:right;font-size:17px\">6.7%<\u002Fdiv>\n<div class=\"f-name\" style=\"font-size:16px;color:var(--acc)\">Group<\u002Fdiv><div class=\"bar\" style=\"height:20px;margin:0;background:var(--wire2)\"><span class=\"barf\" style=\"height:20px;width:71.5%;background:var(--steel)\"><\u002Fspan><\u002Fdiv><div class=\"mono\" style=\"text-align:right;font-size:17px;color:var(--acc)\">28.6%<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-lbl\" style=\"margin-top:14px\">Scale 0–40% · Benchmark EBIT margin, ongoing activities, FY26<\u002Fdiv>\n<div class=\"cal\" style=\"margin-top:22px\"><div class=\"cal-k\">Fixed-cost annotation<\u002Fdiv><div class=\"cal-b\">Both regions carry a comparable fixed data-and-compliance stack. North America spreads it over <span class=\"mono\">US$5,587m<\u002Fspan> of revenue; EMEA &amp; Asia Pacific over <span class=\"mono\">US$599m<\u002Fspan> — <strong>9.3× less<\u002Fstrong>.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Both regions carry a comparable fixed data and compliance stack. North America spreads it over US$5,587m; EMEA/Asia Pacific over US$599m. The dispersion is fixed-cost absorption, not pricing.<\u002Ffigcaption>\n<\u002Ffigure>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Segment<\u002Fth><th>Revenue US$m<\u002Fth><th>Benchmark EBIT US$m<\u002Fth><th>Margin<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>North America<\u002Ftd><td>5,587<\u002Ftd><td>1,912<\u002Ftd><td>34.2%<\u002Ftd><\u002Ftr><tr><td>Latin America<\u002Ftd><td>1,297<\u002Ftd><td>399<\u002Ftd><td>30.8%<\u002Ftd><\u002Ftr><tr><td>UK &amp; Ireland<\u002Ftd><td>942<\u002Ftd><td>220<\u002Ftd><td>23.4%<\u002Ftd><\u002Ftr><tr><td>EMEA &amp; Asia Pacific<\u002Ftd><td>599<\u002Ftd><td>40<\u002Ftd><td>6.7%<\u002Ftd><\u002Ftr><tr><td>Central corporate costs<\u002Ftd><td>—<\u002Ftd><td>(164)<\u002Ftd><td>—<\u002Ftd><\u002Ftr><tr><td><strong>Ongoing group<\u002Fstrong><\u002Ftd><td><strong>8,425<\u002Fstrong><\u002Ftd><td><strong>2,407<\u002Fstrong><\u002Ftd><td><strong>28.6%<\u002Fstrong><\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>By line: B2B US$6,168m at 30.9%; Consumer Services US$2,257m at 29.6% (+220bps YoY, +~500bps over two years). North America margin rose 80bps to 34.2%; Latin America fell 120bps to 30.8% (acquisition dilution from ClearSale/TEx/SalaryFits/CCFacil); UK &amp; Ireland 23.2%→23.4%; EMEA/AP 3.4%→6.7% (illion integration, completed 30 September 2024).<\u002Fp>\n<p><strong>Is EMEA/AP sub-scale, disadvantaged or being restructured? All three.<\u002Fstrong> It is structurally sub-scale (fixed cost over small revenue); it is being deliberately restructured (the exited-activities re-presentation removed a US$10m-loss tail); and it is being consolidated up via illion. Management's actions signal a decision to reach scale by acquisition in ANZ while exiting the weakest lines elsewhere. <strong>Do headline margins conceal structurally different businesses? Yes<\u002Fstrong> — a dominant ultra-high-margin North America bureau/platform; a high-margin but FX-exposed Brazilian franchise; a mature, low-growth UK; and a still-emerging EMEA/AP. The 28.6% group number is a weighted average of four quite different economic entities.<\u002Fp>\n<h2 id=\"s-iv-8\" class=\"hd hd2\"><span class=\"hn mono\">IV.8<\u002Fspan><span class=\"ht\">The Statutory-to-Benchmark Forensic Reconciliation [PRIORITY DEPTH]<\u002Fspan><\u002Fh2>\n<p>FY26 and FY25 bridge, Benchmark PBT → statutory PBT (US$m) [CONFIRMED, income-statement analysis]:<\u002Fp>\n<figure class=\"fig\" id=\"figure-12\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 12<\u002Fspan><span class=\"fig-t\">Statutory-to-Benchmark Bridge<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div class=\"chart\" style=\"height:330px\">\n<div class=\"ax-y\"><span>2,300<\u002Fspan><span>2,175<\u002Fspan><span>2,050<\u002Fspan><span>1,925<\u002Fspan><span>1,800<\u002Fspan><\u002Fdiv>\n<div class=\"plot\" style=\"align-items:stretch\">\n<div class=\"gl\" style=\"bottom:100%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:75%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:50%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:25%\"><\u002Fdiv>\n<div class=\"grp\"><div style=\"position:relative;height:100%\"><span class=\"cb\" style=\"position:absolute;left:12%;right:12%;width:auto;bottom:0%;height:82.4%;border-color:var(--steel);background:var(--steel)\"><\u002Fspan><span class=\"cbv mono\" style=\"left:50%;top:auto;bottom:83.4%\">2,212<\u002Fspan><\u002Fdiv><div class=\"grp-l mono\">Benchmark<br>PBT<\u002Fdiv><\u002Fdiv>\n<div class=\"grp\"><div style=\"position:relative;height:100%\"><span class=\"cb\" style=\"position:absolute;left:12%;right:12%;width:auto;bottom:78.4%;height:4.0%\"><\u002Fspan><span class=\"cbv mono\" style=\"left:50%;top:auto;bottom:83.4%\">−20<\u002Fspan><\u002Fdiv><div class=\"grp-l mono\">Exceptional<br>items<\u002Fdiv><\u002Fdiv>\n<div class=\"grp\"><div style=\"position:relative;height:100%\"><span class=\"cb acc\" style=\"position:absolute;left:12%;right:12%;width:auto;bottom:24.2%;height:54.2%\"><\u002Fspan><span class=\"cbv mono\" style=\"left:50%;top:auto;bottom:79.4%;color:var(--acc);font-weight:700\">−271<\u002Fspan><\u002Fdiv><div class=\"grp-l mono\" style=\"color:var(--acc)\">Amortisation of<br>acq. intangibles<\u002Fdiv><\u002Fdiv>\n<div class=\"grp\"><div style=\"position:relative;height:100%\"><span class=\"cb\" style=\"position:absolute;left:12%;right:12%;width:auto;bottom:12.4%;height:11.8%\"><\u002Fspan><span class=\"cbv mono\" style=\"left:50%;top:auto;bottom:25.2%\">−59<\u002Fspan><\u002Fdiv><div class=\"grp-l mono\">Acquisition &amp;<br>disposal<\u002Fdiv><\u002Fdiv>\n<div class=\"grp\"><div style=\"position:relative;height:100%\"><span class=\"cb\" style=\"position:absolute;left:12%;right:12%;width:auto;bottom:12.4%;height:0.6%;border-style:dashed\"><\u002Fspan><span class=\"cbv mono\" style=\"left:50%;top:auto;bottom:14.0%\">+2<\u002Fspan><\u002Fdiv><div class=\"grp-l mono\">Contingent<br>consideration<\u002Fdiv><\u002Fdiv>\n<div class=\"grp\"><div style=\"position:relative;height:100%\"><span class=\"cb\" style=\"position:absolute;left:12%;right:12%;width:auto;bottom:10.0%;height:2.8%\"><\u002Fspan><span class=\"cbv mono\" style=\"left:50%;top:auto;bottom:13.8%\">−14<\u002Fspan><\u002Fdiv><div class=\"grp-l mono\">Interest on<br>tax liabilities<\u002Fdiv><\u002Fdiv>\n<div class=\"grp\"><div style=\"position:relative;height:100%\"><span class=\"cb\" style=\"position:absolute;left:12%;right:12%;width:auto;bottom:10.0%;height:20.2%;border-color:var(--steel);background:none\"><\u002Fspan><span class=\"cbv mono\" style=\"left:50%;top:auto;bottom:31.2%\">+101<\u002Fspan><\u002Fdiv><div class=\"grp-l mono\">Financing<br>fair value<\u002Fdiv><\u002Fdiv>\n<div class=\"grp\"><div style=\"position:relative;height:100%\"><span class=\"cb\" style=\"position:absolute;left:12%;right:12%;width:auto;bottom:0%;height:30.2%;border-color:var(--steel);background:var(--steel)\"><\u002Fspan><span class=\"cbv mono\" style=\"left:50%;top:auto;bottom:31.2%\">1,951<\u002Fspan><\u002Fdiv><div class=\"grp-l mono\">Statutory<br>PBT<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"lgd\" style=\"margin-top:52px\"><span><span class=\"key\" style=\"background:var(--steel);border-color:var(--steel)\"><\u002Fspan>Reported totals<\u002Fspan><span><span class=\"key\"><\u002Fspan>Reconciling deduction<\u00
