ass=\"nb\">§605<\u002Fspan><\u002Fstrong><\u002Ftd><td>Retention limits — most adverse items seven years, Chapter 7 bankruptcy ten years<\u002Ftd><\u002Ftr><tr><td><strong>Adverse action notice<\u002Fstrong><\u002Ftd><td>The notice a declined applicant must receive, stating the principal reasons<\u002Ftd><\u002Ftr><tr><td><strong>CFPB<\u002Fstrong><\u002Ftd><td>Consumer Financial Protection Bureau — the federal supervisor under the larger-participant rule<\u002Ftd><\u002Ftr><tr><td><strong>Larger-participant rule<\u002Fstrong><\u002Ftd><td>The 2012 rule bringing the major bureaux under CFPB supervision<\u002Ftd><\u002Ftr><tr><td><strong>ECOA / Regulation B<\u002Fstrong><\u002Ftd><td>Equal Credit Opportunity Act and its implementing regulation — fair-lending rules<\u002Ftd><\u002Ftr><tr><td><strong>GLBA<\u002Fstrong><\u002Ftd><td>Gramm-Leach-Bliley Act — data safeguarding<\u002Ftd><\u002Ftr><tr><td><strong>CCPA / CPRA<\u002Fstrong><\u002Ftd><td>California's consumer privacy statutes<\u002Ftd><\u002Ftr><tr><td><strong><span class=\"nb\">§1033<\u002Fspan><\u002Fstrong><\u002Ftd><td>The CFPB's open-banking rule creating a consumer right to permission financial data; currently enjoined and being rewritten<\u002Ftd><\u002Ftr><tr><td><strong>NCAP<\u002Fstrong><\u002Ftd><td>National Consumer Assistance Plan — the 2015 state-AG settlement that removed civil judgments and most tax liens from files<\u002Ftd><\u002Ftr><tr><td><strong>Trigger lead<\u002Fstrong><\u002Ftd><td>A prescreen lead generated when a consumer's credit is pulled for a mortgage<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h2 id=\"s-uk-and-eu-regulatory\" class=\"hd hd2 n0\"><span class=\"ht\">UK and EU regulatory<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Term<\u002Fth><th>Meaning<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><strong>UK GDPR / DPA 2018<\u002Fstrong><\u002Ftd><td>The UK data-protection regime<\u002Ftd><\u002Ftr><tr><td><strong>Legitimate interests<\u002Fstrong><\u002Ftd><td>The <span class=\"nb\">Article 6(1)(f)<\u002Fspan> lawful basis on which UK bureau processing rests<\u002Ftd><\u002Ftr><tr><td><strong>ICO<\u002Fstrong><\u002Ftd><td>Information Commissioner's Office — the UK data-protection regulator<\u002Ftd><\u002Ftr><tr><td><strong>CRAIN<\u002Fstrong><\u002Ftd><td>Credit Reference Agency Information Notice — the industry transparency notice<\u002Ftd><\u002Ftr><tr><td><strong>FCA<\u002Fstrong><\u002Ftd><td>Financial Conduct Authority — authorises UK credit reference agencies<\u002Ftd><\u002Ftr><tr><td><strong>CIMS<\u002Fstrong><\u002Ftd><td>Credit Information Market Study — the FCA study concluding December 2023<\u002Ftd><\u002Ftr><tr><td><strong>SCOR<\u002Fstrong><\u002Ftd><td>Steering Committee on Reciprocity — the industry body governing UK data sharing, judged not fit for purpose by the FCA<\u002Ftd><\u002Ftr><tr><td><strong>CRGB<\u002Fstrong><\u002Ftd><td>Credit Reporting Governance Body — SCOR's broader, more accountable replacement<\u002Ftd><\u002Ftr><tr><td><strong>CAIS<\u002Fstrong><\u002Ftd><td>Credit Account Information Sharing — Experian's UK bureau database<\u002Ftd><\u002Ftr><tr><td><strong>Closed user group<\u002Fstrong><\u002Ftd><td>The reciprocity structure limiting access to what a furnisher contributes<\u002Ftd><\u002Ftr><tr><td><strong>CMA<\u002Fstrong><\u002Ftd><td>Competition and Markets Authority — blocked the ClearScore acquisition in 2019<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h2 id=\"s-brazil\" class=\"hd hd2 n0\"><span class=\"ht\">Brazil<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Term<\u002Fth><th>Meaning<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><strong>LGPD<\u002Fstrong><\u002Ftd><td>Lei Geral de Proteção de Dados — Brazil's data-protection law<\u002Ftd><\u002Ftr><tr><td><strong><span class=\"nb\">Article 7(X)<\u002Fspan><\u002Fstrong><\u002Ftd><td>The \"protection of credit\" lawful basis on which Serasa's processing rests<\u002Ftd><\u002Ftr><tr><td><strong>Cadastro Positivo<\u002Fstrong><\u002Ftd><td>The positive credit registry, made opt-out by <span class=\"nb\">LC 166/2019<\u002Fspan><\u002Ftd><\u002Ftr><tr><td><strong>GBD<\u002Fstrong><\u002Ftd><td>Gestor de Banco de Dados — an accredited positive-registry database manager<\u002Ftd><\u002Ftr><tr><td><strong>ANPD<\u002Fstrong><\u002Ftd><td>Autoridade Nacional de Proteção de Dados — the Brazilian data-protection authority<\u002Ftd><\u002Ftr><tr><td><strong>Negativado<\u002Fstrong><\u002Ftd><td>A consumer with a registered default; the state Limpa Nome exists to clear<\u002Ftd><\u002Ftr><tr><td><strong>Limpa Nome<\u002Fstrong><\u002Ftd><td>Serasa's creditor-paid debt-renegotiation marketplace<\u002Ftd><\u002Ftr><tr><td><strong>Quod<\u002Fstrong><\u002Ftd><td>The bureau founded in 2016 by Brazil's five largest banks to reduce dependence on Serasa<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h2 id=\"s-industry-mechanics\" class=\"hd hd2 n0\"><span class=\"ht\">Industry mechanics<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Term<\u002Fth><th>Meaning<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><strong>Furnisher<\u002Fstrong><\u002Ftd><td>An institution that supplies account and repayment data to a bureau<\u002Ftd><\u002Ftr><tr><td><strong>Reciprocity<\u002Fstrong><\u002Ftd><td>The principle that a furnisher may only draw out the data categories it contributes<\u002Ftd><\u002Ftr><tr><td><strong>Metro 2<\u002Fstrong><\u002Ftd><td>The fixed-format data standard for furnishing, maintained by the CDIA<\u002Ftd><\u002Ftr><tr><td><strong>CDIA<\u002Fstrong><\u002Ftd><td>Consumer Data Industry Association — the US industry body<\u002Ftd><\u002Ftr><tr><td><strong>e-OSCAR<\u002Fstrong><\u002Ftd><td>The dispute-routing system jointly operated by the bureaux<\u002Ftd><\u002Ftr><tr><td><strong>ACDV<\u002Fstrong><\u002Ftd><td>Automated Credit Dispute Verification — the one-page form carrying a dispute to a furnisher<\u002Ftd><\u002Ftr><tr><td><strong>Tri-merge<\u002Fstrong><\u002Ftd><td>The US mortgage convention requiring reports from all three bureaux<\u002Ftd><\u002Ftr><tr><td><strong>Mixed file<\u002Fstrong><\u002Ftd><td>Two consumers' data merged by over-matching — the most damaging bureau error<\u002Ftd><\u002Ftr><tr><td><strong>Fragmented file<\u002Fstrong><\u002Ftd><td>One consumer's history split across files by under-matching<\u002Ftd><\u002Ftr><tr><td><strong>Thin file / credit invisible<\u002Fstrong><\u002Ftd><td>Consumers with insufficient or no bureau history<\u002Ftd><\u002Ftr><tr><td><strong>Prescreen<\u002Fstrong><\u002Ftd><td>A lender campaign selecting consumers meeting pre-set criteria, requiring a firm offer of credit<\u002Ftd><\u002Ftr><tr><td><strong>Attribute<\u002Fstrong><\u002Ftd><td>A derived variable computed from the file and sold to lenders<\u002Ftd><\u002Ftr><tr><td><strong>Tradeline<\u002Fstrong><\u002Ftd><td>An individual account record on a consumer's file<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h2 id=\"s-products-and-platforms\" class=\"hd hd2 n0\"><span class=\"ht\">Products and platforms<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Term<\u002Fth><th>Meaning<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><strong>File One<\u002Fstrong><\u002Ftd><td>Experian's core US consumer database<\u002Ftd><\u002Ftr><tr><td><strong>Find Consumer<\u002Fstrong><\u002Ftd><td>Experian's search-and-match engine<\u002Ftd><\u002Ftr><tr><td><strong>Ascend<\u002Fstrong><\u002Ftd><td>Experian's cloud-native analytics and decisioning platform<\u002Ftd><\u002Ftr><tr><td><strong>PowerCurve<\u002Fstrong><\u002Ftd><td>Experian's decisioning software suite<\u002Ftd><\u002Ftr><tr><td><strong>CrossCore / Precise ID<\u002Fstrong><\u002Ftd><td>Fraud orchestration and identity verification<\u002Ftd><\u002Ftr><tr><td><strong>Boost<\u002Fstrong><\u002Ftd><td>The consumer product adding permissioned utility, telecom and rent payments to the file<\u002Ftd><\u002Ftr><tr><td><strong>Experian Go<\u002Fstrong><\u002Ftd><td>The product establishing a file for credit-invisible consumers<\u002Ftd><\u002Ftr><tr><td><strong>AutoCheck<\u002Fstrong><\u002Ftd><td>Experian's vehicle-history product, second to Carfax<\u002Ftd><\u002Ftr><tr><td><strong>VantageScore<\u002Fstrong><\u002Ftd><td>The scoring venture co-owned equally by the three bureaux<\u002Ftd><\u002Ftr><tr><td><strong>FICO<\u002Fstrong><\u002Ftd><td>Fair Isaac's score — distributed by Experian under licence; simultaneously supplier, partner and rival<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h2 id=\"s-financial\" class=\"hd hd2 n0\"><span class=\"ht\">Financial<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Term<\u002Fth><th>Meaning<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><strong>Benchmark<\u002Fstrong><\u002Ftd><td>Experian's non-GAAP measures — Benchmark EBIT, PBT, EBITDA and EPS<\u002Ftd><\u002Ftr><tr><td><strong>Ongoing activities<\u002Fstrong><\u002Ftd><td>Revenue excluding lines re-presented as exited from FY26<\u002Ftd><\u002Ftr><tr><td><strong>Organic growth<\u002Fstrong><\u002Ftd><td>Growth excluding acquisitions and currency<\u002Ftd><\u002Ftr><tr><td><strong>Constant currency (CER)<\u002Fstrong><\u002Ftd><td>Growth excluding currency movement<\u002Ftd><\u002Ftr><tr><td><strong>Acquisition intangibles<\u002Fstrong><\u002Ftd><td>Customer-relationship and technology assets created on acquisition, whose amortisation Benchmark excludes<\u002Ftd><\u002Ftr><tr><td><strong>ROCE<\u002Fstrong><\u002Ftd><td>Return on capital employed, post-tax on the Benchmark basis<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<div class=\"sep\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" data-part=\"8\">\n<header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Appendix B<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><d edit-report cost per conventional loan<\u002Ftd><td>~US$50 (2022) → ~<strong>US$540 (2026)<\u002Fstrong><\u002Ftd><\u002Ftr><tr><td>FICO tri-merge base price<\u002Ftd><td>US$1.80 (late 2022) → US$30 (2026)<\u002Ftd><\u002Ftr><tr><td>FICO wholesale royalty<\u002Ftd><td>US$4.95, <strong>doubled to US$10.00 for 2026<\u002Fstrong><\u002Ftd><\u002Ftr><tr><td>VantageScore 4.0<\u002Ftd><td>FHFA-authorised 8 July 2025; 11 of the 15 largest lenders; ~30% of the US mortgage market<\u002Ftd><\u002Ftr><tr><td>TransUnion VantageScore 4.0 price<\u002Ftd><td>US$4 per score for 2026<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h2 id=\"s-litigation-and-regulation\" class=\"hd hd2 n0\"><span class=\"ht\">Litigation and regulation<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Item<\u002Fth><th>Canonical position<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><strong>CFPB v. Experian Information Solutions<\u002Fstrong><\u002Ftd><td>Filed 7 January 2025 (C.D. Cal.); motion to dismiss <strong>denied 22 October 2025<\u002Fstrong>; answered 3 November 2025; <strong>JURY TRIAL 21 SEPTEMBER 2026<\u002Fstrong>; no material provision recognised<\u002Ftd><\u002Ftr><tr><td>ICO enforcement notice<\u002Ftd><td>Issued 27 October 2020 over ~51m adults' marketing data; substantially overturned by the First-tier Tribunal 20 February 2023; ICO appeal dismissed by the Upper Tribunal <strong>23 April 2024<\u002Fstrong>; ICO declined further appeal<\u002Ftd><\u002Ftr><tr><td>CMA / ClearScore<\u002Ftd><td>Merger abandoned; reference cancelled 27 February 2019<\u002Ftd><\u002Ftr><tr><td>CFPB consent order<\u002Ftd><td>March 2017, US$3m civil penalty over score marketing<\u002Ftd><\u002Ftr><tr><td>2015 T-Mobile breach<\u002Ftd><td>~15 million consumers; 40-state settlement November 2022<\u002Ftd><\u002Ftr><tr><td>Equifax breach (context)<\u002Ftd><td>2017, 147 million consumers — the industry's defining event<\u002Ftd><\u002Ftr><tr><td>Section 1033<\u002Ftd><td><strong>Enjoined and being rewritten<\u002Fstrong>; ANPR issued 22 August 2025<\u002Ftd><\u002Ftr><tr><td>FCA CIMS<\u002Ftd><td>Final report December 2023; CRGB replacing SCOR; consultation CP26/7 February 2026<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<div class=\"sep\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" data-part=\"9\">\n<header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Appendix C<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">C<\u002Fspan><\u002Fdiv><h1 id=\"app-c\" class=\"part\" data-short=\"Appendix C — Reconciliation of Cross-Volume Discrepancies\">Reconciliation of Cross-Volume Discrepancies<\u002Fh1><p class=\"opener-s\">Where the volumes disagree, which figure governs, and which differences are basis rather than error.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Reference<\u002Fdiv><div class=\"plate-v\">C<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">3<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Tables<\u002Fdiv><div class=\"plate-v\">2<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-basis-date-and-vintage-differences-not-errors\"><span class=\"inpart-n\"><\u002Fspan><span>Basis, date and vintage differences — not errors<\u002Fspan><\u002Fa><a href=\"#s-genuine-errors-corrections-and-supersessions\"><span class=\"inpart-n\"><\u002Fspan><span>Genuine errors, corrections and supersessions<\u002Fspan><\u002Fa><a href=\"#s-known-unknowns-carried-forward\"><span class=\"inpart-n\"><\u002Fspan><span>Known unknowns carried forward<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader>\n<p>The volumes were written sequentially against a moving evidence base. Discrepancies fall into two categories that must be kept apart: <strong>basis, date and perimeter differences<\u002Fstrong>, which are legitimate, and <strong>genuine errors or supersessions<\u002Fstrong>, which are not.<\u002Fp>\n<h2 id=\"s-basis-date-and-vintage-differences-not-errors\" class=\"hd hd2 n0\"><span class=\"ht\">Basis, date and vintage differences — not errors<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>#<\u002Fth><th>Item<\u002Fth><th>Appears as<\u002Fth><th>Resolution<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>1<\u002Ftd><td><strong>Group revenue<\u002Fstrong><\u002Ftd><td>US$8,445m versus US$8,425m<\u002Ftd><td><strong>Statutory total versus ongoing activities.<\u002Fstrong> The US$20m difference is the exited Latin America and EMEA/Asia Pacific B2B lines re-presented from FY26. Both correct; state which.<\u002Ftd><\u002Ftr><tr><td>2<\u002Ftd><td><strong>Benchmark EBIT<\u002Fstrong><\u002Ftd><td>US$2,407m versus US$2,397m<\u002Ftd><td><strong>Ongoing versus total.<\u002Fstrong> The US$10m difference is the operating loss on exited activities. <a class=\"xr\" href=\"#part-iv\">Volume IV<\u002Fa> uses both correctly in different contexts.<\u002Ftd><\u002Ftr><tr><td>3<\u002Ftd><td><strong>Group growth rate<\u002Fstrong><\u002Ftd><td>+8% / +11% / +12% / +13%<\u002Ftd><td><strong>Organic / constant-currency / statutory actual / ongoing actual.<\u002Fstrong> All four are correct on their stated basis and must never be used interchangeably.<\u002Ftd><\u002Ftr><tr><td>4<\u002Ftd><td><strong>EPS<\u002Fstrong><\u002Ftd><td>179.8 cents versus 164.5 cents<\u002Ftd><td><strong>Benchmark versus statutory basic.<\u002Fstrong> The 15.3-cent gap is the subject of <a class=\"xr\" href=\"#part-iv\">Part IV<\u002Fa>'s reconciliation and is structural, not a one-off.<\u002Ftd><\u002Ftr><tr><td>5<\u002Ftd><td><strong>Labour cost<\u002Fstrong><\u002Ftd><td>\"32%\" versus \"31.8%\"<\u002Ftd><td>Rounded versus precise. 31.8% governs.<\u002Ftd><\u002Ftr><tr><td>6<\u002Ftd><td><strong>Credit invisible / unscorable<\u002Fstrong><\u002Ftd><td>26m / 19m versus 28m / 21m<\u002Ftd><td><strong>Different vintages.<\u002Fstrong> The 26m/19m figures are the CFPB's foundational 2015 measurement (as of 2010 data); the 28m/21m are the later-vintage figures used in Experian's own materials. Cite the vintage.<\u002Ftd><\u002Ftr><tr><td>7<\u002Ftd><td><strong>Employee count<\u002Fstrong><\u002Ftd><td>~25,200 versus 25,346<\u002Ftd><td>Company statement versus a third-party estimate (Revelio, March 2026) on a possibly different consolidation basis. ~25,200 governs.<\u002Ftd><\u002Ftr><tr><td>8<\u002Ftd><td><strong>Serasa market share<\u002Fstrong><\u002Ftd><td>~60%<\u002Ftd><td>A 2012 Experian statement; no more recent published figure was established. Treat as approximate and dated.<\u002Ftd><\u002Ftr><tr><td>9<\u002Ftd><td><strong>FICO royalty<\u002Fstrong><\u002Ftd><td>US$4.95 versus US$10.00<\u002Ftd><td><strong>Sequential, not conflicting.<\u002Fstrong> US$4.95 was the mortgage performance-model royalty; FICO doubled it to US$10.00 for 2026, drawing a Congressional oversight letter. The US$10.00 figure is current.<\u002Ftd><\u002Ftr><tr><td>10<\u002Ftd><td><strong>Dispute volume<\u002Fstrong><\u002Ftd><td>\"&gt;1 million per month\" versus \"&gt;12 million per year\"<\u002Ftd><td>The same figure expressed at different cadences, both from the CFPB complaint.<\u002Ftd><\u002Ftr><tr><td>11<\u002Ftd><td><strong>Credit Karma members<\u002Fstrong><\u002Ftd><td>~99.5 million versus ~130 million<\u002Ftd><td>Intuit's reported figure versus media citations of cumulative sign-ups. The lower figure is the more defensible.<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h2 id=\"s-genuine-errors-corrections-and-supersessions\" class=\"hd hd2 n0\"><span class=\"ht\">Genuine errors, corrections and supersessions<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>#<\u002Fth><th>Item<\u002Fth><th>Status<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>12<\u002Ftd><td><strong>The T-Mobile breach settlement amount<\u002Fstrong><\u002Ftd><td><strong>UNRESOLVED DISCREPANCY.<\u002Fstrong> <a class=\"xr\" href=\"#part-i\">Volume I<\u002Fa> records the Experian share of the November 2022 40-state settlement as <strong>US$12.67m<\u002Fstrong>; <a class=\"xr\" href=\"#part-iv\">Volume IV<\u002Fa> records it as <strong>US$13.67m<\u002Fstrong>. Both cite the same multistate action, in which the combined Experian-plus-T-Mobile figure exceeded US$15–16m. The two figures are not reconciled here and one is a transcription error. Treat the settlement as <strong>\"approximately US$13m\"<\u002Fstrong> pending verification against a state attorney-general press release.<\u002Ftd><\u002Ftr><tr><td>13<\u002Ftd><td><strong>Goodwill impairment arithmetic<\u002Fstrong><\u002Ftd><td><strong>PARTIALLY UNRESOLVED.<\u002Fstrong> <a class=\"xr\" href=\"#part-v\">Volume V<\u002Fa> records two impairments totalling US$232m (US$53m FY21, US$179m FY23), both EMEA/Asia Pacific. <a class=\"xr\" href=\"#part-iii\">Volume III<\u002Fa> records <strong>accumulated<\u002Fstrong> goodwill impairment of US$246m by 31 March 2023. The US$14m difference implies an earlier or smaller impairment not separately identified. The material conclusion is unaffected: <strong>impairments have occurred only in EMEA/Asia Pacific; North America, Latin America and the UK have never been impaired.<\u002Fstrong><\u002Ftd><\u002Ftr><tr><td>14<\u002Ftd><td><strong>Experian plc's domicile<\u002Fstrong><\u002Ftd><td><strong>CORRECTED.<\u002Fstrong> An early characterisation described Experian as Dublin-headquartered. The verified position is a three-way split: <strong>incorporated in Jersey<\u002Fstrong> (registered office 22 Grenville Street, St Helier), <strong>tax resident in Ireland<\u002Fstrong>, <strong>corporate headquarters in Dublin<\u002Fstrong>, with operational hubs in Nottingham and Costa Mesa. All three descriptions are simultaneously true and are routinely garbled in secondary sources.<\u002Ftd><\u002Ftr><tr><td>15<\u002Ftd><td><strong>Section 1033 status<\u002Fstrong><\u002Ftd><td><strong>SUPERSEDED WITHIN THE STUDY.<\u002Fstrong> Earlier volumes treat the CFPB's open-banking rule as a live legal rail. <a class=\"xr\" href=\"#part-v\">Volume V<\u002Fa> establishes it is <strong>enjoined and being rewritten<\u002Fstrong> following litigation in the Eastern District of Kentucky, with an ANPR issued 22 August 2025 and the Sixth Circuit appeal stayed. The later position governs and materially weakens the near-term open-banking disruption thesis.<\u002Ftd><\u002Ftr><tr><td>16<\u002Ftd><td><strong>File architecture attribution<\u002Fstrong><\u002Ftd><td><strong>LABELLED <span class=\"ev\">HYPOTHESIS<\u002Fspan>, not fact.<\u002Fstrong> The CFPB's 2012 white paper describes \"at least one NCRA\" as using a flat-file architecture. Attributing that specifically to Experian is inference, and <a class=\"xr\" href=\"#part-iii\">Volume III<\u002Fa> labels it as such. Do not present it as established.<\u002Ftd><\u002Ftr><tr><td>17<\u002Ftd><td><strong>Per-dispute agent time<\u002Fstrong><\u002Ftd><td><strong>NOT ESTABLISHED.<\u002Fstrong> The US$0.57-per-dispute-letter figure comes from NCLC research on an unnamed bureau, not from the CFPB complaint, which names no offshore vendor and states no seconds-per-dispute figure. <a class=\"xr\" href=\"#part-iii\">Volume III<\u002Fa> labels this correctly; secondary retellings often do not.<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h2 id=\"s-known-unknowns-carried-forward\" class=\"hd hd2 n0\"><span class=\"ht\">Known unknowns carried forward<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li>Per-inquiry bureau pricing, enterprise contract terms and marketplace referral economics.<\u002Fli><li>The Limpa Nome creditor take-rate.<\u002Fli><li>The paid-conversion rate of the 215 million free members and the subscription-versus-marketplace split within Consumer Services.<\u002Fli><li>The split of the US$3,078m intangibles balance between acquisition intangibles and internally generated software.<\u002Fli><li>Experian's internal match thresholds, validation stage counts and mixed-file rates.<\u002Fli><li>The identity of the group CISO and the scope of security certifications.<\u002Fli><li>Formal availability SLAs, RTO and RPO targets.<\u002Fli><li>Experian's dispute-operation offshore vendor and its contract terms.<\u002Fli><li>The CFPB's settlement posture and the penalty or redress sought.<\u002Fli><li>Deal values for Own Up, KYC360, AtData, NeuroID and Audigent.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" data-part=\"10\">\n<header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Appendix D<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">D<\u002Fspan><\u002Fdiv><h1 id=\"app-d\" class=\"part\" data-short=\"Appendix D — Source Hierarchy &amp; Evidence Conventions\">Source Hierarchy &amp; Evidence Conventions<\u002Fh1><p class=\"opener-s\">How claims were graded, and what each evidence label does and does not assert.<\u002Fp><div class=\"plate\" style=\"grid-template-columns:repeat(2,1fr)\"><div class=\"plate-c\"><div class=\"plate-k\">Reference<\u002Fdiv><div class=\"plate-v\">D<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Ranked source tiers<\u002Fdiv><div class=\"plate-v\">9<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader>\n<p>Sources were prioritised as follows, with primary evidence preferred wherever it existed:<\u002Fp>\n<ol class=\"lst\"><li><strong>Experian plc's Annual Report and results announcements<\u002Fstrong> — the FY26 report and results (year to 31 March 2026), segmental notes, the non-GAAP reconciliation, the cash-flow statement, the goodwill and intangibles notes, and the provisions and contingent-liabilities disclosure.<\u002Fli><li><strong>Regulatory filings and enforcement records<\u002Fstrong> — the <strong>CFPB's complaint of 7 January 2025<\u002Fstrong> and the subsequent docket including the order denying the motion to dismiss; the CFPB's larger-participant rule and supervisory publications; the <strong>ICO's 2020 enforcement notice<\u002Fstrong> and the First-tier and Upper Tribunal judgments; the <strong>FCA's Credit Information Market Study<\u002Fstrong> and CP26/7; the <strong>CMA's ClearScore<\u002Fstrong> decision; <strong>FHFA<\u002Fstrong> materials on VantageScore; and Brazilian material from the Banco Central and ANPD.<\u002Fli><li><strong>Corporate registries<\u002Fstrong> — the Jersey Financial Services Commission, the Irish CRO and UK Companies House.<\u002Fli><li><strong>Litigation records<\u002Fstrong> — FCRA class actions, mixed-file and reinsertion cases, and expert testimony describing matching logic. <strong>For this subject, adversarial filings are the single richest window into internal operations<\u002Fstrong>, since the company publishes very little about its systems.<\u002Fli><li><strong>Industry bodies and standards<\u002Fstrong> — the CDIA on Metro 2 and e-OSCAR, SCOR's Principles of Reciprocity, and the National Consumer Assistance Plan.<\u002Fli><li><strong>Competitor filings<\u002Fstrong> — Equifax and TransUnion 10-Ks and adjusted-measure reconciliations, which disclose segment detail in more granularity than Experian and permit benchmarking; and FICO's filings and public statements on score royalties.<\u002Fli><li><strong>Independent research<\u002Fstrong> — the <strong>FTC's Section 319 FACTA accuracy studies<\u002Fstrong>, the CFPB's credit-invisibles research, FinRegLab on cashflow underwriting and explainability, and <strong>National Consumer Law Center<\u002Fstrong> research on dispute handling and mixed files, used deliberately as a counterweight to company framing.<\u002Fli><li><strong>Vendor case studies and job advertisements<\u002Fstrong>, which for a company this reticent are among the few sources naming concrete systems.<\u002Fli><li>Reputable financial and trade journalism: the Financial Times, Reuters, Bloomberg, American Banker, HousingWire and National Mortgage News.<\u002Fli><\u002Fol>\n<p>SEO-oriented aggregators were not relied on where primary evidence existed. For strategically significant claims, sources were triangulated.<\u002Fp>\n<p><strong>Three conventions specific to this study.<\u002Fstrong> First, <strong>allegations are labelled as allegations<\u002Fstrong>: the CFPB's descriptions of Experian's internal dispute and matching processes are pleadings in unresolved litigation, not adjudicated findings, and the study says so at every use. Second, <strong>the prohibition on inventing architecture is absolute<\u002Fstrong>: where Experian has published nothing about an internal mechanism, the study records <span class=\"ev unk\">UNKNOWN<\u002Fspan> rather than describing a plausible-sounding system. Third, <strong>company framing is treated as a claim to be tested<\u002Fstrong>, not a conclusion to be adopted — this applies particularly to the \"financial health\" narrative around the consumer business and to the Benchmark presentation of earnings.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<p><em>End of the Experian Enterprise Reverse-Engineering Study.<\u002Fem><\u002Fp>\n<\u002Fsection><\u002Fmain>\n<\u002Fdiv><script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;bodyScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.85,&quot;max&quot;:1.15,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Reading&quot;},&quot;wideMeasure&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Reading&quot;},&quot;sidebarField&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;slate&quot;,&quot;paper&quot;],&quot;default&quot;:&quot;slate&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Chrome&quot;},&quot;figureFill&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Chrome&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._apply();\n    const scroller = () => {\n      const de = document.documentElement;\n      return de.scrollHeight > de.clientHeight + 4 ? de : document.body;\n    };\n    const upd = () => {\n      const hs = Array.prototype.slice.call(document.querySelectorAll('h1.part'));\n      if (!hs.length) return;\n      let idx = 0;\n      for (let i = 0; i < hs.length; i++) { if (hs[i].getBoundingClientRect().top <= 200) idx = i; }\n      const items = document.querySelectorAll('.p-i');\n      for (let i = 0; i < items.length; i++) items[i].classList.toggle('on', i === idx);\n      const cur = document.getElementById('nav-cur');\n      if (cur && hs[idx]) cur.textContent = hs[idx].getAttribute('data-short') || '';\n      const bar = document.getElementById('nav-bar');\n      if (bar) {\n        const d = scroller();\n        const p = d.scrollTop / Math.max(1, d.scrollHeight - d.clientHeight);\n        bar.style.width = (Math.min(1, Math.max(0, p)) * 100).toFixed(2) + '%';\n      }\n      const on = document.querySelector('.p-i.on');\n      if (on && this._last !== idx) {\n        this._last = idx;\n        const nav = document.querySelector('.side');\n        if (nav && nav.scrollHeight > nav.clientHeight + 4) {\n          const r = on.getBoundingClientRect(), nr = nav.getBoundingClientRect();\n          if (r.top < nr.top + 60 || r.bottom > nr.bottom - 40) nav.scrollTop += r.top - nr.top - 120;\n        }\n      }\n    };\n    let tick = false;\n    this._onScroll = () => { if (tick) return; tick = true; requestAnimationFrame(() => { tick = false; upd(); }); };\n    window.addEventListener('scroll', this._onScroll, { passive: true, capture: true });\n    document.addEventListener('scroll', this._onScroll, { passive: true, capture: true });\n    window.addEventListener('resize', this._onScroll, { passive: true });\n    window.addEventListener('hashchange', this._onScroll);\n    this._iv = setInterval(upd, 700);\n    upd();\n  }\n  componentDidUpdate() { this._apply(); }\n  _apply() {\n    const r = document.documentElement;\n    const s = Number(this.props.bodyScale ?? 1);\n    r.style.setProperty('--body-size', (20.5 * (isFinite(s) ? s : 1)).toFixed(2) + 'px');\n    r.style.setProperty('--measure', (this.props.wideMeasure ? 82 : 70) + 'ch');\n    document.querySelectorAll('figure.fig').forEach(f => f.classList.toggle('fill', !!this.props.figureFill));\n    const side = document.querySelector('.side');\n    if (side) {\n      const paper = this.props.sidebarField === 'paper';\n      side.style.setProperty('--s-field', paper ? 'var(--paper)' : 'var(--steel)');\n      side.style.setProperty('--s-ink', paper ? 'var(--ink)' : 'var(--color-bg)');\n      side.style.setProperty('--s-acc', paper ? 'var(--acc)' : 'var(--color-accent-300)');\n      side.style.setProperty('--s-mute', paper ? 'var(--muted)' : 'color-mix(in srgb,var(--color-bg) 66%,transparent)');\n      side.style.setProperty('--s-line', paper ? 'var(--wire)' : 'color-mix(in srgb,var(--color-bg) 28%,transparent)');\n      side.style.setProperty('--s-line2', paper ? 'var(--wire2)' : 'color-mix(in srgb,var(--color-bg) 15%,transparent)');\n    }\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll, true);\n    document.removeEventListener('scroll', this._onScroll, true);\n    window.removeEventListener('resize', this._onScroll);\n    window.removeEventListener('hashchange', this._onScroll);\n    clearInterval(this._iv);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fx-dc><\u002Fbody><\u002Fhtml>"
  </script>
