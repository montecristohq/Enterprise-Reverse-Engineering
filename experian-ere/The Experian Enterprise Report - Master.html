document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht: 600;\n  font-display: swap;\n  src: url(\"135807d4-be78-4d3b-948d-a3d5f28b174c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"1ca4df14-7c2c-4ee1-a9dc-0f7fd01dc28d\"><\u002Fscript>\n<style>\n:root{\n /* Industry tokens, retuned: cool slate neutrals + one signal red. */\n --color-bg:#f1f2f4;\n --color-surface:#e6e8ec;\n --color-text:#14181d;\n --color-divider:color-mix(in srgb,#14181d 16%,transparent);\n --color-neutral-100:#f4f5f7;--color-neutral-200:#e6e8ec;--color-neutral-300:#d2d6dc;\n --color-neutral-400:#b3b9c2;--color-neutral-500:#939aa6;--color-neutral-600:#767d8a;\n --color-neutral-700:#5a616d;--color-neutral-800:#3f4550;--color-neutral-900:#262d36;\n --color-accent:#c1352a;\n --color-accent-100:#fdf0ee;--color-accent-200:#fadcd8;--color-accent-300:#f4bdb6;\n --color-accent-400:#e9968c;--color-accent-500:#d96e62;--color-accent-600:#c1352a;\n --color-accent-700:#97261d;--color-accent-800:#6d1a14;--color-accent-900:#45110d;\n --color-accent-2:#97261d;\n --color-accent-2-100:#fdf0ee;--color-accent-2-200:#fadcd8;--color-accent-2-300:#f4bdb6;\n --color-accent-2-400:#e9968c;--color-accent-2-500:#d96e62;--color-accent-2-600:#c1352a;\n --color-accent-2-700:#97261d;--color-accent-2-800:#6d1a14;--color-accent-2-900:#45110d;\n\n --paper:var(--color-bg);\n --ink:var(--color-text);\n --steel:#1e242c;                       /* the slate field — sidebar, solid nodes */\n --steel-2:#2c343f;\n --acc:var(--color-accent-700);          /* #97261d — legible at 8pt on paper */\n --acc-solid:var(--color-accent);        /* #c1352a — fills, bars, keys */\n --acc-dk:var(--color-accent-300);       /* signal on the slate field */\n --acc-fill:color-mix(in srgb,var(--color-accent) 11%,transparent);\n --wire:color-mix(in srgb,var(--color-text) 30%,transparent);\n --wire2:color-mix(in srgb,var(--color-text) 13%,transparent);\n --muted:color-mix(in srgb,var(--color-text) 55%,transparent);\n --measure:70ch;\n --body-size:20.5px;\n}\nbody{background:var(--pape TY DEPTH]<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-iv-15\"><span class=\"tc-k mono\">IV.15<\u002Fspan><span>One Dollar of Group Revenue (FY26, per US$1 of statutory revenue US$8,445m)<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-iv-16\"><span class=\"tc-k mono\">IV.16<\u002Fspan><span>Economic Driver Tree<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-iv-17\"><span class=\"tc-k mono\">IV.17<\u002Fspan><span>Scenario and Sensitivity Analysis [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> unless stated]<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-iv-18\"><span class=\"tc-k mono\">IV.18<\u002Fspan><span>Profitability Decomposition and Normalisation<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-recommendations-3\"><span class=\"tc-k mono\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-caveats-4\"><span class=\"tc-k mono\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><div class=\"tc-p\"><a class=\"tc-1\" href=\"#part-v\"><span class=\"tc-r mono\">V<\u002Fspan><span>Part V — Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-volume-v-management-culture-competition-moat-risk-strategic-evolution\"><span class=\"tc-k mono\"><\u002Fspan><span>VOLUME V — Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-v-1\"><span class=\"tc-k mono\">V.1<\u002Fspan><span>Institutional Architects and the Two Lineages (replaces Founder Analysis)<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-v-2\"><span class=\"tc-k mono\">V.2<\u002Fspan><span>Current Management Team<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-v-3\"><span class=\"tc-k mono\">V.3<\u002Fspan><span>Management System and Governance in Practice<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-v-4\"><span class=\"tc-k mono\">V.4<\u002Fspan><span>Culture — Declared versus Revealed<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"# ><a class=\"tc-2\" href=\"#s-v-22\"><span class=\"tc-k mono\">V.22<\u002Fspan><span>What the Market May Misunderstand (≥6)<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-v-23\"><span class=\"tc-k mono\">V.23<\u002Fspan><span>Management and Capital-Allocation Judgement<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-v-24\"><span class=\"tc-k mono\">V.24<\u002Fspan><span>Volume V Reconstruction — Synthesis<\u002Fspan><\u002Fa><\u002Fdiv><div class=\"tc-p\"><a class=\"tc-1\" href=\"#part-vi\"><span class=\"tc-r mono\">VI<\u002Fspan><span>Part VI — Cross-Volume Synthesis<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-vi-1\"><span class=\"tc-k mono\">VI.1<\u002Fspan><span>What Experian actually owns<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-vi-2\"><span class=\"tc-k mono\">VI.2<\u002Fspan><span>The single causal model<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-vi-3\"><span class=\"tc-k mono\">VI.3<\u002Fspan><span>What the volumes prove together that none proves alone<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-vi-4\"><span class=\"tc-k mono\">VI.4<\u002Fspan><span>The central tension<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-vi-5\"><span class=\"tc-k mono\">VI.5<\u002Fspan><span>What would falsify this reading<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-vi-6\"><span class=\"tc-k mono\">VI.6<\u002Fspan><span>What Experian is becoming<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-vi-7\"><span class=\"tc-k mono\">VI.7<\u002Fspan><span>Implications for a fintech builder<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-vi-8\"><span class=\"tc-k mono\">VI.8<\u002Fspan><span>Ten cross-volume conclusions<\u002Fspan><\u002Fa><\u002Fdiv><div class=\"tc-p\"><a class=\"tc-1\" href=\"#app-a\"><span class=\"tc-r mono\">A<\u002Fspan><span>Appendix A — Glossary of Regulatory and Technical Terms<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-us-regulatory\"><span class=\"tc-k mono\"><\u002Fspan><span>US regulatory<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-uk-and-eu-regulatory\"><span class=\"tc-k mono\"><\u002Fspan><span>UK and EU regulatory<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-brazil\"><span class=\"tc-k mono\"><\u002Fspan><span>Brazil<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-industry-mechanics\"><span class=\"tc-k mono\"><\u002Fspan><span>Industry mechanics<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-products-and-platforms\"><span class=\"tc-k mono\"><\u002Fspan><span>Products and platforms<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-financial\"><span class=\"tc-k mono\"><\u002Fspan><span>Financial<\u002Fspan><\u002Fa><\u002Fdiv><div class=\"tc-p\"><a class=\"tc-1\" href=\"#app-b\"><span class=\"tc-r mono\">B<\u002Fspan><span>Appendix B — Canonical Figures Register<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-group-financials-fy26-year-to-31-march-2026\"><span class=\"tc-k mono\"><\u002Fspan><span>Group financials — FY26 (year to 31 March 2026)<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-revenue-architecture\"><span class=\"tc-k mono\"><\u002Fspan><span>Revenue architecture<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-cost-architecture-benchmark-of-revenue\"><span class=\"tc-k mono\"><\u002Fspan><span>Cost architecture (Benchmark, % of revenue)<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-balance-sheet-and-capital\"><span class=\"tc-k mono\"><\u002Fspan><span>Balance sheet and capital<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-corporate\"><span class=\"tc-k mono\"><\u002Fspan><span>Corporate<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-operational-scale\"><span class=\"tc-k mono\"><\u002Fspan><span>Operational scale<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-pricing-and-the-mortgage-chain\"><span class=\"tc-k mono\"><\u002Fspan><span>Pricing and the mortgage chain<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-litigation-and-regulation\"><span class=\"tc-k mono\"><\u002Fspan><span>Litigation and regulation<\u002Fspan><\u002Fa><\u002Fdiv><div class=\"tc-p\"><a class=\"tc-1\" href=\"#app-c\"><span class=\"tc-r mono\">C<\u002Fspan><span>Appendix C — Reconciliation of Cross-Volume Discrepancies<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-basis-date-and-vintage-differences-not-errors\"><span class=\"tc-k mono\"><\u002Fspan><span>Basis, date and vintage differences — not errors<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-genuine-errors-corrections-and-supersessions\"><span class=\"tc-k mono\"><\u002Fspan><span>Genuine errors, corrections and supersessions<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-known-unknowns-carried-forward\"><span class=\"tc-k mono\"><\u002Fspan><span>Known unknowns carried forward<\u002Fspan><\u002Fa><\u002Fdiv><div class=\"tc-p\"><a class=\"tc-1\" href=\"#app-d\"><span class=\"tc-r mono\">D<\u002Fspan><span>Appendix D — Source Hierarchy &amp; Evidence Conventions<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fnav>\n<h2 id=\"s-how-to-read-this-document\" class=\"hd hd2 n0\"><span class=\"ht\">How to read this document<\u002Fspan><\u002Fh2>\n<p>This study takes Experian apart component by component across five volumes, then reassembles it. Each volume was researched and written as a standalone study; this master edition binds them into one document with a single set of conventions, a glossary, a canonical figures register, and a synthesis that no individual volume contains.<\u002Fp>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Part<\u002Fth><th>Volume<\u002Fth><th>Question it answers<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Front matter<\u002Ftd><td>—<\u002Ftd><td>Conventions, glossary, canonical figures, how to navigate<\u002Ftd><\u002Ftr><tr><td><a class=\"xr\" href=\"#part-i\">Part I<\u002Fa><\u002Ftd><td>Corporate, Legal, Regulatory &amp; Institutional Anatomy<\u002Ftd><td>Who owns it, which entity holds which database under which permission, and how a data business is regulated across incompatible jurisdictions<\u002Ftd><\u002Ftr><tr><td><a class=\"xr\" href=\"#part-ii\">Part II<\u002Fa><\u002Ftd><td>Product, the Three-Sided Customer Structure &amp; the Inverted Value Flow<\u002Ftd><td>What it sells, to whom, and how a free input becomes paid output<\u002Ftd><\u002Ftr><tr><td><a class=\"xr\" href=\"#part-iii\">Part III<\u002Fa><\u002Ftd><td>Operations, Identity Infrastructure, Data, Technology &amp; Organisational Design<\u002Ftd><td>How records are matched to people, and what happens when that fails<\u002Ftd><\u002Ftr><tr><td><a class=\"xr\" href=\"#part-iv\">Part IV<\u002Fa><\u002Ftd><td>Financial Statements, Revenue Architecture, Unit Economics &amp; Capital<\u002Ftd><td>Where a 28.6% margin comes from when the raw material costs nothing<\u002Ftd><\u002Ftr><tr><td><a class=\"xr\" href=\"#part-v\">Part V<\u002Fa><\u002Ftd><td>Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution<\u002Ftd><td>Why it wins, what could break it, and what it becomes<\u002Ftd><\u002Ftr><tr><td><a class=\"xr\" href=\"#part-vi\">Part VI<\u002Fa><\u002Ftd><td><strong>Cross-Volume Synthesis<\u002Fstrong><\u002Ftd><td>What the five volumes prove together that none proves alone<\u002Ftd><\u002Ftr><tr><td><a class=\"xr\" href=\"#app-a\">Appendix A<\u002Fa><\u002Ftd><td>Glossary of Regulatory and Technical Terms<\u002Ftd><td>Load-bearing — read before <a class=\"xr\" href=\"#part-ii\">Part II<\u002Fa><\u002Ftd><\u002Ftr><tr><td><a class=\"xr\" href=\"#app-b\">Appendix B<\u002Fa><\u002Ftd><td>Canonical Figures Register<\u002Ftd><td>The governing value for every material number, with its basis<\u002Ftd><\u002Ftr><tr><td><a class=\"xr\" href=\"#app-c\">Appendix C<\u002Fa><\u002Ftd><td>Reconciliation of Cross-Volume Discrepancies<\u002Ftd><td>Where the volumes disagree, and which figure governs<\u002Ftd><\u002Ftr><tr><td><a class=\"xr\" href=\"#app-d\">Appendix D<\u002Fa><\u002Ftd><td>Source Hierarchy &amp; Evidence Conventions<\u002Ftd><td>How claims were graded<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>Recommended reading order for a first pass:<\u002Fstrong> <a class=\"xr\" href=\"#app-a\">Appendix A<\u002Fa> (glossary) → the conventions below → <a class=\"xr\" href=\"#part-vi\">Part VI<\u002Fa> (Synthesis) → <a class=\"xr\" href=\"#app-b\">Appendix B<\u002Fa> → then Parts II and V in full. Parts I, III and IV are reference-depth.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-conventions-governing-the-whole-document\" class=\"hd hd2 n0\"><span class=\"ht\">Conventions governing the whole document<\u002Fspan><\u002Fh2>\n<h3 id=\"s-evidence-classification\" class=\"hd hd3\">Evidence classification<\u002Fh3>\n<p>Every material claim carries one of six labels. No inference is silently promoted to fact.<\u002Fp>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Label<\u002Fth><th>Meaning<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fstrong><\u002Ftd><td>Directly supported by reliable primary evidence<\u002Ftd><\u002Ftr><tr><td><strong><span class=\"ev\">COMPANY CLAIM<\u002Fspan><\u002Fstrong><\u002Ftd><td>Stated by Experian, not independently verified<\u002Ftd><\u002Ftr><tr><td><strong><span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan><\u002Fstrong><\u002Ftd><td>Externally reported or estimated<\u002Ftd><\u002Ftr><tr><td><strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan><\u002Fstrong><\u002Ftd><td>Reasonably inferred from multiple known facts<\u002Ftd><\u002Ftr><tr><td><strong><span class=\"ev\">HYPOTHESIS<\u002Fspan><\u002Fstrong><\u002Ftd><td>Possible explanation requiring further evidence<\u002Ftd><\u002Ftr><tr><td><strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong><\u002Ftd><td>Available evidence is insufficient<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h3 id=\"s-the-governing-convention-statutory-versus-benchmark-read-this-before-any\" class=\"hd hd3\">The governing convention — statutory versus Benchmark. Read this before any figure.<\u002Fh3>\n<p>Experian reports under <strong>IFRS in US dollars<\u002Fstrong> with a <strong>31 March financial year end<\u002Fstrong>, and presents a parallel suite of non-GAAP <strong>Benchmark<\u002Fstrong> measures. The two sets are different numbers, and the market prices the Benchmark ones. Four rules apply throughout:<\u002Fp>\n<ol class=\"lst\"><li><strong>Never mix statutory and Benchmark measures in one comparison.<\u002Fstrong> FY26 statutory profit before tax was US$1,951m; Benchmark profit before tax was US$2,212m. Statutory basic EPS was 164.5 US cents; Benchmark EPS was 179.8. The gap is not noise — it is the subject of <a class=\"xr\" href=\"#part-iv\">Part IV<\u002Fa>'s forensic reconciliation.<\u002Fli><li><strong>Always state whether a growth rate is organic, constant-currency or actual-rate.<\u002Fstrong> FY26 ongoing revenue grew 8% organic, 11% at constant currency and 13% at actual rates. All three are true; they are not interchangeable.<\u002Fli><li><strong>Distinguish total revenue from ongoing-activities revenue.<\u002Fstrong> Statutory revenue was US$8,445m; ongoing revenue US$8,425m, after certain Latin America and EMEA/Asia Pacific B2B lines were re-presented as exited from FY26.<\u002Fli><li><strong>The financial year ends 31 March.<\u002Fstrong> FY26 is the year to 31 March 2026. Competitor comparisons against Equifax and TransUnion (December year ends) are therefore three months offset.<\u002Fli><\u002Fol>\n<h3 id=\"s-the-second-governing-convention-follow-the-data-right\" class=\"hd hd3\">The second governing convention — Follow-the-Data-Right<\u002Fh3>\n<p>This study applies a rule with no analogue in the three prior subjects. <strong>Experian does not own most of the data it holds.<\u002Fstrong> Wherever data is discussed, the study establishes who contributed it, under what statutory and contractual permission, who the controller is, and what the permission allows.<\u002Fp>\n<p>The consequence for every reader: <strong>revenue in this business is contingent on legal permissions persisting.<\u002Fstrong> A product lawful as a marketing audience may be unlawful as a credit decision. A data category present in the file today can be legislated out of it tomorrow — as medical debt demonstrates. Revenue quality here is partly a legal question, not only a commercial one.<\u002Fp>\n<h3 id=\"s-language\" class=\"hd hd3\">Language<\u002Fh3>\n<p>Regulatory acronyms are retained rather than translated, and defined in <a class=\"xr\" href=\"#app-a\">Appendix A<\u002Fa>. The study spans US, UK and Brazilian regimes that use different vocabulary for the same concepts; <a class=\"xr\" href=\"#app-a\">Appendix A<\u002Fa> maps them.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<div class=\"sep\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" data-part=\"1\">\n<header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part I<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">I<\u002Fspan><\u002Fdiv><h1 id=\"part-i\" class=\"part\" data-short=\"Part I — Corporate, Legal, Regulatory &amp; Institutional Anatomy\">Corporate, Legal, Regulatory &amp; Institutional Anatomy<\u002Fh1><p class=\"opener-s\">Who owns it, which entity holds which database under which permission, and how a data business is supervised across three incompatible jurisdictions.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">I<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Numbered sections<\u002Fdiv><div class=\"plate-v\">12<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Tables<\u002Fdiv><div class=\"plate-v\">4<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-volume-i-corporate-legal-regulatory-institutional-anatomy\"><span class=\"inpart-n\"><\u002Fspan><span>VOLUME I — Corporate, Legal, Regulatory &amp; Institutional Anatomy<\u002Fspan><\u002Fa><a href=\"#s-tl-dr\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR<\u002Fspan><\u002Fa><a href=\"#s-key-findings\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-i-1\"><span class=\"inpart-n\">I.1<\u002Fspan><span>Origin and Corporate History — Chronological Institutional Evolution<\u002Fspan><\u002Fa><a href=\"#s-i-2\"><span class=\"inpart-n\">I.2<\u002Fspan><span>Corporate Group Structure<\u002Fspan><\u002Fa><a href=\"#s-i-3\"><span class=\"inpart-n\">I.3<\u002Fspan><span>Ownership and Share Structure<\u002Fspan><\u002Fa><a href=\"#s-i-4\"><span class=\"inpart-n\">I.4<\u002Fspan><span>Governance Architecture<\u002Fspan><\u002Fa><a href=\"#s-i-5\"><span class=\"inpart-n\">I.5<\u002Fspan><span>Legal Architecture<\u002Fspan><\u002Fa><a href=\"#s-i-6\"><span class=\"inpart-n\">I.6<\u002Fspan><span>Regulatory and Data-Protection Architecture — PRIORITY DEPTH<\u002Fspan><\u002Fa><a href=\"#s-i-7\"><span class=\"inpart-n\">I.7<\u002Fspan><span>The Data-Rights Architecture — PRIORITY DEPTH (the institutional heart)<\u002Fspan><\u002Fa><a href=\"#s-i-8\"><span class=\"inpart-n\">I.8<\u002Fspan><span>Regulation as Barrier, Cost and Moat<\u002Fspan><\u002Fa><a href=\"#s-i-9\"><span class=\"inpart-n\">I.9<\u002Fspan><span>Institutional Dependency Map<\u002Fspan><\u002Fa><a href=\"#s-i-10\"><span class=\"inpart-n\">I.10<\u002Fspan><span>Tax and Intercompany Architecture<\u002Fspan><\u002Fa><a href=\"#s-i-11\"><span class=\"inpart-n\">I.11<\u002Fspan><span>Corporate, Regulatory and Legal Risk Register<\u002Fspan><\u002Fa><a href=\"#s-i-12\"><span class=\"inpart-n\">I.12<\u002Fspan><span>Volume I Reconstruction<\u002Fspan><\u002Fa><a href=\"#s-recommendations\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a href=\"#s-caveats\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader>\n<h2 id=\"s-volume-i-corporate-legal-regulatory-institutional-anatomy\" class=\"hd hd2 n0\"><span class=\"ht\">VOLUME I — Corporate, Legal, Regulatory &amp; Institutional Anatomy<\u002Fspan><\u002Fh2>\n<p><em>Prepared as of 9 August 2026. Reporting basis: IFRS, US dollars, 31 March financial year-end. Non-GAAP measures (Benchmark PBT/EBIT/EPS, organic revenue growth) are labelled wherever used and never mixed with statutory figures in the same comparison.<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-tl-dr\" class=\"hd hd2 n0\"><span class=\"ht\">TL;DR<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li>Experian plc is a <strong>Jersey-incorporated, Irish-tax-resident, Dublin-headquartered, London-listed<\u002Fstrong> information utility whose single most valuable and most misunderstood asset is not data it owns but the <strong>legally-sanctioned aggregation of data contributed for free by its own customers<\u002Fstrong> under reciprocity rules and statutory permission — a position that would take a new entrant a decade to replicate and, in the UK, is close to legally impossible to build from zero.<\u002Fli><li>The group is a <strong>listed information utility with no controlling shareholder<\u002Fstrong> (largest holder BlackRock ~5.9%); real control sits with a dispersed institutional register and the executive team, while the single most strategically decisive legal entity is <strong>Experian Information Solutions, Inc.<\u002Fstrong> (an Ohio corporation), the US FCRA bureau that generates the majority of group profit.<\u002Fli><li>Regulation is simultaneously Experian's <strong>deepest moat and its largest tail risk<\u002Fstrong>: the FCRA/CFPB, UK GDPR/ICO/FCA and Brazilian LGPD/Cadastro Positivo/Banco Central regimes are mutually incompatible, and the live <strong>CFPB \"sham investigations\" lawsuit (7 January 2025)<\u002Fstrong>, the 2015 breach settlements and the multi-year ICO litigation demonstrate that the enforcement surface is structural rather than incidental.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-key-findings\" class=\"hd hd2 n0\"><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>The three-way corporate split is confirmed by primary sources.<\u002Fstrong> The FY26 results announcement (20 May 2026) states verbatim that Experian plc \"is incorporated and registered in Jersey as a public company limited by shares and is resident in Ireland. The Company's registered office is at 22 Grenville Street, St Helier, Jersey, JE4 8PX, Channel Islands.\" Corporate headquarters are in Dublin (2 Cumberland Place, Fenian Street, D02 HY05); operational hubs are Nottingham (The Sir John Peace Building, NG80 1ZZ), Costa Mesa (California) and São Paulo. <strong>The user's summary was correct<\u002Fstrong> — with one nuance: the <em>registered office<\u002Fem> is in Jersey, while Dublin is the <em>corporate HQ<\u002Fem> and tax residence.<\u002Fli><li><strong>The finance entity is the ghost of GUS.<\u002Fstrong> Experian Finance plc (UK company 00146575, incorporated 17 March 1917) is the same legal person that was \"The Great Universal Stores PLC\" (1917–2001) and then \"GUS plc\" (2001–2006) — the retailer parent, repurposed after the 2006 demerger as the group's principal bond-issuing vehicle. This is a striking path-dependency: the retailer did not spin its credit department out into a fresh shell; the credit department kept the retailer's 108-year-old corporate shell as its treasury.<\u002Fli><li><strong>Scale (FY26, year to 31 March 2026, primary source Experian FY26 announcement).<\u002Fstrong> Statutory revenue US$8,445m (up 12%); Benchmark EBIT from ongoing activities US$2,407m at a 28.6% margin (up 50bps at actual rates); Benchmark EPS 179.8 US cents (up 15% at actual rates); statutory profit before tax US$1,951m (up 26% from US$1,549m in FY25); Benchmark tax rate 25.5%; post-tax ROCE 17.2%; net debt/Benchmark EBITDA 1.7x. North America delivered ~two-thirds of group revenue; Consumer Services now serves \"over 215 million free members globally.\"<\u002Fli><li><strong>The data-rights architecture is the institutional heart.<\u002Fstrong> Experian largely does <em>not<\u002Fem> own the raw data. It holds it under statutory permission (FCRA in the US; \"protection of credit\" under LGPD <span class=\"nb\">Article 7(X)<\u002Fspan> and the Cadastro Positivo law in Brazil) and under contractual reciprocity (the SCOR Principles of Reciprocity in the UK). What Experian owns outright is the <em>aggregation<\u002Fem>, the <em>derived attributes and bureau scores<\u002Fem>, the <em>models<\u002Fem> and the <em>identity-matching graph<\u002Fem>.<\u002Fli><li><strong>The enforcement record is extensive and continuing<\u002Fstrong> (see enforcement table in <a class=\"xr\" href=\"#s-i-6\">I.6<\u002Fa>), spanning a 2017 CFPB consent order (US$3m), the 2015 T-Mobile breach settlements (~US$16m across the coalition), the ICO litigation (2020–2024, largely won by Experian), the abandoned ClearScore merger (CMA, 2018–19) and the live CFPB dispute-handling lawsuit (2025).<\u002Fli><\u002Fol>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-details\" class=\"hd hd2 n0\"><span class=\"ht\">Details<\u002Fspan><\u002Fh2>\n<h2 id=\"s-i-1\" class=\"hd hd2\"><span class=\"hn mono\">I.1<\u002Fspan><span class=\"ht\">Origin and Corporate History — Chronological Institutional Evolution<\u002Fspan><\u002Fh2>\n<p>Experian's institutional lineage is a fusion of two utterly different corporate cultures: a British mail-order retailer's in-house credit-checking department (CCN) and an American aerospace conglomerate's data division (TRW). The path dependencies created in 1996 and 2006 still define the group.<\u002Fp>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Date<\u002Fth><th>Event<\u002Fth><th>Structural / capability consequence<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>1826 onward<\u002Ftd><td>London/Manchester merchants exchange credit information (the Manchester Guardian Society lineage often cited)<\u002Ftd><td>Deep cultural root of reciprocal data-sharing in the UK<\u002Ftd><\u002Ftr><tr><td>1964<\u002Ftd><td>Credit Data Corporation founded (Detroit)<\u002Ftd><td>US consumer-bureau lineage begins<\u002Ftd><\u002Ftr><tr><td>1968<\u002Ftd><td>TRW Inc. acquires Credit Data Corp → TRW Information Systems &amp; Services<\u002Ftd><td>US national scale under an aerospace/electronics parent<\u002Ftd><\u002Ftr><tr><td>1980<\u002Ftd><td>Great Universal Stores (GUS) launches <strong>CCN Systems<\u002Fstrong> in Nottingham (John Peace)<\u002Ftd><td>UK credit-checking arm of a mail-order retailer — the true corporate root of today's plc<\u002Ftd><\u002Ftr><tr><td>Sep–Nov 1996<\u002Ftd><td>TRW IS&amp;S spun out (backed by <strong>Bain Capital<\u002Fstrong> and <strong>Thomas H. Lee<\u002Fstrong>); renamed <strong>Experian<\u002Fstrong>; within weeks GUS buys it for ~US$1.7bn and merges it with CCN<\u002Ftd><td>Transatlantic bureau created; \"Experian\" brand adopted; dual HQ Nottingham/Orange County. The PE backers reportedly tripled their money within weeks<\u002Ftd><\u002Ftr><tr><td>10 Oct 2006<\u002Ftd><td>Demerger from GUS; LSE listing (initial price ~£5.60); Home Retail Group separated in parallel<\u002Ftd><td>Independent FTSE 100 company. <strong>The old GUS plc shell becomes Experian Finance plc<\u002Fstrong>; Don Robert CEO, John Peace Chair<\u002Ftd><\u002Ftr><tr><td>Jun 2007<\u002Ftd><td>Acquires initial 65% of <strong>Serasa<\u002Fstrong> (Brazil) for R$2.32bn (~US$1.2bn) from a consortium of banks (Bradesco, Itaú, Unibanco, ABN Amro, Santander, HSBC); to 70% by Oct 2007<\u002Ftd><td>Entry into the dominant Brazilian bureau; put/call options over the minority created<\u002Ftd><\u002Ftr><tr><td>2008<\u002Ftd><td>Listed parent renamed from \"Experian Group Limited\" to \"Experian plc\"<\u002Ftd><td>Naming trap: a UK subsidiary is <em>also<\u002Fem> called Experian Group Limited<\u002Ftd><\u002Ftr><tr><td>Oct–Nov 2012<\u002Ftd><td>Acquires further 29.6% of Serasa for R$3.1bn (~US$1.5bn) → <strong>99.6%<\u002Fstrong>; cumulative spend R$5.6bn (~8.5x EBITDA). BIU (Itaú/Bradesco) classified as related party under the Listing Rules<\u002Ftd><td>Serasa becomes near-wholly-owned; negative-data agreements extended and positive-data commitments secured for when Cadastro Positivo became operational<\u002Ftd><\u002Ftr><tr><td>Sept 2015<\u002Ftd><td><strong>T-Mobile/Experian breach<\u002Fstrong> (~15 million consumers) disclosed<\u002Ftd><td>Largest breach event; multi-state AG and class litigation<\u002Ftd><\u002Ftr><tr><td>Mar 2018–Feb 2019<\u002Ftd><td>Attempted acquisition of <strong>ClearScore<\u002Fstrong> (legal target: Credit Laser Holdings Ltd) for ~£275m; CMA Phase 2; parties abandon; <strong>CMA cancels the reference 27 Feb 2019<\u002Fstrong><\u002Ftd><td>Competition authority signals it will protect free credit-checking competition (see <a class=\"xr\" href=\"#s-i-8\">I.8<\u002Fa>)<\u002Ftd><\u002Ftr><tr><td>Nov 2020<\u002Ftd><td>Acquires <strong>Tapad<\u002Fstrong> (US digital identity) for ~US$280m from Telenor<\u002Ftd><td>Cross-device digital identity graph<\u002Ftd><\u002Ftr><tr><td>Oct 2020 → Apr 2024<\u002Ftd><td>ICO enforcement notice → FTT → Upper Tribunal (see <a class=\"xr\" href=\"#s-i-6\">I.6<\u002Fa>)<\u002Ftd><td>Data-broking legal-basis fight, ultimately won by Experian<\u002Ftd><\u002Ftr><tr><td>2024<\u002Ftd><td>Acquires <strong>illion<\u002Fstrong> (Australia/NZ, ~A$820m), <strong>NeuroID<\u002Fstrong> (behavioural fraud, Aug 2024), <strong>Audigent<\u002Fstrong> (ad identity, Dec 2024)<\u002Ftd><td>APAC bureau scale; fraud/identity build-out<\u002Ftd><\u002Ftr><tr><td>7 Jan 2025<\u002Ftd><td><strong>CFPB sues Experian<\u002Fstrong> (\"sham investigations\") in C.D. Cal.<\u002Ftd><td>Live FCRA/CFPA litigation<\u002Ftd><\u002Ftr><tr><td>1 Apr 2025<\u002Ftd><td>Completes <strong>ClearSale<\u002Fstrong> (Brazil transactional fraud) for up to R$1,905m (~US$350m)<\u002Ftd><td>Extends ID&amp;F suite in Brazil<\u002Ftd><\u002Ftr><tr><td>Oct 2025<\u002Ftd><td>Acquires <strong>KYC360/KYC Global Technologies<\u002Fstrong> (UK/Ireland RegTech), <strong>AtData<\u002Fstrong> (email identity, 10bn+ addresses), <strong>Own Up<\u002Fstrong> (US mortgage marketplace)<\u002Ftd><td>Compliance, identity and consumer-marketplace expansion<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>Divestitures / transitions:<\u002Fstrong> From FY26 the group re-presented certain Latin America and EMEA/Asia-Pacific B2B lines as \"exited business activities,\" and largely completed its cloud migration in North America and Brazil (ex-Health). Note that \"Compuscan\" (a South African bureau acquired 2019) and \"Tapad\" were both genuine Experian acquisitions; there is no evidence any of ClearSale, NeuroID, Compuscan or Tapad were subsequently divested — they were retained and integrated.<\u002Fp>\n<h2 id=\"s-i-2\" class=\"hd hd2\"><span class=\"hn mono\">I.2<\u002Fspan><span class=\"ht\">Corporate Group Structure<\u002Fspan><\u002Fh2>\n<p><strong>Verified entity chain (primary registry data, corroborated via UK Companies House and the group's debt disclosures):<\u002Fstrong><\u002Fp>\n<figure class=\"fig\" id=\"figure-4\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 04<\u002Fspan><span class=\"fig-t\">Corporate and Legal Structure<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"text-align:center\"><div style=\"display:inline-block;min-width:420px\"><div class=\"f-box solid\"><div class=\"f-name\">EXPERIAN plc<\u002Fdiv><div class=\"f-meta\">Incorporated Jersey · tax resident Ireland · corporate HQ Dublin · LSE-listed<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"hats\" style=\"justify-content:center\"><span class=\"hat\">JERSEY — INCORPORATION<\u002Fspan><span class=\"hat\">IRELAND — TAX RESIDENCE<\u002Fspan><span class=\"hat\">DUBLIN — HQ<\u002Fspan><\u002Fdiv>\n<svg viewBox=\"0 0 1000 24\" width=\"100%\" height=\"32\" preserveAspectRatio=\"none\" style=\"display:block;margin-top:14px\" aria-hidden=\"true\">\n<line x1=\"500\" y1=\"0\" x2=\"500\" y2=\"9\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"62\" y1=\"9\" x2=\"938\" y2=\"9\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"62\" y1=\"9\" x2=\"62\" y2=\"24\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"312\" y1=\"9\" x2=\"312\" y2=\"24\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"562\" y1=\"9\" x2=\"562\" y2=\"24\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"812\" y1=\"9\" x2=\"812\" y2=\"24\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"938\" y1=\"9\" x2=\"938\" y2=\"24\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<\u002Fsvg>\n<div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\">\n<div class=\"f-box\"><div class=\"f-name\">Experian Information Solutions, Inc.<\u002Fdiv><div class=\"f-meta\"><span class=\"acc\">Ohio, US<\u002Fspan> · the FCRA consumer-reporting agency · principal profit centre<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box\"><div class=\"f-name\">Experian Limited<\u002Fdiv><div class=\"f-meta\"><span class=\"acc\">United Kingdom<\u002Fspan> · FCA-authorised · operates CAIS<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box\"><div class=\"f-name\">ConsumerInfo.com, Inc.<\u002Fdiv><div class=\"f-meta\"><span class=\"acc\">United States<\u002Fspan> · the direct-to-consumer business<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box\"><div class=\"f-name\">Experian Marketing Solutions, LLC<\u002Fdiv><div class=\"f-meta\"><span class=\"acc\">United States<\u002Fspan> · marketing data and audiences<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box\"><div class=\"f-name\">Experian Health, Inc.<\u002Fdiv><div class=\"f-meta\"><span class=\"acc\">United States<\u002Fspan> · healthcare revenue-cycle management<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box\"><div class=\"f-name\">Serasa S.A.<\u002Fdiv><div class=\"f-meta\"><span class=\"acc\">Brazil<\u002Fspan> · ~99.6% held · the dominant Brazilian bureau<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box\"><div class=\"f-name\">illion<\u002Fdiv><div class=\"f-meta\"><span class=\"acc\">Australia / New Zealand<\u002Fspan> · acquired 2024<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box sig\"><div class=\"f-name\">Experian Finance plc<\u002Fdiv><div class=\"f-meta\"><span class=\"acc\">England &amp; Wales<\u002Fspan> · company <span class=\"nb\">00146575<\u002Fspan>, incorporated 1917 — the former Great Universal Stores shell, now the bond-issuing vehicle<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\">The group's treasury company is the 108-year-old corporate shell of the retailer that once owned it.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Entity tree with jurisdiction tags; material entities only. Registered office, tax residence and corporate headquarters sit in three different jurisdictions — a structure that predates the 2006 demerger in part and was chosen deliberately in part.<\u002Ffigcaption>\n<\u002Ffigure>\n<ul class=\"lst\"><li><strong>Experian plc<\u002Fstrong> — listed parent (LSE: EXPN). Jersey company; registered office 22 Grenville Street, St Helier, JE4 8PX; tax-resident Ireland; corporate HQ Dublin. <strong>Ultimate guarantor of all group debt.<\u002Fstrong><\u002Fli><li><strong>Experian Finance plc<\u002Fstrong> — UK company <strong>00146575<\u002Fstrong> (incorporated 17 Mar 1917; formerly The Great Universal Stores PLC → GUS plc). Group financing / debt-issuing entity; principal issuer under the US$6bn EMTN programme.<\u002Fli><li><strong>Experian Group Limited<\u002Fstrong> — UK company <strong>03720393<\u002Fstrong> (inc. 1999). UK holding company. <em>Distinct<\u002Fem> from the pre-2008 name of the listed parent — a genuine trap for outsiders.<\u002Fli><li><strong>Experian Holdings Limited<\u002Fstrong> — UK company <strong>03478895<\u002Fstrong> (inc. 1997). UK holding company (its officers are registered at the Dublin corporate HQ address).<\u002Fli><li><strong>Experian (UK) Finance Limited<\u002Fstrong> — UK company <strong>07553817<\u002Fstrong>. Intra-group finance entity that distributes part of the plc dividend via Income Access Share arrangements.<\u002Fli><li><strong>Experian Limited<\u002Fstrong> — UK operating company <strong>00653331<\u002Fstrong> (inc. 22 Mar 1960); Nottingham; <strong>FCA-authorised<\u002Fstrong>; operates the UK CAIS bureau and consumer brands (CreditExpert, CreditMatcher).<\u002Fli><li><strong>Experian Holdings, Inc.<\u002Fstrong> — US intermediate holding company (state of incorporation <strong>likely Delaware — UNVERIFIED<\u002Fstrong>). Named alongside the operating entities in the 2017 CFPB consent order.<\u002Fli><li><strong>Experian Information Solutions, Inc.<\u002Fstrong> — <strong>Ohio corporation<\u002Fstrong> (inc. 25 Sep 1996), the FCRA credit-reporting bureau; principal operations Allen, Texas and Costa Mesa, California; descended from TRW. <strong>The single most strategically important operating entity<\u002Fstrong> and the named defendant in the 2025 CFPB suit.<\u002Fli><li><strong>Experian Services Corp.<\u002Fstrong> — Delaware corporation (shared services; LEI 635400L5ZONXBLQZQM08).<\u002Fli><li><strong>ConsumerInfo.com, Inc.<\u002Fstrong> (dba <strong>Experian Consumer Services<\u002Fstrong>) — California company (domicile high-probability, <strong>not SoS-confirmed<\u002Fstrong>); the direct-to-consumer membership / Experian.com / Experian Boost business; Costa Mesa. Acquired by Experian in 2002.<\u002Fli><li><strong>Experian Marketing Solutions, LLC<\u002Fstrong> — Delaware LLC; marketing-data / identity business (the entity behind the ICO matter's US-facing analogue; the ICO case itself concerned the UK arm within Experian Limited).<\u002Fli><li><strong>Experian Health, Inc.<\u002Fstrong> — US healthcare payments/eligibility business (state of incorporation <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong>; Tennessee or Delaware plausible given the Passport Health/MedeAnalytics heritage).<\u002Fli><li><strong>Experian Europe DAC<\u002Fstrong> (Ireland) and <strong>Experian Finance US, Inc.<\u002Fstrong> — additional EMTN issuers.<\u002Fli><li><strong>Serasa S.A.<\u002Fstrong> (\"Serasa Experian\") — Brazilian <em>sociedade anônima<\u002Fem>; ~<strong>99.6%<\u002Fstrong> Experian-owned (last publicly verified figure, 2012); São Carlos / São Paulo; <strong>Banco Central-accredited<\u002Fstrong> Cadastro Positivo database manager (GBD) since 11 Oct 2019. CNPJ <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fli><\u002Ful>\n<p><strong>Why each material entity exists (causal taxonomy):<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li><em>Regulation:<\u002Fem> Experian Information Solutions Inc. must be a US person to be an FCRA consumer reporting agency; Experian Limited must be FCA-authorised; Serasa must be a Banco Central-accredited GBD.<\u002Fli><li><em>Tax / financing:<\u002Fem> Experian Finance plc, Experian Europe DAC, Experian Finance US Inc. and Experian (UK) Finance Limited exist to issue/route debt and dividends efficiently across the Jersey/Ireland/UK/US perimeter.<\u002Fli><li><em>Historical acquisition path:<\u002Fem> Serasa S.A. persists as an intact Brazilian entity; the GUS shell survives as Experian Finance plc.<\u002Fli><li><em>Liability ring-fencing:<\u002Fem> separating the FCRA bureau (Experian Information Solutions) from the D2C consumer entity (ConsumerInfo.com), from marketing (Experian Marketing Solutions) and from Health isolates distinct litigation and regulatory exposures.<\u002Fli><\u002Ful>\n<h2 id=\"s-i-3\" class=\"hd hd2\"><span class=\"hn mono\">I.3<\u002Fspan><span class=\"ht\">Ownership and Share Structure<\u002Fspan><\u002Fh2>\n<p>Experian is a FTSE 100 constituent (ticker EXPN) with <strong>ordinary shares on a one-share-one-vote basis, no dual-class or golden shares, and no controlling shareholder.<\u002Fstrong> As most recently disclosed, the largest holders are global asset managers: <strong>BlackRock ~5.9%<\u002Fstrong>, with <strong>The Vanguard Group<\u002Fstrong> and <strong>Massachusetts Financial Services<\u002Fstrong> roughly level at ~5.1% each; Norges Bank Investment Management and Capital Group are also significant. The top ~25 shareholders together hold less than half the register, indicating a long tail of smaller holders. There is an OTC ADR/depositary programme (EXPGY/EXPGF). The group runs continuous buybacks (<strong>US$725m executed in FY26<\u002Fstrong>, plus a new <strong>US$1bn programme announced May 2026 valid to 30 June 2027<\u002Fstrong>) alongside a progressive dividend (FY26 total <strong>69.25 US cents<\u002Fstrong>, +11%).<\u002Fp>\n<p><strong>Economic and voting ownership do not diverge.<\u002Fstrong> Control is contestable in principle: management can be removed by ordinary shareholder resolution, and there is no defensive bloc or family stake. In practice, control rests with the executive team, legitimised by a dispersed long-only institutional base that has historically backed the \"Experian Way\" strategy; there has been no public activist campaign. This is a materially different control structure from EREF Subjects II and III (Atruvia and DZ BANK), which are captive/cooperatively-owned — Experian is genuinely widely-held.<\u002Fp>\n<h2 id=\"s-i-4\" class=\"hd hd2\"><span class=\"hn mono\">I.4<\u002Fspan><span class=\"ht\">Governance Architecture<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Chair:<\u002Fstrong> Mike Rogers (independent NED from 1 July 2017; Chair from 24 July 2019). He has confirmed retirement at the AGM on <strong>22 July 2026<\u002Fstrong> after nine years. <strong>Adam Crozier<\u002Fstrong> was named as incoming Chair (announced April 2026); the succession was led by Senior Independent Director <strong>Alison Brittain<\u002Fstrong>.<\u002Fli><li><strong>CEO:<\u002Fstrong> Brian Cassin. <strong>CFO:<\u002Fstrong> Lloyd Pitchford. Both remained in post through 2026.<\u002Fli><li><strong>Committees:<\u002Fstrong> Audit; Remuneration (<strong>Kathleen DeRose<\u002Fstrong> appointed chair from the July 2025 AGM); Nomination and Corporate Governance (chaired by the Chair).<\u002Fli><li><strong>Analytically significant governance gap:<\u002Fstrong> there is <strong>no dedicated board-level data-ethics/privacy committee.<\u002Fstrong> For an enterprise whose entire franchise is the lawful processing of personal data across incompatible regimes, the absence of a standalone data/privacy board committee — with data-use decisions instead handled through management and the audit/risk apparatus — is a notable structural feature and, in this analyst's assessment, a governance weakness relative to the risk profile.<\u002Fli><li>The <strong>UK Corporate Governance Code<\u002Fstrong> applies despite Jersey incorporation. Executive pay is performance-linked to Benchmark EPS, organic revenue growth, ROCE and relative TSR.<\u002Fli><li><strong>Decision-rights map:<\u002Fstrong> capital allocation and M&amp;A → Board on management recommendation; data-use policy and permissible-use changes → management-led with board/risk oversight (no dedicated committee); new-jurisdiction entry → management/regional presidents with board sign-off on material commitments; pricing → business-line management; regulatory-enforcement response → CEO/CFO/General Counsel plus the relevant regional president and legal entity.<\u002Fli><\u002Ful>\n<h2 id=\"s-i-5\" class=\"hd hd2\"><span class=\"hn mono\">I.5<\u002Fspan><span class=\"ht\">Legal Architecture<\u002Fspan><\u002Fh2>\n<p><strong>Data furnisher agreements.<\u002Fstrong> In the <strong>UK<\u002Fstrong>, lenders furnish account and performance data into closed user groups (Experian's <strong>CAIS<\u002Fstrong> database) under the <strong>Principles of Reciprocity<\u002Fstrong> administered by SCOR; access is conditioned on contribution — \"you only get out what you put in.\" Over 350 million records relating to ~400 institutions are shared industry-wide. In the <strong>US<\u002Fstrong>, furnishing is voluntary but governed by FCRA <span class=\"nb\">§623<\u002Fspan> furnisher-accuracy duties and the CDIA <strong>Metro 2<\u002Fstrong> reporting format; network effects produce near-universal participation. In <strong>Brazil<\u002Fstrong>, furnishing of <em>negative<\u002Fem> data is governed by the Consumer Defence Code, and of <em>positive<\u002Fem> data by the Cadastro Positivo law (<span class=\"nb\">LC 166/2019<\u002Fspan>), under which furnishers have a <strong>statutory duty<\u002Fstrong> to transmit data to accredited GBDs. The precise commercial terms of individual furnisher contracts are private and <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp>\n<p><strong>Scoring IP — FICO and VantageScore.<\u002Fstrong> Experian distributes <strong>FICO<\u002Fstrong> scores licensed from Fair Isaac <em>and<\u002Fem> co-owns <strong>VantageScore Solutions, LLC<\u002Fstrong> (formed 2006) equally with Equifax and TransUnion — a cooperative venture between three direct competitors to challenge FICO's incumbency. After the <strong>FHFA authorised VantageScore 4.0 for Fannie Mae/Freddie Mac conforming mortgages on 8 July 2025<\u002Fstrong> (FHFA projected \"Up to Five Million Prospective New Buyers to Qualify\"), FICO's VP/GM of B2B scores Julie May attacked the arrangement, stating \"there can be zero meaningful competition in the conforming mortgage market until the credit bureaus divest their ownership in VantageScore,\" and FICO characterised the bureau-owned venture as \"a de facto monopoly.\" This is a live competition-law flashpoint embedded in Experian's own IP portfolio.<\u002Fp>\n<p><strong>Litigation is structural, not incidental.<\u002Fstrong> As a CRA, Experian Information Solutions, Inc. is a routine FCRA defendant in individual and class actions over accuracy, tradeline reinsertion, mixed files and dispute handling. The headline current matter is the <strong>CFPB \"sham investigations\" suit<\u002Fstrong> (see <a class=\"xr\" href=\"#s-i-6\">I.6<\u002Fa>).<\u002Fp>\n<p><strong>Legal-responsibility mapping (Follow-the-Legal-Entity):<\u002Fstrong> FCRA bureau liability → Experian Information Solutions, Inc. (Ohio); UK data-protection and FCA liability → Experian Limited (Nottingham); Brazilian LGPD/Cadastro Positivo liability → Serasa S.A.; D2C consumer liability → ConsumerInfo.com, Inc.; group debt liability → issued by Experian Finance plc and guaranteed by Experian plc.<\u002Fp>\n<h2 id=\"s-i-6\" class=\"hd hd2\"><span class=\"hn mono\">I.6<\u002Fspan><span class=\"ht\">Regulatory and Data-Protection Architecture — PRIORITY DEPTH<\u002Fspan><\u002Fh2>\n<p><strong>United States.<\u002Fstrong> The <strong>Fair Credit Reporting Act (FCRA, <span class=\"nb\">15 U.S.C. <span class=\"nb\">§1681<\u002Fspan>)<\u002Fspan><\u002Fstrong> is foundational: permissible purpose, accuracy and reinvestigation duties (<span class=\"nb\">§611<\u002Fspan>), furnisher duties (<span class=\"nb\">§623<\u002Fspan>), adverse-action notices, consumer file access and security freezes. Since the <strong>CFPB larger-participant rule (issued 16 July 2012, effective 30 September 2012)<\u002Fstrong>, the big-three bureaux are federally supervised; the CFPB may seek restitution, disgorgement and civil penalties (historically up to ~US$1m/day for knowing violations). The <strong>FTC<\u002Fstrong> retains authority; <strong>state AGs<\u002Fstrong> and state statutes (California <strong>CCPA/CPRA<\u002Fstrong> and comparable laws) add a fragmenting overlay, together with state credit-freeze and (state-level) medical-debt rules. The <strong>Gramm-Leach-Bliley Act<\u002Fstrong> governs safeguarding.<\u002Fp>\n<figure class=\"fig\" id=\"figure-7\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 07<\u002Fspan><span class=\"fig-t\">The Multi-Jurisdiction Permission Map<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n<div class=\"pnl\"><div class=\"pnl-k\">United States<\u002Fdiv>\n<div class=\"peri-i\"><span class=\"chip on\">FCRA permissible purpose<\u002Fspan><\u002Fdiv>\n<div class=\"peri-i\"><span class=\"chip\">CFPB larger-participant supervision<\u002Fspan><span class=\"chip\">FTC<\u002Fspan><span class=\"chip\">State AGs<\u002Fspan><\u002Fdiv>\n<div class=\"peri-i\"><span class=\"chip lt\">CCPA / CPRA<\u002Fspan><span class=\"chip lt\">GLBA<\u002Fspan><\u002Fdiv>\n<div class=\"f-meta\">Permission is <strong>purpose-based<\u002Fstrong>: the lawful basis attaches to the use, not to consent. A pull without a permissible purpose is itself the violation.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"pnl\"><div class=\"pnl-k\">United Kingdom<\u002Fdiv>\n<div class=\"peri-i\"><span class=\"chip on\">UK GDPR legitimate interests — <span class=\"nb\">Art. 6(1)(f)<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"peri-i\"><span class=\"chip\">CRAIN transparency<\u002Fspan><span class=\"chip\">ICO<\u002Fspan><span class=\"chip\">FCA<\u002Fspan><\u002Fdiv>\n<div class=\"peri-i\"><span class=\"chip lt\">SCOR → CRGB reciprocity<\u002Fspan><\u002Fdiv>\n<div class=\"f-meta\">Permission is <strong>balancing-test based<\u002Fstrong> and contractually policed by the industry's own reciprocity rules — the basis a regulator can and did challenge.<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"pnl\"><div class=\"pnl-k\">Brazil<\u002Fdiv>\n<div class=\"peri-i\"><span class=\"chip on\">LGPD <span class=\"nb\">Article 7(X)<\u002Fspan> — \"protection of credit\"<\u002Fspan><\u002Fdiv>\n<div class=\"peri-i\"><span class=\"chip\">Cadastro Positivo — <span class=\"nb\">LC 166/2019<\u002Fspan><\u002Fspan><span class=\"chip\">Banco Central accreditation<\u002Fspan><span class=\"chip\">ANPD<\u002Fspan><\u002Fdiv>\n<div class=\"f-meta\">Permission is <strong>statutory and affirmative<\u002Fstrong>: positive data flows by operation of law, with opt-out rather than opt-in.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\">The same data is held on three incompatible legal bases. A product lawful in one regime may be unlawful in another.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Three-column matrix of legal bases and supervisors. The incompatibility is not a compliance inconvenience: it constrains which products can be built once and sold globally, and it is the reason group-level product architecture is jurisdiction-first.<\u002Ffigcaption>\n<\u002Ffigure>\n<p><em>Enforcement trajectory has sharply reversed under the current federal administration.<\u002Fem> In 2025 the CFPB <strong>dismissed six credit-reporting enforcement actions<\u002Fstrong> initiated 2021–2024, withdrew the interpretive rulemaking that would have classified data brokers as CRAs, and <strong>joined industry in vacating the medical-debt rule<\u002Fstrong> (the US District Court for the Eastern District of Texas vacated it on <strong>11 July 2025<\u002Fstrong> in <em>Cornerstone Credit Union League v. CFPB<\u002Fem>, finding it exceeded the Bureau's authority and that the FCRA
