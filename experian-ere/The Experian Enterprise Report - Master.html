 expressly permits use of coded medical-debt information — and that FCRA generally preempts contrary state laws). Crucially for Experian, however, the <strong>\"sham investigations\" lawsuit remained on foot<\u002Fstrong>: filed <strong>7 January 2025<\u002Fstrong> in the Central District of California against Experian Information Solutions, Inc., with then-Director Rohit Chopra stating, \"When consumers disputed errors on their credit reports, Experian conducted sham investigations rather than properly reviewing the disputes as required by federal law.\" Experian called the suit \"completely without merit.\" The tension is analytically important: rising consumer complaint volumes (the CFPB reported credit-reporting complaint submissions climbing from ~70,000 to over 460,000 per month between January 2023 and October 2025) coincide with a deregulatory enforcement posture — meaning the <em>class-action<\u002Fem> channel, not the regulator, is now the principal FCRA enforcement mechanism.<\u002Fp>\n<p><strong>United Kingdom.<\u002Fstrong> <strong>UK GDPR + the Data Protection Act 2018<\u002Fstrong>, enforced by the <strong>ICO<\u002Fstrong>; the <strong>FCA<\u002Fstrong> authorises CRAs. The ICO issued an <strong>enforcement notice against Experian Limited on 27 October 2020<\u002Fstrong> over Experian Marketing Services' processing of the data of \"approximately 51 million UK adults\" for direct marketing without adequate transparency/consent (Commissioner Elizabeth Denham: \"Our investigation uncovered data protection failings that likely affected millions of adults in the UK\"). Experian appealed. The <strong>First-tier Tribunal (20 February 2023) substantially overturned<\u002Fstrong> the notice, replacing it with a far narrower \"Substitute Enforcement Notice,\" holding that legitimate interests could lawfully ground less-intrusive marketing and that Experian's CRAIN transparency notice was largely adequate — while agreeing Experian had unlawfully failed to notify ~5.3 million individuals whose public-source data it processed. The <strong>Upper Tribunal dismissed the ICO's appeal on 23 April 2024<\u002Fstrong>, and the ICO <strong>declined to appeal further (May 2024)<\u002Fstrong>. Net outcome: <strong>Experian won decisively.<\u002Fstrong> This is a landmark data-broking precedent and a rare, complete regulatory defeat for the ICO.<\u002Fp>\n<p>Separately, the <strong>FCA Credit Information Market Study (CIMS)<\u002Fstrong>: launched 2019 (following the Woolard Review), paused for COVID, interim report November 2022, <strong>final report 3 December 2023 (MS19/1)<\u002Fstrong>. The FCA found the existing self-governance body, <strong>SCOR (the Steering Committee on Reciprocity), \"too narrow\" and \"not fit for purpose\"<\u002Fstrong> and proposed replacing it with a broader, more accountable <strong>Credit Reporting Governance Body (CRGB)<\u002Fstrong>, supported by mandatory reporting requirements and a new common data format. An Interim Working Group was convened; the CRGB has since been incorporated; and the FCA published implementation consultation <strong>CP26/7 in February 2026<\u002Fstrong>. This is the single most consequential <em>structural<\u002Fem> regulatory intervention for Experian's UK moat (see <a class=\"xr\" href=\"#s-i-8\">I.8<\u002Fa>).<\u002Fp>\n<p><strong>Brazil.<\u002Fstrong> Serasa operates under the <strong>LGPD<\u002Fstrong> — with credit processing grounded in <strong><span class=\"nb\">Article 7(X)<\u002Fspan>, \"protection of credit\"<\u002Fstrong> — the <strong>Consumer Defence Code (Lei 8.078/90)<\u002Fstrong> for negative data, and the <strong>Cadastro Positivo law (Lei 12.414/2011, amended by <span class=\"nb\">LC 166/2019<\u002Fspan>)<\u002Fstrong>, which converted the positive registry from opt-in to automatic (opt-out) inclusion. Serasa estimated the positive registry could benefit ~137 million Brazilians (88.5% of adults). Serasa was <strong>accredited by Banco Central do Brasil on 11 October 2019<\u002Fstrong> as a positive-registry database manager (GBD); the <strong>ANPD<\u002Fstrong> is the data-protection authority; Banco Central supervises the positive-registry infrastructure.<\u002Fp>\n<p><strong>EU and other markets.<\u002Fstrong> GDPR governs EMEA bureaux; APAC now includes illion (Australia/NZ). Experian has been rationalising smaller B2B operations in Latin America and EMEA/APAC (re-presented as exited activities in FY25–26).<\u002Fp>\n<p><strong>Cross-cutting.<\u002Fstrong> AML/KYC identity-verification services (reinforced by the KYC360 acquisition) bring Experian into financial-crime regulation as a service provider; the decisioning/analytics businesses generally do not require separate licensing beyond the underlying data permissions.<\u002Fp>\n<p><strong>Enforcement &amp; litigation table:<\u002Fstrong><\u002Fp>\n<div class=\"tw wide\"><table class=\"tbl\"><thead><tr><th>Date<\u002Fth><th>Regulator/forum<\u002Fth><th>Allegation<\u002Fth><th>Outcome / penalty<\u002Fth><th>Operating consequence<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Mar 2017<\u002Ftd><td>CFPB<\u002Ftd><td>Deceptive marketing of \"educational\" credit scores; ads shown before free-report disclosure (FCRA)<\u002Ftd><td>Consent order; <strong>US$3m<\u002Fstrong> civil penalty; prescribed disclosures<\u002Ftd><td>Changed D2C score-marketing practices<\u002Ftd><\u002Ftr><tr><td>Sept 2015 → Nov 2022<\u002Ftd><td>40-state AG coalition<\u002Ftd><td>2015 breach of ~15m T-Mobile applicants (Sept 2013–Sept 2015)<\u002Ftd><td><strong>US$12.67m<\u002Fstrong> (Experian) + US$2.43m (T-Mobile); combined &gt;US$16m; 5 years' credit monitoring; security undertakings<\u002Ftd><td>Data-security remediation; vendor oversight<\u002Ftd><\u002Ftr><tr><td>2019<\u002Ftd><td>US class action (C.D. Cal.)<\u002Ftd><td>Same 2015 breach<\u002Ftd><td>Settlement incl. extended monitoring<\u002Ftd><td>—<\u002Ftd><\u002Ftr><tr><td>Oct 2020 → Apr 2024<\u002Ftd><td>ICO → FTT → Upper Tribunal<\u002Ftd><td>Unlawful data-broking / marketing use of ~51m adults' data<\u002Ftd><td>ICO notice <strong>substantially overturned<\u002Fstrong>; Experian wins; narrow residual notice on ~5.3m notifications<\u002Ftd><td>Marketing data-basis reforms; ceased consent-reliant suppliers<\u002Ftd><\u002Ftr><tr><td>Jul 2018 → Feb 2019<\u002Ftd><td>CMA<\u002Ftd><td>Anti-competitive acquisition of ClearScore<\u002Ftd><td>Parties abandoned; <strong>CMA cancelled reference 27 Feb 2019<\u002Fstrong><\u002Ftd><td>Merger did not proceed<\u002Ftd><\u002Ftr><tr><td>7 Jan 2025 → (live)<\u002Ftd><td>CFPB (C.D. Cal.)<\u002Ftd><td>\"Sham\" dispute investigations; improper reinsertion; FCRA <span class=\"nb\">§611<\u002Fspan>/<span class=\"nb\">§623<\u002Fspan> + CFPA unfair practices<\u002Ftd><td><strong>Litigation ongoing<\u002Fstrong> as of mid-2026; Experian contests<\u002Ftd><td>Potential precedent on dispute-handling<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h2 id=\"s-i-7\" class=\"hd hd2\"><span class=\"hn mono\">I.7<\u002Fspan><span class=\"ht\">The Data-Rights Architecture — PRIORITY DEPTH (the institutional heart)<\u002Fspan><\u002Fh2>\n<p><strong>Who contributes.<\u002Fstrong> Banks, card issuers, telecoms, utilities, retailers, and public-record sources (electoral roll, county-court judgments, insolvency registers). Experian Information Solutions describes its US database as representing ~245 million credit-active consumers with ~1.3 billion updates flowing monthly.<\u002Fp>\n<p><strong>Why they contribute for free, and what they get.<\u002Fstrong> In the <strong>UK<\u002Fstrong>, contribution is the <em>price of access<\u002Fem>: SCOR's Principles of Reciprocity bind furnishers into closed user groups, and a lender that ceases contributing loses access to the equivalent shared data. Reciprocity is enforced contractually and by industry compliance exercises (SCOR-mandated questionnaires). In <strong>Brazil<\u002Fstrong>, positive-data furnishing is a <em>legal duty<\u002Fem> under <span class=\"nb\">LC 166/2019<\u002Fspan> for accredited GBDs. In the <strong>US<\u002Fstrong>, furnishing is nominally voluntary but Metro 2 conventions and competitive parity produce near-universal participation. The consideration is symmetrical information: each furnisher gets a market-wide view of borrower behaviour it could never assemble alone.<\u002Fp>\n<p><strong>Legal basis to hold data, by jurisdiction.<\u002Fstrong> US = FCRA statutory permissible-purpose regime; UK = UK GDPR <strong>legitimate interests (Art. 6(1)(f))<\u002Fstrong> for the bureau, with the <strong>CRAIN<\u002Fstrong> (Credit Reference Agency Information Notice) as the transparency mechanism — a basis the Tribunal litigation substantially validated for bureau (and less-intrusive marketing) processing; Brazil = LGPD Art. 7(X) plus the credit-specific statutes.<\u002Fp>\n<p><strong>Controller vs processor.<\u002Fstrong> For the bureau databases Experian is a <strong>data controller<\u002Fstrong> (confirmed in the ICO Tribunal proceedings — the Tribunal agreed Experian was a controller regardless of whether it was labelled a \"data broker\"). For certain client-hosted decisioning/processing it acts as a processor; the marketing business is controller for its own compiled data.<\u002Fp>\n<p><strong>Consumer rights and the operating obligations they create.<\u002Fstrong> Access; dispute/correction (FCRA <span class=\"nb\">§611<\u002Fspan> reinvestigation; UK GDPR Art. 16; Cadastro Positivo correction within 10 days); freeze/opt-out; and deletion where permitted. These rights generate enormous operating load — the entire CFPB 2025 suit is about the <em>dispute/reinvestigation<\u002Fem> obligation, which is the single most operationally demanding consumer right for a bureau.<\u002Fp>\n<p><strong>What happens if a furnisher leaves.<\u002Fstrong> Forward data flow stops; historical contributed data may generally be retained subject to statutory retention limits (e.g., ~6 years for UK defaults; FCRA <span class=\"nb\">§605<\u002Fspan> time-limits in the US). Precise contractual reversion/deletion terms are <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong> (private contracts).<\u002Fp>\n<p><strong>Public-record vs furnished data.<\u002Fstrong> Yes — these sit on a <em>different<\u002Fem> legal footing. Public-record and electoral-roll data are collected under separate statutory/public-interest bases (the ICO case turned partly on the ~5.3m individuals whose <em>public-source<\u002Fem> data Experian had not adequately notified), distinct from the reciprocity-governed furnished data.<\u002Fp>\n<p><strong>The central institutional question — what does Experian actually own?<\u002Fstrong> Not the raw furnished data (held under permission). It owns: (a) the <strong>aggregated database as a compiled work<\u002Fstrong>; (b) the <strong>derived attributes and bureau scores<\u002Fstrong> it computes; (c) the <strong>models<\u002Fstrong> (and its one-third of VantageScore Solutions); and (d) the <strong>identity-matching / linkage graph<\u002Fstrong>. In one line: <strong>Experian owns the refinery and the refined product, not the crude oil.<\u002Fstrong> This is the deepest structural truth of the enterprise and is nowhere stated so plainly in its own disclosure.<\u002Fp>\n<h2 id=\"s-i-8\" class=\"hd hd2\"><span class=\"hn mono\">I.8<\u002Fspan><span class=\"ht\">Regulation as Barrier, Cost and Moat<\u002Fspan><\u002Fh2>\n<p>Regulation functions as a genuine moat through three distinct mechanisms:<\u002Fp>\n<ol class=\"lst\"><li><strong>FCRA/permissible-purpose compliance capability is genuinely hard to replicate.<\u002Fstrong> The accuracy, reinvestigation, adverse-action and freeze machinery is expensive, litigation-tested and slow to build; it is a de facto licence to operate that a new entrant cannot shortcut. (The very existence of the CFPB dispute-handling suit shows how demanding — and how central — this capability is.)<\u002Fli><li><strong>The reciprocity principle operates as a legally-sanctioned exclusion mechanism.<\u002Fstrong> A new bureau cannot obtain contributed data without already having contributors — a chicken-and-egg barrier. The FCA examined this directly in CIMS and concluded SCOR was not fit for purpose <em>precisely because<\u002Fem> it could entrench incumbents; the proposed CRGB and common data format are explicitly designed to lower this barrier. This is the clearest case in the study of a moat that is simultaneously a regulatory target.<\u002Fli><li><strong>The CMA's readiness to block Experian/ClearScore reveals the enforcement geometry.<\u002Fstrong> Competition authorities police the <em>consumer-facing<\u002Fem> layer (free credit-checking, comparison platforms) aggressively while leaving the <em>underlying bureau oligopoly<\u002Fem> largely intact — because the bureau layer's barriers are seen as structural/data-driven rather than merger-driven. The lesson: Experian will be blocked from consolidating the consumer layer, but its core bureau position is not currently contestable by a challenger.<\u002Fli><\u002Fol>\n<p><strong>Assessment:<\u002Fstrong> the regulatory moat is real and durable, but it is a <strong>double-edged asset<\u002Fstrong> — the same regulatory density that excludes entrants is the largest source of enforcement, litigation and legislative tail risk. It is best characterised not as pure incumbency advantage but as a <em>legally-constructed network barrier<\u002Fem> that regulators can, and in the UK are actively trying to, dismantle at the margin.<\u002Fp>\n<h2 id=\"s-i-9\" class=\"hd hd2\"><span class=\"hn mono\">I.9<\u002Fspan><span class=\"ht\">Institutional Dependency Map<\u002Fspan><\u002Fh2>\n<div class=\"tw wide\"><table class=\"tbl\"><thead><tr><th>Dependency<\u002Fth><th>Function<\u002Fth><th>Criticality<\u002Fth><th>Substitutability<\u002Fth><th>Concentration / bargaining power<\u002Fth><th>Failure impact<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Data furnishers (collectively)<\u002Ftd><td>Supply raw data<\u002Ftd><td><strong>Critical<\u002Fstrong><\u002Ftd><td>Very low collectively; high individually<\u002Ftd><td>Diffuse across ~hundreds of institutions; no single furnisher decisive, but the largest banks have real leverage<\u002Ftd><td>Coordinated withdrawal / reciprocity breakdown = existential<\u002Ftd><\u002Ftr><tr><td>FCRA / regulatory licence to operate<\u002Ftd><td>Right to run a bureau<\u002Ftd><td><strong>Critical<\u002Fstrong><\u002Ftd><td>None<\u002Ftd><td>Regulator holds all power<\u002Ftd><td>Loss = existential<\u002Ftd><\u002Ftr><tr><td>FICO<\u002Ftd><td>Score licensor <strong>and<\u002Fstrong> rival<\u002Ftd><td>High<\u002Ftd><td>Partial (VantageScore)<\u002Ftd><td>FICO strong in mortgage; frenemy dynamic<\u002Ftd><td>Margin/pricing pressure<\u002Ftd><\u002Ftr><tr><td>VantageScore JV<\u002Ftd><td>Bureau-owned score<\u002Ftd><td>Moderate–High<\u002Ftd><td>n/a (co-owned)<\u002Ftd><td>Shared 1/3 control with Equifax/TransUnion<\u002Ftd><td>Competition-law exposure (\"de facto monopoly\" charge)<\u002Ftd><\u002Ftr><tr><td>Cloud infrastructure<\u002Ftd><td>Compute/storage<\u002Ftd><td>High<\u002Ftd><td>Moderate<\u002Ftd><td>Migration substantially complete FY26<\u002Ftd><td>Outage / cost shock<\u002Ftd><\u002Ftr><tr><td>Public-record sources<\u002Ftd><td>Data inputs<\u002Ftd><td>Moderate<\u002Ftd><td>Low<\u002Ftd><td>Government-controlled<\u002Ftd><td>Coverage/quality gaps<\u002Ftd><\u002Ftr><tr><td>Industry bodies (SCOR→CRGB, CDIA)<\u002Ftd><td>Governance of reciprocity<\u002Ftd><td>High<\u002Ftd><td>None<\u002Ftd><td>Being restructured by FCA<\u002Ftd><td>Access-rule change dilutes moat<\u002Ftd><\u002Ftr><tr><td>Lenders/networks as customers<\u002Ftd><td>Revenue<\u002Ftd><td>High<\u002Ftd><td>Moderate<\u002Ftd><td>Concentrated top accounts (100% NA renewal in FY26 at higher values)<\u002Ftd><td>Revenue concentration risk<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>Single points of institutional failure:<\u002Fstrong> (1) the integrity of the reciprocity/contributed-data network; (2) the FCRA licence/reputation of Experian Information Solutions, Inc.; (3) a catastrophic breach of the core bureau database (as opposed to the peripheral 2015 T-Mobile segment).<\u002Fp>\n<h2 id=\"s-i-10\" class=\"hd hd2\"><span class=\"hn mono\">I.10<\u002Fspan><span class=\"ht\">Tax and Intercompany Architecture<\u002Fspan><\u002Fh2>\n<p><strong>Jersey incorporation<\u002Fstrong> (no corporate income tax; company-law flexibility) combined with <strong>Irish tax residence<\u002Fstrong> (management and control exercised from Dublin) produces a group tax charge that the company states is \"influenced by the nature of its income and expenditure and prevailing Irish and Jersey tax laws.\" The <strong>Benchmark tax rate was 25.5% in FY26<\u002Fstrong> (FY25: 25.3%), with FY27 guided to ~26% — i.e., a <em>rising<\u002Fem>, mid-20s effective rate, which argues <em>against<\u002Fem> reading the Jersey/Ireland structure as aggressive tax minimisation. Group debt is issued through Experian Finance plc (the old GUS shell), Experian Europe DAC and Experian Finance US, Inc., all <strong>guaranteed by Experian plc<\u002Fstrong>; brand, models and data are licensed intra-group with attendant transfer pricing. The most defensible interpretation is that the Jersey/Ireland/UK/US split is an <strong>artefact of the 2006 demerger and the group's international footprint<\u002Fstrong> — a legacy of listing a Jersey-incorporated vehicle while running the business from Dublin, Nottingham and Costa Mesa — rather than a tax-optimisation construct. No material disclosed tax dispute was identified in this review (<span class=\"ev unk\">UNKNOWN<\u002Fspan> if any minor uncertain positions exist).<\u002Fp>\n<h2 id=\"s-i-11\" class=\"hd hd2\"><span class=\"hn mono\">I.11<\u002Fspan><span class=\"ht\">Corporate, Regulatory and Legal Risk Register<\u002Fspan><\u002Fh2>\n<div class=\"tw wide\"><table class=\"tbl\"><thead><tr><th>Risk<\u002Fth><th>Probability<\u002Fth><th>Severity<\u002Fth><th>Responsible entity<\u002Fth><th>Mitigation<\u002Fth><th>Residual<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Major breach of <strong>core<\u002Fstrong> bureau database<\u002Ftd><td>Low–Medium<\u002Ftd><td>Very high<\u002Ftd><td>Experian Information Solutions / group<\u002Ftd><td>Post-2015 security investment; cloud migration; monitoring<\u002Ftd><td>High<\u002Ftd><\u002Ftr><tr><td>CFPB FCRA action (<strong>live<\u002Fstrong>)<\u002Ftd><td>Occurring<\u002Ftd><td>Medium–high<\u002Ftd><td>Experian Information Solutions<\u002Ftd><td>Litigation defence; process reform<\u002Ftd><td>Medium<\u002Ftd><\u002Ftr><tr><td>FCRA class-action exposure<\u002Ftd><td>High (continuous)<\u002Ftd><td>Medium<\u002Ftd><td>Experian Information Solutions<\u002Ftd><td>Reserves; dispute-process controls<\u002Ftd><td>Medium–High (now the primary enforcement channel given CFPB retreat)<\u002Ftd><\u002Ftr><tr><td>ICO/EU data-protection enforcement<\u002Ftd><td>Low (post-2024 win)<\u002Ftd><td>Medium<\u002Ftd><td>Experian Limited<\u002Ftd><td>CRAIN transparency; legitimate-interests framework validated<\u002Ftd><td>Low–Medium<\u002Ftd><\u002Ftr><tr><td>Adverse legislation removing data from the file (e.g., medical-debt-type exclusions)<\u002Ftd><td>Medium<\u002Ftd><td>Medium–high<\u002Ftd><td>Group<\u002Ftd><td>Diversification; lobbying; the 2025 vacatur reduced near-term US risk<\u002Ftd><td>Medium<\u002Ftd><\u002Ftr><tr><td>SCOR→CRGB restructuring diluting reciprocity moat<\u002Ftd><td>Occurring<\u002Ftd><td>Medium<\u002Ftd><td>Experian Limited<\u002Ftd><td>Engagement with FCA/CRGB/IWG<\u002Ftd><td>Medium<\u002Ftd><\u002Ftr><tr><td>LGPD/ANPD or Banco Central enforcement<\u002Ftd><td>Low–Medium<\u002Ftd><td>Medium<\u002Ftd><td>Serasa S.A.<\u002Ftd><td>Compliance programme; Central Bank accreditation<\u002Ftd><td>Medium<\u002Ftd><\u002Ftr><tr><td>Structural <strong>B2B–D2C conflict<\u002Fstrong><\u002Ftd><td>Standing<\u002Ftd><td>Reputational<\u002Ftd><td>Group<\u002Ftd><td>Entity separation; \"financial-health\" narrative<\u002Ftd><td>Medium<\u002Ftd><\u002Ftr><tr><td>US state-privacy fragmentation<\u002Ftd><td>High<\u002Ftd><td>Medium<\u002Ftd><td>US entities<\u002Ftd><td>Compliance overhead; FCRA-preemption arguments<\u002Ftd><td>Medium<\u002Ftd><\u002Ftr><tr><td>Furnisher withdrawal / reciprocity failure<\u002Ftd><td>Low<\u002Ftd><td>Very high<\u002Ftd><td>Group<\u002Ftd><td>Legal duties (Brazil); network lock-in (UK/US)<\u002Ftd><td>Medium<\u002Ftd><\u002Ftr><tr><td>Reputational damage impairing D2C trust<\u002Ftd><td>Medium<\u002Ftd><td>Medium<\u002Ftd><td>ConsumerInfo.com<\u002Ftd><td>Brand/security investment<\u002Ftd><td>Medium<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>The breach history in full.<\u002Fstrong> The <strong>2015 T-Mobile incident<\u002Fstrong> is the defining event: an unauthorised actor accessed an Experian network segment holding personal data (names, addresses, dates of birth, SSNs, government IDs) of <strong>~15 million<\u002Fstrong> T-Mobile postpaid/device-financing applicants from September 2013 to September 2015. A <strong>40-state AG coalition<\u002Fstrong> settled in November 2022 for <strong>~US$12.67m from Experian<\u002Fstrong> plus US$2.43m from T-Mobile (combined &gt;US$16m), with five years' extended credit monitoring and security undertakings; a 2019 consumer class action had earlier settled with two years' monitoring. Critically, <strong>neither Experian's core consumer-credit database nor T-Mobile's own systems were compromised<\u002Fstrong> — the breach was of a client-processing segment, which is why it did not become an Equifax-scale existential event. Some settlements reference companion 2012 incidents.<\u002Fp>\n<p><strong>The B2B vs D2C tension.<\u002Fstrong> Experian sells consumer data to lenders (B2B, principally via Experian Information Solutions) <em>and<\u002Fem> sells credit monitoring and identity protection to consumers (D2C, via ConsumerInfo.com — over 215 million free members globally, monetised through premium subscriptions and marketplace referrals). This is a genuine structural conflict — the company profits from the market whose risks it then sells consumers protection against — managed through legal-entity separation and a \"help consumers improve their financial health\" narrative. It is a standing reputational risk that would be amplified by any future breach or adverse enforcement.<\u002Fp>\n<h2 id=\"s-i-12\" class=\"hd hd2\"><span class=\"hn mono\">I.12<\u002Fspan><span class=\"ht\">Volume I Reconstruction<\u002Fspan><\u002Fh2>\n<p><strong>(1) Corporate Entity Diagram (economically-important core):<\u002Fstrong><br>Experian plc (Jersey/Ireland, listed, guarantor) → [Experian Finance plc (UK, ex-GUS, debt) | Experian Group Limited / Experian Holdings Limited (UK holdcos) | Experian Holdings, Inc. (US holdco)] → operating layer: Experian Limited (UK bureau, FCA) · Experian Information Solutions, Inc. (US FCRA bureau, Ohio) · ConsumerInfo.com, Inc. (US D2C, CA) · Experian Marketing Solutions, LLC (US, DE) · Experian Health, Inc. (US) · Serasa S.A. (Brazil, ~99.6%).<\u002Fp>\n<p><strong>(2) Simplified group structure:<\u002Fstrong> one listed Jersey parent; a thin band of UK/US/Irish holding and finance entities; a set of ring-fenced national operating bureaux and product companies.<\u002Fp>\n<p><strong>(3) Ownership and control:<\u002Fstrong> widely held, one-share-one-vote, no controlling shareholder; largest holder BlackRock ~5.9%; control effectively with management + dispersed institutions; removable by ordinary vote.<\u002Fp>\n<p><strong>(4) Governance/decision-rights:<\u002Fstrong> Board (Chair Rogers→Crozier 2026; CEO Cassin; CFO Pitchford) with Audit/Remuneration/Nomination committees; <strong>no dedicated data/privacy committee<\u002Fstrong>; capital allocation and M&amp;A at Board; data-use at management.<\u002Fp>\n<p><strong>(5) Multi-jurisdiction regulatory map:<\u002Fstrong> US (FCRA + CFPB larger-participant + FTC + state AGs/CCPA/GLBA); UK (UK GDPR/DPA 2018 + ICO + FCA/CIMS + SCOR→CRGB); Brazil (LGPD + Cadastro Positivo + Banco Central + ANPD); EU/APAC (GDPR; illion in AU/NZ).<\u002Fp>\n<p><strong>(6) Data-rights architecture:<\u002Fstrong> contributed data held under statutory permission (FCRA/LGPD) and contractual reciprocity (SCOR); Experian is controller of the bureau databases; owns the aggregation, attributes, scores and models — not the raw data.<\u002Fp>\n<p><strong>(7) Enforcement/litigation table:<\u002Fstrong> see <a class=\"xr\" href=\"#s-i-6\">I.6<\u002Fa> (2017 CFPB US$3m; 2015 breach ~US$16m; ICO 2020–24 Experian win; CMA/ClearScore abandoned 2019; CFPB 2025 live).<\u002Fp>\n<p><strong>(8) Legal-responsibility map:<\u002Fstrong> FCRA → Experian Information Solutions; UK data/FCA → Experian Limited; Brazil → Serasa S.A.; D2C → ConsumerInfo.com; debt → Experian Finance plc / Experian plc guarantee.<\u002Fp>\n<p><strong>(9) Institutional dependency map:<\u002Fstrong> furnishers (Critical); FCRA licence (Critical); FICO/VantageScore (High); cloud (High); industry bodies (High).<\u002Fp>\n<p><strong>(10) Tax/intercompany map:<\u002Fstrong> Jersey inc. + Irish residence; debt via Experian Finance plc/Europe DAC/US Inc. under Experian plc guarantee; ~25.5% Benchmark tax rate, rising.<\u002Fp>\n<p><strong>(11) Chronological corporate evolution:<\u002Fstrong> 1980 CCN → 1996 TRW merger/Experian brand → 2006 demerger (GUS shell → Experian Finance plc) → 2007/2012 Serasa → 2020–25 identity/fraud/APAC build-out.<\u002Fp>\n<p><strong>(12) Regulation-as-moat assessment:<\u002Fstrong> real and durable but double-edged; reciprocity is a legally-constructed network barrier the FCA is actively trying to loosen.<\u002Fp>\n<p><strong>(13) Top corporate/legal/regulatory risks:<\u002Fstrong> core-database breach; live CFPB suit; FCRA class actions (now the primary enforcement channel); reciprocity restructuring; B2B–D2C conflict.<\u002Fp>\n<p><strong>(14) Key unknowns:<\u002Fstrong> individual furnisher contract terms; Serasa's exact current ownership % and CNPJ; states of incorporation of Experian Holdings Inc., ConsumerInfo.com and Experian Health; any minor uncertain tax positions.<\u002Fp>\n<p><strong>(15) Ten most important conclusions:<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li>Experian is a listed information utility, not a data owner — it holds others' data under permission and owns the aggregation.<\u002Fli><li>The Jersey-inc./Irish-resident/Dublin-HQ/Nottingham+Costa Mesa split is confirmed and foundational; the operational centre of gravity is North America.<\u002Fli><li>Experian Finance plc <em>is<\u002Fem> the old GUS/Great Universal Stores shell — the retailer's corpse is the group treasury.<\u002Fli><li>The most strategically important entity is Experian Information Solutions, Inc. (Ohio), the US FCRA bureau and profit centre.<\u002Fli><li>Control is genuinely contestable in law but practically management-led over a dispersed institutional register; no controlling bloc.<\u002Fli><li>The reciprocity principle is both moat and regulatory accident — and the FCA is dismantling its governance (SCOR→CRGB).<\u002Fli><li>Regulation is Experian's deepest barrier to entry and its largest tail risk simultaneously.<\u002Fli><li>The CFPB's 2025 enforcement retreat shifts FCRA enforcement onto the class-action channel — raising, not lowering, private litigation salience.<\u002Fli><li>Experian largely <em>won<\u002Fem> its ICO fight — a rare, complete data-broking regulatory defeat for the regulator — validating legitimate interests for bureau/marketing processing.<\u002Fli><li>The B2B–D2C conflict (selling data to lenders and protection to consumers) is a permanent, managed reputational fault line.<\u002Fli><\u002Fol>\n<p><strong>Direct answers to the closing questions:<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li><strong>Most strategically important legal entity:<\u002Fstrong> Experian Information Solutions, Inc. (Ohio) — the US FCRA bureau generating the majority of group profit.<\u002Fli><li><strong>Where actual control sits:<\u002Fstrong> with executive management, legitimised by a dispersed long-only institutional register; no controlling shareholder; removable by ordinary vote.<\u002Fli><li><strong>Greatest constraint / greatest protection:<\u002Fstrong> the FCRA/CFPB regime is both — the largest single constraint (litigation, dispute-handling burden) and, via the barrier to entry, the greatest protection.<\u002Fli><li><strong>What Experian actually owns:<\u002Fstrong> the refinery and refined product — the aggregated database as a compiled work, derived attributes and scores, the models (and its third of VantageScore) and the identity graph — not the raw furnished data.<\u002Fli><li><strong>Most dangerous dependency:<\u002Fstrong> the integrity of collective furnisher participation / reciprocity.<\u002Fli><li><strong>Reciprocity — moat or accident?<\u002Fstrong> Both: a self-regulatory settlement that hardened into a legally-sanctioned entry barrier, now being restructured by the FCA.<\u002Fli><li><strong>Most misunderstood by outsiders:<\u002Fstrong> the belief that Experian \"owns your data\"; in law it holds others' data under permission and owns the aggregation and models.<\u002Fli><li><strong>What a well-funded entrant could and could not build today:<\u002Fstrong> it could build the data centre, cloud stack and even the scoring models within a few years; it could <em>not<\u002Fem> quickly assemble the contributed-data network under reciprocity (near-impossible in the UK without a regulatory mandate) or the litigation-tested FCRA-compliance apparatus. The legally-permissioned data network — not the technology — is what takes longest and is, in the UK, effectively legally impossible to replicate from zero.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-recommendations\" class=\"hd hd2 n0\"><span class=\"ht\">Recommendations<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>Track the CFPB <em>Experian<\u002Fem> litigation (C.D. Cal., filed 7 Jan 2025) as the near-term binary.<\u002Fstrong> An adverse judgment or settlement would set FCRA dispute-handling precedent for the whole industry and invite copy-cat class actions; a dismissal (plausible given the CFPB's 2025 posture reversal) would materially de-risk the sector. <em>Threshold that changes the view:<\u002Fem> any dispositive ruling or a settlement figure disclosed as material.<\u002Fli><li><strong>Watch the SCOR→CRGB transition and FCA CP26/7 (2026).<\u002Fstrong> Mandatory reporting and a common data format could erode the reciprocity moat. <em>Benchmark to monitor:<\u002Fem> whether the CRGB opens data access to thin-contribution new entrants — the single most important indicator of moat durability in the UK.<\u002Fli><li><strong>Monitor VantageScore 4.0 conforming-mortgage adoption post-FHFA (8 Jul 2025).<\u002Fstrong> A genuine shift in scoring economics and a competition-law flashpoint (FICO's \"de facto monopoly\" charge). <em>Threshold:<\u002Fem> any DOJ/FTC or private antitrust action targeting bureau ownership of VantageScore.<\u002Fli><li><strong>For counterparty due diligence, always contract with the correct legal entity:<\u002Fstrong> FCRA obligations attach to Experian Information Solutions, Inc. (Ohio); UK data/FCA obligations to Experian Limited; Brazilian obligations to Serasa S.A.; debt exposure to Experian Finance plc under the Experian plc guarantee. Do not treat \"Experian\" as a single contracting counterparty.<\u002Fli><li><strong>For <a class=\"xr\" href=\"#part-ii\">Volume II<\u002Fa> (do not begin here):<\u002Fstrong> carry forward the unresolved entity-registration items and the furnisher-contract terms as the priority primary-source targets (Irish CRO, Ohio SoS, California SoS, Serasa CNPJ via Receita Federal).<\u002Fli><\u002Fol>\n<h2 id=\"s-caveats\" class=\"hd hd2 n0\"><span class=\"ht\">Caveats<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li>Individual <strong>furnisher contract terms<\u002Fstrong>, <strong>Serasa's exact current ownership percentage and CNPJ<\u002Fstrong>, and the <strong>states of incorporation of Experian Holdings Inc., ConsumerInfo.com and Experian Health<\u002Fstrong> are <strong><span class=\"ev unk\">UNKNOWN/UNVERIFIED<\u002Fspan><\u002Fstrong> from public sources and are labelled as such above; the 99.6% Serasa figure is the last publicly verified level (2012) and may since be higher.<\u002Fli><li>Financial figures are FY26 (year to 31 March 2026) on the bases labelled; <strong>statutory and Benchmark measures are not mixed<\u002Fstrong> in any single comparison.<\u002Fli><li>The <strong>US CFPB enforcement posture is in flux<\u002Fstrong> as of mid-2026; statements about 2025 dismissals and the medical-debt-rule vacatur reflect actions taken in 2025 and remain subject to appeal and legislative change.<\u002Fli><li>Some corporate-history dating (e.g., the exact 1996 sequencing of the TRW spin-out and GUS purchase, and pre-1980 pre-history) relies on secondary business-history sources and is corroborated where possible against Experian's own \"Our history\" disclosure; the PE-backer detail (Bain Capital, Thomas H. Lee) is from a reputable company-history source rather than a primary filing.<\u002Fli><li>This is a standalone <a class=\"xr\" href=\"#part-i\">Volume I<\u002Fa> on Experian; structural contrasts with EREF Subjects I–III (Wise, Atruvia, DZ BANK) are noted only where analytically useful. <strong><a class=\"xr\" href=\"#part-ii\">Volume II<\u002Fa> has not been started.<\u002Fstrong><\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" data-part=\"2\">\n<header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part II<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">II<\u002Fspan><\u002Fdiv><h1 id=\"part-ii\" class=\"part\" data-short=\"Part II — Product, the Three-Sided Customer Structure &amp; the Inverted Value Flow\">Product, the Three-Sided Customer Structure &amp; the Inverted Value Flow<\u002Fh1><p class=\"opener-s\">What is sold, to whom, and how an input contributed for nothing becomes an output the buyer cannot decline.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">II<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Numbered sections<\u002Fdiv><div class=\"plate-v\">14<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Tables<\u002Fdiv><div class=\"plate-v\">0<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-product-the-three-sided-customer-structure-the-inverted-value-flow\"><span class=\"inpart-n\"><\u002Fspan><span>Product, the Three-Sided Customer Structure &amp; the Inverted Value Flow<\u002Fspan><\u002Fa><a href=\"#s-tl-dr-2\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR<\u002Fspan><\u002Fa><a href=\"#s-key-findings-2\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details-2\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-ii-1\"><span class=\"inpart-n\">II.1<\u002Fspan><span>Product Universe — decomposed by manufacturing entity and legal basis<\u002Fspan><\u002Fa><a href=\"#s-ii-2\"><span class=\"inpart-n\">II.2<\u002Fspan><span>The Three-Sided Customer Structure (replaces segmentation) — PRIORITY<\u002Fspan><\u002Fa><a href=\"#s-ii-3\"><span class=\"inpart-n\">II.3<\u002Fspan><span>Jobs to Be Done<\u002Fspan><\u002Fa><a href=\"#s-ii-4\"><span class=\"inpart-n\">II.4<\u002Fspan><span>The Customer Journey — traced separately<\u002Fspan><\u002Fa><a href=\"#s-ii-5\"><span class=\"inpart-n\">II.5<\u002Fspan><span>The Inverted Value Flow (replaces money-movement) — PRIORITY<\u002Fspan><\u002Fa><a href=\"#s-ii-6\"><span class=\"inpart-n\">II.6<\u002Fspan><span>Transaction Teardown<\u002Fspan><\u002Fa><a href=\"#s-ii-7\"><span class=\"inpart-n\">II.7<\u002Fspan><span>Distribution Architecture<\u002Fspan><\u002Fa><a href=\"#s-ii-8\"><span class=\"inpart-n\">II.8<\u002Fspan><span>Pricing Architecture<\u002Fspan><\u002Fa><a href=\"#s-ii-9\"><span class=\"inpart-n\">II.9<\u002Fspan><span>Product Dependency and Cross-Sell Map<\u002Fspan><\u002Fa><a href=\"#s-ii-10\"><span class=\"inpart-n\">II.10<\u002Fspan><span>Customer Economics and the Triple Monetisation of the Consumer — PRIORITY<\u002Fspan><\u002Fa><a href=\"#s-ii-11\"><span class=\"inpart-n\">II.11<\u002Fspan><span>Capacity and Supply Constraints<\u002Fspan><\u002Fa><a href=\"#s-ii-12\"><span class=\"inpart-n\">II.12<\u002Fspan><span>Failure and Exception Paths<\u002Fspan><\u002Fa><a href=\"#s-ii-13\"><span class=\"inpart-n\">II.13<\u002Fspan><span>Product-Market Evolution<\u002Fspan><\u002Fa><a href=\"#s-ii-14\"><span class=\"inpart-n\">II.14<\u002Fspan><span>Volume II Reconstruction<\u002Fspan><\u002Fa><a href=\"#s-recommendations-for-an-analyst-investor-counterparty-using-this-teardown\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations (for an analyst / investor / counterparty using this teardown)<\u002Fspan><\u002Fa><a href=\"#s-caveats-2\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats one\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">~10,000<\u002Fdiv><div class=\"stat-l\">furnishers contributing free<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<h2 id=\"s-product-the-three-sided-customer-structure-the-inverted-value-flow\" class=\"hd hd2 n0\"><span class=\"ht\">Product, the Three-Sided Customer Structure &amp; the Inverted Value Flow<\u002Fspan><\u002Fh2>\n<p><em>Basis discipline: Experian reports under IFRS in US dollars with a 31 March financial year end. FY26 = year ended 31 March 2026. Benchmark and statutory figures are labelled throughout and never mixed. \"Ongoing activities\" excludes the B2B lines re-presented as exited from FY26. Evidence tags: <span class=\"ev\">CONFIRMED FACT<\u002Fspan> / <span class=\"ev\">COMPANY CLAIM<\u002Fspan> / <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan> / <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> / <span class=\"ev unk\">UNKNOWN<\u002Fspan>.<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-tl-dr-2\" class=\"hd hd2 n0\"><span class=\"ht\">TL;DR<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Experian's true core product is not data but a permissioned network position no single participant could occupy alone.<\u002Fstrong> It sits between ~245m credit-active US consumers, ~400 UK institutions, and ~100m Brazilians, receives its raw material free from the same institutions that later buy the finished product back, and monetises the resulting aggregation, identity graph, derived attributes and models. In FY26 it converted <strong>US$8,425m<\u002Fstrong> of ongoing revenue into a <strong>28.6% Benchmark EBIT margin<\u002Fstrong> off a core input carrying essentially zero procurement cost.<\u002Fli><li><strong>The three-sided customer structure is real and concentrated.<\u002Fstrong> A large bank is simultaneously a <strong>data furnisher<\u002Fstrong> (supplies data free), a <strong>data buyer<\u002Fstrong> (pays per pull for reports/scores/attributes/decisioning) and a <strong>marketplace advertiser<\u002Fstrong> (pays to be shown to pre-qualified consumers). Reciprocity — you can only draw out what you contribute — is the disciplining mechanism that both locks furnishers in and caps Experian's raw-material bargaining exposure.<\u002Fli><li><strong>The consumer is monetised three ways at once (B2B data sale, D2C subscription, marketplace referral) and is both customer and product.<\u002Fstrong> The marketplace has overtaken subscriptions as the primary consumer growth driver, which sharpens rather than resolves the conflict of interest. The live CFPB \"sham investigations\" suit (filed 7 January 2025; motion to dismiss denied 22 October 2025; discovery ongoing) targets exactly the dispute machinery that is both Experian's largest consumer-facing cost and its principal legal exposure.<\u002Fli><\u002Ful>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-key-findings-2\" class=\"hd hd2 n0\"><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2>\n<ol class=\"lst\"><li><strong>FY26 revenue architecture (Benchmark, ongoing, US$m) [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>]:<\u002Fstrong> B2B <strong>US$6,168m<\u002Fstrong> (Financial Services <strong>US$4,463m<\u002Fstrong> + Verticals <strong>US$1,705m<\u002Fstrong>) and Consumer Services <strong>US$2,257m<\u002Fstrong>, for <strong>US$8,425m<\u002Fstrong> total. By region: North America <strong>US$5,587m<\u002Fstrong>, Latin America <strong>US$1,297m<\u002Fstrong>, UK &amp; Ireland <strong>US$942m<\u002Fstrong>, EMEA &amp; Asia Pacific <strong>US$599m<\u002Fstrong>. North America is <strong>66.3%<\u002Fstrong> of ongoing revenue (5,587/8,425).<\u002Fli><li><strong>Margin geography [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>]:<\u002Fstrong> Benchmark EBIT by region — North America <strong>US$1,912m (34.2% margin)<\u002Fstrong>, Latin America <strong>US$399m (30.8%)<\u002Fstrong>, UK &amp; Ireland <strong>US$220m (23.4%)<\u002Fstrong>, EMEA/AP <strong>US$40m (6.7%)<\u002Fstrong>, less <strong>US$164m<\u002Fstrong> central costs = <strong>US$2,407m (28.6%)<\u002Fstrong>. By line: B2B <strong>US$1,903m (30.9%)<\u002Fstrong>, Consumer Services <strong>US$668m (29.6%)<\u002Fstrong>. North America is where the free-input-to-margin conversion is most complete.<\u002Fli><li><strong>The inverted value flow is the central mechanism [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> from confirmed mechanics]:<\u002Fstrong> the furnisher reports at its own cost under Metro 2 (US) / CAIS (UK) and receives no cash; the same or another lender later pays per pull. COGS is therefore not raw material but matching/identity resolution, database operations, model development, compliance and — materially — dispute handling.<\u002Fli><li><strong>Triple monetisation confirmed by the company's own model page [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>]:<\u002Fstrong> Consumer Services revenue is generated through \"Premium subscriptions,\" \"Marketplace referral and performance-based fees,\" \"Financial product origination partnerships\" and \"Value-added protection services.\" Management stated marketplace (credit cards, personal loans, insurance) was a key driver of FY26 consumer growth.<\u002Fli><li><strong>Pricing power sits with Experian on the buy side but is capped by reciprocity and, in mortgage, complicated by FICO.<\u002Fstrong> Per the Community Home Lenders of America (CHLA), via HousingWire (April 2026), <em>\"total credit report costs associated with closing a conventional loan have risen from about $50 in 2022 to roughly $540 in 2026,\"<\u002Fem> while <em>\"the base price charged by FICO for a tri-merge credit report has increased from $1.80 in late 2022 to $30 in 2026 — a more than 1,500% increase over four years.\"<\u002Fem> FICO's wholesale royalty is <strong>US$4.95/score<\u002Fstrong> and, per FICO EVP Jim Wehmann, <em>\"all amounts above $4.95 per score are collected and retained by the credit bureaus or their tri-merge resellers—not FICO\"<\u002Fem> (the traditional wholesale channel still averages ~US$10/score). Experian's own mortgage revenue grew <strong>45% in FY26 on roughly flat volumes<\u002Fstrong> — a pure pricing effect.<\u002Fli><li><strong>The consumer product is a genuine business but the \"financial health\" framing does not survive contact with the mechanics.<\u002Fstrong> The consumer whose data is sold has no contract with the buyer and receives no payment; per Experian's own Boost page <em>\"most people get an instant increase in their FICO® Score by an average of 13 points\"<\u002Fem> — but only under the FICO Score 8 model and only to the Experian file, which many mortgage/auto models do not use.<\u002Fli><li><strong>Serasa is a national platform in its own right [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>]:<\u002Fstrong> ~100m Brazilians in its base, ~75.7m negativados (March 2025), and Limpa Nome renegotiated <strong>US$19.4bn<\u002Fstrong> of consumer debt in FY26 across a creditor-paid marketplace of 2,200+ partner companies; the consumer pays nothing and Serasa is paid by creditors on recovery — the exact fee rate is <span class=\"ev unk\">UNKNOWN<\u002Fspan>.<\u002Fli><\u002Fol>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-details-2\" class=\"hd hd2 n0\"><span class=\"ht\">Details<\u002Fspan><\u002Fh2>\n<h2 id=\"s-ii-1\" class=\"hd hd2\"><span class=\"hn mono\">II.1<\u002Fspan><span class=\"ht\">Product Universe — decomposed by manufacturing entity and legal basis<\u002Fspan><\u002Fh2>\n<p>Experian's portfolio is best understood as concentric rings around a single regulated asset — the bureau file — with each outer ring progressively less regulated and more contestable. Each family below is tagged by manufacturing legal entity, legal basis and classification (regulated-bureau / adjacent-analytics / marketing / consumer-subscription / marketplace / infrastructure).<\u002Fp>\n<p><strong>A. Core bureau (B2B) — regulated-bureau.<\u002Fstrong> Manufactured by <strong>Experian Information Solutions, Inc.<\u002Fstrong> (US, the FCRA \"consumer reporting agency\" and the group's principal profit centre) and <strong>Experian Limited<\u002Fstrong> (UK, FCA-authorised, operating the CAIS bureau). Products: consumer credit reports; credit scores (FICO under distribution licence; VantageScore as co-owner); bureau attributes and trended data (2,100+ credit attributes on Ascend; ~6,000 predictive attributes when cashflow data is blended, per FY26 disclosure, enabling <em>\"up to a 25% uplift in predictive performance when combined with traditional credit data\"<\u002Fem>); prescreen / pre-qualification files; account review and portfolio monitoring; collections triggers; alerts. Legal basis: FCRA \"permissible purpose\" (US); UK GDPR <span class=\"nb\">Article 6(1)(f)<\u002Fspan> legitimate interests with CRAIN transparency (UK); LGPD Art. 7(X) + Cadastro Positivo law (Brazil). Job: assess and monitor borrowers. Pricing: per-inquiry, tiered by volume (largely confidential — <span class=\"ev unk\">UNKNOWN<\u002Fspan> at list). This is the prerequisite product on which everything else depends.<\u002Fp>\n<p><strong>B. Analytics and decisioning — adjacent-analytics/infrastructure.<\u002Fstrong> Manufactured through <strong>Experian Software Solutions (ESS)<\u002Fstrong> and regional decision-analytics entities. The <strong>Ascend<\u002Fstrong> family — Ascend Platform (<strong>2,300+ client solutions implemented, 37 product capabilities provisioned globally<\u002Fstrong> per FY26), Ascend Intelligence Services (custom AI/ML model build), Ascend Ops, the Ascend Sandbox — plus <strong>PowerCurve<\u002Fstrong> decisioning software (originations, customer management, collections; now interoperating with Ascend and carrying the \"Experian Assistant\" GenAI / AIVA layer). Legal basis: contractual (software/SaaS licensing); where bureau data flows through, FCRA/GDPR bases attach. Job: let a mid-market lender deploy models that only the top banks could previously afford; the company claims model build cut \"from months to days.\" Pricing: subscription/platform + consumption (confidential — <span class=\"ev unk\">UNKNOWN<\u002Fspan>). Classification: infrastructure that is bureau-dependent for data but is itself a software business.<\u002Fp>\n<p><strong>C. Fraud and identity — adjacent-analytics.<\u002Fstrong> <strong>CrossCore<\u002Fstrong> (identity/fraud orchestration platform), <strong>Precise ID<\u002Fstrong> (identity verification and fraud scoring), device intelligence, <strong>NeuroID<\u002Fstrong> (behavioural analytics — keystroke/mouse/typing cadence, acquired 2024), <strong>ClearSale<\u002Fstrong> (Brazil transactional/e-commerce fraud, completed 1 April 2025), <strong>KYC360<\u002Fstrong> (UK/Ireland RegTech/AML, October 2025), and <strong>AtData<\u002Fstrong> (email identity, 10bn+ addresses, October 2025). Legal basis: fraud-prevention legitimate interest / substantial public interest; not a consumer-report use unless a bureau pull is involved. Job: verify identity and stop fraud at onboarding and transaction. Experian claims its identity/fraud solutions helped clients avoid ~US$15bn in fraud losses globally in a year [<span class=\"ev\">COMPANY CLAIM<\u002Fspan>]. Pricing: per-transaction/per-check.<\u002Fp>\n<p><strong>D. Marketing services — marketing.<\u002Fstrong> Manufactured by <strong>Experian Marketing Solutions, LLC<\u002Fstrong> (US) and Experian Limited's marketing unit (UK). Assets: audience segmentation (ConsumerView-type products), identity resolution via the <strong>Experian Graph<\u002Fstrong> (signal-agnostic, supporting UID2/ID5), <strong>Tapad<\u002Fstrong> (cross-device probabilistic graph, ~US$280m, 2020), <strong>Audigent<\u002Fstrong> (data curation/SmartPMPs, December 2024) and <strong>AtData<\u002Fstrong> (email). Clean-room / data-collaboration (\"Consumer Sync\"). <strong>Critical legal distinction:<\u002Fstrong> marketing use is <em>not<\u002Fem> permitted under FCRA permissible purpose and <em>not<\u002Fem> under the credit-bureau data-sharing reciprocity; in the UK it runs on UK GDPR legitimate interests for the marketing data set specifically — <strong>the precise point litigated in the ICO case<\u002Fstrong>. The ICO's October 2020 enforcement notice attacked exactly this \"invisible processing\"; the First-tier Tribunal (20 February 2023) and Upper Tribunal (23 April 2024) largely upheld Experian, confirming legitimate interests can support large-scale direct-marketing processing — but also that data originally collected on a <em>consent<\u002Fem> basis cannot be \"flipped\" to legitimate interests. The FTT found the Information Commissioner <em>\"did not properly appreciate the limited extent to which CRA data was used.\"<\u002Fem> Classification: marketing; must be firewalled from the credit file.<\u002Fp>\n<p><strong>E. Experian Health — infrastructure (healthcare RCM).<\u002Fstrong> Manufactured by <strong>Experian Health, Inc.<\u002Fstrong> Patient identity, insurance eligibility verification, claims management (ClaimSource), denials prediction (AI Advantage), Patient Access Curator (PAC, ~30% average denial reduction claimed), collections optimisation, patient payment estimates. Company metrics [<span class=\"ev\">COMPANY CLAIM<\u002Fspan>]: US$4.9bn annual collections facilitated, 2,700 payer connections, 175m claims processed, US$3.2bn+ annual eligibility transactions cleared. <strong>Why a credit bureau owns this:<\u002Fstrong> the shared asset is <em>identity resolution and data-matching infrastructure<\u002Fem>, not credit data — Experian is applying the same matching/attribute engine to a different data domain (payer coverage) where it does not share the consumer credit file. This is infrastructure reuse, not credit-data cross-use.<\u002Fp>\n<p><strong>F. Automotive — adjacent-analytics/marketing.<\u002Fstrong> <strong>AutoCheck<\u002Fstrong> vehicle history (per FY26, now <em>\"the exclusive vehicle history report provider across almost every major consumer shopping site in the USA\"<\u002Fem>), plus automotive credit, value-recovery and marketing data. Legal basis: mixed (public/DMV records, FCRA where credit is involved).<\u002Fp>\n<p><strong>G. Business information — regulated/adjacent.<\u002Fstrong> Commercial credit reports, small-business risk scores, commercial bureau (US/UK/Brazil/illion). Legal basis: commercial data is largely outside FCRA/consumer-GDPR constraints (business data), though sole-trader data blurs the line.<\u002Fp>\n<p><strong>H. Direct-to-consumer — consumer-subscription + marketplace.<\u002Fstrong> Manufactured by <strong>ConsumerInfo.com, Inc. dba Experian Consumer Services<\u002Fstrong> (US, Costa Mesa) and Experian Limited (UK). Free membership (215m+ globally); premium subscriptions — CreditWorks Premium (<strong>US$24.99/mo<\u002Fstrong> after a US$4.99 first month) and IdentityWorks Premium (<strong>US$24.99/mo<\u002Fstrong>) / Family (<strong>US$34.99/mo<\u002Fstrong>), including tri-bureau monitoring, dark-web scanning, up to <strong>US$1m<\u002Fstrong> identity-theft insurance and CreditLock; <strong>Experian Boost<\u002Fstrong> (free; adds utility/telecom/rent/streaming payments to the Experian file, ~13-point average FICO Score 8 uplift); <strong>Experian Go<\u002Fstrong> (credit-invisible file establishment; 15,000+ in pilot); the <strong>marketplace<\u002Fstrong> (credit cards, personal loans, insurance via Gabi, and now mortgage via <strong>Own Up<\u002Fstrong>); and in the UK <strong>CreditExpert<\u002Fstrong> (paid) and <strong>CreditMatcher<\u002Fstrong> (free marketplace). Legal basis: direct consumer contract (subscription T&amp;Cs); marketplace referrals on consumer consent. Classification: subscription + marketplace.<\u002Fp>\n<p><strong>I. Serasa Experian consumer (Brazil) — consumer-subscription + marketplace.<\u002Fstrong> Manufactured by <strong>Serasa S.A.<\u002Fstrong> (~99.6% owned). The five distinct consumer products: (1) <strong>Serasa Score<\u002Fstrong> (0–1,000; Cadastro Positivo data carries ~55% of the calculation weight per Serasa); (2) <strong>Limpa Nome<\u002Fstrong> (debt-renegotiation marketplace — see <a class=\"xr\" href=\"#s-ii-6\">II.6<\u002Fa>); (3) <strong>Serasa Premium<\u002Fstrong> (CPF monitoring, consultation-blocking, alerts); (4) <strong>Serasa Cadastro Positivo<\u002Fstrong> (the positive-registry enrolment and management, Banco Central-accredited since 11 October 2019); (5) the <strong>Serasa app / eCred marketplace<\u002Fstrong> (credit matching). Legal basis: LGPD Art. 7(X) + Cadastro Positivo law (Lei Complementar nº 166/2019, automatic inclusion). Scale: ~100m Brazilians in base [<span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan>, Exame].<\u002Fp>\n<p><strong>J. illion (Australia/NZ) — regulated-bureau + adjacent.<\u002Fstrong> Consumer and commercial credit registries; <strong>BankStatements<\u002Fstrong> (bank-transaction retrieval, 47m+ transactions weekly from 2.7m+ individuals, 5,000+ customers incl. 750+ lenders); Open Data Solutions (CDR/open-banking, 140+ AU banks, 20+ NZ); illion Decisioning; Authenticate (fraud); Company360 (commercial). Acquired 2024 (~A$820m). Legal basis: Australian Privacy Act / CDR; NZ equivalents.<\u002Fp>\n<h2 id=\"s-ii-2\" class=\"hd hd2\"><span class=\"hn mono\">II.2<\u002Fspan><span class=\"ht\">The Three-Sided Customer Structure (replaces segmentation) — PRIORITY<\u002Fspan><\u002Fh2>\n<p>The defining feature of Experian's counterparty base is <strong>role superimposition<\u002Fstrong>: the same institution frequently occupies all three roles at once.<\u002Fp>\n<figure class=\"fig\" id=\"figure-3\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 03<\u002Fspan><span class=\"fig-t\">The Three-Sided Customer<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"text-align:center\"><div style=\"display:inline-block;min-width:340px\"><div class=\"f-box solid\"><div class=\"f-name\">ONE BANK<\u002Fdiv><div class=\"f-meta\">A single institution, one master agreement, three commercial relationships running simultaneously.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<svg viewBox=\"0 0 1000 26\" width=\"100%\" height=\"34\" preserveAspectRatio=\"none\" style=\"display:block\" aria-hidden=\"true\">\n<line x1=\"500\" y1=\"0\" x2=\"500\" y2=\"10\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"167\" y1=\"10\" x2=\"833\" y2=\"10\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"167\" y1=\"10\" x2=\"167\" y2=\"26\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"500\" y1=\"10\" x2=\"500\" y2=\"26\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<line x1=\"833\" y1=\"10\" x2=\"833\" y2=\"26\" style=\"stroke:var(--wire);stroke-width:1\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n<\u002Fsvg>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:14px\">\n<div class=\"pnl\"><div class=\"pnl-k\">Side one — data furnisher<\u002Fdiv><div class=\"pnl-b\">Supplies tradeline and performance data at <strong>no charge<\u002Fstrong>. Consideration received is reciprocal access to everyone else's data.<\u002Fdiv><div class=\"hats\"><span class=\"hat\">PAYS NOTHING<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"pnl\"><div class=\"pnl-k\">Side two — data buyer<\u002Fdiv><div class=\"pnl-b\">Pays <strong>per pull<\u002Fstrong> for reports, scores, attributes and decisioning — including on consumers whose data it contributed itself.<\u002Fdiv><div class=\"hats\"><span class=\"hat\">PAYS PER ENQUIRY<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"pnl\"><div class=\"pnl-k\">Side three — marketplace advertiser<\u002Fdiv><div class=\"pnl-b\">Pays a <strong>referral fee<\u002Fstrong> to be shown to Experian's consumer members as a pre-qualified offer.<\u002Fdiv><div class=\"hats\"><span class=\"hat\">PAYS PER REFERRAL<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\">The buyer is also the supplier. Reciprocity is what disciplines the price in both directions.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Triangle with a single institution at the centre. The three sides are contracted separately and priced independently, but the same counterparty sits behind all three — which is why a pure price rise on side two is disciplined by side one.<\u002Ffigcaption>\n<\u002Ffigure>\n<p><strong>(a) Data furnishers<\u002Fstrong> — banks, card issuers, auto lenders, telecoms, utilities, retailers, debt collectors, and public-record sources. They supply account and performance data at their own cost (Metro 2 in the US, CAIS in the UK) and receive <em>no cash<\u002Fem>. What they receive instead is <strong>reciprocal access<\u002Fstrong>: under the SCOR Principles of Reciprocity (UK) — being replaced by the new Credit Reporting Governance Body following the FCA Credit Information Market Study, with implementation consultation CP26/7 (February 2026) — a furnisher can only <em>draw out<\u002Fem> the data categories it <em>contributes<\u002Fem>. In the US the discipline is contractual and regulatory rather than a single reciprocity code, but the economic effect is the same. Concentration: the furnisher base is broad (US ~1.3bn updates monthly; UK ~350m records across ~400 institutions industry-wide), so no single furnisher is individually decisive — this diffusion is precisely what protects Experian from raw-material hold-up [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>].<\u002Fp>\n<p><strong>(b) Data buyers<\u002Fstrong> — lenders, insurers, telecoms, landlords, employers (where FCRA-permitted), healthcare providers, government, debt collectors and fintechs. Financial Services (US$4,463m, just over half of group revenue) is the dominant buying vertical. A large share of the buying base is <em>also<\u002Fem> furnishing — the essential overlap. Contract structure: enterprise master agreements with permissible-purpose certification, per-inquiry pricing with volume tiers, multi-year terms (North America FY26: <strong>100% renewal<\u002Fstrong> among top strategic financial-services accounts, contract durations extended ~10% to over four years, contract values up double-digits — <span class=\"ev\">CONFIRMED FACT<\u002Fspan>).<\u002Fp>\n<p><strong>(c) Marketplace advertisers<\u002Fstrong> — lenders and insurers who pay Experian (via performance/referral fees) to be shown to consumers Experian has pre-qualified using bureau data. This is the newest role and, per management, the primary driver of FY26 consumer-services growth.<\u002Fp>\n<p><strong>Consequences — where bargaining power actually sits.<\u002Fstrong> When a bank is supplier, customer and advertiser simultaneously, the relationship is a repeated, multi-dimensional game rather than a simple buy/sell. Experian's pricing power on the <em>buy<\u002Fem> side is real (evidenced by the 45% mortgage-revenue jump on flat volume and double-digit renewal uplifts) because (i) the tri-merge structure forces lenders to buy from all three bureaus — they cannot substitute one for another — and (ii) switching costs are high (integration, model re-validation). But that power is <strong>capped by reciprocity<\u002Fstrong>: Experian cannot squeeze a furnisher so hard that it degrades or withdraws its data contribution, because the contribution is what makes the file saleable to everyone else. Reciprocity therefore functions as an implicit price-discipline mechanism — the network only works if the largest contributors stay in, so their effective \"payment\" (free data) is protected by their strategic indispensability. <strong>Analytical inference:<\u002Fstrong> the true locus of power is the <em>network itself<\u002Fem>; neither Experian nor any single bank controls it, which is why the answer to \"who has pricing power when the buyer is also the supplier\" is \"the network position, arbitrated by the reciprocity rules.\"<\u002Fp>\n<h2 id=\"s-ii-3\" class=\"hd hd2\"><span class=\"hn mono\">II.3<\u002Fspan><span class=\"ht\">Jobs to Be Done<\u002Fspan><\u002Fh2>\n<p><strong>Lenders:<\u002Fstrong> assess new applicants; monitor existing books (account review); find and pre-qualify prospects (prescreen); comply with affordability/creditworthiness rules (UK Consumer Duty, US ability-to-repay); detect fraud and verify identity; price risk. What they are <em>actually<\u002Fem> buying is not \"data\" but <strong>a defensible, auditable, regulator-acceptable basis for a lending decision<\u002Fstrong> — the permission and the explainability as much as the number.<\u002Fp>\n<p><strong>Consumers:<\u002Fstrong> understand and improve a score; access credit; protect against identity theft; find a better product; in Brazil, clear a default and exit the <em>negativado<\u002Fem> state. <strong>Conflict:<\u002Fstrong> the consumer's job (\"get me approved / clear my name / pay less\") is partly <em>adverse<\u002Fem> to the lender's job (\"price my risk accurately / decline me if risky\"). Experian sells to both sides of this conflict — the same bureau file that helps a lender decline a consumer is sold back to that consumer as \"monitoring,\" and then the consumer is referred back to lenders for a fee.<\u002Fp>\n<p><strong>Other buyers:<\u002Fstrong> insurers (risk-based pricing, where permitted); telecoms (thin-file onboarding decisions); employers (FCRA-permitted background/employment screening); healthcare providers (identity and coverage, via Experian Health — <em>not<\u002Fem> credit data); landlords (tenant screening).<\u002Fp>\n<h2 id=\"s-ii-4\" class=\"hd hd2\"><span class=\"hn mono\">II.4<\u002Fspan><span class=\"ht\">The Customer Journey — traced separately<\u002Fspan><\u002Fh2>\n<p><strong>B2B:<\u002Fstrong> prospect → contract and permissible-purpose certification → technical integration (API/platform onboarding; the highest switching-cost step) → first inquiry → ongoing usage and cross-sell (bureau → attributes → scores → Ascend → fraud) → renewal. FY26 evidenced very high stickiness: 100% North America strategic renewal, longer durations, higher values, and Ascend embedded across the largest institutions (a multi-year ServiceNow partnership, using Model Context Protocol, extends reach beyond financial services). Sales cycle for enterprise is long (months to quarters); integration burden and model-revalidation cost create the switching moat.<\u002Fp>\n<p><strong>Consumer:<\u002Fstrong> acquisition (free sign-up, often via Boost or a free-score offer) → identity verification (Go uses government ID + selfie) → free score/report and alerts → engagement (EVA virtual assistant, ~3.5m engagements since launch) → <strong>either<\u002Fstrong> upgrade to premium subscription <strong>or<\u002Fstrong> monetisation via marketplace referral. <strong>Funnel economics [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>; company does not disclose paid-conversion rates]:<\u002Fstrong> with 215m free members and Consumer Services revenue of US$2,257m, blended annual revenue per free member is ~US$10.5 (2,257 ÷ 215) — but this is dominated by a small paid/marketplace-active cohort; the vast majority of free members generate little or no direct revenue and exist as <em>marketplace inventory<\u002Fem> and <em>consented-data supply<\u002Fem>. This is the clearest evidence that the free member is the product, not the customer.<\u002Fp>\n<h2 id=\"s-ii-5\" class=\"hd hd2\"><span class=\"hn mono\">II.5<\u002Fspan><span class=\"ht\">The Inverted Value Flow (replaces money-movement) — PRIORITY<\u002Fspan><\u002Fh2>\n<p>Trace one unit of data:<\u002Fp>\n<figure class=\"fig\" id=\"figure-1\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 01<\u002Fspan><span class=\"fig-t\">The Inverted Value Flow<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div class=\"loop\">\n<div class=\"loop-line\"><span class=\"loop-lbl\">Reciprocity closes the loop<\u002Fspan><\u002Fdiv>\n<div class=\"loop-nodes\">\n<div class=\"lnode\"><span class=\"lnum\">1<\u002Fspan><div><div class=\"f-name\">~10,000 furnishers<\u002Fdiv><div class=\"f-meta\">Banks, card issuers, auto and student lenders, telcos, utilities, debt buyers, courts and public-record sources.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode\"><span class=\"lnum\">2<\u002Fspan><div><div class=\"f-name\">Contribute data <span class=\"acc\">FREE<\u002Fspan> — under reciprocity<\u002Fdiv><div class=\"f-meta\">No payment passes to the furnisher. The consideration is access: contribute, or lose the right to pull. There is no procurement line for the core input.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode\"><span class=\"lnum\">3<\u002Fspan><div><div class=\"f-name\">~1.3bn record updates per month<\u002Fdiv><div class=\"f-meta\">Tradelines, balances, payment status, enquiries, public records, identity attributes.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode\"><span class=\"lnum\">4<\u002Fspan><div><div class=\"f-name\">The matching engine<\u002Fdiv><div class=\"f-meta\">Each inbound record is attached to one of ~245m credit-active US consumers. No universal identifier exists. See <span class=\"acc\">Figure 08<\u002Fspan>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode\"><span class=\"lnum\">5<\u002Fspan><div class=\"f-box sig\"><div class=\"f-name\">Aggregation · attributes · models · identity graph<\u002Fdiv><div class=\"f-meta\">This layer — and only this layer — is what Experian owns outright. See <span class=\"acc\">Figure 02<\u002Fspan>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode\"><span class=\"lnum\">6<\u002Fspan><div><div class=\"f-name\">Sold back per pull<\u002Fdiv><div class=\"f-meta\">Priced per enquiry, per score, per attribute set, per platform seat. In mortgage, all three bureaux must be pulled.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"lnode last\"><span class=\"lnum\">7<\u002Fspan><div class=\"f-box solid\"><div class=\"f-name\">The same furnishers pay<\u002Fdiv><div class=\"f-meta\">The supplier of the raw material is the buyer of the finished product — and has no substitute source for it.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\">The raw material arrives free from the parties who then buy the finished product back. There is no procurement cost for the core input.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Circular flow, US bureau. Furnisher count and monthly update volume are company-stated operational figures; the reciprocity condition is contractual and, in the UK, governed by the SCOR Principles of Reciprocity.<\u002Ffigcaption>\n<\u002Ffigure>\n<ul class=\"lst\"><li><strong>(a) Data inflow:<\u002Fstrong> Lender A reports Consumer X's account + performance to Experian under Metro 2 (US) / CAIS (UK), <em>at Lender A's own cost<\u002Fem>, receiving no cash. Permission: statutory + reciprocity.<\u002Fli><li><strong>(b) Processing:<\u002Fstrong> Experian matches the record to X's identity (the hard, value-adding step), appends it to the file, derives attributes and trended variables, and computes scores (FICO/VantageScore). <strong>This is where Experian's proprietary ownership begins<\u002Fstrong> — it does not own the raw tradeline, but it owns the aggregation, the attributes, the identity graph and the models. (FY26: <em>\"Over 90% of our revenue is derived from proprietary data.\"<\u002Fem>)<\u002Fli><li><strong>(c) Data outflow:<\u002Fstrong> Lender B (or Lender A) pulls a report/score on X and <strong>pays per pull<\u002Fstrong>.<\u002Fli><li><strong>(d) Money flow:<\u002Fstrong> cash flows <em>only<\u002Fem> at outflow. There is <strong>no procurement cost for the core input<\u002Fstrong> — the defining inversion. The furnisher's \"payment\" is reciprocal access, an in-kind exchange that never touches the P&amp;L as a cost of goods.<\u002Fli><li><strong>(e) Permission flow:<\u002Fstrong> each pull requires a permissible purpose (US FCRA) or a lawful basis (UK GDPR), certified by the puller; Experian polices this contractually and via audit.<\u002Fli><li><strong>(f) Liability flow:<\u002Fstrong> if the data is wrong, the <strong>furnisher<\u002Fstrong> is liable under FCRA <span class=\"nb\">§623<\u002Fspan> (accuracy of what it reports and its duty to investigate) and the <strong>bureau<\u002Fstrong> under FCRA <span class=\"nb\">§611<\u002Fspan> (its own reinvestigation duty). Liability is <em>joint and split<\u002Fem> — the crux of the CFPB case (<a class=\"xr\" href=\"#s-ii-6\">II.6<\u002Fa>/<a class=\"xr\" href=\"#s-ii-12\">II.12<\u002Fa>).<\u002Fli><\u002Ful>\n<p><strong>The central economic question — if the raw material is free, what is COGS and where is the margin?<\u002Fstrong> Since there is no raw-material cost, gross margin is a function of the cost of <em>manufacturing the file and defending it<\u002Fem>. Decomposition of the cost base [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>; Experian does not publish a COGS bridge]:<\u002Fp>\n<ol class=\"lst\"><li><strong>Matching and identity resolution<\u002Fstrong> — the single most value-additive cost; bad matching creates mixed files and litigation.<\u002Fli><li><strong>Database operations / cloud<\u002Fstrong> — now largely migrated to cloud (North America and Brazil substantially complete ex-Health), with dual-run costs falling from FY27, i.e. this cost is declining.<\u002Fli><li><strong>Model development<\u002Fstrong> — FICO royalties (a <em>pass-through cost<\u002Fem> on score sales — US$4.95/score wholesale in mortgage) plus internal VantageScore/attribute R&amp;D.<\u002Fli><li><strong>Compliance and dispute handling<\u002Fstrong> — the FCRA <span class=\"nb\">§611<\u002Fspan> reinvestigation machinery; both a legal obligation and, per the CFPB suit, a contested cost centre. <strong>Analytical inference: dispute handling is a material share of the consumer-facing cost base<\u002Fstrong> — the CFPB alleges Experian under-invests in it precisely because it is a cost with no direct revenue.<\u002Fli><li><strong>Distribution<\u002Fstrong> — API/platform, resellers, sales.<\u002Fli><\u002Fol>\n<p>FY26 group labour cost was <strong>32% of revenue<\u002Fstrong> (over 300bps lower than two years earlier, per management — a productivity/AI effect). The 28.6% group Benchmark EBIT margin (34.2% in North America) is therefore best read as: <strong>a near-zero-input-cost information asset, taxed mainly by the cost of accuracy, compliance, labour and distribution.<\u002Fstrong> The margin comes from the <em>network position and the derived IP<\u002Fem>, not from any transformation of purchased inputs.<\u002Fp>\n<h2 id=\"s-ii-6\" class=\"hd hd2\"><span class=\"hn mono\">II.6<\u002Fspan><span class=\"ht\">Transaction Teardown<\u002Fspan><\u002Fh2>\n<p><strong>US credit-card application:<\u002Fstrong> Applicant applies → issuer pulls Experian report + score under permissible purpose \"credit transaction initiated by the consumer\" → decision → if declined, FCRA adverse-action notice citing the CRA and key factors → a <strong>hard inquiry<\u002Fstrong> is recorded on the file (a data artefact that itself slightly lowers the score). System: Experian Information Solutions, Inc. Failure mode: wrong-person match, stale tradeline, or an inquiry the consumer disputes.<\u002Fp>\n<p><strong>UK affordability assessment:<\u002Fstrong> Lender combines CAIS bureau data with Open Banking transaction data (categorised income/expenditure) to satisfy Consumer Duty affordability. Entity: Experian Limited. Legal basis: legitimate interests + consumer consent for Open Banking. Failure mode: mis-categorised transactions producing a false affordability read.<\u002Fp>\n<p><strong>Prescreen / pre-qualification campaign:<\u002Fstrong> Lender specifies criteria → Experian returns a list of pre-qualified consumers (permissible purpose: \"firm offer of credit\") → the firm-offer-of-credit obligation attaches (the lender must honour the offer to those who meet the pre-set criteria). This is the B2B twin of the consumer marketplace.<\u002Fp>\n<p><strong>Consumer dispute (the CFPB transaction):<\u002Fstrong> Consumer disputes a tradeline → Experian must, under FCRA <span class=\"nb\">§611<\u002Fspan>, conduct a reasonable reinvestigation within 30 days → it forwards the dispute to the furnisher, which must investigate under <span class=\"nb\">§623<\u002Fspan> → outcome reported back. <strong>What the CFPB (complaint filed 7 January 2025, C.D. Cal., against Experian Information Solutions, Inc.) alleges Experian does wrong:<\u002Fstrong> (i) <em>\"sham investigations\"<\u002Fem> — faulty intake that does not accurately convey all relevant dispute information to the furnisher, and failure to pass consumer-submitted documentation to furnishers; (ii) <em>uncritical deference<\u002Fem> — routinely accepting the furnisher's response <em>\"even when that response was improbable or illogical on its face,\"<\u002Fem> or when Experian has other information suggesting the furnisher is unreliable; (iii) <em>defective result notices<\u002Fem> — sending consumers notices that are <em>\"confusing, ambiguous, incorrect, or internally inconsistent\"<\u002Fem>; (iv) <em>improper reinsertion<\u002Fem> — failing to implement basic matching tools, so a previously deleted inaccurate tradeline reappears under a new furnisher's name. Director Rohit Chopra: <em>\"When consumers disputed errors on their credit reports, Experian conducted sham investigations rather than properly reviewing the disputes as required by federal law.\"<\u002Fem> The CFPB pleads both FCRA violations and the CFPA prohibition on unfair acts/practices, and seeks injunctive relief, redress and a civil money penalty. <strong>Case status:<\u002Fstrong> the court <strong>denied Experian's motion to dismiss the second amended complaint on 22 October 2025<\u002Fstrong>; Experian answered on 3 November 2025; <strong>discovery is ongoing<\u002Fstrong>. Experian calls the suit \"without merit.\" <strong>This is the failure path that is simultaneously a legal duty, a cost centre and live federal litigation.<\u002Fstrong><\u002Fp>\n<p><strong>Limpa Nome renegotiation (Brazil):<\u002Fstrong> Consumer checks CPF free on the Serasa app/site/WhatsApp → sees discounted settlement offers (up to 90%, up to 99% during the Feirão) from 2,200+ creditors → selects and pays via Pix/boleto (Serasa intermediates payment through its payment institution, PagueVeloz) → creditor requests removal of the negativação within five business days. <strong>Who pays Experian and how much:<\u002Fstrong> the <em>consumer pays nothing<\u002Fem> to Serasa (only the negotiated debt to the creditor); Serasa is paid by the <strong>creditor<\u002Fstrong> on a credit-recovery basis (the platform is marketed to creditors as turning <em>\"inadimplência into receita\"<\u002Fem>). The <strong>exact commission/success-fee rate is not publicly disclosed — <span class=\"ev unk\">UNKNOWN<\u002Fspan>.<\u002Fstrong> Scale [<span class=\"ev\">CONFIRMED FACT<\u002Fspan> / <span class=\"ev\">COMPANY CLAIM<\u002Fspan>]: <em>\"Limpa Nome, our debt renegotiation business, continues to help millions of consumers, with US$19.4bn of consumer debt renegotiated in FY26\"<\u002Fem>; Experian's financial-health page states 14 million people in Brazil used the portal to renegotiate ~US$19.5bn in FY26; 30m+ credit agreements renegotiated in Latin America in the year; 600m+ debts listed.<\u002Fp>\n<p><strong>Marketplace referral (US):<\u002Fstrong> Consumer sees a pre-qualified card/loan/insurance/mortgage offer (No Ding Decline avoids a hard-inquiry ding on decline) → clicks → applies → is approved → the lender pays Experian a <strong>referral/performance/origination fee<\u002Fstrong>. Recognition is on a net basis at the qualifying event (application/approval/origination depending on contract). Exact per-referral economics: <strong><span class=\"ev unk\">UNKNOWN<\u002Fspan><\u002Fstrong> (commercially confidential); structurally these are CPA or revenue-share fees.<\u002Fp>\n<h2 id=\"s-ii-7\" class=\"hd hd2\"><span class=\"hn mono\">II.7<\u002Fspan><span class=\"ht\">Distribution Architecture<\u002Fspan><\u002Fh2>\n<p>Routes to counterparty: (1) <strong>direct enterprise sales<\u002Fstrong> to large lenders (highest value, Experian controls the relationship, deepest data access, strategic); (2) <strong>mid-market / small-business<\u002Fstrong> channels (Ascend democratises analytics down-market); (3) <strong>API / developer self-service<\u002Fstrong>; (4) <strong>resellers and mortgage tri-merge resellers<\u002Fstrong> (Experian shares the relationship and margin, but tri-merge resellers are a control choke-point in mortgage); (5) <strong>platform partnerships<\u002Fstrong> — loan-origination systems, core-banking providers, POS/BNPL, and the new ServiceNow and TazWorks integrations (embeds Experian inside others' workflows, high strategic value, medium relationship control); (6) <strong>consumer app/web<\u002Fstrong>; (7) <strong>affiliate / comparison-site<\u002Fstrong> partnerships (consumer marketplace demand); (8) <strong>embedded distribution<\u002Fstrong> inside client products (a <em>\"significant new multi-year partnership with a leading USA bank\"<\u002Fem> will extend Experian premium credit/identity capabilities into the bank's own customer base from FY27 — Partner Solutions).<\u002Fp>\n<h2 id=\"s-ii-8\" class=\"hd hd2\"><span class=\"hn mono\">II.8<\u002Fspan><span class=\"ht\">Pricing Architecture<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Per-inquiry report/score pricing:<\u002Fstrong> volume-tiered, confidential. <span class=\"ev unk\">UNKNOWN<\u002Fspan> at list level.<\u002Fli><li><strong>US mortgage tri-merge — the clearest public window.<\u002Fstrong> FICO wholesal
