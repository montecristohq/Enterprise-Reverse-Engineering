2Fspan><span><span class=\"key\" style=\"background:none;border-color:var(--steel)\"><\u002Fspan>Reconciling addition<\u002Fspan><span><span class=\"key acc\"><\u002Fspan>The largest single adjustment<\u002Fspan><\u002Fdiv>\n<div class=\"f-lbl\" style=\"margin-top:26px\">Inset — acquisition-intangible amortisation, <span class=\"mono\">US$m<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:96px 1fr 76px;gap:8px 14px;align-items:center;margin-top:10px\">\n<div class=\"mono\" style=\"font-size:15px\">FY22<\u002Fdiv><div class=\"bar\" style=\"height:16px;margin:0\"><span class=\"barf\" style=\"height:16px;width:64.2%\"><\u002Fspan><\u002Fdiv><div class=\"mono\" style=\"text-align:right\">174<\u002Fdiv>\n<div class=\"mono\" style=\"font-size:15px\">FY25<\u002Fdiv><div class=\"bar\" style=\"height:16px;margin:0\"><span class=\"barf\" style=\"height:16px;width:77.9%\"><\u002Fspan><\u002Fdiv><div class=\"mono\" style=\"text-align:right\">211<\u002Fdiv>\n<div class=\"mono\" style=\"font-size:15px;color:var(--acc)\">FY26<\u002Fdiv><div class=\"bar\" style=\"height:16px;margin:0\"><span class=\"barf hi\" style=\"height:16px;width:100%\"><\u002Fspan><\u002Fdiv><div class=\"mono\" style=\"text-align:right;color:var(--acc)\">271<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"fig-note\">Waterfall, FY26, US$m. Benchmark PBT is a non-GAAP measure; statutory PBT is the IFRS figure.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>The largest adjustment rises every year, because the company acquires every year. For a serial acquirer this is a permanent cost of strategy, excluded from the number the market prices.<\u002Ffigcaption>\n<\u002Ffigure>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Reconciling item<\u002Fth><th>FY26<\u002Fth><th>FY25<\u002Fth><th>Recurring?<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><strong>Benchmark PBT<\u002Fstrong><\u002Ftd><td><strong>2,212<\u002Fstrong><\u002Ftd><td><strong>1,926<\u002Fstrong><\u002Ftd><td>—<\u002Ftd><\u002Ftr><tr><td>Exceptional items<\u002Ftd><td>(20)<\u002Ftd><td>(39)<\u002Ftd><td>Recurs (restructuring/cloud)<\u002Ftd><\u002Ftr><tr><td>Amortisation of acquisition intangibles<\u002Ftd><td>(271)<\u002Ftd><td>(211)<\u002Ftd><td><strong>Recurs — rising every year<\u002Fstrong><\u002Ftd><\u002Ftr><tr><td>Acquisition &amp; disposal expenses<\u002Ftd><td>(59)<\u002Ftd><td>(37)<\u002Ftd><td><strong>Recurs — serial acquirer<\u002Fstrong><\u002Ftd><\u002Ftr><tr><td>Adjustment to fair value of contingent consideration<\u002Ftd><td>+2<\u002Ftd><td>(1)<\u002Ftd><td>Volatile<\u002Ftd><\u002Ftr><tr><td>Interest on tax liabilities<\u002Ftd><td>(14)<\u002Ftd><td>(4)<\u002Ftd><td>Recurs<\u002Ftd><\u002Ftr><tr><td>Financing fair-value remeasurements<\u002Ftd><td>+101<\u002Ftd><td>(85)<\u002Ftd><td>Genuinely volatile<\u002Ftd><\u002Ftr><tr><td><strong>Statutory PBT<\u002Fstrong><\u002Ftd><td><strong>1,951<\u002Fstrong><\u002Ftd><td><strong>1,549<\u002Fstrong><\u002Ftd><td>—<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>Total non-benchmark deduction: US$261m in FY26 (US$377m in FY25). Decomposed further from the company's Appendix 3: exceptional items US$20m; amortisation/impairment of acquisition intangibles US$271m; \"other adjustments\" −US$30m (a net credit in FY26, driven by the +US$101m financing gain offsetting acquisition expenses and interest-on-tax).<\u002Fp>\n<p><strong>Amortisation of acquisition intangibles across years (US$m) [CONFIRMED]:<\u002Fstrong> FY22 174; FY25 211; FY26 271. It rises monotonically because Experian completes acquisitions every year, each one creating new customer-relationship and technology intangibles amortised over 2–20 years. This is <strong>not a one-off, non-cash artefact; it is the recurring economic cost of maintaining growth by acquisition.<\u002Fstrong><\u002Fp>\n<p><strong>Exceptional items [CONFIRMED]:<\u002Fstrong> FY22 26; FY25 39; FY26 20. Small but ever-present, dominated by restructuring and cloud-migration costs (FY26 restructuring US$28m, FY25 US$50m). An item labelled \"exceptional\" that appears every single year is, in substance, an operating cost.<\u002Fp>\n<p><strong>Financing fair-value remeasurements (+US$101m FY26 vs −US$85m FY25)<\u002Fstrong> are genuinely market-driven (mostly retranslation of Brazilian real intra-group funding — US$82m of the US$87m non-cash financing gain) and are defensibly excluded; their exclusion cuts both ways across years and is not a systematic flatter.<\u002Fp>\n<p><strong>Verdict — how much is legitimate normalisation vs a serial acquirer excluding its own strategy's cost?<\u002Fstrong> The financing remeasurement exclusion is legitimate. The amortisation of acquisition intangibles (US$271m) and the recurring acquisition/disposal expenses (US$59m) — together US$330m, or ~15% of Benchmark PBT — are, for a perpetual acquirer, a <strong>permanent cost dressed as an adjustment<\u002Fstrong>. Equifax and TransUnion (US GAAP) run analogous adjusted-EBITDA/adjusted-EPS measures that likewise exclude amortisation of acquired intangibles and acquisition costs, so Experian's practice is industry-normal; but \"industry-normal\" is not the same as \"economically neutral,\" and the market prices Benchmark EPS (179.8c) rather than statutory EPS (164.5c) — a 9.3% premium the reader should keep in view.<\u002Fp>\n<h2 id=\"s-iv-9\" class=\"hd hd2\"><span class=\"hn mono\">IV.9<\u002Fspan><span class=\"ht\">Balance Sheet Teardown<\u002Fspan><\u002Fh2>\n<p>At 31 March 2026 (US$m) [CONFIRMED, Group balance sheet]:<\u002Fp>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Line<\u002Fth><th>FY26<\u002Fth><th>FY25<\u002Fth><th>Note<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Goodwill<\u002Ftd><td>7,261<\u002Ftd><td>6,654<\u002Ftd><td>Dominant asset; residue of 30 years of M&amp;A<\u002Ftd><\u002Ftr><tr><td>Other intangible assets<\u002Ftd><td>3,078<\u002Ftd><td>2,855<\u002Ftd><td>Acquisition intangibles + internally generated software<\u002Ftd><\u002Ftr><tr><td>Property, plant &amp; equipment<\u002Ftd><td>337<\u002Ftd><td>350<\u002Ftd><td>Genuinely asset-light<\u002Ftd><\u002Ftr><tr><td>Trade &amp; other receivables (current)<\u002Ftd><td>2,315<\u002Ftd><td>1,684<\u002Ftd><td>Sharp rise — monitor DSO<\u002Ftd><\u002Ftr><tr><td>Cash &amp; equivalents<\u002Ftd><td>328<\u002Ftd><td>368<\u002Ftd><td>Thin cash; relies on facilities<\u002Ftd><\u002Ftr><tr><td>Borrowings (current + non-current)<\u002Ftd><td>5,565<\u002Ftd><td>5,016<\u002Ftd><td>900 current + 4,665 non-current<\u002Ftd><\u002Ftr><tr><td>Provisions (current + non-current)<\u002Ftd><td>25<\u002Ftd><td>24<\u002Ftd><td><strong>No litigation provision evident<\u002Fstrong><\u002Ftd><\u002Ftr><tr><td>Net assets<\u002Ftd><td>5,583<\u002Ftd><td>5,090<\u002Ftd><td><\u002Ftd><\u002Ftr><tr><td>Capital employed (per Note 5(q))<\u002Ftd><td>10,720<\u002Ftd><td>9,732<\u002Ftd><td>Increase \"largely acquisition related\"<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>Retained earnings of US$22,210m are offset by other reserves of −US$18,629m — the accounting residue of the 2006 demerger from GUS. Net current liabilities of US$467m are normal for a business that bills clients in advance and funds itself in the capital markets.<\u002Fp>\n<p><strong>Software capitalisation (a key accounting-quality question) [CONFIRMED policy; subagent-verified]:<\u002Fstrong> Internally generated software is amortised over 3–10 years (average ~5 years for non-acquisition intangibles); acquisition intangibles over 2–20 years. FY26 \"purchase of other intangible assets\" (cash flow) was US$677m — the capitalised development spend that builds the platform. The scale of capitalisation (≈8% of revenue) materially supports current-period margin: if this spend were expensed rather than capitalised, Benchmark EBIT would be lower. The split of the US$3,078m \"other intangibles\" balance between acquisition intangibles and internally generated software is not separately disclosed in the preliminary announcement [<span class=\"ev unk\">UNKNOWN<\u002Fspan> — in the full AR2026 note].<\u002Fp>\n<p><strong>Receivables:<\u002Fstrong> the jump in current trade and other receivables from US$1,684m to US$2,315m (+37%) outpaces revenue growth (+12%) and warrants monitoring; part is acquisition-related, but rising DSO would be an early quality-of-earnings flag [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>].<\u002Fp>\n<h2 id=\"s-iv-10\" class=\"hd hd2\"><span class=\"hn mono\">IV.10<\u002Fspan><span class=\"ht\">Cash Flow and Conversion<\u002Fspan><\u002Fh2>\n<p>FY26 reconciliation (US$m) [CONFIRMED, cash-flow summary]:<\u002Fp>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Step<\u002Fth><th>FY26<\u002Fth><th>FY25<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Benchmark EBIT<\u002Ftd><td>2,397<\u002Ftd><td>2,083<\u002Ftd><\u002Ftr><tr><td>+ Amortisation &amp; depreciation<\u002Ftd><td>613<\u002Ftd><td>547<\u002Ftd><\u002Ftr><tr><td>= Benchmark EBITDA<\u002Ftd><td>3,010<\u002Ftd><td>2,630<\u002Ftd><\u002Ftr><tr><td>+ Impairment charged to EBIT<\u002Ftd><td>6<\u002Ftd><td>15<\u002Ftd><\u002Ftr><tr><td>− Net capital expenditure<\u002Ftd><td>(718)<\u002Ftd><td>(650)<\u002Ftd><\u002Ftr><tr><td>− Increase in working capital<\u002Ftd><td>(163)<\u002Ftd><td>(54)<\u002Ftd><\u002Ftr><tr><td>− Principal lease payments<\u002Ftd><td>(48)<\u002Ftd><td>(41)<\u002Ftd><\u002Ftr><tr><td>± Associates / share incentives<\u002Ftd><td>134<\u002Ftd><td>125<\u002Ftd><\u002Ftr><tr><td>= <strong>Benchmark operating cash flow<\u002Fstrong><\u002Ftd><td><strong>2,221<\u002Fstrong><\u002Ftd><td><strong>2,025<\u002Fstrong><\u002Ftd><\u002Ftr><tr><td>− Net interest paid<\u002Ftd><td>(198)<\u002Ftd><td>(165)<\u002Ftd><\u002Ftr><tr><td>− Tax paid<\u002Ftd><td>(438)<\u002Ftd><td>(447)<\u002Ftd><\u002Ftr><tr><td>= <strong>Benchmark free cash flow<\u002Fstrong><\u002Ftd><td><strong>1,583<\u002Fstrong><\u002Ftd><td><strong>1,411<\u002Fstrong><\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>Cash conversion 93% (2,221/2,397). Statutory cash generated from operations was US$2,875m. Capex at 8.6% of revenue (guided toward ~7%) is high for a supposedly asset-light business — the \"cost of a free input\" is a continuous, large reinvestment in the platform and data that produces it. The cash cost of exceptional/non-benchmark items was only US$34m — cheap. Benchmark measures modestly flatter cash by excluding acquisition-related outflows, but the gap is small; cash generation is genuinely high-quality. After maintaining the platform (~US$677m intangible capex) and funding the dividend (US$590m ordinary paid), roughly US$1bn+ of genuine discretionary cash remains for M&amp;A and buybacks.<\u002Fp>\n<h2 id=\"s-iv-11\" class=\"hd hd2\"><span class=\"hn mono\">IV.11<\u002Fspan><span class=\"ht\">Capital Intensity and Return on Capital<\u002Fspan><\u002Fh2>\n<p>ROCE 17.2% = Benchmark EBIT less tax at the Benchmark rate, divided by average capital employed (US$10,720m at year-end; average of ~US$10,226m). Sanity check: Benchmark EBIT US$2,397m × (1 − 25.5%) = US$1,786m; 1,786 / ~10,226 ≈ 17.5% — consistent with the 17.2% reported on the precise averaging basis [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> confirms the disclosed figure].<\u002Fp>\n<p>The goodwill-heavy balance sheet (US$7,261m goodwill, US$3,078m other intangibles) depresses reported ROCE. <strong>Return on tangible capital [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]:<\u002Fstrong> stripping the US$7,261m of goodwill from the US$10,720m capital employed leaves ~US$3.46bn of tangible/working capital; US$1,786m post-tax Benchmark EBIT on that base implies a return above 50%. This is the mechanical signature of a business whose true \"capital\" is off-balance-sheet data, and whose on-balance-sheet capital is largely the accounting price paid for acquisitions. <strong>Is growth capital-light? Organically, yes; in aggregate, no<\u002Fstrong> — the 8.6% capex ratio plus ~US$800m/yr of M&amp;A mean incremental growth consumes real capital. The \"capital-light\" label describes the <em>organic core<\u002Fem>, not the <em>reported enterprise<\u002Fem>.<\u002Fp>\n<h2 id=\"s-iv-12\" class=\"hd hd2\"><span class=\"hn mono\">IV.12<\u002Fspan><span class=\"ht\">Debt, Funding and Liquidity<\u002Fspan><\u002Fh2>\n<p>Net debt US$5,179m at 31 March 2026 (up from US$4,684m), at 1.7x Benchmark EBITDA — <strong>below the stated 2.0–2.5x target range<\u002Fstrong> [CONFIRMED]. Debt is issued principally through <strong>Experian Finance plc<\u002Fstrong> (a US$6bn Euro Medium-Term Note programme, the former GUS financing vehicle) and <strong>Experian Europe DAC<\u002Fstrong>, both guaranteed by Experian plc [CONFIRMED, Moody's]. Credit ratings: <strong>Baa1 (Moody's) / BBB+ (S&amp;P)<\u002Fstrong>, with a stated policy to maintain \"a strong investment grade credit rating (BBB+ / Baa1 or above)\" [CONFIRMED]. FY26 net interest US$185m at an average rate of ~3.6% (benefiting from a rate-hedging programme); FY27 guided to US$250–260m (reflecting acquisition financing and Own Up/Konfir, both closed 1 April 2026). Undrawn committed facilities US$2.5bn. <strong>The leverage policy does not currently constrain M&amp;A or buybacks<\u002Fstrong> — running below the bottom of its own range, Experian has explicit headroom, which is why it could simultaneously spend US$792m on acquisitions, pay a US$590m dividend and execute US$725m of buybacks in FY26.<\u002Fp>\n<h2 id=\"s-iv-13\" class=\"hd hd2\"><span class=\"hn mono\">IV.13<\u002Fspan><span class=\"ht\">The Litigation and Regulatory Contingency<\u002Fspan><\u002Fh2>\n<p><strong>CFPB v. Experian Information Solutions, Inc.<\u002Fstrong> (filed 7 January 2025, Central District of California) alleges \"sham investigations\" of disputes under FCRA. Procedural history [CONFIRMED, CFPB docket/CourtListener]: motion to dismiss granted in part 5 May 2025; amended complaint 6 June 2025; further dismissal 6 August 2025; second amended complaint 22 August 2025; <strong>motion to dismiss denied 22 October 2025<\u002Fstrong>; Experian answered 3 November 2025; the CFPB's motion to strike affirmative defenses was heard 30 January 2026; <strong>jury trial set for 21 September 2026<\u002Fstrong>. Experian calls the suit \"completely without merit\" and states it does \"not expect this to have any material impact on our business\" [<span class=\"ev\">COMPANY CLAIM<\u002Fspan>].<\u002Fp>\n<p><strong>Provision status [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]:<\u002Fstrong> total balance-sheet provisions are only US$18m current + US$7m non-current — consistent with routine matters and indicating <strong>no material provision has been recognised for the CFPB case<\u002Fstrong>, which is standard where an outflow is not assessed as probable and reliably estimable. The full contingent-liabilities note (in AR2026) would carry the qualitative disclosure [not in the preliminary announcement — flagged].<\u002Fp>\n<p><strong>Historical cost benchmarks [CONFIRMED]:<\u002Fstrong> the 2012/2015 breaches produced a 40-state multistate settlement of <strong>US$13.67m with Experian<\u002Fstrong> (November 2022), alongside a separate <strong>US$2.43m settlement with T-Mobile<\u002Fstrong>; FCRA class actions have settled in the low tens of millions (e.g., Hill-Green \"Fraud Shield\" ~US$22.45m; a T-Mobile breach class action ~US$22m).<\u002Fp>\n<p><strong>Outcome model [<span class=\"ev\">HYPOTHESIS<\u002Fspan>]:<\u002Fstrong> (i) <em>Dismissal/settlement with a civil money penalty<\u002Fem> — tens of millions, immaterial to a group earning US$2.2bn Benchmark PBT; (ii) <em>Adverse judgment with a penalty plus redress<\u002Fem> — potentially low hundreds of millions, a one-off, still manageable; (iii) <strong>the material scenario — mandated remediation of the dispute system.<\u002Fstrong> <a class=\"xr\" href=\"#part-iii\">Volume III<\u002Fa> established that the dispute operation is deliberately low-cost (as low as US$0.57 per letter). A court-mandated requirement to conduct substantive, human-reviewed investigations across &gt;12 million disputes a year could raise the run-rate cost by an order of magnitude — the recurring margin risk, not the one-off fine, is the real financial exposure. This is the point where the report's central paradox becomes a P&amp;L line.<\u002Fp>\n<h2 id=\"s-iv-14\" class=\"hd hd2\"><span class=\"hn mono\">IV.14<\u002Fspan><span class=\"ht\">Capital Allocation and Return on a Thirty-Year Acquisition Programme [PRIORITY DEPTH]<\u002Fspan><\u002Fh2>\n<p><strong>Material acquisitions [CONFIRMED]:<\u002Fstrong><\u002Fp>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Deal<\u002Fth><th>Date<\u002Fth><th>Price<\u002Fth><th>Notes<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Serasa (initial 65%)<\u002Ftd><td>June 2007<\u002Ftd><td>R$2.32bn / US$1.2bn<\u002Ftd><td>Transformative Brazil entry<\u002Ftd><\u002Ftr><tr><td>Serasa (to 70%)<\u002Ftd><td>Oct 2007<\u002Ftd><td>R$138m / US$72m<\u002Ftd><td><\u002Ftd><\u002Ftr><tr><td>Serasa (remaining 29.6%, to 99.6%)<\u002Ftd><td>Oct 2012<\u002Ftd><td>R$3.1bn / US$1.5bn<\u002Ftd><td>Bought out Itaú/Bradesco/Santander/HSBC<\u002Ftd><\u002Ftr><tr><td>Tapad<\u002Ftd><td>Nov 2020<\u002Ftd><td>~US$280m<\u002Ftd><td>North America digital identity<\u002Ftd><\u002Ftr><tr><td>ClearScore<\u002Ftd><td>Blocked 2019<\u002Ftd><td>—<\u002Ftd><td>CMA prohibited<\u002Ftd><\u002Ftr><tr><td>illion<\u002Ftd><td>30 Sept 2024<\u002Ftd><td>A$820m<\u002Ftd><td>ANZ bureau; ~A$175m revenue, ~A$65m EBITDA first full year<\u002Ftd><\u002Ftr><tr><td>Audigent<\u002Ftd><td>Dec 2024<\u002Ftd><td>Undisclosed<\u002Ftd><td>AdTech, North America<\u002Ftd><\u002Ftr><tr><td>ClearSale<\u002Ftd><td>Completed 1 Apr 2025<\u002Ftd><td>up to R$1,905m<\u002Ftd><td>Brazil transactional fraud<\u002Ftd><\u002Ftr><tr><td>NeuroID<\u002Ftd><td>FY25<\u002Ftd><td>Undisclosed<\u002Ftd><td>Behavioural fraud, in Ascend<\u002Ftd><\u002Ftr><tr><td>KYC360<\u002Ftd><td>Oct 2025<\u002Ftd><td>Undisclosed<\u002Ftd><td>UK financial-crime<\u002Ftd><\u002Ftr><tr><td>AtData<\u002Ftd><td>Oct 2025<\u002Ftd><td>Undisclosed<\u002Ftd><td>10bn+ email addresses<\u002Ftd><\u002Ftr><tr><td>Own Up<\u002Ftd><td>Post-FY26 (1 Apr 2026)<\u002Ftd><td>Undisclosed<\u002Ftd><td>US mortgage marketplace<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>FY26 acquisition spend US$792m (down from US$1,244m in FY25). Management expects completed acquisitions to contribute ~1% of growth in FY27 and to dilute margin by ~50bps near-term before synergies.<\u002Fp>\n<p><strong>Goodwill impairment history [CONFIRMED, subagent-verified against AR2022/FY23-FY24 notes]:<\u002Fstrong> Experian <strong>has<\u002Fstrong> impaired acquired goodwill, but only twice in ~15 years and only in the weakest region — <strong>US$53m in FY21 and US$179m in FY23, both in EMEA/Asia Pacific<\u002Fstrong> (accumulated goodwill impairment reached US$246m by 31 March 2023 and was unchanged through FY24). <strong>The North America, Latin America and UK &amp; Ireland cash-generating units have never been impaired.<\u002Fstrong> Separately, US$27m of internally generated software was impaired in FY21 on a technology-estate upgrade. No Tapad-specific write-down has been disclosed (Tapad sits in North America Data, which has never been impaired).<\u002Fp>\n<p><strong>Has the programme created value above the cost of capital?<\u002Fstrong> [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, defensible judgement:]<\u002Fp>\n<ul class=\"lst\"><li><em>Core deals — clearly yes.<\u002Fem> Serasa is the paradigm: acquired for a combined ~US$2.8bn across 2007–2012, it anchors a Latin America segment now generating US$1,297m of revenue at a 30.8% margin (~US$399m Benchmark EBIT), and it has never been impaired. North America bolt-ons (Tapad, verification assets, Clarity) feed the 34.2%-margin engine.<\u002Fli><li><em>Edge deals — value-destructive.<\u002Fem> The ~US$232m of cumulative EMEA/AP goodwill impairment is the honest scorecard of deals that did not work in structurally sub-scale markets.<\u002Fli><li><em>Aggregate returns exceed the cost of capital:<\u002Fem> ROCE of 17.2% versus a ~8–9% WACC, sustained \"mid-to-high teens over the past decade\" per management, while the base compounds organically at 8%. But the <strong>recurring US$271m amortisation of acquisition intangibles is the perpetual toll<\u002Fstrong> the strategy pays, and the market should treat it as a real (if non-cash) cost of the growth algorithm.<\u002Fli><\u002Ful>\n<p><strong>Buybacks:<\u002Fstrong> US$725m executed in FY26; a new US$1bn programme runs to 30 June 2027; the FY26 closing share count fell to 899m (from ~914m weighted average). Buying back stock at a mid-30s earnings multiple destroys value unless per-share compounding continues at the historical rate — defensible given the growth record, but not risk-free if the mortgage windfall reverses. FY27 guidance assumes WANOS of 880–885m, i.e. continued reduction.<\u002Fp>\n<p><strong>Overall judgement:<\u002Fstrong> serial acquisition is <strong>both<\u002Fstrong> value-creating strategy in the core <strong>and<\u002Fstrong> growth-maintenance at the edge. It has compounded the franchise, but a meaningful slice of \"growth\" is the perpetual purchase of the next intangible, whose amortisation is then excluded from the number the market prices.<\u002Fp>\n<h2 id=\"s-iv-15\" class=\"hd hd2\"><span class=\"hn mono\">IV.15<\u002Fspan><span class=\"ht\">One Dollar of Group Revenue (FY26, per US$1 of statutory revenue US$8,445m)<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Destination<\u002Fth><th>Cents<\u002Fth><th>Basis<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Labour<\u002Ftd><td>31.8¢<\u002Ftd><td>Benchmark<\u002Ftd><\u002Ftr><tr><td>Data &amp; IT (incl. cloud, FICO pass-through)<\u002Ftd><td>19.2¢<\u002Ftd><td>Benchmark<\u002Ftd><\u002Ftr><tr><td>Amortisation &amp; depreciation<\u002Ftd><td>7.3¢<\u002Ftd><td>Benchmark<\u002Ftd><\u002Ftr><tr><td>Marketing &amp; customer acquisition<\u002Ftd><td>7.1¢<\u002Ftd><td>Benchmark<\u002Ftd><\u002Ftr><tr><td>Other operating (compliance, disputes)<\u002Ftd><td>6.3¢<\u002Ftd><td>Benchmark<\u002Ftd><\u002Ftr><tr><td><strong>= Benchmark operating profit<\u002Fstrong><\u002Ftd><td><strong>~28.4¢<\u002Fstrong><\u002Ftd><td><\u002Ftd><\u002Ftr><tr><td>less amortisation of acquisition intangibles<\u002Ftd><td>3.2¢<\u002Ftd><td>Non-benchmark<\u002Ftd><\u002Ftr><tr><td>less other non-benchmark items (net)<\u002Ftd><td>~1.0¢<\u002Ftd><td><\u002Ftd><\u002Ftr><tr><td><strong>= statutory operating profit<\u002Fstrong><\u002Ftd><td><strong>24.2¢<\u002Fstrong><\u002Ftd><td><\u002Ftd><\u002Ftr><tr><td>less net finance<\u002Ftd><td>1.2¢<\u002Ftd><td><\u002Ftd><\u002Ftr><tr><td><strong>= statutory PBT<\u002Fstrong><\u002Ftd><td><strong>23.1¢<\u002Fstrong><\u002Ftd><td><\u002Ftd><\u002Ftr><tr><td>less tax<\u002Ftd><td>5.2¢<\u002Ftd><td>(22.7% statutory rate)<\u002Ftd><\u002Ftr><tr><td><strong>= retained profit<\u002Fstrong><\u002Ftd><td><strong>~17.9¢<\u002Fstrong><\u002Ftd><td><\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>B2B vs Consumer Services differ in shape [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]:<\u002Fstrong> B2B carries the heavier fixed data/platform cost (more of the Data &amp; IT 19.2¢) and little marketing, landing at a 30.9% margin. Consumer Services carries most of the marketing/customer-acquisition load (the bulk of the 7.1¢) but recognises marketplace revenue <em>net<\u002Fem>, which keeps its margin at 29.6% despite the acquisition spend — the net-recognition accounting is what makes a marketing-heavy consumer business look as profitable as the B2B bureau.<\u002Fp>\n<h2 id=\"s-iv-16\" class=\"hd hd2\"><span class=\"hn mono\">IV.16<\u002Fspan><span class=\"ht\">Economic Driver Tree<\u002Fspan><\u002Fh2>\n<p>Bureau revenue = files held × permissible-purpose inquiries per file × price per inquiry. FY26 demonstrated the <strong>price<\u002Fstrong> term dominating (mortgage +45% on flat volume). The full frame:<\u002Fp>\n<blockquote><p>(files × inquiries/file × price/inquiry) + platform/software subscription + (members × [subscription conversion × ARPU + referrals × fee]) + vertical revenue (Health, Automotive, Marketing) − labour − technology/cloud − data operations − disputes/compliance − FICO royalty − marketing = Benchmark EBIT − amortisation of acquisition intangibles − exceptionals − interest − tax = statutory profit.<\u002Fp><\u002Fblockquote>\n<p><strong>The five variables explaining most outcomes:<\u002Fstrong> (1) US Financial Services inquiry pricing (above all mortgage); (2) US origination volumes; (3) Consumer marketplace referral volume × fee; (4) labour cost as a % of revenue (the productivity lever); (5) cloud dual-run roll-off. Secondary: Brazilian real translation, acquisition-intangible amortisation, net interest.<\u002Fp>\n<h2 id=\"s-iv-17\" class=\"hd hd2\"><span class=\"hn mono\">IV.17<\u002Fspan><span class=\"ht\">Scenario and Sensitivity Analysis [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> unless stated]<\u002Fspan><\u002Fh2>\n<div class=\"tw wide\"><table class=\"tbl\"><thead><tr><th>Scenario<\u002Fth><th>Revenue by segment<\u002Fth><th>Benchmark EBIT / margin<\u002Fth><th>Statutory profit<\u002Fth><th>Cash / leverage / buyback<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>US mortgage price normalisation<\u002Ftd><td>NA Financial Services falls sharply (reverses much of +45%)<\u002Ftd><td>Margin dilutive (high-drop-through revenue lost)<\u002Ftd><td>Falls<\u002Ftd><td>Lower FCF; buyback capacity trimmed<\u002Ftd><\u002Ftr><tr><td>US origination downturn<\u002Ftd><td>NA transactional down; cushioned by collections/Consumer<\u002Ftd><td>Modest drag<\u002Ftd><td>Falls<\u002Ftd><td>Manageable at 1.7x<\u002Ftd><\u002Ftr><tr><td>VantageScore share gain<\u002Ftd><td>Broadly neutral (Experian sells both; data pull persists; FICO royalty is pass-through)<\u002Ftd><td>Neutral-to-slightly-negative<\u002Ftd><td>Neutral<\u002Ftd><td>Neutral<\u002Ftd><\u002Ftr><tr><td>Adverse CFPB outcome w/ remediation<\u002Ftd><td>Revenue unaffected; <strong>cost base steps up<\u002Fstrong><\u002Ftd><td><strong>Recurring margin drag<\u002Fstrong><\u002Ftd><td>Falls<\u002Ftd><td>Reputational; buyback unaffected short-term<\u002Ftd><\u002Ftr><tr><td>Material data breach<\u002Ftd><td>Revenue tail risk; settlement precedent ~US$14m<\u002Ftd><td>One-off<\u002Ftd><td>One-off hit<\u002Ftd><td>Immaterial financially; reputational tail<\u002Ftd><\u002Ftr><tr><td>Legislative removal of data (medical-debt precedent)<\u002Ftd><td>File richness erodes → follow-the-data-right risk<\u002Ftd><td>Structural drag<\u002Ftd><td>Falls<\u002Ftd><td>Long-term franchise risk<\u002Ftd><\u002Ftr><tr><td>Brazilian FX depreciation<\u002Ftd><td>Translates down 30.8%-margin LatAm<\u002Ftd><td>Margin/EBIT translation hit<\u002Ftd><td>Financing remeasurement swings<\u002Ftd><td>Modest<\u002Ftd><\u002Ftr><tr><td>Marketing-spend recession<\u002Ftd><td>Hits Marketing Services + prescreen<\u002Ftd><td>Modest drag<\u002Ftd><td>Falls<\u002Ftd><td>Manageable<\u002Ftd><\u002Ftr><tr><td>Cloud roll-off from FY27<\u002Ftd><td>Neutral to revenue<\u002Ftd><td><strong>+~50bps margin tailwind (CER)<\u002Fstrong> [COMPANY guidance]<\u002Ftd><td>Rises<\u002Ftd><td>Higher FCF<\u002Ftd><\u002Ftr><tr><td>Continued M&amp;A at FY26 rate (~US$800m/yr)<\u002Ftd><td>+~1% inorganic revenue<\u002Ftd><td>~50bps near-term dilution; rising amortisation<\u002Ftd><td>Amortisation drag rises<\u002Ftd><td>Leverage drifts up but within range<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h2 id=\"s-iv-18\" class=\"hd hd2\"><span class=\"hn mono\">IV.18<\u002Fspan><span class=\"ht\">Profitability Decomposition and Normalisation<\u002Fspan><\u002Fh2>\n<p>FY26 Benchmark EBIT US$2,397m decomposes into: (1) <strong>structural earnings power<\u002Fstrong> — the recurring bureau, platform, verticals and Consumer base; (2) <strong>the mortgage pricing windfall<\u002Fstrong> — a boost inside the +45% NA mortgage line, not durable; (3) <strong>cloud dual-run costs still carried<\u002Fstrong> — a self-reversing headwind from FY27; (4) <strong>acquisition contribution<\u002Fstrong> — ~1% of revenue, ~50bps margin-dilutive near-term; (5) <strong>FX<\u002Fstrong> — a 2% Benchmark EPS tailwind in FY26. <strong>Normalised through-cycle Benchmark EBIT margin [<span class=\"ev\">HYPOTHESIS<\u002Fspan>]: ~28–29%.<\u002Fstrong> The FY27 guidance (double-digit Benchmark EPS growth, organic revenue 6–8%, ~+50bps margin at CER, capex ~8% trending to 7%, Benchmark tax ~26%) implies management believes the cloud roll-off and AI productivity will more than offset mortgage normalisation — i.e., management itself treats the mortgage windfall as impermanent and is guiding to structural, not windfall, expansion.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-recommendations-3\" class=\"hd hd2 n0\"><span class=\"ht\">Recommendations<\u002Fspan><\u002Fh2>\n<p><strong>Stage 1 — Underwrite the structural core, discount the windfall (now).<\u002Fstrong> Value Experian on <strong>statutory<\u002Fstrong> and normalised numbers, not on the Benchmark headline: apply at least the US$271m acquisition-intangible amortisation as a real recurring cost, and treat the FY26 mortgage +45% as a one-off pricing event, not a run-rate. Anchor to organic growth of 6–8% and a normalised ~28–29% margin. <em>Benchmark that would change this view:<\u002Fem> if mortgage pricing holds AND VantageScore fails to compress bureau economics through FY27, raise the durable growth assumption.<\u002Fp>\n<p><strong>Stage 2 — Track five telltales quarterly.<\u002Fstrong> (i) US mortgage-profile revenue growth (watch for the +45% decaying toward volume-led single digits); (ii) VantageScore adoption among top-15 lenders (already ~30% of the market — a share above ~50% would begin to matter); (iii) labour cost as a % of revenue (the 31.8% figure falling further validates the AI thesis; a stall is a margin warning); (iv) the current-receivables trend (the FY26 +37% jump vs +12% revenue is a DSO flag); (v) cloud dual-run roll-off actually landing in the FY27 P&amp;L as guided. <em>Thresholds:<\u002Fem> a labour ratio rising back above ~33%, or receivables growth persistently outpacing revenue by &gt;15pts, would each warrant a quality-of-earnings downgrade.<\u002Fp>\n<p><strong>Stage 3 — Price the CFPB tail explicitly.<\u002Fstrong> Do not model the CFPB matter as a binary fine. Model the <strong>remediation scenario<\u002Fstrong>: estimate the incremental cost of substantive dispute investigations across &gt;12m disputes/year and haircut the margin accordingly as a low-probability, high-impact recurring cost. <em>Benchmark:<\u002Fem> a summary-judgment or settlement that leaves the low-cost dispute process intact removes most of the downside; any consent order mandating process change is a structural margin event, not a one-off.<\u002Fp>\n<p><strong>Stage 4 — Judge M&amp;A on the impairment scoreboard, not the pipeline.<\u002Fstrong> Continue to credit core-market bolt-ons (never impaired) but treat further EMEA/AP expansion sceptically given the ~US$232m impairment record there. <em>Benchmark:<\u002Fem> any new goodwill impairment outside EMEA/AP would be a first — and a signal that the acquisition machine is over-reaching into the profitable core.<\u002Fp>\n<p><strong>Stage 5 — On the buyback, require continued per-share compounding.<\u002Fstrong> The US$1bn programme (to 30 June 2027) creates value only if Benchmark EPS keeps compounding double-digit. <em>Threshold:<\u002Fem> if organic growth slips below ~6% while the mortgage windfall reverses, buying back at a mid-30s multiple becomes value-neutral-to-destructive and cash should tilt back to debt reduction or higher-return M&amp;A.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-caveats-4\" class=\"hd hd2 n0\"><span class=\"ht\">Caveats<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>The non-GAAP question is unresolved by design.<\u002Fstrong> The market prices Benchmark EPS (179.8c) at a 9.3% premium to statutory (164.5c). This report treats the acquisition-intangible amortisation and recurring acquisition expenses as real economic costs; readers who accept the company's framing will reach a rosier view. The disagreement is analytical, not factual.<\u002Fli><li><strong>Pricing opacity forces inference.<\u002Fstrong> Per-inquiry bureau rates and marketplace referral fees are confidential; revenue-per-inquiry and revenue-per-referral are therefore labelled <span class=\"ev unk\">UNKNOWN<\u002Fspan> rather than estimated. Unit economics in <a class=\"xr\" href=\"#s-iv-6\">IV.6<\u002Fa> are derived transparently and flagged as inference.<\u002Fli><li><strong>Preliminary-announcement basis.<\u002Fstrong> Figures are from the FY26 results announcement (approved 19 May 2026) and prior-year announcements; the full AR2026 notes (segmental detail, the acquisition-vs-internally-generated split of the US$3,078m intangibles balance, the 31 March 2026 contract-liability/deferred-income balance, and the qualitative contingent-liabilities disclosure) were not all independently accessible and are flagged <span class=\"ev unk\">UNKNOWN<\u002Fspan> where relevant. The FY26 goodwill balance (US$7,261m) and intangibles (US$3,078m) are taken from the published balance sheet; the goodwill <em>impairment history<\u002Fem> (US$53m FY21, US$179m FY23, both EMEA/AP; none in NA/LatAm/UK) is confirmed from the AR2022/FY23/FY24 notes.<\u002Fli><li><strong>Forward-looking items are labelled.<\u002Fstrong> FY27 guidance, the cloud dual-run roll-off, the VantageScore savings estimates (Deep Future Analytics US$648m first-year / US$930m updated / US$2.5bn five-year) and all scenario outputs are projections, not realised results, and are tagged <span class=\"ev\">COMPANY CLAIM<\u002Fspan>, <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan>, <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> or <span class=\"ev\">HYPOTHESIS<\u002Fspan> accordingly.<\u002Fli><li><strong>Revenue quality is partly a legal question.<\u002Fstrong> Multiple streams depend on legal permissions persisting — FCRA permissible purpose, UK GDPR legitimate interests, LGPD <span class=\"nb\">Article 7(X)<\u002Fspan>. The medical-debt precedent shows data categories can be removed from the file by legislation or regulation; where that happens, the associated revenue is contingent, not guaranteed.<\u002Fli><\u002Ful>\n<p><em>Work paused at the completion of <a class=\"xr\" href=\"#part-iv\">Volume IV<\u002Fa>. <a class=\"xr\" href=\"#part-v\">Volume V<\u002Fa> has not been begun.<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<\u002Fsection>\n<section class=\"sec\" data-part=\"5\">\n<header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part V<\u002Fspan><a href=\"#contents\">Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">V<\u002Fspan><\u002Fdiv><h1 id=\"part-v\" class=\"part\" data-short=\"Part V — Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution\">Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution<\u002Fh1><p class=\"opener-s\">Why it wins, what the September 2026 trial could cost, and what the company is becoming.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">V<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Numbered sections<\u002Fdiv><div class=\"plate-v\">24<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Tables<\u002Fdiv><div class=\"plate-v\">8<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-volume-v-management-culture-competition-moat-risk-strategic-evolution\"><span class=\"inpart-n\"><\u002Fspan><span>VOLUME V — Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution<\u002Fspan><\u002Fa><a href=\"#s-v-1\"><span class=\"inpart-n\">V.1<\u002Fspan><span>Institutional Architects and the Two Lineages (replaces Founder Analysis)<\u002Fspan><\u002Fa><a href=\"#s-v-2\"><span class=\"inpart-n\">V.2<\u002Fspan><span>Current Management Team<\u002Fspan><\u002Fa><a href=\"#s-v-3\"><span class=\"inpart-n\">V.3<\u002Fspan><span>Management System and Governance in Practice<\u002Fspan><\u002Fa><a href=\"#s-v-4\"><span class=\"inpart-n\">V.4<\u002Fspan><span>Culture — Declared versus Revealed<\u002Fspan><\u002Fa><a href=\"#s-v-5\"><span class=\"inpart-n\">V.5<\u002Fspan><span>Incentive Architecture<\u002Fspan><\u002Fa><a href=\"#s-v-6\"><span class=\"inpart-n\">V.6<\u002Fspan><span>Competitive Universe — Per Business Line<\u002Fspan><\u002Fa><a href=\"#s-v-7\"><span class=\"inpart-n\">V.7<\u002Fspan><span>Competitor Teardowns<\u002Fspan><\u002Fa><a href=\"#s-v-8\"><span class=\"inpart-n\">V.8<\u002Fspan><span>Why Experian Wins — and Where It Does Not<\u002Fspan><\u002Fa><a href=\"#s-v-9\"><span class=\"inpart-n\">V.9<\u002Fspan><span>Moat Analysis — Tested Against Open Banking<\u002Fspan><\u002Fa><a href=\"#s-v-10\"><span class=\"inpart-n\">V.10<\u002Fspan><span>Replication and Substitution Test<\u002Fspan><\u002Fa><a href=\"#s-v-11\"><span class=\"inpart-n\">V.11<\u002Fspan><span>Porter's Five Forces (tied to Experian)<\u002Fspan><\u002Fa><a href=\"#s-v-12\"><span class=\"inpart-n\">V.12<\u002Fspan><span>PESTLE (material factors only)<\u002Fspan><\u002Fa><a href=\"#s-v-13\"><span class=\"inpart-n\">V.13<\u002Fspan><span>Strategic Flywheels (genuine)<\u002Fspan><\u002Fa><a href=\"#s-v-14\"><span class=\"inpart-n\">V.14<\u002Fspan><span>Negative Flywheels<\u002Fspan><\u002Fa><a href=\"#s-v-15\"><span class=\"inpart-n\">V.15<\u002Fspan><span>Theory of Constraints<\u002Fspan><\u002Fa><a href=\"#s-v-16\"><span class=\"inpart-n\">V.16<\u002Fspan><span>Risk Register (probability × severity × detectability; residual; horizon)<\u002Fspan><\u002Fa><a href=\"#s-v-17\"><span class=\"inpart-n\">V.17<\u002Fspan><span>Stress Tests — with the 21 September 2026 CFPB trial modelled explicitly<\u002Fspan><\u002Fa><a href=\"#s-v-18\"><span class=\"inpart-n\">V.18<\u002Fspan><span>What Could Make Experian Obsolete?<\u002Fspan><\u002Fa><a href=\"#s-v-19\"><span class=\"inpart-n\">V.19<\u002Fspan><span>Strategic Optionality<\u002Fspan><\u002Fa><a href=\"#s-v-20\"><span class=\"inpart-n\">V.20<\u002Fspan><span>What Is Experian Becoming? (ranked hypotheses)<\u002Fspan><\u002Fa><a href=\"#s-v-21\"><span class=\"inpart-n\">V.21<\u002Fspan><span>Five-Year and Ten-Year Strategic Map<\u002Fspan><\u002Fa><a href=\"#s-v-22\"><span class=\"inpart-n\">V.22<\u002Fspan><span>What the Market May Misunderstand (≥6)<\u002Fspan><\u002Fa><a href=\"#s-v-23\"><span class=\"inpart-n\">V.23<\u002Fspan><span>Management and Capital-Allocation Judgement<\u002Fspan><\u002Fa><a href=\"#s-v-24\"><span class=\"inpart-n\">V.24<\u002Fspan><span>Volume V Reconstruction — Synthesis<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats one\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono sm\">21 Sept 2026<\u002Fdiv><div class=\"stat-l\">CFPB jury trial<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<h2 id=\"s-volume-v-management-culture-competition-moat-risk-strategic-evolution\" class=\"hd hd2 n0\"><span class=\"ht\">VOLUME V — Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution<\u002Fspan><\u002Fh2>\n<p><em>Research date: 9 August 2026. Established context from Volumes I–IV is treated as verified. Evidence labels: <span class=\"ev\">CONFIRMED FACT<\u002Fspan> / <span class=\"ev\">COMPANY CLAIM<\u002Fspan> / <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan> / <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> / <span class=\"ev\">HYPOTHESIS<\u002Fspan> / <span class=\"ev unk\">UNKNOWN<\u002Fspan>. Basis discipline observed throughout: statutory vs Benchmark, and organic vs constant-currency vs actual-rate, are distinguished; total revenue and ongoing-activities revenue are kept separate. This is the concluding volume and is written to be the least deferential: financial excellence is not assumed to equal strategic invulnerability, and the moat is tested rather than asserted.<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-v-1\" class=\"hd hd2\"><span class=\"hn mono\">V.1<\u002Fspan><span class=\"ht\">Institutional Architects and the Two Lineages (replaces Founder Analysis)<\u002Fspan><\u002Fh2>\n<p>Experian has no founder. It is the 1996 fusion of two dissimilar corporate cultures, and almost every strategic characteristic of the modern group can be traced to one lineage or the other.<\u002Fp>\n<p><strong>The TRW lineage (the American bureau).<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] The US business began as Credit Data Corporation, founded in Detroit in 1964 by Dr Harry C. Jordan to centralise computerised credit records. TRW Inc. — a Cleveland aerospace, automotive and electronics conglomerate descended from the 1901 Cleveland Cap Screw Company — acquired CDC in 1968, renaming it TRW Information Systems &amp; Services and giving it national scale and engineering capital. By the mid-1980s TRW held files on roughly 90 million individuals and was the dominant US bureau, though it suffered a 1984 password-theft breach and 1991 accuracy lawsuits that settled with commitments to free credit disclosures. In September 1996 TRW spun off Information Systems &amp; Services to a buyout group led by Bain Capital and Thomas H. Lee, who paid roughly US$1.0–1.1bn and christened it \"Experian.\"<\u002Fp>\n<p><strong>The CCN lineage (the British bureau).<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] In 1980 Great Universal Stores (GUS) — a British mail-order and retail conglomerate whose brands included Burberry — commercialised its in-house credit-checking operation as CCN in Nottingham, to manage mail-order credit risk. CCN became the UK's largest credit-reference agency and had wanted to buy TRW's information business for years.<\u002Fp>\n<p><strong>The fusion (November 1996).<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] Weeks after the Bain/Thomas H. Lee buyout closed, GUS offered to buy the newly-formed Experian; the buyout group flipped it for roughly US$1.7bn, netting about US$500m in weeks (Thomas H. Lee and Bain each roughly tripled US$100m stakes). GUS merged Experian with CCN, adopted the Experian name group-wide in 1997, and ran the company from two headquarters — Nottingham and Orange (later Costa Mesa), California.<\u002Fp>\n<p><strong>Analytical reading of the two lineages [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>].<\u002Fstrong> The path dependencies are visible today: (i) the <em>engineering-and-scale orientation<\u002Fem> and appetite for regulatory combat descend from TRW's US bureau, which had operated at national scale and litigated accuracy disputes since the 1970s; (ii) the <em>marketing-data and consumer-segmentation instinct<\u002Fem> descends from CCN, which grew out of a retailer's need to profile customers — the very capability the ICO later challenged; (iii) the <em>serial-acquisition, portfolio-conglomerate habit<\u002Fem> is a direct inheritance of GUS, itself a holding company; (iv) the dual-HQ structure (Nottingham + Costa Mesa, later + São Paulo, now legally domiciled in Dublin) is the institutional residue of a merger of equals that never fully picked a home.<\u002Fp>\n<p><strong>The 2006 demerger.<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] Experian demerged from GUS and listed on the LSE on 10 October 2006. <strong>John Peace<\u002Fstrong> — who had built CCN inside GUS from 1980 — became Experian's first chairman (later also chairing Standard Chartered and Burberry). <strong>Don Robert<\u002Fstrong> (CEO 2005–2014, then Chairman 2014–2019) drove the international expansion, above all Brazil. <strong>Brian Cassin<\u002Fstrong> joined as CFO in 2012 and became CEO in 2014.<\u002Fp>\n<p><strong>Beliefs consistently revealed in strategy [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, HIGH CONFIDENCE].<\u002Fstrong> (1) <em>Own the bureau, then build on it<\u002Fem> — Robert's stated rationale for Serasa in 2007 was \"owning market-leading credit bureaux in key markets.\" (2) <em>Go direct to the consumer early<\u002Fem> — Experian built a direct-to-consumer arm long before most bureaus; it now reports over 215 million free members globally. (3) <em>Build platforms, not just sell data<\u002Fem> — Ascend is deliberately a platform with switching costs, not a data feed. (4) <em>Tolerate regulatory conflict<\u002Fem> — the company litigated both the ICO and the CFPB rather than settling. These four beliefs are the strategic DNA of the group and recur throughout this volume.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-v-2\" class=\"hd hd2\"><span class=\"hn mono\">V.2<\u002Fspan><span class=\"ht\">Current Management Team<\u002Fspan><\u002Fh2>\n<p><strong>CEO — Brian Cassin (CEO since 2014; previously CFO 2012–2014).<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] A former investment banker (Greenhill), Cassin has now led Experian for roughly twelve years and delivered FY26 as \"a record year\" — Benchmark EPS +15%, organic revenue +8%, ROCE 17.2%. His long tenure is both an asset (consistency, credibility on the medium-term framework) and a governance watch-item: [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] succession is not visibly telegraphed, and the CFO is the obvious internal heir.<\u002Fp>\n<p><strong>CFO — Lloyd Pitchford.<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] Long-serving, highly regarded by the sell-side, and the public voice on capital discipline, the Benchmark framework, AI-driven productivity (\"stable headcount despite 8% organic growth\"), and margin progression. The Cassin–Pitchford axis is the real operating core of the company. [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] The durability of this partnership is a genuine key-person concentration.<\u002Fp>\n<p><strong>Chair transition — Mike Rogers → Adam Crozier (at the 22 July 2026 AGM).<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] Rogers retires after nine years on the board (seven as chair). Crozier joined as non-executive director and chair-designate on 12 May 2026 and chairs from the AGM. Crozier is simultaneously chair of <strong>BT Group<\u002Fstrong> (which he is retaining) and of <strong>Kantar<\u002Fstrong> (a marketing-data and analytics business), and previously chaired Whitbread and ASOS and was a NED of Sony. Senior Independent Director <strong>Alison Brittain<\u002Fstrong> led the search; <strong>Caroline Donahue<\u002Fstrong> also steps down at the 2026 AGM.<\u002Fp>\n<p><strong>Assessment of the Crozier appointment [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>].<\u002Fstrong> The signal is <em>consumer-and-data-marketing<\u002Fem>, not credit. Crozier's career is brand-led consumer businesses (ITV, Royal Mail, Whitbread, ASOS) and, critically, <strong>Kantar<\u002Fstrong> — a data-and-analytics-for-marketing company structurally adjacent to Experian Marketing Solutions and the Experian Graph. This is consistent with a board that increasingly sees Experian as a consumer-data-and-marketing-and-analytics company rather than a wholesale credit utility. The retained BT and Kantar chairmanships raise a legitimate <strong>over-boarding / bandwidth question<\u002Fstrong> for a FTSE-100 chair, which proxy advisers may flag. His media/telecoms background brings little credit-bureau or FCRA-specific regulatory expertise — a gap given the CFPB trial.<\u002Fp>\n<p><strong>The absence of a dedicated board data-ethics / privacy committee [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>; <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>].<\u002Fstrong> For a company whose entire revenue base is contingent on data-use permissions (FCRA permissible purpose, UK GDPR legitimate interests, LGPD Art. 7(X)), the absence of a dedicated board-level data-ethics or privacy committee is a deliberate governance choice; data-use risk is handled within existing audit/risk structures. [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] Given that data permissions are the single largest latent risk to the franchise, this is the most questionable single feature of Experian's governance architecture — defensible only if one believes (as management evidently does, having beaten the ICO decisively) that operational compliance is strong enough not to need board-level ring-fencing.<\u002Fp>\n<p><strong>Compensation structure [<span class=\"ev\">CONFIRMED FACT<\u002Fspan> / <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>].<\u002Fstrong> Executive awards run through a Co-Investment Plan and Performance Share Plan; the May 2026 grants to Cassin (reference price 2,646.664p) and Pitchford (2,573.00p) comprise invested shares plus larger conditional matching and performance shares vesting on performance conditions. [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] Because the headline performance metric emphasises <strong>Benchmark EPS growth<\u002Fstrong>, and Benchmark EPS <em>excludes<\u002Fem> the rising amortisation of acquisition intangibles (US$271m in FY26 and rising every year), the incentive structure rewards acquisitions and buybacks in a way statutory EPS would not. This is analysed in <a class=\"xr\" href=\"#s-v-5\">V.5<\u002Fa>.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-v-3\" class=\"hd hd2\"><span class=\"hn mono\">V.3<\u002Fspan><span class=\"ht\">Management System and Governance in Practice<\u002Fspan><\u002Fh2>\n<p><strong>The matrix.<\u002Fstrong> [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, from disclosures] Experian runs a regional P&amp;L structure (North America, Latin America, UK&amp;I, EMEA/AP) crossed with global product lines (Financial Services / B2B, Verticals, Consumer Services) and global platforms (Ascend, PowerCurve). Real power sits with <strong>North America<\u002Fstrong> — US$5,587m revenue at 34.2% margin, the dominant profit centre and the home of the FCRA bureau (Experian Information Solutions, Inc., Ohio) — and with the <strong>central CEO/CFO axis<\u002Fstrong> that controls capital allocation.<\u002Fp>\n<p><strong>How data-use decisions are escalated [PARTIAL <span class=\"ev unk\">UNKNOWN<\u002Fspan>].<\u002Fstrong> The precise internal escalation path for contested data uses is not publicly disclosed [<span class=\"ev unk\">UNKNOWN<\u002Fspan>]. What is observable: the company chose to litigate the ICO matter to the Upper Tribunal and won, implying data-use decisions are made with high legal confidence and central legal control, not devolved to product teams.<\u002Fp>\n<p><strong>Coordinating the two opposed customer bases.<\u002Fstrong> [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] The B2B business sells lenders the ability to assess consumers; the Consumer Services business sells consumers tools to improve their standing with lenders, and monetises them via marketplace referrals back to those same lenders. These interests are partly opposed (a consumer disputing a tradeline is a cost to B2B but a service to Consumer). The coordination mechanism is that <strong>both sit on the same underlying data asset<\u002Fstrong> and both ultimately monetise the lender relationship — the consumer app is, in revenue terms, a lead-generation channel for lenders. This is the structural tension <a class=\"xr\" href=\"#part-ii\">Volume II<\u002Fa> established, managed by keeping the businesses organisationally separate while sharing the data spine.<\u002Fp>\n<p><strong>Capital-allocation governance.<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] FY26: US$792m of acquisitions, US$725m of buybacks (plus a new US$1bn buyback announced with FY26 results), a progressive dividend (interim +10%), net debt 1.7x Benchmark EBITDA (below the 2.0–2.5x target). [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] The below-target leverage plus the fresh US$1bn buyback signals a company generating more cash than it can redeploy into acquisitions at acceptable prices — a \"problem\" of strength, but also evidence that organic reinvestment opportunities are not large enough to absorb the free cash flow (US$1,583m, 93% cash conversion).<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-v-4\" class=\"hd hd2\"><span class=\"hn mono\">V.4<\u002Fspan><span class=\"ht\">Culture — Declared versus Revealed<\u002Fspan><\u002Fh2>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Declared value<\u002Fth><th>Revealed behaviour<\u002Fth><th>Verdict<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>\"Financial health\" &amp; inclusion (Boost, Go, United for Financial Health)<\u002Ftd><td>Genuine free-membership scale (215m+); but the same members are monetised three ways and the marketplace is placement-paid<\u002Ftd><td>[<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] Partly real, partly a customer-acquisition narrative<\u002Ftd><\u002Ftr><tr><td>Consumer champion<\u002Ftd><td>US mortgage revenue +45% on flat volumes — pure pricing; dispute operation run at ~US$0.57/letter<\u002Ftd><td>[<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] Consumer orientation is real in product, weaker in pricing and dispute economics<\u002Ftd><\u002Ftr><tr><td>Responsible data steward<\u002Ftd><td>Beat the ICO decisively; but no board data-ethics committee<\u002Ftd><td>[<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] Confident, compliance-led, not precautionary<\u002Ftd><\u002Ftr><tr><td>Innovation / engineering<\u002Ftd><td>AWS 10-year deal, Ascend, SHAP explainability, AI in model-dev<\u002Ftd><td>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] Genuinely strong engineering orientation<\u002Ftd><\u002Ftr><tr><td>Long-termism<\u002Ftd><td>100% renewal of top NA FS accounts, durations +~10% to &gt;4 years<\u002Ftd><td>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] Real client stickiness<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>Risk appetite:<\u002Fstrong> high on regulatory conflict (litigated ICO and CFPB), disciplined on capital. <strong>Regulatory posture:<\u002Fstrong> combative and confident, backed by a genuine win record. <strong>Central contradiction [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]:<\u002Fstrong> Experian markets itself as a consumer financial-health champion while (a) running the dispute operation — the one process that most directly determines whether a consumer's file is accurate — at deliberately minimal unit cost, and (b) extracting a pricing windfall from mortgage borrowers who cannot shop for a bureau. The CFPB case sits precisely on this fault line. <em>Employee evidence is not relied upon here [<span class=\"ev unk\">UNKNOWN<\u002Fspan> as to representativeness].<\u002Fem><\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-v-5\" class=\"hd hd2\"><span class=\"hn mono\">V.5<\u002Fspan><span class=\"ht\">Incentive Architecture<\u002Fspan><\u002Fh2>\n<ul class=\"lst\"><li><strong>Benchmark EPS as the lodestar [<span class=\"ev\">CONFIRMED FACT<\u002Fspan> + <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>].<\u002Fstrong> Benchmark PBT (US$2,212m) excludes amortisation of acquisition intangibles (US$271m FY26, rising: US$174m FY22 → US$211m FY25 → US$271m FY26). Because executive LTIP metrics centre on Benchmark EPS, <strong>acquisitions are \"free\" in the incentive currency<\u002Fstrong>: the goodwill/intangible amortisation they create never touches the number executives are paid on. This structurally biases the company toward serial acquisition and buyback (which mechanically lifts EPS) over organic quality investment. This is the single most important incentive distortion in the company.<\u002Fli><li><strong>The dispute operation [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, HIGH CONFIDENCE].<\u002Fstrong> Dispute quality generates no revenue; every dollar of cost reduction in the &gt;12m-disputes-a-year machine flows straight to the 28.6% Benchmark EBIT margin. The incentive is therefore to minimise dispute cost, not maximise investigation quality — exactly the behaviour the CFPB alleges. The incentive and the litigation are two views of the same mechanism.<\u002Fli><li><strong>Sales incentives where buyer = supplier [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>].<\u002Fstrong> In the bureau, the lender is both the customer and the (free, reciprocity-bound) data furnisher. This dampens price competition on data-in and concentrates monetisation on data-out (scores, attributes, decisioning).<\u002Fli><li><strong>Consumer marketplace [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>].<\u002Fstrong> Experian is paid on placement/referral. The incentive is to optimise conversion and lender payout, which can diverge from surfacing the objectively best consumer offer.<\u002Fli><\u002Ful>\n<p><strong>What the system rewards:<\u002Fstrong> EPS-accretive M&amp;A, buybacks, margin protection, client retention. <strong>What can be gamed:<\u002Fstrong> Benchmark adjustments; dispute-cost minimisation. <strong>Where incentives conflict with consumers:<\u002Fstrong> dispute quality and marketplace placement.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-v-6\" class=\"hd hd2\"><span class=\"hn mono\">V.6<\u002Fspan><span class=\"ht\">Competitive Universe — Per Business Line<\u002Fspan><\u002Fh2>\n<figure class=\"fig\" id=\"figure-14\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 14<\u002Fspan><span class=\"fig-t\">Competitive Map by Business Line<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div class=\"stack\">\n<div class=\"band\"><div class=\"band-l\">Consumer bureau<\u002Fdiv><div class=\"band-i\"><span class=\"chip\">Equifax<\u002Fspan><span class=\"chip\">TransUnion<\u002Fspan><span class=\"chip lt\">Innovis<\u002Fspan><span class=\"chip lt\">LexisNexis Risk<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"band core\"><div class=\"band-l\">Credit scores<\u002Fdiv><div class=\"band-i\"><span class=\"chip on\">FICO — supplier, partner and rival<\u002Fspan><span class=\"chip\">vs bureau-owned VantageScore<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"band\"><div class=\"band-l\">Decisioning &amp; analytics<\u002Fdiv><div class=\"band-i\"><span class=\"chip\">FICO<\u002Fspan><span class=\"chip\">SAS<\u002Fspan><span class=\"chip\">Provenir<\u002Fspan><span class=\"chip lt\">Zest AI<\u002Fspan><span class=\"chip lt\">Taktile<\u002Fspan><span class=\"chip lt\">Oscilar<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"band\"><div class=\"band-l\">Fraud &amp; identity<\u002Fdiv><div class=\"band-i\"><span class=\"chip\">LexisNexis Risk<\u002Fspan><span class=\"chip on\">Socure<\u002Fspan><span class=\"chip lt\">Alloy<\u002Fspan><span class=\"chip lt\">Sift<\u002Fspan><span class=\"chip lt\">Persona<\u002Fspan><span class=\"chip lt\">Prove<\u002Fspan><span class=\"chip lt\">Ekata<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"band\"><div class=\"band-l\">Marketing data<\u002Fdiv><div class=\"band-i\"><span class=\"chip\">Acxiom<\u002Fspan><span class=\"chip\">Epsilon<\u002Fspan><span class=\"chip\">LiveRamp<\u002Fspan><span class=\"chip lt\">Neustar<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"band\"><div class=\"band-l\">Healthcare RCM<\u002Fdiv><div class=\"band-i\"><span class=\"chip\">Optum/Change<\u002Fspan><span class=\"chip\">Waystar<\u002Fspan><span class=\"chip\">R1 RCM<\u002Fspan><span class=\"chip lt\">Availity<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"band\"><div class=\"band-l\">Automotive<\u002Fdiv><div class=\"band-i\"><span class=\"chip on\">Carfax<\u002Fspan><span class=\"chip lt\">Experian's AutoCheck is a clear number two<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"band\"><div class=\"band-l\">Consumer apps<\u002Fdiv><div class=\"band-i\"><span class=\"chip on\">Credit Karma (Intuit)<\u002Fspan><span class=\"chip\">NerdWallet<\u002Fspan><span class=\"chip\">ClearScore<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"band\"><div class=\"band-l\">Brazil<\u002Fdiv><div class=\"band-i\"><span class=\"chip\">Boa Vista (Equifax)<\u002Fspan><span class=\"chip on\">Quod<\u002Fspan><span class=\"chip\">SPC Brasil<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div class=\"band\"><div class=\"band-l\">Australia / NZ<\u002Fdiv><div class=\"band-i\"><span class=\"chip\">Equifax<\u002Fspan><span class=\"chip\">Centrix<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-callout\">There is no single competitor list. Each line faces a different industry — and FICO is simultaneously supplier, partner and rival.<\u002Fdiv>\n<\u002Fdiv>\n<figcaption>Matrix, one row per business line. Emphasised names are the structurally decisive counterparties in that line; unemphasised names are present but not determinative of pricing or share.<\u002Ffigcaption>\n<\u002Ffigure>\n<h3 id=\"s-a-consumer-credit-bureau-us-tri-opoly\" class=\"hd hd3\">(a) Consumer credit bureau (US tri-opoly)<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] Equifax, Experian, TransUnion. Specialty/alternative: Innovis (the \"fourth bureau\"), LexisNexis Risk Solutions, Clarity Services, FactorTrust (the latter two owned within the big three / TransUnion). <strong>Why the three-firm structure is stable [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]:<\u002Fstrong> reciprocity (furnishers supply all three or the data is worth less), FCRA compliance scale, matching engines built over decades, and mutual co-ownership of VantageScore. Entry is effectively impossible (see <a class=\"xr\" href=\"#s-v-10\">V.10<\u002Fa>).<\u002Fp>\n<h3 id=\"s-b-credit-scores-fico-vs-vantagescore\" class=\"hd hd3\">(b) Credit scores — FICO vs VantageScore<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] FICO is simultaneously <strong>supplier<\u002Fstrong> (its score rides on the bureaus' tri-merge), <strong>partner<\u002Fstrong> (bureaus distribute it) and <strong>rival<\u002Fstrong> (VantageScore, co-owned equally by the three bureaus, competes with it). FHFA authorised <strong>VantageScore 4.0<\u002Fstrong> for conforming mortgages on 8 July 2025; by the Q1 FY27 update, eleven of the fifteen largest mortgage lenders were using it, reaching close to 30% of the US mortgage market. FICO's Julie May (VP/GM B2B Scores) called the bureau-owned VantageScore \"a de facto monopoly … handing complete pricing power to Equifax, Experian, and TransUnion.\" [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] FICO's mortgage royalty rose from US$1.80 (pre-2022) to US$4.95, and then, per Senator Josh Hawley's 23 March 2026 oversight letter to FICO, \"For 2026, FICO doubled its per-score price from $4.95 to $10.00 for the identical product offered the prior year … the potential to raise mortgage credit score costs across the industry by approximately $500 million.\" FICO also launched a \"Mortgage Direct\" licence program. TransUnion is countering aggressively: per its 8 January 2026 release (CEO Chris Cartwright), \"TransUnion is offering VantageScore 4.0 for $4 per score in 2026, representing a 60% discount compared to a FICO score.\" <strong>Economics [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]:<\u002Fstrong> every share point that shifts from FICO to VantageScore moves high-margin royalty economics from FICO to the bureau JV — a direct positive for Experian, and the clearest reason FICO is fighting.<\u002Fp>\n<h3 id=\"s-c-decisioning-and-analytics\" class=\"hd hd3\">(c) Decisioning and analytics<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>/INFERENCE] Experian's Ascend and PowerCurve vs FICO (Software/Platform), SAS, Provenir, Zest AI, Taktile (which counts Serasa as a client), Oscilar, and lender in-house platforms. Basis of competition: breadth of embedded data, explainability (Experian's SHAP-based adverse-action reason codes), speed of deployment, and switching costs once integrated.<\u002Fp>\n<h3 id=\"s-d-fraud-and-identity\" class=\"hd hd3\">(d) Fraud and identity<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>/INFERENCE] Experian (CrossCore, Precise ID, NeuroID, ClearSale) vs <strong>LexisNexis Risk<\u002Fstrong>, <strong>Socure<\u002Fstrong>, Alloy, Sift, Persona, Prove, <strong>Entrust/Onfido<\u002Fstrong>, and <strong>Mastercard's Ekata<\u002Fstrong>. Socure is the standout specialist: it \"counts 18 of America's 20 largest banks as customers\" and \"verified 5 billion identity requests in 2025, up 85% year over year\" (Forbes), on a US$4.5bn valuation set in a November 2021 Series E led by Accel and T. Rowe Price. This is Experian's most genuinely contested line: fast-moving, venture-funded specialists with strong graphs. Experian competes on the bundle (fraud + credit + identity on one data spine), not on standalone best-of-breed.<\u002Fp>\n<h3 id=\"s-e-marketing-data-and-identity\" class=\"hd hd3\">(e) Marketing data and identity<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>/INFERENCE] Experian Marketing Solutions / Experian Graph / Tapad / Audigent / AtData vs <strong>Acxiom (IPG)<\u002Fstrong>, <strong>Epsilon (Publicis)<\u002Fstrong>, <strong>LiveRamp<\u002Fstrong>, <strong>TransUnion's Neustar<\u002Fstrong>. <strong>Regulatory fragility [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>]:<\u002Fstrong> this is the line the ICO attacked; Experian won at both tribunals (Upper Tribunal dismissed the ICO's appeal 23 April 2024; ICO declined further appeal May 2024), and the case is now cited as precedent <em>supporting<\u002Fem> legitimate-interest marketing. So the near-term regulatory cloud has lifted, but the line remains the most exposed to any future statutory tightening.<\u002Fp>\n<h3 id=\"s-f-healthcare-revenue-cycle\" class=\"hd hd3\">(f) Healthcare revenue cycle<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>/INFERENCE] Experian Health vs <strong>Optum / Change Healthcare<\u002Fstrong> (UnitedHealth), <strong>Waystar<\u002Fstrong>, <strong>R1 RCM<\u002Fstrong>, <strong>Availity<\u002Fstrong>. Experian Health is a strong niche (patient access, claims, identity, Patient Access Curator) but is a challenger to Optum/Change's scale. [<span class=\"ev unk\">UNKNOWN<\u002Fspan>] precise US RCM share figures not sourced here.<\u002Fp>\n<h3 id=\"s-g-automotive\" class=\"hd hd3\">(g) Automotive<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] Experian's <strong>AutoCheck<\u002Fstrong> vs <strong>Carfax<\u002Fstrong> (owned by S&amp;P Global via IHS Markit). Carfax is the dominant, consumer-trusted brand (35bn+ records, 151,000+ data sources per its March 2026 statements); AutoCheck (since 1996) is cheaper, preferred for auction/wholesale data, and used by 13,000+ dealers, but is clearly #2 in consumer mindshare. <strong>This is a line Experian does not win.<\u002Fstrong><\u002Fp>\n<h3 id=\"s-h-consumer-facing-apps\" class=\"hd hd3\">(h) Consumer-facing apps<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] Experian's over 215 million free members (85m NA) vs <strong>Credit Karma (Intuit)<\u002Fstrong> — Intuit's 24 February 2020 acquisition was \"approximately $7.1 billion in cash and stock\"; the Credit Karma segment generated roughly US$2.3bn revenue in Intuit's fiscal 2025 (+32%), and Intuit's own reporting cites \"nearly 99.5 million members\" (media profiles cite ~130m cumulative); Credit Karma uses Equifax and TransUnion scores. Also <strong>NerdWallet<\u002Fstrong>, <strong>ClearScore<\u002Fstrong> (the firm the CMA blocked Experian from buying in 2019), <strong>Credit Sesame<\u002Fstrong>, and banks/neobanks giving away scores. Credit Karma is the sharpest consumer rival; Experian's differentiator is that it <em>owns a bureau<\u002Fem> and can offer Boost (adding utility/telecom/rent to the file) natively.<\u002Fp>\n<h3 id=\"s-i-brazil\" class=\"hd hd3\">(i) Brazil<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] <strong>Serasa<\u002Fstrong> — per Experian's 23 October 2012 press release, \"the market leader in Brazil, with approximately 60% market share\" — vs <strong>Boa Vista (now Equifax<\u002Fstrong>, acquired 2023 for ~US$596m EV), <strong>Quod<\u002Fstrong> (bank-owned, founded 2016 by the five largest Brazilian banks at 20% each, built explicitly to reduce dependence on Serasa), and <strong>SPC Brasil<\u002Fstrong>. The Quod natural experiment is analysed in <a class=\"xr\" href=\"#s-v-10\">V.10<\u002Fa>.<\u002Fp>\n<h3 id=\"s-j-australia-new-zealand\" class=\"hd hd3\">(j) Australia/New Zealand<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] <strong>illion<\u002Fstrong> (now Experian; A$820m acquisition completed 2024, ACCC unopposed; combined #2+#3 bureau; ~500 employees) vs <strong>Equifax<\u002Fstrong> (the incumbent #1, formerly Veda) and <strong>Centrix<\u002Fstrong> (NZ). illion also brings <strong>BankStatements.com<\u002Fstrong> and an accredited Consumer Data Right open-banking platform.<\u002Fp>\n<h3 id=\"s-cross-cutting-entrants\" class=\"hd hd3\">Cross-cutting entrants<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>/INFERENCE] Open-banking / cashflow-data providers — <strong>Plaid<\u002Fstrong>, <strong>Nova Credit<\u002Fstrong>, <strong>Prism Data<\u002Fstrong>, <strong>Ocrolus<\u002Fstrong> — plus large technology/payments platforms (Mastercard via Ekata/open banking; potentially Apple, Amazon, or a bank consortium). These are the disruptive vector analysed in <a class=\"xr\" href=\"#s-v-9\">V.9<\u002Fa>.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-v-7\" class=\"hd hd2\"><span class=\"hn mono\">V.7<\u002Fspan><span class=\"ht\">Competitor Teardowns<\u002Fspan><\u002Fh2>\n<h3 id=\"s-experian-vs-equifax-vs-transunion-most-recent-full-years\" class=\"hd hd3\">Experian vs Equifax vs TransUnion (most recent full years)<\u002Fh3>\n<div class=\"tw\"><table class=\"tbl\"><thead><tr><th>Metric<\u002Fth><th><strong>Experian (FY26, to 31 Mar 2026)<\u002Fstrong><\u002Fth><th><strong>Equifax (FY2025, to 31 Dec 2025)<\u002Fstrong><\u002Fth><th><strong>TransUnion (FY2025, to 31 Dec 2025)<\u002Fstrong><\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Total revenue<\u002Ftd><td>US$8,445m statutory (ongoing US$8,425m)<\u002Ftd><td>US$6,074.5m (+7%)<\u002Ftd><td>US$4,576m (+9%)<\u002Ftd><\u002Ftr><tr><td>Growth (organic)<\u002Ftd><td>+8% organic<\u002Ftd><td>+7% (local currency)<\u002Ftd><td>~+8.5% organic cc (~6.5% ex-mortgage)<\u002Ftd><\u002Ftr><tr><td>Margin<\u002Ftd><td>28.6% Benchmark EBIT<\u002Ftd><td>31.9% adj. EBITDA; ~18.0% GAAP operating<\u002Ftd><td>operating income US$857.8m (~18.7%)<\u002Ftd><\u002Ftr><tr><td>Net income<\u002Ftd><td>Statutory PBT US$1,951m<\u002Ftd><td>US$660.3m (+9%)<\u002Ftd><td>US$455m<\u002Ftd><\u002Ftr><tr><td>Segments<\u002Ftd><td>B2B US$6,168m / Consumer US$2,257m<\u002Ftd><td>Workforce Solutions US$2,582.3m / USIS US$2,078.5m / International US$1,413.7m<\u002Ftd><td>US Markets ~US$3,568m (~78%) / International ~US$1,008m (~22%)<\u002Ftd><\u002Ftr><tr><td>Cloud<\u002Ftd><td>10-yr AWS deal (Jun 2025); migration completing<\u002Ftd><td>~90% in Equifax Cloud (post-2017 rebuild)<\u002Ftd><td>Multi-year cloud/tech transformation ongoing<\u002Ftd><\u002Ftr><tr><td>Consumer<\u002Ftd><td>215m+ free members<\u002Ftd><td>Smaller D2C<\u002Ftd><td>Consumer Interactive (volatile; −18% organic in Q3-25 lapping a breach-remediation win)<\u002Ftd><\u002Ftr><tr><td>Geography<\u002Ftd><td>Genuinely global; Brazil leadership<\u002Ftd><td>US-heavy; Brazil via Boa Vista<\u002Ftd><td>US-heavy (~78%); India (CIBIL) strength<\u002Ftd><\u002Ftr><tr><td>Regulatory record<\u002Ftd><td>Beat ICO; CFPB trial 21 Sep 2026<\u002Ftd><td>2017 breach (147m) — the industry's defining event<\u002Ftd><td>Mixed<\u002Ftd><\u002Ftr><tr><td>Employees<\u002Ftd><td>~25,200<\u002Ftd><td>~15,000<\u002Ftd><td>~13,500<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p><strong>Reading [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>].<\u002Fstrong> Equifax's distinctive asset is <strong>Workforce Solutions<\u002Fstrong> (payroll/income verification — The Work Number), which earns bureau-plus economics (Q4 2025 EWS adjusted-EBITDA margin ~51%) and has no direct Experian equivalent at scale — this is why Equifax's group adjusted-EBITDA margin (31.9%) rivals Experian's despite a smaller top line. Equifax's post-2017 forced cloud rebuild is now a competitive advantage (~90% cloud), and its Boa Vista purchase directly attacks Serasa's home market. TransUnion is the smallest and most US-concentrated, hence the most mortgage- and macro-exposed. <strong>Experian's edge<\u002Fstrong> is the combination of true geographic diversification (Brazil), the largest consumer franchise, and the highest absolute revenue.<\u002Fp>\n<h3 id=\"s-experian-vs-fico-why-fico-earns-more-on-less\" class=\"hd hd3\">Experian vs FICO — why FICO earns more on less<\u002Fh3>\n<p>[<span class=\"ev\">CONFIRMED FACT<\u002Fspan>] FICO FY2025 (to 30 Sep 2025): revenue US$1.991bn (+16%); Scores US$1.169bn (+27%), Software US$0.822bn; full-year non-GAAP operating margin 55%; Scores-segment operating margin ~88%. [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>] FICO out-margins Experian because it owns a <strong>standard, not a database<\u002Fstrong>: the FICO score is a piece of IP embedded in regulation and contracts, sold at near-zero marginal cost, with none of the data-collection, dispute-handling, or matching-infrastructure cost that Experian carries. Experian bears the cost of building and defending the data asset; FICO monetises a thin, protected layer on top of it. The 2022–2026 royalty escalation (US$1.80 → US$4.95 → US$10.00) shows FICO exercising the pricing power of a standard — the same power that motivated the bureaus to build VantageScore to reclaim it.<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-v-8\" class=\"hd hd2\"><span class=\"hn mono\">V.8<\u002Fspan><span class=\"ht\">Why Experian Wins — and Where It Does Not<\u002Fspan><\u002Fh2>\n<p><strong>Decomposition of the win mechanism:<\u002Fstrong><\u002Fp>\n<ol class=\"lst\"><li><strong>Reciprocity-protected furnisher network [STRUCTURAL, durable].<\u002Fstrong> Lenders furnish data free in exchange for access; a new entrant cannot assemble the same comprehensive file because furnishers have no reason to feed a bureau lenders don't yet use. This is the deepest moat.<\u002Fli><li><strong>Identity graph and matching [STRUCTURAL + MANAGEMENT].<\u002Fstrong> Matching ~1.3bn monthly updates to ~245m credit-active US consumers accurately is a decades-built capability.<\u002Fli><li><strong>Scale in attributes/models [MANAGEMENT CHOICE].<\u002Fstrong> The attribute library and Ascend are cumulative investments.<\u002Fli><li><strong>Ascend platform switching costs [MANAGEMENT CHOICE].<\u002Fstrong> 100% renewal of top NA FS accounts, durations +~10% to &gt;4 years.<\u002Fli><li><strong>Consumer franchise [MANAGEMENT CHOICE].<\u002Fstrong> 215m+ members = a marketing channel that pays for itself.<\u002Fli><li><strong>Brazil diversification [MANAGEMENT CHOICE, executed].<\u002Fstrong> Serasa gives growth and geographic balance no US-only peer has.<\u002Fli><li><strong>Regulatory capability [STRUCTURAL barrier].<\u002Fstrong> FCRA/GDPR/LGPD compliance at scale is itself a barrier; the ICO win demonstrates it.<\u002Fli><\u002Fol>\n<p><strong>Separating advantage types [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]:<\u002Fstrong><\u002Fp>\n<ul class=\"lst\"><li><em>Structural:<\u002Fem> reciprocity network, matching, regulatory-compliance scale, tri-opoly structure.<\u002Fli><li><em>Management choice:<\u002Fem> Ascend, consumer franchise, Brazil, attribute library.<\u002Fli><li><em>Temporary:<\u002Fem> <strong>the FY26 US mortgage pricing windfall (+45% on flat volumes)<\u002Fstrong> — the clearest non-durable item, not to be extrapolated (see <a class=\"xr\" href=\"#s-v-22\">V.22<\u002Fa>).<\u002Fli><\u002Ful>\n<p><strong>Where Experian does not win:<\u002Fstrong> AutoCheck vs Carfax (clear #2); <strong>EMEA/Asia-Pacific<\u002Fstrong> (6.7% margin, the only region ever impaired — US$53m FY21, US$179m FY23); marketing services (structurally the most regulation-exposed line, even after the ICO win).<\u002Fp>\n<div class=\"sep\"><\u002Fdiv>\n<h2 id=\"s-v-9\" class=\"hd hd2\"><span class=\"hn mono\">V.9<\u002Fspan><span class=\"ht\">Moat Analysis — Tested Against Open Banking<\u002Fspan><\u002Fh2>\n<figure class=\"fig\" id=\"figure-15\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n<div class=\"fig-h\"><span class=\"fig-n mono\">Figure 15<\u002Fspan><span class=\"fig-t\">Moat Scorecard<\u002Fspan><\u002Fdiv>\n<div class=\"fig-b\">\n<div style=\"display:grid;grid-template-columns:34px 1fr;gap:12px\">\n<div class=\"f-lbl\" style=\"writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;letter-spacing:.18em\">Creates value →<\u002Fdiv>\n<div>\n<div class=\"scat\">\n<div class=\"gl\" style=\"bottom:20%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:40%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:60%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:80%\"><\u002Fdiv>\n<div class=\"scat-pt max\" style=\"left:92%;bottom:94%\"><span class=\"scat-d\"><\u002Fspan><span class=\"scat-l\">Furnisher network &amp; reciprocity <span class=\"mono\">5 / 5<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"scat-pt\" style=\"left:78%;bottom:78%\"><span class=\"scat-d\"><\u002Fspan><span class=\"scat-l\">Identity graph &amp; matching <span class=\"mono\">4 / 4<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"scat-pt\" style=\"left:58%;bottom:78%\"><span class=\"scat-d\"><\u002Fspan><span class=\"scat-l\">Attribute library &amp; models <span class=\"mono\">3 / 4<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"scat-pt\" style=\"left:58%;bottom:58%\"><span class=\"scat-d\"><\u002Fspan><span class=\"scat-l\">Ascend switching costs <span class=\"mono\">3 / 3<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"scat-pt up\" style=\"left:58%;bottom:58%\"><span class=\"scat-d\"><\u002Fspan><span class=\"scat-l\">Consumer franchise <span class=\"mono\">3 / 3<\u002Fspan><\u002Fspan><\u002Fdiv>\n<div class=\"scat-pt\" style=\"left:38%;bottom:38%\"><span class=\"scat-d\"><\u002Fspan><span class=\"scat-l\">Brand &amp; trust <span class=\"mono\">2 / 2<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"f-lbl\" style=\"text-align:right;margin-top:14px;letter-spacing:.18em\">Prevents substitution →<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;border-top:1px solid var(--wire);padding-top:16px\">\n<div class=\"f-box\" style=\"border-style:dashed\"><div class=\"f-lbl\">Substitution axis only — no value score<\u002Fdiv><div class=\"f-name\" style=\"margin-top:5px\">Tri-opoly market structure<\u002Fdiv><div class=\"f-meta\">Prevents substitution <span class=\"mono\">4<\u002Fspan> · creates value <span class=\"mono\">neutral<\u002Fspan> — a market structure, not an earnings engine.<\u002Fdiv><\u002Fdiv>\n<div class=\"f-box\" style=\"border-style:dashed\"><div class=\"f-lbl\">Substitution axis only — no value score<\u002Fdiv><div class=\"f-name\" style
