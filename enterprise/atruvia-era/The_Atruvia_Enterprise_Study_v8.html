02Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Operating result<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>~0.050<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Employees<\u002Fsc-raw-td><sc-raw-td>9,291<\u002Fsc-raw-td><sc-raw-td>~9,500<\u002Fsc-raw-td><sc-raw-td>10,076<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Customers<\u002Fsc-raw-td><sc-raw-td>1,015<\u002Fsc-raw-td><sc-raw-td>~866–917<\u002Fsc-raw-td><sc-raw-td>917<\u002Fsc-raw-td><sc-raw-td>~950+<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Accounts (m)<\u002Fsc-raw-td><sc-raw-td>85<\u002Fsc-raw-td><sc-raw-td>89<\u002Fsc-raw-td><sc-raw-td>91<\u002Fsc-raw-td><sc-raw-td>97<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Bookings/transactions (bn)<\u002Fsc-raw-td><sc-raw-td>8.2<\u002Fsc-raw-td><sc-raw-td>8.7<\u002Fsc-raw-td><sc-raw-td>9.32<\u002Fsc-raw-td><sc-raw-td>~10<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Resolving the Finanz-Szene \"€2.001bn / €50m\" flag:<\u002Fstrong> these are the FY2023 <strong>Group<\u002Fstrong> figures (revenue €2.001bn, +8%; operating result €50m), a <em>different perimeter<\u002Fem> from the FY2023 AG figures (Gesamtleistung €1,516.3m, Betriebsergebnis €40.6m). The two are not contradictory; secondary sources conflate them. The €50m group operating result exceeds the €40.6m AG result because profitable subsidiaries (Ratiodata, parcIT) add ~€10m net (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fp><h2 id=\"s-iv-2\" class=\"hd hd2\"><span class=\"hn mono\">IV.2<\u002Fspan><span class=\"ht\">Revenue Taxonomy<\u002Fspan><\u002Fh2><p>Economically meaningful AG revenue streams (FY2025 AG, CONFIRMED unless noted):<\u002Fp><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Stream<\u002Fsc-raw-th><sc-raw-th>2025 €m<\u002Fsc-raw-th><sc-raw-th>Payer<\u002Fsc-raw-th><sc-raw-th>Trigger<\u002Fsc-raw-th><sc-raw-th>Pricing basis<\u002Fsc-raw-th><sc-raw-th>Quality<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Bankverfahren (core banking, Basispaket + Festpreis)<\u002Fsc-raw-td><sc-raw-td>908.7<\u002Fsc-raw-td><sc-raw-td>Member/other banks<\u002Fsc-raw-td><sc-raw-td>Ongoing service<\u002Fsc-raw-td><sc-raw-td>Per-account/volume + fixed package<\u002Fsc-raw-td><sc-raw-td>Recurring, captive, mandatory<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Netze, Collaboration &amp; Arbeitsplatz (infrastructure)<\u002Fsc-raw-td><sc-raw-td>357.3<\u002Fsc-raw-td><sc-raw-td>Banks<\u002Fsc-raw-td><sc-raw-td>Ongoing<\u002Fsc-raw-td><sc-raw-td>Per-workstation/bandwidth<\u002Fsc-raw-td><sc-raw-td>Recurring, captive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Einzelprodukte<\u002Fsc-raw-td><sc-raw-td>153.3<\u002Fsc-raw-td><sc-raw-td>Banks<\u002Fsc-raw-td><sc-raw-td>Optional order<\u002Fsc-raw-td><sc-raw-td>Per-product<\u002Fsc-raw-td><sc-raw-td>Recurring/discretionary<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Individualgeschäft &amp; optionale Pakete<\u002Fsc-raw-td><sc-raw-td>146.6<\u002Fsc-raw-td><sc-raw-td>Banks/externals<\u002Fsc-raw-td><sc-raw-td>Project/option<\u002Fsc-raw-td><sc-raw-td>Negotiated<\u002Fsc-raw-td><sc-raw-td>Semi-recurring<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Andere Umsatzerlöse (levies + migration endabrechnungen + print/output + external)<\u002Fsc-raw-td><sc-raw-td>328.4<\u002Fsc-raw-td><sc-raw-td>Banks (levy), new customers (migration)<\u002Fsc-raw-td><sc-raw-td>Levy schedule / project completion<\u002Fsc-raw-td><sc-raw-td>BVR-set levy; project billing<\u002Fsc-raw-td><sc-raw-td>Mixed: levy=mandatory, migration=project<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><ul class=\"lst\"><li><strong>IT-Sonderumlage (2018–2023):<\u002Fstrong> €60m/yr from the primary banks, earmarked for the Digitalisierungsoffensive (BVR-approved June 2018); ended 30 June 2023 (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>, Börsen-Zeitung). Per the Atruvia Geschäftsbericht 2023, \"nach Auslaufen der Digitalisierungsumlage zum 30. Juni 2023 ... Diese zusätzlichen Mittel haben die Ertragslage positiv beeinflusst.\"<\u002Fli><li><strong>Digitalisierungsumlage / \"Zukunftsbanking-Preiskomponente\":<\u002Fstrong> introduced 1 July 2023, replacing the Digitalisierungspauschale; scaling €30m (2023) → €60m (2024) → €90m (2025) (<span class=\"ev\">COMPANY CLAIM<\u002Fspan> / CONFIRMED via GB2023 narrative + Volume context). Booked within \"andere Umsatzerlöse.\"<\u002Fli><li><strong>Migration/project revenue:<\u002Fstrong> endabrechnungen from onboarding external banks and the sector's 40–45 bank mergers/year. Since 2021, 22 institutes migrated or under way to agree21, incl. all 11 Sparda-Banken, Sozialbank Köln, National-Bank Essen, UmweltBank Nürnberg (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>, IT-Finanzmagazin).<\u002Fli><li><strong>General price increases:<\u002Fstrong> ~5% from 1 April 2023 (inflation-driven); a further ~5% of Leistungsentgelte planned 2024 (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>, Börsen-Zeitung/GB2023).<\u002Fli><li><strong>Card-processing revenue<\u002Fstrong> grows structurally from 1 Jan 2027 with the VR Payment issuing-processing transfer (debit + credit processing) (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>).<\u002Fli><li><strong>Subsidiary revenue<\u002Fstrong> (Group, see <a class=\"xr\" href=\"#s-iv-8\">IV.8<\u002Fa>): Ratiodata (hardware/field service), parcIT/FORUM/ECON/GWS (software licences), Serviscope/Peras (BPO), Accesa/RaRo (nearshore, largely internal).<\u002Fli><\u002Ful><p><strong>Revenue quality classification:<\u002Fstrong> ~85%+ of AG revenue is recurring and captive; the levy component (~€90m, ~4.7% of revenue) is mandatory but political; migration revenue is project-based and lumpy; external/non-cooperative revenue (private banks, ADAC) carries genuine pricing power but churn risk.<\u002Fp><h2 id=\"s-iv-3\" class=\"hd hd2\"><span class=\"hn mono\">IV.3<\u002Fspan><span class=\"ht\">Revenue Flow by Product (representative traces)<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>(a) A member bank's annual core-banking relationship:<\u002Fstrong> bank pays Basispaket (per-account/volume) + infrastructure (per-workstation) + levy + optional products → recognised across Bankverfahren + Netze + andere Umsatzerlöse. Near-100% pass-through of the underlying platform cost; contribution is thin by design.<\u002Fli><li><strong>(b) A bank-merger migration:<\u002Fstrong> two banks combine → one migration project → billed as endabrechnung in \"andere Umsatzerlöse\"; recurring revenue then <em>falls<\u002Fem> (one customer instead of two) even as accounts are retained — a structural headwind (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fli><li><strong>(c) An external core-banking win (e.g. Sparda-Bank West, ~620,000 customers, €13bn balance sheet, migrated Oct 2025):<\u002Fstrong> multi-year migration project (~300 Atruvia staff involved) → migration revenue, then durable recurring Bankverfahren/infrastructure revenue. This is Atruvia's highest-value growth vector.<\u002Fli><li><strong>(d) Ratiodata hardware/field-service engagement:<\u002Fstrong> gross customer payment largely pass-through hardware cost + service margin; low-margin, capital-light but labour-intensive.<\u002Fli><li><strong>(e) parcIT software licence:<\u002Fstrong> high-margin, recurring licence + maintenance; VR-Control embedded in agree21.<\u002Fli><li><strong>(f) Serviscope BPO contract:<\u002Fstrong> per-process/per-transaction BPO fees; labour-intensive, single-digit EBIT margin.<\u002Fli><\u002Ful><h2 id=\"s-iv-4\" class=\"hd hd2\"><span class=\"hn mono\">IV.4<\u002Fspan><span class=\"ht\">THE UMLAGE ECONOMICS AND THE 4% ZIELRENDITE <em>(priority depth)<\u002Fem><\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-2\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 02<\u002Fspan><span class=\"fig-t\">The Profit Is The Levy<\u002Fspan><\u002Fdiv><div class=\"fig-b\" style=\"display:grid;grid-template-columns:1fr 260px;gap:32px;align-items:end\">\n  <div>\n    <div class=\"chart\" style=\"height:290px\">\n      <div class=\"ax-y\"><span>€100m<\u002Fspan><span>€75m<\u002Fspan><span>€50m<\u002Fspan><span>€25m<\u002Fspan><span>0<\u002Fspan><\u002Fdiv>\n      <div class=\"plot\">\n        <div class=\"gl\" style=\"bottom:100%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:75%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:50%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:25%\"><\u002Fdiv>\n        <div class=\"grp\">\n          <div class=\"pair\"><div class=\"cb\" style=\"height:40.6%\"><span class=\"cbv mono\">40.6<\u002Fspan><\u002Fdiv><div class=\"cb acc\" style=\"height:30%\"><span class=\"cbv mono\">30.0<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"grp-l mono\">2023<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grp\">\n          <div class=\"pair\"><div class=\"cb\" style=\"height:66.6%\"><span class=\"cbv mono\">66.6<\u002Fspan><\u002Fdiv><div class=\"cb acc\" style=\"height:60%\"><span class=\"cbv mono\">60.0<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"grp-l mono\">2024<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grp\">\n          <div class=\"pair\"><div class=\"cb\" style=\"height:89%\"><span class=\"cbv mono\">89.0<\u002Fspan><\u002Fdiv><div class=\"cb acc\" style=\"height:90%\"><span class=\"cbv mono\">90.0<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"grp-l mono\">2025<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"lgd\"><span class=\"key\"><\u002Fspan>Betriebsergebnis (Atruvia AG)<span class=\"key acc\" style=\"margin-left:22px\"><\u002Fspan>Digitalisierungsumlage<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pnl\">\n    <div class=\"pnl-k\">The arithmetic<\u002Fdiv>\n    <div class=\"pnl-b\">2025 operating result <span class=\"mono\">€89.0m<\u002Fspan> against a levy of <span class=\"mono\">~€90m<\u002Fspan>. The two series have tracked each other for three consecutive years as the levy tripled from <span class=\"mono\">€30m<\u002Fspan> to <span class=\"mono\">€90m<\u002Fspan>.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><figcaption class=\"fig-c\"><b>Strip the levy and the underlying operating result is close to zero.<\u002Fb> Atruvia’s reported profit is very nearly the size of the surcharge its owners vote to pay it.<\u002Ffigcaption><\u002Ffigure><p><strong>What the target is.<\u002Fstrong> Vorstandssprecher/CFO Martin Beyer stated Atruvia targets \"eine Zielrendite von 4 Prozent in Bezug auf den Umsatz\" and, per the Atruvia GB2024 statement, \"Unser Ziel: Wir steigern unser Betriebsergebnis, um ein dauerhaftes Plus für neue Investitionen zu schaffen\" funded \"aus eigener Kraft\" (<span class=\"ev\">COMPANY CLAIM<\u002Fspan>, HV 2025 / Atruvia Geschäftsbericht). It is measured against revenue, not capital.<\u002Fp><p><strong>The trajectory (CONFIRMED, AG):<\u002Fstrong><\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Year<\u002Fsc-raw-th><sc-raw-th>Betriebsergebnis €m<\u002Fsc-raw-th><sc-raw-th>Margin (on Gesamtleistung)<\u002Fsc-raw-th><sc-raw-th>Digitalisierungs-levy €m<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>2022<\u002Fsc-raw-td><sc-raw-td>11.4<\u002Fsc-raw-td><sc-raw-td>0.8%<\u002Fsc-raw-td><sc-raw-td>— (Sonderumlage era)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2023<\u002Fsc-raw-td><sc-raw-td>40.6<\u002Fsc-raw-td><sc-raw-td>2.7%<\u002Fsc-raw-td><sc-raw-td>30<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2024<\u002Fsc-raw-td><sc-raw-td>66.6<\u002Fsc-raw-td><sc-raw-td>3.9%<\u002Fsc-raw-td><sc-raw-td>60<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2025<\u002Fsc-raw-td><sc-raw-td>89.0<\u002Fsc-raw-td><sc-raw-td>4.6%<\u002Fsc-raw-td><sc-raw-td>90<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2026 (guidance)<\u002Fsc-raw-td><sc-raw-td>77.9<\u002Fsc-raw-td><sc-raw-td>3.9%<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p>Per IT-Finanzmagazin's coverage of the 2026 HV: \"Mit 89,0 Millionen Euro liegt das Ergebnis rund ein Drittel über dem des Geschäftsjahres 2024. Die Betriebsergebnismarge liegt bei 4,7 Prozent.\"<\u002Fp><p><strong>Why would a customer-owned captive target a positive margin at all?<\u002Fstrong> A supplier owned by its customers is, in theory, indifferent between (i) charging a low price and paying no dividend, and (ii) charging a higher price and returning it as dividend — the owner-customer's net position is identical. Introducing a <em>deliberate<\u002Fem> positive margin only makes economic sense if the surplus is used for something the owners would not otherwise fund voluntarily. That \"something\" is <strong>permanent platform investment<\u002Fstrong>.<\u002Fp><p><strong>Central hypothesis (tested):<\u002Fstrong> the 4% Zielrendite is a <strong>governance device to legitimise retained earnings for investment that owners resist funding through explicit levies.<\u002Fstrong> The evidence strongly supports this:<\u002Fp><ul class=\"lst\"><li>The FY2025 Betriebsergebnis (€89.0m) is within ~€1m of the FY2025 Digitalisierungslevy (~€90m). In cash terms, <strong>the operating profit is the levy<\u002Fstrong> (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fli><li>Management explicitly links the margin to investment funding (\"dauerhaftes Plus für neue Investitionen\"), not to shareholder return.<\u002Fli><li>The levy share of revenue is being reduced in favour of \"nutzenbasierte Bepreisung\" (usage-based pricing) — i.e. the <em>label<\u002Fem> on the money is shifting from an unpopular explicit levy toward embedded usage prices, while the economic function (fund investment from customer cash) is unchanged.<\u002Fli><\u002Ful><p><strong>What happens to the surplus.<\u002Fstrong> It is overwhelmingly retained: Eigenkapital rose from €467.3m (2023) to €557.0m (2025), +€89.7m, almost exactly the cumulative Jahresüberschüsse net of a small dividend. A dividend is paid (the Aufsichtsrat \"found the Vorstand's Dividendenvorschlag angemessen\" in both 2024 and 2025) but the euro amount is not separately disclosed and is small relative to retained earnings (<span class=\"ev\">UNKNOWN<\u002Fspan> exact figure; the FY2025 financing cash outflow of €34.8m includes it alongside debt service).<\u002Fp><p><strong>Is the target sustainable or flattered?<\u002Fstrong> The FY2026 guidance (margin falling back to ~3.9%) indicates 2025's 4.7% is at or near a cyclical peak, likely flattered by (i) the levy stepping up to €90m and (ii) new-customer migration completions (Sparda group). It is <strong>not yet a structurally self-sustaining 4% margin<\u002Fstrong>; absent the levy, the underlying business runs at roughly break-even (see <a class=\"xr\" href=\"#s-iv-21\">IV.21<\u002Fa>). <strong>Verdict: the 4% Zielrendite is economically real as a cash-generation mechanism but is a governance fiction as a \"commercial margin\" — it is the levy, re-badged.<\u002Fstrong><\u002Fp><h2 id=\"s-iv-5\" class=\"hd hd2\"><span class=\"hn mono\">IV.5<\u002Fspan><span class=\"ht\">Cost Architecture (AG, FY2025)<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-17\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 17<\u002Fspan><span class=\"fig-t\">Where Every Euro Goes<\u002Fspan><\u002Fdiv><div class=\"fig-b\"><div style=\"display:flex;height:44px;border:1px solid var(--ink)\"><div style=\"width:41.2%;background:var(--color-neutral-300);height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden\"><span class=\"mono seg-v\" style=\"font-size:11px;color:var(--ink)\">41.2%<\u002Fspan><\u002Fdiv><div style=\"width:34.1%;background:var(--color-neutral-400);height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden\"><span class=\"mono seg-v\" style=\"font-size:11px;color:var(--ink)\">34.1%<\u002Fspan><\u002Fdiv><div style=\"width:11.1%;background:var(--color-neutral-500);height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden\"><span class=\"mono seg-v\" style=\"font-size:11px;color:var(--ink)\">11.1%<\u002Fspan><\u002Fdiv><div style=\"width:9.7%;background:var(--color-neutral-600);height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden\"><span class=\"mono seg-v\" style=\"font-size:11px;color:var(--color-bg)\">9.7%<\u002Fspan><\u002Fdiv><div style=\"width:4.6%;background:var(--color-accent);height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden\"><span class=\"mono seg-v\" style=\"font-size:11px;color:var(--color-bg)\">4.6%<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"margin-top:14px\"><div style=\"display:flex;align-items:baseline;gap:8px;margin-top:7px\"><span style=\"flex:none;width:11px;height:11px;background:var(--color-neutral-300)\"><\u002Fspan><span style=\"font-size:12.5px;line-height:1.35\">Materialaufwand / bought-in services<\u002Fspan><span class=\"mono\" style=\"margin-left:auto;font-size:12px\">41.2%<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:8px;margin-top:7px\"><span style=\"flex:none;width:11px;height:11px;background:var(--color-neutral-400)\"><\u002Fspan><span style=\"font-size:12.5px;line-height:1.35\">Personalaufwand<\u002Fspan><span class=\"mono\" style=\"margin-left:auto;font-size:12px\">34.1%<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:8px;margin-top:7px\"><span style=\"flex:none;width:11px;height:11px;background:var(--color-neutral-500)\"><\u002Fspan><span style=\"font-size:12.5px;line-height:1.35\">Abschreibungen<\u002Fspan><span class=\"mono\" style=\"margin-left:auto;font-size:12px\">11.1%<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:8px;margin-top:7px\"><span style=\"flex:none;width:11px;height:11px;background:var(--color-neutral-600)\"><\u002Fspan><span style=\"font-size:12.5px;line-height:1.35\">Sonstige betriebliche Aufwendungen<\u002Fspan><span class=\"mono\" style=\"margin-left:auto;font-size:12px\">9.7%<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:baseline;gap:8px;margin-top:7px\"><span style=\"flex:none;width:11px;height:11px;background:var(--color-accent)\"><\u002Fspan><span style=\"font-size:12.5px;line-height:1.35\">Betriebsergebnis<\u002Fspan><span class=\"mono\" style=\"margin-left:auto;font-size:12px\">4.6%<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption>Bought-in services — IBM licensing, nearshore capacity, maintenance — exceed personnel as the largest cost. Atruvia is a systems integrator riding a supplier stack, not a pure software house. Share of Gesamtleistung, AG, FY2025.<\u002Ffigcaption><\u002Ffigure><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Cost line<\u002Fsc-raw-th><sc-raw-th>€m<\u002Fsc-raw-th><sc-raw-th>% of Gesamtleistung<\u002Fsc-raw-th><sc-raw-th>Behaviour<\u002Fsc-raw-th><sc-raw-th>Driver<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Materialaufwand / bezogene Leistungen<\u002Fsc-raw-td><sc-raw-td>~792.1<\u002Fsc-raw-td><sc-raw-td>41.2%<\u002Fsc-raw-td><sc-raw-td>Semi-variable<\u002Fsc-raw-td><sc-raw-td>IBM licensing (Tailored Fit Pricing, consumption), Fremdarbeit/nearshore, Miete &amp; Wartung<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Personalaufwand<\u002Fsc-raw-td><sc-raw-td>654.1<\u002Fsc-raw-td><sc-raw-td>34.1%<\u002Fsc-raw-td><sc-raw-td>Step-fixed<\u002Fsc-raw-td><sc-raw-td>Headcount (5,847), tariff increases, pension provisioning<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Abschreibungen<\u002Fsc-raw-td><sc-raw-td>213.8<\u002Fsc-raw-td><sc-raw-td>11.1%<\u002Fsc-raw-td><sc-raw-td>Fixed<\u002Fsc-raw-td><sc-raw-td>Capitalised software, mainframes, buildings; incl. €6.5m impairment on decommissioned buildings (2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sonstige betr. Aufwendungen<\u002Fsc-raw-td><sc-raw-td>185.9<\u002Fsc-raw-td><sc-raw-td>9.7%<\u002Fsc-raw-td><sc-raw-td>Semi-variable<\u002Fsc-raw-td><sc-raw-td>Energy, travel, consulting, internal applications<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Betriebsergebnis<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>89.0<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>4.6%<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Residual<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><ul class=\"lst\"><li><strong>Personnel:<\u002Fstrong> cost/employee rose from €104,960 (2023) to €111,870 (2025). The Romanian nearshore shift (Accesa/RaRo, Cluj-Napoca) appears in <em>bezogene Leistungen<\u002Fem> when contracted and migrates to <em>Personalaufwand<\u002Fem> as capacity is internalised — the GB2023/GB2021 narratives repeatedly cite \"Wandlung von externen zu internen Kapazitäten,\" which raises Personalaufwand while restraining Materialaufwand.<\u002Fli><li><strong>IBM under Tailored Fit Pricing:<\u002Fstrong> consumption-based licensing converts a step-fixed mainframe cost into a semi-variable one that scales with transaction volume — beneficial as volumes grow but removes the old \"peak-MSU\" optimisation lever (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> from <a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-organisational-infrastructure\">Volume III<\u002Fa> + IBM deal).<\u002Fli><li><strong>Development capitalisation (HGB):<\u002Fstrong> aktivierte Eigenleistungen were €24.5m (2024) and €25.1m (2025); the GB2023 states development costs were \"knapp ein Fünftel der Gesamtkosten\" with ~40% of internal staff in development. Capitalising a portion of development flatters current Betriebsergebnis and shifts cost into future Abschreibungen — a material accounting judgement (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>).<\u002Fli><\u002Ful><h2 id=\"s-iv-6\" class=\"hd hd2\"><span class=\"hn mono\">IV.6<\u002Fspan><span class=\"ht\">Cost per Unit (AG basis; show arithmetic)<\u002Fspan><\u002Fh2><p>Total AG operating cost 2025 = Gesamtleistung − Betriebsergebnis = 1,921.0 − 89.0 = <strong>€1,832.0m<\u002Fstrong>.<\u002Fp><ul class=\"lst\"><li><strong>Cost per account:<\u002Fstrong> €1,832.0m ÷ 97m accounts = <strong>€18.89/account/yr<\u002Fstrong>. Revenue/account = 1,894.4 ÷ 97 = €19.53. <em>(Accounts are a group operational metric; AG cost is used because AG runs the platform — perimeter caveat.)<\u002Fem><\u002Fli><li><strong>Cost per booking:<\u002Fstrong> €1,832.0m ÷ ~10bn bookings = <strong>€0.183/booking<\u002Fstrong>. <em>If<\u002Fem> the ~80bn+ technical-transaction denominator is used, ≈ €0.023/technical transaction (denominator uncertain — flagged).<\u002Fli><li><strong>Cost per banking workstation:<\u002Fstrong> infrastructure cost proxy €357.3m revenue ÷ ~160,000 workstations = <strong>€2,233/workstation/yr<\u002Fstrong> (revenue basis; cost basis similar given thin margin).<\u002Fli><li><strong>Cost per member-bank relationship:<\u002Fstrong> €1,832.0m ÷ 917 customers = <strong>€2.0m/customer/yr<\u002Fstrong> average (heavily skewed — a large Volksbank consumes many multiples of a small Raiffeisenbank).<\u002Fli><li><strong>Cost per employee:<\u002Fstrong> €654.1m Personalaufwand ÷ 5,847 = <strong>€111,870<\u002Fstrong>.<\u002Fli><\u002Ful><p><strong>Where scale economies arise:<\u002Fstrong> single multi-tenant agree21 platform, regulatory \"build-once\" (MaRisk/DORA implemented once for ~950 banks), mainframe consolidation (eight IBM Z systems, four data centres). <strong>Where they do not:<\u002Fstrong> Ratiodata field service (per-site labour), service desk, per-tenant migrations, and BAP↔BankingWorkspace coexistence double-maintenance.<\u002Fp><h2 id=\"s-iv-7\" class=\"hd hd2\"><span class=\"hn mono\">IV.7<\u002Fspan><span class=\"ht\">Unit Economics<\u002Fspan><\u002Fh2><p>The economically relevant unit is the <strong>member bank<\u002Fstrong> (the contracting, paying, owning entity); the account is the volume driver beneath it. <\u002Fp><ul class=\"lst\"><li><strong>Revenue per bank (avg):<\u002Fstrong> €1,894.4m ÷ 917 = ~€2.07m. A large Volksbank (~1m accounts) may pay €10m+; a small Raiffeisenbank (~20–30k accounts) perhaps €0.3–0.5m (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> — Atruvia discloses no per-bank pricing).<\u002Fli><li><strong>Value of a new external win:<\u002Fstrong> e.g. Sparda-Bank West (~620,000 customers). Migration project revenue (one-off, spread over ~2–3 yrs) plus durable recurring Bankverfahren + infrastructure. Rough estimate: recurring ~€10–20m/yr for a bank of that size (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, based on ~€19.5 revenue/account × account count).<\u002Fli><li><strong>Cost of a bank merger to Atruvia:<\u002Fstrong> a migration project consumes engineering capacity (the Sparda-BW cut-over moved 400GB / 2.4bn records across 612 tables) but <em>reduces<\u002Fem> the recurring customer count — Atruvia earns a one-off fee then loses one relationship's fixed component. Net effect is dilutive to recurring revenue over time, offset only by external wins (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fli><\u002Ful><h2 id=\"s-iv-8\" class=\"hd hd2\"><span class=\"hn mono\">IV.8<\u002Fspan><span class=\"ht\">Segment and Entity Economics <em>(replaces cohort analysis)<\u002Fem><\u002Fspan><\u002Fh2><p><strong>Table 3 — Material subsidiaries (FY2024 unless stated). Sources: subsidiary reports, Atruvia Tochterunternehmen GB, Northdata (mix CONFIRMED / <span class=\"ev\">COMPANY CLAIM<\u002Fspan>).<\u002Fstrong><\u002Fp><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Entity<\u002Fsc-raw-th><sc-raw-th>Revenue €m<\u002Fsc-raw-th><sc-raw-th>Employees<\u002Fsc-raw-th><sc-raw-th>EBIT/EBT €m<\u002Fsc-raw-th><sc-raw-th>Business<\u002Fsc-raw-th><sc-raw-th>Margin character<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Ratiodata SE<\u002Fsc-raw-td><sc-raw-td>344.5 (2024)<\u002Fsc-raw-td><sc-raw-td>~1,426–1,500<\u002Fsc-raw-td><sc-raw-td>EBT 7.4 (2024)<\u002Fsc-raw-td><sc-raw-td>Hardware, field service, scanning, nearshore<\u002Fsc-raw-td><sc-raw-td>Thin (~2%)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>parcIT GmbH<\u002Fsc-raw-td><sc-raw-td>78.6 (2024)*<\u002Fsc-raw-td><sc-raw-td>507*<\u002Fsc-raw-td><sc-raw-td>~3+<\u002Fsc-raw-td><sc-raw-td>Banksteuerung software (VR-Control)<\u002Fsc-raw-td><sc-raw-td>Higher (software)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>BMS Corporate Solutions<\u002Fsc-raw-td><sc-raw-td>52.0<\u002Fsc-raw-td><sc-raw-td>303<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>Firmenkunden software/consulting<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Peras GmbH<\u002Fsc-raw-td><sc-raw-td>46.7<\u002Fsc-raw-td><sc-raw-td>290<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>HR services/payroll BPO<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Serviscope AG<\u002Fsc-raw-td><sc-raw-td>28.8 (task) / Gesamtleistung ~44.0 (2024–25)<\u002Fsc-raw-td><sc-raw-td>482<\u002Fsc-raw-td><sc-raw-td>EBIT 3.1 (2024)<\u002Fsc-raw-td><sc-raw-td>BPO/call-centre<\u002Fsc-raw-td><sc-raw-td>Single-digit<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>TRUUCO GmbH<\u002Fsc-raw-td><sc-raw-td>8.2 (task) / 3.1 (2023)<\u002Fsc-raw-td><sc-raw-td>51–58<\u002Fsc-raw-td><sc-raw-td><strong>−7.98 (2024) / −8.6 (2023)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Smart-data/analytics<\u002Fsc-raw-td><sc-raw-td><strong>Loss-making<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>ECON Application<\u002Fsc-raw-td><sc-raw-td>4.1<\u002Fsc-raw-td><sc-raw-td>35<\u002Fsc-raw-td><sc-raw-td>0.3 (2023)<\u002Fsc-raw-td><sc-raw-td>No-code application suite<\u002Fsc-raw-td><sc-raw-td>Small/positive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FORUM GmbH<\u002Fsc-raw-td><sc-raw-td>3.6<\u002Fsc-raw-td><sc-raw-td>20<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>Software<\u002Fsc-raw-td><sc-raw-td>Small<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>GWS mbH<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>Warenwirtschaft (Microsoft Dynamics)<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Accesa/RaRo<\u002Fsc-raw-td><sc-raw-td>n/d (~700 IT specialists)<\u002Fsc-raw-td><sc-raw-td>~700<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>Nearshore dev (Cluj-Napoca)<\u002Fsc-raw-td><sc-raw-td>Internal cost centre<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Lucke EDV<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>EDV<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p>\\*parcIT reconciliation flag: GB2022 gave 403 employees/€68.9m; GB2023 478/€69.8m (and a Tochter-page figure of €37.9m/236 for one perimeter); FY2024 €78.6m/507. The jump suggests a change in consolidation/perimeter or a merged unit; the series is <strong>not cleanly continuous<\u002Fstrong> and should not be read as organic growth (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fp><p><strong>Cross-subsidy direction:<\u002Fstrong> the captive core (AG) subsidises loss-making strategic ventures — TRUUCO received a capital-reserve injection from Atruvia and a DZ Bank/Atruvia joint strengthening; its ~−€8m annual loss is absorbed at group level. Conversely, the profitable software subsidiaries (parcIT, ECON) modestly <em>lift<\u002Fem> the group margin above the AG margin (the €50m group vs €40.6m AG operating result in 2023). <strong>Headline group margins therefore conceal a break-even captive core, several thin-margin service businesses, a few higher-margin software units, and at least one structural loss-maker.<\u002Fstrong><\u002Fp><h2 id=\"s-iv-9\" class=\"hd hd2\"><span class=\"hn mono\">IV.9<\u002Fspan><span class=\"ht\">Income Statement Teardown (AG, HGB)<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Gesamtleistung → Umsatzerlöse reconciliation (2025):<\u002Fstrong> Umsatzerlöse €1,894.4m + aktivierte Eigenleistungen €25.1m + Bestandsveränderung ≈ <strong>Gesamtleistung €1,921.0m<\u002Fstrong>.<\u002Fli><li><strong>Betriebsergebnis → Jahresüberschuss (2025):<\u002Fstrong> EBIT €89.0m + Finanzergebnis €0.2m − Steuern (Ertrag €26.9m + sonstige €1.8m) = <strong>Jahresüberschuss €60.5m<\u002Fstrong>.<\u002Fli><li><strong>Operating leverage:<\u002Fstrong> modest and asymmetric. From 2023→2025 Gesamtleistung rose €404.7m (+27%) while Betriebsergebnis rose €48.4m — an incremental margin of ~12%. But most of that incremental margin <em>is<\u002Fem> the levy step-up (€30m→€90m = +€60m), so genuine operating leverage from scale is weak (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fli><li><strong>Key accounting judgements:<\u002Fstrong> (i) development-cost capitalisation (~€25m/yr aktivierte Eigenleistungen) flatters EBIT; (ii) pension provisioning is sensitive to the HGB Rechnungszins (the €256–262m Pensionsrückstellungen moved with the discount rate); (iii) levies are booked as ordinary revenue, so they inflate both Umsatzerlöse and Betriebsergebnis one-for-one.<\u002Fli><\u002Ful><h2 id=\"s-iv-10\" class=\"hd hd2\"><span class=\"hn mono\">IV.10<\u002Fspan><span class=\"ht\">Balance Sheet Teardown (AG, 31.12.2025)<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Bilanzsumme €1,435.9m<\u002Fstrong> (+14.5% YoY). <strong>Anlagevermögen ~€1,048.8m<\u002Fstrong>: immaterielle VG (capitalised software) grew sharply (FY2025 immat. capex €286.0m — largely the financed IBM mainframe software purchase); Sachanlagen include the four data centres and the Karlsruhe campus; Finanzanlagen €158.3m (2024) are participations in subsidiaries.<\u002Fli><li><strong>Data centres/mainframes: owned, not leased<\u002Fstrong> — the FY2025 report describes <em>purchasing<\u002Fem> mainframe software (financed via trade payables) rather than renting, materially raising Anlagevermögen and Abschreibungen.<\u002Fli><li><strong>Eigenkapital €557.0m<\u002Fstrong> = Grundkapital €115.8m + Kapitalrücklage €230.3m + Gewinnrücklagen €100m + Bilanzgewinn. <strong>EK-quote 38.2%<\u002Fstrong> (falling as the balance sheet grows faster than retained earnings).<\u002Fli><li><strong>Pensionsrückstellungen €256.6m<\u002Fstrong> — the single largest provision; long-duration, interest-sensitive.<\u002Fli><li><strong>Verbindlichkeiten ggü. Kreditinstituten ~€145m<\u002Fstrong> — DZ Bank Campus-Karlsruhe term loan (with SWAP hedge, §254 HGB Bewertungseinheit) + credit line (€160–210m facility, largely undrawn; €25.8m drawn at end-2023, €1.9m Aval at end-2025).<\u002Fli><li><strong>Receivables from ~700 member banks:<\u002Fstrong> low credit risk (\"geringe Ausfallrisiken,\" strong cooperative counterparties); a Forderungsmanagementsystem is in place.<\u002Fli><\u002Ful><h2 id=\"s-iv-11\" class=\"hd hd2\"><span class=\"hn mono\">IV.11<\u002Fspan><span class=\"ht\">CAPITAL STRUCTURE AND THE COOPERATIVE FINANCING PROBLEM <em>(priority depth)<\u002Fem><\u002Fspan><\u002Fh2><p><strong>The structural constraint.<\u002Fstrong> Atruvia cannot issue public equity, is unlisted, cannot raise capital outside the cooperative sector, and its owners are also its price-resisting customers. A cooperative captive facing <em>permanent<\u002Fem> platform-investment demand therefore has only <strong>four funding taps<\u002Fstrong>:<\u002Fp><ol class=\"lst\"><li><strong>Raise prices on owner-customers<\u002Fstrong> (general increases + usage-based pricing) — politically constrained; owners resist.<\u002Fli><li><strong>Retain earnings<\u002Fstrong> — now institutionalised as the 4% Zielrendite; delivered €89.7m equity growth 2023→2025.<\u002Fli><li><strong>Borrow<\u002Fstrong> — DZ Bank campus loan + credit line + increasingly <em>supplier/trade financing<\u002Fem> (the ~€145m jump in Verb. aus L&amp;L in 2025 to fund the IBM purchase is a form of vendor financing).<\u002Fli><li><strong>Sector-level subsidy<\u002Fstrong> — the IT-Sonderumlage (banks €300m + DZ Bank €180m + Atruvia €200m = ~€680m over 2018–2023) and DZ Bank's ongoing role.<\u002Fli><\u002Fol><p><strong>Has Atruvia ever raised equity from shareholders?<\u002Fstrong> No Kapitalerhöhung is evident since the 2015 merger; Grundkapital is fixed at €115.8m. Capital comes from retained earnings and the Kapitalrücklage, not fresh subscription (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>). <em>(By contrast, subsidiary Serviscope did a Kapitalerhöhung to €1.6m in 2024 — a subsidiary-level, not AG-level, event.)<\u002Fem><\u002Fp><p><strong>DZ Bank's role as funder (not owner).<\u002Fstrong> DZ Bank holds ~0.35% of shares but: contributed €180m to the 2018–2023 Sonderumlage; provides the campus term loan; and co-finances the VR Payment card reorganisation. Its €180m was a <strong>levy-type sector contribution<\u002Fstrong>, not equity and not a normal customer fee — it functioned as a one-off capital grant to the utility on behalf of the sector (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>). This is why the \"DZ Bank ~20% owner\" claim is doubly wrong: DZ Bank is a <em>financier and central institution<\u002Fem>, not a material shareholder.<\u002Fp><p><strong>How large investments are financed:<\u002Fstrong><\u002Fp><ul class=\"lst\"><li><strong>agree21 modernisation / Omnikanal / BankingWorkspace:<\u002Fstrong> retained earnings + Digitalisierungsumlage (the earmarked levy).<\u002Fli><li><strong>IBM z17 multi-year deal (signed 19 Nov 2025):<\u002Fstrong> structured around <em>purchasing<\u002Fem> mainframe software financed through trade payables (+~€145m) rather than pure leasing — a shift from operating expense to capitalised asset + supplier financing.<\u002Fli><li><strong>VR Payment issuing-processing (effective 1 Jan 2027):<\u002Fstrong> funding/purchase price <span class=\"ev\">UNKNOWN<\u002Fspan>; likely a mix of DZ Bank arrangement and Atruvia balance-sheet capacity.<\u002Fli><\u002Ful><p><strong>Sustainability verdict.<\u002Fstrong> At ~€350m/yr capex and ~€400m/yr operating cash flow, the model is <strong>self-funding at current intensity<\u002Fstrong>. Against the circulating <strong>€450m–€1bn/yr sector-investment scenario (<span class=\"ev\">HYPOTHESIS<\u002Fspan>, not a plan)<\u002Fstrong>, retained earnings + current levies would be insufficient by €100–650m/yr, forcing either a new Sonderumlage, a DZ Bank capital injection, or external debt — the last of which is constrained by the falling EK-quote (38.2% and declining).<\u002Fp><h2 id=\"s-iv-12\" class=\"hd hd2\"><span class=\"hn mono\">IV.12<\u002Fspan><span class=\"ht\">The Investment-Funding Mechanism <em>(replaces interest income)<\u002Fem><\u002Fspan><\u002Fh2><p><strong>Table 4 — Disclosed investment-funding instruments (CONFIRMED / <span class=\"ev\">COMPANY CLAIM<\u002Fspan>):<\u002Fstrong><\u002Fp><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Instrument<\u002Fsc-raw-th><sc-raw-th>Amount<\u002Fsc-raw-th><sc-raw-th>Period<\u002Fsc-raw-th><sc-raw-th>Payer<\u002Fsc-raw-th><sc-raw-th>Nature<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>IT-Sonderumlage (banks)<\u002Fsc-raw-td><sc-raw-td>€60m/yr (~€300m cumulative)<\u002Fsc-raw-td><sc-raw-td>2018–2023<\u002Fsc-raw-td><sc-raw-td>Primary banks<\u002Fsc-raw-td><sc-raw-td>Earmarked levy<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>IT-Sonderumlage (DZ Bank)<\u002Fsc-raw-td><sc-raw-td>€180m<\u002Fsc-raw-td><sc-raw-td>2018–2023<\u002Fsc-raw-td><sc-raw-td>DZ Bank<\u002Fsc-raw-td><sc-raw-td>Sector capital grant<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>IT-Sonderumlage (self-funded)<\u002Fsc-raw-td><sc-raw-td>~€200m<\u002Fsc-raw-td><sc-raw-td>2018–2023<\u002Fsc-raw-td><sc-raw-td>Atruvia<\u002Fsc-raw-td><sc-raw-td>Retained earnings<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Digitalisierungsumlage / Zukunftsbanking<\u002Fsc-raw-td><sc-raw-td>€30m→€60m→€90m<\u002Fsc-raw-td><sc-raw-td>2023→2025<\u002Fsc-raw-td><sc-raw-td>Banks<\u002Fsc-raw-td><sc-raw-td>Earmarked levy (in revenue)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>General price increases<\u002Fsc-raw-td><sc-raw-td>~5% (2023) + ~5% (2024)<\u002Fsc-raw-td><sc-raw-td>ongoing<\u002Fsc-raw-td><sc-raw-td>Banks<\u002Fsc-raw-td><sc-raw-td>Price<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Retained earnings (4% Zielrendite)<\u002Fsc-raw-td><sc-raw-td>€27.8m→€46.3m→€60.5m Jahresüberschuss<\u002Fsc-raw-td><sc-raw-td>2023–2025<\u002Fsc-raw-td><sc-raw-td>Banks (as customers)<\u002Fsc-raw-td><sc-raw-td>Retention<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DZ Bank campus loan + credit line<\u002Fsc-raw-td><sc-raw-td>~€145–160m facility<\u002Fsc-raw-td><sc-raw-td>ongoing<\u002Fsc-raw-td><sc-raw-td>DZ Bank<\u002Fsc-raw-td><sc-raw-td>Debt<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Trade/supplier financing (IBM)<\u002Fsc-raw-td><sc-raw-td>+~€145m payables<\u002Fsc-raw-td><sc-raw-td>2025<\u002Fsc-raw-td><sc-raw-td>Vendor<\u002Fsc-raw-td><sc-raw-td>Vendor financing<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Total annual investment budget:<\u002Fstrong> AG capex €182.9m (2023) → €208.4m (2024) → €359.1m (2025); Investitionsquote 12.1% → 18.7%. The FY2025 jump reflects the IBM mainframe purchase.<\u002Fp><p><strong>Who ultimately bears each euro?<\u002Fstrong> The banks bear it three ways simultaneously — as <strong>customers<\u002Fstrong> (prices + levy embedded in service fees), as <strong>owners<\u002Fstrong> (foregone dividends via retained earnings), and — for the 2018–2023 tranche — via <strong>DZ Bank on the sector's behalf<\u002Fstrong> (€180m). The design (and the fragility) of the model is that the same party pays in three guises, which blurs accountability and lets Atruvia fund investment without a transparent price signal (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fp><p><strong>VR Payment financing (1 Jan 2027):<\u002Fstrong> purchase price <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>; Bundeskartellamt case B9-75/26 filed 15 July 2026; announced 2 July 2026.<\u002Fp><h2 id=\"s-iv-13\" class=\"hd hd2\"><span class=\"hn mono\">IV.13<\u002Fspan><span class=\"ht\">Cash Flow (AG)<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-18\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 18<\u002Fspan><span class=\"fig-t\">The Funding Squeeze<\u002Fspan><\u002Fdiv><div class=\"fig-b\"><div class=\"chart\" style=\"height:280px\"><div class=\"ax-y\"><span>€400m<\u002Fspan><span>€300m<\u002Fspan><span>€200m<\u002Fspan><span>€100m<\u002Fspan><span>0<\u002Fspan><\u002Fdiv><div class=\"plot\"><div class=\"gl\" style=\"bottom:100%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:75%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:50%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:25%\"><\u002Fdiv><div class=\"grp\"><div class=\"pair\"><div class=\"cb\" style=\"height:45.7%\"><span class=\"cbv mono\">182.9<\u002Fspan><\u002Fdiv><div class=\"cb acc\" style=\"height:11.8%\"><span class=\"cbv mono\">47<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"grp-l mono\">2023<\u002Fdiv><\u002Fdiv><div class=\"grp\"><div class=\"pair\"><div class=\"cb\" style=\"height:52.1%\"><span class=\"cbv mono\">208.4<\u002Fspan><\u002Fdiv><div class=\"cb acc\" style=\"height:23.2%\"><span class=\"cbv mono\">93<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"grp-l mono\">2024<\u002Fdiv><\u002Fdiv><div class=\"grp\"><div class=\"pair\"><div class=\"cb\" style=\"height:89.8%\"><span class=\"cbv mono\">359.1<\u002Fspan><\u002Fdiv><div class=\"cb acc\" style=\"height:9.5%\"><span class=\"cbv mono\">38<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"grp-l mono\">2025<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"lgd\"><span class=\"key\"><\u002Fspan>Investitionen (capex)<span class=\"key acc\"><\u002Fspan>Free cash flow<\u002Fdiv><\u002Fdiv><figcaption>Capex nearly doubles to €359.1m — an 18.7% Investitionsquote — while free cash flow falls to roughly €38m. After maintaining the mainframe estate and funding the platform transition, the business runs close to cash-neutral. AG basis.<\u002Ffigcaption><\u002Ffigure><figure class=\"fig\" id=\"figure-13\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 13<\u002Fspan><span class=\"fig-t\">Capex against Free Cash Flow<\u002Fspan><\u002Fdiv><div class=\"fig-b\" style=\"display:grid;grid-template-columns:1fr 260px;gap:32px;align-items:end\">\n  <div>\n    <div class=\"chart\" style=\"height:290px\">\n      <div class=\"ax-y\"><span>€400m<\u002Fspan><span>€300m<\u002Fspan><span>€200m<\u002Fspan><span>€100m<\u002Fspan><span>0<\u002Fspan><\u002Fdiv>\n      <div class=\"plot\">\n        <div class=\"gl\" style=\"bottom:100%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:75%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:50%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:25%\"><\u002Fdiv>\n        <div class=\"grp\"><div class=\"pair one\"><div class=\"cb\" style=\"height:45.7%\"><span class=\"cbv mono\">182.9<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"grp-l mono\">2023 · 12.1%<\u002Fdiv><\u002Fdiv>\n        <div class=\"grp\"><div class=\"pair one\"><div class=\"cb\" style=\"height:52.1%\"><span class=\"cbv mono\">208.4<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"grp-l mono\">2024 · 12.1%<\u002Fdiv><\u002Fdiv>\n        <div class=\"grp\"><div class=\"pair one\"><div class=\"cb acc\" style=\"height:89.8%\"><span class=\"cbv mono\">359.1<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"grp-l mono\">2025 · 18.7%<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"lgd\"><span class=\"key\"><\u002Fspan>Capex, Atruvia AG<span class=\"key acc\" style=\"margin-left:22px\"><\u002Fspan>FY2025 · Investitionsquote 18.7%<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pnl\">\n    <div class=\"pnl-k\">FY2025 free cash flow<\u002Fdiv>\n    <div class=\"calc\"><span>Operating cash flow<\u002Fspan><span class=\"mono\">€397.2m<\u002Fspan><\u002Fdiv>\n    <div class=\"calc\"><span>less capex<\u002Fspan><span class=\"mono\">−€359.1m<\u002Fspan><\u002Fdiv>\n    <div class=\"calc tot\"><span>Free cash flow<\u002Fspan><span class=\"mono acc\">~€38m<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><figcaption class=\"fig-c\"><b>After maintaining the mainframe estate, the business runs close to cash-neutral.<\u002Fb> The 2025 investment ratio of 18.7% is a step change, not a trend continuation.<\u002Ffigcaption><\u002Ffigure><p><strong>FY2025 cash-flow statement (CONFIRMED):<\u002Fstrong> Operating €397.2m; Investing −€357.5m; Financing −€34.8m; net change in cash +€4.9m; year-end Finanzmittelfonds €108.2m. <strong>FY2024:<\u002Fstrong> Operating €301.1m; Investing −€252.2m; Financing +€80.0m.<\u002Fp><ul class=\"lst\"><li><strong>Non-cash add-backs:<\u002Fstrong> Abschreibungen €213.8m (2025) + provision movements drive the gap between €60.5m net income and €397.2m operating cash flow.<\u002Fli><li><strong>Free cash flow:<\u002Fstrong> operating €397.2m − capex €359.1m ≈ <strong>€38m FCF (2025)<\u002Fstrong> — i.e. after maintaining the mainframe estate and funding the platform transition, the business generates only ~€38m of genuinely free cash. This is the <em>true<\u002Fem> discretionary surplus, and it is roughly the size of the dividend + debt service (financing −€34.8m). <strong>The business runs close to cash-neutral after investment<\u002Fstrong> (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fli><li><strong>Working capital:<\u002Fstrong> receivables from ~700 highly-rated cooperative banks; payment terms are short and default risk minimal; the 2025 payables spike is a deliberate financing choice, not stress.<\u002Fli><\u002Ful><h2 id=\"s-iv-14\" class=\"hd hd2\"><span class=\"hn mono\">IV.14<\u002Fspan><span class=\"ht\">Capital Intensity<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Maintenance vs growth capex:<\u002Fstrong> of €359.1m (2025), a large slice is <em>growth<\u002Fem> (IBM z17 software purchase, agree21 modernisation, capitalised development ~€25m); maintenance capex on the eight-system IBM Z estate and data centres is the recurring floor (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> — Atruvia does not split the two).<\u002Fli><li><strong>Mainframe refresh:<\u002Fstrong> the z15→z17 transition under the multi-year IBM deal is structured as <em>purchase + supplier financing + consumption licensing (Tailored Fit Pricing)<\u002Fem>, not a clean lease. Cost is not disclosed (<span class=\"ev\">UNKNOWN<\u002Fspan>) but the ~€145m payables jump and €286m immat. capex in 2025 bound its scale.<\u002Fli><li><strong>Return on incremental capital:<\u002Fstrong> poor by design — €404.7m extra Gesamtleistung (2023→2025) required cumulative capex of ~€750m over the same period for ~€48m extra Betriebsergebnis. The utility is not run to earn a return on capital; it is run to keep the sector's IT current at the lowest sustainable owner cost (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fli><\u002Ful><h2 id=\"s-iv-15\" class=\"hd hd2\"><span class=\"hn mono\">IV.15<\u002Fspan><span class=\"ht\">Capital Allocation<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Platform:<\u002Fstrong> agree21 modernisation, Omnikanalplattform (productive since 2019), BankingWorkspace (rollout from 2023), AI programme — the dominant use of capital.<\u002Fli><li><strong>Acquisitions:<\u002Fstrong> ECON (2023), Accesa IT Group (nearshore), VR Payment issuing-processing (2027). Strategically coherent — each extends the captive value chain (application tooling, nearshore capacity, card processing).<\u002Fli><li><strong>Loss-making venture support:<\u002Fstrong> TRUUCO (~−€8m/yr) sustained via capital injections — a strategic bet on data-driven sales, not a disciplined ROIC decision.<\u002Fli><li><strong>Portfolio housekeeping:<\u002Fstrong> GWS hardware transferred to Ratiodata (June 2024); EGP merged up into the AG (Sept 2023); ORGA Consulting merged up (2023); Accesa/RaRo moved from Ratiodata to AG (2024). Discipline is improving (consolidating overlaps), but returns are secondary to sector-utility objectives.<\u002Fli><\u002Ful><h2 id=\"s-iv-16\" class=\"hd hd2\"><span class=\"hn mono\">IV.16<\u002Fspan><span class=\"ht\">Revenue and Cost Waterfalls<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-6\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 06<\u002Fspan><span class=\"fig-t\">Where One Euro of Revenue Goes<\u002Fspan><\u002Fdiv><div class=\"fig-b\">\n  <div class=\"wf\">\n    <div class=\"wf-s s1\" style=\"width:41.2%\"><span class=\"mono\">41.2%<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-s s2\" style=\"width:34.1%\"><span class=\"mono\">34.1%<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-s s3\" style=\"width:11.1%\"><span class=\"mono\">11.1%<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-s s4\" style=\"width:9.7%\"><span class=\"mono\">9.7%<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-s s5\" style=\"width:4.6%\"><span class=\"mono\">4.6%<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"wf-lgd\">\n    <div class=\"wf-r\"><span class=\"key s1\"><\u002Fspan><span>Materialaufwand / bought-in services — IBM, nearshore, maintenance<\u002Fspan><span class=\"mono\">41.2%<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-r\"><span class=\"key s2\"><\u002Fspan><span>Personalaufwand<\u002Fspan><span class=\"mono\">34.1%<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-r\"><span class=\"key s3\"><\u002Fspan><span>Abschreibungen<\u002Fspan><span class=\"mono\">11.1%<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-r\"><span class=\"key s4\"><\u002Fspan><span>Sonstige betriebliche Aufwendungen<\u002Fspan><span class=\"mono\">9.7%<\u002Fspan><\u002Fdiv>\n    <div class=\"wf-r hi\"><span class=\"key s5\"><\u002Fspan><span>Betriebsergebnis<\u002Fspan><span class=\"mono\">4.6%<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"fig-note\">Atruvia AG, FY2025 · share of Gesamtleistung<\u002Fdiv>\n<\u002Fdiv><figcaption class=\"fig-c\"><b>Bought-in services, not personnel, are the largest cost<\u002Fb> — Atruvia is a systems integrator riding IBM and nearshore capacity. Shares are of Gesamtleistung, not Umsatzerlöse.<\u002Ffigcaption><\u002Ffigure><p><strong>€1 of Atruvia AG revenue (FY2025, per €1 of Gesamtleistung):<\u002Fstrong><\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Allocation<\u002Fsc-raw-th><sc-raw-th>€/€1<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Bought-in services (Material/bezogene Leistungen: IBM, nearshore, maintenance)<\u002Fsc-raw-td><sc-raw-td>0.412<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Personnel<\u002Fsc-raw-td><sc-raw-td>0.340<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Depreciation &amp; amortisation<\u002Fsc-raw-td><sc-raw-td>0.111<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Other operating (energy, travel, consulting)<\u002Fsc-raw-td><sc-raw-td>0.097<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>= Total operating cost<\u002Fsc-raw-td><sc-raw-td>0.960<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Betriebsergebnis<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>0.046<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Finance result<\u002Fsc-raw-td><sc-raw-td>+0.000<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Tax<\u002Fsc-raw-td><sc-raw-td>−0.015<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Retained (Jahresüberschuss)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>0.031<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>One member bank's annual relationship (illustrative, AG):<\u002Fstrong> average customer pays ~€2.07m/yr → ~€0.41 to IBM/nearshore/maintenance, ~€0.34 to Atruvia staff, ~€0.11 to depreciation, ~€0.10 to overhead, ~€0.046 retained for investment (≈€95k of the €2.07m). <em>(Group and AG are kept separate; this waterfall is AG only.)<\u002Fem><\u002Fp><h2 id=\"s-iv-17\" class=\"hd hd2\"><span class=\"hn mono\">IV.17<\u002Fspan><span class=\"ht\">Economic Driver Tree<\u002Fspan><\u002Fh2><p>The 5–8 variables explaining most outcomes:<\u002Fp><ol class=\"lst\"><li><strong>Number of member banks × accounts per bank<\u002Fstrong> → Bankverfahren revenue (~€909m). Consolidation shrinks bank count but accounts persist.<\u002Fli><li><strong>Workstations &amp; bandwidth<\u002Fstrong> → infrastructure revenue (~€357m).<\u002Fli><li><strong>Levy level (Digitalisierungsumlage)<\u002Fstrong> → ≈ the entire Betriebsergebnis (~€90m).<\u002Fli><li><strong>External-customer wins (migrations)<\u002Fstrong> → the main revenue-growth lever (+11.5% in 2025).<\u002Fli><li><strong>Personnel headcount &amp; tariff<\u002Fstrong> → €654m cost, largest controllable.<\u002Fli><li><strong>IBM/consumption licensing &amp; nearshore mix<\u002Fstrong> → ~€792m Material line, the largest cost.<\u002Fli><li><strong>Capitalisation rate of development<\u002Fstrong> → shifts cost between current EBIT and future depreciation.<\u002Fli><li><strong>Pension discount rate (HGB Rechnungszins)<\u002Fstrong> → provision and cost volatility.<\u002Fli><\u002Fol><p><code>Betriebsergebnis ≈ (Bankverfahren + Infrastruktur + Levies + Migration + Options) − (Bought-in services + Personnel + Depreciation + Overhead) → targeted at 4% of revenue, ≈ the levy.<\u002Fcode><\u002Fp><h2 id=\"s-iv-18\" class=\"hd hd2\"><span class=\"hn mono\">IV.18<\u002Fspan><span class=\"ht\">Scenario Model (assumptions explicit; directional)<\u002Fspan><\u002Fh2><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Scenario<\u002Fsc-raw-th><sc-raw-th>Revenue<\u002Fsc-raw-th><sc-raw-th>Margin<\u002Fsc-raw-th><sc-raw-th>Investment capacity<\u002Fsc-raw-th><sc-raw-th>Capital need<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>A. Base<\u002Fstrong> (consolidation continues, usage-pricing phases in)<\u002Fsc-raw-td><sc-raw-td>+4–6%/yr<\u002Fsc-raw-td><sc-raw-td>~4%<\u002Fsc-raw-td><sc-raw-td>Adequate<\u002Fsc-raw-td><sc-raw-td>Neutral<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>B. Accelerated bank consolidation<\u002Fstrong> (faster drop below ~600 banks)<\u002Fsc-raw-td><sc-raw-td>Flat/soft (fewer fixed-fee relationships)<\u002Fsc-raw-td><sc-raw-td>Squeezed<\u002Fsc-raw-td><sc-raw-td>Reduced<\u002Fsc-raw-td><sc-raw-td>Rising<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>C. External-win wave<\u002Fstrong> (more Sparda-type migrations)<\u002Fsc-raw-td><sc-raw-td>+8–12%/yr<\u002Fsc-raw-td><sc-raw-td>Lifted (migration fees)<\u002Fsc-raw-td><sc-raw-td>Improved<\u002Fsc-raw-td><sc-raw-td>Neutral/positive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>D. €450m–€1bn investment shock<\u002Fstrong> (<span class=\"ev\">HYPOTHESIS<\u002Fspan>)<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Turns negative without new levy<\u002Fsc-raw-td><sc-raw-td>Insufficient by €100–650m/yr<\u002Fsc-raw-td><sc-raw-td>New Sonderumlage or DZ Bank capital required<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>E. Major operational incident<\u002Fstrong> (liability + remediation)<\u002Fsc-raw-td><sc-raw-td>Flat<\u002Fsc-raw-td><sc-raw-td>Hit by one-offs<\u002Fsc-raw-td><sc-raw-td>Reduced<\u002Fsc-raw-td><sc-raw-td>Rising<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>F. DORA CTPP designation<\u002Fstrong> (direct oversight cost)<\u002Fsc-raw-td><sc-raw-td>Flat<\u002Fsc-raw-td><sc-raw-td>−0.2–0.5pp compliance cost<\u002Fsc-raw-td><sc-raw-td>Slightly reduced<\u002Fsc-raw-td><sc-raw-td>Modest<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>G. VR Payment over/under-delivers<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>± card revenue<\u002Fsc-raw-td><sc-raw-td>±<\u002Fsc-raw-td><sc-raw-td>±<\u002Fsc-raw-td><sc-raw-td>Integration capex<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>H. Owner revolt on prices<\u002Fstrong> (Zielrendite → 0)<\u002Fsc-raw-td><sc-raw-td>Flat<\u002Fsc-raw-td><sc-raw-td>~0%<\u002Fsc-raw-td><sc-raw-td>Collapses<\u002Fsc-raw-td><sc-raw-td>Forces external debt/levy<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-iv-19\" class=\"hd hd2\"><span class=\"hn mono\">IV.19<\u002Fspan><span class=\"ht\">Sensitivity Analysis (most-sensitive variables first)<\u002Fspan><\u002Fh2><ol class=\"lst\"><li><strong>Levy level<\u002Fstrong> — ~1:1 pass-through to Betriebsergebnis; a €30m levy cut wipes out a third of profit.<\u002Fli><li><strong>Personnel cost/tariff<\u002Fstrong> — €654m base; a 3% tariff rise ≈ €20m, ~22% of EBIT.<\u002Fli><li><strong>IBM/nearshore (Material) cost<\u002Fstrong> — ~€792m base; a 3% move ≈ €24m.<\u002Fli><li><strong>External wins/migration volume<\u002Fstrong> — the growth engine; each large Sparda-scale win adds ~€10–20m recurring.<\u002Fli><li><strong>Bank count<\u002Fstrong> — consolidation erodes the fixed-fee floor.<\u002Fli><li><strong>Pension discount rate<\u002Fstrong> — swings provisions and cost by tens of millions.<\u002Fli><li><strong>Development capitalisation rate<\u002Fstrong> — moves reported EBIT without changing cash.<\u002Fli><p>The economics are <strong>most sensitive to the levy and to personnel/Material costs<\u002Fstrong> — i.e. to political pricing decisions and to input-cost inflation, not to volume.<\u002Fp><\u002Fol><h2 id=\"s-iv-20\" class=\"hd hd2\"><span class=\"hn mono\">IV.20<\u002Fspan><span class=\"ht\">Revenue Quality Scorecard<\u002Fspan><\u002Fh2><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Stream<\u002Fsc-raw-th><sc-raw-th>Predictability<\u002Fsc-raw-th><sc-raw-th>Recurrence<\u002Fsc-raw-th><sc-raw-th>Retention<\u002Fsc-raw-th><sc-raw-th>Pricing power<\u002Fsc-raw-th><sc-raw-th>Concentration<\u002Fsc-raw-th><sc-raw-th>Cyclicality<\u002Fsc-raw-th><sc-raw-th>Margin<\u002Fsc-raw-th><sc-raw-th>Reg. risk<\u002Fsc-raw-th><sc-raw-th>Overall<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Bankverfahren (captive core)<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>~100%<\u002Fsc-raw-td><sc-raw-td><strong>Very low<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>High (sector)<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Thin<\u002Fsc-raw-td><sc-raw-td>High (DORA)<\u002Fsc-raw-td><sc-raw-td><strong>Highest quality by durability, lowest by pricing power<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Infrastructure<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Thin<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Levies<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Political<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>n/a (BVR-set)<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>≈ pure margin<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Migration/project<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Lumpy<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>External/non-coop<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Churn risk<\u002Fsc-raw-td><sc-raw-td><strong>Real<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Lower<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Medium-high<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Software subs (parcIT/ECON)<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Hardware/BPO subs<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Thin<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p>The defining paradox: <strong>captive revenue has near-perfect retention but near-zero pricing power<\u002Fstrong> (owners resist increases), while <strong>external revenue has real pricing power but real churn risk.<\u002Fstrong><\u002Fp><h2 id=\"s-iv-21\" class=\"hd hd2\"><span class=\"hn mono\">IV.21<\u002Fspan><span class=\"ht\">Profitability Decomposition<\u002Fspan><\u002Fh2><p><strong>Is the FY2025 4.7% margin structural or flattered?<\u002Fstrong> Predominantly flattered:<\u002Fp><ul class=\"lst\"><li><strong>Levy contribution:<\u002Fstrong> ~€90m of the €89.0m Betriebsergebnis. Remove it → <strong>underlying operating result ≈ €0<\u002Fstrong> (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fli><li><strong>Migration completions<\u002Fstrong> (Sparda group) added one-off project revenue in 2024–25.<\u002Fli><li><strong>Efficiency programme<\u002Fstrong> (\"internes Effizienzprogramm\") contributed genuine structural savings (management-cited driver of the 2023–24 improvement) — the only <em>durable<\u002Fem> profit component, likely low-double-digit €m.<\u002Fli><li><strong>FY2026 guidance margin ~3.9%<\u002Fstrong> confirms the 4.7% is a peak.<\u002Fli><\u002Ful><p><strong>What would the underlying business earn without the levies?<\u002Fstrong> Approximately break-even to slightly positive — consistent with a customer-owned utility priced at cost. The reported profit is, in substance, <strong>investment pre-funding collected from owners and parked in equity<\u002Fstrong>, not a commercial return.<\u002Fp><h2 id=\"s-iv-22\" class=\"hd hd2\"><span class=\"hn mono\">IV.22<\u002Fspan><span class=\"ht\">Economic Value &amp; Owner Returns — Finanz Informatik Benchmark<\u002Fspan><\u002Fh2><p>Atruvia is unlisted; conventional valuation is inapplicable. Its economic value to owners is <strong>cost avoidance<\u002Fstrong> versus (a) each bank building IT independently (impossible at ~950-bank scale) and (b) a commercial vendor's margin. The relevant test is <strong>relative efficiency vs Finanz Informatik<\u002Fstrong>, the near-identical Sparkassen utility. In the Lünendonk-Ranking 2025 of Germany's largest internal IT service providers, FI ranks #2 (revenue €2.6bn, 2024) and Atruvia #3 (€2.2bn, 2024, \"erstmals mehr als 10.000 Mitarbeiter\").<\u002Fp><p><strong>Table 5 — Atruvia vs Finanz Informatik (FY2024; CONFIRMED / THIRD-PARTY):<\u002Fstrong><\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Metric<\u002Fsc-raw-th><sc-raw-th>Atruvia (Group)<\u002Fsc-raw-th><sc-raw-th>Finanz Informatik (Group)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Revenue<\u002Fsc-raw-td><sc-raw-td>~€2.2bn<\u002Fsc-raw-td><sc-raw-td>~€2.6bn<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Employees<\u002Fsc-raw-td><sc-raw-td>10,076<\u002Fsc-raw-td><sc-raw-td>5,037 (FTE)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Accounts<\u002Fsc-raw-td><sc-raw-td>91m<\u002Fsc-raw-td><sc-raw-td>114m<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Technical transactions<\u002Fsc-raw-td><sc-raw-td>~80bn+ (uncertain)<\u002Fsc-raw-td><sc-raw-td>&gt;205bn<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Platform investment<\u002Fsc-raw-td><sc-raw-td>€208m (AG capex)<\u002Fsc-raw-td><sc-raw-td>€328m (OSPlus Basisangebot)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Revenue/employee<\u002Fsc-raw-td><sc-raw-td>~€218k<\u002Fsc-raw-td><sc-raw-td>~€516k<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Revenue/account<\u002Fsc-raw-td><sc-raw-td>~€24.2<\u002Fsc-raw-td><sc-raw-td>~€22.8<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Legal form<\u002Fsc-raw-td><sc-raw-td>AG (HGB Kapitalgesellschaft)<\u002Fsc-raw-td><sc-raw-td>GmbH &amp; Co. KG (partnership)<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Interpretation:<\u002Fstrong> FI is dramatically leaner per employee (€516k vs €218k revenue/employee) because it outsources hardware/field service (no Ratiodata-equivalent inside the perimeter) and runs a larger account base on a single platform (OSPlus). Atruvia's group figure is <em>structurally<\u002Fem> depressed by its ~1,500-strong hardware/field-service arm (Ratiodata) and its BPO/call-centre arm (Serviscope) — a business-mix difference, not pure inefficiency. On revenue/account the two are comparable (~€23–24). <strong>On the like-for-like platform metrics (accounts, transactions per employee, investment intensity), FI is the more efficient operator<\u002Fstrong>, reflecting its larger scale and leaner perimeter (per fi-magazin, FI invested €328m in the OSPlus Basisangebot in 2024, \"on premise\"). Atruvia's owner-banks nonetheless obtain IT at cost (near-zero margin), which is cheaper than any commercial vendor's marked-up alternative — so the cooperative model delivers cheap IT in <em>absolute<\u002Fem> terms, but not the <em>cheapest possible<\u002Fem> relative to its Sparkassen twin. An owner-bank's stake is economically worth its share of ~€557m equity plus the avoided commercial margin — but is illiquid and non-transferable outside the sector.<\u002Fp><h2 id=\"s-iv-23\" class=\"hd hd2\"><span class=\"hn mono\">IV.23<\u002Fspan><span class=\"ht\">Volume IV Reconstruction — Key Unknowns &amp; Ten Conclusions<\u002Fspan><\u002Fh2><p><strong>Key Unknowns (labelled <span class=\"ev\">UNKNOWN<\u002Fspan>):<\u002Fstrong><\u002Fp><ol class=\"lst\"><li>VR Payment issuing-processing purchase price.<\u002Fli><li>Exact annual dividend €m (small; embedded in financing cash flow).<\u002Fli><li>Group (Konzern) FY2025 full P&amp;L/balance sheet (behind Northdata paywall; not in accessible PDFs).<\u002Fli><li>IBM z17 total contract value and lease-vs-purchase-vs-consumption split.<\u002Fli><li>Per-bank and per-product margins (never disclosed).<\u002Fli><li>Precise technical-transaction denominator for cost/transaction.<\u002Fli><li>parcIT revenue-series continuity (perimeter changes).<\u002Fli><\u002Fol><p><strong>Ten Most Important Conclusions:<\u002Fstrong><\u002Fp><ol class=\"lst\"><li>Atruvia's real engine is a <strong>captive cost-recovery utility<\u002Fstrong>, not a profit-maximising firm.<\u002Fli><li><strong>The operating profit ≈ the digitalisation levy<\u002Fstrong> — profitability is levy-driven, not structural.<\u002Fli><li>The <strong>4% Zielrendite is a governance device<\u002Fstrong> to legitimise retained-earnings investment funding.<\u002Fli><li><strong>Bought-in services (~€792m) exceed personnel (€654m)<\u002Fstrong> — Atruvia is IBM- and nearshore-dependent.<\u002Fli><li><strong>Growth comes from external wins<\u002Fstrong> (Sparda, UmweltBank, etc.), not owner pricing power.<\u002Fli><li><strong>Free cash flow is thin (~€38m in 2025)<\u002Fstrong> after €359m capex — the utility runs near cash-neutral.<\u002Fli><li><strong>Capital access is the binding constraint<\u002Fstrong>: no equity market, fixed Grundkapital, falling EK-quote (38.2%), reliance on retained earnings + DZ Bank + supplier financing.<\u002Fli><li><strong>The model is sustainable at ~€350m/yr capex but not against the €450m–€1bn sector scenario<\u002Fstrong> without a new levy or DZ Bank capital.<\u002Fli><li><strong>FI is the more efficient twin<\u002Fstrong> on platform metrics; Atruvia's group margins conceal a break-even core, thin-margin services, higher-margin software, and a loss-making venture (TRUUCO).<\u002Fli><li><strong>The variable that matters most is the levy/pricing decision<\u002Fstrong> (political), followed by input-cost inflation — not volume.<\u002Fli><\u002Fol><p><strong>Direct answers to the closing questions:<\u002Fstrong> The economic engine is owner-financed cost recovery. The highest-quality revenue is captive Bankverfahren (retention) — but its pricing power is near-zero; the <em>best-quality<\u002Fem> by margin is software (parcIT/ECON). Profitability is ~100% levy-driven at present. Operating leverage is weak and mostly illusory (levy step-ups, not scale). The 4% Zielrendite is economically meaningful as a cash mechanism but a fiction as a \"margin.\" The investment race is funded by retained earnings + levies + DZ Bank + supplier financing, sustainable only at current intensity. The cooperative model delivers cheap IT absolutely but is less efficient than Finanz Informatik. The single most important variable is the sector's willingness to keep paying the levy/prices.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-recommendations-staged-with-thresholds\" class=\"hd hd2\"><span class=\"ht\">RECOMMENDATIONS (staged, with thresholds)<\u002Fspan><\u002Fh2><p><strong>Stage 1 — Immediate analytical positions (now):<\u002Fstrong><\u002Fp><ul class=\"lst\"><li>Treat the reported Betriebsergebnis as <strong>investment pre-funding, not profit<\u002Fstrong>. For any valuation or credit view, model the underlying (ex-levy) operating result at ~break-even.<\u002Fli><li><strong>Threshold to revise:<\u002Fstrong> if the Digitalisierungsumlage is withdrawn or capped and Betriebsergebnis holds above €50m, the margin would be proven structural — upgrade the quality assessment.<\u002Fli><\u002Ful><p><strong>Stage 2 — Monitor the funding constraint (next 12–24 months):<\u002Fstrong><\u002Fp><ul class=\"lst\"><li>Track EK-quote (38.2% and falling), Verb. ggü. Kreditinstituten, and trade-payables (supplier financing). <\u002Fli><li><strong>Threshold:<\u002Fstrong> EK-quote below ~30% or a new IT-Sonderumlage announcement would signal the model straining toward the €450m–€1bn scenario.<\u002Fli><\u002Ful><p><strong>Stage 3 — Watch the strategic pivots:<\u002Fstrong><\u002Fp><ul class=\"lst\"><li>VR Payment integration (from 1 Jan 2027) — obtain the purchase price and card-processing revenue run-rate when disclosed.<\u002Fli><li>Usage-based pricing rollout — measure whether it raises the <em>effective<\u002Fem> price to owners (revenue/account) or merely re-labels the levy.<\u002Fli><li>FI efficiency gap — if Atruvia's group revenue/employee moves toward FI's, the subsidiary-mix drag is being addressed.<\u002Fli><li><strong>Threshold:<\u002Fstrong> a DORA critical-third-party (CTPP) designation would add direct oversight cost and should be priced into the margin outlook.<\u002Fli><\u002Ful><div class=\"sep\"><\u002Fdiv><h2 id=\"s-caveats-3\" class=\"hd hd2\"><span class=\"ht\">CAVEATS<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Perimeter risk is acute:<\u002Fstrong> AG and Group figures are routinely conflated in secondary sources. This report keeps them separate; where Group FY2025 line items were unavailable (Northdata paywall), they are marked <span class=\"ev\">UNKNOWN<\u002Fspan> rather than spliced.<\u002Fli><li><strong>Levy-to-profit identity is an <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan><\u002Fstrong> from the close numerical match (€89.0m EBIT vs ~€90m levy) plus management's explicit investment-funding rationale; the accounts do not separately disclose the levy line.<\u002Fli><li><strong>Pre-2015 (Fiducia/GAD) and pre-2023 category splits are not continuous<\u002Fstrong> with the current entity/taxonomy (merger + presentation changes).<\u002Fli><li><strong>FI comparison mixes legal forms<\u002Fstrong> (AG vs GmbH &amp; Co. KG) and perimeters; treat efficiency gaps as directional, not precise.<\u002Fli><li><strong>Forward figures<\u002Fstrong> (FY2026 guidance €1,974.6m Gesamtleistung / €77.9m EBIT; the €450m–€1bn scenario) are <span class=\"ev\">COMPANY CLAIM<\u002Fspan> / <span class=\"ev\">HYPOTHESIS<\u002Fspan>, not outcomes.<\u002Fli><li><strong>Several FY2025 AG balance-sheet items<\u002Fstrong> (Materialaufwand ~€792.1m; Verb. ggü. Kreditinstituten ~€145m) are derived from disclosed YoY changes rather than read as absolute line items, and are flagged with \"~\".<\u002Fli><li>Several subsidiary figures (Serviscope €28.8m vs Gesamtleistung ~€44m; parcIT series) carry unreconciled perimeter discrepancies, flagged in-text.<\u002Fli><\u002Ful><p><em>End of <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-revenue-architecture-unit-economics-capital\">Volume IV<\u002Fa>. <a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-strategic-evolution\">Volume V<\u002Fa> not begun, per scope.<\u002Fem><\u002Fp><div class=\"sep\"><\u002Fdiv><\u002Fsection><section class=\"sec\" data-part=\"5\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part V<\u002Fspan><a href=\"#contents\">Volume V &nbsp;·&nbsp; Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">V<\u002Fspan><\u002Fdiv><h1 id=\"part-v-part-v-management-culture-competition-moat-risk-strategic-evolution\" class=\"part\" data-short=\"Part V — Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution\">Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution<\u002Fh1><p class=\"opener-s\">Why Atruvia persists, what is genuinely defensible, and what it becomes.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">V<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">29<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Benchmark<\u002Fdiv><div class=\"plate-v\">Finanz Informatik<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-tl-dr-3\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR<\u002Fspan><\u002Fa><a href=\"#s-key-findings-4\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details-4\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-v-1\"><span class=\"inpart-n\">V.1<\u002Fspan><span>Institutional Architects and Leadership Lineage (replaces Founder Analysis)<\u002Fspan><\u002Fa><a href=\"#s-v-2\"><span class=\"inpart-n\">V.2<\u002Fspan><span>Current Management Team<\u002Fspan><\u002Fa><a href=\"#s-v-3\"><span class=\"inpart-n\">V.3<\u002Fspan><span>Management System<\u002Fspan><\u002Fa><a href=\"#s-v-4\"><span class=\"inpart-n\">V.4<\u002Fspan><span>Culture — Declared versus Revealed<\u002Fspan><\u002Fa><a href=\"#s-v-5\"><span class=\"inpart-n\">V.5<\u002Fspan><span>Incentive Architecture<\u002Fspan><\u002Fa><a href=\"#s-v-6\"><span class=\"inpart-n\">V.6<\u002Fspan><span>Competitive Universe (re-cut by threat vector)<\u002Fspan><\u002Fa><a href=\"#s-v-7\"><span class=\"inpart-n\">V.7<\u002Fspan><span>Competitor Teardowns<\u002Fspan><\u002Fa><a href=\"#s-v-8\"><span class=\"inpart-n\">V.8<\u002Fspan><span>Why Member Banks Stay — and What That Costs Them<\u002Fspan><\u002Fa><a href=\"#s-v-9\"><span class=\"inpart-n\">V.9<\u002Fspan><span>Moat Analysis (reframed: prevents-exit vs creates-value)<\u002Fspan><\u002Fa><a href=\"#s-v-10\"><span class=\"inpart-n\">V.10<\u002Fspan><span>Replication and Replacement Test<\u002Fspan><\u002Fa><a href=\"#s-v-11\"><span class=\"inpart-n\">V.11<\u002Fspan><span>Porter's Five Forces (adapted for a captive utility)<\u002Fspan><\u002Fa><a href=\"#s-v-12\"><span class=\"inpart-n\">V.12<\u002Fspan><span>PESTLE (material factors only)<\u002Fspan><\u002Fa><a href=\"#s-v-13\"><span class=\"inpart-n\">V.13<\u002Fspan><span>Strategic Flywheels (positive)<\u002Fspan><\u002Fa><a href=\"#s-v-14\"><span class=\"inpart-n\">V.14<\u002Fspan><span>Negative Flywheels<\u002Fspan><\u002Fa><a href=\"#s-v-15\"><span class=\"inpart-n\">V.15<\u002Fspan><span>Theory of Constraints / Strategic Bottleneck<\u002Fspan><\u002Fa><a href=\"#s-v-16\"><span class=\"inpart-n\">V.16<\u002Fspan><span>Risk Register (heatmap)<\u002Fspan><\u002Fa><a href=\"#s-v-17\"><span class=\"inpart-n\">V.17<\u002Fspan><span>Stress Tests<\u002Fspan><\u002Fa><a href=\"#s-v-18\"><span class=\"inpart-n\">V.18<\u002Fspan><span>What Could Make Atruvia Obsolete?<\u002Fspan><\u002Fa><a href=\"#s-v-19\"><span class=\"inpart-n\">V.19<\u002Fspan><span>Strategic Optionality<\u002Fspan><\u002Fa><a href=\"#s-v-20\"><span class=\"inpart-n\">V.20<\u002Fspan><span>What Is Atruvia Becoming? (probability-ranked)<\u002Fspan><\u002Fa><a href=\"#s-v-21\"><span class=\"inpart-n\">V.21<\u002Fspan><span>Five-Year and Ten-Year Strategic Map<\u002Fspan><\u002Fa><a href=\"#s-v-22\"><span class=\"inpart-n\">V.22<\u002Fspan><span>Sector Misconceptions<\u002Fspan><\u002Fa><a href=\"#s-v-23\"><span class=\"inpart-n\">V.23<\u002Fspan><span>Management and Capital-Allocation Judgement<\u002Fspan><\u002Fa><a href=\"#s-v-24\"><span class=\"inpart-n\">V.24<\u002Fspan><span>Volume V Reconstruction — synthesis answers<\u002Fspan><\u002Fa><a href=\"#s-recommendations-3\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a href=\"#s-caveats-4\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">~€218k vs ~€516k<\u002Fdiv><div class=\"stat-l\">revenue per employee: Atruvia vs Finanz Informatik<\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 id=\"s-tl-dr-3\" class=\"hd hd2\"><span class=\"ht\">TL;DR<\u002Fspan><\u002Fh2><ul class=\"lst\"><li>Atruvia persists not because it is competitively excellent but because it is structurally inescapable: its member banks own it, can
