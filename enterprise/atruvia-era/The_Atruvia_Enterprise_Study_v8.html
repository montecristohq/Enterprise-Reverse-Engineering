rong>Left the platform<\u002Fstrong> — migrated to Avaloq (<a class=\"xr\" href=\"#s-ii-10\">II.10<\u002Fa> exit).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Private banks<\u002Fsc-raw-td><sc-raw-td>~190; M.M. Warburg (announced), Bankhaus C.L. Seeliger<\u002Fsc-raw-td><sc-raw-td>Growth segment outside the captive base.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Non-cooperative migrations<\u002Fsc-raw-td><sc-raw-td>Bank für Sozialwirtschaft, UmweltBank, National-Bank Essen<\u002Fsc-raw-td><sc-raw-td>Inbound wins (<a class=\"xr\" href=\"#s-ii-11\">II.11<\u002Fa>).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Non-bank customers<\u002Fsc-raw-td><sc-raw-td>ADAC<\u002Fsc-raw-td><sc-raw-td>IT-outsourcing/other-industry.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h3 id=\"s-by-legacy-platform-does-the-north-south-divide-persist\" class=\"hd hd3\"><span class=\"ht\">By legacy platform (does the north/south divide persist?)<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>: the ex-Fiducia (south, \"agree\") and ex-GAD (north, \"bank21\") divide has been <strong>eliminated at the core<\u002Fstrong> — all migrated to agree21 by 2019–2020. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: residual organisational traces persist (two administrative seats, Karlsruhe and Münster), but there is no longer a platform, pricing or service divide by legacy — the single platform is precisely what enables sector-wide rollout (<a class=\"xr\" href=\"#s-ii-9\">II.9<\u002Fa>).<\u002Fp><h3 id=\"s-by-size\" class=\"hd hd3\"><span class=\"ht\">By size<\u002Fspan><\u002Fh3><p><strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> the base ranges from a handful of very large Volksbanken (e.g. Frankfurter Volksbank Rhein/Main, Berliner Volksbank — multi-billion balance sheets) to hundreds of small rural Raiffeisenbanken. Roadmap influence correlates with size and Kompetenzteam participation. Large banks are the most likely to chafe at limited white-labelling and to be \"nicht alle … zufrieden\" with the digital offering (Platow). Small banks are the biggest beneficiaries of scale economics — they could never build MaRisk/BAIT/DORA-compliant IT alone. Price sensitivity is high across the board because IT is a cost line for owner-members.<\u002Fp><h3 id=\"s-by-product-adoption-depth\" class=\"hd hd3\"><span class=\"ht\">By product-adoption depth<\u002Fspan><\u002Fh3><p><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: adoption depth is the real revenue lever now that the base is saturated. Atruvia is explicitly \"die Wertschöpfung vertiefen\" — deepening value-add at banks that \"ohnehin alle das Core-Banking der Atruvia verwenden\" (Finanz-Szene). Depth tiers: (1) core + channels only; (2) + steering (VR-Control) + M365; (3) + BPO (Serviscope/Peras) + analytics (TRUUCO) + AI (genoGPT). The usage-based pricing shift (<a class=\"xr\" href=\"#s-ii-8\">II.8<\u002Fa>) is designed to monetise depth.<\u002Fp><h3 id=\"s-the-consolidation-trend-and-its-consequences\" class=\"hd hd3\"><span class=\"ht\">The consolidation trend and its consequences<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Bank mergers requiring technical migration: <strong>42 (2021), 40 (2022), 40–45 registered for 2023<\u002Fstrong>. The cooperative-bank count has fallen from \"rund 820\" (2022 GB) to \"gut 700\" / \"rund 670\" (2025). <strong>Consequence (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>):<\u002Fstrong> the captive base is shrinking in <em>institution count<\u002Fem> but not in <em>accounts/volume<\u002Fem> (accounts rose 89m→91m→97m), because mergers consolidate rather than remove customers. For Atruvia this means (a) fewer, larger, more demanding buyers with more governance weight; (b) recurring migration revenue from consolidations; and (c) growing importance of external wins (<a class=\"xr\" href=\"#s-ii-11\">II.11<\u002Fa>) to offset institution shrinkage.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-4\" class=\"hd hd2\"><span class=\"hn mono\">II.4<\u002Fspan><span class=\"ht\">Jobs to Be Done<\u002Fspan><\u002Fh2><h3 id=\"s-for-member-banks-candidate-jobs-tested-against-evidence\" class=\"hd hd3\"><span class=\"ht\">For member banks — candidate jobs tested against evidence<\u002Fspan><\u002Fh3><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Candidate job<\u002Fsc-raw-th><sc-raw-th>Verdict<\u002Fsc-raw-th><sc-raw-th>Evidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Remain an independent bank at all<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>PRIMARY JOB<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Without shared IT, a €500m rural Raiffeisenbank could not meet MaRisk/BAIT/DORA or offer a competitive app. UmweltBank's Koppmann: \"Wir benötigen … einen starken Partner, der uns das ganze Spektrum an digitalen Lösungen … bietet.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Satisfy MaRisk/BAIT/DORA without building the capability<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Confirmed, major<\u002Fsc-raw-td><sc-raw-td>agree21Finanzen automates Meldewesen; §25b KWG responsibility stays with the bank but execution is Atruvia's (<a class=\"xr\" href=\"#s-ii-5\">II.5<\u002Fa>.F).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Compete digitally vs Sparkassen and neobanks<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Confirmed, contested outcome<\u002Fsc-raw-td><sc-raw-td>VR Banking App 84.5 pts vs Sparkassen 92.6 (Capital 2026).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Hold the cost-income ratio down<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Confirmed<\u002Fsc-raw-td><sc-raw-td>Scale economics; but IT cost rises (<a class=\"xr\" href=\"#s-ii-8\">II.8<\u002Fa>) push the other way.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Access sector-wide scale economics<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Confirmed, foundational<\u002Fsc-raw-td><sc-raw-td>Single platform, shared development, shared regulatory implementation.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>What Atruvia says it sells vs what banks are buying.<\u002Fstrong> Atruvia says it sells a \"Technologie- und Digitalisierungspartner\" relationship. <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> what banks actually buy is <em>the ability to remain independent regulated banks<\u002Fem> — a bundle of software + regulatory compliance + scale economics + risk transfer that no single small bank could assemble. The software is the visible product; the licence-to-operate is the real purchase.<\u002Fp><h3 id=\"s-for-end-customers-the-vr-banking-app-vs-sparkassen-and-neobanks\" class=\"hd hd3\"><span class=\"ht\">For end customers — the VR Banking App vs Sparkassen and neobanks<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (Capital 3/2026 ranking, conducted by the Institut für Vermögensaufbau (IVA) across 33 banking apps):<\u002Fp><ul class=\"lst\"><li><strong>Sparkassen-App: 92.6 points<\u002Fstrong> (1st overall, fifth consecutive win; ~16.6m active users Feb 2024 / ~19.8m active installations per Star Finanz 2026).<\u002Fli><li><strong>BW-Mobilbanking: 87.5<\u002Fstrong> (2nd, also Sparkassen-Verbund).<\u002Fli><li><strong>C24: 85.5<\u002Fstrong> (top direct/neobank).<\u002Fli><li><strong>VR Banking App: 84.5<\u002Fstrong> (assessed in the direct-bank segment).<\u002Fli><\u002Ful><p>Kaurin (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>): \"Der Wettbewerb entscheidet sich nicht mehr an Features – die haben wir in der VR Banking App in großer Breite. Jetzt geht es um persönliche Relevanz.\" N26/Revolut/bunq/Wise are noted for intuitive onboarding, instant card controls, sub-accounts and multicurrency.<\u002Fp><p><strong>Adoption figures and the reconciliation the brief demanded:<\u002Fstrong><\u002Fp><ul class=\"lst\"><li><strong>\"&gt;12 million downloads and &gt;5 million logins per day\"<\u002Fstrong> — CONFIRMED as a <span class=\"ev\">COMPANY CLAIM<\u002Fspan>. Margit Messika (Leiterin Geschäftsfeld Omnichannel, Atruvia), Profil interview, 3 June 2025: \"Mit mittlerweile über zwölf Millionen Downloads und täglich mehr als fünf Millionen Logins ist die VR Banking App ein zentraler Zugangskanal … geworden.\" \"Downloads\" is cumulative installs; \"logins per day\" is a daily-activity flow.<\u002Fli><li><strong>\"~991,000 active users, March 2024\" (finalarm.de)<\u002Fstrong> — a <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan> that cannot measure the same population as \"5 million logins/day.\" <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: the ~991k figure is almost certainly a single-app-store or single-tool MAU snapshot, not the total user base. The reconciliation: downloads (&gt;12m cumulative) ⊃ active user base (millions) ⊃ daily logins (&gt;5m/day, a flow that can exceed distinct daily users). The finalarm ~991k is not credible as a total and should be treated as a partial/erroneous measurement.<\u002Fli><\u002Ful><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-5\" class=\"hd hd2\"><span class=\"hn mono\">II.5<\u002Fspan><span class=\"ht\">Service-Delivery Flow Reconstruction (replaces money-movement; priority depth)<\u002Fspan><\u002Fh2><p>Six flows, kept strictly separate.<\u002Fp><h3 id=\"s-a-transaction-flow-payments-bookings-on-behalf-of-banks\" class=\"hd hd3\"><span class=\"ht\">A. Transaction flow (payments/bookings on behalf of banks)<\u002Fspan><\u002Fh3><p>End customer initiates in a channel → agree21 core (IMS/Db2) validates and posts → interbank leg clears via <strong>DZ Bank<\u002Fstrong> (Clearingstelle) for non-internal payments → counterparty bank. Atruvia is <strong>processor/operator<\u002Fstrong>; the <strong>member bank is the principal<\u002Fstrong>; <strong>DZ Bank is the clearer<\u002Fstrong>; the <strong>Bundesbank/EBA CLEARING<\u002Fstrong> provide settlement rails (TIPS for instant; see <a class=\"xr\" href=\"#s-ii-6\">II.6<\u002Fa>). ~9–10bn business bookings/year decompose into ~80bn+ IMS transactions (<a class=\"xr\" href=\"#s-ii-0\">II.0<\u002Fa>).<\u002Fp><h3 id=\"s-b-data-flow-and-gdpr-roles\" class=\"hd hd3\"><span class=\"ht\">B. Data flow and GDPR roles<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (mechanism). Customer/account/transaction data and regulatory-reporting data flow between bank and Atruvia data centres. <strong>GDPR: bank = controller; Atruvia = processor<\u002Fstrong> under an Auftragsverarbeitungsvertrag (AVV). Regulatory-reporting data flows outward from agree21Finanzen to the Bundesbank/BaFin <strong>on the bank's behalf and responsibility<\u002Fstrong>. Atruvia's AI products run in a <strong>private cloud with no open-internet connection<\u002Fstrong> to keep processing within the AVV/GDPR perimeter. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: the AVV + §25b KWG outsourcing contract is the legal spine of the entire relationship (<a class=\"xr\" href=\"#s-ii-5\">II.5<\u002Fa>.F).<\u002Fp><h3 id=\"s-c-software-release-flow-how-a-release-reaches-800-banks-priority-gap-4\" class=\"hd hd3\"><span class=\"ht\">C. Software-release flow — how a release reaches ~800 banks (Priority Gap 4)<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (mechanism, reconstructed from the M365 and BankingWorkspace rollouts, which Atruvia documents as templates):<\u002Fp><ol class=\"lst\"><li><strong>Technical tests<\u002Fstrong> (BankingWorkspace: Q4 2022).<\u002Fli><li><strong>Pilotierung<\u002Fstrong> with a small cohort (M365: 8 pilot banks end-2022; BWS piloting from 2023).<\u002Fli><li><strong>Serienpiloten / Serienfähigkeit<\u002Fstrong> proving mass-rollout capability (M365: 12 pilot banks in 2022, then 44 in 2023 → 56 including Vor- und Serienpiloten).<\u002Fli><li><strong>Serienmigration<\u002Fstrong> in tranches (M365: ~300 banks in 2024).<\u002Fli><li><strong>Bank-side acceptance and change management<\u002Fstrong> — each bank must do MaRisk-conform change assessment \"gem. AT 8.2,\" retest its processes and schedule.<\u002Fli><li><strong>The annual technical year-end close (technischer Jahresabschluss)<\u002Fstrong> is the marquee coordinated release event — \"erneut … sehr geräuschlos.\"<\u002Fli><li><strong>Notification<\u002Fstrong> via SPP/agree21Communitys, LiveTalks, Strategie Hub Regional and the Atruvia Hub.<\u002Fli><\u002Fol><p><strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> releases are centralised and quasi-mandatory (multi-tenant platform → one code line for all), but <em>adoption of new optional processes<\u002Fem> (of ~300 available) is bank-by-bank. The bank's \"acceptance role\" is real for change-management/AT 8.2 but does <strong>not<\u002Fstrong> include the right to refuse a core release — a single tenant cannot fork the platform. This is the source of both the sector's rollout speed and its systemic single-point-of-failure risk (<a class=\"xr\" href=\"#s-ii-12\">II.12<\u002Fa>).<\u002Fp><h3 id=\"s-d-money-flow-fees-from-banks-to-atruvia\" class=\"hd hd3\"><span class=\"ht\">D. Money flow (fees from banks to Atruvia)<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (structure; specifics <span class=\"ev\">UNKNOWN<\u002Fspan>). Banks pay via the Umlage/Leistungsentgelte model: a <strong>Basispaket<\u002Fstrong> (with a volume element, \"Mengenwachstum im Basispaket\"), a <strong>Festpreis<\u002Fstrong> component, the infrastructure/Netze/Collaboration/Arbeitsplatz charges, plus the special levies (IT-Sonderumlage, Digitalisierungsumlage). GB2021 revenue split (closest public breakdown): <strong>Erlöse aus Bankverfahren €863.1m<\u002Fstrong> and <strong>Erlöse aus Infrastruktur €227.9m<\u002Fstrong> of €1,496.1m total. Invoicing cadence and per-unit tariffs are <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong> (internal Leistungsverzeichnis; confidential). See <a class=\"xr\" href=\"#s-ii-8\">II.8<\u002Fa>.<\u002Fp><h3 id=\"s-e-support-and-incident-flow\" class=\"hd hd3\"><span class=\"ht\">E. Support and incident flow<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Tiered:<\u002Fp><ul class=\"lst\"><li><strong>Serviceline<\u002Fstrong> — a qualified <em>technical end-customer hotline<\u002Fem> for OnlineBanking/MobileBanking, GENO cash, Profi cash, VR-NetWorld Software and BankingManager, plus remote-desktop (Fernwartung). Crucially \"<strong>only reachable via the telephone number provided by your bank<\u002Fstrong>\" — the bank fronts it; Atruvia stays invisible.<\u002Fli><li><strong>Bank-facing service desk<\u002Fstrong> for the institutions themselves.<\u002Fli><li><strong>Escalation<\u002Fstrong> — during major incidents Atruvia convenes a <strong>Krisenstab<\u002Fstrong> (evidenced 9 Nov 2020) and communicates to banks; banks then communicate to end customers (e.g. 7 July 2026: users warned not to resubmit transfers).<\u002Fli><li>Status communication during the 7 July 2026 outage was via bank websites and press statements; Atruvia deliberately switched off app/online banking \"um die Systeme zu entlasten.\"<\u002Fli><\u002Ful><h3 id=\"s-f-regulatory-responsibility-flow-25b-kwg\" class=\"hd hd3\"><span class=\"ht\">F. Regulatory-responsibility flow (§25b KWG)<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (mechanism). Under <strong>§25b KWG / MaRisk AT 9 / BAIT<\u002Fstrong>, outsourcing does not transfer regulatory responsibility: the <strong>member bank remains fully responsible<\u002Fstrong> to BaFin; Atruvia executes. This requires (1) a written outsourcing contract with mandated content; (2) the bank's <strong>Auslagerungsregister<\u002Fstrong>; (3) <strong>audit rights<\u002Fstrong> for the bank and BaFin flowing through to Atruvia; (4) exit/contingency provisions, now sharpened by <strong>DORA Article 30<\u002Fstrong> mandatory clauses and exit strategies (<a class=\"xr\" href=\"#s-ii-10\">II.10<\u002Fa>). The 2018 BaFin special inspection (triggered via Volksbank Jever) and the <strong>§44 KWG special inspection begun Nov 2023<\u002Fstrong> (<a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa>) demonstrate BaFin reaches Atruvia <em>through<\u002Fem> its supervised banks. Atruvia was <strong>not<\u002Fstrong> designated a DORA Critical ICT Third-Party Provider (18 Nov 2025), though IBM was (<a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa>) — a material risk observation (<a class=\"xr\" href=\"#s-ii-12\">II.12<\u002Fa>).<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-6\" class=\"hd hd2\"><span class=\"hn mono\">II.6<\u002Fspan><span class=\"ht\">Transaction Processing Teardown (priority depth)<\u002Fspan><\u002Fh2><p>Each event: system → legal entity → data → control point → failure mode.<\u002Fp><h3 id=\"s-1-sepa-credit-transfer-initiated-in-the-vr-banking-app\" class=\"hd hd3\"><span class=\"ht\">(1) SEPA credit transfer initiated in the VR Banking App<\u002Fspan><\u002Fh3><ol class=\"lst\"><li><strong>Initiation<\u002Fstrong> — VR Banking App (Atruvia); <strong>release via VR SecureGo plus<\u002Fstrong> (SCA/PSD2). <em>Control:<\u002Fem> SCA. <em>Data:<\u002Fem> payment instruction, device binding.<\u002Fli><li><strong>Core processing<\u002Fstrong> — agree21 (Atruvia; IMS/Db2) validates balance/limits, debits. <em>Control:<\u002Fem> balance/limit check, fraud screening (AI since 2017). <em>Failure:<\u002Fem> core outage → order stuck (7 July 2026 pattern).<\u002Fli><li><strong>Clearing<\u002Fstrong> — interbank leg via <strong>DZ Bank<\u002Fstrong> (Clearingstelle) → SEPA scheme → creditor bank. <em>Legal entity:<\u002Fem> DZ Bank principal for clearing; customer's bank principal for the payment; Atruvia processor.<\u002Fli><li><strong>Settlement<\u002Fstrong> — via Bundesbank/EBA CLEARING. <em>Failure:<\u002Fem> duplicate-submission risk if users resubmit during an outage (explicit 7 July 2026 warning).<\u002Fli><\u002Fol><h3 id=\"s-2-sepa-instant-payment-sct-inst\" class=\"hd hd3\"><span class=\"ht\">(2) SEPA instant payment (SCT Inst)<\u002Fspan><\u002Fh3><p><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> + <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (partial). Wero transactions \"werden direkt von Ihrem Girokonto in Echtzeit ausgeführt\" (CONFIRMED). Instant SEPA routes through DZ Bank's real-time platform to <strong>TIPS<\u002Fstrong> (the Eurosystem instant-settlement platform referenced in the Bundesbank Verfahrensregeln for SEPA-Echtzeitüberweisungen). GENO cash already supports instant single orders (CONFIRMED). <em>Control:<\u002Fem> the &lt;10-second execution guarantee and recipient-PSP-reachability check. <em>Failure:<\u002Fem> rejection if recipient PSP unreachable or TIPS rejects. <strong>Atruvia's precise SCT Inst reach is <span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>, but DZ Bank states \"alle Zahlungsverkehrskonten im Hause der DZ BANK [sind] für den Empfang von Echtzeit-Zahlungen freigeschaltet.\"<\u002Fp><h3 id=\"s-3-girocard-point-of-sale-transaction\" class=\"hd hd3\"><span class=\"ht\">(3) girocard point-of-sale transaction<\u002Fspan><\u002Fh3><p><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> + <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Card at terminal → acquirer (<strong>VR Payment<\u002Fstrong> on acceptance) → girocard scheme → <strong>issuer processing<\u002Fstrong> (today partly Atruvia/partly VR Payment) → agree21 posts. <em>Legal entities:<\u002Fem> merchant's bank/VR Payment (acquiring), the scheme, the issuing cooperative bank (principal), Atruvia (issuer processing). <em>Failure:<\u002Fem> card-processing outage → declines. <strong>From 1 Jan 2027<\u002Fstrong> issuer processing (debit <strong>and<\u002Fstrong> credit) consolidates at Atruvia; acquiring/POS stays at VR Payment.<\u002Fp><h3 id=\"s-4-atm-cash-withdrawal\" class=\"hd hd3\"><span class=\"ht\">(4) ATM cash withdrawal<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (partial). Card at one of ~30–34k Atruvia-operated terminals → authorisation via issuer processing → agree21 debit. <em>Resilience fact:<\u002Fem> during 9 Nov 2020 and DDoS incidents, SB-terminals largely kept working when online/app were down (\"Bargeldversorgung weiterhin möglich\") — ATMs sit on a partly independent path. <em>Failure:<\u002Fem> central-system outages can still propagate to Auszugsdrucker/terminals (reported sporadically 2020).<\u002Fp><h3 id=\"s-5-card-transaction-today-vs-after-the-1-jan-2027-migration\" class=\"hd hd3\"><span class=\"ht\">(5) Card transaction today vs after the 1 Jan 2027 migration<\u002Fspan><\u002Fh3><ul class=\"lst\"><li><strong>Today:<\u002Fstrong> debit issuer processing at Atruvia; <strong>credit-card processing at VR Payment<\u002Fstrong>; acquiring at VR Payment. Two houses, \"Doppelstrukturen.\"<\u002Fli><li><strong>From 1 Jan 2027:<\u002Fstrong> Atruvia runs <strong>unified issuer processing for girocard + debit + credit on one integrated platform<\u002Fstrong>; VR Payment keeps acquiring/POS/omnichannel. Rationale: consolidate double structures, lift synergies, avoid parallel investment; and — decisively for lock-in — \"Wenn Konto und Karte bei Atruvia zusammengeführt werden, verbessere das die Verzahnung zentraler Leistungen.\" <em>Bundeskartellamt:<\u002Fem> B9-75/26, notified 15 July 2026.<\u002Fli><\u002Ful><h3 id=\"s-6-loan-application-and-account-opening\" class=\"hd hd3\"><span class=\"ht\">(6) Loan application and account opening<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (mechanism). Digital end-to-end strecken via the Omnikanalplattform/agree21ECON (e.g. \"Sofortkredit Privatkunde,\" digital Baufinanzierung with self-service, analytics, document management; \"Neukunde (Produktverkauf)\" automated customer+account creation). AI document recognition extracts data from IDs/energy certificates/financial documents. <em>Control:<\u002Fem> KYC/credit decisioning (bank's rules). <em>Legal entity:<\u002Fem> bank is lender/principal; Atruvia provides the rails.<\u002Fp><h3 id=\"s-7-branch-counter-transaction-through-the-bankarbeitsplatz\" class=\"hd hd3\"><span class=\"ht\">(7) Branch-counter transaction through the Bankarbeitsplatz<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Bank employee works in <strong>BankingWorkspace<\u002Fstrong> / legacy <strong>agree21BAP<\u002Fstrong> → agree21 core. <em>Control:<\u002Fem> employee authorisation/role model. <em>Failure:<\u002Fem> during coexistence, some functions (CRM) exist in both → double maintenance, error risk (Coenen's \"zäh\").<\u002Fp><h3 id=\"s-8-third-party-aggregator-access-via-fints-psd2\" class=\"hd hd3\"><span class=\"ht\">(8) Third-party aggregator access via FinTS/PSD2<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. External software (windata, konfipay, ALF-BanCo, GLS eBank, subsembly) connects to fints1/fints2.atruvia.de. <em>Legal entity:<\u002Fem> Atruvia operates the PSD2/FinTS access interface on the bank's behalf; the bank is the ASPSP. <em>Failure:<\u002Fem> FinTS server unreachable → aggregators fail (evidenced 7 July 2026 HBCI/FinTS problems; and the CAMT52 special-character bug of 10 June 2020).<\u002Fp><p>Where internal mechanics are not public they are labelled <span class=\"ev\">UNKNOWN<\u002Fspan> (notably exact SCT Inst reach and internal card-platform architecture pre-2027).<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-7\" class=\"hd hd2\"><span class=\"hn mono\">II.7<\u002Fspan><span class=\"ht\">Channel Architecture<\u002Fspan><\u002Fh2><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Channel<\u002Fsc-raw-th><sc-raw-th>Operating entity<\u002Fsc-raw-th><sc-raw-th>End-customer experience<\u002Fsc-raw-th><sc-raw-th>Bank configurability / white-labelling<\u002Fsc-raw-th><sc-raw-th>Strategic importance<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Branch / BankingWorkspace<\u002Fsc-raw-td><sc-raw-td>Atruvia<\u002Fsc-raw-td><sc-raw-td>Advisor-mediated<\u002Fsc-raw-td><sc-raw-td>Role models configurable; process selection (~300 available)<\u002Fsc-raw-td><sc-raw-td>High (efficiency lever)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>OnlineBanking<\u002Fsc-raw-td><sc-raw-td>Atruvia<\u002Fsc-raw-td><sc-raw-td>Browser banking<\u002Fsc-raw-td><sc-raw-td>Limited; bank branding/skin, product config<\u002Fsc-raw-td><sc-raw-td>Core<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>VR Banking App<\u002Fsc-raw-td><sc-raw-td>Atruvia<\u002Fsc-raw-td><sc-raw-td>Mobile flagship<\u002Fsc-raw-td><sc-raw-td><strong>Low individual white-labelling<\u002Fstrong> — shared app, bank identity via config<\u002Fsc-raw-td><sc-raw-td>Highest (primary interface)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Self-service / ATMs<\u002Fsc-raw-td><sc-raw-td>Atruvia (+ Ratiodata)<\u002Fsc-raw-td><sc-raw-td>Cash/print<\u002Fsc-raw-td><sc-raw-td>Device mix per bank<\u002Fsc-raw-td><sc-raw-td>High (cash + resilience)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Call centre / BPO<\u002Fsc-raw-td><sc-raw-td>Serviscope / Serviceline<\u002Fsc-raw-td><sc-raw-td>Phone/remote support<\u002Fsc-raw-td><sc-raw-td>Bank fronts the number<\u002Fsc-raw-td><sc-raw-td>Medium (defensive)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Chat / AI assistants<\u002Fsc-raw-td><sc-raw-td>Atruvia (genoGPT/chatbot)<\u002Fsc-raw-td><sc-raw-td>Chatbot on bank site; in-app voice assistant<\u002Fsc-raw-td><sc-raw-td>Bank opts in<\u002Fsc-raw-td><sc-raw-td>Growing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Third-party aggregators<\u002Fsc-raw-td><sc-raw-td>Atruvia (FinTS/PSD2)<\u002Fsc-raw-td><sc-raw-td>Customer's chosen app<\u002Fsc-raw-td><sc-raw-td>Regulatorily mandated open access<\u002Fsc-raw-td><sc-raw-td>Obligatory<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>White-labelling — the answer to the brief's question:<\u002Fstrong> <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> (high confidence). A member bank can customise <strong>branding, product catalogue, pricing, which optional processes it switches on, and role models<\u002Fstrong> — but it <strong>cannot fork the app or the platform<\u002Fstrong>. The VR Banking App is one shared multi-tenant app; a bank cannot ship a materially different version. This is deliberate (scale economics, single code line, uniform security) and is the deepest source of both efficiency and large-bank frustration.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-8\" class=\"hd hd2\"><span class=\"hn mono\">II.8<\u002Fspan><span class=\"ht\">Pricing and Cost-Allocation Architecture (priority depth)<\u002Fspan><\u002Fh2><h3 id=\"s-the-structure\" class=\"hd hd3\"><span class=\"ht\">The structure<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Banks fund Atruvia through:<\u002Fp><ol class=\"lst\"><li><strong>Leistungsentgelte / Basispaket<\u002Fstrong> — base service fees with a volume-growth element.<\u002Fli><li><strong>Festpreis<\u002Fstrong> components.<\u002Fli><li><strong>Infrastructure / Netze, Collaboration &amp; Arbeitsplatz<\u002Fstrong> charges.<\u002Fli><li><strong>Special levies:<\u002Fstrong> the <strong>IT-Sonderumlage<\u002Fstrong> and the <strong>Digitalisierungsumlage<\u002Fstrong>.<\u002Fli><\u002Fol><h3 id=\"s-the-it-sonderumlage-and-its-perpetuation\" class=\"hd hd3\"><span class=\"ht\">The IT-Sonderumlage and its perpetuation<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (Börsen-Zeitung, \"Atruvia will IT-Umlage verstetigen\"): the IT-Sonderumlage, resolved ~2018 as a five-year Zukunftsinvestition, \"belief sich auf 60 Mill. Euro jährlich\" from the cooperative banks — \"Weitere 180 Mill. Euro kamen vom Zentralinstitut DZ Bank und rund 200 Mill. Euro von der Rechenzentrale selbst.\" DER PLATOW Brief: cumulatively \"seit 2018 300 Mio. Euro\" collected from the Volks- und Raiffeisenbanken. Due to expire end-June 2023, Atruvia sought its <strong>Verstetigung<\u002Fstrong>; the Aufsichtsrat was to decide \"bereits Ende April\" 2023, with details worked out from summer. Atruvia and BVR declined to comment and left \"die Frage nach der Gesamtsumme der heutigen Leistungsentgelte unbeantwortet\" — confirming the total Leistungsentgelte figure is deliberately undisclosed.<\u002Fp><h3 id=\"s-the-digitalisierungsumlage-and-its-tripling\" class=\"hd hd3\"><span class=\"ht\">The Digitalisierungsumlage and its tripling<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (DER PLATOW Brief, June 2024): the Digitalisierungsumlage for the Primärinstitute rises \"<strong>von zuletzt 30 Mio. Euro über 60 Mio. im laufenden Jahr auf 90 Mio. Euro in 2025<\u002Fstrong>\" — a tripling. Being small relative to total revenue, \"Ihre Anhebung führt unter dem Strich nur zu einem prozentual einstelligen Preisanstieg.\" Bank reaction: \"Viele Primärbanker stellen immer lauter die Frage, ob das Geld wirklich gut eingesetzt ist … mit dem digitalen Produktangebot … sind längst nicht alle Volksbank-Vorstände zufrieden.\" And: the price structure \"ist ein Thema, über das in den BVR-Führungsgremien nachgedacht wird, auch wenn es noch keine offene Diskussion dazu gibt.\"<\u002Fp><h3 id=\"s-the-general-price-increases\" class=\"hd hd3\"><span class=\"ht\">The general price increases<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. A <strong>~5% average inflation-driven increase from 1 April 2023<\u002Fstrong> (announced Dec 2022). Börsen-Zeitung: further 2024 increases to give Atruvia \"im Schnitt weitere 5% der heutigen Leistungsentgelte der gesamten genossenschaftlichen Organisation\" as additional investment.<\u002Fp><h3 id=\"s-the-125m-migration-synergies-partly-taken-back\" class=\"hd hd3\"><span class=\"ht\">The ~€125m migration synergies \"partly taken back\"<\u002Fspan><\u002Fh3><p><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> from the record: the agree21 consolidation was sold to banks partly on cost savings; the subsequent tripling of the Digitalisierungsumlage plus perpetuation of the IT-Sonderumlage means the savings are \"partly taken back.\" Mechanism: one-time consolidation synergies were converted into ongoing higher levies to fund the never-ending digital-investment race. (Scenario calculations circulating in the group — Börsen-Zeitung — suggested the sector \"im Extremfall\" might need €450m–€1bn annually to match European digital front-runners; this is an explicitly hypothetical scenario, <strong>not<\u002Fstrong> a committed figure — <span class=\"ev\">HYPOTHESIS<\u002Fspan>.)<\u002Fp><h3 id=\"s-the-shift-to-nutzenbasierte-usage-based-pricing-announced-2025\" class=\"hd hd3\"><span class=\"ht\">The shift to nutzenbasierte (usage-based) pricing — announced 2025<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Vorstandssprecher/CFO Martin Beyer (HV 2025; Atruvia Magazin, 06.05.2025): \"Wir reduzieren sukzessive den Anteil der Umlagefinanzierung am Gesamtumsatz durch eine nutzenbasierte Bepreisung. Das heißt für unsere Kunden: Sie bezahlen je nach Mehrwert und Nutzen für unsere Lösungen.\" Mechanism: \"Erlöse werden stärker als heute mit den vorgenannten Indikatoren verknüpft\" — revenue tied to digital-usage indicators (Digitalisierungsquote/Nutzungsquote), with \"eine spezielle Förderung im Preismodell\" rewarding banks that raise digital usage. Phasing is gradual (\"sukzessive\"); exact indicators and tariffs are <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><h3 id=\"s-the-financial-strategy-pivot-and-dividend-question\" class=\"hd hd3\"><span class=\"ht\">The financial-strategy pivot and dividend question<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Beyer: \"Wir streben eine <strong>Zielrendite von 4 Prozent in Bezug auf den Umsatz<\u002Fstrong> an und steigern nachhaltig das Betriebsergebnis, um ein dauerhaftes Plus für neue Investitionen zu generieren.\" The stated policy is to <strong>self-fund investment from retained earnings rather than distribute<\u002Fstrong> — investments \"künftig aus eigener Kraft.\" Trajectory: Betriebsergebnis €40.6m (2023) → €66.6m (2024) → €89.0m (2025, Betriebsergebnismarge <strong>4.7%<\u002Fstrong>, exceeding the 4% target). No explicit dividend-per-share policy to owners was found (<span class=\"ev\">UNKNOWN<\u002Fspan>). <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> returns to owners come primarily as <em>lower-than-market IT costs and reinvestment<\u002Fem>, not as dividends — the cooperative \"dividend\" is the subsidised platform itself.<\u002Fp><h3 id=\"s-actual-price-levels-priority-gap-1-the-honest-answer\" class=\"hd hd3\"><span class=\"ht\">Actual price levels (Priority Gap 1) — the honest answer<\u002Fspan><\u002Fh3><p><strong><span class=\"ev\">UNKNOWN<\u002Fspan> / not public.<\u002Fstrong> After targeted search of the Bundesanzeiger, member-bank Geschäftsberichte, BVR and trade press:<\u002Fp><ul class=\"lst\"><li><strong>Per-unit prices<\u002Fstrong> (per account, workstation, transaction) are <strong>not disclosed<\u002Fstrong>; the Leistungsverzeichnis is confidential; Atruvia refused even the aggregate Leistungsentgelte figure to Börsen-Zeitung.<\u002Fli><li><strong>Member-bank annual reports do not break out an \"Atruvia line.\"<\u002Fstrong> Atruvia costs sit inside \"andere Verwaltungsaufwendungen,\" with \"Datenverarbeitung und Digitalisierung\" named only as a qualitative driver (e.g. Frankfurter Volksbank Rhein/Main GB2023: the rise in andere Verwaltungsaufwendungen was driven \"unter anderem [durch] gestiegene Aufwendungen in den Bereichen Datenverarbeitung und Digitalisierung\"; Berliner Volksbank GB2025: \"höhere Kosten für unsere IT-Anwendungen\").<\u002Fli><li><strong>The only quantified figures are the group-level levies:<\u002Fstrong> IT-Sonderumlage €60m/yr from the banks (+€180m DZ Bank +€200m Atruvia self-funded); €300m cumulative 2018–2023; Digitalisierungsumlage €30m→€60m→€90m (2023–2025); ~5% annual Leistungsentgelte rises; and the GB2021 split (Bankverfahren €863.1m / Infrastruktur €227.9m).<\u002Fli><li><strong>A derived proxy<\u002Fstrong> (revenue ÷ accounts) yields roughly €20 per account per year — but this is analyst arithmetic, <strong>not an Atruvia price<\u002Fstrong>, offered only as an order-of-magnitude <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>.<\u002Fli><\u002Ful><h3 id=\"s-governance-of-pricing-and-the-under-pricing-captive-rent-question\" class=\"hd hd3\"><span class=\"ht\">Governance of pricing and the under-pricing/captive-rent question<\u002Fspan><\u002Fh3><p><strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> (evidence-backed conclusion).<\u002Fstrong> Pricing is <em>proposed by Atruvia's Vorstand<\u002Fem>, <em>approved by the owner-dominated Aufsichtsrat<\u002Fem>, and <em>contested informally in BVR-Führungsgremien<\u002Fem>. There is <strong>no competitive discipline<\u002Fstrong> — the cooperative banks cannot realistically switch (<a class=\"xr\" href=\"#s-ii-10\">II.10<\u002Fa>). Two opposing forces result:<\u002Fp><ul class=\"lst\"><li><strong>Toward under-pricing/thin margins:<\u002Fstrong> because every euro is an owner's cost, owners historically squeezed Atruvia to an €8m surplus on €1.4bn (2022) — evidence of <em>captive under-pricing of Atruvia<\u002Fem>, not rent-extraction <em>by<\u002Fem> Atruvia.<\u002Fli><li><strong>Toward captive rents:<\u002Fstrong> the absence of exit and of price transparency, plus the ability to perpetuate \"temporary\" levies and triple the Digitalisierungsumlage with only muted dissent, gives Atruvia real pricing power going forward.<\u002Fli><\u002Ful><p><strong>Conclusion:<\u002Fstrong> historically the owner-customer structure produced <strong>under-pricing<\u002Fstrong> (thin margins, chronic under-investment vs neobanks). The 2025 pivot to a 4% Zielrendite and usage-based pricing is an explicit, governed decision to <strong>move from under-pricing toward sustainable pricing<\u002Fstrong> — converting some latent captive pricing power into reinvestment capacity. Whether this tips into captive rents depends on whether the Aufsichtsrat and BVR hold margins near ~4%. As of 2025, 4.7% suggests the target is being met/slightly exceeded.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-9\" class=\"hd hd2\"><span class=\"hn mono\">II.9<\u002Fspan><span class=\"ht\">Product Dependency Map<\u002Fspan><\u002Fh2><p><strong>agree21 is the platform everything attaches to.<\u002Fstrong> Tested rather than assumed:<\u002Fp><ul class=\"lst\"><li><strong>Core → workstation → channels → analytics.<\u002Fstrong> agree21 (core) → BankingWorkspace/BAP (employee) and OnlineBanking/App (customer) → VR-Control/agree21Finanzen (steering) → TRUUCO/SmartData/genoGPT (analytics/AI). Each layer consumes core services via the proprietary API layer (~1,200 microservices, IBM). <strong>Verdict: genuine, tight technical dependency.<\u002Fstrong><\u002Fli><li><strong>Single-platform migration enables sector-wide rollout.<\u002Fstrong> One multi-tenant platform → a release reaches all at once (<a class=\"xr\" href=\"#s-ii-5\">II.5<\u002Fa>.C). <strong>Verdict: confirmed — the central economic engine.<\u002Fstrong><\u002Fli><li><strong>Subsidiaries cross-sell into the same base.<\u002Fstrong> Peras (HR), Serviscope (BPO), parcIT (steering), FORUM (InfoSec), TRUUCO (analytics), BMS/fincompare (SME finance) all sell into the captive ~700-bank base. <strong>Verdict: real but uneven<\u002Fstrong> — parcIT/steering is near-mandatory; Peras/Serviscope are optional. The \"Wertschöpfung vertiefen\" strategy (Finanz-Szene) is precisely about raising attach rates.<\u002Fli><li><strong>Does the VR Payment acquisition create a genuine account+debit+credit bundle advantage?<\u002Fstrong> <strong>Verdict: YES (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, high confidence).<\u002Fstrong> From 1 Jan 2027, unifying account (agree21) + debit + credit + girocard issuer processing on one Atruvia platform (a) deepens lock-in (\"Verzahnung zentraler Leistungen\"), (b) removes VR Payment's parallel structure, and (c) makes Atruvia the single card-processing point for a large share of German credit-card transactions (Marzlin, McDermott). The most important <em>new<\u002Fem> dependency Atruvia is building.<\u002Fli><\u002Ful><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-10\" class=\"hd hd2\"><span class=\"hn mono\">II.10<\u002Fspan><span class=\"ht\">Onboarding, Migration and Change<\u002Fspan><\u002Fh2><h3 id=\"s-when-two-member-banks-merge\" class=\"hd hd3\"><span class=\"ht\">When two member banks merge<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (frequency) + <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> (process). 40–45 mergers/year require technical migration. The standard process consolidates the two banks' agree21 tenants into one — migrating accounts, products, roles and history to the surviving institution's configuration over a weekend cutover. Because both already run agree21, this is a <em>tenant merge<\u002Fem>, far simpler than an inbound external migration.<\u002Fp><h3 id=\"s-how-a-new-non-cooperative-customer-is-onboarded-inbound-migrations-verif\" class=\"hd hd3\"><span class=\"ht\">How a new non-cooperative customer is onboarded (inbound migrations — verified)<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>:<\u002Fp><ul class=\"lst\"><li><strong>Bank für Sozialwirtschaft:<\u002Fstrong> contract 8 June 2021, go-live 23 April 2023 (~2-year programme, 200+ bank staff, ten sub-projects), migrating off a self-built SAP-based system in place since 2006, having evaluated SAP HANA as the alternative.<\u002Fli><li><strong>UmweltBank:<\u002Fstrong> ~18 months' preparation, go-live October 2023; drivers were growth, changed customer expectations and regulation; chose Atruvia for a \"standardisierte und am Markt erprobte\" integrated solution.<\u002Fli><li><strong>National-Bank Essen:<\u002Fstrong> replaced a system in use since 1996, ~30 applications consolidated, ~two-year project, completed October 2024.<\u002Fli><li><strong>M.M. Warburg:<\u002Fstrong> announced; migrating off Sopra Steria's Corbas MBS; the bank's own statement: \"das jetzige Kernbanksystem [wird] perspektivisch nicht mehr weiterentwickelt … ein Anbieterwechsel ist also zwangsläufig notwendig.\"<\u002Fli><li><strong>Sparda-Banken:<\u002Fstrong> all 11 now on/moving to Atruvia. Four (Hamburg, Berlin, Hannover, Südwest) already used it; the other seven abandoned a joint Sopra Steria build and switched — Augsburg/Ostbayern first (spring 2024), Sparda-Bank West completing 2025; group fully on Atruvia by 2026. Notably, Verbandschef <strong>Florian Rentsch<\u002Fstrong> conceded that at the four already-migrated Sparda-Banken there had been customer losses \"im signifikanten Bereich\" during the switch — a rare, named, candid negative data point on migration disruption.<\u002Fli><li><strong>Bankhaus C.L. Seeliger:<\u002Fstrong> a further external win (Finanz-Szene).<\u002Fli><\u002Ful><h3 id=\"s-the-exit-question-priority-gap-5-critical\" class=\"hd hd3\"><span class=\"ht\">The exit question (Priority Gap 5) — critical<\u002Fspan><\u002Fh3><p><strong>Has any bank ever left?<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> — <strong>YES, one prominent case: the Deutsche Apotheker- und Ärztebank (Apobank)<\u002Fstrong> migrated <em>away<\u002Fem> from Fiducia/GAD to Avaloq over the 2020 Pentecost weekend. It was a <strong>debacle<\u002Fstrong>: transfers and basic services failed, customers were furious, and Apobank-CEO Ulrich Sommer publicly blamed Fiducia GAD for having told the bank only in early 2018 that Avaloq \"nicht auf den Hardwaresystemen der Fiducia laufen könne\" and that a Mischbetrieb was \"nicht erwünscht.\" This is the exception that proves the rule: the one clear exit was painful and disruptive. Separately, <strong>BMW Bank<\u002Fstrong> and others chose <em>not<\u002Fem> to join Atruvia (going to FIS Kordoba) — but that is <em>non-adoption<\u002Fem>, not exit.<\u002Fp><p><strong>Is exit practically possible for a cooperative bank?<\u002Fstrong> <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> (high confidence): effectively no.<\u002Fstrong> A Volksbank cannot leave because (1) it is an <em>owner<\u002Fem> of Atruvia; (2) the entire cooperative ecosystem (DZ Bank clearing, Union Investment depots, R+V, VR Payment cards, BVR reporting, Wero) is integrated through agree21; (3) there is no alternative provider offering the cooperative-specific integrated solution; (4) the Apobank precedent shows migration away is high-risk. The switching options that exist (FIS, Avaloq, Sopra Steria) serve <em>private<\u002Fem> banks, and the market trend is <em>toward<\u002Fem> Atruvia (Sparda, UmweltBank, National-Bank, Warburg), not away.<\u002Fp><p><strong>Contractual notice/exit-support:<\u002Fstrong> standard notice periods and exit-support terms are <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong> (contracts confidential), but <strong>DORA Article 30 now mandates exit strategies and exit-support clauses<\u002Fstrong> in ICT outsourcing contracts — so formal exit provisions must exist on paper even though practical exit is near-impossible for cooperative members.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-11\" class=\"hd hd2\"><span class=\"hn mono\">II.11<\u002Fspan><span class=\"ht\">Non-Cooperative Customers and Third-Party Sales<\u002Fspan><\u002Fh2><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Products sold outside the cooperative sector:<\u002Fp><ul class=\"lst\"><li><strong>Core banking (agree21)<\u002Fstrong> to ~190 private banks and specials, plus new external wins (Bank für Sozialwirtschaft, UmweltBank, National-Bank Essen, M.M. Warburg, Bankhaus C.L. Seeliger, the Sparda group).<\u002Fli><li><strong>IT-outsourcing<\u002Fstrong> (mainframe/virtualisation scale) to banks and <em>other industries<\u002Fem> including the <strong>ADAC<\u002Fstrong>.<\u002Fli><li><strong>parcIT okular-Tools<\u002Fstrong> to non-GFG banks (via Basis-Abo).<\u002Fli><li><strong>Ratiodata<\u002Fstrong> managed services / <strong>GWS<\u002Fstrong> ERP to non-bank customers.<\u002Fli><\u002Ful><p><strong>How much revenue comes from outside the captive base?<\u002Fstrong> <strong><span class=\"ev\">UNKNOWN<\u002Fspan> precisely<\u002Fstrong> — no product- or customer-type split is published. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: still a <strong>minority<\u002Fstrong> but <strong>the fastest-growing<\u002Fstrong> part. Evidence: Atruvia's 2025 AG revenue growth to knapp €1.9bn (+11.5%) was attributed \"hauptsächlich durch neue Kunden\" (Atruvia, via IT-Finanzmagazin, HV 2026) — i.e. external wins, since the cooperative base is shrinking in count. GB2021 already noted intensified dialogue with private banks and IT-outsourcing scale effects.<\u002Fp><p><strong>Genuine growth strategy or marginal by-product?<\u002Fstrong> <strong>Conclusion: a genuine, deliberate growth strategy.<\u002Fstrong> With the cooperative base saturated and consolidating, external migrations + value-deepening are Atruvia's only two organic growth vectors. The active pursuit of Sparda, Warburg, Seeliger and the Bank für Sozialwirtschaft shows a new-logo motion, not opportunism. But the captive base remains the overwhelming majority of revenue.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-12\" class=\"hd hd2\"><span class=\"hn mono\">II.12<\u002Fspan><span class=\"ht\">Failure and Exception Paths<\u002Fspan><\u002Fh2><h3 id=\"s-full-outage-incident-history-priority-gap-10\" class=\"hd hd3\"><span class=\"ht\">Full outage/incident history (Priority Gap 10)<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> — the reconstructed record:<\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Date<\u002Fsc-raw-th><sc-raw-th>Event<\u002Fsc-raw-th><sc-raw-th>Scope<\u002Fsc-raw-th><sc-raw-th>What it revealed<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>May–Aug 2018<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>BaFin §44 special inspection (via Volksbank Jever)<\u002Fsc-raw-td><sc-raw-td>Fiducia &amp; GAD<\u002Fsc-raw-td><sc-raw-td>\"Geharnischter Report,\" ~15 Kritikpunkte: weak Bankensteuerungssystem development, inadequate Berechtigungsmanagement, poor IT-outage precautions.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>10 Jun 2020<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>FinTS/CAMT52 special-character bug<\u002Fsc-raw-td><sc-raw-td>FinTS umsatz retrieval<\u002Fsc-raw-td><sc-raw-td>Interface fragility; minor.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>9 Nov 2020<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>System-changeover error<\u002Fsc-raw-td><sc-raw-td>~150 of 840 banks (NRW/north); online banking + SB-terminals<\u002Fsc-raw-td><sc-raw-td>First big post-merger incident; Krisenstab convened; change-related fragility one year into unified operations.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>3 Jun 2021<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>DDoS attack<\u002Fsc-raw-td><sc-raw-td>Broad (Hessen/RLP/BW); online + app<\u002Fsc-raw-td><sc-raw-td>External attack; SB-terminals partly usable.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>DDoS (Feiertag)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>DDoS on Karlsruhe then Münster data centres<\u002Fsc-raw-td><sc-raw-td>Online banking + banking websites sporadic/unreachable<\u002Fsc-raw-td><sc-raw-td>Both core sites can be targeted; cash supply via SB-terminals maintained.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>29 Nov 2023<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Central-system outage<\u002Fsc-raw-td><sc-raw-td><strong>Up to 520 of ~700<\u002Fstrong> cooperative banks (southern Germany); transfers, account overview, Umsatz display<\u002Fsc-raw-td><sc-raw-td>Largest disclosed blast radius; \"Sicherheit der Daten … weiterhin gewährleistet.\"<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>7 Jul 2026<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Software error in central systems<\u002Fsc-raw-td><sc-raw-td><strong>~490 banks<\u002Fstrong> (southern Germany) from ~08:00; app/online switched off to relieve systems; bank websites down 09:47–10:38; resolved 13:20<\u002Fsc-raw-td><sc-raw-td>App/online <em>deliberately<\u002Fem> switched off; users warned not to resubmit (duplicate risk); FinTS/HBCI also hit.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Also relevant (Atruvia-adjacent):<\u002Fstrong> the <strong>Apobank 2020 Avaloq migration debacle<\u002Fstrong>, for which Apobank publicly assigned Fiducia GAD partial blame (<a class=\"xr\" href=\"#s-ii-10\">II.10<\u002Fa>).<\u002Fp><h3 id=\"s-who-owns-the-problem-and-the-liability-chain\" class=\"hd hd3\"><span class=\"ht\">Who owns the problem, and the liability chain<\u002Fspan><\u002Fh3><p><strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> + <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (mechanism):<\u002Fstrong><\u002Fp><ul class=\"lst\"><li><strong>Operationally<\u002Fstrong>, Atruvia owns the fix (Krisenstab, status comms to banks).<\u002Fli><li><strong>Regulatorily and toward the end customer<\u002Fstrong>, the <strong>member bank owns the problem<\u002Fstrong> — §25b KWG keeps responsibility with the bank; the end customer's claim is against the bank, not Atruvia. This is why Atruvia stays invisible even during a 520-bank outage.<\u002Fli><li><strong>Contractual liability / service credits between Atruvia and banks:<\u002Fstrong> SLAs, availability commitments, service-credit and liability-cap terms are <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong> (Priority Gap 2 — contracts confidential). Structurally, MaRisk AT 9 and <strong>DORA Article 30<\u002Fstrong> require the outsourcing contracts to contain service levels, audit rights, incident-reporting and exit clauses — so SLAs must exist, but their figures are not public.<\u002Fli><li><strong>Reputational consequence:<\u002Fstrong> falls on the <em>banks<\u002Fem> (their brand fronts the app/website) — a governance lever, since the owner-banks bear the reputational cost of Atruvia's failures, sharpening their interest in resilience.<\u002Fli><\u002Ful><h3 id=\"s-the-systemic-risk-observation\" class=\"hd hd3\"><span class=\"ht\">The systemic-risk observation<\u002Fspan><\u002Fh3><p><strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> (important).<\u002Fstrong> The single multi-tenant platform that delivers Atruvia's economics also concentrates risk: one software error took out ~490–520 banks simultaneously (2023, 2026). Atruvia was <strong>not<\u002Fstrong> designated a DORA Critical ICT Third-Party Provider (18 Nov 2025) even though a single incident can disable ~500 German banks — a defensible reading is that the ESAs supervise the <em>cloud/hardware<\u002Fem> layer (IBM designated) while Atruvia is captured indirectly via its banks. A genuine regulatory-perimeter question the report flags rather than resolves.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-13\" class=\"hd hd2\"><span class=\"hn mono\">II.13<\u002Fspan><span class=\"ht\">Product-Market Evolution<\u002Fspan><\u002Fh2><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (trajectory):<\u002Fp><ul class=\"lst\"><li><strong>Booking cooperative → early cores.<\u002Fstrong> Fiducia (founded 1924) and GAD built successive cores across the 1960s–2000s; predecessor systems in the lineage include the batch/booking era, then GEBOS/GENOS/RUBIN/bank21 (north) and NBS/BB3/agree (south).<\u002Fli><li><strong>Two platforms (2015 merger):<\u002Fstrong> \"agree\" (south) and \"bank21\" (north) coexisted post-merger.<\u002Fli><li><strong>agree21 consolidation (to 2019–2020):<\u002Fstrong> all banks onto one core primarily based on agree; <strong>bank21 retired<\u002Fstrong>.<\u002Fli><li><strong>Digital channels (2021–):<\u002Fstrong> new OnlineBanking, rebuilt VR Banking App, VR SecureGo plus, Omnikanalplattform, BankingWorkspace.<\u002Fli><li><strong>2021 repositioning:<\u002Fstrong> from \"IT operator\" to \"<strong>Digitalisierungspartner<\u002Fstrong>\"; rename Fiducia &amp; GAD → <strong>Atruvia<\u002Fstrong> (1 Sep 2021).<\u002Fli><li><strong>Expansion into adjacencies:<\u002Fstrong> HR (Peras/geno.HR), BPO (Serviscope), analytics (TRUUCO/SmartData), AI (plainGPT/genoGPT, KI-Kompetenzcenter), and <strong>card processing<\u002Fstrong> (VR Payment issuing from 2027).<\u002Fli><\u002Ful><p><strong>Coherent or accretive drift?<\u002Fstrong> <strong>Conclusion: largely coherent, with two caveats.<\u002Fstrong> The core→channels→steering→analytics→AI stack is a coherent vertical deepening of the same customer. The card-processing move is coherent <em>bundling<\u002Fem>. The genuinely adjacent bets — GWS ERP (non-bank), ADAC-type IT-outsourcing, and parts of the subsidiary ring — are closer to <strong>opportunistic diversification<\u002Fstrong> justified mainly by mainframe scale economics. Net: coherent platform strategy at the centre, mild accretive drift at the edges.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-14\" class=\"hd hd2\"><span class=\"hn mono\">II.14<\u002Fspan><span class=\"ht\">Volume II Reconstruction<\u002Fspan><\u002Fh2><p><strong>(1) Full Product/Service Architecture map.<\u002Fstrong> Core (agree21 on IBM Z/IMS/Db2) → Platform (Omnikanalplattform, EGP/agree21Finanzen) → Employee channel (BankingWorkspace/BAP) + Customer channels (OnlineBanking, VR Banking App, VR SecureGo plus, ATMs, FinTS/PSD2) → Payments/cards (SEPA/SCT Inst via DZ Bank; girocard/debit/credit issuer processing → unified at Atruvia from 2027) → Steering/analytics/AI (VR-Control/okular via parcIT; TRUUCO SmartData; genoGPT) → Subsidiary ring (Ratiodata, Peras, Serviscope, BMS/fincompare, FORUM, GWS, ECON, Accesa/RaRo, Lucke).<\u002Fp><p><strong>(2) Two-Tier Customer Map.<\u002Fstrong> Tier 1: ~670–730 cooperative banks (owner+buyer+governor) + ~190 private banks/specials + non-bank (ADAC). Tier 2: tens of millions of end customers (contract with bank; Atruvia invisible; bank = GDPR controller, Atruvia = processor).<\u002Fp><p><strong>(3) Customer-Segment Map.<\u002Fstrong> By type (VR / Sparda / PSD / church / Apobank[exited] / private / non-bank); by legacy (north/south — eliminated at core); by size (few large, many small); by adoption depth (core-only → +steering/M365 → +BPO/analytics/AI).<\u002Fp><p><strong>(4) Jobs-to-Be-Done Matrix.<\u002Fstrong> Banks: remain independent (primary) &gt; regulatory compliance &gt; digital competitiveness &gt; cost-income &gt; scale economics. End customers: reliable daily banking + payments; parity-plus features (84.5 vs 92.6 Sparkassen).<\u002Fp><p><strong>(5) Service-Delivery Flow Diagram (six flows).<\u002Fstrong> A Transaction (bank principal, Atruvia processor, DZ Bank clearer); B Data (bank controller, Atruvia processor, AVV); C Software-release (pilot→Serienpilot→Serienmigration, AT 8.2 acceptance); D Money (Umlage/Leistungsentgelte, specifics confidential); E Support/incident (Serviceline fronted by bank; Krisenstab); F Regulatory-responsibility (§25b KWG stays with bank; DORA Art. 30 clauses).<\u002Fp><p><strong>(6) Transaction Processing Maps.<\u002Fstrong> Eight events traced in <a class=\"xr\" href=\"#s-ii-6\">II.6<\u002Fa>, each with system/entity/data/control/failure.<\u002Fp><p><strong>(7) Channel Architecture.<\u002Fstrong> Seven channels; low individual white-labelling; shared multi-tenant app.<\u002Fp><p><strong>(8) Pricing and Cost-Allocation Model.<\u002Fstrong> Basispaket + Festpreis + infrastructure + IT-Sonderumlage (€60m/yr banks) + Digitalisierungsumlage (€30m→€60m→€90m) → transitioning to nutzenbasierte pricing; 4% Zielrendite (4.7% achieved 2025); self-funding over dividends; per-unit prices <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fp><p><strong>(9) Product Dependency Map.<\u002Fstrong> agree21 as the hub; tight core→layer dependencies; subsidiary attach-rate strategy; VR Payment creating a new account+debit+credit bundle lock-in from 2027.<\u002Fp><p><strong>(10) Migration/Change Process.<\u002Fstrong> Tenant-merge (bank mergers, 40–45/yr) vs external migration (~18–24 months, e.g. Bank für Sozialwirtschaft, UmweltBank, National-Bank, Sparda). Exit near-impossible; Apobank the sole painful precedent.<\u002Fp><p><strong>(11) Third-Party Revenue Assessment.<\u002Fstrong> Minority but fastest-growing; 2025 growth \"hauptsächlich durch neue Kunden\"; deliberate strategy; split <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fp><p><strong>(12) Failure/Exception Map.<\u002Fstrong> 2018 BaFin report; 2020 changeover + DDoS; 2021 DDoS; 2023 (≤520 banks); 2026 (~490 banks). Bank owns regulatory/customer problem; SLAs exist but confidential; systemic single-point-of-failure concentration.<\u002Fp><p><strong>(13) Product-Market Evolution timeline.<\u002Fstrong> Booking cooperative → GEBOS/GENOS/RUBIN/bank21 &amp; NBS/BB3/agree → agree21 (2019–20) → digital channels (2021) → Digitalisierungspartner + Atruvia rename (2021) → HR/BPO/analytics/AI → card processing (2027).<\u002Fp><p><strong>(14) Key Unknowns.<\u002Fstrong> Per-unit prices; total Leistungsentgelte per bank; SLA/service-credit/liability-cap figures; contractual exit terms; captive-vs-external revenue split; per-product revenue; exact SCT Inst reach; internal pre-2027 card-platform architecture; Verimi product economics; dividend policy specifics; whether \"six data centres\" (Grokipedia) is real vs the confirmed \"four\"; reconciliation of group-revenue figures (see caveat below).<\u002Fp><p><strong>(15) Ten Most Important Conclusions.<\u002Fstrong><\u002Fp><ol class=\"lst\"><li><strong>agree21 is the true core product and the master lock-in<\u002Fstrong> — everything attaches to it and no cooperative bank can leave it.<\u002Fli><li><strong>The real customer is the cooperative sector as an institution<\u002Fstrong>, expressed through ~700 owner-buyer-governor banks; the end customer is a beneficiary, not the customer.<\u002Fli><li><strong>What a member bank actually buys is the ability to remain an independent regulated bank<\u002Fstrong> — software + compliance + scale + risk transfer bundled.<\u002Fli><li><strong>Pricing has historically been under-market (thin margins), not rent-extractive<\u002Fstrong> — the 2025 pivot to a 4% Zielrendite + usage-based pricing deliberately corrects under-investment.<\u002Fli><li><strong>Exit is effectively impossible; the one clear exit (Apobank) was a debacle<\u002Fstrong> — lock-in is near-absolute for members.<\u002Fli><li><strong>A single multi-tenant platform is both the economic engine and the systemic risk<\u002Fstrong> — one error hits ~500 banks (2023, 2026).<\u002Fli><li><strong>The VR Payment card consolidation (2027) is the most important new lock-in<\u002Fstrong> — account+debit+credit on one Atruvia platform.<\u002Fli><li><strong>Governance is majoritarian/consensus via BVR committees, the BSP (36/39 initiatives), Kompetenzteams and the SPP<\u002Fstrong> — individual small banks have negligible direct roadmap power.<\u002Fli><li><strong>The digital offering is competitive but trails the Sparkassen<\u002Fstrong> (VR Banking App 84.5 vs 92.6) — the owner-consensus model is fast to roll out but slow to lead.<\u002Fli><li><strong>External sales are the deliberate growth vector<\u002Fstrong> as the captive base consolidates (40–45 mergers/yr; count 820→~670).<\u002Fli><\u002Fol><h3 id=\"s-the-five-closing-questions-answered\" class=\"hd hd3\"><span class=\"ht\">The five closing questions answered<\u002Fspan><\u002Fh3><ul class=\"lst\"><li><strong>True core product?<\u002Fstrong> <strong>agree21<\u002Fstrong> — the mainframe core banking process; every other product is an attachment.<\u002Fli><li><strong>Strongest lock-in mechanism?<\u002Fstrong> Today: <strong>agree21 + cooperative-ecosystem integration<\u002Fstrong> (ownership + DZ Bank clearing + Union/R+V + BVR reporting). Strengthening fastest: the <strong>unified card platform from 1 Jan 2027<\u002Fstrong>.<\u002Fli><li><strong>Best economics?<\u002Fstrong> <strong>The multi-tenant platform releases<\u002Fstrong> (one code line → ~700 banks) and the <strong>near-mandatory steering software (parcIT/VR-Control)<\u002Fstrong> — high attach, low marginal cost. IBM-scale mainframe outsourcing to third parties (incl. ADAC) also earns scale rents.<\u002Fli><li><strong>Strategically important despite being small today?<\u002Fstrong> <strong>genoGPT/the AI portfolio<\u002Fstrong> and <strong>Wero<\u002Fstrong> — small revenue now, decisive for future competitiveness and defence against Big Tech/neobanks.<\u002Fli><li><strong>Who is the real customer?<\u002Fstrong> <strong>The cooperative sector as an institution<\u002Fstrong> — operationalised as the ~700 member banks that own, pay for and govern Atruvia. The bank's end customer is the user Atruvia designs <em>for<\u002Fem> but never contracts <em>with<\u002Fem>.<\u002Fli><li><strong>What precisely does a member bank buy?<\u002Fstrong> Not merely software. It buys <strong>regulatory compliance it need not build, scale economics it could not achieve alone, risk transfer of IT execution (though not of regulatory responsibility), and — decisively — the ability to remain an independent bank at all.<\u002Fstrong> The software is the delivery vehicle; the licence-to-remain-a-bank is the product.<\u002Fli><\u002Ful><div class=\"sep\"><\u002Fdiv><h3 id=\"s-data-caveat-on-group-vs-ag-revenue-flagged-not-silently-resolved\" class=\"hd hd3\"><span class=\"ht\">Data caveat on group-vs-AG revenue (flagged, not silently resolved)<\u002Fspan><\u002Fh3><p>Sources give different revenue bases. <strong>Atruvia AG (parent):<\u002Fstrong> ~€1.4bn (2022), ~€1.5bn (GB2021: €1,496.1m), knapp €1.9bn (2025, +11.5%). <strong>Group/Konzern:<\u002Fstrong> ~€1.77bn (older IBM/press), ~€2.2bn (2024, <a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa>), and <strong>€2.5bn per GB2025<\u002Fstrong> (with 97m accounts, ~10bn transactions). Finanz-Szene separately reported a group figure \"erstmals mehr als 2 Mrd. Euro … 2,001 Mrd. Euro\" with a €50m operating result — likely an interim/rounded or different-perimeter figure. The most authoritative current group number is the <strong>GB2025 figure of €2.5bn<\u002Fstrong>; the €2.0bn and €2.2bn figures are earlier-period or narrower-perimeter and should not be treated as current. This discrepancy is preserved rather than averaged.<\u002Fp><p><em>End of <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-service-delivery-architecture\">Volume II<\u002Fa>. <a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-organisational-infrastructure\">Volume III<\u002Fa> not begun, per instruction.<\u002Fem><\u002Fp><div class=\"sep\"><\u002Fdiv><\u002Fsection><section class=\"sec\" data-part=\"3\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part III<\u002Fspan><a href=\"#contents\">Volume III &nbsp;·&nbsp; Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">III<\u002Fspan><\u002Fdiv><h1 id=\"part-iii-part-iii-operations-technology-data-organisational-infrastructure\" class=\"part\" data-short=\"Part III — Operations, Technology, Data &amp; Organisational Infrastructure\">Operations, Technology, Data &amp; Organisational Infrastructure<\u002Fh1><p class=\"opener-s\">How ~10bn bookings a year are processed on a mainframe core for ~700 banks.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">III<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">26<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Estate<\u002Fdiv><div class=\"plate-v\">Four data centres<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-volume-iii-operations-technology-data-organizational-infrastructure\"><span class=\"inpart-n\"><\u002Fspan><span>VOLUME III: Operations, Technology, Data &amp; Organizational Infrastructure<\u002Fspan><\u002Fa><a href=\"#s-tl-dr-2\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR<\u002Fspan><\u002Fa><a href=\"#s-key-findings-2\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details-2\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-iii-1\"><span class=\"inpart-n\">III.1<\u002Fspan><span>Operating Model<\u002Fspan><\u002Fa><a href=\"#s-iii-2\"><span class=\"inpart-n\">III.2<\u002Fspan><span>Banking Operations — the processing lifecycle<\u002Fspan><\u002Fa><a href=\"#s-iii-3\"><span class=\"inpart-n\">III.3<\u002Fspan><span>Mainframe Capacity, Compute &amp; Data-Centre Operations (PRIORITY DEPTH)<\u002Fspan><\u002Fa><a href=\"#s-iii-4\"><span class=\"inpart-n\">III.4<\u002Fspan><span>Technology Architecture (PRIORITY DEPTH)<\u002Fspan><\u002Fa><a href=\"#s-iii-5\"><span class=\"inpart-n\">III.5<\u002Fspan><span>Build vs Buy vs Nearshore<\u002Fspan><\u002Fa><a href=\"#s-iii-6\"><span class=\"inpart-n\">III.6<\u002Fspan><span>Payment Infrastructure Software<\u002Fspan><\u002Fa><a href=\"#s-iii-7\"><span class=\"inpart-n\">III.7<\u002Fspan><span>Ledger and Core Banking Data Architecture<\u002Fspan><\u002Fa><a href=\"#s-iii-8\"><span class=\"inpart-n\">III.8<\u002Fspan><span>Reconciliation Architecture<\u002Fspan><\u002Fa><a href=\"#s-iii-9\"><span class=\"inpart-n\">III.9<\u002Fspan><span>Data Architecture and Governance<\u002Fspan><\u002Fa><a href=\"#s-iii-10\"><span class=\"inpart-n\">III.10<\u002Fspan><span>Fraud and Financial-Crime Technology<\u002Fspan><\u002Fa><a href=\"#s-iii-11\"><span class=\"inpart-n\">III.11<\u002Fspan><span>Security Architecture<\u002Fspan><\u002Fa><a href=\"#s-iii-12\"><span class=\"inpart-n\">III.12<\u002Fspan><span>Reliability Engineering (PRIORITY DEPTH) — Incident Post-Mortems<\u002Fspan><\u002Fa><a href=\"#s-iii-13\"><span class=\"inpart-n\">III.13<\u002Fspan><span>Infrastructure Resilience and Concentration Risk<\u002Fspan><\u002Fa><a href=\"#s-iii-14\"><span class=\"inpart-n\">III.14<\u002Fspan><span>Employee Architecture<\u002Fspan><\u002Fa><a href=\"#s-iii-15\"><span class=\"inpart-n\">III.15<\u002Fspan><span>Organizational Design<\u002Fspan><\u002Fa><a href=\"#s-iii-16\"><span class=\"inpart-n\">III.16<\u002Fspan><span>Product Development and Release System<\u002Fspan><\u002Fa><a href=\"#s-iii-17\"><span class=\"inpart-n\">III.17<\u002Fspan><span>Support and Service Operating Model<\u002Fspan><\u002Fa><a href=\"#s-iii-18\"><span class=\"inpart-n\">III.18<\u002Fspan><span>Operating Leverage<\u002Fspan><\u002Fa><a href=\"#s-iii-19\"><span class=\"inpart-n\">III.19<\u002Fspan><span>Technology and Operations as Competitive Advantage (with Finanz Informatik comparison)<\u002Fspan><\u002Fa><a href=\"#s-iii-20\"><span class=\"inpart-n\">III.20<\u002Fspan><span>Volume III Reconstruction (condensed)<\u002Fspan><\u002Fa><a href=\"#s-recommendations-2\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a href=\"#s-caveats-2\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">~490–520<\u002Fdiv><div class=\"stat-l\">banks offline per central fault<\u002Fdiv><\u002Fdiv><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">8 × IBM z15 → z17<\u002Fdiv><div class=\"stat-l\">mainframes, four data centres<\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 id=\"s-volume-iii-operations-technology-data-organizational-infrastructure\" class=\"hd hd2\"><span class=\"ht\">VOLUME III: Operations, Technology, Data &amp; Organizational Infrastructure<\u002Fspan><\u002Fh2><h2 id=\"s-tl-dr-2\" class=\"hd hd2\"><span class=\"ht\">TL;DR<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Atruvia's centre of gravity is an IBM Z / IMS / Db2 / COBOL core<\u002Fstrong> (eight IBM z15 systems hosting twelve IMS systems, ~80bn technical transactions/yr, 12,000 tps peaks, ~400m Java transactions/day) wrapped in ~1,200 Java microservices on Red Hat OpenShift. The 19 November 2025 IBM z17 deal re-underwrites this architecture for years — meaning modernisation is being executed as <strong>in-place refactoring, not replacement<\u002Fstrong>.<\u002Fli><li><strong>The scarce resource is compute-plus-reliability on four twin-site data centres<\u002Fstrong> (two each in Karlsruhe and Münster). A single central software fault takes ~490–520 of ~700 banks offline simultaneously (proven Nov 2020, Nov 2023, July 2026), yet Atruvia was <strong>NOT<\u002Fstrong> designated a DORA Critical ICT Third-Party Provider while its supplier IBM <strong>was<\u002Fstrong> — a genuine national systemic-supervision gap it shares with Finanz Informatik.<\u002Fli><li><strong>Atruvia's advantage is structural (captive ownership) and organisational (repeatable multi-tenant migration at scale) more than purely technological.<\u002Fstrong> The moat is the agree21 multi-tenant core and the industrialised migration machine, not any single piece of software.<\u002Fli><\u002Ful><h2 id=\"s-key-findings-2\" class=\"hd hd2\"><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2><ol class=\"lst\"><li>The core banking estate is IBM z15 (→ z17) running z/OS, IMS (transaction manager + hierarchical DB) and Db2 for z/OS, with a large COBOL base now ~85% Java-enabled inside IMS via an IBM Semeru common runtime that lets 31-bit COBOL and 64-bit Java interoperate.<\u002Fli><li>There are four high-security data centres — \"jeweils zwei Rechenzentren in Karlsruhe und Münster\" — resolving the four-vs-six ambiguity in favour of four.<\u002Fli><li>Fraud detection is in-house AI since 2017: ~0.2–0.3% of transactions flagged, ~20% of flags are false positives, ~80% of unauthorised transactions prevented; banks (not Atruvia) own the regulatory decisions and losses.<\u002Fli><li>The recurring outage pattern is a shared-central-path concentration risk; incident response has matured (July 2026 load-shedding) but the architectural root cause persists.<\u002Fli><li>Finanz Informatik, the Sparkassen mirror, is larger (~€2.6bn revenue, ~114m accounts, &gt;205bn technical transactions) and also IBM-mainframe-based and also not a DORA CTPP — the in-place-modernisation problem is sector-wide.<\u002Fli><\u002Fol><h2 id=\"s-details-2\" class=\"hd hd2\"><span class=\"ht\">Details<\u002Fspan><\u002Fh2><h2 id=\"s-iii-1\" class=\"hd hd2\"><span class=\"hn mono\">III.1<\u002Fspan><span class=\"ht\">Operating Model<\u002Fspan><\u002Fh2><p>Atruvia is organised as an agile \"Spotify-model\" organisation. <strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fstrong> (Atruvia Newwork site; HR-Pioneers conference talk): the top units are <strong>Service-/Geschäftsfelder<\u002Fstrong> (each led by a Feld-Lead with both functional and disciplinary authority); below them sit <strong>Tribes<\u002Fstrong> (grouping squads around a product/service) with a <strong>tandem leadership<\u002Fstrong> split — a <strong>Tribe Lead<\u002Fstrong> (functional leadership, product ownership, budget) and a <strong>People Lead<\u002Fstrong> (disciplinary leadership, people development); <strong>Squads<\u002Fstrong> are the smallest end-to-end delivery units; <strong>Chapters<\u002Fstrong> cross squads within a tribe; <strong>Guilds<\u002Fstrong> span the whole company. A management layer was explicitly removed. Stated drivers (Atruvia HR-Pioneers talk): \"Unterschiedlichste Qualitätsprobleme, eine niedrige Mitarbeiterzufriedenheit und vor allem eine geringe Kundenzufriedenheit.\"<\u002Fp><p>Named units evidenced in job ads and press: Geschäftsfeld <strong>Steuerungsbank<\u002Fstrong> (Tribe Meldewesen), <strong>Omnichannel<\u002Fstrong> (Tribe BankingWorkspace und Vertriebslösungen; Chapter/Squad ContactCenter on Genesys Cloud CX), <strong>Bankbasislösungen<\u002Fstrong> (Tribe Prozessmanagement und Automation), <strong>Daily Banking<\u002Fstrong> (Tribe Bezahllösungen), <strong>Data, Security &amp; Identity<\u002Fstrong> (led by Steffen Unterreiner), Servicefeld <strong>Portfolio Steering and Pricing<\u002Fstrong> (Tribe Pricing and Product Analytics), <strong>Connected Solutions<\u002Fstrong> (Tribe Collaboration Services — SharePoint/M365), and <strong>Procurement<\u002Fstrong> (CPO Regina Krüger-Wendel, ~40 staff in five squads including IT-Services, Business Services and Agiler Projekteinkauf).<\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Function<\u002Fsc-raw-th><sc-raw-th>Mandate<\u002Fsc-raw-th><sc-raw-th>Evidence<\u002Fsc-raw-th><sc-raw-th>Leadership<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Core banking dev<\u002Fsc-raw-td><sc-raw-td>agree21 IMS/COBOL+Java<\u002Fsc-raw-td><sc-raw-td>CONFIRMED<\u002Fsc-raw-td><sc-raw-td>Vorstand Bücker (Core Banking &amp; Technology)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Platform/omnichannel<\u002Fsc-raw-td><sc-raw-td>Omnikanalplattform, BankingWorkspace<\u002Fsc-raw-td><sc-raw-td>CONFIRMED<\u002Fsc-raw-td><sc-raw-td>GF Omnichannel<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DC &amp; mainframe ops<\u002Fsc-raw-td><sc-raw-td>4 DCs, IBM Z estate<\u002Fsc-raw-td><sc-raw-td>CONFIRMED<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">UNKNOWN<\u002Fspan> named lead<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Release/change mgmt<\u002Fsc-raw-td><sc-raw-td>technischer Jahresabschluss<\u002Fsc-raw-td><sc-raw-td>CONFIRMED (Vol II)<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Payment ops<\u002Fsc-raw-td><sc-raw-td>SEPA, cards, DZ clearing<\u002Fsc-raw-td><sc-raw-td>CONFIRMED<\u002Fsc-raw-td><sc-raw-td>Vorstand Kaurin (Digital Banking)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Security (CISO/SOC)<\u002Fsc-raw-td><sc-raw-td>InfoSec, fraud<\u002Fsc-raw-td><sc-raw-td>PARTIAL (audIT; Data/Sec/Identity GF)<\u002Fsc-raw-td><sc-raw-td>S. Unterreiner<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Compliance/risk<\u002Fsc-raw-td><sc-raw-td>MaRisk/BAIT implementation<\u002Fsc-raw-td><sc-raw-td>CONFIRMED<\u002Fsc-raw-td><sc-raw-td>Vorstand Wiegelmann (Fin/Reg/HR)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Data/analytics/AI<\u002Fsc-raw-td><sc-raw-td>Smart Data, plainGPT/genoGPT<\u002Fsc-raw-td><sc-raw-td>CONFIRMED<\u002Fsc-raw-td><sc-raw-td>&gt;70-person AI unit; AI Accelerator<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Procurement<\u002Fsc-raw-td><sc-raw-td>IT/business sourcing<\u002Fsc-raw-td><sc-raw-td>CONFIRMED<\u002Fsc-raw-td><sc-raw-td>CPO Krüger-Wendel<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Service desk/Serviceline<\u002Fsc-raw-td><sc-raw-td>end-customer + bank support<\u002Fsc-raw-td><sc-raw-td>CONFIRMED<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Subsidiaries<\u002Fsc-raw-td><sc-raw-td>Ratiodata, parcIT, Peras, etc.<\u002Fsc-raw-td><sc-raw-td>CONFIRMED (Vol I)<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p>Development capacity is augmented via <strong>Accesa/RaRo<\u002Fstrong> in Cluj-Napoca, Romania (see <a class=\"xr\" href=\"#s-iii-5\">III.5<\u002Fa>, <a class=\"xr\" href=\"#s-iii-14\">III.14<\u002Fa>).<\u002Fp><h2 id=\"s-iii-2\" class=\"hd hd2\"><span class=\"hn mono\">III.2<\u002Fspan><span class=\"ht\">Banking Operations — the processing lifecycle<\u002Fspan><\u002Fh2><p><strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fstrong> (IBM case study \"Atruvia AG\", ibm.com/case-studies/atruvia-ag, May 2022): \"eight IBM z15 systems across four data centers that process 80 billion core banking transactions annually, with peaks of 12,000 transactions per second,\" serving \"some 81 million customer accounts.\" ~85% of core IMS transactions are Java-enabled = ~400 million Java transactions/day. This reconciles with the ~10bn business bookings/yr established in <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-service-delivery-architecture\">Volume II<\u002Fa> at a ratio of roughly 8 technical transactions per booking.<\u002Fp><p><strong>Online/real-time vs batch.<\u002Fstrong> <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> (strongly supported):<\u002Fstrong> agree21 retains a classic mainframe <strong>nightly batch window<\u002Fstrong>. Direct evidence: the Fiducia &amp; GAD \"Tailored Fit Pricing\" case study states the firm \"decreased response times across our production systems by 5 percent and our nightly batch window by 25 percent.\" IBM's Java-in-IMS study confirms batch jobs run on IBM Z, consolidated from multiple platform schedulers to a single scheduler. A knowledgeable third-party (Borns IT blog) describes a <strong>\"frozen zone wg. Jahresabschlussarbeiten und Buchungsschnitt\"<\u002Fstrong> (change freeze for year-end close and the booking cut-off) around the year-turn.<\u002Fp><p><strong>The technischer Jahresabschluss<\u002Fstrong> is the marquee coordinated year-end close/release event (Vol II), planned change-frozen. The 29 December 2025 sector disturbance was attributed by informed commentary to year-turn special processing rather than routine change (\"da laufen halt viele Dinge zum Jahreswechsel extra, die sonst nicht laufen\").<\u002Fp><p><strong>Multi-tenancy operations.<\u002Fstrong> ~700 cooperative banks plus Sparda and private banks (and non-bank clients such as the ADAC) run as tenants on one agree21 instance set. The July 2026 (~490 banks) and Nov 2023 (up to 520 banks) incidents demonstrate that a central fault propagates to a large fraction of tenants at once — direct evidence that tenants share central processing paths rather than being fully isolated.<\u002Fp><p><strong>Abnormal paths / Krisenstab.<\u002Fstrong> <strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan>:<\u002Fstrong> on 9 November 2020 a <strong>system changeover<\u002Fstrong> (\"Systemumstellung\") error hit 150 of 840/841 banks, disabling online banking and self-service/ATM devices; Fiducia &amp; GAD convened a <strong>Krisenstab<\u002Fstrong> — the documented escalation mechanism for major incidents.<\u002Fp><h2 id=\"s-iii-3\" class=\"hd hd2\"><span class=\"hn mono\">III.3<\u002Fspan><span class=\"ht\">Mainframe Capacity, Compute &amp; Data-Centre Operations (PRIORITY DEPTH)<\u002Fspan><\u002Fh2><p><strong>Data centres — resolved.<\u002Fstrong> <strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan>:<\u002Fstrong> Atruvia operates <strong>four<\u002Fstrong> high-security data centres — \"Wir betreiben jeweils zwei Rechenzentren in Karlsruhe und Münster. Sollte einmal ein Rechenzentrum ausfallen, hat das f
