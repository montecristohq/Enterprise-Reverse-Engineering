ür unsere Kunden keinerlei Auswirkungen\" (Atruvia's own IT-Outsourcing page). The \"six\" claim is unsupported by primary sources; four is corroborated by IBM (\"four data centers\") and Wikipedia. The twin-site design implies active-active/hot-standby redundancy within each metro plus cross-metro DR. Karlsruhe↔Münster is ~350 km apart — too far for low-latency synchronous zero-data-loss replication; <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> intra-metro pairs are the synchronous/active-active layer, cross-metro is asynchronous DR. No RTO/RPO figures are published — <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><p><strong>Mainframe estate.<\u002Fstrong> <strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fstrong> (IBM case study): <strong>eight IBM z15 systems<\u002Fstrong> across the four data centres, and <strong>twelve IMS systems<\u002Fstrong> — verbatim: \"Twelve IMS systems with approximately 200 million instructions per processor second (MIPS) support these business-critical transactions.\" Eight physical z15 machines host twelve logical IMS systems. <strong>Current generation:<\u002Fstrong> the 19 November 2025 Atruvia–IBM agreement commits Atruvia to <strong>IBM z17<\u002Fstrong> (announced April 2025, Telum II processor) \"as a cornerstone to support its mission critical operations including the core banking system.\" The public record jumps z15 (2022 case study) → z17 (2025 deal); a <strong>z16 interim is likely<\u002Fstrong> (z16 was available from 2022) but is not separately documented — label the z16 interim <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><p><strong>Capacity management.<\u002Fstrong> <strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan>:<\u002Fstrong> peaks of ~12,000 transactions/second (IBM). The Tailored Fit Pricing project was explicitly motivated by workload volatility from PSD2 and instant payments — the goal was to \"accommodate new workload peaks in a more cost-effective manner.\" <strong>IBM Turbonomic<\u002Fstrong> (workload optimisation/automation) and <strong>Apptio<\u002Fstrong> (cost transparency) are named in the November 2025 deal for \"vendor independence\" and dynamic workload optimisation.<\u002Fp><p><strong>Cost structure of compute.<\u002Fstrong> <strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan>:<\u002Fstrong> adoption of IBM <strong>Tailored Fit Pricing<\u002Fstrong> — a consumption-based licensing model for IBM Z software replacing the traditional peak-MSU monthly-license-charge (MLC) model. Claimed results: 25% smaller nightly batch window, 5% faster response times. There is also a documented economic incentive to shift Java workloads to <strong>zIIP<\u002Fstrong> specialty processors (lower licensing fees; Java consumes more MIPS than COBOL, but net cost is lower). Internal allocation to member banks has moved to <strong>usage-based (nutzenbasierte) pricing<\u002Fstrong> (Vol II); the precise mechanics are <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><p><strong>Hybrid-cloud programme.<\u002Fstrong> <strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan>:<\u002Fstrong> <strong>Red Hat OpenShift<\u002Fstrong> hosts the ~1,200 distributed Java microservices and is designated in the Nov 2025 deal as \"the basis for hybrid cloud scenarios … flexibility and independence from individual cloud providers.\" IBM Cognos (bank reporting) and Planning Analytics (Sales Cockpit) run on OpenShift. Data and keys remain \"always fully controlled in its own data centers\" using <strong>HashiCorp Vault<\u002Fstrong> and IBM storage — i.e., a <strong>sovereign, on-premise-first hybrid cloud<\u002Fstrong>, not a public hyperscaler. At the 2026 Hauptversammlung, hybrid cloud and AI (including \"agentische KI\") were framed as making VR banks \"skalierbar.\" Energy/cooling/PUE figures are <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>; Nachhaltigkeit is a stated strategic corporate goal.<\u002Fp><h2 id=\"s-iii-4\" class=\"hd hd2\"><span class=\"hn mono\">III.4<\u002Fspan><span class=\"ht\">Technology Architecture (PRIORITY DEPTH)<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-7\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 07<\u002Fspan><span class=\"fig-t\">The Technology Stack<\u002Fspan><\u002Fdiv><div class=\"fig-b\" style=\"display:grid;grid-template-columns:1fr 236px;gap:24px\">\n  <div class=\"stack\">\n    <div class=\"band\"><div class=\"band-l\">Client<\u002Fdiv><div class=\"band-i\"><span class=\"chip\">VR Banking App<\u002Fspan><span class=\"chip\">OnlineBanking<\u002Fspan><span class=\"chip\">BankingWorkspace (Angular)<\u002Fspan><span class=\"chip\">agree21BAP (legacy)<\u002Fspan><span class=\"chip\">FinTS/HBCI servers<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"band\"><div class=\"band-l\">Platform<\u002Fdiv><div class=\"band-i\"><span class=\"chip\">Omnikanalplattform — multi-tenant, ~300 processes<\u002Fspan><span class=\"chip\">agree21ECON<\u002Fspan><span class=\"chip\">EGP Gesamtbanksteuerung<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"band\"><div class=\"band-l\">Integration<\u002Fdiv><div class=\"band-i\"><span class=\"chip\">proprietary API layer<\u002Fspan><span class=\"chip on\">~1,200 Java microservices on Red Hat OpenShift<\u002Fspan><span class=\"chip\">IBM MQ for z/OS<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"band core\"><div class=\"band-l\">Core<\u002Fdiv><div class=\"band-i\"><span class=\"chip on\">IMS transaction manager + IMS DB<\u002Fspan><span class=\"chip on\">Db2 for z/OS<\u002Fspan><span class=\"chip on\">COBOL estate ~85% Java-enabled via IBM Semeru common runtime — 31-bit COBOL ↔ 64-bit Java<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"band\"><div class=\"band-l\">Infrastructure<\u002Fdiv><div class=\"band-i\"><span class=\"chip on\">8 × IBM z15 hosting 12 IMS systems → z17, deal signed 19 Nov 2025<\u002Fspan><span class=\"chip on\">four data centres — two in Karlsruhe, two in Münster<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pnl\">\n    <div class=\"pnl-k\">Throughput<\u002Fdiv>\n    <div class=\"ann\"><span class=\"mono\">~80bn<\u002Fspan><span>technical transactions / year<\u002Fspan><\u002Fdiv>\n    <div class=\"ann\"><span class=\"mono\">12,000/s<\u002Fspan><span>peak transactions<\u002Fspan><\u002Fdiv>\n    <div class=\"ann\"><span class=\"mono\">~400m<\u002Fspan><span>Java transactions / day<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><figcaption class=\"fig-c\">A mainframe core under a modern integration and client estate: the COBOL/IMS heart is not being replaced, it is being wrapped.<\u002Ffigcaption><\u002Ffigure><p><strong>Core layer (CONFIRMED, IBM case study):<\u002Fstrong> IBM Z (z15 → z17); z/OS; <strong>IMS<\u002Fstrong> = both transaction manager (IMS TM) and hierarchical database (IMS DB) managing the ~80bn transactions; <strong>Db2 for z/OS<\u002Fstrong> relational store, connected from Java via <strong>JDBC<\u002Fstrong>; a large in-place <strong>COBOL<\u002Fstrong> estate \"permanently in evolution\" (lines-of-code/age <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>). The <strong>Java-on-Z \"common runtime\"<\u002Fstrong> is based on <strong>IBM Semeru Runtime Certified Edition for z/OS, Version 11<\u002Fstrong>, co-developed with IBM before general availability. It lets <strong>31-bit COBOL<\u002Fstrong> interoperate with <strong>64-bit Java<\u002Fstrong> inside IMS, invoking <strong>IBM MQ for z/OS<\u002Fstrong> and connecting to Db2 via JDBC. Critically, it removed the per-component \"compensation\" (rollback) logic previously needed for distributed operations, and enabled colocation (Atruvia reports 3× faster performance for data-intensive apps — \"the best I/O is no I/O\"). ~85% of core-banking IMS transactions are Java-enabled.<\u002Fp><p><strong>Integration/API layer:<\u002Fstrong> ~1,200 Java microservices consume core-banking services via a <strong>proprietary API layer<\u002Fstrong> (CONFIRMED), hosted on <strong>Red Hat OpenShift<\u002Fstrong> on x86 Linux (CONFIRMED); IBM MQ confirmed as messaging. Whether z/OS Connect or WebSphere Liberty fronts the mainframe-side APIs is not documented — <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>. A developer \"will not know if they are calling Java services or original IMS transactions\" (Pascal Meyer, Senior Enterprise Architect, Atruvia).<\u002Fp><p><strong>Platform layer:<\u002Fstrong> the <strong>Omnikanalplattform<\u002Fstrong> — multi-tenant, ~300 available processes (Vol II); ~45 digital fallabschließende Self-Services live for customers (2024 HV). Process modelling via <strong>agree21ECON<\u002Fstrong> (Vol II) and ADONIS (evidenced in partner process documentation). The BPM/workflow engine name is <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><p><strong>Client layer:<\u002Fstrong> <strong>BankingWorkspace<\u002Fstrong> is browser-based — <strong>CONFIRMED stack from job ads:<\u002Fstrong> <strong>Angular<\u002Fstrong> (ads reference \"Angular ab Version 21\"), TypeScript/Web Components, PWA, NGRX, running on OpenShift/Kubernetes, built with GitLab pipelines, Figma for design, Genesys Cloud CX for the contact-centre variant. The legacy <strong>agree21BAP<\u002Fstrong> persists in a coexistence phase; some apps (e.g. CRM) are maintained twice; Coenen: \"der aktuelle Zustand ist etwas zäh\" (Vol II). The <strong>VR Banking App<\u002Fstrong> framework is <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong> from primary sources (job ads reference Angular/Ionic for some apps but not specifically the VR Banking App). <strong>OnlineBanking<\u002Fstrong> and the <strong>FinTS/HBCI servers<\u002Fstrong> are confirmed central services (the June 2020 CAMT52/FinTS special-character bug and the July 2026 FinTS disruption both hit these directly).<\u002Fp><p><strong>Data layer:<\u002Fstrong> operational stores in Db2/IMS on Z; analytics via <strong>Smart Data<\u002Fstrong>; IBM Cognos on OpenShift for bank reporting. Data lake/warehouse and streaming specifics are <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><p><strong>Delivery/engineering (job ads — the best window):<\u002Fstrong> <strong>CONFIRMED<\u002Fstrong> tooling — <strong>GitLab<\u002Fstrong> (source control + deployment pipelines), <strong>Jenkins<\u002Fstrong>, <strong>Docker/Kubernetes on OpenShift<\u002Fstrong>, Jira, Confluence, Eclipse/VSCode/IntelliJ; <strong>Java/Spring/Spring Boot<\u002Fstrong> backend, <strong>Angular<\u002Fstrong> frontend; Scrum/Kanban, pair programming and code reviews. Testing a change destined for 700 banks uses the pilot→Serienpilot→Serienmigration ladder (Vol II). Feature-flag specifics are <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><p><strong>Reliability:<\u002Fstrong> observability/monitoring specifics are not published; incident management runs via Krisenstab; twin-site failover is confirmed at the principle level.<\u002Fp><h2 id=\"s-iii-5\" class=\"hd hd2\"><span class=\"hn mono\">III.5<\u002Fspan><span class=\"ht\">Build vs Buy vs Nearshore<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Capability<\u002Fsc-raw-th><sc-raw-th>Model<\u002Fsc-raw-th><sc-raw-th>Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Core banking (agree21)<\u002Fsc-raw-td><sc-raw-td><strong>BUILD<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Proprietary IMS/COBOL+Java — the crown jewel<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Mainframe HW/SW<\u002Fsc-raw-td><sc-raw-td><strong>BUY (IBM)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>z17, z/OS, IMS, Db2, MQ, Semeru, Turbonomic, Apptio<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Container platform<\u002Fsc-raw-td><sc-raw-td><strong>BUY/OSS (Red Hat OpenShift)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Hybrid-cloud basis<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Secrets/keys<\u002Fsc-raw-td><sc-raw-td><strong>BUY (HashiCorp Vault)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>On-prem, self-controlled<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Productivity<\u002Fsc-raw-td><sc-raw-td><strong>BUY + managed BUILD (Microsoft M365)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>agree21M365 = managed service on a bought platform<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Contact centre<\u002Fsc-raw-td><sc-raw-td><strong>BUY (Genesys Cloud CX)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Job ads<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Fraud/AML<\u002Fsc-raw-td><sc-raw-td><strong>BUILD (in-house AI since 2017)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Autoencoders/neural nets<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>AI/LLM<\u002Fsc-raw-td><sc-raw-td><strong>BUY model + BUILD wrapper<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>plainGPT is <strong>based on OpenAI models<\u002Fstrong> (Börsen-Zeitung: \"Er basiert auf Modellen der ChatGPT-Mutter OpenAI\"); genoGPT adds bank-internal knowledge (RAG). The \"no open-internet private cloud\" is a governance wrapper around a vendor model, not necessarily self-hosted open-weights<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Reporting/planning<\u002Fsc-raw-td><sc-raw-td>BUY (IBM Cognos, Planning Analytics)<\u002Fsc-raw-td><sc-raw-td>Nov 2025 deal<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Dev capacity<\u002Fsc-raw-td><sc-raw-td><strong>NEARSHORE (Accesa/RaRo, Romania)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Cluj-Napoca<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p>Regulatory implications: under <strong>DORA Article 30<\u002Fstrong>, member banks' contracts with Atruvia must contain resilience/audit/exit clauses; because <strong>IBM is a designated CTPP<\u002Fstrong> and Atruvia is not, IBM sits under direct ESA oversight while Atruvia is supervised only indirectly via its bank customers (§25b KWG). IBM Z lock-in is deep and deliberately re-committed in November 2025.<\u002Fp><h2 id=\"s-iii-6\" class=\"hd hd2\"><span class=\"hn mono\">III.6<\u002Fspan><span class=\"ht\">Payment Infrastructure Software<\u002Fspan><\u002Fh2><p><strong>CONFIRMED FACTS:<\u002Fstrong> Atruvia handles SEPA credit transfers, SCT Inst (instant payments were an explicit driver of the Tailored Fit Pricing capacity project), FinTS/HBCI initiation, and card processing. DZ Bank is the clearing/settlement counterpart (Vol I/II). The June 2020 incident (CAMT52 special-character bug) shows the account-statement/reporting path. The 7 July 2026 warning — \"Sendet Überweisungen nicht mehrfach ab … Prüft zuerst, ob der Auftrag trotzdem ausgeführt wurde\" (NETZWELT Störungskarte, updated 21 July 2026) — is direct evidence that duplicate-submission (idempotency) is a live operational risk under degraded conditions.<\u002Fp><p><strong>Card platform transformation (CONFIRMED).<\u002Fstrong> Effective <strong>1 January 2027<\u002Fstrong>, Atruvia acquires the <strong>Issuing Processing<\u002Fstrong> business of VR Payment (DZ Bank subsidiary), taking over not only debit-card issuing processing but also <strong>credit-card processing<\u002Fstrong> (previously at VR Payment). Target: a single <strong>integrierte Kartenplattform<\u002Fstrong> unifying Girokarte, Debitkarte and Kreditkarte processing on one platform. VR Payment refocuses on merchant/acquiring/POS-Netzbetrieb. Bundeskartellamt case <strong>B9-75/26<\u002Fstrong>, filed 15 July 2026; reportedly internal name \"Projekt Dragon\" (unconfirmed). McDermott (adviser) notes \"a significant portion of all credit card transactions in Germany is processed through Atruvia's systems.\" The detailed target state-machine/rail architecture is <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><h2 id=\"s-iii-7\" class=\"hd hd2\"><span class=\"hn mono\">III.7<\u002Fspan><span class=\"ht\">Ledger and Core Banking Data Architecture<\u002Fspan><\u002Fh2><p><strong>CONFIRMED<\u002Fstrong> at architecture level: balances/postings are held in <strong>Db2 for z/OS<\u002Fstrong> (relational) with transaction management in <strong>IMS<\u002Fstrong>. Beyond this the internal data model is <strong>not public — <span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>. Specifically unknown: whether tenants are separated by (a) separate databases, (b) separate schemas, or (c) tenant-key partitioning within shared tables. <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> the fact that a single central fault simultaneously hits ~490–520 banks argues for <strong>shared logical infrastructure with tenant keys / shared subsystems<\u002Fstrong> rather than 700 physically isolated databases (which would fail bank-by-bank, not en masse). Double-entry structure, pending-vs-settled state, reversal mechanics, and how bank mergers physically consolidate two tenants' ledgers are all <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong> — Atruvia has published nothing. To close the gap one would need the agree21 physical data model, the tenant-partitioning key, and the merger-consolidation runbook.<\u002Fp><h2 id=\"s-iii-8\" class=\"hd hd2\"><span class=\"hn mono\">III.8<\u002Fspan><span class=\"ht\">Reconciliation Architecture<\u002Fspan><\u002Fh2><p>Atruvia has published essentially nothing on its internal reconciliation systems — largely <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>. Inferable: reconciliation must occur between the agree21 core and (a) SEPA/SCT Inst rails, (b) card schemes (increasingly in-house post-2027), (c) DZ Bank clearing/settlement, and (d) banks' own regulatory reporting. Regulatory importance: reconciliation breaks feed directly into each member bank's §25b KWG outsourcing liability and MaRisk AT 9 responsibility — the bank, not Atruvia, is the regulated entity that must answer for a settlement mismatch. <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> the technischer Jahresabschluss functions partly as a systemwide reconciliation/close checkpoint. A reconciliation failure operationally means blocked/duplicated postings (cf. the July 2026 duplicate-transfer warning), financially means intraday exposure at DZ Bank clearing, and for the member bank means a reportable §25b/MaRisk incident.<\u002Fp><h2 id=\"s-iii-9\" class=\"hd hd2\"><span class=\"hn mono\">III.9<\u002Fspan><span class=\"ht\">Data Architecture and Governance<\u002Fspan><\u002Fh2><p><strong>CONFIRMED legal structure:<\u002Fstrong> Atruvia is a <strong>GDPR processor (Auftragsverarbeiter)<\u002Fstrong>; each member bank is the <strong>controller (Verantwortlicher)<\u002Fstrong>, bound by an <strong>Auftragsverarbeitungsvertrag (AVV)<\u002Fstrong>. This is the pivotal constraint on any \"data flywheel.\"<\u002Fp><p><strong>The data-flywheel question (important).<\u002Fstrong> Atruvia's systems see the transaction data of ~97m accounts. Assessed rigorously: as a <strong>processor<\u002Fstrong>, Atruvia may only process personal data on documented controller instructions and for the contracted purpose; it cannot lawfully repurpose cross-tenant personal data for its own commercial benefit without a legal basis. A genuine cross-bank personal-data flywheel is therefore <strong>legally constrained<\u002Fstrong>. However, two legitimate value loops exist and are evidenced: (1) <strong>fraud detection<\u002Fstrong> — models trained across the network on transaction patterns (a permissible security purpose, and one where scale is a real advantage); (2) <strong>Smart Data / analytics products<\u002Fstrong> sold back to banks (each bank exploiting its own data with Atruvia's tooling). <strong>CONFIRMED:<\u002Fstrong> TRUUCO (Vol I) and Smart Data provide model/analytics capability. The strategic asset is thus <strong>network-scale fraud/behavioural modelling and productised analytics<\u002Fstrong>, not a free-floating data monopoly. Technical segregation across ~700 tenants is <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong> (see <a class=\"xr\" href=\"#s-iii-7\">III.7<\u002Fa>); retention/lineage/access-control specifics are <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><h2 id=\"s-iii-10\" class=\"hd hd2\"><span class=\"hn mono\">III.10<\u002Fspan><span class=\"ht\">Fraud and Financial-Crime Technology<\u002Fspan><\u002Fh2><p><strong>CONFIRMED FACTS:<\u002Fstrong> Atruvia has used AI/ML for fraud detection since <strong>2017<\u002Fstrong> (\"flächendeckend\"), positioning itself as a Fraud Detection/Management pioneer. Mechanism (Atruvia Fraud Manager Andreas Hermann, 2022): self-learning algorithms flag suspicious transactions in real time for holding/blocking; <strong>0.2–0.3% of transactions are classified suspicious<\u002Fstrong>; on manual review, <strong>~1 in 5 flags is a false positive<\u002Fstrong> (~80% precision on flags); the solution <strong>\"verhindert 80 Prozent aller unberechtigten Transaktionen.\"<\u002Fstrong> Evolution: decision-tree models are being extended toward <strong>neural networks / autoencoders<\u002Fstrong> that model normal human behaviour to detect anomalies.<\u002Fp><p><strong>Division of labour (critical).<\u002Fstrong> Atruvia builds and runs the <strong>systems<\u002Fstrong>; the <strong>member bank<\u002Fstrong> retains regulatory responsibility — GwG/KWG obligations, transaction-monitoring calibration, decisions, and filing of Verdachtsmeldungen (SARs) to the FIU. A flagged transaction is reviewed by a <strong>trained bank employee<\u002Fstrong> (\"ein geschulter Mitarbeiter\"), not auto-rejected. Sanctions/PEP screening and identity/KYC are bank-facing regulated functions supported by Atruvia tooling. <strong>Who bears losses:<\u002Fstrong> ultimately the bank and/or customer per the payment-services liability regime; Atruvia bears the systems-reliability and detection-quality responsibility, not the direct fraud loss. Both rule/threshold scenarios and ML anomaly detection are used.<\u002Fp><h2 id=\"s-iii-11\" class=\"hd hd2\"><span class=\"hn mono\">III.11<\u002Fspan><span class=\"ht\">Security Architecture<\u002Fspan><\u002Fh2><p><strong>The 2018 BaFin finding and audIT remediation (CONFIRMED, richly sourced).<\u002Fstrong> A BaFin §44 KWG special inspection ran <strong>May–August 2018<\u002Fstrong> (conducted via Volksbank Jever); the report was delivered <strong>spring 2019<\u002Fstrong>: <strong>15 Feststellungen, of which 3 schwerwiegend (severe)<\u002Fstrong>. Fiducia &amp; GAD had pre-emptively launched programme <strong>\"audIT\"<\u002Fstrong> in autumn 2018 (led by Andreas Abel, head of Risk/Compliance/Security/Legal — \"Das war schon wie ein Schlag in die Magengrube\"). Documented weak areas: <strong>Berechtigungsmanagement<\u002Fstrong> (access/authorisation management), <strong>IT-Ausfallvorsorge/Notfallmanagement<\u002Fstrong>, Auslagerungsmanagement, Informationssicherheitsmanagement, and the Bankensteuerungssystem. Remediation: <strong>Netzwerksicherheit<\u002Fstrong> was completed; <strong>Berechtigungsmanagement<\u002Fstrong> was hardest — \"wesentliche Abarbeitungspunkte\" by end-2021 but \"restliche Aktivitäten … über 2021 hinaus,\" with verbund timelines cited toward 2023. Governance fallout: CEO <strong>Klaus-Peter Bruns<\u002Fstrong> and deputy <strong>Carsten Pfläging<\u002Fstrong> departed; a BVR-level Lenkungskreis oversaw progress. (The task instruction's \"audIT completed 31 December 2021\" should read \"material points reached by end-2021, residual work beyond\" — the evidence shows Berechtigungsmanagement work extended past 2021.)<\u002Fp><p><strong>Physical/DC security.<\u002Fstrong> Four Hochsicherheitsrechenzentren; a Baden-Württemberg Sicherheitspreis (2007, silver medal, as Fiducia); Notstrom/battery/aggregate backup proven in a 2007 Durlach 75-minute grid failure (ATMs kept running through the outage).<\u002Fp><p><strong>Encryption/key management.<\u002Fstrong> IBM Z <strong>pervasive encryption<\u002Fstrong> (from z14/z15) and, on z16/z17, <strong>quantum-safe cryptography<\u002Fstrong> (lattice-based CRYSTALS-Kyber/Dilithium, Crypto Express8S) — the Nov 2025 deal explicitly cites \"confidential computing and quantum-safe encryption.\" Keys held in <strong>HashiCorp Vault<\u002Fstrong>, self-controlled in Atruvia's own data centres.<\u002Fp><p><strong>DDoS.<\u002Fstrong> <strong>CONFIRMED:<\u002Fstrong> 3 June 2021 and subsequent DDoS attacks on the Karlsruhe then Münster data centres caused multi-hour outages (Finanz-Szene). Specific mitigations adopted are not detailed publicly — <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><p><strong>Certifications.<\u002Fstrong> Atruvia's specific ISO 27001 / IDW PS 951 / ISAE 3402 scopes and KRITIS/BSI (§8a BSIG) status are <strong>not confirmed in the sources reviewed — <span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>, though such attestations are the standard basis on which member banks satisfy EBA outsourcing-guideline Rz. 93 and MaRisk AT 9 for a provider of this criticality, and Atruvia almost certainly holds ISAE 3402/IDW PS 951 reports for its customer banks' auditors. This should be verified against Atruvia's Geschäftsbericht/technical annex.<\u002Fp><h2 id=\"s-iii-12\" class=\"hd hd2\"><span class=\"hn mono\">III.12<\u002Fspan><span class=\"ht\">Reliability Engineering (PRIORITY DEPTH) — Incident Post-Mortems<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-4\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 04<\u002Fspan><span class=\"fig-t\">Outage Blast Radius, 2018–2026<\u002Fspan><\u002Fdiv><div class=\"fig-b\">\n  <svg sc-camel-view-box=\"0 0 980 400\" class=\"svg\" style=\"width:100%;height:auto\">\n    <line x1=\"30\" y1=\"320\" x2=\"960\" y2=\"320\" stroke=\"var(--wire)\" stroke-width=\"1\"><\u002Fline>\n    <g stroke=\"var(--wire)\" stroke-width=\"1\"><line x1=\"30\" y1=\"316\" x2=\"30\" y2=\"324\"><\u002Fline><line x1=\"146\" y1=\"316\" x2=\"146\" y2=\"324\"><\u002Fline><line x1=\"262\" y1=\"316\" x2=\"262\" y2=\"324\"><\u002Fline><line x1=\"378\" y1=\"316\" x2=\"378\" y2=\"324\"><\u002Fline><line x1=\"494\" y1=\"316\" x2=\"494\" y2=\"324\"><\u002Fline><line x1=\"610\" y1=\"316\" x2=\"610\" y2=\"324\"><\u002Fline><line x1=\"726\" y1=\"316\" x2=\"726\" y2=\"324\"><\u002Fline><line x1=\"842\" y1=\"316\" x2=\"842\" y2=\"324\"><\u002Fline><line x1=\"958\" y1=\"316\" x2=\"958\" y2=\"324\"><\u002Fline><\u002Fg>\n    <g font-size=\"12.5\" fill=\"var(--muted)\" letter-spacing=\"0.1em\" class=\"mono\"><text x=\"30\" y=\"346\">2018<\u002Ftext><text x=\"146\" y=\"346\">2019<\u002Ftext><text x=\"262\" y=\"346\">2020<\u002Ftext><text x=\"378\" y=\"346\">2021<\u002Ftext><text x=\"494\" y=\"346\">2022<\u002Ftext><text x=\"610\" y=\"346\">2023<\u002Ftext><text x=\"726\" y=\"346\">2024<\u002Ftext><text x=\"842\" y=\"346\">2025<\u002Ftext><text x=\"946\" y=\"346\">2026<\u002Ftext><\u002Fg>\n\n    <g><line x1=\"78\" y1=\"320\" x2=\"78\" y2=\"219\" stroke=\"var(--wire)\" stroke-width=\"1\"><\u002Fline>\n      <circle cx=\"78\" cy=\"208\" r=\"11\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1\" stroke-dasharray=\"3 2\"><\u002Fcircle>\n      <text x=\"78\" y=\"243\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\" class=\"mono\">firmwide<\u002Ftext>\n      <text x=\"78\" y=\"118\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink)\" font-weight=\"500\">BaFin §44 inspection<\u002Ftext>\n      <text x=\"78\" y=\"136\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">May–Aug 2018 · 15 findings, 3 severe<\u002Ftext>\n    <\u002Fg>\n\n    <g><line x1=\"310\" y1=\"320\" x2=\"310\" y2=\"307\" stroke=\"var(--wire)\" stroke-width=\"1\"><\u002Fline>\n      <circle cx=\"310\" cy=\"300\" r=\"7\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1\"><\u002Fcircle>\n      <text x=\"296\" y=\"248\" text-anchor=\"end\" font-size=\"14\" fill=\"var(--ink)\" font-weight=\"500\">FinTS/CAMT52 bug<\u002Ftext>\n      <text x=\"296\" y=\"266\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--muted)\">10 Jun 2020 · FinTS users<\u002Ftext>\n    <\u002Fg>\n\n    <g><line x1=\"360\" y1=\"320\" x2=\"360\" y2=\"184\" stroke=\"var(--wire)\" stroke-width=\"1\"><\u002Fline>\n      <circle cx=\"360\" cy=\"170\" r=\"14\" fill=\"var(--acc-fill)\" stroke=\"var(--acc-solid)\" stroke-width=\"1\"><\u002Fcircle>\n      <text x=\"360\" y=\"175\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--acc)\" class=\"mono\">150<\u002Ftext>\n      <text x=\"360\" y=\"62\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink)\" font-weight=\"500\">System-changeover error<\u002Ftext>\n      <text x=\"360\" y=\"80\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">9 Nov 2020 · 150 of 840 · Krisenstab<\u002Ftext>\n    <\u002Fg>\n\n    <g><line x1=\"426\" y1=\"320\" x2=\"426\" y2=\"311\" stroke=\"var(--wire)\" stroke-width=\"1\"><\u002Fline>\n      <circle cx=\"426\" cy=\"300\" r=\"11\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1\" stroke-dasharray=\"3 2\"><\u002Fcircle>\n      <text x=\"446\" y=\"292\" font-size=\"14\" fill=\"var(--ink)\" font-weight=\"500\">DDoS attack<\u002Ftext>\n      <text x=\"446\" y=\"310\" font-size=\"12.5\" fill=\"var(--muted)\">3 Jun 2021 · Karlsruhe, then Münster · firmwide<\u002Ftext>\n    <\u002Fg>\n\n    <g><line x1=\"704\" y1=\"320\" x2=\"704\" y2=\"196\" stroke=\"var(--wire)\" stroke-width=\"1\"><\u002Fline>\n      <circle cx=\"704\" cy=\"170\" r=\"26\" fill=\"var(--acc-fill)\" stroke=\"var(--acc-solid)\" stroke-width=\"1\"><\u002Fcircle>\n      <text x=\"704\" y=\"176\" text-anchor=\"middle\" font-size=\"15\" fill=\"var(--acc)\" class=\"mono\">520<\u002Ftext>\n      <text x=\"704\" y=\"62\" text-anchor=\"middle\" font-size=\"14\" fill=\"var(--ink)\" font-weight=\"500\">Central fault — transfers and account views down<\u002Ftext>\n      <text x=\"704\" y=\"80\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--muted)\">29 Nov 2023 · up to 520 of ~700 banks<\u002Ftext>\n    <\u002Fg>\n\n    <g><line x1=\"906\" y1=\"320\" x2=\"906\" y2=\"233\" stroke=\"var(--wire)\" stroke-width=\"1\"><\u002Fline>\n      <circle cx=\"906\" cy=\"208\" r=\"25\" fill=\"var(--acc-fill)\" stroke=\"var(--acc-solid)\" stroke-width=\"1\"><\u002Fcircle>\n      <text x=\"906\" y=\"214\" text-anchor=\"middle\" font-size=\"15\" fill=\"var(--acc)\" class=\"mono\">490<\u002Ftext>\n      <text x=\"906\" y=\"118\" text-anchor=\"end\" font-size=\"14\" fill=\"var(--ink)\" font-weight=\"500\">Central software error — app and online banking<\u002Ftext>\n      <text x=\"906\" y=\"136\" text-anchor=\"end\" font-size=\"12.5\" fill=\"var(--muted)\">7 Jul 2026 · switched off to shed load · ~490 banks<\u002Ftext>\n    <\u002Fg>\n\n    <text x=\"30\" y=\"378\" font-size=\"12.5\" fill=\"var(--muted)\" letter-spacing=\"0.08em\">MARKER AREA ∝ BANKS AFFECTED · DASHED = FIRMWIDE, COUNT NOT DISCLOSED<\u002Ftext>\n  <\u002Fsvg>\n<\u002Fdiv><figcaption class=\"fig-c\"><b>The same failure mode recurs: one central fault, hundreds of banks.<\u002Fb> Marker area is proportional to the number of institutions taken offline; dashed markers are firmwide events with no published bank count.<\u002Ffigcaption><\u002Ffigure><p>Why Atruvia's reliability bar is exceptional: a single central fault disables ~500 banks at once and is national news. Availability SLOs are not published — <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>. The <strong>batch window<\u002Fstrong> is a hard reliability constraint (a failed batch delays day-start across all tenants). <strong>Duplicate-payment prevention<\u002Fstrong> is a proven live risk (July 2026 warning).<\u002Fp><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Date<\u002Fsc-raw-th><sc-raw-th>Scope<\u002Fsc-raw-th><sc-raw-th>Proximate cause<\u002Fsc-raw-th><sc-raw-th>Systemic cause<\u002Fsc-raw-th><sc-raw-th>Aftermath/change<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>May–Aug 2018<\u002Fsc-raw-td><sc-raw-td>Firmwide<\u002Fsc-raw-td><sc-raw-td>BaFin §44 findings (15/3 severe)<\u002Fsc-raw-td><sc-raw-td>Weak Berechtigungsmanagement, IT-Ausfallvorsorge post-merger<\u002Fsc-raw-td><sc-raw-td>audIT; leadership change; remediation to ~2023<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>10 Jun 2020<\u002Fsc-raw-td><sc-raw-td>FinTS users<\u002Fsc-raw-td><sc-raw-td>CAMT52 special-character bug<\u002Fsc-raw-td><sc-raw-td>Input-validation defect in statement path<\u002Fsc-raw-td><sc-raw-td>Fixed same day<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>9 Nov 2020<\u002Fsc-raw-td><sc-raw-td>150 of 840 banks<\u002Fsc-raw-td><sc-raw-td>Systemumstellung error<\u002Fsc-raw-td><sc-raw-td>Change-execution risk on shared infra; online + SB/ATM hit<\u002Fsc-raw-td><sc-raw-td>Krisenstab; resolved during day<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>3 Jun 2021+<\u002Fsc-raw-td><sc-raw-td>Firmwide (KA→MS DCs)<\u002Fsc-raw-td><sc-raw-td>DDoS attack<\u002Fsc-raw-td><sc-raw-td>Internet-facing edge exposure<\u002Fsc-raw-td><sc-raw-td>Mitigations (undisclosed)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>29 Nov 2023<\u002Fsc-raw-td><sc-raw-td>up to 520 of ~700<\u002Fsc-raw-td><sc-raw-td>Central fault (S. Germany)<\u002Fsc-raw-td><sc-raw-td>Shared central processing path<\u002Fsc-raw-td><sc-raw-td>\"Hochdruck\" fix; Handelsblatt: \"Die Sicherheit der Daten von Kunden ist zu jeder Zeit weiterhin gewährleistet\"<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>7 Jul 2026<\u002Fsc-raw-td><sc-raw-td>~490 banks<\u002Fsc-raw-td><sc-raw-td>Central software error from ~08:00<\u002Fsc-raw-td><sc-raw-td>Shared central path; load amplification<\u002Fsc-raw-td><sc-raw-td>App/online banking switched off to shed load; websites down 09:47–10:38; resolved 13:20; duplicate-transfer warning<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Pattern assessment.<\u002Fstrong> The recurrence is a <strong>shared-central-path concentration risk<\u002Fstrong>: the same failure mode (a central change or software fault propagating to hundreds of tenants simultaneously) recurs across 2020, 2023 and 2026. The 2018→2020 sequence shows the remediation programme did not prevent a 2020 changeover failure. The <strong>7 July 2026 response is more mature<\u002Fstrong> — deliberate load-shedding (switching off app/online banking to protect the core), explicit user guidance on duplicate prevention, and a bounded recovery timeline (resolved by 13:20) — indicating <strong>improved incident-response playbooks<\u002Fstrong> even as the <strong>underlying architectural concentration risk persists<\u002Fstrong>. Net verdict: <strong>incident-response has improved; the single-central-path vulnerability has not been eliminated<\u002Fstrong> — stasis on the root cause, improvement on mitigation.<\u002Fp><h2 id=\"s-iii-13\" class=\"hd hd2\"><span class=\"hn mono\">III.13<\u002Fspan><span class=\"ht\">Infrastructure Resilience and Concentration Risk<\u002Fspan><\u002Fh2><p>Single points of failure: (1) the <strong>shared agree21 central processing path<\u002Fstrong> (empirically, a ~490–520-bank blast radius); (2) <strong>IBM Z / IBM<\u002Fstrong> as sole core-platform vendor (lock-in re-committed Nov 2025); (3) the internet-facing edge (DDoS-exposed). Geographic redundancy (four DCs, twin metros) does not protect against a <strong>logical/software<\u002Fstrong> fault replicated across sites — which is exactly the recurring failure mode.<\u002Fp><p><strong>The DORA perimeter gap (systemic question).<\u002Fstrong> <strong>CONFIRMED:<\u002Fstrong> on 18 November 2025 the ESAs (EBA, EIOPA, ESMA) designated <strong>19 CTPPs<\u002Fstrong> under DORA Article 31(9), including <strong>IBM<\u002Fstrong> (\"International Business Machines Corporation (IBM)\", Lead Overseer EBA), AWS, Microsoft, Google, Oracle, SAP, SWIFT, FIS, Fiserv, Worldline, Temenos, Finastra, Murex, Broadridge, Euroclear, Clearstream, Equinix, Salesforce and SIX. <strong>Atruvia was NOT designated. Finanz Informatik (the Sparkassen equivalent) was also NOT designated<\u002Fstrong> (subagent-confirmed against the list of 19). The Article 31 criteria weight: systemic impact of a failure, systemic importance of dependent entities, <strong>concentration<\u002Fstrong> of reliance, <strong>substitutability<\u002Fstrong>, plus (per commentary) cross-border footprint and EU-wide interconnectedness.<\u002Fp><p><strong>Analysis:<\u002Fstrong> the methodology favours <strong>cross-border, multi-sector<\u002Fstrong> providers (hyperscalers, global fintech platforms, market infrastructures). Atruvia is <strong>overwhelmingly domestic<\u002Fstrong> (German cooperative banks) — high national concentration, low cross-border footprint — so the criteria capture IBM (Atruvia's global supplier) but not Atruvia itself, even though an Atruvia outage disables a larger share of German retail banking than an isolated IBM outage would. <strong>Verdict: a genuine national systemic-supervision gap exists.<\u002Fstrong> It is only partly mitigated by indirect supervision (§25b KWG via customer banks; BaFin §44 special inspections — one begun November 2023) and by the fact that both large German captive core-banking providers sit outside direct DORA oversight. The counter-argument: because Atruvia is captive and single-country, BaFin already has strong indirect levers and detailed visibility (as the 2018 and 2023 §44 inspections show). But structurally the point stands — no single supervisor holds direct, continuous oversight of an entity whose failure routinely takes ~500 banks offline.<\u002Fp><h2 id=\"s-iii-14\" class=\"hd hd2\"><span class=\"hn mono\">III.14<\u002Fspan><span class=\"ht\">Employee Architecture<\u002Fspan><\u002Fh2><p><strong>Headcount.<\u002Fstrong> Group ~<strong>10,076 employees (2024)<\u002Fstrong> (Vol I); historically ~8,400 group / ~4,600 AG (2020–21). Geographic distribution: Karlsruhe and Münster (largest — Vorstand, development, sales, customer service), plus Munich/Aschheim, Frankfurt, Berlin (Munich hosts an Innovation space); nearshore in Cluj-Napoca.<\u002Fp><p><strong>Nearshore (Accesa/RaRo).<\u002Fstrong> <strong>CONFIRMED:<\u002Fstrong> <strong>RaRo (Ratiodata Accesa Romania S.R.L.)<\u002Fstrong> was founded 2020 as a JV — <strong>Ratiodata 74.9% / Accesa 25.1%<\u002Fstrong> — HQ Cluj-Napoca; portfolio = consulting, software development, testing, IT operations support and 24×7 managed services, aimed at regulated sectors. Ratiodata later <strong>acquired the Accesa IT Group<\u002Fstrong> (~<strong>700 IT specialists across ~20 competence centres<\u002Fstrong>), lifting the Ratiodata group to <strong>&gt;2,100 employees across 21 sites<\u002Fstrong> in Germany, Luxembourg, Romania and Switzerland. Compute stays in German data centres; only development/services are performed in Romania. <strong>Why Romania:<\u002Fstrong> a large pool of well-trained STEM/engineering graduates, high English proficiency, German widely studied, EET time zone (1–2h overlap for live stand-ups), and a shared <strong>EU regulatory/legal framework<\u002Fstrong> — important for a regulated-banking supply chain. Named Atruvia collaborators (Accesa site): Lennart Peters (Systems Architect), Enrico Shmal (Tribe Lead), Mathias Glaser (Scrum Master), on a 2.5-year regulatory-delivery partnership.<\u002Fp><p><strong>COBOL/mainframe skills &amp; demographic risk (important).<\u002Fstrong> <strong>CONFIRMED driver<\u002Fstrong> (IBM case study): \"With many COBOL programmers retiring … Atruvia executives decided on a creative approach to application modernization.\" The Java-in-IMS strategy is explicitly a <strong>skills-continuity hedge<\u002Fstrong> against COBOL retirement, making core-banking work \"more familiar to the latest generation of developers.\" Atruvia is not recruiting a new COBOL generation at scale; it is <strong>wrapping COBOL in Java<\u002Fstrong> so it can hire from the general Java/Spring/Angular talent market (as the job ads confirm). Apprenticeship/dual-study/university-partnership specifics for mainframe engineers are not evidenced in the sources reviewed — <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fp><p><strong>Co-determination &amp; brand.<\u002Fstrong> 20-seat co-determined Aufsichtsrat under MitbestG 1976 (Vol I); the transformation removed a management layer and split leadership into People/Tribe leads. Job ads disclose salary bands (e.g. frontend engineer €70,000–€102,000 for a 38h week; fullstack engineer €65,000–€94,000), indicating competitive market-rate compensation — used cautiously as employer-brand evidence. Kununu/Glassdoor sentiment was not systematically assessed here.<\u002Fp><h2 id=\"s-iii-15\" class=\"hd hd2\"><span class=\"hn mono\">III.15<\u002Fspan><span class=\"ht\">Organizational Design<\u002Fspan><\u002Fh2><p>Atruvia is a <strong>matrixed, product-based agile organisation<\u002Fstrong> (Spotify-inspired tribes/squads) sitting inside a <strong>captive customer-owner governance<\u002Fstrong> that heavily constrains autonomy. Decision rights: Tribe Leads hold product ownership and budget; People Leads hold hiring/people authority; risk/compliance veto sits with the Vorstand ressort of Wiegelmann (Finance/Regulation/HR) and the Data/Security/Identity Geschäftsfeld.<\u002Fp><p><strong>The \"neues Betriebsmodell\" (CONFIRMED).<\u002Fstrong> Referenced from the 2025 Hauptversammlung and elaborated 2025–26: it is a <strong>strategic-operational framework<\u002Fstrong> for the banks, not merely an internal reorg. Its technological pillars are the <strong>Omnikanalplattform<\u002Fstrong>, <strong>BankingWorkspace<\u002Fstrong>, <strong>OnlineBanking<\u002Fstrong> and the <strong>VR Banking App<\u002Fstrong>, delivering <strong>digitale, fallabschließende Prozesse<\u002Fstrong> (end-to-end digital processes) that \"entlasten\" bank staff and let banks \"flexibel auf unterschiedliche Rahmenbedingungen reagieren.\" At the 2026 HV it was positioned as the frame within which hybrid cloud + AI (incl. agentic AI) make VR banks \"skalierbar.\"<\u002Fp><p><strong>Formal vs actual power.<\u002Fstrong> The customer-owner governance (BVR committees, the Bundeseinheitliches Strategieportfolio with 36 of 39 initiatives touching Atruvia, Kompetenzteams, Fokusgruppen, the Strategie- und Portfolioplattform — Vol II) means Atruvia's roadmap is <strong>substantially set by its owners<\u002Fstrong>, not autonomously. Internal agile empowerment is real at delivery level but bounded at portfolio level by the BSP/SPP mechanism.<\u002Fp><h2 id=\"s-iii-16\" class=\"hd hd2\"><span class=\"hn mono\">III.16<\u002Fspan><span class=\"ht\">Product Development and Release System<\u002Fspan><\u002Fh2><p>Roadmapping is driven by the BSP/SPP owner mechanism (Vol II). Agile methods (Scrum/Kanban, pair programming, code reviews) are confirmed in job ads. The <strong>rollout pattern<\u002Fstrong> is the multi-tenant pilot ladder: technical tests → Pilotierung → Serienpiloten/Serienfähigkeit → Serienmigration in tranches → bank-side MaRisk AT 8.2 change assessment, with the <strong>technischer Jahresabschluss<\u002Fstrong> as the marquee coordinated release (Vol II). A new regulation becomes a 700-bank release by: build once centrally, pilot with a small set of banks, prove Serienfähigkeit, then roll out in tranches. Technical-debt management on the COBOL estate is <strong>selective in-place refactoring<\u002Fstrong> (\"There is no pressure to modernize just for the sake of modernization\" — Thomas Bauer, IT Architect, Atruvia). The genoGPT pilot (\"bereits in der Pilotierung mit ersten Banken\") shows the same pilot-first cadence for AI features.<\u002Fp><h2 id=\"s-iii-17\" class=\"hd hd2\"><span class=\"hn mono\">III.17<\u002Fspan><span class=\"ht\">Support and Service Operating Model<\u002Fspan><\u002Fh2><p><strong>CONFIRMED:<\u002Fstrong> the <strong>Serviceline<\u002Fstrong> is a qualified technical <strong>end-customer hotline<\u002Fstrong> for Online-/Mobile-Banking, GENO cash, Profi cash, BankingManager and VR-NetWorld Software, reachable only via the number the bank issues; it offers <strong>Fernwartung<\u002Fstrong> (remote screen-sharing support). The bank-facing service desk and BPO are handled with subsidiaries: <strong>Serviscope<\u002Fstrong> (BPO), <strong>Ratiodata<\u002Fstrong> (field services for the ~30,000+ ATM/self-service-device estate). Contact-centre technology is <strong>Genesys Cloud CX<\u002Fstrong>, with AI-assisted services under development (BankingWorkspace AI-assisted-services roles). Support functions as (a) a <strong>cost centre<\u002Fstrong>, (b) a <strong>trust mechanism<\u002Fstrong> (visible at every outage), (c) a <strong>regulatory function<\u002Fstrong> (complaint handling, fraud-flag review), and (d) a <strong>product-quality feedback loop<\u002Fstrong> into the tribes.<\u002Fp><h2 id=\"s-iii-18\" class=\"hd hd2\"><span class=\"hn mono\">III.18<\u002Fspan><span class=\"ht\">Operating Leverage<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Process<\u002Fsc-raw-th><sc-raw-th>Leverage class<\u002Fsc-raw-th><sc-raw-th>Rationale<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Core banking dev<\u002Fsc-raw-td><sc-raw-td>Sublinear/step-fixed<\u002Fsc-raw-td><sc-raw-td>Build once, serve 700; COBOL estate needs continuous investment<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Platform/omnichannel<\u002Fsc-raw-td><sc-raw-td>Sublinear<\u002Fsc-raw-td><sc-raw-td>One platform, ~300 processes, all tenants<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DC ops<\u002Fsc-raw-td><sc-raw-td>Step-fixed<\u002Fsc-raw-td><sc-raw-td>Capacity added in mainframe increments<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Release mgmt<\u002Fsc-raw-td><sc-raw-td>Sublinear but complex<\u002Fsc-raw-td><sc-raw-td>One build, per-tenant piloting adds coordination cost<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Service desk<\u002Fsc-raw-td><sc-raw-td>~Linear<\u002Fsc-raw-td><sc-raw-td>Scales with end-customers/incidents<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Compliance/regulatory build<\u002Fsc-raw-td><sc-raw-td>Strongly sublinear<\u002Fsc-raw-td><sc-raw-td>One regulation implemented once for all 700 — best leverage point<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Payment ops<\u002Fsc-raw-td><sc-raw-td>Sublinear, improving w/ in-house cards 2027<\u002Fsc-raw-td><sc-raw-td>Removes DZ/VR Payment double structures<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Bank-merger migrations (~40–45/yr)<\u002Fsc-raw-td><sc-raw-td>Repeatable but labour-intensive<\u002Fsc-raw-td><sc-raw-td>Productised but human-heavy<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Subsidiaries (field)<\u002Fsc-raw-td><sc-raw-td>Linear/labour-bound<\u002Fsc-raw-td><sc-raw-td>Physical device servicing<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Verdict:<\u002Fstrong> a 700-bank multi-tenant platform DOES produce genuine operating leverage — most powerfully in <strong>regulatory implementation at scale<\u002Fstrong> and platform development (build once, deploy to all). This is visible in the improving margin: Betriebsergebnis rose to <strong>€66.6m for 2024<\u002Fstrong> (per IT-Finanzmagazin, driven by \"eigenen Einsparungen sowie dem Betriebsstart neuer Kunden\") and to <strong>€89m (4.7% margin) in GB2025<\u002Fstrong> against the <strong>4% Zielrendite<\u002Fstrong>. But <strong>per-tenant complexity absorbs part of the leverage<\u002Fstrong>: coexistence (maintaining CRM and BankingWorkspace twice), 40–45 merger migrations/year, and per-bank piloting are diseconomies. Margin expansion is coming from usage-based pricing plus the internal efficiency programme, not from raw platform scale alone.<\u002Fp><h2 id=\"s-iii-19\" class=\"hd hd2\"><span class=\"hn mono\">III.19<\u002Fspan><span class=\"ht\">Technology and Operations as Competitive Advantage (with Finanz Informatik comparison)<\u002Fspan><\u002Fh2><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Advantage<\u002Fsc-raw-th><sc-raw-th>Proprietary?<\u002Fsc-raw-th><sc-raw-th>Hard to reproduce?<\u002Fsc-raw-th><sc-raw-th>Cuts cost?<\u002Fsc-raw-th><sc-raw-th>Regulatory control?<\u002Fsc-raw-th><sc-raw-th>Compounds w/ volume?<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>agree21 core (IMS/COBOL+Java)<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Very<\u002Fsc-raw-td><sc-raw-td>Yes (shared)<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Multi-tenant platform<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Very<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Mainframe scale/reliability<\u002Fsc-raw-td><sc-raw-td>No (IBM)<\u002Fsc-raw-td><sc-raw-td>Moderate (capital)<\u002Fsc-raw-td><sc-raw-td>Partly<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Migration capability<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Yes (process)<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Regulatory implementation at scale<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Data/fraud position<\u002Fsc-raw-td><sc-raw-td>Partly<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td><strong>Yes<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>AI (plainGPT/genoGPT)<\u002Fsc-raw-td><sc-raw-td>Wrapper only<\u002Fsc-raw-td><sc-raw-td>Low (OpenAI-based)<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes (compliance wrapper)<\u002Fsc-raw-td><sc-raw-td>Partly<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>ATM/SB field operation<\u002Fsc-raw-td><sc-raw-td>Yes (Ratiodata)<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>No (labour)<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>No<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>The migration capability is the underrated asset.<\u002Fstrong> Atruvia has migrated dozens of banks (the \"Mondlandung\" bank21→agree21 consolidation; ~40–45 mergers/year; the Sparda-Banken onboarding from Sopra Steria; the imminent VR Payment card integration) — a <strong>repeatable, industrialised migration machine<\u002Fstrong>, genuinely hard to reproduce and directly relevant to winning new tenants.<\u002Fp><p><strong>Finanz Informatik comparison (subagent-confirmed, enricher-upgraded).<\u002Fstrong> FI is the structural twin — \"Was hier der DSGV ist, ist dort der BVR … was hier die Finanz Informatik ist, ist dort die Atruvia\" (Finanz-Szene). FI 2024: <strong>~€2.6bn revenue<\u002Fstrong> — IT-Finanzmagazin: \"Der konsolidierte Umsatz stieg 2024 auf rund 2,6 Milliarden Euro – ein Plus von rund 140 Millionen Euro gegenüber dem Vorjahr\" (vs Atruvia ~€2.2–2.5bn); <strong>more than 5,000 employees at end-2024<\u002Fstrong>; ~350 Sparkassen plus Landesbanken/Landesbausparkassen; <strong>~114 million accounts<\u002Fstrong>; and <strong>over 205 billion technical transactions per year<\u002Fstrong> (FI/Nutanix press release, end-2024: \"Die Finanz Informatik übernimmt den Service für rund 114 Millionen Bankkonten; auf den Rechnern und Systemen werden jährlich über 205 Milliarden technische Transaktionen durchgeführt\" — the older career-site figure was ~172bn). Its <strong>34.3m online-banking contracts<\u002Fstrong> and <strong>17.9m active App Sparkasse users<\u002Fstrong> dwarf per-institution digital reach. Core system <strong>OSPlus<\u002Fstrong> is likewise <strong>IBM-mainframe-based<\u002Fstrong> (FI–IBM six-year deal, June 2020) with an IBM/Red Hat hybrid cloud; €328m was invested in OSPlus in 2024. <strong>Neither FI nor Atruvia was designated a DORA CTPP<\u002Fstrong> — confirming the perimeter gap is sector-wide. Strategic read: near-mirror captive monopolies; FI is materially larger and reports a higher transaction count (consistent with its larger account base), but both face the identical structural challenge — an IBM-mainframe core that must be modernised in place. In payments, FI's ecosystem carries extra card muscle (S-Payment; the 2024 Bayern Card-Services/Pluscard merger into \"Qards\") that the cooperative side is only now assembling via the VR Payment/Atruvia consolidation.<\u002Fp><h2 id=\"s-iii-20\" class=\"hd hd2\"><span class=\"hn mono\">III.20<\u002Fspan><span class=\"ht\">Volume III Reconstruction (condensed)<\u002Fspan><\u002Fh2><p><strong>(1) Operating model:<\u002Fstrong> Owners (VR banks via VR-FGI Beteiligungsholding) → BVR/BSP-SPP governance → 5-member Vorstand → Geschäfts-/Servicefelder → Tribes (tandem Tribe+People Lead) → Squads → Chapters/Guilds; subsidiaries (Ratiodata, parcIT, Peras, Serviscope, RaRo…). <strong>(2) Banking workflow:<\u002Fstrong> channels → proprietary API layer → ~1,200 Java microservices (OpenShift) → IMS TM on IBM Z → COBOL+Java business logic → Db2 z/OS; nightly batch; technischer Jahresabschluss (change-frozen); failures → Krisenstab. <strong>(3) Compute map:<\u002Fstrong> 4 DCs {KA×2, MS×2}, twin-site active-active + cross-metro DR (~350 km, async inferred); 8×z15 hosting 12 IMS systems (→z17); 80bn tx/yr, 12k tps, ~400m Java tx/day; Turbonomic+Apptio+Tailored Fit Pricing. <strong>(4) Tech stack (layered):<\u002Fstrong> Client (VR Banking App | OnlineBanking | BankingWorkspace-Angular/PWA | agree21BAP legacy | FinTS/HBCI) → Platform (Omnikanalplattform ~300 processes | agree21ECON/ADONIS | Genesys CX) → API/Integration (proprietary API layer | ~1,200 microservices on OpenShift | IBM MQ z/OS | z/OS Connect? <span class=\"ev\">UNKNOWN<\u002Fspan>) → Core (IMS TM/DB + Db2 z/OS on IBM Z; COBOL+Java via Semeru 11 common runtime, 31-bit↔64-bit) → Cross-cutting (pervasive + quantum-safe crypto; HashiCorp Vault; Turbonomic/Apptio; GitLab/Jenkins CI/CD). <strong>(5) Payment-state:<\u002Fstrong> initiation → validation → agree21 posting (IMS) → rail selection (SEPA/SCT Inst/card) → DZ clearing → reconciliation; idempotency weak under load; from 2027 in-house integrated card platform. <strong>(6) Ledger:<\u002Fstrong> Db2/IMS; tenant-separation mechanism <span class=\"ev\">UNKNOWN<\u002Fspan> (blast radius implies shared subsystems + tenant keys); double-entry/reversal/merger internals <span class=\"ev\">UNKNOWN<\u002Fspan>. <strong>(7) Reconciliation:<\u002Fstrong> largely <span class=\"ev\">UNKNOWN<\u002Fspan>; spans core↔rails↔card schemes↔DZ↔bank reporting; breaks → member-bank §25b liability. <strong>(8) Data governance:<\u002Fstrong> bank=controller, Atruvia=processor under AVV; no cross-tenant personal-data flywheel; legitimate loops = network fraud modelling + Smart Data. <strong>(9) Fraud workflow:<\u002Fstrong> real-time ML → 0.2–0.3% flagged → auto-hold → human bank review (~20% false positive) → bank decides + files FIU Verdachtsmeldung; ~80% of unauthorised transactions prevented. <strong>(10) Security/reliability:<\u002Fstrong> 4 Hochsicherheits-DCs; pervasive + quantum-safe crypto; Vault; audIT-remediated Berechtigungsmanagement (2018–~2023); DDoS-mitigated edge; Krisenstab; SLOs/RTO/RPO <span class=\"ev\">UNKNOWN<\u002Fspan>. <strong>(11) Incidents:<\u002Fstrong> see <a class=\"xr\" href=\"#s-iii-12\">III.12<\u002Fa> table. <strong>(12) Org map:<\u002Fstrong> see (1)/<a class=\"xr\" href=\"#s-iii-1\">III.1<\u002Fa>. <strong>(13) Decision rights:<\u002Fstrong> roadmap→owners/BVR; product/budget→Tribe Lead; people/hiring→People Lead; risk/compliance veto→Wiegelmann + Data/Security/Identity GF; escalation→Krisenstab→Vorstand. <strong>(14) Build/buy/nearshore:<\u002Fstrong> see <a class=\"xr\" href=\"#s-iii-5\">III.5<\u002Fa>. <strong>(15) Employee map:<\u002Fstrong> ~10,076 group (2024); KA/MS core; RO nearshore (~700 specialists at Accesa/RaRo); Java/Angular hiring replacing COBOL recruitment; €65k–€102k bands. <strong>(16) Operating leverage:<\u002Fstrong> see <a class=\"xr\" href=\"#s-iii-18\">III.18<\u002Fa>. <strong>(17) Bottlenecks:<\u002Fstrong> primary = shared central processing path (reliability blast radius) + COBOL-estate change velocity; secondary = coexistence double-maintenance (BankingWorkspace vs agree21BAP) + per-tenant piloting. <strong>(18) Moat:<\u002Fstrong> strongest/most durable = captive ownership (structural), regulatory-implementation-at-scale, industrialised migration machine; weakest/most rented = AI (OpenAI wrapper) and mainframe hardware (IBM). <strong>(19) Key unknowns:<\u002Fstrong> agree21 tenant-separation model; ledger/reconciliation internals; SLOs/RTO/RPO; z16 interim; ISO 27001/ISAE 3402/KRITIS scopes; batch-window duration; VR Banking App framework; internal compute cost allocation; mainframe-training pipeline; DDoS mitigation specifics.<\u002Fp><p><strong>(20) Ten Most Important Conclusions.<\u002Fstrong><\u002Fp><ol class=\"lst\"><li>The core is an in-place-refactored IBM Z/IMS/Db2/COBOL estate wrapped in Java + ~1,200 microservices; the Nov 2025 z17 deal re-commits to this architecture for years.<\u002Fli><li>Modernisation = selective refactoring (Java-in-IMS), explicitly a COBOL-retirement skills hedge — NOT core replacement.<\u002Fli><li>Four twin-site data centres give geographic redundancy but not protection against logical faults replicated across sites — the recurring failure mode.<\u002Fli><li>The blast radius (~490–520 banks per central fault) is the defining operational risk; incident response has matured (2026) but the architectural concentration has not been eliminated.<\u002Fli><li>Atruvia is a national single point of failure yet sits outside direct DORA oversight while IBM is inside — a real supervision-perimeter gap (shared with Finanz Informatik).<\u002Fli><li>As GDPR processor, Atruvia has no lawful cross-tenant personal-data flywheel; its real data edge is network-scale fraud modelling (~80% of unauthorised transactions prevented) and productised analytics.<\u002Fli><li>The fraud/AML division of labour is clean: Atruvia builds systems, banks own the regulatory decisions and losses.<\u002Fli><li>The strongest moats are structural (captive ownership) and organisational (migration + regulatory-at-scale), not raw technology.<\u002Fli><li>Operating leverage is real (margin to 4.7% &gt; 4% target) but partly absorbed by coexistence double-maintenance and per-tenant piloting.<\u002Fli><li>Finanz Informatik is a near-mirror (IBM mainframe, ~€2.6bn revenue, &gt;205bn technical transactions, ~114m accounts, not a CTPP) — confirming the cooperative/savings-bank IT duopoly faces an identical in-place-modernisation problem.<\u002Fli><\u002Fol><p><strong>Closing answers.<\u002Fstrong> <em>Most critical operating subsystem:<\u002Fem> the agree21 IMS/Db2 core on IBM Z and its shared central processing path. <em>Hardest to replicate:<\u002Fem> the multi-tenant core plus the industrialised migration machine. <em>Scales most efficiently:<\u002Fem> regulatory implementation and platform development (build once, deploy to 700); <em>requires headcount to keep growing:<\u002Fem> service desk, ATM field services, and per-tenant migrations. <em>Most dependent on third-party tech:<\u002Fem> IBM (Z hardware, z/OS, IMS, Db2, MQ, Turbonomic, Apptio) — a deliberately deepened dependency. <em>Nature of advantage:<\u002Fem> primarily <strong>structural (captive ownership) and organisational<\u002Fstrong>, secondarily regulatory; technology is an enabler, not the moat. <em><strong>Central question — can a COBOL/IMS core serving 700 banks be modernised fast enough to stay competitive?<\u002Fstrong><\u002Fem> Evidence FOR: the Java-in-IMS common runtime (85% Java-enabled), OpenShift hybrid cloud, ~1,200 microservices, Angular front-ends and a working AI pipeline show real, low-risk incremental modernisation, funded by an improving margin. Evidence AGAINST: coexistence drag (\"etwas zäh\"), recurring central outages, a COBOL retirement wave, and an owner-set roadmap that limits autonomy. <strong>Verdict:<\u002Fstrong> Atruvia can modernise fast enough to remain competitive <strong>within its captive market<\u002Fstrong> — its owners are locked in and its only true rival (Finanz Informatik) faces the same constraints — but the in-place-refactor path structurally cannot match a cloud-native challenger's velocity. Its competitiveness is protected by structure, not by technological superiority.<\u002Fp><h2 id=\"s-recommendations-2\" class=\"hd hd2\"><span class=\"ht\">Recommendations<\u002Fspan><\u002Fh2><ol class=\"lst\"><li><strong>For member banks / BVR:<\u002Fstrong> press Atruvia to publish availability SLOs, RTO/RPO and a blast-radius-reduction roadmap (tenant isolation / cellular architecture). Benchmark: if central-fault incidents affecting &gt;300 banks recur more than once per 18 months, escalate to a mandated architectural review. The July 2026 incident should trigger this now.<\u002Fli><li><strong>For BaFin / national policy:<\u002Fstrong> treat the DORA CTPP omission of Atruvia (and Finanz Informatik) as a gap to close — via intensified §44/§25b indirect oversight or a national systemic-provider designation; the concentration and substitutability criteria are met domestically even though cross-border footprint is not.<\u002Fli><li><strong>For Atruvia strategy:<\u002Fstrong> prioritise ending the BankingWorkspace/agree21BAP coexistence (the largest self-inflicted diseconomy) and formalise a mainframe-skills pipeline (apprenticeship/dual-study) to de-risk the COBOL retirement wave beyond the Java-in-IMS hedge.<\u002Fli><li><strong>On AI:<\u002Fstrong> given plainGPT's OpenAI dependency, evaluate a self-hosted open-weight fallback to satisfy the \"no open-internet\" governance claim at the model layer, not just the wrapper.<\u002Fli><li><strong>Change trigger:<\u002Fstrong> if the VR Payment card-platform integration (1 January 2027) slips or causes incidents, re-rate the migration-capability moat downward.<\u002Fli><\u002Fol><h2 id=\"s-caveats-2\" class=\"hd hd2\"><span class=\"ht\">Caveats<\u002Fspan><\u002Fh2><ul class=\"lst\"><li>Several internal mechanisms (ledger model, tenant separation, reconciliation, SLOs, batch-window duration, certification scopes, the z16 interim) are <strong>not published by Atruvia and are labelled <span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>; this volume deliberately does not invent them.<\u002Fli><li>The richest technical source (IBM case study) is dated May 2022 and describes the z15 estate; the z17 figures come from the November 2025 deal announcement, so some capacity/machine-count figures may have moved.<\u002Fli><li>Transaction counts vary by source and year (IBM has cited 80/87/100/120bn for Atruvia); the ~80bn / 12k-tps figures are the 2022 case-study baseline.<\u002Fli><li>Incident details rely partly on trade press and knowledgeable third-party blogs; where so, this is flagged.<\u002Fli><li>Finanz Informatik comparison figures carry source spreads reconciled to the most recent official FI/Nutanix press release (end-2024): ~114m accounts and &gt;205bn technical transactions supersede older career-site figures (~111–113m / ~172bn); employees \"more than 5,000\" (FI legal entity) vs ~6,500 on a broader group basis.<\u002Fli><\u002Ful><div class=\"sep\"><\u002Fdiv><\u002Fsection><section class=\"sec\" data-part=\"4\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part IV<\u002Fspan><a href=\"#contents\">Volume IV &nbsp;·&nbsp; Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">IV<\u002Fspan><\u002Fdiv><h1 id=\"part-iv-part-iv-financial-statements-revenue-architecture-unit-economics-capital\" class=\"part\" data-short=\"Part IV — Financial Statements, Revenue Architecture, Unit Economics &amp; Capital\">Financial Statements, Revenue Architecture, Unit Economics &amp; Capital<\u002Fh1><p class=\"opener-s\">How a cooperative with no equity market funds a permanent investment race.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">IV<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">29<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Perimeters<\u002Fdiv><div class=\"plate-v\">AG &amp; Group, HGB<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-financial-statements-revenue-architecture-unit-economics-capital\"><span class=\"inpart-n\"><\u002Fspan><span>Financial Statements, Revenue Architecture, Unit Economics &amp; Capital<\u002Fspan><\u002Fa><a href=\"#s-tl-dr-the-core-answer\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR (the core answer)<\u002Fspan><\u002Fa><a href=\"#s-key-findings-3\"><span class=\"inpart-n\"><\u002Fspan><span>KEY FINDINGS<\u002Fspan><\u002Fa><a href=\"#s-details-3\"><span class=\"inpart-n\"><\u002Fspan><span>DETAILS<\u002Fspan><\u002Fa><a href=\"#s-iv-1\"><span class=\"inpart-n\">IV.1<\u002Fspan><span>Multi-Year Financial History<\u002Fspan><\u002Fa><a href=\"#s-iv-2\"><span class=\"inpart-n\">IV.2<\u002Fspan><span>Revenue Taxonomy<\u002Fspan><\u002Fa><a href=\"#s-iv-3\"><span class=\"inpart-n\">IV.3<\u002Fspan><span>Revenue Flow by Product (representative traces)<\u002Fspan><\u002Fa><a href=\"#s-iv-4\"><span class=\"inpart-n\">IV.4<\u002Fspan><span>THE UMLAGE ECONOMICS AND THE 4% ZIELRENDITE <em>(priority depth)<\u002Fem><\u002Fspan><\u002Fa><a href=\"#s-iv-5\"><span class=\"inpart-n\">IV.5<\u002Fspan><span>Cost Architecture (AG, FY2025)<\u002Fspan><\u002Fa><a href=\"#s-iv-6\"><span class=\"inpart-n\">IV.6<\u002Fspan><span>Cost per Unit (AG basis; show arithmetic)<\u002Fspan><\u002Fa><a href=\"#s-iv-7\"><span class=\"inpart-n\">IV.7<\u002Fspan><span>Unit Economics<\u002Fspan><\u002Fa><a href=\"#s-iv-8\"><span class=\"inpart-n\">IV.8<\u002Fspan><span>Segment and Entity Economics <em>(replaces cohort analysis)<\u002Fem><\u002Fspan><\u002Fa><a href=\"#s-iv-9\"><span class=\"inpart-n\">IV.9<\u002Fspan><span>Income Statement Teardown (AG, HGB)<\u002Fspan><\u002Fa><a href=\"#s-iv-10\"><span class=\"inpart-n\">IV.10<\u002Fspan><span>Balance Sheet Teardown (AG, 31.12.2025)<\u002Fspan><\u002Fa><a href=\"#s-iv-11\"><span class=\"inpart-n\">IV.11<\u002Fspan><span>CAPITAL STRUCTURE AND THE COOPERATIVE FINANCING PROBLEM <em>(priority depth)<\u002Fem><\u002Fspan><\u002Fa><a href=\"#s-iv-12\"><span class=\"inpart-n\">IV.12<\u002Fspan><span>The Investment-Funding Mechanism <em>(replaces interest income)<\u002Fem><\u002Fspan><\u002Fa><a href=\"#s-iv-13\"><span class=\"inpart-n\">IV.13<\u002Fspan><span>Cash Flow (AG)<\u002Fspan><\u002Fa><a href=\"#s-iv-14\"><span class=\"inpart-n\">IV.14<\u002Fspan><span>Capital Intensity<\u002Fspan><\u002Fa><a href=\"#s-iv-15\"><span class=\"inpart-n\">IV.15<\u002Fspan><span>Capital Allocation<\u002Fspan><\u002Fa><a href=\"#s-iv-16\"><span class=\"inpart-n\">IV.16<\u002Fspan><span>Revenue and Cost Waterfalls<\u002Fspan><\u002Fa><a href=\"#s-iv-17\"><span class=\"inpart-n\">IV.17<\u002Fspan><span>Economic Driver Tree<\u002Fspan><\u002Fa><a href=\"#s-iv-18\"><span class=\"inpart-n\">IV.18<\u002Fspan><span>Scenario Model (assumptions explicit; directional)<\u002Fspan><\u002Fa><a href=\"#s-iv-19\"><span class=\"inpart-n\">IV.19<\u002Fspan><span>Sensitivity Analysis (most-sensitive variables first)<\u002Fspan><\u002Fa><a href=\"#s-iv-20\"><span class=\"inpart-n\">IV.20<\u002Fspan><span>Revenue Quality Scorecard<\u002Fspan><\u002Fa><a href=\"#s-iv-21\"><span class=\"inpart-n\">IV.21<\u002Fspan><span>Profitability Decomposition<\u002Fspan><\u002Fa><a href=\"#s-iv-22\"><span class=\"inpart-n\">IV.22<\u002Fspan><span>Economic Value &amp; Owner Returns — Finanz Informatik Benchmark<\u002Fspan><\u002Fa><a href=\"#s-iv-23\"><span class=\"inpart-n\">IV.23<\u002Fspan><span>Volume IV Reconstruction — Key Unknowns &amp; Ten Conclusions<\u002Fspan><\u002Fa><a href=\"#s-recommendations-staged-with-thresholds\"><span class=\"inpart-n\"><\u002Fspan><span>RECOMMENDATIONS (staged, with thresholds)<\u002Fspan><\u002Fa><a href=\"#s-caveats-3\"><span class=\"inpart-n\"><\u002Fspan><span>CAVEATS<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">€89.0m<\u002Fdiv><div class=\"stat-l\">Betriebsergebnis, AG 2025 — 4.6% margin<\u002Fdiv><\u002Fdiv><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">~€90m<\u002Fdiv><div class=\"stat-l\">Digitalisierungsumlage, 2025<\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 id=\"s-financial-statements-revenue-architecture-unit-economics-capital\" class=\"hd hd2\"><span class=\"ht\">Financial Statements, Revenue Architecture, Unit Economics &amp; Capital<\u002Fspan><\u002Fh2><p><em>Reporting perimeters: \"AG\" = Atruvia AG parent/Einzelabschluss (HGB); \"Group\" = Atruvia Konzernabschluss (HGB). All figures labelled. German HGB conventions apply (Gesamtleistung, Betriebsergebnis, Materialaufwand incl. bezogene Leistungen). Evidence labels: <span class=\"ev\">CONFIRMED FACT<\u002Fspan> / <span class=\"ev\">COMPANY CLAIM<\u002Fspan> / <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan> / <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> / <span class=\"ev\">HYPOTHESIS<\u002Fspan> / <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fem><\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-tl-dr-the-core-answer\" class=\"hd hd2\"><span class=\"ht\">TL;DR (the core answer)<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Atruvia's real economic engine is a captive, owner-financed core-banking utility whose entire reported operating profit is, to the euro, roughly equal to the digitalisation levy its owner-customers pay.<\u002Fstrong> In FY2025 (AG) the Betriebsergebnis was €89.0m on Gesamtleistung of €1,921.0m (4.63% margin) — and the Digitalisierungsumlage/Zukunftsbanking levy earmarked for that year was ~€90m. Strip the levy and underlying operating profit is approximately zero (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>). The \"4% Zielrendite\" is therefore best read as a <strong>governance device to legitimise retained earnings for investment<\u002Fstrong>, not a genuine commercial margin.<\u002Fli><li><strong>The permanent platform-investment race is funded from four sources in a deliberate sequence: retained earnings (now dressed as the 4% target), earmarked levies (IT-Sonderumlage 2018–2023, then the Digitalisierungsumlage €30m→€60m→€90m), DZ Bank contributions and lending, and — increasingly — supplier/bank financing.<\u002Fstrong> Capex rose from €182.9m (AG, 2023) to €359.1m (AG, 2025), an 18.7% Investitionsquote. The model is sustainable at current ~€350m/yr intensity but would break against the circulating €450m–€1bn sector-investment scenario without a fresh levy or DZ Bank equity/loan injection.<\u002Fli><li><strong>The cooperative model does deliver captive-priced IT with near-perfect revenue retention but near-zero pricing power, and it is measurably less capital- and cost-efficient than its Sparkassen twin, Finanz Informatik.<\u002Fstrong> FI turned ~€2.6bn revenue in 2024 with 5,037 employees (Vollzeitäquivalente per FI's Jahresbericht 2024) — ~€516k revenue/employee — and services 114m accounts; Atruvia Group turned ~€2.2bn with 10,076 employees (~€218k/employee) and 91m accounts (Lünendonk-Ranking 2025). Atruvia's headline group figure is dragged down by hardware/field-service (Ratiodata) and BPO (Serviscope) subsidiaries; even AG-only revenue/employee (~€324k) trails FI.<\u002Fli><\u002Ful><div class=\"sep\"><\u002Fdiv><h2 id=\"s-key-findings-3\" class=\"hd hd2\"><span class=\"ht\">KEY FINDINGS<\u002Fspan><\u002Fh2><ol class=\"lst\"><li>**The profit <em>is<\u002Fem> the levy.** FY2025 AG Betriebsergebnis €89.0m ≈ FY2025 Digitalisierungsumlage ~€90m. FY2024: €66.6m result vs €60m levy. FY2023: €40.6m vs €30m levy. The margin trajectory tracks the levy schedule almost mechanically (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> from CONFIRMED figures).<\u002Fli><li><strong>Bought-in services, not personnel, are now the largest cost.<\u002Fstrong> In FY2025 AG, Materialaufwand/bezogene Leistungen was ~€792.1m (41.2% of Gesamtleistung) versus Personalaufwand €654.1m (34.1%). Atruvia is more a <em>systems integrator riding IBM and nearshore capacity<\u002Fem> than a pure in-house software house (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>).<\u002Fli><li><strong>Revenue nearly doubled at AG level in four years without a genuine margin<\u002Fstrong> — Gesamtleistung ~€1,382m (2022) → €1,921m (2025), +39%, driven by new external customers (Sparda group, UmweltBank, Bank für Sozialwirtschaft, National-Bank) and levies, not by pricing power over owners. Per IT-Finanzmagazin's HV coverage, the FY2025 revenue rise of 11.5% to \"knapp 1,9 Milliarden Euro\" was \"hauptsächlich durch neue Kunden.\"<\u002Fli><li><strong>The 2025 \"4.7% margin\" looks like a peak, not a plateau.<\u002Fstrong> Management's own FY2026 guidance implies EBIT €77.9m on Gesamtleistung €1,974.6m ≈ 3.9% — i.e. the margin is guided <em>down<\u002Fem> even as revenue rises, undercutting the idea that 4% is now structural (<span class=\"ev\">CONFIRMED FACT<\u002Fspan> + <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>).<\u002Fli><li><strong>Capital structure is equity-heavy but access-constrained.<\u002Fstrong> Equity €557.0m, EK-quote 38.2% (2025). No Kapitalerhöhung since the 2015 merger; Grundkapital fixed at €115.8m. Debt is a DZ Bank Campus-Karlsruhe loan plus a largely-undrawn credit line; the FY2025 mainframe purchase was funded partly through a ~€145m jump in trade payables (supplier financing) (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>).<\u002Fli><li><strong>DZ Bank is a funder, not an owner.<\u002Fstrong> It holds only ~0.35% of shares directly but contributed €180m to the 2018–2023 IT-Sonderumlage, lends against the Karlsruhe campus, and co-finances the VR Payment card reorganisation. The \"DZ Bank ~20% of Atruvia\" claim remains erroneous (it refers to Verimi/amberra) (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>).<\u002Fli><li><strong>The VR Payment issuing-processing acquisition (effective 1 Jan 2027) has no discoverable purchase price<\u002Fstrong> (<span class=\"ev\">UNKNOWN<\u002Fspan>); it was announced by Atruvia press release dated 2 July 2026 and filed with the Bundeskartellamt on 15 July 2026 (case B9-75/26, per the Bundeskartellamt Fusionskontrolle listing).<\u002Fli><li><strong>Subsidiary economics are structurally different from the captive core<\u002Fstrong> — Ratiodata (hardware/field service, ~€344.5m, thin margin), Serviscope (BPO), parcIT/FORUM/ECON (software, higher margin), TRUUCO (loss-making smart-data venture, −€7.98m). The captive core cross-subsidises loss-makers like TRUUCO via capital injections (<span class=\"ev\">CONFIRMED FACT<\u002Fspan>).<\u002Fli><\u002Fol><div class=\"sep\"><\u002Fdiv><h2 id=\"s-details-3\" class=\"hd hd2\"><span class=\"ht\">DETAILS<\u002Fspan><\u002Fh2><h2 id=\"s-iv-1\" class=\"hd hd2\"><span class=\"hn mono\">IV.1<\u002Fspan><span class=\"ht\">Multi-Year Financial History<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-16\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 16<\u002Fspan><span class=\"fig-t\">Revenue Rises, Margin Peaks<\u002Fspan><\u002Fdiv><div class=\"fig-b\"><div class=\"chart\" style=\"height:290px\"><div class=\"ax-y\"><span>€2,000m<\u002Fspan><span>€1,500m<\u002Fspan><span>€1,000m<\u002Fspan><span>€500m<\u002Fspan><span>0<\u002Fspan><\u002Fdiv><div class=\"plot\"><div class=\"gl\" style=\"bottom:100%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:75%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:50%\"><\u002Fdiv><div class=\"gl\" style=\"bottom:25%\"><\u002Fdiv><div class=\"grp\"><div class=\"pair\"><div class=\"cb\" style=\"height:75.8%\"><span class=\"cbv mono\">1,516<\u002Fspan><\u002Fdiv><div class=\"cb acc\" style=\"height:40.6%\"><span class=\"cbv mono\">40.6<\u002Fspan><\u002Fdiv><\u002Fdiv><div class=\"grp-l mono\">2023<\u002Fdiv><\u002Fdiv><div class=\"grp\"><div class=\"pair\"><div class=\"cb\" style=\"height:86.0%\"><span class=\"cbv mono d><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>17.2%<\u002Fsc-raw-td><sc-raw-td>12.1%<\u002Fsc-raw-td><sc-raw-td>12.1%<\u002Fsc-raw-td><sc-raw-td>18.7%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Operating cash flow<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>~230<\u002Fsc-raw-td><sc-raw-td>301.1<\u002Fsc-raw-td><sc-raw-td>397.2<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Employees (year-end)<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>n/d<\u002Fsc-raw-td><sc-raw-td>5,263<\u002Fsc-raw-td><sc-raw-td>5,483<\u002Fsc-raw-td><sc-raw-td>5,847<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p>\\* <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: 2023 Gesamtleistung €1,516.3m was +9.7% YoY, implying 2022 ≈ €1,382m. †2021 Umsatzerlöse fell €57.5m YoY per GB2021 (2021 Betriebsergebnis €18.4m; 2022 fell to €11.4m). ‡2021 split (Bankverfahren €863.1m, Infrastruktur €227.9m, weitere GenoFG incl. Zentralbank €167.9m) uses the <em>pre-2023<\u002Fem> taxonomy; the 2023 report re-cut the categories, so pre-2023 and post-2023 splits are <strong>not continuous<\u002Fstrong> (accounting-presentation change, not economic change). n/d = not disclosed in accessible sources.<\u002Fp><p><strong>Table 2 — Atruvia GROUP (Konzern), €bn / count. Source: Atruvia press/HV releases, Finanz-Szene, Lünendonk (mix of <span class=\"ev\">CONFIRMED FACT<\u002Fspan> and <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan>).<\u002Fstrong><\u002Fp><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Group<\u002Fsc-raw-th><sc-raw-th>2022<\u002Fsc-raw-th><sc-raw-th>2023<\u002Fsc-raw-th><sc-raw-th>2024<\u002Fsc-raw-th><sc-raw-th>2025<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Revenue<\u002Fsc-raw-td><sc-raw-td>~1.82<\u002Fsc-raw-td><sc-raw-td>~2.001<\u002Fsc-raw-td><sc-raw-td>~2.2<\u002Fsc-raw-td><sc-raw-td>~2.5<\u0
