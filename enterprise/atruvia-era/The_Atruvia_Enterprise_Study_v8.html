document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 font-weight: 600;\n  font-display: swap;\n  src: url(\"3373df22-cbe5-4fb0-a59b-bdf1c4f0f0d9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme,    ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); \" href=\"#s-pricing-and-charging\"><span class=\"tc-k mono\"><\u002Fspan><span>Pricing and charging<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-corporate-and-governance\"><span class=\"tc-k mono\"><\u002Fspan><span>Corporate and governance<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-sector-and-institutional\"><span class=\"tc-k mono\"><\u002Fspan><span>Sector and institutional<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-technology-and-operations\"><span class=\"tc-k mono\"><\u002Fspan><span>Technology and operations<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-regulatory\"><span class=\"tc-k mono\"><\u002Fspan><span>Regulatory<\u002Fspan><\u002Fa><\u002Fdiv><div class=\"tc-p\"><a class=\"tc-1\" href=\"#app-b-appendix-b-canonical-figures-register\"><span class=\"tc-r mono\">B<\u002Fspan><span>Appendix B — Canonical Figures Register<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-scale\"><span class=\"tc-k mono\"><\u002Fspan><span>Scale<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-financials\"><span class=\"tc-k mono\"><\u002Fspan><span>Financials<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-ownership-and-structure\"><span class=\"tc-k mono\"><\u002Fspan><span>Ownership and structure<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-technology-and-regulatory\"><span class=\"tc-k mono\"><\u002Fspan><span>Technology and regulatory<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-benchmark-finanz-informatik\"><span class=\"tc-k mono\"><\u002Fspan><span>Benchmark — Finanz Informatik<\u002Fspan><\u002Fa><\u002Fdiv><div class=\"tc-p\"><a class=\"tc-1\" href=\"#app-c-appendix-c-reconciliation-of-cross-volume-discrepancies\"><span class=\"tc-r mono\">C<\u002Fspan><span>Appendix C — Reconciliation of Cross-Volume Discrepancies<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-perimeter-and-measurement-differences-not-errors\"><span class=\"tc-k mono\"><\u002Fspan><span>Perimeter and measurement differences (not errors)<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-genuine-errors-and-corrections\"><span class=\"tc-k mono\"><\u002Fspan><span>Genuine errors and corrections<\u002Fspan><\u002Fa><a class=\"tc-2\" href=\"#s-known-unknowns-carried-forward\"><span class=\"tc-k mono\"><\u002Fspan><span>Known unknowns carried forward<\u002Fspan><\u002Fa><\u002Fdiv><div class=\"tc-p\"><a class=\"tc-1\" href=\"#app-d-appendix-d-source-hierarchy-evidence-conventions\"><span class=\"tc-r mono\">D<\u002Fspan><span>Appendix D — Source Hierarchy &amp; Evidence Conventions<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fnav><h2 id=\"s-how-to-read-this-document\" class=\"hd hd2\"><span class=\"ht\">How to read this document<\u002Fspan><\u002Fh2><p>This study takes Atruvia apart component by component across five volumes, then reassembles it. Each volume was researched and written as a standalone study; this master edition binds them into one document with a single set of conventions, a glossary, a canonical figures register, and a synthesis that no individual volume contains.<\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Part<\u002Fsc-raw-th><sc-raw-th>Volume<\u002Fsc-raw-th><sc-raw-th>Question it answers<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Front matter<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Conventions, glossary, canonical figures, how to navigate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Part I<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Corporate, Legal, Regulatory &amp; Institutional Anatomy<\u002Fsc-raw-td><sc-raw-td>Who owns and controls Atruvia; how a customer-owned utility is governed and supervised<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-ii-part-ii-product-customer-service-delivery-architecture\">Part II<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Product, Customer &amp; Service-Delivery Architecture<\u002Fsc-raw-td><sc-raw-td>What Atruvia sells, to whom, and what a member bank actually buys<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-organisational-infrastructure\">Part III<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Operations, Technology, Data &amp; Organisational Infrastructure<\u002Fsc-raw-td><sc-raw-td>How ~10bn bookings a year are processed on a mainframe core for ~700 banks<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-revenue-architecture-unit-economics-capital\">Part IV<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Financial Statements, Revenue Architecture, Unit Economics &amp; Capital<\u002Fsc-raw-td><sc-raw-td>How a cooperative with no equity market funds a permanent investment race<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-strategic-evolution\">Part V<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution<\u002Fsc-raw-td><sc-raw-td>Why Atruvia persists, what is genuinely defensible, and what it becomes<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#part-vi-part-vi-cross-volume-synthesis\">Part VI<\u002Fa><\u002Fsc-raw-td><sc-raw-td><strong>Cross-Volume Synthesis<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>What the five volumes prove together that none proves alone<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#app-a-appendix-a-glossary-of-german-terms\">Appendix A<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Glossary of German Terms<\u002Fsc-raw-td><sc-raw-td>Load-bearing — read before <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-revenue-architecture-unit-economics-capital\">Part IV<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#app-b-appendix-b-canonical-figures-register\">Appendix B<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Canonical Figures Register<\u002Fsc-raw-td><sc-raw-td>The governing value for every material number<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#app-c-appendix-c-reconciliation-of-cross-volume-discrepancies\">Appendix C<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Reconciliation of Cross-Volume Discrepancies<\u002Fsc-raw-td><sc-raw-td>Where the volumes disagree, and which figure governs<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><a class=\"xr\" href=\"#app-d-appendix-d-source-hierarchy-evidence-conventions\">Appendix D<\u002Fa><\u002Fsc-raw-td><sc-raw-td>Source Hierarchy &amp; Evidence Conventions<\u002Fsc-raw-td><sc-raw-td>How claims were graded<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Recommended reading order for a first pass:<\u002Fstrong> <a class=\"xr\" href=\"#app-a-appendix-a-glossary-of-german-terms\">Appendix A<\u002Fa> (glossary) → <a class=\"xr\" href=\"#part-vi-part-vi-cross-volume-synthesis\">Part VI<\u002Fa> (Synthesis) → <a class=\"xr\" href=\"#app-b-appendix-b-canonical-figures-register\">Appendix B<\u002Fa> → then Parts IV and V in full. Parts I, II and III are reference-depth.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-conventions-governing-the-whole-document\" class=\"hd hd2\"><span class=\"ht\">Conventions governing the whole document<\u002Fspan><\u002Fh2><h2 id=\"s-evidence-classification\" class=\"hd hd2\"><span class=\"ht\">Evidence classification<\u002Fspan><\u002Fh2><p>Every material claim carries one of six labels. These are load-bearing, and no inference is silently promoted to fact.<\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Label<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Directly supported by reliable primary evidence<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong><span class=\"ev\">COMPANY CLAIM<\u002Fspan><\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Stated by Atruvia, not independently verified<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong><span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan><\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Externally reported or estimated<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan><\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Reasonably inferred from multiple known facts<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong><span class=\"ev\">HYPOTHESIS<\u002Fspan><\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Possible explanation requiring further evidence<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Available evidence is insufficient<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-the-governing-convention-ag-versus-group-read-this-before-any-figure\" class=\"hd hd2\"><span class=\"ht\">The governing convention — AG versus Group. Read this before any figure.<\u002Fspan><\u002Fh2><p>Atruvia reports on two bases that secondary sources routinely conflate:<\u002Fp><ul class=\"lst\"><li><strong>Atruvia AG<\u002Fstrong> — the parent company, Einzelabschluss under German HGB. This is the entity that owns agree21, operates the data centres, employs the core workforce and contracts with the member banks.<\u002Fli><li><strong>Atruvia Group (Konzern)<\u002Fstrong> — the consolidated group, including Ratiodata SE, parcIT, Peras, Serviscope, BMS Corporate Solutions, GWS, ECON, FORUM, TRUUCO, Accesa/RaRo and Lucke EDV.<\u002Fli><\u002Ful><p>The two differ by roughly €600m of revenue and roughly 4,200 employees. <strong>They are never spliced in this document.<\u002Fstrong> Every figure is labelled AG or Group. This is the Atruvia equivalent of a reporting-basis break, and it is the single most common source of error in third-party commentary on the company.<\u002Fp><h2 id=\"s-accounting-basis\" class=\"hd hd2\"><span class=\"ht\">Accounting basis<\u002Fspan><\u002Fh2><p>Accounts are prepared under <strong>German HGB<\u002Fstrong>, not IFRS. Three consequences matter throughout:<\u002Fp><ol class=\"lst\"><li><strong>Gesamtleistung is not revenue.<\u002Fstrong> It equals Umsatzerlöse plus aktivierte Eigenleistungen plus inventory change. Margins computed on Gesamtleistung differ from margins computed on Umsatzerlöse.<\u002Fli><li><strong>Betriebsergebnis is not EBIT under IFRS.<\u002Fstrong> It is the HGB operating result, and it is sensitive to development-cost capitalisation and pension provisioning.<\u002Fli><li><strong>Provisions and the pension discount rate<\u002Fstrong> move HGB results in ways an IFRS reader will not expect.<\u002Fli><\u002Fol><h2 id=\"s-language\" class=\"hd hd2\"><span class=\"ht\">Language<\u002Fspan><\u002Fh2><p>Primary sources are overwhelmingly German. German terms are retained where translation would lose precision, and are defined in <a class=\"xr\" href=\"#app-a-appendix-a-glossary-of-german-terms\">Appendix A<\u002Fa>. Quotations are given in the original with translation where meaning turns on the wording.<\u002Fp><div class=\"sep\"><\u002Fdiv><div class=\"sep\"><\u002Fdiv><\u002Fsection><section class=\"sec\" data-part=\"1\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part I<\u002Fspan><a href=\"#contents\">Volume I &nbsp;·&nbsp; Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">I<\u002Fspan><\u002Fdiv><h1 id=\"part-i-part-i-corporate-legal-regulatory-institutional-anatomy\" class=\"part\" data-short=\"Part I — Corporate, Legal, Regulatory &amp; Institutional Anatomy\">Corporate, Legal, Regulatory &amp; Institutional Anatomy<\u002Fh1><p class=\"opener-s\">Who owns and controls Atruvia — and how a utility owned by its own customers is governed, contracted and supervised.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">I<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">17<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Registry<\u002Fdiv><div class=\"plate-v\">HRB 102381 Frankfurt<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-tl-dr\"><span class=\"inpart-n\"><\u002Fspan><span>TL;DR<\u002Fspan><\u002Fa><a href=\"#s-key-findings\"><span class=\"inpart-n\"><\u002Fspan><span>Key Findings<\u002Fspan><\u002Fa><a href=\"#s-details\"><span class=\"inpart-n\"><\u002Fspan><span>Details<\u002Fspan><\u002Fa><a href=\"#s-i-1\"><span class=\"inpart-n\">I.1<\u002Fspan><span>Origin and Corporate History<\u002Fspan><\u002Fa><a href=\"#s-i-2\"><span class=\"inpart-n\">I.2<\u002Fspan><span>Corporate Group Structure<\u002Fspan><\u002Fa><a href=\"#s-i-3\"><span class=\"inpart-n\">I.3<\u002Fspan><span>Ownership and Control (GIVEN UNUSUAL WEIGHT)<\u002Fspan><\u002Fa><a href=\"#s-i-4\"><span class=\"inpart-n\">I.4<\u002Fspan><span>Governance Architecture<\u002Fspan><\u002Fa><a href=\"#s-i-5\"><span class=\"inpart-n\">I.5<\u002Fspan><span>Legal Architecture<\u002Fspan><\u002Fa><a href=\"#s-i-6\"><span class=\"inpart-n\">I.6<\u002Fspan><span>Regulatory and Supervisory Architecture<\u002Fspan><\u002Fa><a href=\"#s-i-7\"><span class=\"inpart-n\">I.7<\u002Fspan><span>Own Capability vs Partner Dependency<\u002Fspan><\u002Fa><a href=\"#s-i-8\"><span class=\"inpart-n\">I.8<\u002Fspan><span>Regulation and Structure as Competitive Position<\u002Fspan><\u002Fa><a href=\"#s-i-9\"><span class=\"inpart-n\">I.9<\u002Fspan><span>Institutional Dependency Map<\u002Fspan><\u002Fa><a href=\"#s-i-10\"><span class=\"inpart-n\">I.10<\u002Fspan><span>Tax and Intercompany Architecture<\u002Fspan><\u002Fa><a href=\"#s-i-11\"><span class=\"inpart-n\">I.11<\u002Fspan><span>Corporate and Regulatory Risk<\u002Fspan><\u002Fa><a href=\"#s-i-12\"><span class=\"inpart-n\">I.12<\u002Fspan><span>Volume I Reconstruction (Synthesis)<\u002Fspan><\u002Fa><a href=\"#s-recommendations\"><span class=\"inpart-n\"><\u002Fspan><span>Recommendations<\u002Fspan><\u002Fa><a href=\"#s-caveats\"><span class=\"inpart-n\"><\u002Fspan><span>Caveats<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><p><em>Research date: 8 August 2026. Subject legal entity: Atruvia AG, HRB 102381, Amtsgericht Frankfurt am Main; administrative seats Karlsruhe (Fiduciastraße 20, 76227) and Münster (GAD-Str. 2–6, 48163); further offices Munich, Frankfurt, Berlin. VAT ID DE143582320. Share capital €115.8m. Standing house standard applied throughout; evidence labels used for material claims.<\u002Fem><\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-tl-dr\" class=\"hd hd2\"><span class=\"ht\">TL;DR<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Atruvia is a non-listed, non-bank Aktiengesellschaft that is the captive core-banking IT provider for essentially the entire German cooperative banking sector<\u002Fstrong> — the 646 Volksbanken, Raiffeisenbanken, Sparda-Banken, PSD-Banken and other cooperative banks that existed at year-end 2025 (per BVR), plus numerous private banks and the ADAC — and it is owned ~99.7% by cooperative entities, overwhelmingly (91.6% of share capital) through three regional holding KGs pooled into VR-FGI Beteiligungsholding GmbH &amp; Co. KG. <strong>Actual control sits with the member banks acting collectively through this pooling vehicle, not with any single institution; DZ Bank does NOT own a controlling stake.<\u002Fstrong><\u002Fli><li><strong>The single most important current regulatory fact:<\u002Fstrong> on the European Supervisory Authorities' first CTPP list (published 18 November 2025, 19 providers), <strong>Atruvia was NOT designated a Critical ICT Third-Party Provider under DORA — but IBM, on whom Atruvia is deeply dependent (IBM Z mainframes running agree21), WAS.<\u002Fstrong> Atruvia is instead supervised <em>indirectly<\u002Fem>, via the §25b KWG / MaRisk AT 9 outsourcing regime imposed on its bank customers and via direct BaFin §44 KWG inspections (one begun November 2023).<\u002Fli><li><strong>The deepest dependency is IBM (a mainframe monoculture); the hardest-to-recreate asset is the agree21 single core platform<\u002Fstrong> running ~800 banks and tens of millions of accounts after the \"moon-landing\" migration completed in 2019/2020; and <strong>the most misunderstood feature is the customer-owner identity<\u002Fstrong>, which suppresses pricing pressure and external accountability while creating near-insurmountable lock-in.<\u002Fli><\u002Ful><div class=\"sep\"><\u002Fdiv><h2 id=\"s-key-findings\" class=\"hd hd2\"><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2><ol class=\"lst\"><li><strong>Origin.<\u002Fstrong> Atruvia traces to the Fiducia Revisions- und Treuhand-Institut AG, founded in Karlsruhe on <strong>13 November 1924<\u002Fstrong>. The Tracxn/PitchBook claim that Atruvia was \"founded in 1924 by Martin Beyer\" is <strong>erroneous data<\u002Fstrong> — Beyer is a former executive (2013–2025), not a 1924 founder. The modern entity was created by the 2015 merger of Fiducia IT AG (Karlsruhe, south) and GAD eG (Münster, north), renamed Atruvia AG on <strong>1 September 2021<\u002Fstrong>.<\u002Fli><li><strong>Ownership.<\u002Fstrong> 91.63% of Atruvia's €115.8m share capital is held by three regional Beteiligungsgesellschaften pooled through <strong>VR-FGI Beteiligungsholding GmbH &amp; Co. KG<\u002Fstrong>; 6.71% by primary banks directly; ~1% other cooperative entities; 0.32% private banks. Total cooperative ownership 99.68%.<\u002Fli><li><strong>Governance.<\u002Fstrong> German two-tier board; a five-member Vorstand as of January 2026 led by Ulrich Coenen (sole spokesman since July 2025 after Martin Beyer's departure); a <strong>20-member co-determined Aufsichtsrat under the Mitbestimmungsgesetz 1976 (10 shareholder, 10 employee representatives)<\u002Fstrong>, chaired by Daniel Keller.<\u002Fli><li><strong>Regulation.<\u002Fstrong> Not a licensed bank; regulated indirectly through customers' outsourcing obligations (§25b KWG, MaRisk AT 9, BAIT), subject to DORA as an ICT third-party provider (contractually) but <strong>not (yet) as a designated CTPP<\u002Fstrong>, and underwent a BaFin §44 KWG special inspection begun November 2023.<\u002Fli><li><strong>Capability vs dependency.<\u002Fstrong> Atruvia owns and operates the agree21 core platform and its data centres but is strategically dependent on IBM for mainframe hardware/software (a multi-year deal signed <strong>19 November 2025<\u002Fstrong> built on the IBM z17); the subsidiary Ratiodata SE supplies and services the &gt;30,000-device self-service/ATM network.<\u002Fli><li><strong>Payments expansion.<\u002Fstrong> On <strong>2 July 2026<\u002Fstrong> Atruvia agreed to acquire VR Payment's <strong>Issuing-Processing<\u002Fstrong> business (effective 1 January 2027; Bundeskartellamt filing 15 July 2026, case B9-75/26), consolidating debit AND credit card processing under Atruvia and turning it into a card \"powerhouse.\"<\u002Fli><\u002Fol><div class=\"sep\"><\u002Fdiv><h2 id=\"s-details\" class=\"hd hd2\"><span class=\"ht\">Details<\u002Fspan><\u002Fh2><h2 id=\"s-i-1\" class=\"hd hd2\"><span class=\"hn mono\">I.1<\u002Fspan><span class=\"ht\">Origin and Corporate History<\u002Fspan><\u002Fh2><p><strong>The fragmented origins (1924–2000s).<\u002Fstrong> Two lineages converged into today's Atruvia:<\u002Fp><ul class=\"lst\"><li><strong>Southern lineage (Fiducia).<\u002Fstrong> The Fiducia Revisions- und Treuhand-Institut AG was founded in Karlsruhe on <strong>13 November 1924<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan> — Atruvia's own 100-year press release, 11 November 2024]. From 1958 the idea of a shared <em>Buchungsgemeinschaft<\u002Fem> (booking cooperative) emerged among the banks it served; the Zentralkasse südwestdeutscher Volksbanken commissioned Fiducia to build it. By year-end 1963, 67 Volksbanks were partners; 47 staff processed 22 million booking items (against Atruvia's 8.2bn+ today). Fiducia then consolidated regional computing centres through successive mergers: with GRK Genossenschaftliches Rechenzentrum Kassel (1999) and RWG Rechenzentrale Württembergischer Genossenschaften Stuttgart (2001, forming Fiducia AG Karlsruhe/Stuttgart), then with rbg Rechenzentrale Bayerischer Genossenschaften (2003, forming <strong>Fiducia IT AG<\u002Fstrong>). Its core system <strong>agree<\u002Fstrong> (v1.0, 2003) unified the predecessor systems GEBOS (RWG), GENOS (rbg) and RUBIN (GRK), built atop Fiducia's earlier NBS system.<\u002Fli><li><strong>Northern lineage (GAD).<\u002Fstrong> The Gesellschaft für automatische Datenverarbeitung (GAD) was founded in Münster on <strong>26 December 1963<\u002Fstrong> as the first cooperative computing centre in north-west Germany, with 23 employees; converted from GmbH to a registered cooperative (eG) in 1966 (30m booking items that year). In 1971 the Rechenzentrale der westdeutschen Volksbanken was absorbed. Its core system <strong>bank21<\u002Fstrong> replaced predecessor BB3 across all GAD member banks by 2007.<\u002Fli><\u002Ful><p><strong>Failed and successful merger (2013–2015).<\u002Fstrong> Earlier merger talks failed (a 2012 attempt \"geplatzt,\" per WirtschaftsWoche). Talks resumed late 2013; the supervisory boards of both firms assented unanimously in early October 2014. The <strong>GAD Generalversammlung approved on 26 November 2014 with 94%<\u002Fstrong>; the <strong>Fiducia extraordinary Hauptversammlung approved on 4 December 2014 with 100%<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>]. The Verschmelzungsvertrag is dated 4 December 2014; the new entity, <strong>Fiducia &amp; GAD IT AG<\u002Fstrong>, was registered at Amtsgericht Frankfurt am Main on 10 June 2015, and the merger became legally effective <strong>1 July 2015<\u002Fstrong> (some sources cite economic effect from 1 January 2015). At formation it had ~5,500–5,600 staff, ~€1.2–1.26bn group revenue, and served all ~1,100 German cooperative banks.<\u002Fp><p><em>Structural consequence:<\u002Fem> the merger created a two-platform problem (agree south, bank21 north) that dictated the next five years of strategy and created deep path dependency, a north-south organisational fault line, and the dual Karlsruhe/Münster administrative seats that persist today.<\u002Fp><p><strong>The agree21 migration — \"the moon landing\" (2016–2020).<\u002Fstrong> Rather than maintain two cores, management chose to consolidate onto <strong>agree21<\u002Fstrong> (based on agree, extended with bank21 components). Series migration of the former GAD banks began February 2017; the series migration completed <strong>9 November 2019<\u002Fstrong>, with all 341 remaining banks (reduced from ~400 by intervening bank mergers) migrated; six special institutions followed through 2020. Scope: ~60,000 bank workstations, 13,000 self-service terminals, ~21.5 million accounts and 22 terabytes of data across 60 series migrations [<span class=\"ev\">CONFIRMED FACT<\u002Fspan> — Atruvia press release, 17 February 2020]. Management reported the programme was <strong>delivered on time and on budget<\u002Fstrong>, targeting <strong>~€125m/year in synergies from end-2020<\u002Fstrong> passed to member banks via cost reductions [<span class=\"ev\">COMPANY CLAIM<\u002Fspan> — no independent audit of total programme cost or overruns is public; the €125m figure was announced at the 2014/15 merger and repeated at completion]. Contemporary trade press (\"Mondlandung\"/\"the largest cooperative IT transformation of all time\") corroborates the scale and on-time completion, but not the cost claim independently.<\u002Fp><p><strong>Rebrand (2021).<\u002Fstrong> On <strong>1 September 2021<\u002Fstrong> Fiducia &amp; GAD IT AG became <strong>Atruvia AG<\u002Fstrong> (Handelsregister change registered 31 August 2021; Hauptversammlung resolution 30 June 2021). The name was developed by a naming agency; the stated rationale was signalling completion of post-merger integration and a repositioning \"from IT service provider to digitalisation partner\" [<span class=\"ev\">COMPANY CLAIM<\u002Fspan>]. Note the causal chain: the rebrand deliberately followed the migration's completion, so that a single unified platform preceded a single unified brand.<\u002Fp><p><strong>Strategic programmes since:<\u002Fstrong> the BVR \"KundenFokus\" verbund project; the EGP Gesamtbanksteuerungssysteme regulatory-software platform (later merged up into Atruvia — the KG was deleted from the register on 19 September 2023 by <em>Anwachsung<\u002Fem>); the M365/Microsoft rollout; a cost-and-efficiency programme; and the \"audIT\" remediation programme (completed 31 December 2021) that closed out findings from an earlier BaFin process.<\u002Fp><p><strong>VR Payment acquisition (2026).<\u002Fstrong> On <strong>2 July 2026<\u002Fstrong> Atruvia, DZ Bank and VR Payment announced Atruvia's acquisition of VR Payment's <strong>Issuing-Processing<\u002Fstrong> business, effective <strong>1 January 2027<\u002Fstrong>. The Bundeskartellamt merger-control filing was made <strong>15 July 2026<\u002Fstrong> (case B9-75/26, product markets \"Finanzdienstleistungen, Zahlungsabwicklungsdienste\") [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>]. Atruvia will process debit AND credit cards (credit processing previously sat with VR Payment) on an integrated card platform built with DZ Bank; VR Payment refocuses on acquiring, POS network operation and merchant/omnichannel solutions. Digital Banking board member Željko Kaurin: <em>\"Mit der Bündelung des Issuing Processing führen wir bestehende Stärken in der genossenschaftlichen FinanzGruppe gezielt zusammen.\"<\u002Fem> Legal adviser to Atruvia: McDermott Will &amp; Schulte (Dr. Christian Marzlin, Dr. Philipp Grenzebach). Marzlin (verbatim): <em>\"Ein wesentlicher Teil aller Kreditkartentransaktionen in Deutschland wird über die Systeme von Atruvia abgewickelt … Die Neuordnung des Kartengeschäfts zwischen Atruvia und DZ Bank hat deshalb große Bedeutung für die deutsche Finanz- und Bankenwelt.\"<\u002Fem> Purchase price not disclosed [<span class=\"ev\">UNKNOWN<\u002Fspan>]. Rationale: consolidate duplicate structures, integrate account+card at Atruvia, respond to fintech competition and rising payment volumes/regulation.<\u002Fp><h2 id=\"s-i-2\" class=\"hd hd2\"><span class=\"hn mono\">I.2<\u002Fspan><span class=\"ht\">Corporate Group Structure<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-9\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 09<\u002Fspan><span class=\"fig-t\">The Corporate Group<\u002Fspan><\u002Fdiv><div class=\"fig-b\"><div style=\"text-align:center\"><div style=\"display:inline-block;min-width:410.1px\"><div class=\"f-box solid\"><div class=\"f-name\">ATRUVIA AG<\u002Fdiv><div class=\"f-meta\">5,847 employees (AG, 2025) · group parent<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 1000 22\" width=\"100%\" height=\"30.1\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block\" aria-hidden=\"true\"><line x1=\"500\" y1=\"0\" x2=\"500\" y2=\"8\" stroke=\"var(--wire)\" vector-effect=\"non-scaling-stroke\" style=\"stroke:var(--wire)\"><\u002Fline><line x1=\"100\" y1=\"8\" x2=\"900\" y2=\"8\" stroke=\"var(--wire)\" vector-effec nt-size:13px;letter-spacing:.12em;color:var(--acc);border-top:1.4px solid var(--acc-dk);padding-top:5.5px\">LOSS-MAKER<\u002Fdiv><\u002Fdiv><div style=\"border:1.4px solid var(--wire2);background:transparent;padding:10.9px 12.3px\"><div class=\"f-name\" style=\"font-size:16.4px;line-height:1.1\">ECON Application<\u002Fdiv><div class=\"f-num\" style=\"font-size:20.5px;margin-top:6.8px;color:var(--ink)\">€4.1m<\u002Fdiv><div class=\"f-num\" style=\"font-size:14.4px;color:var(--muted)\">35 staff<\u002Fdiv><div style=\"font-size:13px;line-height:1.25;color:var(--muted);margin-top:6.8px\">No-code platform<\u002Fdiv><\u002Fdiv><div style=\"border:1.4px solid var(--wire2);background:transparent;padding:10.9px 12.3px\"><div class=\"f-name\" style=\"font-size:16.4px;line-height:1.1\">FORUM GmbH<\u002Fdiv><div class=\"f-num\" style=\"font-size:20.5px;margin-top:6.8px;color:var(--ink)\">€3.6m<\u002Fdiv><div class=\"f-num\" style=\"font-size:14.4px;color:var(--muted)\">20 staff<\u002Fdiv><div style=\"font-size:13px;line-height:1.25;color:var(--muted);margin-top:6.8px\">InfoSec/GRC software<\u002Fdiv><\u002Fdiv><div style=\"border:1.4px solid var(--wire2);background:transparent;padding:10.9px 12.3px\"><div class=\"f-name\" style=\"font-size:16.4px;line-height:1.1\">GWS mbH<\u002Fdiv><div class=\"f-num\" style=\"font-size:20.5px;margin-top:6.8px;color:var(--ink)\">—<\u002Fdiv><div class=\"f-num\" style=\"font-size:14.4px;color:var(--muted)\">~670 staff<\u002Fdiv><div style=\"font-size:13px;line-height:1.25;color:var(--muted);margin-top:6.8px\">ERP for trade<\u002Fdiv><\u002Fdiv><div style=\"border:1.4px solid var(--wire2);background:transparent;padding:10.9px 12.3px\"><div class=\"f-name\" style=\"font-size:16.4px;line-height:1.1\">Accesa / RaRo<\u002Fdiv><div class=\"f-num\" style=\"font-size:20.5px;margin-top:6.8px;color:var(--ink)\">—<\u002Fdiv><div class=\"f-num\" style=\"font-size:14.4px;color:var(--muted)\">~700 staff<\u002Fdiv><div style=\"font-size:13px;line-height:1.25;color:var(--muted);margin-top:6.8px\">Nearshore development, Cluj-Napoca<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption class=\"fig-c\">Ten operating entities around one parent. The revenue is concentrated in Ratiodata; the headcount is spread far wider than the AG’s own 5,847.<\u002Ffigcaption><\u002Ffigure><p>Atruvia AG is the group parent. Northdata's consolidated filings historically show ~24–31 shareholdings (31 companies in the 2015 consolidated report; ~28 in the 2023 report). Material operating subsidiaries and participations (FY2024 figures from Atruvia's subsidiary report unless noted):<\u002Fp><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Entity<\u002Fsc-raw-th><sc-raw-th>Function<\u002Fsc-raw-th><sc-raw-th>Employees<\u002Fsc-raw-th><sc-raw-th>Revenue (FY2024)<\u002Fsc-raw-th><sc-raw-th>Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Ratiodata SE<\u002Fstrong> (Frankfurt/Münster)<\u002Fsc-raw-td><sc-raw-td>Systems house: IT hardware, managed field/campus services, self-service (ATM/SB) systems, scan/document services<\u002Fsc-raw-td><sc-raw-td>1,426<\u002Fsc-raw-td><sc-raw-td>€344.5m<\u002Fsc-raw-td><sc-raw-td>Largest subsidiary; &gt;50 yrs; absorbed GWS hardware business June 2024; Beyer was AR chair from July 2024<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>parcIT GmbH<\u002Fstrong> (Cologne)<\u002Fsc-raw-td><sc-raw-td>Bank steering &amp; risk software (VR-Control/okular)<\u002Fsc-raw-td><sc-raw-td>507<\u002Fsc-raw-td><sc-raw-td>€78.6m<\u002Fsc-raw-td><sc-raw-td>In group since 2009<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>BMS Corporate Solutions<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Corporate-client (Firmenkunden) digitalisation, data analytics, fincompare<\u002Fsc-raw-td><sc-raw-td>303<\u002Fsc-raw-td><sc-raw-td>€52.0m<\u002Fsc-raw-td><sc-raw-td>Core business field of Atruvia<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Peras GmbH<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>HR services/payroll (geno.HR), HR BPO<\u002Fsc-raw-td><sc-raw-td>290<\u002Fsc-raw-td><sc-raw-td>€46.7m<\u002Fsc-raw-td><sc-raw-td>HR partner<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Serviscope AG<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Business process outsourcing (omnichannel, 24/7) for 350+ banks<\u002Fsc-raw-td><sc-raw-td>451<\u002Fsc-raw-td><sc-raw-td>€28.8m<\u002Fsc-raw-td><sc-raw-td>Sole owner of SDT since Aug 2024; SERVODATA subsidiary runs the 116 116 card-blocking hotline<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Accesa (IT Group GmbH)<\u002Fstrong> (Cluj-Napoca, RO)<\u002Fsc-raw-td><sc-raw-td>Nearshore software development / managed services<\u002Fsc-raw-td><sc-raw-td>1,090+<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>Spun out of Ratiodata to Atruvia AG eff. 1 Jan 2024<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Ratiodata Romania (RaRo)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Nearshore<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>Spun out of Ratiodata to Atruvia AG eff. 1 Jan 2024<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>ECON Application GmbH<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>No-code application/forms software<\u002Fsc-raw-td><sc-raw-td>35<\u002Fsc-raw-td><sc-raw-td>€4.1m<\u002Fsc-raw-td><sc-raw-td>Acquired 2023<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>FORUM Ges. f. Informationssicherheit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>GRC / DORA / IT-regulatory software (ForumSuite)<\u002Fsc-raw-td><sc-raw-td>20<\u002Fsc-raw-td><sc-raw-td>€3.6m<\u002Fsc-raw-td><sc-raw-td>Serves ~700 banks<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>TRUUCO GmbH<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Data-driven sales AI<\u002Fsc-raw-td><sc-raw-td>58<\u002Fsc-raw-td><sc-raw-td>€8.2m<\u002Fsc-raw-td><sc-raw-td>JV with DZ Bank &amp; Bausparkasse Schwäbisch Hall; loss-making (−€7.98m)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>GWS mbH<\u002Fstrong> (Münster)<\u002Fsc-raw-td><sc-raw-td>ERP/cloud for wholesale/retail trade<\u002Fsc-raw-td><sc-raw-td>~670 (mid-2024)<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>Now cloud-only after ceding hardware to Ratiodata<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p>Minority participations/JVs: <strong>Verimi GmbH<\u002Fstrong> (digital identity; after the 2022 yes/Verimi merger, Atruvia + DZ Bank together ~18–20%); <strong>amberra GmbH<\u002Fstrong> (non-core banking ecosystem, with DZ Bank &amp; BVR). Dissolved/merged-up: <strong>EGP Gesamtbanksteuerungssysteme GmbH &amp; Co. KG<\u002Fstrong> (deregistered 19 September 2023).<\u002Fp><p><strong>Why the entities exist (structure-flow-control-economics-risk):<\u002Fstrong> (a) <em>historical merger path dependence<\u002Fem> (Ratiodata, GWS, GAD-legacy vehicles); (b) <em>labour-law / tariff separation<\u002Fem> (BPO in Serviscope, HR in Peras); (c) <em>regulatory specialisation<\u002Fem> (parcIT for risk models, FORUM for GRC/DORA software); (d) <em>nearshore cost/skills arbitrage<\u002Fem> (Accesa/RaRo in Romania); (e) <em>tax/holding convenience<\u002Fem> (the Verwaltungs-GmbH complementary entities). Entity separation reflects a mix of merger history and functional specialisation far more than tax optimisation. Atruvia is explicitly deduplicating overlapping subsidiary business models (e.g. the June 2024 GWS→Ratiodata hardware transfer) — a control lever the group exercises through its Beteiligungsausschuss.<\u002Fp><p><em>Simplified economically-important tree:<\u002Fem> <strong>Atruvia AG<\u002Fstrong> → {Ratiodata SE (infrastructure/hardware/SB), parcIT (risk software), BMS CS (corporate banking), Serviscope (BPO), Peras (HR), Accesa/RaRo (nearshore dev)}; the remainder are small software or JV vehicles.<\u002Fp><h2 id=\"s-i-3\" class=\"hd hd2\"><span class=\"hn mono\">I.3<\u002Fspan><span class=\"ht\">Ownership and Control (GIVEN UNUSUAL WEIGHT)<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-1\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 01<\u002Fspan><span class=\"fig-t\">The Ownership Cascade<\u002Fspan><\u002Fdiv><div class=\"fig-b\"><div style=\"display:grid;grid-template-columns:minmax(0,1fr) 352.7px;gap:30.1px;align-items:start\"><div><div class=\"f-box \"><div class=\"f-name\">~700 cooperative member banks<\u002Fdiv><div class=\"f-meta\">Volksbanken · Raiffeisenbanken · Sparda · PSD — Kommanditisten of the regional holding KGs<\u002Fdiv><\u002Fdiv><svg sc-camel-view-box=\"0 0 300 26\" width=\"100%\" height=\"35.5\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block\" aria-hidden=\"true\"><line x1=\"150\" y1=\"0\" x2=\"150\" y2=\"9\" stroke=\"var(--wire)\" vector-effect=\"non-scaling-stroke\" style=\"stroke:var(--wire)\"><\u002Fline><line x1=\"50\" y1=\"9\" x2=\"250\" y2=\"9\" stroke=\"var(--wire)\" vector-effect=\"non-scaling-stroke\" style=\"stroke:var(--wire)\"><\u002Fline><line x1=\"50\" y1=\"9\" x2=\"50\" y2=\"26\" stroke=\"var(--wire)\" vector-effect=\"non-scaling-stroke\" style=\"stroke:var(--wire)\"><\u002Fline><line x1=\"150\" y1=\"9\" x2=\"150\" y2=\"26\" stroke=\"var(--wire)\" vector-effect=\"non-scaling-stroke\" style=\"stroke:var(--wire)\"><\u002Fline><line x1=\"250\" y1=\"9\" x2=\"250\" y2=\"26\" stroke=\"var(--wire)\" vector-effect=\"non-scaling-stroke\" style=\"stroke:var(--wire)\"><\u002Fline><\u002Fsvg><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10.9px\"><div class=\"f-box \"><div class=\"f-name\">Beteiligungs-KG<br>Baden-Württemberg<\u002Fdiv><div class=\"f-meta\">Stuttgart · HRA 720090<\u002Fdiv><\u002Fdiv><div class=\"f-box \"><div class=\"f-name\">Beteiligungs-KG<br>Nord<\u002Fdiv><div class=\"f-meta\">Münster · HRA 10029<\u002Fdiv><\u002Fdiv><div class=\"f-box \"><div class=\"f-name\">Bayerische BBA<\u002Fdiv><div class=\"f-meta\">Beilngries · HRA 2070 · <b>14.15%<\u002Fb><\u002Fdiv><\u002Fdiv><\u002Fdiv><svg sc-camel-view-box=\"0 0 10 24\" width=\"13.7\" height=\"24\" style=\"display:block;margin:0 auto\" aria-hidden=\"true\"><line x1=\"5\" y1=\"0\" x2=\"5\" y2=\"18\" stroke=\"var(--wire)\" style=\"stroke:var(--wire)\"><\u002Fline><path d=\"M1.5 17 L5 24 L8.5 17\" fill=\"none\" stroke=\"var(--wire)\" style=\"stroke:var(--wire)\"><\u002Fpath><\u002Fsvg><div class=\"f-box gold\"><div class=\"f-name\">VR-FGI Beteiligungsholding GmbH &amp; Co. KG<\u002Fdiv><div class=\"f-meta\">Neu-Isenburg · HRA 42595 — votes <b>91.63%<\u002Fb> of share capital as one block<\u002Fdiv><\u002Fdiv><svg sc-camel-view-box=\"0 0 10 24\" width=\"13.7\" height=\"24\" style=\"display:block;margin:0 auto\" aria-hidden=\"true\"><line x1=\"5\" y1=\"0\" x2=\"5\" y2=\"18\" stroke=\"var(--wire)\" style=\"stroke:var(--wire)\"><\u002Fline><path d=\"M1.5 17 L5 24 L8.5 17\" fill=\"none\" stroke=\"var(--wire)\" style=\"stroke:var(--wire)\"><\u002Fpath><\u002Fsvg><div class=\"f-box solid\"><div class=\"f-name\">ATRUVIA AG<\u002Fdiv><div class=\"f-meta\">HRB 102381 · Amtsgericht Frankfurt am Main · share capital €115.8m<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"bp\" style=\"padding:15px 16.4px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"f-lbl\" style=\"margin-bottom:12.3px\">Nominalkapital, full split<\u002Fdiv><div style=\"margin-bottom:9.6px\"><div style=\"display:flex;justify-content:space-between;font-size:14.4px;line-height:1.2;color:var(--muted)\"><span style=\"font-weight:700\">Beteiligungsgesellschaften<\u002Fspan><span class=\"f-num\">91.63%<\u002Fspan><\u002Fdiv><div style=\"height:8.2px;background:var(--color-neutral-200);margin-top:4.1px\"><i style=\"display:block;height:100%;min-width:2.1px;width:91.63%;background:var(--acc-solid)\"><\u002Fi><\u002Fdiv><\u002Fdiv><div style=\"margin-bottom:9.6px\"><div style=\"display:flex;justify-content:space-between;font-size:14.4px;line-height:1.2;color:var(--muted)\"><span>Primärbanken<\u002Fspan><span class=\"f-num\">6.71%<\u002Fspan><\u002Fdiv><div style=\"height:8.2px;background:var(--color-neutral-200);margin-top:4.1px\"><i style=\"display:block;height:100%;min-width:2.1px;width:6.71%;background:var(--muted)\"><\u002Fi><\u002Fdiv><\u002Fdiv><div style=\"margin-bottom:9.6px\"><div style=\"display:flex;justify-content:space-between;font-size:14.4px;line-height:1.2;color:var(--acc)\"><span style=\"font-weight:700\">DZ Bank (Zentralbank)<\u002Fspan><span class=\"f-num\">0.35%<\u002Fspan><\u002Fdiv><div style=\"height:8.2px;background:var(--color-neutral-200);margin-top:4.1px\"><i style=\"display:block;height:100%;min-width:2.1px;width:0.35%;background:var(--acc)\"><\u002Fi><\u002Fdiv><\u002Fdiv><div style=\"margin-bottom:9.6px\"><div style=\"display:flex;justify-content:space-between;font-size:14.4px;line-height:1.2;color:var(--muted)\"><span>Other cooperative entities<\u002Fspan><span class=\"f-num\">1.00%<\u002Fspan><\u002Fdiv><div style=\"height:8.2px;background:var(--color-neutral-200);margin-top:4.1px\"><i style=\"display:block;height:100%;min-width:2.1px;width:1%;background:var(--muted)\"><\u002Fi><\u002Fdiv><\u002Fdiv><div style=\"margin-bottom:9.6px\"><div style=\"display:flex;justify-content:space-between;font-size:14.4px;line-height:1.2;color:var(--muted)\"><span>Privatbanken<\u002Fspan><span class=\"f-num\">0.32%<\u002Fspan><\u002Fdiv><div style=\"height:8.2px;background:var(--color-neutral-200);margin-top:4.1px\"><i style=\"display:block;height:100%;min-width:2.1px;width:0.32%;background:var(--muted)\"><\u002Fi><\u002Fdiv><\u002Fdiv><div style=\"border-top:1.4px solid var(--ink);margin-top:13.7px;padding-top:9.6px;display:flex;justify-content:space-between;font-family:var(--font-heading);font-size:17.8px\"><span>Total cooperative<\u002Fspan><span class=\"f-num\" style=\"color:var(--acc)\">99.68%<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"f-callout\"><b>DZ Bank holds 0.35%, not 20%.<\u002Fb> The widely-repeated 20% figure refers to Verimi, the digital-identity venture — not to Atruvia. No single institution controls the company; the largest disclosed block is Bavaria’s 14.15%.<\u002Fdiv><\u002Fdiv><figcaption class=\"fig-c\">Economic ownership is fragmented across ~700 banks; voting control is concentrated by the pooling structure into a single 91.63% block.<\u002Ffigcaption><\u002Ffigure><p><strong>The cascade.<\u002Fstrong> ~800 member banks → three regional holding KGs → <strong>VR-FGI Beteiligungsholding GmbH &amp; Co. KG<\u002Fstrong> → <strong>Atruvia AG<\u002Fstrong>. Member banks became limited partners (Kommanditisten) of the regional KGs by contributing (<em>einbringen<\u002Fem>) their Atruvia shares; the regional KGs pool their stakes through VR-FGI, which votes the block. Atruvia shares were contributed into VR-FGI on <strong>23 November 2018<\u002Fstrong>.<\u002Fp><p><strong>The vehicles [<span class=\"ev\">CONFIRMED FACT<\u002Fspan> — Handelsregister/Northdata]:<\u002Fstrong><\u002Fp><ul class=\"lst\"><li><strong>VR-FGI Beteiligungsholding GmbH &amp; Co. KG<\u002Fstrong> — Neu-Isenburg, Amtsgericht Offenbach am Main <strong>HRA 42595<\u002Fstrong>; general partner <strong>VR-FGI Verwaltungs GmbH<\u002Fstrong>. Top pooling vehicle; corporate purpose: acquisition and management of direct and indirect participations in (former) Fiducia &amp; GAD IT AG / Atruvia AG.<\u002Fli><li><strong>Atruvia Beteiligungs-GmbH &amp; Co. KG Baden-Württemberg<\u002Fstrong> — Stuttgart, <strong>HRA 720090<\u002Fstrong> (formerly FAG Beteiligungs-GmbH &amp; Co. KG BW); GP now DZA Verwaltungs-GmbH Baden-Württemberg.<\u002Fli><li><strong>Atruvia Beteiligungs GmbH &amp; Co. KG Nord<\u002Fstrong> — Münster, <strong>HRA 10029<\u002Fstrong> (formerly GAD Beteiligungs GmbH &amp; Co. KG); GP Atruvia Verwaltungs GmbH Nord (HRB 15398). <strong>DZ Bank AG is listed as a limited partner here.<\u002Fstrong><\u002Fli><li><strong>Bayerische Beteiligungsgesellschaft an der Atruvia AG GmbH &amp; Co. KG (BBA)<\u002Fstrong> — Beilngries, Amtsgericht Ingolstadt <strong>HRA 2070<\u002Fstrong>; GP GVB Verwaltungsgesellschaft mbH (a subsidiary of Genossenschaftsverband Bayern). BBA holds <strong>14.15% of Atruvia's share capital indirectly via VR-FGI<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan> — bbakg.de]; founded 22 November 2007; 216 Kommanditisten as of 30 September 2021.<\u002Fli><\u002Ful><p><strong>Economic ownership (Atruvia's most recent published \"Nominalkapital in %\" table, as of Aug 2026):<\u002Fstrong> Beteiligungsgesellschaften <strong>91.63%<\u002Fstrong>; Primärbanken <strong>6.71%<\u002Fstrong>; Zentralbank (DZ Bank) <strong>0.35%<\u002Fstrong>; other cooperative entities ~1.0% combined (sonstige genossenschaftliche Gesellschaften 0.86%, gewerbliche Warengenossenschaften 0.13%, etc.); Privatbanken <strong>0.32%<\u002Fstrong>. <strong>Total cooperative 99.68%.<\u002Fstrong> Share capital €115.8m [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>].<\u002Fp><p><strong>Separating economic ownership from voting control.<\u002Fstrong> Economic ownership is highly fragmented across ~800 banks. Voting control, however, is <em>concentrated by the pooling structure<\u002Fem>: VR-FGI votes ~91.6% of the shares as a single block, and the three regional KGs coordinate through it. BBA's own guidelines describe the arrangement as bundling member interests \"in one company\" and state that \"die Bündelung der Aktionärsinteressen setzt Konsens über die gemeinsamen strategischen Ziele voraus\" (\"bundling of shareholder interests presupposes consensus on common strategic goals\").<\u002Fp><p><strong>Who actually controls Atruvia?<\u002Fstrong> The member banks collectively, acting through the pooling vehicles and BVR-coordinated cooperative-sector consensus. No single member bank has a controlling stake; the largest disclosed block is Bavaria's 14.15%. <strong>DZ Bank — the sector's central institution — does NOT control Atruvia; the widely-cited \"DZ Bank ~20%\" figure refers to Verimi, not Atruvia<\u002Fstrong> [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>, corroborated: DZ Bank appears only as a minor LP in the Nord KG and holds ~0.35% \"Zentralbank\" directly]. Management can be removed by the Aufsichtsrat, whose shareholder bench is elected by the Hauptversammlung (i.e. ultimately the member banks via VR-FGI). A coordinated bloc of member banks could therefore force strategic change — but the pooling structure and consensus requirement make unilateral action by any faction difficult.<\u002Fp><p><strong>Conflicts (the analytically interesting core):<\u002Fstrong><\u002Fp><ul class=\"lst\"><li><em>North (ex-GAD) vs South (ex-Fiducia):<\u002Fem> institutionalised in the separate Nord vs Baden-Württemberg/Bayern KGs and the dual seats. The agree21 decision (the south's platform prevailed; bank21 was retired) was a durable source of northern grievance.<\u002Fli><li><em>Large vs small banks:<\u002Fem> large banks want bespoke functionality and faster modernisation; small banks want low, stable, standardised pricing. The pooled, capital-weighted-within-KG structure protects the collective, though the exact per-share vs per-member voting rule within the pool could not be confirmed from an accessible primary document [<span class=\"ev\">UNKNOWN<\u002Fspan>].<\u002Fli><li><em>Owner vs customer — THE central governance fact.<\u002Fem> Member banks are simultaneously shareholders (wanting dividends and low investment) and customers (wanting low prices and high service). This dual identity suppresses arm's-length pricing pressure, mutes accountability (no external shareholders demanding returns; no analysts; no listing), and can produce under-investment — but it also aligns the supplier's incentives with the sector's survival and guarantees captive demand. The consequences run through pricing (historically cost-plus \"Basispaket\"; a shift to usage-based pricing was signalled in 2024), investment (large programmes require member consensus), and accountability (discipline comes from internal governance, not markets).<\u002Fli><\u002Ful><h2 id=\"s-i-4\" class=\"hd hd2\"><span class=\"hn mono\">I.4<\u002Fspan><span class=\"ht\">Governance Architecture<\u002Fspan><\u002Fh2><p><strong>Vorstand (management board) — 5 members; \"Zielbild\" complete as of 1 January 2026:<\u002Fstrong><\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Member<\u002Fsc-raw-th><sc-raw-th>Ressort<\u002Fsc-raw-th><sc-raw-th>Since<\u002Fsc-raw-th><sc-raw-th>Prior experience<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Ulrich Coenen<\u002Fstrong> (Vorstandssprecher)<\u002Fsc-raw-td><sc-raw-td>Corporate Strategy &amp; Development<\u002Fsc-raw-td><sc-raw-td>co-spokesman from 2021; <strong>sole spokesman from July 2025<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>long-serving Fiducia/F&amp;G executive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Daniela Bücker<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Core Banking &amp; Technology<\u002Fsc-raw-td><sc-raw-td>2020<\u002Fsc-raw-td><sc-raw-td>technical continuity<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Julia Japec<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Customer Success (sales)<\u002Fsc-raw-td><sc-raw-td>1 May 2025 (succeeded Ralf Teufel)<\u002Fsc-raw-td><sc-raw-td>joined from Commerzbank 2022<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Željko Kaurin<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Digital Banking<\u002Fsc-raw-td><sc-raw-td>1 November 2025<\u002Fsc-raw-td><sc-raw-td>ex-COO Barclays Bank Europe; 20+ yrs ING-DiBa<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Dr. Markus Wiegelmann<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Finance, Regulation &amp; HR (Arbeitsdirektor)<\u002Fsc-raw-td><sc-raw-td>1 January 2026<\u002Fsc-raw-td><sc-raw-td>ex-CFO/COO BayernLB; began at Deutsche Bank risk 1998<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><em>Departures:<\u002Fem> <strong>Martin Beyer<\u002Fstrong> (Vorstandssprecher; 34 years at the company/predecessors; board from 2013; spokesman from 2019) left <strong>30 June 2025<\u002Fstrong> (\"Mission erfüllt\"; awarded the Raiffeisen-Schulze-Delitzsch gold medal); <strong>Ralf W. A. Teufel<\u002Fstrong> (Client Services) left in 2025 (declined renewal, decided end-2024) — confirming Northdata's record of his departure; Birgit Frohnhoff and Jörg Staff departed end-2022 in the six-to-four board reduction. The 2025–26 turnover is a deliberate generational refresh combining internal continuity (Bücker) with external bank expertise (Kaurin, Wiegelmann).<\u002Fp><p><strong>Aufsichtsrat (supervisory board) — 20 seats, fully co-determined [<span class=\"ev\">CONFIRMED FACT<\u002Fspan>].<\u002Fstrong> Atruvia's 2025 Hauptversammlung invitation states the board is composed \"gemäß §§ 96 Abs. 1, 101 AktG, § 7 Abs. 1 Satz 2, Satz 1 Nr. 3 Mitbestimmungsgesetz i.V.m. Ziff. 10.1 der Satzung … aus zwanzig Mitgliedern, zehn Vertretern der Anteilseigner und zehn Vertretern der Arbeitnehmer.\" This confirms the <strong>Mitbestimmungsgesetz 1976<\u002Fstrong> applies (near-parity; triggered above 2,000 employees), with the chair holding a casting second vote in deadlock (§29 MitbestG) and a Vermittlungsausschuss for appointments. Employees hold <strong>10 of 20 seats<\u002Fstrong>; the Betriebsrat/works council drives the employee-side election. Chair: <strong>Daniel Keller<\u002Fstrong> (Deputy CEO, Berliner Volksbank; AR member since June 2020; chair from June 2024, succeeding <strong>Jürgen Brinkmann<\u002Fstrong>). Shareholder representatives elected in 2023 include Kurt Abele, Johannes Karl Herzog and Tanja Müller-Ziegler (replacing Wolfgang Altmüller, Dr. Andreas Martin, Joachim Straub). Committees: Prüfungsausschuss (audit), Strategieausschuss, Ausschuss für Vorstandsangelegenheiten, Vermittlungsausschuss, Beteiligungsausschuss, and (from 1 January 2024) an Ausschuss für Technologie und Architektur.<\u002Fp><p><strong>Decision rights (control map).<\u002Fstrong> The Vorstand runs operations and proposes strategy, capital allocation, major platform investment, acquisitions and pricing to member banks. The Aufsichtsrat approves major investments, acquisitions (e.g. ECON 2023, the Ratiodata restructurings, supplier contracts including Microsoft and IBM), board appointments and remuneration, the financial plan and the \"Finanzierung der weiteren Digitalisierung.\" The Hauptversammlung (member banks via VR-FGI) elects the shareholder AR bench, approves the dividend, and discharges the boards (both discharged at the 2026 HV \"mit sehr guten Ergebnissen\"). Auditor: <strong>BDO AG Wirtschaftsprüfungsgesellschaft, Hamburg<\u002Fstrong> (unqualified opinions 2023).<\u002Fp><p><strong>Executive compensation:<\u002Fstrong> not individually disclosed (no listed-company disclosure regime). The Ausschuss für Vorstandsangelegenheiten handles Vorstand contracts, Tantiemen (bonuses) and targets; specific figures are [<span class=\"ev\">UNKNOWN<\u002Fspan>].<\u002Fp><h2 id=\"s-i-5\" class=\"hd hd2\"><span class=\"hn mono\">I.5<\u002Fspan><span class=\"ht\">Legal Architecture<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Who contracts with member banks:<\u002Fstrong> <strong>Atruvia AG<\u002Fstrong>, via framework agreements (Rahmenverträge) covering the Bankverfahren (agree21), data-centre operation and services. Pricing has historically been a base package (Basispaket) plus volume components; the 2024 HV signalled a move toward more \"nutzerorientierte Bepreisung.\" An inflation-linked price increase applied 1 April 2023.<\u002Fli><li><strong>Who owns the platform IP:<\u002Fstrong> <strong>Atruvia AG<\u002Fstrong> owns agree21 and the associated trademarks (AGREE, AGREE-BANK, FIDUCIA, PERAS, VR-NetKey, VR-WEB, ZIS, etc., per trademark filings). parcIT owns/develops VR-Control/okular.<\u002Fli><li><strong>Who employs staff:<\u002Fstrong> <strong>Atruvia AG<\u002Fstrong> (5,263 at 31 Dec 2023; ~5,300 at end-2024; the \"Zahlen und Fakten\" page cites ~5,850 for the AG in 2025) plus each subsidiary employs its own (group ~10,076 in 2024).<\u002Fli><li><strong>Who bears regulatory liability:<\u002Fstrong> Under <strong>§25b KWG<\u002Fstrong> the <em>outsourcing bank<\u002Fem> retains full regulatory responsibility for outsourced functions; Atruvia is the \"Auslagerungsunternehmen.\" Contracts must give the bank and BaFin audit/inspection and information rights, and DORA (Art. 30) now mandates specific clauses.<\u002Fli><li><strong>Key supplier contracts:<\u002Fstrong> IBM (multi-year, signed 19 November 2025); Microsoft M365 (AR-approved 2022).<\u002Fli><li><strong>Litigation/enforcement:<\u002Fstrong> a <strong>BaFin §44 KWG special inspection began November 2023<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan> — 2023 annual report]; the earlier \"audIT\" programme (to end-2021) remediated prior findings. No major public litigation identified [<span class=\"ev\">UNKNOWN<\u002Fspan> — thin disclosure].<\u002Fli><\u002Ful><p>Why the legal architecture is designed this way: a single contracting entity (Atruvia AG) simplifies the ~800 banks' §25b due diligence and the audit-rights architecture; specialised subsidiaries ring-fence distinct labour, tax and regulatory regimes; and the AG form (vs the former GAD eG cooperative form) allows a share-based ownership and pooling structure suited to hundreds of institutional owners.<\u002Fp><h2 id=\"s-i-6\" class=\"hd hd2\"><span class=\"hn mono\">I.6<\u002Fspan><span class=\"ht\">Regulatory and Supervisory Architectu
