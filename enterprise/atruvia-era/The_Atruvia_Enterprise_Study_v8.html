<\u002Fli><li><strong>Single greatest structural risk:<\u002Fstrong> owner price-resistance driving chronic under-investment while the base consolidates.<\u002Fli><li><strong>Most dangerous competitor/force and horizon:<\u002Fstrong> not a vendor but AI-driven collapse of migration economics (5–10y) — the only force that loosens the lock — with sector consolidation/FI as the parallel structural force.<\u002Fli><li><strong>Could new technology make Atruvia obsolete or benefit it?<\u002Fstrong> Mostly benefit (it can adopt AI to cut its own migration/maintenance cost); obsolescence only if AI collapses switching costs faster than Atruvia adapts.<\u002Fli><li><strong>Are member banks getting a good deal or an unavoidable one?<\u002Fstrong> Unavoidable, and probably reasonable — but unproven because untested by exit.<\u002Fli><li><strong>Central question — is the captive cooperative IT utility model sustainable for another decade, or a slow-motion structural trap?<\u002Fstrong> <strong>Sustainable for another decade, but drifting toward a trap unless three things change:<\u002Fstrong> (1) the sector agrees a durable, adequate investment-funding mechanism (beyond ad-hoc levies); (2) reliability and efficiency close the gap to FI and reduce outage frequency; (3) the sector confronts consolidation and the FI question deliberately rather than by drift. If those flip, the model is not just sustainable but potentially the nucleus of a national banking-IT champion. If they do not, captivity slowly converts from shelter into stagnation.<\u002Fli><\u002Ful><h2 id=\"s-recommendations-3\" class=\"hd hd2\"><span class=\"ht\">Recommendations<\u002Fspan><\u002Fh2><p><strong>For the cooperative sector / BVR (owners):<\u002Fstrong><\u002Fp><ol class=\"lst\"><li><strong>Replace ad-hoc levies with a multi-year, committed investment framework<\u002Fstrong> tied to explicit modernisation benchmarks. Threshold to act: FY2026 margin guidance at ~3.9% and FCF ~€38m confirm the current model cannot self-fund the €450m–€1bn scenario. Change trigger: if the digital-euro levy debate produces another one-off rather than a framework, escalate to a structural funding review.<\u002Fli><li><strong>Commission an independent efficiency benchmark against FI<\u002Fstrong> (revenue/employee ~€218k Group vs ~€516k). If the gap does not narrow by 2028, mandate a structural efficiency programme.<\u002Fli><li><strong>Open exploratory, deniable talks on Atruvia–FI cooperation<\u002Fstrong> (beyond the FH Münster training JV) — start with shared procurement/AI/cyber before any core-platform question. Benchmark: any cloud-native win at a German savings or cooperative bank should trigger acceleration.<\u002Fli><\u002Fol><p><strong>For Atruvia management:<\u002Fstrong><\u002Fp><ol class=\"lst\"><li><strong>Treat reliability as the first-order KPI.<\u002Fstrong> Four material outages in six years (2020, 2021, 2023, 2026) is the clearest evidence that lock-in has muted quality discipline. Publish outage root-cause transparency to rebuild trust — the undisclosed Nov 2023 cause contrasts poorly with the clearly-communicated 2021 DDoS response.<\u002Fli><li><strong>Use AI on your own cost base first<\u002Fstrong> — migration automation and COBOL-maintenance reduction — to convert the biggest external threat into an internal advantage before competitors do.<\u002Fli><li><strong>De-risk the new Vorstand<\u002Fstrong> with explicit succession/continuity planning given three sub-18-month tenures and a single spokesman.<\u002Fli><li><strong>Resolve TRUUCO and the low-margin subsidiary estate<\u002Fstrong> — either a value path or an exit.<\u002Fli><\u002Fol><p><strong>For individual member banks:<\u002Fstrong><\u002Fp><ol class=\"lst\"><li><strong>Stay — but organise collectively.<\u002Fstrong> Exit is irrational (Apobank), but individual banks should use the BVR/SPSA channels to press for the investment-funding framework and reliability benchmarks, since only collective buyer power exists.<\u002Fli><\u002Fol><h2 id=\"s-caveats-4\" class=\"hd hd2\"><span class=\"ht\">Caveats<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Executive compensation, internal board deliberations, and per-category Kununu sub-scores are <span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong> and are labelled as such; no personality speculation is offered.<\u002Fli><li>The <strong>\"Treiber\" quote<\u002Fstrong> originates from an Atruvia conference self-presentation (HR Pioneers, 2023), not an audited source — reliable for what Atruvia said, promotional in nature.<\u002Fli><li><strong>The Nov 2023 outage root cause and any BaFin reaction were not publicly established;<\u002Fstrong> the explicit \"fehlerhaftes Software-Update\" cause belongs to the December 2021 event. These are distinct events and should not be conflated.<\u002Fli><li>Several <strong>Finanz-Szene, Börsen-Zeitung and Platow<\u002Fstrong> items are paywalled and were accessed in snippet/summary form.<\u002Fli><li>The <strong>VR Payment purchase price is <span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>; the Bundeskartellamt case (B9-75/26, filed 15 July 2026) is pending.<\u002Fli><li>The <strong>€450m–€1bn/yr investment figure is a circulating sector scenario (<span class=\"ev\">HYPOTHESIS<\u002Fspan>), not a plan.<\u002Fstrong><\u002Fli><li>Financial figures blend Atruvia AG and Group; where the Coenen interview (Börsen-Zeitung, 16 July 2026) cites Group FY2025 revenue ~€2.5bn, Jahresüberschuss €60.8m and FY2026 EBIT guidance €77.9m (from €118.2m), these are Group figures and differ from the AG figures in <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-revenue-architecture-unit-economics-capital\">Volume IV<\u002Fa>.<\u002Fli><\u002Ful><div class=\"sep\"><\u002Fdiv><\u002Fsection><section class=\"sec\" data-part=\"6\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part VI<\u002Fspan><a href=\"#contents\">Volume VI &nbsp;·&nbsp; Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">VI<\u002Fspan><\u002Fdiv><h1 id=\"part-vi-part-vi-cross-volume-synthesis\" class=\"part\" data-short=\"Part VI — Cross-Volume Synthesis\">Cross-Volume Synthesis<\u002Fh1><p class=\"opener-s\">What the five volumes prove together that none proves alone.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">VI<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">8<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Draws on<\u002Fdiv><div class=\"plate-v\">Volumes I–V<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-vi-1\"><span class=\"inpart-n\">VI.1<\u002Fspan><span>The category error<\u002Fspan><\u002Fa><a href=\"#s-vi-2\"><span class=\"inpart-n\">VI.2<\u002Fspan><span>The single causal model<\u002Fspan><\u002Fa><a href=\"#s-vi-3\"><span class=\"inpart-n\">VI.3<\u002Fspan><span>What the volumes prove together that none proves alone<\u002Fspan><\u002Fa><a href=\"#s-vi-4\"><span class=\"inpart-n\">VI.4<\u002Fspan><span>The central tension<\u002Fspan><\u002Fa><a href=\"#s-vi-5\"><span class=\"inpart-n\">VI.5<\u002Fspan><span>What would falsify the reading<\u002Fspan><\u002Fa><a href=\"#s-vi-6\"><span class=\"inpart-n\">VI.6<\u002Fspan><span>What Atruvia is becoming<\u002Fspan><\u002Fa><a href=\"#s-vi-7\"><span class=\"inpart-n\">VI.7<\u002Fspan><span>Implications for a fintech builder<\u002Fspan><\u002Fa><a href=\"#s-vi-8\"><span class=\"inpart-n\">VI.8<\u002Fspan><span>Ten cross-volume conclusions<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><p><em>This section is new. It exists only in the master edition and draws on all five volumes.<\u002Fem><\u002Fp><h2 id=\"s-vi-1\" class=\"hd hd2\"><span class=\"hn mono\">VI.1<\u002Fspan><span class=\"ht\">The category error<\u002Fspan><\u002Fh2><p>Read individually, the five volumes describe something that behaves oddly for a company: a firm whose customers own it, whose profit equals a levy it charges those owners, whose strategy is set by a committee of its buyers, and whose customers are legally incapable of leaving.<\u002Fp><p>Read together, they describe something that is <strong>not a company in the ordinary sense at all.<\u002Fstrong><\u002Fp><p><strong>Atruvia is a shared organ of the German cooperative banking sector — legally an Aktiengesellschaft, economically a cost pool, politically a committee.<\u002Fstrong> Every analytical instrument that assumes a normal firm produces a category error when applied to it:<\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Read as a company<\u002Fsc-raw-th><sc-raw-th>Actually<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Operating profit<\u002Fsc-raw-td><sc-raw-td>A levy, collected from owners and retained for investment<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Customers<\u002Fsc-raw-td><sc-raw-td>Owners and governors, who cannot leave<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Moat<\u002Fsc-raw-td><sc-raw-td>A structural lock that removes competitive discipline<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Growth<\u002Fsc-raw-td><sc-raw-td>Mostly consolidation and external wins, not owner pricing power<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Strategy<\u002Fsc-raw-td><sc-raw-td>Set by BVR committees, not by the Vorstand<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Margin target<\u002Fsc-raw-td><sc-raw-td>A governance device to legitimise retained earnings<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p>This is not a criticism. It is the correct frame. A cooperative utility optimised for cost recovery and sector survival should not be judged as if it were maximising shareholder value — but it also should not be credited with strengths that are really just the absence of alternatives.<\u002Fp><h2 id=\"s-vi-2\" class=\"hd hd2\"><span class=\"hn mono\">VI.2<\u002Fspan><span class=\"ht\">The single causal model<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-3\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 03<\u002Fspan><span class=\"fig-t\">The Closing Loop<\u002Fspan><\u002Fdiv><div class=\"fig-b\"><div style=\"display:grid;grid-template-columns:46.5px 1fr;gap:0\"><div style=\"position:relative\"><svg width=\"46.5\" height=\"100%\" sc-camel-view-box=\"0 0 34 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;position:absolute;inset:0\" aria-hidden=\"true\"><path d=\"M30 3 L8 3 L8 97 L30 97\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.5\" vector-effect=\"non-scaling-stroke\" style=\"stroke:var(--acc-solid)\"><\u002Fpath><\u002Fsvg><svg width=\"46.5\" height=\"16\" sc-camel-view-box=\"0 0 34 16\" style=\"display:block;position:absolute;top:-5.5px;left:0\" aria-hidden=\"true\"><path d=\"M22 1.5 L30 7 L22 12.5\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.5\" style=\"stroke:var(--acc-solid)\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div style=\"display:grid;grid-template-columns:35.5px 1fr;gap:13.7px;align-items:start;padding:0 0 12.3px\"><div class=\"f-num\" style=\"font-size:16.4px;color:var(--muted);border:1.4px solid var(--wire2);text-align:center;line-height:30.1px;height:32.8px\">1<\u002Fdiv><div><div class=\"f-name\" style=\"font-size:18.5px\">~700 owner-banks<\u002Fdiv><div class=\"f-meta\">simultaneously customers, owners and governors<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-top:1.4px dotted var(--wire2)\"><\u002Fdiv><div style=\"display:grid;grid-template-columns:35.5px 1fr;gap:13.7px;align-items:start;padding:12.3px 0 12.3px\"><div class=\"f-num\" style=\"font-size:16.4px;color:var(--muted);border:1.4px solid var(--wire2);text-align:center;line-height:30.1px;height:32.8px\">2<\u002Fdiv><div><div class=\"f-name\" style=\"font-size:18.5px\">They set the roadmap <b>and<\u002Fb> the levy that funds it<\u002Fdiv><div class=\"f-meta\">BVR committees · Bundeseinheitliches Strategieportfolio · Aufsichtsrat<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-top:1.4px dotted var(--wire2)\"><\u002Fdiv><div style=\"display:grid;grid-template-columns:35.5px 1fr;gap:13.7px;align-items:start;padding:12.3px 0 12.3px\"><div class=\"f-num\" style=\"font-size:16.4px;color:var(--muted);border:1.4px solid var(--wire2);text-align:center;line-height:30.1px;height:32.8px\">3<\u002Fdiv><div><div class=\"f-name\" style=\"font-size:18.5px\">Atruvia builds once, for all of them<\u002Fdiv><div class=\"f-meta\">agree21 · multi-tenant · IBM Z<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-top:1.4px dotted var(--wire2)\"><\u002Fdiv><div style=\"display:grid;grid-template-columns:35.5px 1fr;gap:13.7px;align-items:start;padding:12.3px 0 12.3px\"><div class=\"f-num\" style=\"font-size:16.4px;color:var(--muted);border:1.4px solid var(--wire2);text-align:center;line-height:30.1px;height:32.8px\">4<\u002Fdiv><div><div class=\"f-name\" style=\"font-size:18.5px\">Regulatory and technical scale economics<\u002Fdiv><div class=\"f-meta\">MaRisk, BAIT and DORA implemented once for ~700 institutions<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-top:1.4px dotted var(--wire2)\"><\u002Fdiv><div style=\"display:grid;grid-template-columns:35.5px 1fr;gap:13.7px;align-items:start;padding:12.3px 0 12.3px\"><div class=\"f-num\" style=\"font-size:16.4px;color:var(--muted);border:1.4px solid var(--wire2);text-align:center;line-height:30.1px;height:32.8px\">5<\u002Fdiv><div><div class=\"f-name\" style=\"font-size:18.5px\">Each member bank stays viable where it could not survive alone<\u002Fdiv><div class=\"f-meta\">compliance and IT cost carried collectively<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-top:1.4px dotted var(--wire2)\"><\u002Fdiv><div style=\"display:grid;grid-template-columns:35.5px 1fr;gap:13.7px;align-items:start;padding:12.3px 0 12.3px\"><div class=\"f-num\" style=\"font-size:16.4px;color:var(--muted);border:1.4px solid var(--wire2);text-align:center;line-height:30.1px;height:32.8px\">6<\u002Fdiv><div><div class=\"f-name\" style=\"font-size:18.5px\">But the banks consolidate anyway<\u002Fdiv><div class=\"f-meta\">40–45 mergers/year · ~820 institutions (2022) → ~670 (2025)<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-top:1.4px dotted var(--wire2)\"><\u002Fdiv><div style=\"display:grid;grid-template-columns:35.5px 1fr;gap:13.7px;align-items:start;padding:12.3px 0 12.3px\"><div class=\"f-num\" style=\"font-size:16.4px;color:var(--acc);border:1.4px solid var(--acc-solid);text-align:center;line-height:30.1px;height:32.8px\">7<\u002Fdiv><div><div class=\"f-name\" style=\"font-size:18.5px\">Fewer, larger owners → more bargaining power → more price resistance → investment squeeze<\u002Fdiv><div class=\"f-meta\">and the pressure lands back on node 1<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"margin-top:8.2px;padding:8.2px 0 0;border-top:1.4px solid var(--acc-solid);font-size:15px;color:var(--acc);font-family:var(--font-heading);letter-spacing:.14em;text-transform:uppercase\">Loop closes — node 7 returns to node 1<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption class=\"fig-c\"><b>Atruvia’s success dissolves its own customer base.<\u002Fb> Every turn of the loop makes the member banks more viable and fewer.<\u002Ffigcaption><\u002Ffigure><p>The five volumes evidence one loop, and the loop is closing.<\u002Fp><pre class=\"pre\">~700 owner-banks — simultaneously customers, owners and governors\n        ↓  (BVR committees, Bundeseinheitliches Strategieportfolio,\n            Kompetenzteams, Aufsichtsrat)\n        set the roadmap AND set the levy that funds it\n        ↓\nAtruvia builds once for all\n(agree21, multi-tenant, IBM Z, four data centres)\n        ↓\nregulatory and technical scale economics\n— MaRisk, BAIT and DORA implemented once for ~700 institutions\n        ↓\neach member bank remains viable when it could not survive alone\n        ↓\nBUT the banks consolidate anyway (40–45 mergers/year;\n   ~820 institutions in 2022 → ~670 by 2025)\n        ↓\nfewer, larger owners → greater individual bargaining power\n   → greater collective price resistance\n        ↓\ninvestment squeeze  ⟲<\u002Fpre><p><strong>The loop's defining property: Atruvia's success is dissolving its own customer base.<\u002Fstrong> It exists to keep small cooperative banks independent, and it succeeds — but the same digital and regulatory pressures that make Atruvia necessary are the pressures driving those banks to merge. Every year Atruvia does its job well, it has fewer, larger, more demanding owners to answer to.<\u002Fp><h2 id=\"s-vi-3\" class=\"hd hd2\"><span class=\"hn mono\">VI.3<\u002Fspan><span class=\"ht\">What the volumes prove together that none proves alone<\u002Fspan><\u002Fh2><p><strong>1. The investment engine is politically capped, not economically capped.<\u002Fstrong><\u002Fp><p><a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-revenue-architecture-unit-economics-capital\">Volume IV<\u002Fa> establishes that the FY2025 AG operating profit of €89.0m is approximately equal to the ~€90m Digitalisierungsumlage — strip the levy and the underlying operating result is close to zero. <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-service-delivery-architecture\">Volume II<\u002Fa> establishes that the levy is set politically, through BVR bodies, not commercially. <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-service-delivery-architecture\">Volume II<\u002Fa> also documents that owners resist it: \"viele Primärbanker stellen immer lauter die Frage, ob das Geld wirklich gut eingesetzt ist.\"<\u002Fp><p>Chain these three and the central mechanism appears: <strong>Atruvia can invest exactly as much as ~700 owner-banks will vote to pay, and no more.<\u002Fstrong> Not as much as the market demands, not as much as competitors spend, not as much as the technology requires. The €450m–€1bn annual sector-investment scenario circulating in the Verbund is not a budget — it is an estimate of the gap between what is needed and what the political mechanism will fund.<\u002Fp><p>This is the study's most important finding, and no single volume states it, because it requires the financial fact, the governance fact and the sentiment evidence together.<\u002Fp><p><strong>2. The lock and the blast radius are the same fact viewed from two sides.<\u002Fstrong><\u002Fp><p><a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-strategic-evolution\">Volume V<\u002Fa> establishes, through the Apobank case, that leaving is ruinous: a mid-sized bank spent a \"mittleren dreistelligen Millionenbetrag\" (third-party estimates around €500m), carried hundreds of significant defects, and watched overall customer satisfaction fall from 82% to 47%. <a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-organisational-infrastructure\">Volume III<\u002Fa> establishes that a single central software fault takes ~490–520 of ~700 banks offline simultaneously — proven twice, in November 2023 and July 2026.<\u002Fp><p>Together: <strong>member banks are captive to a single point of failure they cannot leave.<\u002Fstrong> The concentration that produces the cost advantage produces the systemic risk, and the lock that guarantees the customer base also removes the exit that would otherwise discipline reliability.<\u002Fp><p><a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa> supplies the regulatory coda: Atruvia was <strong>not<\u002Fstrong> designated a DORA Critical ICT Third-Party Provider on the ESAs' first list of 18 November 2025, though <strong>IBM was<\u002Fstrong>. The Article 31 criteria weight cross-border footprint and EU-wide systemic impact; Atruvia is overwhelmingly domestic. So no supervisor holds direct, continuous oversight of an entity whose failure routinely disables around 500 German banks. Finanz Informatik sits in the same gap. <strong>This is a national systemic-supervision blind spot, and it is structural rather than accidental.<\u002Fstrong><\u002Fp><p><strong>3. The most criticised strategic choice is the best-evidenced one.<\u002Fstrong><\u002Fp><p><a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-organisational-infrastructure\">Volume III<\u002Fa> documents the decision to modernise the COBOL/IMS core in place — Java-enablement via the IBM Semeru common runtime, ~1,200 microservices on OpenShift around an unreplaced mainframe core — rather than rip and replace. This looks, from outside, like incumbent conservatism.<\u002Fp><p><a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-strategic-evolution\">Volume V<\u002Fa> supplies the counterfactual evidence: <strong>both attempts at the alternative failed.<\u002Fstrong> Apobank's migration to Avaloq was a public debacle. The seven Sparda-Banken abandoned a joint Sopra Steria build and migrated <em>to<\u002Fem> Atruvia instead. Meanwhile Atruvia has industrialised the opposite capability — 60 migration weekends, 22 institutions since 2021, all eleven Sparda-Banken, M.M. Warburg incoming.<\u002Fp><p><strong>Modernise-in-place is not timidity; it is the only approach with a track record at this scale in this market.<\u002Fstrong> The genuine risk is not the choice but the pace.<\u002Fp><h2 id=\"s-vi-4\" class=\"hd hd2\"><span class=\"hn mono\">VI.4<\u002Fspan><span class=\"ht\">The central tension<\u002Fspan><\u002Fh2><p>The sector built an institution to keep ~700 small banks alive. That institution now needs those banks to fund a permanent technology race that they are, individually, too small to afford — and the act of funding it accelerates the consolidation that removes them.<\u002Fp><p>Every actor is behaving rationally:<\u002Fp><ul class=\"lst\"><li>A small Raiffeisenbank resisting a levy increase is protecting a thin margin.<\u002Fli><li>Atruvia raising the levy is funding the modernisation the banks demand.<\u002Fli><li>The BVR mediating between them is doing its job.<\u002Fli><li>Banks merging to gain scale are responding to the same cost pressure.<\u002Fli><\u002Ful><p>And the aggregate outcome is a slow squeeze. <strong>This is the defining structural problem of the German cooperative banking sector's IT, and Atruvia is where it becomes visible.<\u002Fstrong><\u002Fp><h2 id=\"s-vi-5\" class=\"hd hd2\"><span class=\"hn mono\">VI.5<\u002Fspan><span class=\"ht\">What would falsify the reading<\u002Fspan><\u002Fh2><p>Specific, checkable markers — stated so the study can be audited against reality rather than re-narrated:<\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>If this happens<\u002Fsc-raw-th><sc-raw-th>The reading weakens because<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>The sector agrees a multi-year committed investment framework (not another ad-hoc levy)<\u002Fsc-raw-td><sc-raw-td>The political cap on investment has been lifted<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Atruvia's Betriebsergebnis holds above ~€50m with the Digitalisierungsumlage removed or capped<\u002Fsc-raw-td><sc-raw-td>The margin is structural after all, not levy-equivalence<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Revenue per employee moves materially toward Finanz Informatik's ~€516k<\u002Fsc-raw-td><sc-raw-td>The efficiency gap was business-mix, not capability<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>A central-fault outage affecting &gt;300 banks does not recur before ~2029<\u002Fsc-raw-td><sc-raw-td>The blast-radius risk is being architecturally addressed<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Atruvia is designated a DORA CTPP at a subsequent annual refresh<\u002Fsc-raw-td><sc-raw-td>The supervisory perimeter gap is closing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>A cloud-native vendor wins a German cooperative or savings bank at core scale<\u002Fsc-raw-td><sc-raw-td>The modernise-in-place bet is losing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Atruvia–Finanz Informatik consolidation talks become public<\u002Fsc-raw-td><sc-raw-td>The sector has chosen structural consolidation over parallel funding<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-vi-6\" class=\"hd hd2\"><span class=\"hn mono\">VI.6<\u002Fspan><span class=\"ht\">What Atruvia is becoming<\u002Fspan><\u002Fh2><p>Ranked by probability, on the evidence assembled across all five volumes:<\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Hypothesis<\u002Fsc-raw-th><sc-raw-th>Probability<\u002Fsc-raw-th><sc-raw-th>Strongest evidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Remains a captive cooperative utility, with adjacency drift<\u002Fsc-raw-td><sc-raw-td>~35%<\u002Fsc-raw-td><sc-raw-td>Ownership, Apobank deterrent, sovereignty politics<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Progressively disintermediated at the edges, regulated core intact<\u002Fsc-raw-td><sc-raw-td>~25%<\u002Fsc-raw-td><sc-raw-td>BaaS/fintech module erosion; neobank pressure on member banks<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Payments and card processor of national significance<\u002Fsc-raw-td><sc-raw-td>~15%<\u002Fsc-raw-td><sc-raw-td>VR Payment Issuing-Processing from 1 January 2027<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Merges or deeply consolidates with Finanz Informatik<\u002Fsc-raw-td><sc-raw-td>~12% and rising<\u002Fsc-raw-td><sc-raw-td>Identical structures; joint FH Münster training venture; sector cost logic<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Restructured by the sector after an investment or governance crisis<\u002Fsc-raw-td><sc-raw-td>~10%<\u002Fsc-raw-td><sc-raw-td>The funding gap; thin free cash flow (~€38m FY2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Becomes a genuinely commercial open-market vendor<\u002Fsc-raw-td><sc-raw-td>~3%<\u002Fsc-raw-td><sc-raw-td>Rhetoric only; no open-market core wins<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Synthesis:<\u002Fstrong> a captive utility drifting toward commercial adjacencies, with sector consolidation — either with Finanz Informatik or through crisis-driven restructuring — as the most consequential live option.<\u002Fp><h2 id=\"s-vi-7\" class=\"hd hd2\"><span class=\"hn mono\">VI.7<\u002Fspan><span class=\"ht\">Implications for a fintech builder<\u002Fspan><\u002Fh2><p><em>This section applies the study to the reader's own context rather than to Atruvia. Analytical inference throughout.<\u002Fem><\u002Fp><p><strong>This is what \"the incumbent\" actually looks like — and it explains your integration timelines.<\u002Fstrong> When a German bank partner takes nine months to expose an API, the reason is usually visible in <a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-organisational-infrastructure\">Volume III<\u002Fa>: the change must traverse a multi-tenant platform serving hundreds of institutions, pass a MaRisk AT 8.2 change assessment at each one, and land in a release train coordinated across the Verbund. This is not incompetence; it is the arithmetic of building once for 700 banks. Budget integration time against that reality, not against a startup's release cadence.<\u002Fp><p><strong>Attack the edges, never the core.<\u002Fstrong> <a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-strategic-evolution\">Volume V<\u002Fa>'s competitive analysis is unambiguous: no cloud-native vendor has won a German cooperative or savings bank at core-system scale, and the two serious attempts at leaving (Apobank, Sparda/Sopra) failed expensively. But the edges — digital channels, BaaS modules, corporate banking tooling, analytics — are where Atruvia itself identifies erosion risk. That is where a fintech competes with an incumbent utility, and where a partnership is more plausible than displacement.<\u002Fp><p><strong>The build-once regulatory asymmetry is the harshest number in the study for a startup.<\u002Fstrong> Atruvia implements MaRisk, BAIT and DORA once and amortises it across ~700 institutions and ~97m accounts. You implement the equivalent once, for yourself. That asymmetry is why compliance cost per customer is brutal at small scale and why it improves faster than almost any other line as you grow. Model it as a fixed cost with a very long amortisation runway, not as a variable one.<\u002Fp><p><strong>DORA Article 31 is worth reading properly if you ever become critical to EU financial entities.<\u002Fstrong> The designation criteria weight cross-border footprint and EU-wide systemic impact heavily. Atruvia — systemically critical to German banking but domestic-only — escaped designation while IBM did not. The practical lesson runs both ways: cross-border scale attracts direct ESA oversight, and single-market concentration can leave a genuine supervisory gap. Know which side of that line your architecture puts you on before regulators decide for you.<\u002Fp><p><strong>On core systems, the evidence favours in-place modernisation over replacement.<\u002Fstrong> Two well-funded attempts at rip-and-replace failed in this market within five years. If you ever inherit or acquire a core — through an acquisition, a licence deal, or a sponsor-bank arrangement — the Apobank case is the best-documented cautionary evidence available in German banking, and it is worth reading before anyone in the room says \"we'll just migrate.\"<\u002Fp><p><strong>Finally, a governance lesson that transfers beyond banking.<\u002Fstrong> Atruvia demonstrates what happens when customers, owners and governors are the same people: pricing loses its signal, accountability blurs across three roles, and investment becomes a political negotiation rather than a commercial decision. If you ever structure a shared entity with your own customers — a consortium, a joint venture, a mutualised utility — this study is the cautionary case for separating those three roles explicitly.<\u002Fp><h2 id=\"s-vi-8\" class=\"hd hd2\"><span class=\"hn mono\">VI.8<\u002Fspan><span class=\"ht\">Ten cross-volume conclusions<\u002Fspan><\u002Fh2><ol class=\"lst\"><li>Atruvia is a shared organ of the cooperative sector, not a company — reading it as a firm produces category errors at every turn.<\u002Fli><li>The reported operating profit is the digitalisation levy; strip the levy and the underlying result is near zero.<\u002Fli><li>Investment is politically capped by owner willingness to pay, not economically capped by opportunity.<\u002Fli><li>Atruvia's success dissolves its own customer base: it keeps small banks alive while the pressures it addresses drive them to merge.<\u002Fli><li>The lock (Apobank-proven) and the blast radius (~490–520 banks per central fault) are the same concentration viewed from two sides.<\u002Fli><li>Atruvia is a national systemic node outside direct DORA oversight while its supplier IBM is inside — a structural supervisory gap shared with Finanz Informatik.<\u002Fli><li>Modernise-in-place is the best-evidenced strategic choice in the study, validated by the failure of both alternatives; the risk is pace, not direction.<\u002Fli><li>The genuine, exit-independent advantages are industrialised migration capability and accumulated regulatory capability — everything else labelled \"moat\" is lock.<\u002Fli><li>Finanz Informatik is materially more efficient per employee, and the gap is only partly explained by business mix.<\u002Fli><li>The most consequential live option is sector consolidation — with Finanz Informatik, or through a crisis-driven restructuring.<\u002Fli><\u002Fol><div class=\"sep\"><\u002Fdiv><\u002Fsection><section class=\"sec\" data-part=\"7\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Appendix A<\u002Fspan><a href=\"#contents\">Reference matter &nbsp;·&nbsp; Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">A<\u002Fspan><\u002Fdiv><h1 id=\"app-a-appendix-a-glossary-of-german-terms\" class=\"part\" data-short=\"Appendix A — Glossary of German Terms\">Glossary of German Terms<\u002Fh1><p class=\"opener-s\">Load-bearing — read this before Part IV.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">Appendix A<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">6<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Read before<\u002Fdiv><div class=\"plate-v\">Part IV<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-accounting-and-financial\"><span>Accounting and financial<\u002Fspan><\u002Fa><a href=\"#s-pricing-and-charging\"><span>Pricing and charging<\u002Fspan><\u002Fa><a href=\"#s-corporate-and-governance\"><span>Corporate and governance<\u002Fspan><\u002Fa><a href=\"#s-sector-and-institutional\"><span>Sector and institutional<\u002Fspan><\u002Fa><a href=\"#s-technology-and-operations\"><span>Technology and operations<\u002Fspan><\u002Fa><a href=\"#s-regulatory\"><span>Regulatory<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><p><em>Load-bearing. Read before <a class=\"xr\" href=\"#part-iv-part-iv-financial-statements-revenue-architecture-unit-economics-capital\">Part IV<\u002Fa>.<\u002Fem><\u002Fp><h2 id=\"s-accounting-and-financial\" class=\"hd hd2\"><span class=\"ht\">Accounting and financial<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Term<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Gesamtleistung<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Total output. Umsatzerlöse + aktivierte Eigenleistungen + inventory change. <strong>Not revenue<\u002Fstrong> — margins on this base differ from margins on revenue<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Umsatzerlöse<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Revenue proper (sales)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Aktivierte Eigenleistungen<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Capitalised own work — internally developed software capitalised rather than expensed<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Betriebsergebnis<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Operating result (≈ EBIT, but on an HGB basis)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Jahresüberschuss<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Net income for the year<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Materialaufwand<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Cost of materials and bought-in services — for Atruvia, largely IBM licensing and external/nearshore capacity<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Personalaufwand<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Personnel expense<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Abschreibungen<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Depreciation and amortisation<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Rückstellungen<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Provisions (notably Pensionsrückstellungen — pension provisions)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Eigenkapitalquote<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Equity ratio<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Investitionsquote<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Capex as a share of output<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Zielrendite<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Target return (Atruvia's stated 4% of revenue)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>HGB<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Handelsgesetzbuch — the German Commercial Code; the accounting basis, not IFRS<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Kapitalerhöhung<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Capital increase (share issuance)<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-pricing-and-charging\" class=\"hd hd2\"><span class=\"ht\">Pricing and charging<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Term<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Umlage<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A levy or apportionment — a charge allocated across members. Central to Atruvia's economics<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>IT-Sonderumlage<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The special IT levy, ~€60m/year from member banks 2018–2023<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Digitalisierungsumlage<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The digitalisation levy, €30m → €60m → €90m (2023–2025)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>L nology-and-regulatory\" class=\"hd hd2\"><span class=\"ht\">Technology and regulatory<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Figure<\u002Fsc-raw-th><sc-raw-th>Canonical value<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Mainframe estate<\u002Fsc-raw-td><sc-raw-td>Eight IBM z15 hosting twelve IMS systems (2022 baseline); <strong>z17<\u002Fstrong> under the deal signed 19 November 2025<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Peak throughput<\u002Fsc-raw-td><sc-raw-td>~12,000 transactions/second<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Java-enabled core transactions<\u002Fsc-raw-td><sc-raw-td>~85% (via IBM Semeru common runtime)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Java microservices<\u002Fsc-raw-td><sc-raw-td>~1,200 on Red Hat OpenShift<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DORA CTPP status<\u002Fsc-raw-td><sc-raw-td><strong>Not designated<\u002Fstrong> (18 November 2025 first list); <strong>IBM was designated<\u002Fstrong>, Lead Overseer EBA<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>BaFin §44 inspections<\u002Fsc-raw-td><sc-raw-td>May–August 2018 (15 findings, 3 severe) and from November 2023<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Bank merger migrations<\u002Fsc-raw-td><sc-raw-td>40–45 per year<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-benchmark-finanz-informatik\" class=\"hd hd2\"><span class=\"ht\">Benchmark — Finanz Informatik<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Figure<\u002Fsc-raw-th><sc-raw-th>FI<\u002Fsc-raw-th><sc-raw-th>Atruvia<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Revenue<\u002Fsc-raw-td><sc-raw-td>~€2.6bn (2024)<\u002Fsc-raw-td><sc-raw-td>~€2.2bn Group (2024)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Employees<\u002Fsc-raw-td><sc-raw-td>5,037 FTE<\u002Fsc-raw-td><sc-raw-td>10,076 Group / 5,847 AG<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Accounts<\u002Fsc-raw-td><sc-raw-td>~114m<\u002Fsc-raw-td><sc-raw-td>91–97m<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Technical transactions<\u002Fsc-raw-td><sc-raw-td>&gt;205bn<\u002Fsc-raw-td><sc-raw-td>~80bn+<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Revenue per employee<\u002Fsc-raw-td><sc-raw-td>~€516k<\u002Fsc-raw-td><sc-raw-td>~€218k Group / ~€324k AG<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Core platform<\u002Fsc-raw-td><sc-raw-td>OSPlus<\u002Fsc-raw-td><sc-raw-td>agree21<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DORA CTPP<\u002Fsc-raw-td><sc-raw-td>Not designated<\u002Fsc-raw-td><sc-raw-td>Not designated<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><div class=\"sep\"><\u002Fdiv><\u002Fsection><section class=\"sec\" data-part=\"9\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Appendix C<\u002Fspan><a href=\"#contents\">Reference matter &nbsp;·&nbsp; Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">C<\u002Fspan><\u002Fdiv><h1 id=\"app-c-appendix-c-reconciliation-of-cross-volume-discrepancies\" class=\"part\" data-short=\"Appendix C — Reconciliation of Cross-Volume Discrepancies\">Reconciliation of Cross-Volume Discrepancies<\u002Fh1><p class=\"opener-s\">Where the volumes disagree, and which figure governs.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">Appendix C<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">3<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Resolves<\u002Fdiv><div class=\"plate-v\">Perimeter breaks<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-perimeter-and-measurement-differences-not-errors\"><span>Perimeter and measurement differences (not errors)<\u002Fspan><\u002Fa><a href=\"#s-genuine-errors-and-corrections\"><span>Genuine errors and corrections<\u002Fspan><\u002Fa><a href=\"#s-known-unknowns-carried-forward\"><span>Known unknowns carried forward<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><p>The volumes were written sequentially against a moving evidence base, and Atruvia's figures conflict more than most companies' — overwhelmingly for legitimate reasons (different perimeters, different dates, different measurement layers) rather than error. These are resolved here rather than silently smoothed.<\u002Fp><h2 id=\"s-perimeter-and-measurement-differences-not-errors\" class=\"hd hd2\"><span class=\"ht\">Perimeter and measurement differences (not errors)<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>#<\u002Fsc-raw-th><sc-raw-th>Item<\u002Fsc-raw-th><sc-raw-th>Appears as<\u002Fsc-raw-th><sc-raw-th>Resolution<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td><strong>Revenue<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>AG €1,921.0m Gesamtleistung / AG €1,894.4m Umsatzerlöse / \"knapp €1.9bn\" / Group ~€2.2bn / Group ~€2.5bn / €2.001bn<\u002Fsc-raw-td><sc-raw-td><strong>All correct at their perimeter and year.<\u002Fstrong> €2.001bn is the FY2023 <em>Group<\u002Fem> figure; ~€2.2bn is FY2024 Group; ~€2.5bn is FY2025 Group; the €1.9bn figures are AG. Never splice.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td><strong>Employees<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>5,263 / 5,483 / 5,847 / 9,291 / 10,076<\u002Fsc-raw-td><sc-raw-td>AG series (5,263 in 2023 → 5,847 in 2025) versus Group series (9,291 in 2022 → 10,076 in 2024). Both rising.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td><strong>Accounts<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>82m / 85m / 89m / 91m / 97m<\u002Fsc-raw-td><sc-raw-td>A <strong>rising series<\u002Fstrong>, not a conflict. 97m is current (2025). The 82m figure is an older third-party citation.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td><strong>Cooperative banks<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>~646 / ~670 / \"gut 700\" / ~730 / ~820 / ~917 customers / &gt;1,000 institutions<\u002Fsc-raw-td><sc-raw-td>Different <strong>populations and dates<\u002Fstrong>. 646 is the BVR's count of cooperative banks at end-2025; ~820 was 2022; ~917 \"customers\" includes private banks and non-banks; \"&gt;1,000 financial institutions\" counts the whole group's client base.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td><strong>Transactions<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>9.32bn / ~10bn bookings versus 80bn / 87bn / 100bn / 120bn technical<\u002Fsc-raw-td><sc-raw-td><strong>Different layers.<\u002Fstrong> Bookings are customer-visible business events; IBM's figure counts IMS technical transactions, roughly 8–13 per booking. The IBM number rises across years with digital-channel growth. Non-comparable, not contradictory.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td><strong>Serviscope revenue<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>€28.8m versus Gesamtleistung ~€44.0m<\u002Fsc-raw-td><sc-raw-td>Revenue versus Gesamtleistung — the HGB distinction again.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td><strong>Betriebsergebnis 2025<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>AG €89.0m versus Group €118.2m falling to €77.9m guidance<\u002Fsc-raw-td><sc-raw-td>AG versus Group. The Coenen interview figures are Group.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td><strong>Finanz Informatik employees<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>5,037 versus ~6,500<\u002Fsc-raw-td><sc-raw-td>5,037 is FTE for the FI legal entity (Jahresbericht 2024); ~6,500 is a broader group basis.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td><strong>FI technical transactions<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>&gt;205bn versus ~172bn<\u002Fsc-raw-td><sc-raw-td>&gt;205bn is the current (end-2024) figure; ~172bn is an older career-site number.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-genuine-errors-and-corrections\" class=\"hd hd2\"><span class=\"ht\">Genuine errors and corrections<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>#<\u002Fsc-raw-th><sc-raw-th>Item<\u002Fsc-raw-th><sc-raw-th>Status<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>10<\u002Fsc-raw-td><sc-raw-td><strong>\"DZ Bank owns ~20% of Atruvia\"<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>FALSE.<\u002Fstrong> DZ Bank holds ~0.35% directly. The ~20% figure belongs to <strong>Verimi<\u002Fstrong>. This error circulates widely (including on the-playbook.de) and should be expected in further sources. DZ Bank is a <em>funder<\u002Fem> — it contributed €180m to the IT-Sonderumlage and provides the Karlsruhe campus loan — not an owner.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>11<\u002Fsc-raw-td><sc-raw-td><strong>\"Six data centres\"<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Unsupported.<\u002Fstrong> Atruvia's own statement is \"jeweils zwei Rechenzentren in Karlsruhe und Münster\" — <strong>four<\u002Fstrong>, corroborated by IBM. The \"six\" claim (Grokipedia) has no primary basis.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>12<\u002Fsc-raw-td><sc-raw-td><strong>\"Founded in 1924 by Martin Beyer\"<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>FALSE<\u002Fstrong> (Tracxn/PitchBook). Fiducia was founded 13 November 1924; Martin Beyer was an executive 2013–2025.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>13<\u002Fsc-raw-td><sc-raw-td><strong>audIT \"completed 31 December 2021\"<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Imprecise.<\u002Fstrong> Material remediation points were reached by end-2021, but Berechtigungsmanagement work extended beyond, with Verbund timelines cited toward 2023. <a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-organisational-infrastructure\">Volume III<\u002Fa> corrected this.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>14<\u002Fsc-raw-td><sc-raw-td><strong>Outage causes conflated<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The <strong>November 2023<\u002Fstrong> outage root cause was <strong>not publicly disclosed<\u002Fstrong>. The \"fehlerhaftes Software-Update\" attribution belongs to a <strong>December 2021<\u002Fstrong> event. Distinct incidents — do not merge. <a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-strategic-evolution\">Volume V<\u002Fa> flagged this.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>15<\u002Fsc-raw-td><sc-raw-td><strong>\"neues Betriebsmodell\"<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Two different things.<\u002Fstrong> The internal agile reorganisation (Spotify-model tribes/squads) dates from ~2020–21. The \"neues Betriebsmodell\" introduced from 2025 is a <strong>product and process programme for the member banks<\u002Fstrong>, targeting a €2.6bn gross earnings effect by 2035. <a class=\"xr\" href=\"#part-v-part-v-management-culture-competition-moat-risk-strategic-evolution\">Volume V<\u002Fa> corrected <a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-organisational-infrastructure\">Volume III<\u002Fa>'s implication.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>16<\u002Fsc-raw-td><sc-raw-td><strong>parcIT series<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>Discontinuous.<\u002Fstrong> 403 employees/€68.9m (GB2022) → 478/€69.8m (GB2023) → 507/€78.6m (FY2024) reflects a perimeter or consolidation change, not organic growth. Do not read as a trend.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>17<\u002Fsc-raw-td><sc-raw-td><strong>Mainframe generation<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>z15 is the 2022 IBM case-study baseline; <strong>z17<\u002Fstrong> is committed under the November 2025 deal. A z16 interim is likely but <strong>undocumented — <span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-known-unknowns-carried-forward\" class=\"hd hd2\"><span class=\"ht\">Known unknowns carried forward<\u002Fspan><\u002Fh2><ul class=\"lst\"><li>VR Payment Issuing-Processing purchase price (Bundeskartellamt case B9-75/26, filed 15 July 2026).<\u002Fli><li>Executive compensation (unlisted AG — no individual disclosure).<\u002Fli><li>Per-bank, per-account and per-workstation price levels; only percentage changes are public.<\u002Fli><li>Contractual SLAs, service credits and liability caps for outages.<\u002Fli><li>agree21 internal data model and tenant-separation mechanism.<\u002Fli><li>Reconciliation architecture internals.<\u002Fli><li>Published availability SLOs, RTO/RPO.<\u002Fli><li>Group FY2025 full P&amp;L and balance sheet (behind paywall).<\u002Fli><li>IBM z17 total contract value and lease-versus-purchase split.<\u002Fli><li>Whether any cooperative bank other than Apobank has attempted exit.<\u002Fli><li>ISO 27001 / IDW PS 951 / ISAE 3402 certification scopes and KRITIS registration status.<\u002Fli><\u002Ful><div class=\"sep\"><\u002Fdiv><\u002Fsection><section class=\"sec\" data-part=\"10\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Appendix D<\u002Fspan><a href=\"#contents\">Reference matter &nbsp;·&nbsp; Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">D<\u002Fspan><\u002Fdiv><h1 id=\"app-d-appendix-d-source-hierarchy-evidence-conventions\" class=\"part\" data-short=\"Appendix D — Source Hierarchy &amp; Evidence Conventions\">Source Hierarchy &amp; Evidence Conventions<\u002Fh1><p class=\"opener-s\">How every claim in this study was graded.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">Appendix D<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">—<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Grades<\u002Fdiv><div class=\"plate-v\">Six evidence labels<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><p>Sources were prioritised in the following order, with primary evidence preferred wherever it existed:<\u002Fp><ol class=\"lst\"><li><strong>Bundesanzeiger<\u002Fstrong> filings — Atruvia AG Jahresabschlüsse and Konzernabschlüsse, and those of the subsidiaries. German filing law makes these public, giving this study a materially better evidence base than a private company in most jurisdictions would afford.<\u002Fli><li><strong>Atruvia's own Geschäftsberichte<\u002Fstrong> (published as microsites gb2021–gb2025 with Finanzteil PDFs), press releases, Hauptversammlung coverage and technology pages.<\u002Fli><li><strong>Handelsregister filings<\u002Fstrong> via the Unternehmensregister and Northdata (HRB 102381, Amtsgericht Frankfurt am Main).<\u002Fli><li><strong>IBM case studies and press releases<\u002Fstrong> — the richest technical source on the mainframe estate, IMS/Db2, Java-on-Z and the z17 agreement.<\u002Fli><li><strong>BaFin, Bundesbank, BSI and the ESAs<\u002Fstrong> — outsourcing guidance, BAIT, MaRisk, and the DORA CTPP designation lists.<\u002Fli><li><strong>BVR and Genossenschaftliche FinanzGruppe<\u002Fstrong> publications.<\u002Fli><li><strong>German specialist press<\u002Fstrong> — Finanz-Szene, Börsen-Zeitung, DER PLATOW Brief, IT-Finanzmagazin, Handelsblatt, Der Bank Blog, Bankinformation, Computerwoche, heise online, and Verband magazines.<\u002Fli><li><strong>Atruvia job advertisements<\u002Fstrong> — an unusually productive window into the internal stack, naming concrete systems, frameworks and organisational units.<\u002Fli><li><strong>Finanz Informatik<\u002Fstrong> Jahresbericht and press releases for benchmarking.<\u002Fli><li>Employee review platforms (Kununu, Glassdoor), used cautiously, labelled, with sample sizes where available.<\u002Fli><\u002Fol><p>SEO-oriented aggregators were not relied on where primary evidence existed; where such sources were the only ones available (notably for outage timing and breadth), this is flagged in text. For strategically significant claims, sources were triangulated. Where reputable sources disagreed, the disagreement is identified, dates and perimeters compared, and uncertainty preserved rather than resolved by false precision.<\u002Fp><p><strong>A note on the prohibition against invented architecture.<\u002Fstrong> <a class=\"xr\" href=\"#part-iii-part-iii-operations-technology-data-organisational-infrastructure\">Volume III<\u002Fa> in particular was written under an absolute rule: where Atruvia has published nothing about an internal mechanism, the report says <span class=\"ev\">UNKNOWN<\u002Fspan> rather than describing plausible-sounding but unevidenced internals. Several sections are consequently shorter than their headings might suggest. That is deliberate.<\u002Fp><div class=\"sep\"><\u002Fdiv><p><em>End of the Atruvia Enterprise Reverse-Engineering Study.<\u002Fem><\u002Fp><\u002Fsection><\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const scroller = () => {\n      let n = document.querySelector('.doc');\n      while (n && n !== document.body) {\n        const s = getComputedStyle(n);\n        if (/(auto|scroll)/.test(s.overflowY) && n.scrollHeight > n.clientHeight + 4) return n;\n        n = n.parentElement;\n      }\n      const de = document.documentElement;\n      return de.scrollHeight > de.clientHeight + 4 ? de : (document.body.scrollHeight > document.body.clientHeight + 4 ? document.body : de);\n    };\n    const upd = () => {\n      const doc = document.querySelector('.doc');\n      if (doc) doc.setAttribute('data-spy', '1');\n      const hs = Array.prototype.slice.call(document.querySelectorAll('h1.part'));\n      if (!hs.length) return;\n      let idx = 0;\n      for (let i = 0; i < hs.length; i++) { if (hs[i].getBoundingClientRect().top <= 200) idx = i; }\n      const items = document.querySelectorAll('.p-i');\n      for (let i = 0; i < items.length; i++) items[i].classList.toggle('on', i === idx);\n      const cur = document.getElementById('nav-cur');\n      if (cur && hs[idx]) cur.textContent = hs[idx].getAttribute('data-short') || '';\n      const bar = document.getElementById('nav-bar');\n      if (bar) {\n        const d = scroller();\n        const p = d.scrollTop / Math.max(1, d.scrollHeight - d.clientHeight);\n        bar.style.width = (Math.min(1, Math.max(0, p)) * 100).toFixed(2) + '%';\n      }\n      const on = document.querySelector('.p-i.on');\n      if (on && this._last !== idx) {\n        this._last = idx;\n        const nav = document.querySelector('.side');\n        if (nav) {\n          const r = on.getBoundingClientRect(), nr = nav.getBoundingClientRect();\n          if (r.top < nr.top + 60 || r.bottom > nr.bottom - 40) nav.scrollTop += r.top - nr.top - 120;\n        }\n      }\n    };\n    let tick = false;\n    this._onScroll = () => { if (tick) return; tick = true; requestAnimationFrame(() => { tick = false; upd(); }); };\n    // scroll does not bubble — capture on window catches it from any scrolling ancestor\n    window.addEventListener('scroll', this._onScroll, { passive: true, capture: true });\n    document.addEventListener('scroll', this._onScroll, { passive: true, capture: true });\n    window.addEventListener('resize', this._onScroll, { passive: true });\n    window.addEventListener('hashchange', this._onScroll);\n    this._iv = setInterval(upd, 700);\n    upd();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll, true);\n    document.removeEventListener('scroll', this._onScroll, true);\n    window.removeEventListener('resize', this._onScroll);\n    window.removeEventListener('hashchange', this._onScroll);\n    clearInterval(this._iv);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
