not practically leave it, and route their entire regulated existence through it. The one exit precedent (Apobank→Avaloq, 2020) cost a \"mittleren dreistelligen Millionenbetrag\" (Finanz-Szene estimated ~€500m all-in), left ~2,500 bugs (500 in the \"signifikant\" category — a count Apobank disputed as \"nicht nachvollziehen\"), and collapsed customer satisfaction from 82% to 47% overall — it stands as a cautionary tale, not a template.<\u002Fli><li>The genuine, hard-to-replicate strengths are industrialised bank migration (60 migration weekends, all 11 Sparda-Banken onboarded, M.M. Warburg incoming) and accumulated regulatory/compliance capability; the rest of the \"moat\" is lock-in that risks producing under-investment, a thin FY2025 Betriebsergebnis of €89.0m at a 4.7% margin roughly equal to the ~€90m Digitalisierungsumlage, and a repeated outage record (2020 system-changeover, 2021 DDoS, 2023 up-to-520-banks, July 2026 ~490 banks).<\u002Fli><li>The captive utility model is sustainable for another decade ONLY if the sector resolves the investment-funding question (the circulating €450m–€1bn/yr scenario), contains IBM dependency (deliberately deepened by the 19 November 2025 z17 deal), and manages consolidation of its shrinking owner base — the single most plausible structural endgame is a partial or full consolidation with Finanz Informatik.<\u002Fli><\u002Ful><h2 id=\"s-key-findings-4\" class=\"hd hd2\"><span class=\"ht\">Key Findings<\u002Fspan><\u002Fh2><p><strong>1. Leadership is a lineage of institutional stewards, not founders — and accountability is real but muffled.<\u002Fstrong> Klaus-Peter Bruns (CEO 2006–2019) architected the 2015 merger and the agree21 \"Mondlandung,\" then departed in the fallout of the 2018 BaFin special inspection (15 findings, 3 severe). Martin Beyer (34 years, spokesman 2019–2025) presided over migration completion, the 2021 rebrand and the pivot to a 4% Zielrendite, then left abruptly in June 2025 amid reported friction with co-CEO Coenen. The 2025–26 Vorstand refresh injected commercial-bank DNA (Kaurin ex-Barclays/ING-DiBa; Wiegelmann ex-BayernLB CFO; Japec ex-Commerzbank) into a cooperative utility — a clear signal of commercialisation and regulatory-hardening intent.<\u002Fp><p><strong>2. The central question — why banks stay — resolves to \"an unavoidable deal that is nonetheless mostly a reasonable one.\"<\u002Fstrong> Ownership, ecosystem integration (DZ Bank clearing, Union Investment, R+V, VR Payment, BVR reporting all run through agree21), regulatory posture and the absence of a cooperative-specific alternative make staying rational; but the levies, ~5% annual price rises, negligible small-bank influence and outage exposure are the price. Members are not trapped in a bad deal, but they are trapped, and that removes the discipline that would prove it is a good one.<\u002Fp><p><strong>3. The mainframe is not the bottleneck; investment-funding governance is.<\u002Fstrong> Atruvia modernised COBOL in place (~85% Java-enabled via IBM Semeru) rather than replacing the core — a defensible, path-dependent choice validated by the Apobank and Sparda/Sopra failures. The binding constraint is the sector's willingness to fund the modernisation the front-runners can afford: FY2025 free cash flow was only ~€38m, capex hit €359.1m (18.7% Investitionsquote), and Coenen has openly floated an additional levy for the digital euro alone.<\u002Fp><h2 id=\"s-details-4\" class=\"hd hd2\"><span class=\"ht\">Details<\u002Fspan><\u002Fh2><h2 id=\"s-v-1\" class=\"hd hd2\"><span class=\"hn mono\">V.1<\u002Fspan><span class=\"ht\">Institutional Architects and Leadership Lineage (replaces Founder Analysis)<\u002Fspan><\u002Fh2><p><strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan>.<\u002Fstrong> Atruvia has no founder. Its institutional DNA descends from two lineages: Fiducia (Fiducia Revisions- und Treuhand-Institut AG, founded 13 November 1924, Karlsruhe, \"agree\" system, south) and GAD eG (founded 26 December 1963, Münster, \"bank21,\" north). The two attempted merger several times and failed; DER PLATOW Brief's characterisation — \"Mehr als einmal haben die beiden genossenschaftlichen IT-Dienstleister Fiducia und GAD einen Anlauf zur Fusion genommen, nur um dann kurz vor der Zielgeraden den Deal doch noch platzen zu lassen\" — captures the pre-2013 history. The Aufsichtsräte approved the decisive merger 30 September / 1 October 2014; owners approved November–December 2014; it became legally effective 1 July 2015 as Fiducia &amp; GAD IT AG.<\u002Fp><p><strong>The Bruns era (2006–2019): merger architect and accountability casualty.<\u002Fstrong> Klaus-Peter Bruns led Fiducia from 2006 and, per Aufsichtsrat chair Jürgen Brinkmann, \"hat maßgeblich den Zusammenschluss der ehemals zwei IT-Dienstleister Fiducia und GAD 2015 gestaltet.\" Two path-dependent decisions define his legacy:<\u002Fp><ul class=\"lst\"><li><strong>Choosing agree21 over bank21 (<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: decisive path lock-in).<\u002Fstrong> The merged entity adopted a common core \"das im Kern auf agree basiert,\" extended with bank21 components; all ~400 former GAD banks were migrated onto it by 2019. This meant the <em>northern<\u002Fem> (GAD/Münster) banks bore the migration pain — a political choice that concentrated disruption and set the template for Atruvia's later industrialised migration capability.<\u002Fli><li><strong>The captive levy-funded investment model.<\u002Fstrong> The 2015 merger targeted ~€125m/yr in synergies via cost cuts (including ~939 of 5,500 positions removed without layoffs), with Bruns framing the deal's logic bluntly at the 2016 HV: \"Unser Zusammenschluss ergibt für unsere Eigentümer nur Sinn, wenn unter dem Strich mehr herauskommt als vorher.\"<\u002Fli><\u002Ful><p>Bruns's departure is the cleanest accountability event in the company's history. He announced in spring 2019 he would not renew beyond 2019; the Börsen-Zeitung reported the Aufsichtsrat was \"überrascht\" and the step had \"persönliche\" motives. But the Handelsblatt's December 2019 exposé of the BaFin report drew the causal line explicitly: \"Das Ausmaß der Kritik an der Fiducia wirft Fragen nach den Gründen für das Ausscheiden des früheren Vorstandsvorsitzenden Klaus-Peter Bruns und von Vizechef Carsten Pfläging auf.\" Pfläging left months earlier; Bruns \"ist seit Mitte Oktober [2019] ebenfalls nicht mehr bei Fiducia GAD.\" <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> the \"persönliche\" framing was face-saving; the timing and the severity of the 2018 findings make the departures substantively accountability-driven, even if never formally attributed.<\u002Fp><p><strong>The Beyer era (2019–2025): stabiliser, rebrand, and the 4% pivot.<\u002Fstrong> Martin Beyer took over as co-spokesman (with Jens-Olaf Bartels) in August 2019 \"in einer äußerst schwierigen Phase\" (Keller). He was 34 years with the company/predecessors, board from 2013. His tenure delivered: completion of the agree21 series migration (60 migration weekends, ~60,000 bank workstations), the 1 September 2021 rebrand to Atruvia, the agile transformation, and the pivot to treating operating profit as investment fuel. Beyer's own framing of the finance strategy (2024): \"Unsere Finanzstrategie basiert darauf, dass wir notwendige Investitionen künftig aus eigener Kraft tätigen. Wir wollen daher unser Betriebsergebnis steigern.\" His exit on 30 June 2025 was officially \"einvernehmlich,\" but ChannelPartner reported it \"erfolgte … aber nicht ganz freiwillig, es hätte 'Verstimmungen' zwischen den beiden Co-CEOs\" gegeben. He received the DGRV's Raiffeisen-Schulze-Delitzsch gold medal — a valedictory honour consistent with a managed, dignified exit. <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> the combination of \"mission accomplished\" rhetoric, the gold medal, and the reported friction indicates a board choosing generational renewal and a single clear leader (Coenen) over a co-spokesman structure that had produced tension.<\u002Fp><p><strong>Beliefs consistently reflected in strategy:<\u002Fstrong> (a) sovereignty/independence (\"digitale Souveränität,\" reinforced in the IBM deal); (b) migration as core competence; (c) modernise-in-place over rip-and-replace; (d) partnership rhetoric (\"Digitalisierungspartner\"). <strong>Beliefs that changed:<\u002Fstrong> from pure cost-utility (Bruns's synergy logic) toward a commercial, revenue-reinvesting, adjacency-expanding posture (Coenen's \"Aktionsradius erweitern\").<\u002Fp><h2 id=\"s-v-2\" class=\"hd hd2\"><span class=\"hn mono\">V.2<\u002Fspan><span class=\"ht\">Current Management Team<\u002Fspan><\u002Fh2><p><strong><span class=\"ev\">CONFIRMED FACT<\u002Fspan> — the five-member Zielbild Vorstand (complete since 1 January 2026):<\u002Fstrong><\u002Fp><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Member<\u002Fsc-raw-th><sc-raw-th>Ressort<\u002Fsc-raw-th><sc-raw-th>Since<\u002Fsc-raw-th><sc-raw-th>Prior background<\u002Fsc-raw-th><sc-raw-th>Signal<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Ulrich Coenen (52)<\u002Fsc-raw-td><sc-raw-td>Vorstandssprecher, Corporate Strategy &amp; Development<\u002Fsc-raw-td><sc-raw-td>Board Aug 2020; sole spokesman Jul 2025<\u002Fsc-raw-td><sc-raw-td>Bereichsvorstand Commerzbank; Geschäftsleitung E-Plus<\u002Fsc-raw-td><sc-raw-td>Commercial-strategic continuity; telco/retail-bank instincts<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Daniela Bücker<\u002Fsc-raw-td><sc-raw-td>Core Banking &amp; Technology<\u002Fsc-raw-td><sc-raw-td>2020<\u002Fsc-raw-td><sc-raw-td>Internal/technology<\u002Fsc-raw-td><sc-raw-td>Technical continuity; platform-architecture voice<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Julia Japec<\u002Fsc-raw-td><sc-raw-td>Customer Success<\u002Fsc-raw-td><sc-raw-td>1 May 2025<\u002Fsc-raw-td><sc-raw-td>ex-Commerzbank<\u002Fsc-raw-td><sc-raw-td>Customer/sales professionalisation<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Željko Kaurin<\u002Fsc-raw-td><sc-raw-td>Digital Banking<\u002Fsc-raw-td><sc-raw-td>1 Nov 2025<\u002Fsc-raw-td><sc-raw-td>ex-COO Barclays Bank Europe; 20+ yrs ING-DiBa<\u002Fsc-raw-td><sc-raw-td>Digital-retail-banking scaling; payments<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Dr Markus Wiegelmann (56)<\u002Fsc-raw-td><sc-raw-td>Finance, Regulation &amp; HR; Arbeitsdirektor<\u002Fsc-raw-td><sc-raw-td>1 Jan 2026<\u002Fsc-raw-td><sc-raw-td>CFO BayernLB (to Jun 2025); began 1998 in Deutsche Bank risk; promovierter Mathematiker<\u002Fsc-raw-td><sc-raw-td>Regulatory/financial hardening<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>The pattern — internal continuity plus senior commercial-bank hires.<\u002Fstrong> Coenen and Bücker anchor institutional memory; Kaurin, Wiegelmann and Japec import large-bank operating experience. Die-privatbank.de read it precisely: \"Die neue Mannschaft spiegelt einen Mix aus interner Erfahrung und externen Impulsen wider.\" <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> hiring commercial-bank executives into a cooperative IT utility signals three intentions — (1) to run Atruvia more like a commercial technology firm (Aktionsradius expansion into cards, consulting, brokerage, crypto); (2) to raise regulatory/financial discipline after the 2018 and 2023–25 BaFin episodes (Wiegelmann's mandate explicitly bundles Finance + Regulation); and (3) to speak \"die Sprache der Banken\" to owner-customers. Wiegelmann's HV framing — \"Wir als Atruvia verstehen uns als Innovator, als entscheidenden Motor der Veränderung\" — is notably un-utility-like.<\u002Fp><p><strong>Leadership depth, key-person and succession risk.<\u002Fstrong> <strong><span class=\"ev\">HYPOTHESIS<\u002Fspan> (elevated risk):<\u002Fstrong> a Vorstand in which three of five members have &lt;18 months tenure carries real integration and key-person risk, particularly with a single spokesman (Coenen) concentrating strategic authority. The prior structure lost two members at end-2022 (Frohnhoff, Staff) in a six-to-four reduction and two more in 2025 (Beyer, Teufel) — a high churn rate. <strong><span class=\"ev\">UNKNOWN<\u002Fspan>:<\u002Fstrong> executive compensation is not individually disclosed (unlisted AG); no Zielrendite-linked variable structure is public.<\u002Fp><h2 id=\"s-v-3\" class=\"hd hd2\"><span class=\"hn mono\">V.3<\u002Fspan><span class=\"ht\">Management System<\u002Fspan><\u002Fh2><p><strong>Where real decision power sits.<\u002Fstrong> Atruvia runs a two-plane system: an internally agile execution plane (Tribes/Squads) and an externally owner-governed strategy plane (BVR committees). The roadmap is owner-set via the Bundeseinheitliches Strategieportfolio (39 initiatives, 36 touching Atruvia), Kompetenzteams, Fokusgruppen and the Strategie- und Portfolioplattform. Individual small banks have negligible direct roadmap power; power is collective and political.<\u002Fp><p><strong>Investment approval.<\u002Fstrong> <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> from evidence:<\u002Fstrong> authorising a €359m capex year is not a pure Vorstand decision. The levy/price mechanism runs through the BVR's Ständiger Projekt- und Strategieausschuss (SPSA) and the Aufsichtsrat: the Börsen-Zeitung reported that \"der Aufsichtsrat … Ende April [2023] über eine Lösung entscheiden [soll], wie die drohende Abrisskante bei den IT-Investitionen verhindert werden kann,\" converting the expiring IT-Sonderumlage into a regular price rise. So the true capital-allocation authority is a triangle: Vorstand proposes, Aufsichtsrat approves, BVR committees legitimise the levy on owners.<\u002Fp><p><strong>The Zielrendite mechanism.<\u002Fstrong> The 4% target is a deliberately modest, utility-style return — Coenen: \"Der Konzern solle nicht Gewinnmaximierung betreiben, sondern den Eigentümern ein stabiles Ergebnis und einen gewissen Dividendenbeitrag liefern … Alles, was wir an zusätzlichen Erlösen reinholen, versuchen wir zu reinvestieren.\" <strong>This is the core of the management system: profit is a means to an investment end, not an end.<\u002Fstrong> The tension is structural — agile internally, consensus-bound externally; the roadmap's velocity is capped by the slowest governance layer, not the fastest squad.<\u002Fp><h2 id=\"s-v-4\" class=\"hd hd2\"><span class=\"hn mono\">V.4<\u002Fspan><span class=\"ht\">Culture — Declared versus Revealed<\u002Fspan><\u002Fh2><p><strong>Declared.<\u002Fstrong> Agility, New Work, sovereignty, partnership, cooperative values, \"Digitalisierungspartner.\" The shared-leadership New Work model (People Lead = disziplinarische Führung/Change Enabler; Tribe Lead = fachliche Führung/Product Owner) is publicly documented.<\u002Fp><p><strong>The stated trigger for transformation (original source located).<\u002Fstrong> The oft-quoted driver — \"Unterschiedlichste Qualitätsprobleme, eine niedrige Mitarbeiterzufriedenheit und vor allem eine geringe Kundenzufriedenheit\" — originates from an Atruvia self-presentation at the HR Pioneers Agile HR Conference 2023 (\"Aufspringen. Anschnallen. Atruvia — Unsere Achterbahnfahrt durch die Agile Transformation\"), by People Leads Björn Langer and Marvin Beck with HR consultant Uwe Joas. The same talk states plainly: \"Wir haben in unserem neuen Zusammenarbeitsmodell eine Führungsebene herausgenommen und die geteilte Führung umgesetzt.\" <strong><span class=\"ev\">COMPANY CLAIM<\u002Fspan> (promotional context):<\u002Fstrong> this is the earliest articulation, but it is a conference self-presentation, not an audited report.<\u002Fp><p><strong>Important distinction (correcting a common conflation).<\u002Fstrong> The \"neues Betriebsmodell\" (nBM) introduced from 2025 is NOT Atruvia's internal org restructuring — it is a product/process transformation programme <em>for the member banks<\u002Fem>, a Top-Initiative of the BSP led by Margit Messika under Vorständin Japec, targeting \"bis 2035 eine Bruttoergebniswirkung von 2,6 Mrd. Euro\" and responding to \"dem erwarteten Personalrückgang von rund 30 Prozent bis 2030\" in the banks. The internal agile model (Spotify-style) is the older ~2020–21 transformation.<\u002Fp><p><strong>Revealed culture — Declared vs Revealed matrix:<\u002Fstrong><\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Declared value<\u002Fsc-raw-th><sc-raw-th>Revealed behaviour (evidence)<\u002Fsc-raw-th><sc-raw-th>Verdict<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Quality orientation<\u002Fsc-raw-td><sc-raw-td>Repeated outages (2020 system-changeover, 2021 DDoS, 2023 up-to-520-banks, July 2026 ~490 banks); 2018 BaFin: worst grades for QA/testing of VR-Control<\u002Fsc-raw-td><sc-raw-td>Contradiction: quality is aspired to, not consistently delivered<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Regulatory discipline<\u002Fsc-raw-td><sc-raw-td>2018 (15 findings, 3 severe) and 2023–25 parcIT findings → bank capital add-ons; audIT programme run 2018–21+<\u002Fsc-raw-td><sc-raw-td>Improving under pressure; reactive not proactive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Employee satisfaction<\u002Fsc-raw-td><sc-raw-td>Kununu 4.3/5, 93% recommend, &gt;1,900 reviews, 5× Top Company; but recurring complaints of \"regelmäßige interne Umstrukturierung\" and leadership \"weiter weg … denn je\"<\u002Fsc-raw-td><sc-raw-td>Genuinely strong aggregate; transformation fatigue at the edges<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Agility/speed<\u002Fsc-raw-td><sc-raw-td>Internal squads agile; roadmap gated by BVR consensus; core rebuild \"bis 2030 und länger\"<\u002Fsc-raw-td><sc-raw-td>Speed is local, not systemic<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Transparency<\u002Fsc-raw-td><sc-raw-td>Crisis comms praised in 2021 DDoS; but outage root causes often undisclosed (Nov 2023)<\u002Fsc-raw-td><sc-raw-td>Mixed<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Tolerance for failure<\u002Fsc-raw-td><sc-raw-td>Accountability exits (Bruns, Pfläging 2019)<\u002Fsc-raw-td><sc-raw-td>Failure has consequences at the top<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Kununu detail (labelled).<\u002Fstrong> Atruvia's own published aggregates: 4.3/5, 93% Weiterempfehlung, &gt;1,900 reviews; category awards for Gehaltszufriedenheit and Familienfreundlichkeit; Top Female Workplace (Platz 6 Deutschland IT, Platz 3 Baden-Württemberg). Numeric sub-scores per category are not publicly retrievable; Kununu is self-selecting and Atruvia curates republished quotes. Recurring negatives: frequent restructuring, perceived leadership distance, uneven agile maturity, communication gaps. Atruvia's own review-reply concedes: \"Atruvia geht seit gut 3 Jahren einen tiefgreifenden Transformationsweg. Diesen mit ca. 5000 Mitarbeitenden gemeinsam zu schaffen ist ein[e Herausforderung].\" Engineering salary bands €65,000–€102,000.<\u002Fp><h2 id=\"s-v-5\" class=\"hd hd2\"><span class=\"hn mono\">V.5<\u002Fspan><span class=\"ht\">Incentive Architecture<\u002Fspan><\u002Fh2><p>No equity, no options, no share-price signal. <strong>What actually motivates behaviour:<\u002Fstrong><\u002Fp><ul class=\"lst\"><li><strong>Vorstand:<\u002Fstrong> compensation structure <span class=\"ev\">UNKNOWN<\u002Fspan>; the Zielrendite (4%) is the visible target, but it is a <em>floor-style<\u002Fem> stability target, not an upside-maximising one. <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> absent equity, the dominant incentive is institutional reputation, sector standing (cf. Beyer's gold medal), and the avoidance of BaFin/outage embarrassment. This biases toward risk-aversion and continuity over bold bets — mostly appropriate for critical infrastructure, but a brake on modernisation velocity.<\u002Fli><li><strong>Tribe Leads / People Leads:<\u002Fstrong> split leadership deliberately separates delivery (Tribe) from people development (People) — reduces empire-building but, per reviews, can leave staff feeling leadership is \"distant.\"<\u002Fli><li><strong>Engineers:<\u002Fstrong> salary-band progression; the risk is that build-once utility work rewards reliability over innovation.<\u002Fli><li><strong>\"Customer Success\" when customers cannot leave:<\u002Fstrong> <strong>the sharpest incentive paradox in the company.<\u002Fstrong> Japec's Customer Success function cannot be disciplined by churn (owners cannot exit). Its incentive must therefore be proxy metrics — Digitalisierungsquote, app ratings, migration satisfaction. <strong><span class=\"ev\">HYPOTHESIS<\u002Fspan>:<\u002Fstrong> these are gameable and softer than real switching pressure, blunting the incentive to improve to a genuinely competitive standard.<\u002Fli><li><strong>Compliance/risk:<\u002Fstrong> post-2018, heavily incentivised by BaFin exposure (audIT); commercial vs compliance incentives conflict when speed-to-market meets MaRisk/BAIT — the 2018 and 2023 findings show compliance historically lost until forced.<\u002Fli><li><strong>Owner-banks:<\u002Fstrong> as owners they want low levies and dividends; as customers they want investment and reliability. This dual identity blunts the improvement incentive: the same institution that demands modernisation resists paying for it (documented owner \"Preisresistenz\").<\u002Fli><\u002Ful><h2 id=\"s-v-6\" class=\"hd hd2\"><span class=\"hn mono\">V.6<\u002Fspan><span class=\"ht\">Competitive Universe (re-cut by threat vector)<\u002Fspan><\u002Fh2><p><strong>A. The structural twin — Finanz Informatik (FI).<\u002Fstrong> Not a customer-competitor but the definitive efficiency benchmark and the counterparty in any sector consolidation. Per FI's Jahresbericht 2024 (\"Zukunft. Digital. Machen.\"): \"der konsolidierte Umsatz stieg 2024 auf rund 2,6 Milliarden Euro\"; \"Mit 649 Neueinstellungen wuchs die Zahl der Beschäftigten (Vollzeitäquivalente) auf 5.037\"; \"328 Millionen Euro in die Neu- und Weiterentwicklung … OSPlus\"; ~114m accounts, &gt;205bn technical transactions, ~350 Sparkassen, IBM-mainframe-based, on-premise; App Sparkasse 17.9m active users. Revenue/employee ~€516k (FI) vs ~€218k (Atruvia Group)/~€324k (Atruvia AG). <strong>The two already co-operate<\u002Fstrong> (joint dual IT-degree with FH Münster from 2026).<\u002Fp><p><strong>B. Commercial core-banking vendors (contest external wins and defections).<\u002Fstrong> Avaloq (took Apobank), Temenos, Sopra Steria (Corbas MBS — M.M. Warburg migrating <em>away from it to Atruvia<\u002Fem>), FIS/Kordoba, SAP (Fioneer), Finastra; cloud-native challengers Thought Machine (Vault), Mambu (Berlin; multi-unicorn on a ~€5bn valuation; N26/ABN AMRO), 10x Banking, Tuum. <strong>Threat horizon:<\u002Fstrong> low for the captive base; real only at the margins (external banks, private banks). No cloud-native vendor has yet won a German cooperative or savings bank at core-system scale.<\u002Fp><p><strong>C. The banks' own alternatives.<\u002Fstrong> Build in-house (effectively impossible at single-cooperative-bank scale); consortium build (the seven Sparda-Banken abandoned their Sopra Steria joint build — see <a class=\"xr\" href=\"#s-v-7\">V.7<\u002Fa>/<a class=\"xr\" href=\"#s-v-10\">V.10<\u002Fa> — and moved to Atruvia); exit the sector. <strong>All three have failed or proven impractical.<\u002Fstrong><\u002Fp><p><strong>D. Edge erosion.<\u002Fstrong> BaaS/embedded-finance providers, fintech modules, Big Tech in payments/identity, and neobanks (N26, Trade Republic, Revolut) competing with the member banks themselves — the last is the most insidious because it shrinks Atruvia's customer base indirectly.<\u002Fp><p><strong>E. Suppliers as competitors.<\u002Fstrong> IBM (could move up the stack via consulting/software), Microsoft/hyperscalers. <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> the November 2025 IBM deal both deepens dependency AND buys sovereignty guarantees (HashiCorp Vault, \"full control … in its own data centers,\" quantum-safe encryption) — a deliberate hedge against exactly this risk.<\u002Fp><h2 id=\"s-v-7\" class=\"hd hd2\"><span class=\"hn mono\">V.7<\u002Fspan><span class=\"ht\">Competitor Teardowns<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-5\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 05<\u002Fspan><span class=\"fig-t\">Atruvia versus Finanz Informatik<\u002Fspan><\u002Fdiv><div class=\"fig-b\">\n  <div class=\"vs-head\"><div><\u002Fdiv><div class=\"vs-l\">Atruvia<\u002Fdiv><div class=\"vs-l\">Finanz Informatik<\u002Fdiv><\u002Fdiv>\n  <div class=\"vs\">\n    <div class=\"vs-m\">Revenue (2024)<\u002Fdiv>\n    <div class=\"vs-c\"><div class=\"bar\"><div class=\"barf\" style=\"width:85%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">~€2.2bn Group<\u002Fspan><\u002Fdiv>\n    <div class=\"vs-c\"><div class=\"bar\"><div class=\"barf alt\" style=\"width:100%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">~€2.6bn<\u002Fspan><\u002Fdiv>\n\n    <div class=\"vs-m\">Employees<\u002Fdiv>\n    <div class=\"vs-c\"><div class=\"bar\"><div class=\"barf\" style=\"width:100%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">10,076 Group / 5,847 AG<\u002Fspan><\u002Fdiv>\n    <div class=\"vs-c\"><div class=\"bar\"><div class=\"barf alt\" style=\"width:50%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">5,037 FTE<\u002Fspan><\u002Fdiv>\n\n    <div class=\"vs-m hi\">Revenue per employee<\u002Fdiv>\n    <div class=\"vs-c hi\"><div class=\"bar\"><div class=\"barf\" style=\"width:42%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">~€218k Group · ~€324k AG<\u002Fspan><\u002Fdiv>\n    <div class=\"vs-c hi\"><div class=\"bar\"><div class=\"barf alt\" style=\"width:100%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">~€516k<\u002Fspan><\u002Fdiv>\n\n    <div class=\"vs-m\">Accounts<\u002Fdiv>\n    <div class=\"vs-c\"><div class=\"bar\"><div class=\"barf\" style=\"width:85%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">91–97m<\u002Fspan><\u002Fdiv>\n    <div class=\"vs-c\"><div class=\"bar\"><div class=\"barf alt\" style=\"width:100%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">~114m<\u002Fspan><\u002Fdiv>\n\n    <div class=\"vs-m\">Technical transactions / yr<\u002Fdiv>\n    <div class=\"vs-c\"><div class=\"bar\"><div class=\"barf\" style=\"width:39%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">~80bn+<\u002Fspan><\u002Fdiv>\n    <div class=\"vs-c\"><div class=\"bar\"><div class=\"barf alt\" style=\"width:100%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">&gt;205bn<\u002Fspan><\u002Fdiv>\n\n    <div class=\"vs-m\">Institutions served<\u002Fdiv>\n    <div class=\"vs-c\"><div class=\"bar\"><div class=\"barf\" style=\"width:100%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">~670–700 cooperative<\u002Fspan><\u002Fdiv>\n    <div class=\"vs-c\"><div class=\"bar\"><div class=\"barf alt\" style=\"width:50%\"><\u002Fdiv><\u002Fdiv><span class=\"mono\">~350 Sparkassen<\u002Fspan><\u002Fdiv>\n\n    <div class=\"vs-m\">Core platform<\u002Fdiv>\n    <div class=\"vs-c\"><span class=\"chip\">agree21<\u002Fspan><\u002Fdiv>\n    <div class=\"vs-c\"><span class=\"chip\">OSPlus<\u002Fspan><\u002Fdiv>\n\n    <div class=\"vs-m\">DORA CTPP designated<\u002Fdiv>\n    <div class=\"vs-c\"><span class=\"chip\">No<\u002Fspan><\u002Fdiv>\n    <div class=\"vs-c\"><span class=\"chip\">No<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cal\" style=\"margin-top:18px\"><div class=\"cal-k\">The gap<\u002Fdiv><div class=\"cal-b\">Revenue per employee differs by <strong>2.4×<\u002Fstrong> on the Group measure — the single sharpest indicator of the productivity difference between the two sector utilities.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><figcaption class=\"fig-c\">Two captive utilities of comparable systemic weight, on very different productivity bases. Neither is a designated Critical ICT Third-Party Provider.<\u002Ffigcaption><\u002Ffigure><p><strong>Atruvia vs Finanz Informatik:<\u002Fstrong><\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Dimension<\u002Fsc-raw-th><sc-raw-th>Atruvia<\u002Fsc-raw-th><sc-raw-th>Finanz Informatik<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Revenue (2024/25)<\u002Fsc-raw-td><sc-raw-td>AG €1,921m (2025); Group ~€2.5bn<\u002Fsc-raw-td><sc-raw-td>~€2.6bn (2024)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FTE<\u002Fsc-raw-td><sc-raw-td>Group ~10,076; AG 5,847<\u002Fsc-raw-td><sc-raw-td>5,037<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Accounts<\u002Fsc-raw-td><sc-raw-td>~97m<\u002Fsc-raw-td><sc-raw-td>~114m<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Technical transactions<\u002Fsc-raw-td><sc-raw-td>~80bn+/yr<\u002Fsc-raw-td><sc-raw-td>&gt;205bn/yr<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Institutions<\u002Fsc-raw-td><sc-raw-td>~670–730 coop + others (~950 customers)<\u002Fsc-raw-td><sc-raw-td>~350 Sparkassen<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Core platform<\u002Fsc-raw-td><sc-raw-td>agree21 (agree lineage)<\u002Fsc-raw-td><sc-raw-td>OSPlus<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Core investment<\u002Fsc-raw-td><sc-raw-td>levy + reinvested profit; capex €359.1m (2025)<\u002Fsc-raw-td><sc-raw-td>€328m OSPlus Basisangebot (2024)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Revenue/employee<\u002Fsc-raw-td><sc-raw-td>~€218k Group / ~€324k AG<\u002Fsc-raw-td><sc-raw-td>~€516k<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Deployment<\u002Fsc-raw-td><sc-raw-td>on-prem/own DCs<\u002Fsc-raw-td><sc-raw-td>on-prem/own DCs<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Tech base<\u002Fsc-raw-td><sc-raw-td>IBM Z (z15→z17)<\u002Fsc-raw-td><sc-raw-td>IBM mainframe<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>App<\u002Fsc-raw-td><sc-raw-td>VR BankingApp (\"Bestnoten,\" near-Sparkasse in tests)<\u002Fsc-raw-td><sc-raw-td>App Sparkasse (Capital/Handelsblatt Testsieger; 17.9m active users)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cards<\u002Fsc-raw-td><sc-raw-td>consolidating now via VR Payment (2027)<\u002Fsc-raw-td><sc-raw-td>consolidated 2024 into \"Qards\" (Bayern Card-Services + Pluscard)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Governance<\u002Fsc-raw-td><sc-raw-td>AG, 99.68% coop-owned<\u002Fsc-raw-td><sc-raw-td>GmbH &amp; Co. KG<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Read:<\u002Fstrong> FI is materially more efficient per head (~2.4× revenue/employee), more transactionally scaled, and roughly 2–3 years ahead on both card consolidation and app-award recognition. Atruvia's app has \"aufgeholt … nahe bis zu den Sparkassen\" (Coenen) but is \"nicht superspitz auf eine junge Zielgruppe ausgelegt.\" <strong>The efficiency gap is the single most damning comparative datapoint<\u002Fstrong> — though it is partly explained by Atruvia's more fragmented customer base and larger low-margin subsidiary estate (Ratiodata).<\u002Fp><p><strong>Atruvia vs commercial/cloud-native vendors:<\u002Fstrong><\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Dimension<\u002Fsc-raw-th><sc-raw-th>Atruvia<\u002Fsc-raw-th><sc-raw-th>Avaloq/Temenos<\u002Fsc-raw-th><sc-raw-th>Cloud-native (Thought Machine/Mambu)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Target<\u002Fsc-raw-td><sc-raw-td>captive coop sector<\u002Fsc-raw-td><sc-raw-td>mid/large banks, wealth<\u002Fsc-raw-td><sc-raw-td>digital banks, fintechs<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Deployment<\u002Fsc-raw-td><sc-raw-td>on-prem, multi-tenant<\u002Fsc-raw-td><sc-raw-td>on-prem/SaaS<\u002Fsc-raw-td><sc-raw-td>cloud-native SaaS<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Stack<\u002Fsc-raw-td><sc-raw-td>mainframe + Java/OpenShift<\u002Fsc-raw-td><sc-raw-td>modernised legacy/Java<\u002Fsc-raw-td><sc-raw-td>microservices, cloud<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Migration record<\u002Fsc-raw-td><sc-raw-td>industrialised (60 weekends)<\u002Fsc-raw-td><sc-raw-td>Apobank: debacle<\u002Fsc-raw-td><sc-raw-td>few full-bank cores in DE<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Regulatory posture<\u002Fsc-raw-td><sc-raw-td>deep German/coop-specific<\u002Fsc-raw-td><sc-raw-td>general<\u002Fsc-raw-td><sc-raw-td>maturing in DE<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Switching economics<\u002Fsc-raw-td><sc-raw-td>near-prohibitive (owned)<\u002Fsc-raw-td><sc-raw-td>high<\u002Fsc-raw-td><sc-raw-td>lower but unproven at scale<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-v-8\" class=\"hd hd2\"><span class=\"hn mono\">V.8<\u002Fspan><span class=\"ht\">Why Member Banks Stay — and What That Costs Them<\u002Fspan><\u002Fh2><p><strong>Decomposition of why a cooperative bank stays:<\u002Fstrong><\u002Fp><ol class=\"lst\"><li><strong>Ownership<\u002Fstrong> — it owns the supplier (99.68% coop-owned; ~91.63% via three regional Beteiligungs-KGs pooled through VR-FGI Beteiligungsholding).<\u002Fli><li><strong>Ecosystem integration<\u002Fstrong> — DZ Bank clearing, Union Investment, R+V, VR Payment, BVR reporting all run through agree21. Leaving means rebuilding every one of these interfaces.<\u002Fli><li><strong>Regulatory posture<\u002Fstrong> — Atruvia's compliance IS the bank's compliance under §25b KWG. A commercial vendor shifts that burden onto the bank.<\u002Fli><li><strong>Cost / shared scale<\u002Fstrong> — no single cooperative bank can replicate mainframe-scale economics.<\u002Fli><li><strong>Absence of a cooperative-specific alternative<\u002Fstrong> — no vendor offers the coop-verbund integration out of the box.<\u002Fli><li><strong>The Apobank precedent<\u002Fstrong> — the empirical proof that leaving is ruinous.<\u002Fli><\u002Fol><p><strong>What staying costs (quantified where evidence permits):<\u002Fstrong><\u002Fp><ul class=\"lst\"><li><strong>Levies:<\u002Fstrong> IT-Sonderumlage 2018–2023 (€60m/yr from banks ≈ €300m cumulative, + €180m DZ Bank + ~€200m self-funded); Digitalisierungsumlage rising, per DER PLATOW Brief, \"von zuletzt 30 Mio. Euro über 60 Mio. im laufenden Jahr auf 90 Mio. Euro in 2025\" (headline: \"Atruvia verdreifacht Digital-Preise für Genossen\").<\u002Fli><li><strong>Price rises:<\u002Fstrong> ~5% in 2023 and 2024 as \"inflationsbedingte Preisanpassung.\"<\u002Fli><li><strong>Constrained influence:<\u002Fstrong> small banks have negligible roadmap power.<\u002Fli><li><strong>Outage exposure:<\u002Fstrong> four material events 2020–2026.<\u002Fli><li><strong>Modernisation pace:<\u002Fstrong> core rebuild \"bis 2030 und länger\" (Coenen); the €450m–€1bn/yr scenario to reach European front-runners.<\u002Fli><\u002Ful><p><strong>Judgement.<\u002Fstrong> Members are getting an <strong>unavoidable deal that is nonetheless mostly reasonable<\u002Fstrong> — but reasonableness is unproven precisely because it is untested by exit. The levies buy genuine shared infrastructure and regulatory shelter that no member could build alone; the Apobank case shows the alternative is worse. But the absence of contestability means there is no market discipline confirming the price is fair, and owner price-resistance is simultaneously suppressing the investment members say they want. <strong>This is structural advantage and lock-in delivering genuine — but not demonstrably optimal — value.<\u002Fstrong><\u002Fp><h2 id=\"s-v-9\" class=\"hd hd2\"><span class=\"hn mono\">V.9<\u002Fspan><span class=\"ht\">Moat Analysis (reframed: prevents-exit vs creates-value)<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-11\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 11<\u002Fspan><span class=\"fig-t\">Moat Scorecard: Lock versus Value<\u002Fspan><\u002Fdiv><div class=\"fig-b\" style=\"display:grid;grid-template-columns:1fr 250px;gap:28px\">\n  <svg sc-camel-view-box=\"0 0 560 500\" class=\"svg\" style=\"width:100%;height:500px\">\n    <rect x=\"60\" y=\"20\" width=\"460\" height=\"420\" fill=\"none\" stroke=\"var(--wire)\" stroke-width=\"1\"><\u002Frect>\n    <g stroke=\"var(--wire)\" stroke-width=\"1\" stroke-dasharray=\"2 3\">\n      <line x1=\"152\" y1=\"20\" x2=\"152\" y2=\"440\"><\u002Fline><line x1=\"244\" y1=\"20\" x2=\"244\" y2=\"440\"><\u002Fline><line x1=\"336\" y1=\"20\" x2=\"336\" y2=\"440\"><\u002Fline><line x1=\"428\" y1=\"20\" x2=\"428\" y2=\"440\"><\u002Fline>\n      <line x1=\"60\" y1=\"104\" x2=\"520\" y2=\"104\"><\u002Fline><line x1=\"60\" y1=\"188\" x2=\"520\" y2=\"188\"><\u002Fline><line x1=\"60\" y1=\"272\" x2=\"520\" y2=\"272\"><\u002Fline><line x1=\"60\" y1=\"356\" x2=\"520\" y2=\"356\"><\u002Fline>\n    <\u002Fg>\n    <line x1=\"60\" y1=\"440\" x2=\"520\" y2=\"20\" stroke=\"var(--acc)\" stroke-width=\"1\" stroke-dasharray=\"4 4\" opacity=\"0.5\"><\u002Fline>\n    <g font-size=\"12.5\" fill=\"var(--muted)\" class=\"mono\">\n      <text x=\"60\" y=\"458\" text-anchor=\"middle\">0<\u002Ftext><text x=\"152\" y=\"458\" text-anchor=\"middle\">1<\u002Ftext><text x=\"244\" y=\"458\" text-anchor=\"middle\">2<\u002Ftext><text x=\"336\" y=\"458\" text-anchor=\"middle\">3<\u002Ftext><text x=\"428\" y=\"458\" text-anchor=\"middle\">4<\u002Ftext><text x=\"520\" y=\"458\" text-anchor=\"middle\">5<\u002Ftext>\n      <text x=\"50\" y=\"444\" text-anchor=\"end\">0<\u002Ftext><text x=\"50\" y=\"360\" text-anchor=\"end\">1<\u002Ftext><text x=\"50\" y=\"276\" text-anchor=\"end\">2<\u002Ftext><text x=\"50\" y=\"192\" text-anchor=\"end\">3<\u002Ftext><text x=\"50\" y=\"108\" text-anchor=\"end\">4<\u002Ftext><text x=\"50\" y=\"24\" text-anchor=\"end\">5<\u002Ftext>\n    <\u002Fg>\n    <text x=\"290\" y=\"486\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--ink)\" letter-spacing=\"0.1em\">PREVENTS EXIT →<\u002Ftext>\n    <text x=\"20\" y=\"230\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"var(--ink)\" letter-spacing=\"0.1em\" transform=\"rotate(-90 20 230)\">CREATES VALUE →<\u002Ftext>\n    <g stroke=\"var(--ink)\" stroke-width=\"1\" fill=\"var(--paper)\">\n      <circle cx=\"520\" cy=\"272\" r=\"5\"><\u002Fcircle>\n      <circle cx=\"520\" cy=\"272\" r=\"5\"><\u002Fcircle>\n      <circle cx=\"474\" cy=\"62\" r=\"5\"><\u002Fcircle>\n      <circle cx=\"428\" cy=\"104\" r=\"5\"><\u002Fcircle>\n      <circle cx=\"382\" cy=\"146\" r=\"5\"><\u002Fcircle>\n      <circle cx=\"336\" cy=\"146\" r=\"5\"><\u002Fcircle>\n      <circle cx=\"336\" cy=\"188\" r=\"5\"><\u002Fcircle>\n      <circle cx=\"244\" cy=\"272\" r=\"5\"><\u002Fcircle>\n    <\u002Fg>\n    <circle cx=\"60\" cy=\"104\" r=\"6\" fill=\"var(--acc)\" stroke=\"var(--acc)\" stroke-width=\"1\"><\u002Fcircle>\n    <g font-size=\"14\" fill=\"var(--ink)\">\n      <text x=\"512\" y=\"262\" text-anchor=\"end\">Captive ownership · Switching costs (5, 2)<\u002Ftext>\n      <text x=\"466\" y=\"52\" text-anchor=\"end\">Ecosystem integration (4.5, 4.5)<\u002Ftext>\n      <text x=\"420\" y=\"94\" text-anchor=\"end\">Regulatory capability (4, 4)<\u002Ftext>\n      <text x=\"374\" y=\"136\" text-anchor=\"end\">agree21 platform (3.5, 3.5)<\u002Ftext>\n      <text x=\"328\" y=\"200\" text-anchor=\"end\">Scale economics (3, 3.5)<\u002Ftext>\n      <text x=\"328\" y=\"160\" text-anchor=\"end\">Brand / trust (3, 3)<\u002Ftext>\n      <text x=\"236\" y=\"262\" text-anchor=\"end\">Data position (2, 2)<\u002Ftext>\n      <text x=\"74\" y=\"100\" fill=\"var(--acc)\" font-weight=\"500\">Migration capability (0, 4)<\u002Ftext>\n    <\u002Fg>\n  <\u002Fsvg>\n  <div class=\"pnl\">\n    <div class=\"pnl-k\">Reading the plot<\u002Fdiv>\n    <div class=\"pnl-b\">Points to the lower right are lock without value. The dashed diagonal is parity — a moat that creates as much value as it prevents exit.<\u002Fdiv>\n    <div class=\"pnl-b\" style=\"margin-top:12px\">Only <strong>migration capability<\u002Fstrong> and <strong>regulatory capability<\u002Fstrong> sit at or above the line. Both would survive in a contestable market; the largest scores would not.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><figcaption class=\"fig-c\"><b>The largest moats are lock, not value.<\u002Fb> The genuine advantages — migration and regulatory capability — would survive in a contestable market. The rest would not.<\u002Ffigcaption><\u002Ffigure><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Candidate moat<\u002Fsc-raw-th><sc-raw-th>Score /5<\u002Fsc-raw-th><sc-raw-th>Prevents exit?<\u002Fsc-raw-th><sc-raw-th>Creates value?<\u002Fsc-raw-th><sc-raw-th>Mechanism &amp; durability<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Captive ownership<\u002Fsc-raw-td><sc-raw-td>5 (as lock); 2 (as value)<\u002Fsc-raw-td><sc-raw-td>Yes, absolutely<\u002Fsc-raw-td><sc-raw-td>Only if it disciplines investment — it does not<\u002Fsc-raw-td><sc-raw-td>Structural; durable until sector restructures. <strong>Risk: complacency/under-investment<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Ecosystem integration<\u002Fsc-raw-td><sc-raw-td>4.5<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes — genuine build-once integration<\u002Fsc-raw-td><sc-raw-td>High; replicable only by another verbund<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Regulatory/compliance capability<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>Partly<\u002Fsc-raw-td><sc-raw-td>Yes — real, accumulated, hard to buy<\u002Fsc-raw-td><sc-raw-td>Durable; strengthened by audIT/DORA experience<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>agree21 multi-tenant platform<\u002Fsc-raw-td><sc-raw-td>3.5<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Yes but ageing<\u002Fsc-raw-td><sc-raw-td>Path-dependent; modernise-in-place bet<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Migration capability<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>No<\u002Fsc-raw-td><sc-raw-td><strong>Yes — the most underrated genuine advantage<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Industrialised (60 weekends, 11 Sparda, Warburg); replicable only with scale<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Scale economics<\u002Fsc-raw-td><sc-raw-td>3.5<\u002Fsc-raw-td><sc-raw-td>No<\u002Fsc-raw-td><sc-raw-td>Yes but behind FI<\u002Fsc-raw-td><sc-raw-td>Real but sub-FI efficiency<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Data position<\u002Fsc-raw-td><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>No<\u002Fsc-raw-td><sc-raw-td>Constrained by GDPR processor role<\u002Fsc-raw-td><sc-raw-td>Weak as moat<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Switching costs<\u002Fsc-raw-td><sc-raw-td>5 (lock); 2 (value)<\u002Fsc-raw-td><sc-raw-td>Yes<\u002Fsc-raw-td><sc-raw-td>Neutral<\u002Fsc-raw-td><sc-raw-td>Very high; Apobank-proven<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Brand/trust<\u002Fsc-raw-td><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>Partly<\u002Fsc-raw-td><sc-raw-td>Yes within verbund<\u002Fsc-raw-td><sc-raw-td>Outages erode it<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Talent<\u002Fsc-raw-td><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>No<\u002Fsc-raw-td><sc-raw-td>Adequate; nearshore (Cluj ~700) + Kununu strength<\u002Fsc-raw-td><sc-raw-td>Contested by COBOL wave<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Critical reframe:<\u002Fstrong> the largest \"moats\" (captive ownership, switching costs) are lock, not value. Scored as competitive strengths they flatter Atruvia; scored honestly they reveal the central risk — <strong>the lock removes the pressure that would otherwise force the value.<\u002Fstrong> The genuine, exit-independent advantages are <strong>migration capability and regulatory capability<\u002Fstrong>; these would survive even in a contestable market.<\u002Fp><figure class=\"fig\" id=\"figure-15\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 15<\u002Fspan><span class=\"fig-t\">Migration Track Record<\u002Fspan><\u002Fdiv><div class=\"fig-b\" style=\"display:grid;grid-template-columns:1fr 288px;gap:28px\">\n  <div class=\"tline\">\n    <div class=\"tl-i\"><span class=\"tl-y mono\">2015<\u002Fspan><div><div class=\"node-t\">Fiducia and GAD merge<\u002Fdiv><div class=\"node-m\">two cores inherited — agree (south) and bank21 (north)<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"tl-i\"><span class=\"tl-y mono\">2017–19<\u002Fspan><div><div class=\"node-t\">agree21 series migration — \"Mondlandung\"<\u002Fdiv><div class=\"node-m\">60 migration weekends · ~21.5m accounts · 22 TB moved<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"tl-i\"><span class=\"tl-y mono\">9 Nov 2019<\u002Fspan><div><div class=\"node-t\">Series phase complete<\u002Fdiv><div class=\"node-m\">341 remaining banks migrated; six special institutions followed through 2020<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"tl-i\"><span class=\"tl-y mono\">2021–26<\u002Fspan><div><div class=\"node-t\">22 institutions migrated or under way<\u002Fdiv><div class=\"node-m\">all 11 Sparda-Banken · Bank für Sozialwirtschaft · UmweltBank · National-Bank Essen · M.M. Warburg announced<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"tl-i\"><span class=\"tl-y mono acc\">ongoing<\u002Fspan><div><div class=\"node-t\">40–45 merger migrations per year<\u002Fdiv><div class=\"node-m\">the routine, unremarked capability<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"pnl\">\n    <div class=\"pnl-k\">Counterpoint — the alternative<\u002Fdiv>\n    <div class=\"pnl-b\"><strong>Apobank<\u002Fstrong> migrated <em>away<\u002Fem> to Avaloq in 2020.<\u002Fdiv>\n    <div class=\"calc\"><span>Cost<\u002Fspan><span class=\"mono\">mid-three-digit €m<\u002Fspan><\u002Fdiv>\n    <div class=\"calc\"><span>Third-party estimate<\u002Fspan><span class=\"mono\">~€500m<\u002Fspan><\u002Fdiv>\n    <div class=\"calc tot\"><span>Customer satisfaction<\u002Fspan><span class=\"mono acc\">82% → 47%<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><figcaption class=\"fig-c\">Repeated, audited migration at national scale is the one capability here that is genuinely scarce — and the one that does not depend on captivity.<\u002Ffigcaption><\u002Ffigure><h2 id=\"s-v-10\" class=\"hd hd2\"><span class=\"hn mono\">V.10<\u002Fspan><span class=\"ht\">Replication and Replacement Test<\u002Fspan><\u002Fh2><p><strong>(a) Replication — rebuild Atruvia from zero:<\u002Fstrong> effectively irreproducible on any reasonable horizon. Recreating a multi-tenant core serving ~950 institutions/97m accounts, four high-security data centres, ~80bn+ transactions/yr, the full verbund-integration layer, and BaFin-tested compliance would require a decade-plus, multi-billion-euro programme, thousands of specialist staff, and — critically — the migration of every institution without catastrophic disruption. Classify: data-centre hardware = purchasable; microservices/app = buildable; verbund integration + migration machinery + regulatory trust = effectively irreproducible/path-dependent.<\u002Fp><p><strong>(b) Replacement — swap Atruvia for a commercial vendor: the Apobank case study.<\u002Fstrong><\u002Fp><ul class=\"lst\"><li><strong>What it cost:<\u002Fstrong> Apobank CEO Ulrich Sommer cited a \"mittleren dreistelligen Millionenbetrag\"; Finanz-Szene estimated ~€500m all-in (with reporting up to ~€807m incl. 2021 and consolidation), plus annual run costs \"im zweistelliger Millionenhöhe.\"<\u002Fli><li><strong>How long:<\u002Fstrong> selection from 2015, project from early 2018, go-live Pentecost 2020 (delayed 3 months from a planned 1 March), consolidation into 2021.<\u002Fli><li><strong>What went wrong:<\u002Fstrong> \"Big Bang\" forced because Avaloq could not run on Fiducia hardware (\"Mischbetrieb … nicht erwünscht\"), so hardware+software switched simultaneously; per inside-it.ch (3 June 2021), Apotheke ad hoc reported \"letzten Januar nach wie vor 2500 Bugs gezählt worden seien. 500 davon entfielen auf die Kategorie 2 ('signifikant')\" — a figure Apobank disputed (\"Die Zahl von 2500 Bugs können wir nicht nachvollziehen\"); many subsystems, online banking and the phone system failed; an external call centre was required; the app rated barely above one star. Per Finanz-Szene's customer survey coverage, overall satisfaction fell \"von 82% … auf 47%,\" among self-employed Heilberufler from 80% to 40%, and among Vertriebspartner \"von zuvor 78% sogar auf nur noch 27%\"; depot-at-competitor share rose 23%→30%. CEO Sommer's later departure was linked \"dem Vernehmen nach\" to the migration.<\u002Fli><li><strong>What it proved:<\u002Fstrong> for a single mid-sized bank, replacement is financially ruinous, operationally hazardous and reputationally scarring. For the <em>whole cooperative sector<\u002Fem> (~950 institutions) it is inconceivable as a coordinated act. <strong>This is the empirical foundation of Atruvia's lock.<\u002Fstrong><\u002Fli><\u002Ful><h2 id=\"s-v-11\" class=\"hd hd2\"><span class=\"hn mono\">V.11<\u002Fspan><span class=\"ht\">Porter's Five Forces (adapted for a captive utility)<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Rivalry:<\u002Fstrong> near-zero for the captive base; real but marginal for external wins (Warburg won; private banks contested). <strong>LOW overall.<\u002Fstrong><\u002Fli><li><strong>Supplier power (IBM):<\u002Fstrong> <strong>VERY HIGH and deliberately deepened.<\u002Fstrong> Per the IBM/Atruvia joint release (Frankfurt/Ehningen, 19 November 2025), Atruvia will use \"IBM z17 … as a cornerstone\" for \"mission critical operations including the core banking system.\" The multi-year z17 agreement (z15→z17; a ~€145m payables jump funded the 2025 mainframe purchase) locks Atruvia's core to IBM Z, z/OS, IMS, Db2. Vorständin Daniela Bücker: \"Die Zusammenarbeit mit IBM ermöglicht es uns, in allen Dimensionen der Souveränität zukunftsfähig aufgestellt zu sein: Von Daten über Infrastruktur bis hin zu Cloud, Hersteller- und Innovationssouveränität.\" The paradox: the deal is <em>framed<\u002Fem> as sovereignty but <em>is<\u002Fem> dependency.<\u002Fli><li><strong>Buyer power:<\u002Fstrong> <strong>paradoxical.<\u002Fstrong> Buyers are owners; power is collective and political (BVR/SPSA), not commercial. Individual banks are near-powerless; the collective can set levies and, ultimately, restructure the company.<\u002Fli><li><strong>Substitutes:<\u002Fstrong> cloud-native core, BaaS, commercial vendors — <strong>LOW-MODERATE now, rising slowly.<\u002Fstrong> Not yet mature at German-coop scale.<\u002Fli><li><strong>New entrants:<\u002Fstrong> near-impossible for the captive core; <strong>real at the module level<\u002Fstrong> (fintech components banks might otherwise buy from Atruvia).<\u002Fli><\u002Ful><h2 id=\"s-v-12\" class=\"hd hd2\"><span class=\"hn mono\">V.12<\u002Fspan><span class=\"ht\">PESTLE (material factors only)<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Political:<\u002Fstrong> German/EU sovereignty and cloud-independence debates strongly favour a domestically-run, on-prem utility; the cooperative sector's political weight protects it; digital-euro policy imposes cost.<\u002Fli><li><strong>Economic:<\u002Fstrong> interest-rate normalisation improved bank profitability (capacity to fund levies); consolidation shrinks the paying base; IT-cost inflation drives the ~5% price rises.<\u002Fli><li><strong>Social:<\u002Fstrong> banking-workforce demographics (banks' ~30% headcount decline expected by 2030 — the nBM's raison d'être), the COBOL retirement wave, branch decline, rising digital expectations (especially the under-served young cohort Coenen acknowledges).<\u002Fli><li><strong>Technological:<\u002Fstrong> cloud-native core, AI/agentic AI (plainGPT/GenoGPT, \"autonomous banking\" IBM framing), quantum-safe crypto (in z17 deal), instant payments, EPI/Wero.<\u002Fli><li><strong>Legal:<\u002Fstrong> DORA (Atruvia NOT designated a CTPP on the 18 Nov 2025 first list of 19 providers; IBM WAS, Lead Overseer EBA; FI also not designated), MaRisk/BAIT, §25b KWG, GDPR (processor role), EU AI Act, PSD3.<\u002Fli><li><strong>Environmental:<\u002Fstrong> data-centre energy and sustainability reporting; the IBM deal foregrounds \"sustainable banking.\"<\u002Fli><\u002Ful><h2 id=\"s-v-13\" class=\"hd hd2\"><span class=\"hn mono\">V.13<\u002Fspan><span class=\"ht\">Strategic Flywheels (positive)<\u002Fspan><\u002Fh2><ol class=\"lst\"><li><strong>Scale flywheel:<\u002Fstrong> more banks → more scale → build-once economics → lower cost per bank → more attractive to external banks → more scale. <strong>Evidence:<\u002Fstrong> all 11 Sparda-Banken, Warburg incoming, ~5% price rises still tolerable. <strong>Limit:<\u002Fstrong> consolidation shrinks the bank count even as accounts grow; efficiency still trails FI.<\u002Fli><li><strong>Migration flywheel:<\u002Fstrong> migration capability → external wins → scale → better migration capability. <strong>Evidence:<\u002Fstrong> 60 migration weekends, industrialised \"Serienmigration,\" 22 institutions since 2021, 40–45 merger-migrations/yr. <strong>This is Atruvia's strongest genuine flywheel.<\u002Fstrong><\u002Fli><li><strong>Regulatory build-once flywheel:<\u002Fstrong> compliance built once → attractive to regulated institutions → more scale. <strong>Evidence:<\u002Fstrong> the verbund's regulatory shelter. <strong>Limit:<\u002Fstrong> repeated BaFin findings show the compliance advantage is real but not flawless.<\u002Fli><\u002Fol><h2 id=\"s-v-14\" class=\"hd hd2\"><span class=\"hn mono\">V.14<\u002Fspan><span class=\"ht\">Negative Flywheels<\u002Fspan><\u002Fh2><ol class=\"lst\"><li><strong>Owner price-resistance → under-investment → falling competitiveness → member banks lose retail customers → consolidation → fewer paying customers → more price pressure.<\u002Fstrong> <strong>Likelihood: HIGH; Severity: HIGH.<\u002Fstrong> Evidence: the €450m–€1bn/yr gap; FY2026 margin guidance falling to ~3.9%; FCF only ~€38m.<\u002Fli><li><strong>Outage → trust damage → regulatory scrutiny → compliance cost → less investment capacity → more fragility.<\u002Fstrong> <strong>Likelihood: MODERATE; Severity: HIGH.<\u002Fstrong> Evidence: 2020/2021/2023/2026 events; 2018 and 2023 BaFin cycles.<\u002Fli><li><strong>COBOL retirement → rising maintenance cost → slower modernisation → widening gap to cloud-native.<\u002Fstrong> <strong>Likelihood: MODERATE; Severity: MODERATE.<\u002Fstrong> Mitigated by Semeru Java-enablement and nearshore build-out.<\u002Fli><li><strong>Consolidation → fewer, larger owners → greater individual bargaining power → pressure on the collective model.<\u002Fstrong> <strong>Likelihood: MODERATE-HIGH; Severity: MODERATE.<\u002Fstrong> A top-ten Volksbank gains leverage the collective model was not designed for.<\u002Fli><\u002Fol><h2 id=\"s-v-15\" class=\"hd hd2\"><span class=\"hn mono\">V.15<\u002Fspan><span class=\"ht\">Theory of Constraints / Strategic Bottleneck<\u002Fspan><\u002Fh2><p><strong>If everything else improved 50%, the binding constraint is sector investment-funding governance — not the mainframe.<\u002Fstrong> Evidence: the modernisation the front-runners can afford (€450m–€1bn/yr) exceeds what owner-banks will currently fund; FCF is thin (~€38m); the digital euro alone may need \"einen zusätzlichen Investitionsbeitrag\" (Coenen: \"Das ist eine Herausforderung, die lässt sich nicht mal so aus der Portokasse finanzieren\"). The COBOL core is a <em>managed<\u002Fem> constraint (Semeru), IBM dependency is <em>contracted<\u002Fem>, talent is <em>adequate<\u002Fem>. The true bottleneck is the political-economic willingness of ~700 owner-customers to fund transformation at competitive speed. <strong>Next bottleneck if solved:<\u002Fstrong> execution capacity/talent to spend that money well (the core rebuild \"bis 2030 und länger\").<\u002Fp><h2 id=\"s-v-16\" class=\"hd hd2\"><span class=\"hn mono\">V.16<\u002Fspan><span class=\"ht\">Risk Register (heatmap)<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-12\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 12<\u002Fspan><span class=\"fig-t\">Risk Heatmap<\u002Fspan><\u002Fdiv><div class=\"fig-b\">\n  <div class=\"heat\">\n    <div class=\"heat-c heat-lbl\"><\u002Fdiv>\n    <div class=\"heat-c heat-lbl\">Low<\u002Fdiv><div class=\"heat-c heat-lbl\">Medium<\u002Fdiv><div class=\"heat-c heat-lbl\">Med-High<\u002Fdiv><div class=\"heat-c heat-lbl\">High<\u002Fdiv><div class=\"heat-c heat-lbl\">Very high<\u002Fdiv>\n\n    <div class=\"heat-c heat-row\">High<\u002Fdiv>\n    <div class=\"heat-c l2\"><span class=\"risk\">Loss-making subsidiaries<\u002Fspan><\u002Fdiv>\n    <div class=\"heat-c l3\"><span class=\"risk\">Member-bank consolidation<\u002Fspan><\u002Fdiv>\n    <div class=\"heat-c l3\"><\u002Fdiv>\n    <div class=\"heat-c l4\"><span class=\"risk\">Investment underfunding<\u002Fspan><\u002Fdiv>\n    <div class=\"heat-c l5\"><\u002Fdiv>\n\n    <div class=\"heat-c heat-row\">Medium<\u002Fdiv>\n    <div class=\"heat-c l1\"><\u002Fdiv>\n    <div class=\"heat-c l2\"><span class=\"risk\">COBOL skills wave<\u002Fspan><span class=\"risk\">VR Payment integration<\u002Fspan><span class=\"risk\">Key-person, new Vorstand<\u002Fspan><\u002Fdiv>\n    <div class=\"heat-c l3\"><span class=\"risk\">Further BaFin enforcement<\u002Fspan><\u002Fdiv>\n    <div class=\"heat-c l3\"><span class=\"risk\">IBM dependency &amp; price shock<\u002Fspan><span class=\"risk\">Reputational contagion<\u002Fspan><\u002Fdiv>\n    <div class=\"heat-c l4\"><span class=\"risk\">Catastrophic / prolonged outage<\u002Fspan><span class=\"risk\">Cyber and ransomware<\u002Fspan><\u002Fdiv>\n\n    <div class=\"heat-c heat-row\">Low-Med<\u002Fdiv>\n    <div class=\"heat-c l1\"><\u002Fdiv>\n    <div class=\"heat-c l1\"><span class=\"risk\">DORA CTPP designation<\u002Fspan><\u002Fdiv>\n    <div class=\"heat-c l2\"><\u002Fdiv>\n    <div class=\"heat-c l3\"><span class=\"risk\">Data protection breach<\u002Fspan><\u002Fdiv>\n    <div class=\"heat-c l3\"><\u002Fdiv>\n\n    <div class=\"heat-c heat-row\">Low<\u002Fdiv>\n    <div class=\"heat-c l1\"><\u002Fdiv><div class=\"heat-c l1\"><\u002Fdiv><div class=\"heat-c l1\"><\u002Fdiv>\n    <div class=\"heat-c l2\"><span class=\"risk\">Large bank defection<\u002Fspan><\u002Fdiv>\n    <div class=\"heat-c l2\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"fig-note\">Rows — probability · Columns — severity · 14 risks from the Volume V register<\u002Fdiv>\n<\u002Fdiv><figcaption class=\"fig-c\">The two most severe risks — a prolonged central outage and a cyber event — are both rated medium probability, which is the uncomfortable part.<\u002Ffigcaption><\u002Ffigure><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Risk<\u002Fsc-raw-th><sc-raw-th>Prob<\u002Fsc-raw-th><sc-raw-th>Severity<\u002Fsc-raw-th><sc-raw-th>Detect<\u002Fsc-raw-th><sc-raw-th>Residual<\u002Fsc-raw-th><sc-raw-th>Horizon<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Catastrophic/prolonged outage<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Very High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Ongoing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>DORA CTPP designation<\u002Fsc-raw-td><sc-raw-td>Low-Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low-Med<\u002Fsc-raw-td><sc-raw-td>1–3y<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Further BaFin enforcement<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med-High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Ongoing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cyber/ransomware<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Very High<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Ongoing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>IBM dependency/price shock<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med-High<\u002Fsc-raw-td><sc-raw-td>3–7y<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>COBOL skills wave<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>3–10y<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Investment underfunding<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Ongoing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Member-bank consolidation<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med-High<\u002Fsc-raw-td><sc-raw-td>Ongoing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Large bank defection<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Ongoing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>VR Payment integration<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>2026–27<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Key-person (new Vorstand)<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>1–3y<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Loss-making subsidiaries (TRUUCO)<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Ongoing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Data protection breach<\u002Fsc-raw-td><sc-raw-td>Low-Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Ongoing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Reputational contagion to coop brand<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td>Med-High<\u002Fsc-raw-td><sc-raw-td>Ongoing<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Single points of failure:<\u002Fstrong> the agree21 central platform (proven by the July 2026 event that NETZWELT reported affected \"490 Banken,\" with app/online banking deliberately switched off and, \"zwischen 9:47 Uhr und 10:38 Uhr auch die Websites der betroffenen Banken nicht erreichbar\") and IBM Z. Both are, by design, concentrated.<\u002Fp><h2 id=\"s-v-17\" class=\"hd hd2\"><span class=\"hn mono\">V.17<\u002Fspan><span class=\"ht\">Stress Tests<\u002Fspan><\u002Fh2><ol class=\"lst\"><li><strong>Catastrophic multi-day outage:<\u002Fstrong> immediate loss of banking for a majority of ~700 banks; severe reputational/regulatory fallout; survivable (no exit alternative) but forces emergency BaFin measures and possibly governance change.<\u002Fli><li><strong>DORA CTPP designation:<\u002Fstrong> direct ESA oversight, JET inspections, reporting burden; Coenen already judges DORA effort \"unaufwendiger als für unsere Banken\" — manageable, reputationally mixed.<\u002Fli><li><strong>Formal BaFin measures after 2023 inspection:<\u002Fstrong> capital add-ons already flowed to primary banks via parcIT; escalation would raise sector cost and pressure the Vorstand.<\u002Fli><li><strong>IBM sharp price rise / mainframe exit:<\u002Fstrong> high cost given the fresh z17 lock; multi-year contract provides medium-term planning security; migration off Z would be a decade-long megaproject.<\u002Fli><li><strong>€450m–€1bn/yr requirement materialises:<\u002Fstrong> forces either much higher levies (owner revolt risk) or restructuring; the defining financial stress test.<\u002Fli><li><strong>Consolidation to &lt;400 banks:<\u002Fstrong> accounts persist but governance concentrates; larger owners gain leverage; collective model strained.<\u002Fli><li><strong>Top-ten Volksbank defects:<\u002Fstrong> symbolic shock; Apobank precedent deters; would trigger a sector crisis of confidence.<\u002Fli><li><strong>Successful ransomware encrypting core:<\u002Fstrong> existential operational event; mitigated by z17 confidential computing/quantum-safe encryption and four DCs; residual risk high.<\u002Fli><li><strong>VR Payment card integration fails/slips:<\u002Fstrong> contained (2026–27), reputational, not existential.<\u002Fli><li><strong>Atruvia–FI merger talks open:<\u002Fstrong> the most consequential structural scenario — see <a class=\"xr\" href=\"#s-v-20\">V.20<\u002Fa> H3.<\u002Fli><li><strong>Cloud-native vendor wins a German coop/savings bank:<\u002Fstrong> low probability near-term; would be a genuine strategic warning shot.<\u002Fli><li><strong>Multiple simultaneous Vorstand departures:<\u002Fstrong> elevated given three sub-18-month tenures; would stall the Aktionsradius strategy.<\u002Fli><\u002Fol><h2 id=\"s-v-18\" class=\"hd hd2\"><span class=\"hn mono\">V.18<\u002Fspan><span class=\"ht\">What Could Make Atruvia Obsolete?<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Cloud-native core reaching German-coop maturity:<\u002Fstrong> possible but slow; does not remove the verbund-integration or migration problem. <strong>Atruvia can adopt elements (OpenShift already in stack).<\u002Fstrong><\u002Fli><li><strong>BaaS/modular erosion from the edges:<\u002Fstrong> real and gradual; erodes module revenue, not the regulated core.<\u002Fli><li><strong>AI-assisted core-banking replacement dramatically lowering migration cost — THE single most important potential disruptor.<\u002Fstrong> If AI cuts the cost/time/risk of core migration by an order of magnitude, the Apobank deterrent weakens and the lock loosens. <strong>BUT<\u002Fstrong> Atruvia is itself building the AI stack (plainGPT/GenoGPT, \"autonomous banking\" with IBM) and could use AI to <em>lower its own<\u002Fem> migration and maintenance cost — turning the disruptor into a defensive tool. <strong>Ambiguous: could commoditise the lock OR reinforce it.<\u002Fstrong><\u002Fli><li><strong>Hyperscalers up the stack:<\u002Fstrong> contained by sovereignty politics and the IBM sovereignty framing.<\u002Fli><li><strong>Radical consolidation producing build-capable banks:<\u002Fstrong> even the largest coop bank is too small to self-build economically.<\u002Fli><li><strong>Sector merger with FI:<\u002Fstrong> not obsolescence but transformation (<a class=\"xr\" href=\"#s-v-20\">V.20<\u002Fa> H3).<\u002Fli><\u002Ful><p><strong>Verdict:<\u002Fstrong> no single technology makes Atruvia obsolete because the customer problem (regulated, integrated, migrated banking for a whole verbund) persists. The lock could <em>loosen<\u002Fem> if AI collapses migration economics — the one scenario worth watching closely.<\u002Fp><h2 id=\"s-v-19\" class=\"hd hd2\"><span class=\"hn mono\">V.19<\u002Fspan><span class=\"ht\">Strategic Optionality<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Adjacency<\u002Fsc-raw-th><sc-raw-th>Classification<\u002Fsc-raw-th><sc-raw-th>Rationale<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>National card processor post-VR Payment<\u002Fsc-raw-td><sc-raw-td>Plausible → Natural<\u002Fsc-raw-td><sc-raw-td>Deal effective 1 Jan 2027; per McDermott, \"a significant portion of all credit card transactions in Germany is processed through Atruvia's systems\"<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sell platform components/EGP outside sector<\u002Fsc-raw-td><sc-raw-td>Plausible<\u002Fsc-raw-td><sc-raw-td>Bücker's API/technologieoffene-Plattform signal; unproven externally<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>External (non-coop) core-banking sales<\u002Fsc-raw-td><sc-raw-td>Plausible<\u002Fsc-raw-td><sc-raw-td>Warburg, private banks, ADAC; but dilutes coop focus<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Commercialise AI stack (plainGPT/GenoGPT)<\u002Fsc-raw-td><sc-raw-td>Plausible<\u002Fsc-raw-td><sc-raw-td>Steep internal adoption (\"eine der steilsten Adoptionskurven\"); EU-hosted; sellable to regulated peers<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Regulatory/compliance software (parcIT/FORUM)<\u002Fsc-raw-td><sc-raw-td>Natural<\u002Fsc-raw-td><sc-raw-td>Existing products; parcIT's own BaFin findings a caution<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>BPO expansion (Serviscope/Peras)<\u002Fsc-raw-td><sc-raw-td>Natural<\u002Fsc-raw-td><sc-raw-td>Existing, low-margin<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Consulting JV (Awado/GVB)<\u002Fsc-raw-td><sc-raw-td>Plausible<\u002Fsc-raw-td><sc-raw-td>Under active review, decision autumn 2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Nearshore as a business (Accesa/RaRo)<\u002Fsc-raw-td><sc-raw-td>Stretch<\u002Fsc-raw-td><sc-raw-td>Internal capability, not a market offering<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>International coop-banking expansion<\u002Fsc-raw-td><sc-raw-td>Strategic fantasy<\u002Fsc-raw-td><sc-raw-td>No evidence, no mandate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Merger/deep cooperation with FI<\u002Fsc-raw-td><sc-raw-td>Plausible (sector-level)<\u002Fsc-raw-td><sc-raw-td>Already co-operating on training; the structural endgame<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-v-20\" class=\"hd hd2\"><span class=\"hn mono\">V.20<\u002Fspan><span class=\"ht\">What Is Atruvia Becoming? (probability-ranked)<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>H1 — remains a captive coop utility, essentially unchanged. ~35%.<\u002Fstrong> For: ownership, Apobank deterrent, sovereignty politics. Against: Coenen's explicit Aktionsradius expansion; commercial-bank Vorstand hires; investment-funding pressure. <strong>Base case with drift.<\u002Fstrong><\u002Fli><li><strong>H5 — progressively disintermediated at the edges while retaining the regulated core. ~25%.<\u002Fstrong> For: BaaS/fintech module erosion, neobank pressure on member banks. Against: Atruvia's platform/API strategy actively defends the edge.<\u002Fli><li><strong>H4 — payments/card processor of national significance. ~15%.<\u002Fstrong> For: VR Payment Issuing-Processing (effective 1 Jan 2027), credit-card processing, \"Karten-Powerhouse\" framing. Against: scope limited to issuing; VR Payment keeps acquiring/POS/Händlergeschäft.<\u002Fli><li><strong>H3 — merges/deeply consolidates with Finanz Informatik. ~12% within 10y, rising.<\u002Fstrong> For: identical IBM-mainframe utility models, joint training venture, sector cost logic, sovereignty argument for one national banking-IT champion. Against: deep cultural/ownership rivalry (rot vs blau-orange), governance complexity, competition concerns.<\u002Fli><li><strong>H6 — restructured by the sector after an investment/governance crisis. ~10%.<\u002Fstrong> For: the €450m–€1bn funding gap, thin FCF. Against: owners prefer incremental levies to upheaval.<\u002Fli><li><strong>H2 — becomes a genuinely commercial open-market core-banking vendor. ~3%.<\u002Fstrong> For: rhetoric. Against: captive identity, no track record of open-market core wins, coop mandate.<\u002Fli><\u002Ful><h2 id=\"s-v-21\" class=\"hd hd2\"><span class=\"hn mono\">V.21<\u002Fspan><span class=\"ht\">Five-Year and Ten-Year Strategic Map<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Base case (2031):<\u002Fstrong> captive utility with expanded card/consulting/AI adjacencies; margin ~4%; levies persist; agree21 modernised in place; FI gap narrows slowly.<\u002Fli><li><strong>Strong execution:<\u002Fstrong> investment-funding resolved; core rebuild on track; app leadership; external wins accumulate; margin stable, competitiveness rising.<\u002Fli><li><strong>Investment crisis:<\u002Fstrong> funding gap unresolved; modernisation slips; competitiveness erodes; pressure toward H6.<\u002Fli><li><strong>Regulatory shock (DORA CTPP + BaFin measures):<\u002Fstrong> higher compliance cost, reputational damage, governance intervention; survivable.<\u002Fli><li><strong>Technology disruption (cloud-native/AI migration maturity):<\u002Fstrong> lock loosens; Atruvia must adopt AI-native migration or cede edge share.<\u002Fli><li><strong>Sector consolidation (Atruvia–FI, 2031–2036):<\u002Fstrong> a single German banking-IT utility (&gt;€5bn revenue, ~10,000 FTE, &gt;200m accounts) — the most transformative outcome.<\u002Fli><li><strong>Major operational failure:<\u002Fstrong> trust shock; emergency measures; accelerates governance reform.<\u002Fli><\u002Ful><h2 id=\"s-v-22\" class=\"hd hd2\"><span class=\"hn mono\">V.22<\u002Fspan><span class=\"ht\">Sector Misconceptions<\u002Fspan><\u002Fh2><ol class=\"lst\"><li><strong>\"DZ Bank owns ~20% of Atruvia.\"<\u002Fstrong> FALSE (established). DZ Bank holds ~0.35% directly; the ~20% figure refers to Verimi. Persists via lazy conflation.<\u002Fli><li><strong>\"Atruvia is just an IT provider.\"<\u002Fstrong> Reality: it is the operational nervous system, compliance backbone and increasingly the card/payments and consulting infrastructure of the entire verbund.<\u002Fli><li><strong>\"Captive ownership means it is safe.\"<\u002Fstrong> Reality: captivity prevents exit but risks under-investment; safety is conditional on funding and reliability.<\u002Fli><li><strong>\"The reported profit is a commercial margin.\"<\u002Fstrong> FALSE. FY2025 Betriebsergebnis (€89.0m, 4.7% margin, \"rund ein Drittel über dem des Geschäftsjahres 2024\") ≈ the ~€90m Digitalisierungsumlage; strip the levy and the underlying result is near zero. Profit is engineered investment fuel, not a market margin.<\u002Fli><li><strong>\"The banks could switch if they wanted to.\"<\u002Fstrong> Reality: Apobank proves switching is ruinous even for one bank; for the sector it is inconceivable.<\u002Fli><li><strong>\"The mainframe is a legacy liability.\"<\u002Fstrong> Partly false: IBM Z delivers the reliability, security and throughput (~80bn+ transactions) the use-case demands; the z17 deal buys quantum-safe crypto and AI acceleration. The liability is skills/cost, not capability.<\u002Fli><li><strong>\"Atruvia and FI are basically the same.\"<\u002Fstrong> Similar structure, but FI is ~2.4× more efficient per head, further ahead on cards and app awards.<\u002Fli><li><strong>\"A cooperative cannot be a competitive technology company.\"<\u002Fstrong> Untested rather than false: Atruvia's migration and compliance capabilities are genuinely competitive; its efficiency and modernisation velocity are not yet.<\u002Fli><\u002Fol><h2 id=\"s-v-23\" class=\"hd hd2\"><span class=\"hn mono\">V.23<\u002Fspan><span class=\"ht\">Management and Capital-Allocation Judgement<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Decision<\u002Fsc-raw-th><sc-raw-th>Verdict<\u002Fsc-raw-th><sc-raw-th>Evidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>2015 merger<\u002Fsc-raw-td><sc-raw-td>Value-creating<\u002Fsc-raw-td><sc-raw-td>€125m/yr synergies, single platform<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>agree21 over bank21<\u002Fsc-raw-td><sc-raw-td>Strategically necessary<\u002Fsc-raw-td><sc-raw-td>Consolidation completed; northern banks bore pain<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>\"Mondlandung\" migration<\u002Fsc-raw-td><sc-raw-td>Value-creating<\u002Fsc-raw-td><sc-raw-td>Built the migration flywheel<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Modernise COBOL in place<\u002Fsc-raw-td><sc-raw-td>Strategically necessary<\u002Fsc-raw-td><sc-raw-td>Apobank/Sparda-Sopra failures validate it<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2021 rebrand<\u002Fsc-raw-td><sc-raw-td>Questionable/neutral<\u002Fsc-raw-td><sc-raw-td>Cosmetic; limited evidence of value<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Levy-funded investment model<\u002Fsc-raw-td><sc-raw-td>Strategically necessary but strained<\u002Fsc-raw-td><sc-raw-td>Funds investment; masks near-zero underlying profit<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>4% Zielrendite<\u002Fsc-raw-td><sc-raw-td>Questionable<\u002Fsc-raw-td><sc-raw-td>Too modest to self-fund the €450m–€1bn gap<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Agile transformation<\u002Fsc-raw-td><sc-raw-td>Too early to judge<\u002Fsc-raw-td><sc-raw-td>Kununu strong; transformation fatigue evident<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Response to 2018 BaFin<\u002Fsc-raw-td><sc-raw-td>Value-creating (reactive)<\u002Fsc-raw-td><sc-raw-td>audIT largely delivered by end-2021<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Nov 2025 IBM z17<\u002Fsc-raw-td><sc-raw-td>Strategically necessary; risky<\u002Fsc-raw-td><sc-raw-td>Buys sovereignty features; deepens dependency<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>VR Payment acquisition<\u002Fsc-raw-td><sc-raw-td>Strategically necessary<\u002Fsc-raw-td><sc-raw-td>Consolidates cards; Bundeskartellamt B9-75/26 pending<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>External-customer growth<\u002Fsc-raw-td><sc-raw-td>Too early<\u002Fsc-raw-td><sc-raw-td>Warburg/Sparda wins; dilutes focus<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Nearshore build-out (Cluj ~700)<\u002Fsc-raw-td><sc-raw-td>Value-creating<\u002Fsc-raw-td><sc-raw-td>Talent/cost hedge<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sustained support of loss-making TRUUCO<\u002Fsc-raw-td><sc-raw-td>Questionable<\u002Fsc-raw-td><sc-raw-td>~−€7.98m; no clear path to value<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-v-24\" class=\"hd hd2\"><span class=\"hn mono\">V.24<\u002Fspan><span class=\"ht\">Volume V Reconstruction — synthesis answers<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Why does Atruvia persist?<\u002Fstrong> Because its owners cannot leave it, cannot rebuild it, and cannot find a cooperative-specific alternative — persistence is structural, not competitive.<\u002Fli><li><strong>Genuinely defensible vs merely locked in?<\u002Fstrong> Defensible: migration capability, regulatory capability, verbund integration. Locked-in (not defensible on merit): the captive base and switching costs.<\u002Fli><li><strong>Hardest to replicate / easiest?<\u002Fstrong> Hardest: verbund integration + migration machinery + regulatory trust (effectively irreproducible). Easiest: data-centre hardware and app front-ends.<\u002Fli><li><strong>Current bottleneck:<\u002Fstrong> sector investment-funding governance.
