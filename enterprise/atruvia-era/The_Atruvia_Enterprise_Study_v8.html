re<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-14\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 14<\u002Fspan><span class=\"fig-t\">The DORA Supervisory Perimeter<\u002Fspan><\u002Fdiv><div class=\"fig-b\"><div style=\"border:2.7px solid var(--acc);background:var(--acc-fill);padding:17.8px 19.1px\"><div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.4px solid var(--acc-dk);padding-bottom:9.6px;margin-bottom:15px\"><span class=\"f-lbl\" style=\"color:var(--acc)\">Inside the perimeter — designated Critical ICT Third-Party Providers<\u002Fspan><span class=\"f-num\" style=\"font-size:15px;color:var(--acc)\">ESA list, 18 Nov 2025 · 19 providers<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:9.6px;align-items:center\"><span style=\"border:1.4px solid var(--acc);background:var(--acc);color:var(--paper);padding:8.2px 15px;font-family:var(--font-heading);font-size:19.1px;letter-spacing:.06em\">IBM<span style=\"font-size:13.7px;letter-spacing:.1em;margin-left:10.9px;opacity:.85\">LEAD OVERSEER: EBA<\u002Fspan><\u002Fspan><span style=\"border:1.4px solid var(--acc-dk);background:transparent;padding:6.8px 12.3px;font-size:15px;color:var(--muted)\">AWS<\u002Fspan><span style=\"border:1.4px solid var(--acc-dk);background:transparent;padding:6.8px 12.3px;font-size:15px;color:var(--muted)\">Microsoft<\u002Fspan><span style=\"border:1.4px solid var(--acc-dk);background:transparent;padding:6.8px 12.3px;font-size:15px;color:var(--muted)\">Google Cloud<\u002Fspan><span style=\"border:1.4px solid var(--acc-dk);background:transparent;padding:6.8px 12.3px;font-size:15px;color:var(--muted)\">Oracle<\u002Fspan><span style=\"border:1.4px solid var(--acc-dk);background:transparent;padding:6.8px 12.3px;font-size:15px;color:var(--muted)\">SAP<\u002Fspan><span style=\"border:1.4px solid var(--acc-dk);background:transparent;padding:6.8px 12.3px;font-size:15px;color:var(--muted)\">SWIFT<\u002Fspan><span style=\"border:1.4px solid var(--acc-dk);background:transparent;padding:6.8px 12.3px;font-size:15px;color:var(--muted)\">+ 11 further providers<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300.7px;gap:24.6px;align-items:start;margin-top:0\"><div><svg sc-camel-view-box=\"0 0 40 34\" width=\"54.7\" height=\"34\" style=\"display:block;margin-left:49.2px\" aria-hidden=\"true\"><line x1=\"12\" y1=\"34\" x2=\"12\" y2=\"8\" stroke=\"var(--acc)\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\" style=\"stroke:var(--acc)\"><\u002Fline><path d=\"M7.5 12 L12 4 L16.5 12\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.5\" style=\"stroke:var(--acc)\"><\u002Fpath><\u002Fsvg><div style=\"display:flex;gap:10.9px;flex-wrap:wrap\"><div style=\"flex:1;min-width:287.1px;border:1.4px dashed var(--wire);padding:12.3px 15px;background:transparent\"><div class=\"f-name\" style=\"font-size:19.1px;letter-spacing:.04em\">ATRUVIA<\u002Fdiv><div class=\"f-meta\" style=\"margin-top:4.1px\">~490–520 German banks disabled by a single central fault<\u002Fdiv><div style=\"font-size:13.7px;color:var(--acc);margin-top:8.2px;font-family:var(--font-heading);letter-spacing:.12em\">DEPENDS ON IBM ↑<\u002Fdiv><\u002Fdiv><div style=\"flex:1;min-width:287.1px;border:1.4px dashed var(--wire);padding:12.3px 15px;background:transparent\"><div class=\"f-name\" style=\"font-size:19.1px;letter-spacing:.04em\">FINANZ INFORMATIK<\u002Fdiv><div class=\"f-meta\" style=\"margin-top:4.1px\">~350 Sparkassen on OSPlus<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"f-lbl\" style=\"margin-top:12.3px\">Outside the perimeter — supervised only indirectly, through customers’ §25b KWG outsourcing obligations<\u002Fdiv><\u002Fdiv><div class=\"bp\" style=\"padding:13.7px 15px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div style=\"font-size:15px;line-height:1.4;color:var(--muted)\">Atruvia is instead reached through <b>§25b KWG<\u002Fb>, <b>MaRisk AT 9<\u002Fb> and <b>BAIT<\u002Fb> imposed on its bank customers, plus direct BaFin <b>§44 KWG<\u002Fb> inspections — one begun November 2023.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption class=\"fig-c\"><b>Atruvia’s supplier is directly supervised. Atruvia is not.<\u002Fb> The perimeter was drawn around cloud and infrastructure providers, not around national core-banking utilities.<\u002Ffigcaption><\u002Ffigure><p>Atruvia is <strong>not a licensed credit institution.<\u002Fstrong> It is supervised principally <em>indirectly<\u002Fem>, through the outsourcing obligations of its bank customers, plus direct BaFin inspection powers and (contractually) DORA.<\u002Fp><ul class=\"lst\"><li><strong>§25b KWG + MaRisk AT 9:<\u002Fstrong> the outsourcing banks remain fully responsible; they must maintain outsourcing registers, risk assessments, exit strategies and audit rights over Atruvia. Because ~800 banks outsource core banking to one provider, Atruvia sits at the centre of the sector's outsourcing-risk map.<\u002Fli><li><strong>BAIT (and its KRITIS module, since 2018):<\u002Fstrong> bank IT requirements flow to Atruvia through customer contracts; the BAIT KRITIS module permits the §8a/§39 BSIG nachweis to be delivered within the annual audit.<\u002Fli><li><strong>BaFin §44 KWG:<\u002Fstrong> BaFin can and does inspect banks' outsourced IT providers directly; the November 2023 inspection is the concrete instance.<\u002Fli><li><strong>DORA (Regulation (EU) 2022/2554):<\u002Fstrong> in force from 17 January 2025. <strong>CRITICAL FINDING: on the ESAs' first CTPP list published 18 November 2025 (19 providers), Atruvia was NOT designated a Critical ICT Third-Party Provider. IBM WAS designated (Lead Overseer: EBA), as were AWS, Microsoft, Google Cloud, Oracle, SAP, Deutsche Telekom, SWIFT, Worldline, Temenos, Equinix and others<\u002Fstrong> [<span class=\"ev\">CONFIRMED FACT<\u002Fspan> — EBA/ESMA/EIOPA joint announcement, 18 November 2025]. <em>Why not Atruvia?<\u002Fem> The DORA methodology (Art. 31) weights <em>cross-border footprint<\u002Fem> (services in 3+ member states), <em>systemic impact across the EU<\u002Fem>, and <em>substitutability<\u002Fem>; Atruvia is overwhelmingly domestic (Germany-only) and intra-sector in character, which likely kept it below the CTPP threshold even though it is systemically central <em>within Germany<\u002Fem> [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>]. The list is updated annually, so future designation is plausible but not imminent. Meanwhile Atruvia still bears full DORA obligations as an ordinary ICT third-party provider (mandatory contractual clauses, incident support, testing participation, exit facilitation) — but escapes the direct ESA oversight, oversight fees, on-site inspection powers, binding recommendations, and the power to require financial entities to suspend/terminate services that CTPP status carries. Designated CTPPs face periodic penalty payments of <strong>up to 1% of average daily worldwide turnover<\u002Fstrong> per day of breach (Art. 35(6)) — a burden IBM now carries and Atruvia does not.<\u002Fli><li><strong>KRITIS / BSI-KritisV:<\u002Fstrong> finance/insurance is a KRITIS sector and Atruvia's data centres/processing almost certainly exceed thresholds; since 17 January 2025, DORA-regulated entities are exempt from the parallel §32 BSIG incident-reporting duty (DORA reports are routed BaFin→BSI) [<span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> — Atruvia's specific KRITIS registration is not individually public].<\u002Fli><li><strong>NIS2:<\u002Fstrong> German transposition (BSIG recast, in force late 2025) treats DORA-regulated financial entities as lex specialis, reducing double reporting.<\u002Fli><li><strong>Bundesbank/ECB:<\u002Fstrong> interest arises from payment-system and (post-VR Payment) card-processing volumes; Atruvia itself is not directly ECB-supervised.<\u002Fli><li><strong>Certifications/audits:<\u002Fstrong> Atruvia states ISO 27001, high availability and high security standards; service-organisation reporting (IDW PS 951 / ISAE 3402) is standard for such providers [<span class=\"ev\">COMPANY CLAIM<\u002Fspan> — specific certificate scopes not fully public].<\u002Fli><\u002Ful><p><strong>Does the competitor face the same burden?<\u002Fstrong> Yes — <strong>Finanz Informatik<\u002Fstrong> (the Sparkassen equivalent; Atruvia and Finanz Informatik top the Lünendonk ranking of German internal IT service providers) faces the identical §25b/MaRisk/BAIT/DORA regime and is similarly domestic; neither appears on the CTPP list. Accumulated regulatory capability is thus both a running cost and a barrier to entry: a challenger would have to reproduce a decade of MaRisk/BAIT/DORA-compliant operations to be credible.<\u002Fp><h2 id=\"s-i-7\" class=\"hd hd2\"><span class=\"hn mono\">I.7<\u002Fspan><span class=\"ht\">Own Capability vs Partner Dependency<\u002Fspan><\u002Fh2><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Capability<\u002Fsc-raw-th><sc-raw-th>Model<\u002Fsc-raw-th><sc-raw-th>Detail<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Core platform (agree21)<\u002Fsc-raw-td><sc-raw-td><strong>Own<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Atruvia-owned IP; IMS/COBOL back end, Java-enabled ~85% of transactions<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Mainframe hardware/software<\u002Fsc-raw-td><sc-raw-td><strong>Buy — deep dependency on IBM<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Historically 8× IBM z15 across four data centres; ~80bn core-banking transactions/yr, peaks 12,000 tps; IBM IMS transaction manager + Db2 for z/OS; migrating to <strong>IBM z17<\u002Fstrong> under the Nov 2025 deal; Red Hat OpenShift for hybrid cloud; IBM Turbonomic (workload optimisation) and Apptio (cost transparency) for vendor-independence<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Data centres<\u002Fsc-raw-td><sc-raw-td><strong>Own/operate<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Four data centres (Karlsruhe, Münster and others)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cloud / sovereignty<\u002Fsc-raw-td><sc-raw-td><strong>Hybrid<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>OpenShift for multi-cloud independence; GWS provides cloud; \"sovereignty\" framed by Atruvia (Bücker) across data, infrastructure, cloud, vendor and innovation dimensions<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>ATM / self-service (&gt;30,000 devices)<\u002Fsc-raw-td><sc-raw-td><strong>Subsidiary (Ratiodata)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Ratiodata supplies, rolls out and services SB systems nationwide; processing runs on IBM Z<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card issuing / processing<\u002Fsc-raw-td><sc-raw-td><strong>Building — via VR Payment acquisition<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Debit today; debit + credit from 1 Jan 2027<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Identity / authentication<\u002Fsc-raw-td><sc-raw-td><strong>Own + JV<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>VR SecureGo (authentication app) operated by Atruvia; Verimi JV for broader digital identity<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>IBM dependency assessment (mechanism):<\u002Fstrong> this is a mainframe monoculture. Switching cost is prohibitive (the IMS/COBOL/Db2 estate carries ~80bn+ transactions/yr), giving IBM strong bargaining power; the multi-year deal secures continuity but entrenches the dependency. IBM's own quote frames Atruvia's use of the z17 \"as a cornerstone to support its mission-critical operations including the core banking system.\" Resilience is high operationally (mature, hardened platform) but <em>concentration risk is severe.<\u002Fem> A second-order mitigant: IBM's CTPP designation places IBM under direct EU oversight, marginally strengthening Atruvia's resilience story without Atruvia bearing the compliance cost.<\u002Fp><h2 id=\"s-i-8\" class=\"hd hd2\"><span class=\"hn mono\">I.8<\u002Fspan><span class=\"ht\">Regulation and Structure as Competitive Position<\u002Fspan><\u002Fh2><p>Atruvia's position is simultaneously a <strong>barrier to entry<\u002Fstrong>, a <strong>strategic asset<\u002Fstrong> and a <strong>constraint<\u002Fstrong>:<\u002Fp><ul class=\"lst\"><li><em>Captive-ownership lock-in:<\u002Fem> member banks own their supplier, so switching means abandoning an asset they own and re-tooling core banking — near-insurmountable. But this is <strong>not<\u002Fstrong> an unqualified \"moat\": absent competition, pricing discipline is weak, modernisation can be slow, and under-investment risk is real (the multi-year pause on agree21 optimisation/individualisation while the migration ran is illustrative).<\u002Fli><li><em>Regulatory approval burden:<\u002Fem> a challenger must reproduce MaRisk/BAIT/DORA-grade operations and pass each bank's §25b due diligence — years of accumulated capability.<\u002Fli><li><em>Operational scale:<\u002Fem> safely running core banking for ~800 institutions and tens of millions of accounts is a genuine, hard-to-replicate capability.<\u002Fli><\u002Ful><p>Net assessment: the structure produces durability and systemic centrality, but the customer-owner model trades away the pricing discipline and accountability that external competition and external ownership would impose. The right way to score it is not \"moat = good\" but \"moat = durable, with a governance-driven under-investment tax.\"<\u002Fp><h2 id=\"s-i-9\" class=\"hd hd2\"><span class=\"hn mono\">I.9<\u002Fspan><span class=\"ht\">Institutional Dependency Map<\u002Fspan><\u002Fh2><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Institution<\u002Fsc-raw-th><sc-raw-th>Function<\u002Fsc-raw-th><sc-raw-th>Criticality<\u002Fsc-raw-th><sc-raw-th>Substitutability<\u002Fsc-raw-th><sc-raw-th>Their bargaining power<\u002Fsc-raw-th><sc-raw-th>Switching difficulty<\u002Fsc-raw-th><sc-raw-th>Failure impact<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>IBM<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Mainframe HW/SW (Z, IMS, Db2)<\u002Fsc-raw-td><sc-raw-td><strong>Critical<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Very low<\u002Fsc-raw-td><sc-raw-td>Very high<\u002Fsc-raw-td><sc-raw-td>Extreme<\u002Fsc-raw-td><sc-raw-td>Core banking halts<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Member banks (owners + customers)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Capital + revenue<\u002Fsc-raw-td><sc-raw-td><strong>Critical<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>None<\u002Fsc-raw-td><sc-raw-td>Collective/high<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>Existential both ways<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>BVR<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Sector coordination/strategy<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>Strategic drift<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>DZ Bank / GFG<\u002Fstrong> (Union Investment, R+V, Schwäbisch Hall, VR Payment)<\u002Fsc-raw-td><sc-raw-td>Central bank + product/payment partners<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Product/payment disruption<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>BaFin / Bundesbank / ESAs<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Supervision<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>None<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>Enforcement/restrictions<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Deutsche Kreditwirtschaft / girocard<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Payment scheme infrastructure<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Card/payment disruption<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Card schemes (Visa/Mastercard)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Card rails<\u002Fsc-raw-td><sc-raw-td>High (rising post-VR Payment)<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Card processing disruption<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>SCHUFA / data providers<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Credit data<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Lending friction<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Ratiodata (internal)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Hardware / SB services<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Low (owned)<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>ATM/branch hardware<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>COBOL/mainframe labour market<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Scarce skills<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>High (scarcity)<\u002Fsc-raw-td><sc-raw-td>n/a<\u002Fsc-raw-td><sc-raw-td>Maintenance risk<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Microsoft<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>M365 / productivity<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Office disruption<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Single point of institutional failure — both directions.<\u002Fstrong> Atruvia depends on IBM and on its member banks; but the systemic headline is the converse: <strong>Atruvia is itself a single point of failure for the German cooperative banking sector<\u002Fstrong> — the 646 cooperative banks counted by the BVR at year-end 2025, plus ~250 further private banks and the ADAC, and tens of millions of accounts. An extended Atruvia outage would incapacitate a large share of German retail banking. This is precisely the concentration DORA is meant to police — yet Atruvia's domestic profile kept it off the CTPP list, arguably leaving a <em>national<\u002Fem> systemic-risk supervisory gap even as <em>cross-border<\u002Fem> providers (IBM, the hyperscalers) are captured.<\u002Fp><h2 id=\"s-i-10\" class=\"hd hd2\"><span class=\"hn mono\">I.10<\u002Fspan><span class=\"ht\">Tax and Intercompany Architecture<\u002Fspan><\u002Fh2><p>Atruvia AG is German tax-resident (Frankfurt registered seat; Karlsruhe/Münster administration), subject to Körperschaftsteuer, Solidaritätszuschlag and Gewerbesteuer. The <strong>GmbH &amp; Co. KG holding vehicles are tax-transparent<\u002Fstrong> for income tax (income attributed to the Kommanditist banks); their purpose is member-governance and interest-pooling with limited liability — the standard German device for pooling many members' interests — <strong>not<\u002Fstrong> tax optimisation. Intercompany relationships: Atruvia charges member banks for services and cost-allocates within the group (e.g. the Ratiodata↔GWS hardware transfer 2024; Accesa/RaRo nearshore services to Atruvia). Effective tax rate and transfer-pricing detail are not individually disclosed [<span class=\"ev\">UNKNOWN<\u002Fspan>]. Results: Jahresüberschuss (AG) €7.6m (2022) and €27.8m (2023); operating result (Betriebsergebnis) €40.6m (2023), €66.6m (2024), €89m (2025); AG Gesamtleistung €1,516.3m (2023) with a 2024 plan of €1,636m; <strong>group revenue ~€2.2bn (2024)<\u002Fstrong> with <strong>10,076 group employees, 917 customers, 91m accounts and 9.32bn transactions<\u002Fstrong>; group revenue guided to ~€1.9bn at AG level / higher at group level with €89m operating result for 2025.<\u002Fp><h2 id=\"s-i-11\" class=\"hd hd2\"><span class=\"hn mono\">I.11<\u002Fspan><span class=\"ht\">Corporate and Regulatory Risk<\u002Fspan><\u002Fh2><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Risk<\u002Fsc-raw-th><sc-raw-th>Prob.<\u002Fsc-raw-th><sc-raw-th>Severity<\u002Fsc-raw-th><sc-raw-th>Mitigation<\u002Fsc-raw-th><sc-raw-th>Responsible function<\u002Fsc-raw-th><sc-raw-th>Residual<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>DORA CTPP designation (future)<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>DORA compliance already built; domestic profile keeps it below threshold<\u002Fsc-raw-td><sc-raw-td>Finance, Regulation &amp; HR<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Concentration / systemic outage<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Extreme<\u002Fsc-raw-td><sc-raw-td>Four data centres, HA, BCM, testing<\u002Fsc-raw-td><sc-raw-td>Core Banking &amp; Technology<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Core-platform modernisation risk<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Incremental Java refactor of IMS/COBOL; IBM deal<\u002Fsc-raw-td><sc-raw-td>Core Banking &amp; Technology<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>COBOL/mainframe skills attrition<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Java-enablement (85%), nearshore Accesa/RaRo<\u002Fsc-raw-td><sc-raw-td>Core Banking &amp; Technology<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cyber / ransomware<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Extreme<\u002Fsc-raw-td><sc-raw-td>ISO 27001, quantum-safe crypto (z17), SecureGo<\u002Fsc-raw-td><sc-raw-td>CISO / Technology<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>IBM supplier concentration<\u002Fsc-raw-td><sc-raw-td>High (exposure)<\u002Fsc-raw-td><sc-raw-td>Extreme<\u002Fsc-raw-td><sc-raw-td>Multi-year deal, OpenShift, Turbonomic/Apptio<\u002Fsc-raw-td><sc-raw-td>Vorstand<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Governance failure (owner-customer conflict)<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Pooling/consensus, AR committees<\u002Fsc-raw-td><sc-raw-td>Aufsichtsrat<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Member-bank consolidation shrinking owner base<\u002Fsc-raw-td><sc-raw-td>High (ongoing)<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Scale economics still favour Atruvia<\u002Fsc-raw-td><sc-raw-td>BVR / Vorstand<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Fintech/BaaS edge displacement<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Digital Banking ressort, ecosystem JVs<\u002Fsc-raw-td><sc-raw-td>Digital Banking<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>GDPR/BDSG exposure<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Certifications, DPO<\u002Fsc-raw-td><sc-raw-td>Legal / DPO<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>VR Payment integration risk<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td>Phased to 1 Jan 2027; McDermott advised; cartel filing pending<\u002Fsc-raw-td><sc-raw-td>Digital Banking<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><h2 id=\"s-i-12\" class=\"hd hd2\"><span class=\"hn mono\">I.12<\u002Fspan><span class=\"ht\">Volume I Reconstruction (Synthesis)<\u002Fspan><\u002Fh2><p><strong>Chronological corporate evolution:<\u002Fstrong> 1924 Fiducia (Karlsruhe) → 1963 GAD (Münster) and the Fiducia Buchungsgemeinschaft → 1999–2003 Fiducia consolidations (GRK, RWG, rbg) + agree v1.0 → 2007 bank21 across GAD → 2012 failed merger → Oct–Dec 2014 approvals (GAD 94%, Fiducia 100%) → <strong>1 July 2015 Fiducia &amp; GAD IT AG<\u002Fstrong> → 2017–2019 agree21 series migration → 2020 migration complete (~€125m synergy target) → <strong>1 Sep 2021 rebrand to Atruvia<\u002Fstrong> → 2023 EGP merged up, BaFin §44 inspection begins, Accesa/RaRo restructured to the AG → <strong>19 Nov 2025 IBM multi-year deal (z17)<\u002Fstrong> → <strong>18 Nov 2025 ESAs CTPP list (Atruvia not designated; IBM designated)<\u002Fstrong> → 1 Jan 2026 Vorstand \"Zielbild\" complete → <strong>2 Jul 2026 VR Payment Issuing-Processing acquisition<\u002Fstrong> (effective 1 Jan 2027; cartel filing 15 Jul 2026).<\u002Fp><p><strong>Corporate entity diagram (control flow):<\u002Fstrong> ~800 member banks → {BW-KG (Stuttgart, HRA 720090), Nord-KG (Münster, HRA 10029), Bayern-BBA (Beilngries, HRA 2070; 14.15%)} → VR-FGI Beteiligungsholding (Neu-Isenburg, HRA 42595; ~91.6% block) → <strong>Atruvia AG (HRB 102381)<\u002Fstrong> → {Ratiodata SE, parcIT, BMS CS, Peras, Serviscope, Accesa/RaRo, ECON, FORUM, TRUUCO, GWS} + minority JVs {Verimi, amberra}.<\u002Fp><p><strong>Regulatory/supervisory map:<\u002Fstrong> BaFin (§25b, §44 KWG; MaRisk AT 9; BAIT) supervises the <em>banks<\u002Fem>, reaching Atruvia through their outsourcing duties and direct inspection; ESAs (DORA) capture IBM as CTPP but not Atruvia; BSI (KRITIS/BSIG) and NIS2 apply with DORA as lex specialis; Bundesbank/ECB interest via payments.<\u002Fp><p><strong>Legal responsibility map:<\u002Fstrong> Atruvia AG contracts with banks, owns agree21 IP, employs core staff, is the \"Auslagerungsunternehmen\"; the <em>banks<\u002Fem> retain regulatory liability; parcIT/others own their niche IP.<\u002Fp><p><strong>Answers to the mandated questions:<\u002Fstrong><\u002Fp><ul class=\"lst\"><li><strong>Most strategically important legal entity:<\u002Fstrong> Atruvia AG itself (owns agree21 IP, holds the bank contracts and the outsourcing relationship, employs the core staff). Among the ownership vehicles, <strong>VR-FGI Beteiligungsholding GmbH &amp; Co. KG<\u002Fstrong> is the control linchpin.<\u002Fli><li><strong>Where actual control sits:<\u002Fstrong> with the member banks collectively, exercised through VR-FGI's pooled ~91.6% vote and BVR-coordinated consensus — not with DZ Bank or any single bank.<\u002Fli><li><strong>Greatest external dependency:<\u002Fstrong> <strong>IBM<\u002Fstrong> (mainframe monoculture).<\u002Fli><li><strong>Hardest-to-recreate asset:<\u002Fstrong> the <strong>agree21 single core platform<\u002Fstrong> running ~800 banks and tens of millions of accounts on IBM Z — a decade-plus, \"moon-landing\"-scale build plus the regulatory operating capability around it.<\u002Fli><li><strong>Most misunderstood by outsiders:<\u002Fstrong> the <strong>customer-owner identity<\u002Fstrong> (and the false belief that DZ Bank controls Atruvia). Ownership is captive and pooled, not centralised.<\u002Fli><li><strong>What would take longest to rebuild from zero:<\u002Fstrong> not the software licences or data centres, but (a) the migrated, cleansed data and battle-tested agree21 operating processes, and (b) the accumulated MaRisk/BAIT/DORA regulatory operating capability and the sector's trust — a decade-scale endeavour.<\u002Fli><\u002Ful><p><strong>Ten most important conclusions:<\u002Fstrong><\u002Fp><ol class=\"lst\"><li>Atruvia is systemically central to German cooperative banking yet escaped DORA CTPP designation because it is domestic, not cross-border — a potential supervisory blind spot for <em>national<\u002Fem> systemic risk.<\u002Fli><li>Control is genuinely collective (VR-FGI pooling), making Atruvia unusually accountable to its customers-as-owners but structurally weak on external pricing discipline.<\u002Fli><li>DZ Bank does not control Atruvia; the \"~20%\" figure is Verimi, not Atruvia.<\u002Fli><li>IBM is the deepest single dependency; the Nov 2025 z17 deal entrenches rather than reduces it.<\u002Fli><li>agree21 is the crown jewel and the single largest concentration risk simultaneously.<\u002Fli><li>The 20-seat, MitbestG-1976 co-determined board gives employees 10 of 20 seats — significant for a workforce-heavy IT business (Wiegelmann is Arbeitsdirektor).<\u002Fli><li>The 2025–26 Vorstand turnover (Beyer/Teufel out; Kaurin, Japec, Wiegelmann in) is a deliberate generational-plus-external-expertise refresh.<\u002Fli><li>The VR Payment acquisition materially expands Atruvia into credit-card processing, raising card-scheme exposure and integration risk (subject to Bundeskartellamt clearance).<\u002Fli><li>Disclosure is thin (no listing, no IR, no analyst coverage) — several economic/tax specifics are genuinely <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fli><li>The captive model is durable but structurally prone to under-investment and slow modernisation absent competitive pressure.<\u002Fli><\u002Fol><div class=\"sep\"><\u002Fdiv><h2 id=\"s-recommendations\" class=\"hd hd2\"><span class=\"ht\">Recommendations<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>For a competitor / cloud-native core challenger:<\u002Fstrong> Do not attack the captive core head-on. Target the edges — digital-banking UX, data analytics, BaaS/ecosystem modules — where fintech displacement is Atruvia's own stated concern. <em>Benchmark to watch:<\u002Fem> any member-bank defection or dual-sourcing of non-core modules would signal a real opening; conversely, deeper IBM entrenchment and the VR Payment integration make the core more, not less, defensible.<\u002Fli><li><strong>For a member bank (owner-customer):<\u002Fstrong> Use the pooled governance to push for transparent, usage-based pricing (already signalled at the 2024 HV) and a public modernisation roadmap. <em>Escalation threshold:<\u002Fem> if agree21 modernisation milestones slip, or if IBM-dependency mitigation (OpenShift/hybrid, vendor-independence tooling) stalls, invoke the Aufsichtsrat's Strategy and Technology-&amp;-Architecture committees.<\u002Fli><li><strong>For a supervisor (BaFin / Bundesbank):<\u002Fstrong> Treat Atruvia as a <em>de facto national systemic node<\u002Fem> despite its non-CTPP status; ensure §44 inspections and DORA oversight-by-proxy explicitly cover the single-point-of-failure scenario for ~800 banks. <em>Trigger for direct action:<\u002Fem> any material availability incident affecting multiple institutions, or a step-change in cross-border service that could bring Atruvia within the CTPP threshold at the next annual ESA refresh.<\u002Fli><li><strong>For an analyst / acquirer of adjacent assets:<\u002Fstrong> Track two clocks — the VR Payment integration (to 1 January 2027, plus cartel clearance in case B9-75/26) and the annual ESA CTPP refresh. CTPP designation would materially raise Atruvia's compliance cost and oversight exposure (up to 1% of worldwide turnover per day of breach for designated providers).<\u002Fli><\u002Ful><h2 id=\"s-caveats\" class=\"hd hd2\"><span class=\"ht\">Caveats<\u002Fspan><\u002Fh2><ul class=\"lst\"><li><strong>Thin disclosure environment:<\u002Fstrong> no listing, no investor relations, no earnings calls, no analyst coverage, no prudential disclosure. Executive compensation, exact effective tax rate, transfer-pricing detail, the VR Payment purchase price, and Atruvia's specific KRITIS registration are <strong><span class=\"ev\">UNKNOWN<\u002Fspan><\u002Fstrong>.<\u002Fli><li><strong>Ownership precision:<\u002Fstrong> only Bavaria's 14.15% indirect stake is individually public; the Baden-Württemberg and Nord KG percentages are not disclosed (the three together = 91.6%). The exact per-share vs per-member voting rule inside the pooling agreement / any formal Konsortialvertrag could not be confirmed from an accessible primary document.<\u002Fli><li><strong>Migration cost:<\u002Fstrong> the \"on time and on budget\" / €125m-synergy figures are company claims; no independent audit of total programme cost or overruns is public.<\u002Fli><li><strong>CTPP status is a snapshot:<\u002Fstrong> the ESA list is updated annually; Atruvia's non-designation as of 18 November 2025 could change in future rounds.<\u002Fli><li><strong>Customer-count and data variance:<\u002Fstrong> Atruvia/IBM/NetApp sources cite figures ranging from ~800 to ~950 \"banks,\" 81–91m accounts, and four to six data centres, depending on scope (member banks vs all customers) and date; the BVR's 646 is the count of <em>cooperative banks<\u002Fem> at year-end 2025, while Atruvia's ~900+ \"Kunden\" includes private banks and other entities. Minor discrepancy in the shareholder chart (GB2023 shows 1.3% \"sonstige/genossenschaftliche Unternehmen\" vs 1.7% in some summaries); the most granular Aug-2026 table resolves the cooperative total to 99.68%.<\u002Fli><li>Employee and revenue figures vary by scope (AG vs group) and reporting date; \"As of\" dates are given where material.<\u002Fli><\u002Ful><p><em>End of <a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa>. <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-service-delivery-architecture\">Volume II<\u002Fa> (Business Model, Products, Platform Architecture &amp; Economics) not begun, per instruction.<\u002Fem><\u002Fp><div class=\"sep\"><\u002Fdiv><\u002Fsection><section class=\"sec\" data-part=\"2\"><header class=\"opener\"><div class=\"opener-in\"><div class=\"rail\"><span>Part II<\u002Fspan><a href=\"#contents\">Volume II &nbsp;·&nbsp; Contents ↑<\u002Fa><\u002Fdiv><div class=\"numrow\"><i><\u002Fi><span class=\"numeral\">II<\u002Fspan><\u002Fdiv><h1 id=\"part-ii-part-ii-product-customer-service-delivery-architecture\" class=\"part\" data-short=\"Part II — Product, Customer &amp; Service-Delivery Architecture\">Product, Customer &amp; Service-Delivery Architecture<\u002Fh1><p class=\"opener-s\">What Atruvia sells, to whom, and what a member bank actually buys.<\u002Fp><div class=\"plate\"><div class=\"plate-c\"><div class=\"plate-k\">Volume<\u002Fdiv><div class=\"plate-v\">II<\u002Fdiv><\u002Fdiv><div class=\"plate-c\"><div class=\"plate-k\">Sections<\u002Fdiv><div class=\"plate-v\">17<\u002Fdiv><\u002Fdiv><div class=\"plate-c tint\"><div class=\"plate-k\">Customers<\u002Fdiv><div class=\"plate-v\">917 institutions<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"inpart blueprint\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"inpart-k\">In this part<\u002Fdiv><div class=\"inpart-g\"><a href=\"#s-volume-ii-product-customer-service-delivery-architecture\"><span class=\"inpart-n\"><\u002Fspan><span>VOLUME II: Product, Customer &amp; Service-Delivery Architecture<\u002Fspan><\u002Fa><a href=\"#s-preface-and-method\"><span class=\"inpart-n\"><\u002Fspan><span>Preface and Method<\u002Fspan><\u002Fa><a href=\"#s-ii-0\"><span class=\"inpart-n\">II.0<\u002Fspan><span>Reconciling the Scale Numbers (a prerequisite)<\u002Fspan><\u002Fa><a href=\"#s-ii-1\"><span class=\"inpart-n\">II.1<\u002Fspan><span>Product and Service Universe<\u002Fspan><\u002Fa><a href=\"#s-ii-2\"><span class=\"inpart-n\">II.2<\u002Fspan><span>The Two-Tier Customer Structure (given unusual weight)<\u002Fspan><\u002Fa><a href=\"#s-ii-3\"><span class=\"inpart-n\">II.3<\u002Fspan><span>Customer Segmentation<\u002Fspan><\u002Fa><a href=\"#s-ii-4\"><span class=\"inpart-n\">II.4<\u002Fspan><span>Jobs to Be Done<\u002Fspan><\u002Fa><a href=\"#s-ii-5\"><span class=\"inpart-n\">II.5<\u002Fspan><span>Service-Delivery Flow Reconstruction (replaces money-movement; priority depth)<\u002Fspan><\u002Fa><a href=\"#s-ii-6\"><span class=\"inpart-n\">II.6<\u002Fspan><span>Transaction Processing Teardown (priority depth)<\u002Fspan><\u002Fa><a href=\"#s-ii-7\"><span class=\"inpart-n\">II.7<\u002Fspan><span>Channel Architecture<\u002Fspan><\u002Fa><a href=\"#s-ii-8\"><span class=\"inpart-n\">II.8<\u002Fspan><span>Pricing and Cost-Allocation Architecture (priority depth)<\u002Fspan><\u002Fa><a href=\"#s-ii-9\"><span class=\"inpart-n\">II.9<\u002Fspan><span>Product Dependency Map<\u002Fspan><\u002Fa><a href=\"#s-ii-10\"><span class=\"inpart-n\">II.10<\u002Fspan><span>Onboarding, Migration and Change<\u002Fspan><\u002Fa><a href=\"#s-ii-11\"><span class=\"inpart-n\">II.11<\u002Fspan><span>Non-Cooperative Customers and Third-Party Sales<\u002Fspan><\u002Fa><a href=\"#s-ii-12\"><span class=\"inpart-n\">II.12<\u002Fspan><span>Failure and Exception Paths<\u002Fspan><\u002Fa><a href=\"#s-ii-13\"><span class=\"inpart-n\">II.13<\u002Fspan><span>Product-Market Evolution<\u002Fspan><\u002Fa><a href=\"#s-ii-14\"><span class=\"inpart-n\">II.14<\u002Fspan><span>Volume II Reconstruction<\u002Fspan><\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fheader><div class=\"stats\"><div class=\"stat\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"stat-v mono\">40–45<\u002Fdiv><div class=\"stat-l\">bank merger migrations per year<\u002Fdiv><\u002Fdiv><\u002Fdiv><h2 id=\"s-volume-ii-product-customer-service-delivery-architecture\" class=\"hd hd2\"><span class=\"ht\">VOLUME II: Product, Customer &amp; Service-Delivery Architecture<\u002Fspan><\u002Fh2><h2 id=\"s-preface-and-method\" class=\"hd hd2\"><span class=\"ht\">Preface and Method<\u002Fspan><\u002Fh2><p><a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa> established Atruvia AG's corporate, legal, regulatory and institutional anatomy. <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-service-delivery-architecture\">Volume II<\u002Fa> reconstructs what Atruvia actually sells, to whom, why they buy (or are structurally obliged to buy), and precisely what happens operationally, contractually and economically when a member bank — and that bank's end customer — uses an Atruvia system.<\u002Fp><p>A structural framing note governs the whole volume. Atruvia holds no customer money and moves none as principal. It operates the systems through which the member banks move their customers' money. There is therefore no take rate and no safeguarding architecture to analyse; pricing is cost allocation (Umlage/Leistungsentgelte) to owner-members, now transitioning toward usage-based charging. This volume has been re-cut accordingly, replacing money-movement sections with the two-tier customer structure (<a class=\"xr\" href=\"#s-ii-2\">II.2<\u002Fa>), the service-delivery flow (<a class=\"xr\" href=\"#s-ii-5\">II.5<\u002Fa>) and the cost-allocation architecture (<a class=\"xr\" href=\"#s-ii-8\">II.8<\u002Fa>).<\u002Fp><p><strong>Evidence labels used throughout:<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> / <span class=\"ev\">COMPANY CLAIM<\u002Fspan> / <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan> / <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> / <span class=\"ev\">HYPOTHESIS<\u002Fspan> / <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fp><p><strong>A note on disclosure quality (read before the pricing sections):<\u002Fstrong> Atruvia is an unlisted, cooperative-owned AG with no investor relations, no analyst coverage and no product-level revenue reporting. Per-unit prices (cost per account, per workstation, per transaction) and per-bank Atruvia cost lines are <strong>not public<\u002Fstrong>. Where this volume reaches the limit of disclosure it says so and labels the specifics <span class=\"ev\">UNKNOWN<\u002Fspan> rather than manufacturing precision.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-0\" class=\"hd hd2\"><span class=\"hn mono\">II.0<\u002Fspan><span class=\"ht\">Reconciling the Scale Numbers (a prerequisite)<\u002Fspan><\u002Fh2><p>Before decomposing the portfolio, the headline scale figures — which differ across sources — must be reconciled, because several downstream conclusions depend on knowing what each number measures.<\u002Fp><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Metric<\u002Fsc-raw-th><sc-raw-th>Figure<\u002Fsc-raw-th><sc-raw-th>Source / date<\u002Fsc-raw-th><sc-raw-th>What it actually measures<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Accounts administered<\u002Fsc-raw-td><sc-raw-td>~91 million (2024); <strong>97 million (2025, GB2025)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Atruvia GB2024/GB2025; IBM 2025<\u002Fsc-raw-td><sc-raw-td>Bank customer accounts on agree21. A rising series (89m in 2023) — not a contradiction.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Customers (institutions)<\u002Fsc-raw-td><sc-raw-td>917 (2024); \"rund 900\"; \"&gt;1,000 Finanzinstitute\"<\u002Fsc-raw-td><sc-raw-td>Atruvia; private-banking-magazin<\u002Fsc-raw-td><sc-raw-td>Contract-holding institutions incl. ~700–730 cooperative banks plus subsidiaries' clients. The \"&gt;1,000\" counts all financial institutions served across the group.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cooperative banks served<\u002Fsc-raw-td><sc-raw-td>~670–730<\u002Fsc-raw-td><sc-raw-td>Atruvia HV2025 (\"rund 670\"); Handelsblatt (\"gut 700\"); GB2022 (\"rund 820\")<\u002Fsc-raw-td><sc-raw-td>Falling through mergers — see <a class=\"xr\" href=\"#s-ii-3\">II.3<\u002Fa>.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Banking workstations<\u002Fsc-raw-td><sc-raw-td>~153,000–169,000<\u002Fsc-raw-td><sc-raw-td>Wikipedia (169k); IBM Turbonomic (155k); Atruvia 2022 (164k)<\u002Fsc-raw-td><sc-raw-td>Managed Bankarbeitsplätze/seats; range reflects different years.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>ATMs / self-service terminals<\u002Fsc-raw-td><sc-raw-td>~30,000–34,000<\u002Fsc-raw-td><sc-raw-td>IBM (30k+); Wikipedia (34k); Atruvia 2022 (32k)<\u002Fsc-raw-td><sc-raw-td>Self-service estate operated for banks.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Data centres<\u002Fsc-raw-td><sc-raw-td>four high-security<\u002Fsc-raw-td><sc-raw-td>Atruvia; IBM<\u002Fsc-raw-td><sc-raw-td>Karlsruhe + Münster core; IBM case study says \"four data centers.\" (Grokipedia's \"six\" is uncorroborated — treat as erroneous/<span class=\"ev\">UNKNOWN<\u002Fspan>.)<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>The two transaction numbers — the key reconciliation (Priority Gap 3):<\u002Fstrong><\u002Fp><ul class=\"lst\"><li><strong>9.32 billion transactions (2024); ~10 billion (2025, GB2025)<\u002Fstrong> — <span class=\"ev\">CONFIRMED FACT<\u002Fspan>, Atruvia's own \"Buchungen/Transaktionen\" KPI (8.7bn in 2023). This is the <strong>business-event count<\u002Fstrong>: bookings/postings, i.e. customer-visible transactions (transfers, direct debits, card postings).<\u002Fli><li><strong>~80 billion core banking transactions/year<\u002Fstrong> — <span class=\"ev\">CONFIRMED FACT<\u002Fspan>, IBM case study, \"with peaks of 12,000 transactions per second,\" managed by IBM IMS on Db2 for z/OS. IBM's other pages cite \"nearly 100 billion,\" \"87 billion,\" and \"120 billion mainframe transactions\" in different years.<\u002Fli><\u002Ful><p><strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> (high confidence):<\u002Fstrong> These measure different layers. The ~9–10bn is the <em>business/booking<\u002Fem> layer (what a banker calls a transaction). The 80–120bn is the <em>technical IMS transaction<\u002Fem> layer — each business event decomposes into many machine transactions (authorisation, balance check, posting, mirror-posting, journaling, channel calls). A ratio of roughly 8–13 technical transactions per booking is consistent with a classic IMS/COBOL core wrapped in ~1,200 Java microservices via a proprietary API layer (IBM). The rising IBM figure across years (80→87→100→120bn) reflects the digital-channel explosion: IBM notes \"a 12-fold increase in HTTPS requests per user interaction for new online banking apps.\"<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-1\" class=\"hd hd2\"><span class=\"hn mono\">II.1<\u002Fspan><span class=\"ht\">Product and Service Universe<\u002Fspan><\u002Fh2><p>Atruvia's portfolio is a stack: a mainframe core (agree21) at the bottom; a workstation/omnichannel middle layer; end-customer channels on top; steering/analytics/AI alongside; and a ring of subsidiaries selling adjacent products into the same base. The <strong>Follow-the-Legal-Entity rule<\u002Fstrong> is applied: each product is mapped to its delivering entity.<\u002Fp><h3 id=\"s-the-core-and-platform-layer-atruvia-ag\" class=\"hd hd3\"><span class=\"ht\">The core and platform layer (Atruvia AG)<\u002Fspan><\u002Fh3><p><strong>agree21 — the Kernbankverfahren (core banking process).<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. The integrated Gesamtbanklösung: account management, payments, lending, securities, plus the steering and channel modules that attach to it. It runs on IBM Z (IMS transaction manager, Db2 database) across four data centres. Named module families: <strong>agree21Finanzen<\u002Fstrong> (steering platform — Accounting, Meldewesen, Controlling on a single data basis), <strong>agree21BAP<\u002Fstrong> (legacy Bankarbeitsplatz), <strong>agree21ECON<\u002Fstrong> (digital end-to-end process modelling for non-standard products), <strong>agree21SecureDocs<\u002Fstrong> (secure data rooms, built on partner DRACOON, superseding agree21Doksharing), <strong>agree21SmartData<\u002Fstrong> (affinity/propensity models), <strong>agree21M365<\u002Fstrong> (managed Microsoft 365). Classification: <strong>core-mandatory<\u002Fstrong>. Historical discipline: agree21 superseded both predecessor cores — \"agree\" (ex-Fiducia, south) and \"bank21\" (ex-GAD, north); bank21 is <strong>retired<\u002Fstrong>, agree v1 is <strong>superseded<\u002Fstrong>. Consolidation migration finished 2019–2020 (<a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa>).<\u002Fp><p><strong>BankingWorkspace (BWS) / Bankarbeitsplatz.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. The new browser-based, role-adaptive employee workspace replacing the closed, inflexible agree21BAP. Vorstandssprecher Ulrich Coenen (Profil, 01/2024): \"Der bisherige Bankarbeitsplatz war ein in sich geschlossenes, wenig flexibles System. Der BankingWorkspace hingegen wird … zu einer hochflexiblen, browserbasierten Anwenderoberfläche weiterentwickelt.\" Coenen confirms a <strong>coexistence phase<\u002Fstrong>: \"Die Koexistenzphase von BankingWorkspace und Bankarbeitsplatz wird noch etwas andauern … der aktuelle Zustand ist etwas zäh,\" with some applications (e.g. CRM) currently maintained twice. Piloting began after successful technical tests in Q4 2022. Classification: <strong>core-mandatory (in transition)<\u002Fstrong>.<\u002Fp><p><strong>Omnikanalplattform.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. The multi-tenant (mandantenfähig) platform onto which bank processes are being ported from the core; Atruvia calls it \"einer der modernsten und mandantenfähigen Banking-Plattformen in Europa.\" The BWS is merely \"der Zugangsweg der Bankmitarbeitenden zu diesen Prozessen\" — the platform is the substance, the workspace the door. ~300 processes from the process map are already available. Vorstand Daniela Bücker's confirmed position (<a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa>): the platform/EGP was never limited to agree21, suits integration into arbitrary banking systems, is not restricted to cooperative banks, and porting bank processes from core to platform \"will take several more years.\" Classification: <strong>strategic core<\u002Fstrong>.<\u002Fp><h3 id=\"s-end-customer-channels-atruvia-ag\" class=\"hd hd3\"><span class=\"ht\">End-customer channels (Atruvia AG)<\u002Fspan><\u002Fh3><p><strong>OnlineBanking and VR-NetKey.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. The new OnlineBanking replaced the legacy Fiducia/GAD online environments; private customers migrated through H1 2022. VR-NetKey is the access credential. Classification: <strong>core-mandatory<\u002Fstrong>.<\u002Fp><p><strong>VR Banking App.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. The mobile flagship, rebuilt from the ground up, launched \"leise\" (without a marketing campaign) alongside VR SecureGo plus, developed agile as an MVP and iterated with the banks. It bundles account management, digital cards, Wero, photo-transfer, multibanking, securities/Union-Depot views, and an AI voice assistant. Classification: <strong>core-mandatory + strategic<\u002Fstrong> (the primary digital customer interface). Adoption/competitive data in <a class=\"xr\" href=\"#s-ii-4\">II.4<\u002Fa>/<a class=\"xr\" href=\"#s-ii-7\">II.7<\u002Fa>.<\u002Fp><p><strong>VR SecureGo plus.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. The authentication/authorisation app (push approval, biometrics, up to three devices), separate from the banking app — required to release OnlineBanking, VR Banking App and card transactions, and to activate Wero. Classification: <strong>core-mandatory<\u002Fstrong> (security substrate).<\u002Fp><p><strong>Wero and the digital card.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Wero (the EPI wallet) is integrated into the VR Banking App; transactions execute in real time directly from the Girokonto (account-to-account, no IBAN), with online-payment capability added and card-funding planned. Digital debit/credit cards live in the app for contactless payment. Johannes Stoll leads the \"Daily Banking\" business field (<a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa>). Classification: <strong>defensive + strategic optionality<\u002Fstrong> (a collective answer to PayPal/Apple Pay and to neobank P2P).<\u002Fp><h3 id=\"s-corporate-business-client-software-atruvia-ag-current-vs-legacy-priority\" class=\"hd hd3\"><span class=\"ht\">Corporate/business-client software (Atruvia AG) — current vs legacy (Priority verify)<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Three products, tiered by client size, all maintained by Atruvia and licensed through the customer's own bank:<\u002Fp><ol class=\"lst\"><li><strong>VR-NetWorld Software<\u002Fstrong> — freelancers, small businesses, associations (current; v8.x, but version 8 \"erhält seit 2024 keine Funktions-Updates mehr\").<\u002Fli><li><strong>Profi cash<\u002Fstrong> — the SME payments workhorse (current; v13 / v12.99 series 2025–2026; migrates VR-NetWorld data).<\u002Fli><li><strong>GENO cash<\u002Fstrong> — medium/large corporates (current; v4.00.008 SP14 in 2025; already supports instant single orders).<\u002Fli><\u002Fol><p>These are Windows desktop/server FinTS/EBICS clients. Economically <strong>optional add-ons<\u002Fstrong> (bank buys licences, resells to corporate customers) but strategically important as SME/Firmenkunden anchors. The <strong>Serviceline<\u002Fstrong> (<a class=\"xr\" href=\"#s-ii-5\">II.5<\u002Fa>.E) supports GENO cash, Profi cash, VR-NetWorld Software and BankingManager.<\u002Fp><p><strong>FinTS/PSD2 interfaces.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Atruvia operates the FinTS/HBCI servers (fints1.atruvia.de, fints2.atruvia.de, port 3000) through which both its own corporate software and third-party aggregators (windata, konfipay, ALF-BanCo, GLS eBank, subsembly) access accounts — the PSD2 access layer. Classification: <strong>core-mandatory infrastructure<\u002Fstrong> (regulatorily obligatory).<\u002Fp><h3 id=\"s-payments-and-cards\" class=\"hd hd3\"><span class=\"ht\">Payments and cards<\u002Fspan><\u002Fh3><p><strong>Payment processing (SEPA, SCT Inst, girocard).<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> with a key legal-entity boundary. Atruvia builds and operates the systems in the banks' core through which payments are initiated and posted, but <strong>DZ Bank is the clearing house<\u002Fstrong> (\"Clearingstelle für die Abwicklung aller Zahlungen von Volks- und Raiffeisenbanken, die nicht innerhalb einer Bank stattfinden,\" Handelsblatt). DZ Bank built a new payments platform — jointly owned with Fiducia GAD/Atruvia per Handelsblatt — to carry instant, classic SEPA and cross-border payments. See <a class=\"xr\" href=\"#s-ii-6\">II.6<\u002Fa>.<\u002Fp><p><strong>Card issuing and processing.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> and in transition. Today debit (girocard/Debit) issuing processing sits partly with Atruvia; credit-card processing sits with <strong>VR Payment<\u002Fstrong> (a DZ Bank subsidiary). From <strong>1 January 2027<\u002Fstrong>, under the reorganisation agreed 2 July 2026 (Bundeskartellamt case <strong>B9-75/26, notified 15 July 2026<\u002Fstrong>, product markets \"Finanzdienstleistungen, Zahlungsabwicklungsdienste\"), Atruvia takes over the <strong>Issuing Processing<\u002Fstrong> division from VR Payment and adds <strong>credit-card processing<\u002Fstrong>, building \"eine integrierte, zukunftsfähige Kartenplattform mit einheitlicher Abwicklung von Girokarten, Debitkarten und Kreditkarten auf einer Plattform\" (Atruvia PR, 2 July 2026). VR Payment refocuses on Acquiring, POS-Netzbetrieb and merchant/omnichannel payment. <strong>Dr. Christian Marzlin, co-lead partner at legal adviser McDermott Will &amp; Schulte:<\u002Fstrong> \"A significant portion of all credit card transactions in Germany is processed through Atruvia's systems. The restructuring of the card business between Atruvia and DZ BANK is therefore of great importance to the German financial and banking sectors.\" Finanz-Szene (15 May 2026) frames this as VR Payment being \"zerschlagen\" and Atruvia becoming the \"Karten-Powerhouse\" (internal project name \"Dragon\"). Classification: <strong>strategic<\u002Fstrong> — see <a class=\"xr\" href=\"#s-ii-9\">II.9<\u002Fa>.<\u002Fp><h3 id=\"s-steering-analytics-and-ai\" class=\"hd hd3\"><span class=\"ht\">Steering, analytics and AI<\u002Fspan><\u002Fh3><p><strong>EGP Gesamtbanksteuerung / agree21Finanzen.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. The whole-bank steering platform (accounting, regulatory reporting, controlling on one data basis). Bücker: EGP integration is not restricted to agree21 or to cooperative banks. Classification: <strong>core-mandatory<\u002Fstrong> inside GFG; <strong>externally sellable<\u002Fstrong>.<\u002Fp><p><strong>parcIT: VR-Control and okular.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Delivered by subsidiary <strong>parcIT GmbH<\u002Fstrong> (403 employees / €68.9m revenue in the 2022 GB; 478 / €69.8m in the 2023 GB — a growing unit). VR-Control/okular is the risk and steering software family covering customer business, address/market/liquidity risk, whole-bank steering and capital planning, operational risk, plus modules for risk-bearing-capacity (Risikotragfähigkeit), cost management, IFRS accounting and regulatory reporting. \"okular-Tools\" are bridging/supplementary solutions (RWA optimisation, LSI stress-test templates, IRIS/BETRIS real-estate and participation-risk calculators). LSI stress-test tools are <strong>free for GFG institutions<\u002Fstrong>; external banks pay via a Basis-Abo. Classification: <strong>core-mandatory (steering)<\u002Fstrong> inside GFG; <strong>competitive/externally-sold<\u002Fstrong> outside.<\u002Fp><p><strong>genoGPT and the AI portfolio.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. AI has been used at Atruvia since 2017 (fraud detection). A dedicated unit of &gt;70 staff builds process automation (document recognition, photo-transfer), natural-language systems and generative-AI bots. Products: <strong>plainGPT<\u002Fstrong> (a regulatorily safe ChatGPT-based text/image/research tool for bank staff — \"eine der steilsten Adoptionskurven\"), and its successor <strong>genoGPT<\u002Fstrong> (a \"KI-basierte Wissens-, Agenten- und Informationsplattform\" that ingests bank-internal documents; runs in a private cloud with no open-internet connection). A customer-facing website chatbot is also offered. A GFG-wide <strong>KI-Kompetenzcenter<\u002Fstrong> was established, with a KI-Strategie permitting decentralised use under central governance aligned to the EU AI Act. Classification: <strong>strategic optionality<\u002Fstrong> (small today, high potential).<\u002Fp><p><strong>TRUUCO.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan>. TRUUCO GmbH (started April 2023) owns the Smart-Data models and the Impulsmanager (incl. Next Best Action), developing data-driven sales with the banks and GFG partners. Classification: <strong>strategic (analytics)<\u002Fstrong>.<\u002Fp><h3 id=\"s-self-service-atm-estate\" class=\"hd hd3\"><span class=\"ht\">Self-service / ATM estate<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan>. Atruvia operates ~30,000–34,000 ATMs and self-service terminals ensuring cash supply. During the 9 Nov 2020 outage and the DDoS attacks, terminals were noted as sometimes the only functioning channel (\"Versorgung mit Bargeld weiterhin möglich\"). Hardware/rollout is tied to subsidiary <strong>Ratiodata<\u002Fstrong>. Classification: <strong>core-mandatory (physical channel)<\u002Fstrong>.<\u002Fp><h3 id=\"s-the-subsidiary-ring-follow-the-legal-entity\" class=\"hd hd3\"><span class=\"ht\">The subsidiary ring (Follow-the-Legal-Entity)<\u002Fspan><\u002Fh3><div class=\"tw wide\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Entity<\u002Fsc-raw-th><sc-raw-th>Product / service<\u002Fsc-raw-th><sc-raw-th>Target<\u002Fsc-raw-th><sc-raw-th>Job-to-be-done<\u002Fsc-raw-th><sc-raw-th>Classification<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Ratiodata SE<\u002Fstrong> (€344.5m, Vol I)<\u002Fsc-raw-td><sc-raw-td>Systems house: hardware, managed services, print/output, archiving, self-service device services; nearshore via Accesa/RaRo<\u002Fsc-raw-td><sc-raw-td>Banks + regulated industries<\u002Fsc-raw-td><sc-raw-td>Physical IT + operations<\u002Fsc-raw-td><sc-raw-td>Competitive/externally-sold<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>parcIT<\u002Fstrong> (€78.6m)<\u002Fsc-raw-td><sc-raw-td>VR-Control/okular risk &amp; steering software<\u002Fsc-raw-td><sc-raw-td>Banks (GFG + external)<\u002Fsc-raw-td><sc-raw-td>Regulatory/risk steering<\u002Fsc-raw-td><sc-raw-td>Core-mandatory (GFG)/competitive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Peras<\u002Fstrong> (€46.7m)<\u002Fsc-raw-td><sc-raw-td>geno.HR — payroll, HR management, time, digital personnel file<\u002Fsc-raw-td><sc-raw-td>Banks<\u002Fsc-raw-td><sc-raw-td>HR BPO/software<\u002Fsc-raw-td><sc-raw-td>Optional add-on<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>BMS Corporate Solutions<\u002Fstrong> (€52.0m)<\u002Fsc-raw-td><sc-raw-td>Corporate-finance solutions incl. <strong>fincompare<\u002Fstrong> (SME financing marketplace)<\u002Fsc-raw-td><sc-raw-td>Banks + SME<\u002Fsc-raw-td><sc-raw-td>Firmenkunden financing<\u002Fsc-raw-td><sc-raw-td>Strategic optionality<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Serviscope<\u002Fstrong> (€28.8m)<\u002Fsc-raw-td><sc-raw-td>BPO; the 116 116 card-blocking hotline; customer-service centre services<\u002Fsc-raw-td><sc-raw-td>Banks<\u002Fsc-raw-td><sc-raw-td>Operational outsourcing<\u002Fsc-raw-td><sc-raw-td>Optional add-on / defensive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>GWS<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>ERP (industry/trade)<\u002Fsc-raw-td><sc-raw-td>Non-bank cooperatives &amp; SMEs<\u002Fsc-raw-td><sc-raw-td>ERP<\u002Fsc-raw-td><sc-raw-td>Competitive/externally-sold<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>ECON Application<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>No-code process platform<\u002Fsc-raw-td><sc-raw-td>Banks<\u002Fsc-raw-td><sc-raw-td>Digital process building<\u002Fsc-raw-td><sc-raw-td>Optional add-on<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>FORUM Ges. f. Informationssicherheit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>ForumSuite — InfoSec/GRC<\u002Fsc-raw-td><sc-raw-td>Banks + regulated<\u002Fsc-raw-td><sc-raw-td>InfoSec/compliance<\u002Fsc-raw-td><sc-raw-td>Optional add-on<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>TRUUCO<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Smart-Data / Impulsmanager<\u002Fsc-raw-td><sc-raw-td>Banks<\u002Fsc-raw-td><sc-raw-td>Data-driven sales<\u002Fsc-raw-td><sc-raw-td>Strategic<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Accesa / RaRo<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Nearshore dev, cloud, IT ops/support (Romania)<\u002Fsc-raw-td><sc-raw-td>Internal + banks<\u002Fsc-raw-td><sc-raw-td>Cost-arbitrage delivery<\u002Fsc-raw-td><sc-raw-td>Enabling<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Lucke EDV<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Specialist IT<\u002Fsc-raw-td><sc-raw-td>Banks<\u002Fsc-raw-td><sc-raw-td>Niche IT<\u002Fsc-raw-td><sc-raw-td>Optional<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><p><strong>Serviscope and 116 116 (Priority verify).<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (mechanism). 116 116 is the national card-blocking Sperr-Notruf assigned by the Bundesnetzagentur, operated for the market by the Sperr-Notruf e.V.; cardholders call it to block girocard/credit cards, SIMs, e-ID, online-banking access etc. Serviscope provides BPO including card-blocking/service-centre operations for the cooperative banks; the end-customer nonetheless \"nimmt direkt mit dem kartenausgebenden Institut Kontakt auf\" for follow-up. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>: Serviscope is the sector's operational hand behind the standardised 116 116 experience for VR-bank cardholders, but the legal card-issuer relationship stays with the bank.<\u002Fp><p><strong>Verimi (digital-identity JV).<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan> (<a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa>): DZ Bank's ~20% stake is in Verimi, not Atruvia — the frequently-repeated \"DZ Bank owns ~20% of Atruvia\" claim is erroneous and traces to Verimi. Verimi is a cross-sector German digital-identity platform; the sector's participation is <strong>strategic optionality/defensive<\u002Fstrong>. Product-level Verimi economics are <span class=\"ev\">UNKNOWN<\u002Fspan>.<\u002Fp><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-2\" class=\"hd hd2\"><span class=\"hn mono\">II.2<\u002Fspan><span class=\"ht\">The Two-Tier Customer Structure (given unusual weight)<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-8\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 08<\u002Fspan><span class=\"fig-t\">The Two-Tier Customer Structure<\u002Fspan><\u002Fdiv><div class=\"fig-b\"><div style=\"display:grid;grid-template-columns:minmax(0,1fr) 41px minmax(0,1fr);gap:0;align-items:stretch\"><div class=\"bp\" style=\"padding:16.4px 17.8px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"f-lbl\" style=\"color:var(--acc)\">Tier 1 — Member banks<\u002Fdiv><div class=\"f-name\" style=\"font-size:20.5px;margin-top:6.8px\">~670–730 cooperative banks<\u002Fdiv><div class=\"f-meta\">plus private banks and non-banks — ~917–950 customers in total<\u002Fdiv><div style=\"display:flex;gap:8.2px;margin-top:15px\"><span style=\"flex:1;text-align:center;border:1.4px solid var(--acc);background:var(--acc-fill);color:var(--steel);font-family:var(--font-heading);font-size:15px;letter-spacing:.14em;padding:6.8px 0\">OWNER<\u002Fspan><span style=\"flex:1;text-align:center;border:1.4px solid var(--acc);background:var(--acc-fill);color:var(--steel);font-family:var(--font-heading);font-size:15px;letter-spacing:.14em;padding:6.8px 0\">BUYER<\u002Fspan><span style=\"flex:1;text-align:center;border:1.4px solid var(--acc);background:var(--acc-fill);color:var(--steel);font-family:var(--font-heading);font-size:15px;letter-spacing:.14em;padding:6.8px 0\">GOVERNOR<\u002Fspan><\u002Fdiv><div style=\"font-size:14.4px;color:var(--muted);margin-top:10.9px;line-height:1.35\">All three hats are worn at once. The buyer of the service also votes the roadmap and elects the Aufsichtsrat that supervises the seller.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 30 40\" width=\"41\" height=\"40\" aria-hidden=\"true\"><line x1=\"0\" y1=\"16\" x2=\"30\" y2=\"16\" stroke=\"var(--wire)\" style=\"stroke:var(--wire)\"><\u002Fline><path d=\"M23 11 L30 16 L23 21\" fill=\"none\" stroke=\"var(--wire)\" style=\"stroke:var(--wire)\"><\u002Fpath><path d=\"M7 24 L0 29 L7 34\" fill=\"none\" stroke=\"var(--wire)\" style=\"stroke:var(--wire)\"><\u002Fpath><line x1=\"0\" y1=\"29\" x2=\"30\" y2=\"29\" stroke=\"var(--wire)\" style=\"stroke:var(--wire)\"><\u002Fline><\u002Fsvg><\u002Fdiv><div class=\"bp\" style=\"padding:16.4px 17.8px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"f-lbl\">Tier 2 — End customers<\u002Fdiv><div class=\"f-name\" style=\"font-size:20.5px;margin-top:6.8px\">Tens of millions of German retail and corporate users<\u002Fdiv><div class=\"f-meta\">~97m accounts administered<\u002Fdiv><div style=\"margin-top:15px;border:1.4px dashed var(--wire);padding:9.6px 12.3px;font-size:15px;color:var(--muted);line-height:1.35\">They hold no contract with Atruvia, and in the ordinary case <b>do not know Atruvia exists<\u002Fb> — yet they judge the software daily.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16.4px;margin-top:16.4px;border-top:1.4px solid var(--ink);padding-top:15px\"><div><div class=\"f-lbl\">Contractual line<\u002Fdiv><div style=\"font-size:15.7px;line-height:1.35;margin-top:4.1px\">End customer → member bank → Atruvia. There is no contract between Atruvia and the end customer.<\u002Fdiv><\u002Fdiv><div><div class=\"f-lbl\">GDPR relationship<\u002Fdiv><div style=\"font-size:15.7px;line-height:1.35;margin-top:4.1px\"><b>Bank = controller<\u002Fb> (Verantwortlicher) · <b>Atruvia = processor<\u002Fb> (Auftragsverarbeiter) under Art. 28.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption class=\"fig-c\"><b>Funded by banks, judged by consumers.<\u002Fb> The paying customer and the experiencing customer are different people, and only one of them can vote.<\u002Ffigcaption><\u002Ffigure><p>This is the analytical heart of <a class=\"xr\" href=\"#part-ii-part-ii-product-customer-service-delivery-architecture\">Volume II<\u002Fa>. Atruvia serves two populations different in kind:<\u002Fp><p><strong>Tier 1 — the member banks (~670–730 cooperative banks plus ~190 private banks and specials).<\u002Fstrong> They are simultaneously (a) <strong>owners<\u002Fstrong> (99.68% cooperative-held, 91.63% via the three regional Beteiligungs-KGs), (b) <strong>buyers<\u002Fstrong> (they pay the Umlage/Leistungsentgelte), and (c) <strong>governors<\u002Fstrong> (they populate the Aufsichtsrat and the BVR committees that steer the roadmap). This triple identity is the single most important fact about Atruvia's customer structure.<\u002Fp><p><strong>Tier 2 — the banks' end customers (tens of millions of German retail and corporate users).<\u002Fstrong> They use Atruvia-built interfaces daily, overwhelmingly <strong>without knowing Atruvia exists<\u002Fstrong>. Their contractual and data relationship is with their local bank, not with Atruvia.<\u002Fp><h3 id=\"s-who-atruvia-designs-for-when-the-two-conflict\" class=\"hd hd3\"><span class=\"ht\">Who Atruvia designs for when the two conflict<\u002Fspan><\u002Fh3><p><strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> (high confidence):<\u002Fstrong> Atruvia routes requirements almost entirely through Tier 1. The roadmap is set with the banks and the BVR (below), not with end users; end-user needs enter only as mediated by the banks and Atruvia's own UX research. The tell is Kaurin's own framing (<a class=\"xr\" href=\"#s-ii-4\">II.4<\u002Fa>/<a class=\"xr\" href=\"#s-ii-7\">II.7<\u002Fa>): the competitive battle has shifted \"von Features zu persönlicher Relevanz\" — an admission that feature parity was built <em>for the banks' checklist<\u002Fem> and that the harder problem (individual end-user relevance) is the current frontier. The structural bias is toward the owner-buyer-governor, not the invisible end user.<\u002Fp><h3 id=\"s-who-sets-requirements-and-through-which-governance-route-priority-gap-6-\" class=\"hd hd3\"><span class=\"ht\">Who sets requirements and through which governance route (Priority Gap 6 — bodies by name)<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> — the named mechanism:<\u002Fp><ul class=\"lst\"><li><strong>BVR-Gremien<\u002Fstrong> (Bundesverband der Deutschen Volksbanken und Raiffeisenbanken committees): where Atruvia \"stellte … die Kernelemente und Stoßrichtungen der Roadmap … vor.\" The apex strategic route.<\u002Fli><li><strong>Bundeseinheitliches Strategieportfolio (BSP)<\u002Fstrong> — the sector-wide strategy portfolio: \"Aktuell enthält das BSP 39 Initiativen – davon 36 mit Bezug zu Atruvia.\" The concrete prioritisation instrument: 36 of 39 route through Atruvia.<\u002Fli><li><strong>Strategie- und Portfolioplattform (SPP)<\u002Fstrong> — the \"Bankencommunity\" where Atruvia's agile delivery portfolio/roadmap is made transparent to banks.<\u002Fli><li><strong>Kompetenzteams / Kompetenzteambanken<\u002Fstrong> — named working groups. Atruvia's Birgit Schlächter (Kernbank expert): the Kompetenzteambanken \"lieferten wichtige Impulse und unterstützen die gemeinsamen Zielsetzungen zudem aktiv auch als Mitstreiter in den relevanten Gremien\"; bank staff \"werden … frühzeitig eingebunden und haben die Möglichkeiten zur Mitgestaltung.\"<\u002Fli><li><strong>Fokusgruppen<\u002Fstrong> (e.g. \"Fokusgruppe Business Services\" with eleven banks) — product-specific co-creation groups.<\u002Fli><li><strong>agree21Communitys<\u002Fstrong> — theme-based online communities channelling operational feedback; one is titled \"Kundenformate und Gremien transparent.\"<\u002Fli><li><strong>BVR-Prozesslandkarte<\u002Fstrong> — the process map that is the formal frame (\"Ordnungsrahmen dafür ist die BVR-Prozesslandkarte\").<\u002Fli><li><strong>Strategie Hub Regional / Atruvia Solution Days<\u002Fstrong> — annual regional events (from Sept/Oct 2023) bundling BVR, DZ Bank Gruppe, Atruvia and regional/spartan Verbände.<\u002Fli><\u002Ful><p><strong>How a member bank actually influences the roadmap (mechanism):<\u002Fstrong> (1) collectively via BVR committees that agree the BSP; (2) as a Kompetenzteam/Fokusgruppe co-developer if selected; (3) via SPP/agree21Communitys feedback; (4) through the co-determined Aufsichtsrat (chair Daniel Keller — <a class=\"xr\" href=\"#part-i-part-i-corporate-legal-regulatory-institutional-anatomy\">Volume I<\u002Fa>) which approves major investment/pricing steps; (5) at the Hauptversammlung. <strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan>:<\u002Fstrong> individual small banks have negligible direct influence; influence is exercised collectively (BVR) or by invitation (Kompetenzteams). This is majoritarian/consensus governance, not a customer-choice market.<\u002Fp><h3 id=\"s-who-owns-the-end-customer-relationship-and-data\" class=\"hd hd3\"><span class=\"ht\">Who owns the end-customer relationship and data<\u002Fspan><\u002Fh3><p><span class=\"ev\">CONFIRMED FACT<\u002Fspan> (mechanism). The end customer's contract is with the local bank. Under GDPR the <strong>bank is the controller (Verantwortlicher)<\u002Fstrong> and <strong>Atruvia is the processor (Auftragsverarbeiter)<\u002Fstrong> under an Auftragsverarbeitungsvertrag (<a class=\"xr\" href=\"#s-ii-5\">II.5<\u002Fa>.B). The Serviceline is \"reachable only via the customer's own bank's phone number,\" deliberately keeping Atruvia invisible and the bank as the face. The end-customer <em>data<\u002Fem> is the bank's; Atruvia processes it on instruction. The \"customer-is-also-owner\" distortion therefore operates entirely at Tier 1.<\u002Fp><h3 id=\"s-how-the-customer-is-also-owner-identity-distorts-prioritisation\" class=\"hd hd3\"><span class=\"ht\">How the customer-is-also-owner identity distorts prioritisation<\u002Fspan><\u002Fh3><p><strong><span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> (high confidence, evidence-backed):<\u002Fstrong><\u002Fp><ol class=\"lst\"><li><strong>Consensus over speed.<\u002Fstrong> Because ~700 owner-buyers must be broadly satisfied, standardisation is negotiated (\"Standardisierung … keinesfalls als 'kleinsten gemeinsamen Nenner',\" Schlächter — a defensive phrasing that concedes the risk exists). Coenen concedes the transition is \"etwas zäh.\"<\u002Fli><li><strong>Underpricing pressure vs investment need.<\u002Fstrong> Owners resist price rises on themselves (<a class=\"xr\" href=\"#s-ii-8\">II.8<\u002Fa>) yet demand competitive digital features; the result is chronic under-investment relative to neobanks (Platow: competitors \"geben oft ein Vielfaches\").<\u002Fli><li><strong>Uniformity over differentiation.<\u002Fstrong> A single multi-tenant platform serves all; individual banks get limited white-labelling (<a class=\"xr\" href=\"#s-ii-7\">II.7<\u002Fa>), which suits small banks but frustrates large ones.<\u002Fli><li><strong>The owner's P&amp;L is the customer's cost.<\u002Fstrong> Every euro Atruvia earns is a cost line for its owners, so there is structural pressure to keep margin thin (2022: €8m surplus on €1.4bn) — which starves reinvestment, the exact tension resolved by the 2025 shift to a 4%-of-revenue Zielrendite (<a class=\"xr\" href=\"#s-ii-8\">II.8<\u002Fa>).<\u002Fli><\u002Fol><div class=\"sep\"><\u002Fdiv><h2 id=\"s-ii-3\" class=\"hd hd2\"><span class=\"hn mono\">II.3<\u002Fspan><span class=\"ht\">Customer Segmentation<\u002Fspan><\u002Fh2><figure class=\"fig\" id=\"figure-10\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"fig-h\"><span class=\"fig-n mono\">Figure 10<\u002Fspan><span class=\"fig-t\">Consolidation: Fewer Banks, More Accounts<\u002Fspan><\u002Fdiv><div class=\"fig-b\">\n  <svg sc-camel-view-box=\"0 0 900 330\" class=\"svg\" style=\"width:100%;height:330px\">\n    <g stroke=\"var(--wire)\" stroke-width=\"1\">\n      <line x1=\"86\" y1=\"40\" x2=\"820\" y2=\"40\" stroke-dasharray=\"2 3\"><\u002Fline>\n      <line x1=\"86\" y1=\"110\" x2=\"820\" y2=\"110\" stroke-dasharray=\"2 3\"><\u002Fline>\n      <line x1=\"86\" y1=\"180\" x2=\"820\" y2=\"180\" stroke-dasharray=\"2 3\"><\u002Fline>\n      <line x1=\"86\" y1=\"250\" x2=\"820\" y2=\"250\"><\u002Fline>\n    <\u002Fg>\n    <g font-size=\"12.5\" fill=\"var(--muted)\" class=\"mono\">\n      <text x=\"78\" y=\"44\" text-anchor=\"end\">900<\u002Ftext><text x=\"78\" y=\"114\" text-anchor=\"end\">600<\u002Ftext><text x=\"78\" y=\"184\" text-anchor=\"end\">300<\u002Ftext><text x=\"78\" y=\"254\" text-anchor=\"end\">0<\u002Ftext>\n      <text x=\"828\" y=\"44\">100m<\u002Ftext><text x=\"828\" y=\"114\">90m<\u002Ftext><text x=\"828\" y=\"184\">80m<\u002Ftext><text x=\"828\" y=\"254\">70m<\u002Ftext>\n    <\u002Fg>\n    <g fill=\"var(--wire2)\">\n      <rect x=\"120\" y=\"59\" width=\"86\" height=\"191\"><\u002Frect>\n      <rect x=\"300\" y=\"87\" width=\"86\" height=\"163\"><\u002Frect>\n      <rect x=\"480\" y=\"87\" width=\"86\" height=\"163\"><\u002Frect>\n      <rect x=\"660\" y=\"94\" width=\"86\" height=\"156\"><\u002Frect>\n    <\u002Fg>\n    <g font-size=\"15\" fill=\"var(--ink)\" class=\"mono\" text-anchor=\"middle\">\n      <text x=\"163\" y=\"52\">~820<\u002Ftext><text x=\"343\" y=\"80\">~700<\u002Ftext><text x=\"523\" y=\"80\">~700<\u002Ftext><text x=\"703\" y=\"87\">~670<\u002Ftext>\n    <\u002Fg>\n    <polyline points=\"163,215 343,187 523,173 703,131\" fill=\"none\" stroke=\"var(--acc)\" stroke-width=\"1.5\"><\u002Fpolyline>\n    <g fill=\"var(--paper)\" stroke=\"var(--acc)\" stroke-width=\"1.5\">\n      <circle cx=\"163\" cy=\"215\" r=\"4\"><\u002Fcircle><circle cx=\"343\" cy=\"187\" r=\"4\"><\u002Fcircle><circle cx=\"523\" cy=\"173\" r=\"4\"><\u002Fcircle><circle cx=\"703\" cy=\"131\" r=\"4\"><\u002Fcircle>\n    <\u002Fg>\n    <g font-size=\"14\" fill=\"var(--acc)\" class=\"mono\" text-anchor=\"middle\">\n      <text x=\"163\" y=\"234\">85m<\u002Ftext><text x=\"343\" y=\"206\">89m<\u002Ftext><text x=\"523\" y=\"192\">91m<\u002Ftext><text x=\"703\" y=\"150\">97m<\u002Ftext>\n    <\u002Fg>\n    <g font-size=\"14\" fill=\"var(--muted)\" class=\"mono\" text-anchor=\"middle\" letter-spacing=\"0.08em\">\n      <text x=\"163\" y=\"272\">2022<\u002Ftext><text x=\"343\" y=\"272\">2023<\u002Ftext><text x=\"523\" y=\"272\">2024<\u002Ftext><text x=\"703\" y=\"272\">2025<\u002Ftext>\n    <\u002Fg>\n    <g font-size=\"12.5\" fill=\"var(--muted)\" letter-spacing=\"0.08em\">\n      <text x=\"86\" y=\"300\">BARS — COOPERATIVE BANKS (LEFT AXIS) · LINE — ACCOUNTS ADMINISTERED (RIGHT AXIS)<\u002Ftext>\n      <text x=\"86\" y=\"316\" fill=\"var(--acc)\">40–45 MERGER MIGRATIONS PER YEAR<\u002Ftext>\n    <\u002Fg>\n  <\u002Fsvg>\n<\u002Fdiv><figcaption class=\"fig-c\"><b>The owner base shrinks while the workload grows.<\u002Fb> Fewer, larger owners buy the same platform — with more bargaining power each year.<\u002Ffigcaption><\u002Ffigure><h3 id=\"s-by-institution-type\" class=\"hd hd3\"><span class=\"ht\">By institution type<\u002Fspan><\u002Fh3><div class=\"tw\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Segment<\u002Fsc-raw-th><sc-raw-th>Examples<\u002Fsc-raw-th><sc-raw-th>Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Volksbanken / Raiffeisenbanken<\u002Fsc-raw-td><sc-raw-td>~670–730 institutions<\u002Fsc-raw-td><sc-raw-td>The captive core; all use agree21.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sparda-Banken<\u002Fsc-raw-td><sc-raw-td>11 institutions<\u002Fsc-raw-td><sc-raw-td>All 11 now on/moving to Atruvia (below).<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>PSD-Banken<\u002Fsc-raw-td><sc-raw-td>PSD Bank Nord (first migrated 2008), PSD Bank West etc.<\u002Fsc-raw-td><sc-raw-td>Long-standing cooperative specials.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Kirchenbanken<\u002Fsc-raw-td><sc-raw-td>Various<\u002Fsc-raw-td><sc-raw-td>Cooperative specials.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Apotheker- und Ärztebank (Apobank)<\u002Fsc-raw-td><sc-raw-td>Apobank<\u002Fsc-raw-td><sc-raw-td><st
