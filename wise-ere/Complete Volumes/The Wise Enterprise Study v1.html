olor-accent-700);font-variant-numeric:tabular-nums\">V.12<\u002Fspan>&nbsp; PESTLE (material factors)<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-12-pestle-material-factors\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-13-positive-flywheels\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.13<\u002Fspan>&nbsp; Positive Flywheels<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-13-positive-flywheels\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-14-negative-flywheels\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.14<\u002Fspan>&nbsp; Negative Flywheels<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-14-negative-flywheels\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-15-theory-of-constraints-bottleneck\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.15<\u002Fspan>&nbsp; Theory of Constraints / Bottleneck<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-15-theory-of-constraints-bottleneck\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-16-risk-register-probability-severity-with-detectability-m\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.16<\u002Fspan>&nbsp; Risk Register (Probability × Severity, with detectability, mitigation, residual risk, horizon)<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-16-risk-register-probability-severity-with-detectability-m\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-17-stress-tests\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.17<\u002Fspan>&nbsp; Stress Tests<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-17-stress-tests\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-18-what-could-make-wise-obsolete\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.18<\u002Fspan>&nbsp; What Could Make Wise Obsolete?<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-18-what-could-make-wise-obsolete\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-19-strategic-optionality-matrix\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.19<\u002Fspan>&nbsp; Strategic Optionality Matrix<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-19-strategic-optionality-matrix\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-20-what-is-wise-becoming-probability-ranked-hypotheses\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.20<\u002Fspan>&nbsp; What Is Wise Becoming? (Probability-ranked hypotheses)<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-20-what-is-wise-becoming-probability-ranked-hypotheses\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-21-five-year-and-ten-year-scenarios\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.21<\u002Fspan>&nbsp; Five-Year and Ten-Year Scenarios<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-21-five-year-and-ten-year-scenarios\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-22-what-the-market-may-misunderstand\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.22<\u002Fspan>&nbsp; What the Market May Misunderstand<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-22-what-the-market-may-misunderstand\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-23-management-and-capital-allocation-judgment\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.23<\u002Fspan>&nbsp; Management and Capital-Allocation Judgment<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-23-management-and-capital-allocation-judgment\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row sub\"><div class=\"toc-t\"><a href=\"#v-24-volume-v-reconstruction-consolidated-conclusions\"><span style=\"color:var(--color-accent-700);font-variant-numeric:tabular-nums\">V.24<\u002Fspan>&nbsp; Volume V Reconstruction — Consolidated Conclusions<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"v-24-volume-v-reconstruction-consolidated-conclusions\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row lead\"><div class=\"toc-k\">Part VI<\u002Fdiv><div class=\"toc-t\"><a href=\"#part-vi-cross-volume-synthesis\">Cross-Volume Synthesis<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"part-vi-cross-volume-synthesis\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row lead\"><div class=\"toc-k\">Appendix A<\u002Fdiv><div class=\"toc-t\"><a href=\"#appendix-a-canonical-figures-register\">Canonical Figures Register<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"appendix-a-canonical-figures-register\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row lead\"><div class=\"toc-k\">Appendix B<\u002Fdiv><div class=\"toc-t\"><a href=\"#appendix-b-reconciliation-of-cross-volume-discrepancies\">Reconciliation of Cross-Volume Discrepancies<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"appendix-b-reconciliation-of-cross-volume-discrepancies\">—<\u002Fdiv><\u002Fdiv>\n<div class=\"toc-row lead\"><div class=\"toc-k\">Appendix C<\u002Fdiv><div class=\"toc-t\"><a href=\"#appendix-c-source-hierarchy-evidence-conventions\">Source Hierarchy &amp; Evidence Conventions<\u002Fa><\u002Fdiv><div class=\"toc-p\" data-pageno=\"appendix-c-source-hierarchy-evidence-conventions\">—<\u002Fdiv><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ── HOW TO READ / CONVENTIONS ─────────────────────────── -->\n<section data-break=\"page\" style=\"break-before:page;padding-top:4mm\">\n  <h2 id=\"how-to-read\" style=\"margin-top:0\">How to read this document<\u002Fh2>\n  <p>This study takes Wise apart component by component across five volumes, then reassembles it. Each volume was researched and written as a standalone study; this master edition binds them into one document with a single set of conventions, a canonical figures table, and a synthesis that no individual volume contains.<\u002Fp>\n  <div class=\"tbl\">\n    <sc-raw-table class=\"table\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:5.5em\">Part<\u002Fsc-raw-th><sc-raw-th>Volume<\u002Fsc-raw-th><sc-raw-th>Question it answers<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-raw-tr><sc-raw-td>Front matter<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Conventions, canonical figures, how to navigate<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Part I<\u002Fsc-raw-td><sc-raw-td>Corporate, Legal, Regulatory &amp; Institutional Anatomy<\u002Fsc-raw-td><sc-raw-td>Who owns and controls Wise; which entity does what; which regulator supervises which entity<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Part II<\u002Fsc-raw-td><sc-raw-td>Product, Customer &amp; Money-Movement Architecture<\u002Fsc-raw-td><sc-raw-td>What Wise sells, who buys it, and what physically happens when money moves<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Part III<\u002Fsc-raw-td><sc-raw-td>Operations, Technology, Data &amp; Organisational Infrastructure<\u002Fsc-raw-td><sc-raw-td>How ~4.7m transactions a day actually get processed safely<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Part IV<\u002Fsc-raw-td><sc-raw-td>Financial Statements, Revenue Architecture, Unit Economics &amp; Capital<\u002Fsc-raw-td><sc-raw-td>How the economic machine earns, spends and retains money<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Part V<\u002Fsc-raw-td><sc-raw-td>Management, Culture, Competition, Moat, Risk &amp; Strategic Evolution<\u002Fsc-raw-td><sc-raw-td>Why Wise wins, what is durable, what breaks it, what it becomes<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Part VI<\u002Fsc-raw-td><sc-raw-td><strong>Cross-Volume Synthesis<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>What the five volumes prove together that none proves alone<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Appendix A<\u002Fsc-raw-td><sc-raw-td>Canonical Figures Register<\u002Fsc-raw-td><sc-raw-td>The single authoritative value for every material number<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Appendix B<\u002Fsc-raw-td><sc-raw-td>Reconciliation of Cross-Volume Discrepancies<\u002Fsc-raw-td><sc-raw-td>Where the volumes disagree, and which figure governs<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Appendix C<\u002Fsc-raw-td><sc-raw-td>Source Hierarchy &amp; Evidence Conventions<\u002Fsc-raw-td><sc-raw-td>How claims were graded<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fdiv>\n  <div class=\"plate\" style=\"background:color-mix(in srgb,var(--color-accent-100) 70%,transparent)\">\n    <span class=\"plate-label\">Recommended reading order — first pass<\u002Fspan>\n    <p style=\"margin:0\">Part VI (Synthesis) → Appendix A → then Parts II and IV in full. Parts I, III and V are reference-depth.<\u002Fp>\n  <\u002Fdiv>\n\n  <h2 id=\"conventions\">Conventions governing the whole document<\u002Fh2>\n  <h3><span class=\"num\">§1<\u002Fspan><span>Evidence classification<\u002Fspan><\u002Fh3>\n  <p>Every material claim carries one of six labels. These are not decoration — they are load-bearing, and no inference is silently promoted to fact.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--color-divider);border:1px solid var(--color-divider);margin:1.1em 0 1.5em\">\n    <div style=\"background:var(--color-bg);padding:var(--space-4)\"><span class=\"ev\">Confirmed fact<\u002Fspan><p style=\"margin:0.5em 0 0;font-size:12.5px;line-height:1.45\">Directly supported by reliable primary evidence.<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:var(--space-4)\"><span class=\"ev\">Company claim<\u002Fspan><p style=\"margin:0.5em 0 0;font-size:12.5px;line-height:1.45\">Stated by Wise, not independently verified.<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:var(--space-4)\"><span class=\"ev\">Third-party estimate<\u002Fspan><p style=\"margin:0.5em 0 0;font-size:12.5px;line-height:1.45\">Externally reported or estimated.<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:var(--space-4)\"><span class=\"ev\">Analytical inference<\u002Fspan><p style=\"margin:0.5em 0 0;font-size:12.5px;line-height:1.45\">Reasonably inferred from multiple known facts.<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:var(--space-4)\"><span class=\"ev ev-soft\">Hypothesis<\u002Fspan><p style=\"margin:0.5em 0 0;font-size:12.5px;line-height:1.45\">Possible explanation requiring further evidence.<\u002Fp><\u002Fdiv>\n    <div style=\"background:var(--color-bg);padding:var(--space-4)\"><span class=\"ev ev-soft\">Unknown<\u002Fspan><p style=\"margin:0.5em 0 0;font-size:12.5px;line-height:1.45\">Available evidence is insufficient.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3><span class=\"num\">§2<\u002Fspan><span>Reporting basis — read this before any figure<\u002Fspan><\u002Fh3>\n  <p>Wise's financial year ends <strong>31 March<\u002Fstrong>. There is a hard basis break in the series:<\u002Fp>\n  <ul>\n    <li><strong>FY2020–FY2025: IFRS, presented in GBP<\u002Fstrong>, reported by Wise plc.<\u002Fli>\n    <li><strong>FY2026 onward: US GAAP, presented in USD<\u002Fstrong>, reported by Wise Group plc following the 8 May 2026 reorganisation (Jersey-incorporated, UK tax resident; Nasdaq: WSE, LSE: WISE). The former listed parent was renamed Wise Limited.<\u002Fli>\n  <\u002Ful>\n  <p>Three changes happened simultaneously at that break: IFRS → US GAAP, GBP → USD, and the discontinuation of the \"underlying income / underlying PBT\" alternative performance measures. <strong>These are definitional changes, not economic ones.<\u002Fstrong> The two series are never spliced in this document. Where a figure is quoted, its basis is stated. The bridging source is Wise's \"Translation of IFRS financials into US GAAP\" RNS of 13 April 2026.<\u002Fp>\n  <p>Volumes I, II and III were written primarily against the FY2025 IFRS/GBP base because that was the last fully audited annual report at the time of writing; Volume IV establishes the FY2026 US GAAP/USD base properly. Where the earlier volumes quote £ figures and Volume IV quotes $ figures for the same concept, <strong>Appendix A governs<\u002Fstrong>.<\u002Fp>\n\n  <h3><span class=\"num\">§3<\u002Fspan><span>Currency and rounding<\u002Fspan><\u002Fh3>\n  <p>Where both bases are relevant, GBP figures carry the FY and basis inline (e.g. \"£145.2bn, FY2025 IFRS\"). USD figures default to FY2026 US GAAP. No implied exchange rate is applied across the basis break.<\u002Fp>\n<\u002Fsection>\n\n<!-- ── CANONICAL FIGURES AT A GLANCE ─────────────────────── -->\n<section data-break=\"page\" style=\"break-before:page;padding-top:4mm\">\n  <h2 id=\"twelve-figures\" style=\"margin-top:0\">The study in twelve figures<\u002Fh2>\n  <p style=\"max-width:62ch\">Every number below is the canonical value from Appendix A. FY2026 figures are US GAAP / USD unless a basis is stated; the FY2025 figures that remain authoritative are IFRS / GBP.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--color-divider);border:1px solid var(--color-divider);margin:1.4em 0 0\">\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">FY26<\u002Fspan><p class=\"stat-v\">19m<\u002Fp><p class=\"stat-l\">Active customers, +21% year on year<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">FY26<\u002Fspan><p class=\"stat-v\">$243.5bn<\u002Fp><p class=\"stat-l\">Cross-border volume, +31%<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">FY26<\u002Fspan><p class=\"stat-v\">$2,502.8m<\u002Fp><p class=\"stat-l\">Net revenue, +19%<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">FY26<\u002Fspan><p class=\"stat-v\">$660.4m<\u002Fp><p class=\"stat-l\">Income before tax — 26.4% margin<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">FY26<\u002Fspan><p class=\"stat-v\">$39bn<\u002Fp><p class=\"stat-l\">Customer holdings, incl. $9bn Wise Assets<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">FY26<\u002Fspan><p class=\"stat-v\">$43.6bn<\u002Fp><p class=\"stat-l\">Card spend, +37%<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">Q4 FY26<\u002Fspan><p class=\"stat-v\">0.51%<\u002Fp><p class=\"stat-l\">Cross-border take rate, down from 0.73% in FY2020<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">FY26<\u002Fspan><p class=\"stat-v\">$806.1m<\u002Fp><p class=\"stat-l\">Gross interest income on customer balances<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">Estate<\u002Fspan><p class=\"stat-v\">80+<\u002Fp><p class=\"stat-l\">Licences across dozens of jurisdictions<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">Estate<\u002Fspan><p class=\"stat-v\">8<\u002Fp><p class=\"stat-l\">Direct national payment-system connections<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">Ops<\u002Fspan><p class=\"stat-v\">~4.7m<\u002Fp><p class=\"stat-l\">Transactions processed per day<\u002Fp><\u002Fdiv>\n    <div class=\"stat\" style=\"border:0;background:var(--color-bg)\"><span class=\"stat-n\">FY25 IFRS<\u002Fspan><p class=\"stat-v\">590%<\u002Fp><p class=\"stat-l\">Own-funds surplus — £1.29bn CET1 vs £219.8m requirement<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin-top:1.4em;font-size:12px;color:var(--color-neutral-700);max-width:70ch\">Read together, these say one thing: the constraint on this business is no longer capital, licensing breadth or technology. It is financial-crime compliance execution at scale — the subject of the enforcement cluster traced through Parts I and V.<\u002Fp>\n<\u002Fsection>\n\n<section class=\"part\" id=\"part-i-corporate-legal-regulatory-institutional-anatomy\" data-break=\"page\"><div class=\"part-top\"><span>Part I<\u002Fspan><span>The Wise Enterprise Reverse-Engineering Study<\u002Fspan><\u002Fdiv><div class=\"part-mid\"><div class=\"part-no\">01<\u002Fdiv><h1 class=\"part-title\">Corporate, Legal, Regulatory &amp; Institutional Anatomy<\u002Fh1><p class=\"part-sub\">Who owns and controls Wise; which entity does what; which regulator supervises which entity.<\u002Fp><\u002Fdiv><div class=\"part-rule\"><\u002Fdiv><\u002Fsection>\n<h4 id=\"an-institutional-grade-forensic-reverse-engineering-study-re\">An institutional-grade forensic reverse-engineering study | Research cut-off: 8 August 2026<\u002Fh4>\n<div class=\"plate long plate-tldr\"><span class=\"plate-label\">TL;DR<\u002Fspan>\n<ul>\n<li><strong>Wise is controlled by its founder-CEO and legally engineered around a single UK-authorised e-money institution.<\u002Fstrong> As of the FY2026 reorganisation, the group's ultimate parent is <strong>Wise Group plc, a Jersey-incorporated, UK-tax-resident company<\u002Fstrong> (Nasdaq: WSE; LSE: WISE) that on 8 May 2026 became parent of <strong>Wise Limited (formerly Wise plc)<\u002Fstrong>. Co-founder Kristo Käärmann holds ~18% of the economics but, via nine-vote Class B shares, would command &gt;50% of votes — contractually capped at one vote below 50% while he remains CEO (falling to below 35% if he ceases to be CEO). Real control sits with Käärmann; economic ownership is dispersed across institutions (Baillie Gifford ~10.5% of Class A) and the founders.<\u002Fli>\n<li><strong>The regulatory estate is the moat, and one entity is the crown jewel.<\u002Fstrong> Wise operates 80+ licences across dozens of jurisdictions, but the economically decisive permissions are the UK EMI licence held by <strong>Wise Payments Limited<\u002Fstrong> (FCA FRN 900507) and the Belgian payment-institution licence held by <strong>Wise Europe SA<\u002Fstrong> (NBB, No. 0713629988), which passports across the EEA. The rarest asset is direct settlement access to national payment systems (UK Faster Payments/Bank of England RTGS, plus 7 others), where Wise was the first non-bank to obtain several connections.<\u002Fli>\n<li><strong>The architecture is under real stress in 2026.<\u002Fstrong> A $4.2m US six-state AML consent order (9 July 2025), a CFPB order (2025), a Belgian criminal money-laundering investigation of Wise Europe SA (&gt;€500m/$569m, disclosed 1 June 2026), the FCA's £350k fine of the CEO (28 Oct 2024), and the OCC's 21 July 2026 denial of Wise's national trust bank charter together reveal that Wise's binding constraint is no longer technology or licensing breadth — it is financial-crime compliance execution at scale.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div class=\"plate long\"><span class=\"plate-label\">Key Findings<\u002Fspan>\n<ol>\n<li><span class=\"ev\">CONFIRMED<\u002Fspan> Founded January 2011 in London as TransferWise by Estonians Taavet Hinrikus (Skype's first employee) and Kristo Käärmann (ex-Deloitte/PwC). The original vehicle was registered by Käärmann in England on 31 March 2010 as \"Exchange Solutions,\" renamed TransferWise (2012) and Wise (Feb 2021).<\u002Fli>\n<li><span class=\"ev\">CONFIRMED<\u002Fspan> Direct listing on the LSE on 7 July 2021: shares opened at 800p and closed at 880p, giving a <strong>£8.75bn (~$12bn) market value<\u002Fstrong> — the first direct listing of a tech company in London and, at the time, the largest such deal. It raised no primary capital; existing holders sold to the market. First trades began at 11:22am BST under ticker WISE.<\u002Fli>\n<li><span class=\"ev\">CONFIRMED<\u002Fspan> On 28 July 2025 shareholders approved moving the primary listing to the US, bundled with a controversial 10-year extension of Class B supervoting rights (previously due to sunset in 2026). Co-founder Hinrikus (via Skaala Investments, ~5%) publicly opposed the bundling as \"inappropriate and unfair.\" The scheme was court-sanctioned 27 April 2026; effective 8 May 2026; Nasdaq trading began 11 May 2026.<\u002Fli>\n<li><span class=\"ev\">CONFIRMED<\u002Fspan> A Jersey topco (Wise Group plc) was inserted via a Part 26 Companies Act 2006 scheme of arrangement, 1:1 share exchange, dual-class structure retained, nominal values redenominated to USD ($0.01 Class A; $0.000000001 Class B). Old Wise plc renamed Wise Limited.<\u002Fli>\n<li><span class=\"ev\">CONFIRMED<\u002Fspan> FY2026 (year to 31 Mar 2026): active customers up 21% to <strong>19 million<\u002Fstrong>; cross-border volume up 31% to <strong>$243.5bn<\u002Fstrong>; net revenue <strong>$2,502.8m<\u002Fstrong> (+19%); <strong>income before tax $660.4m<\u002Fstrong> (26.4% margin); customer holdings <strong>$39bn<\u002Fstrong> (incl. $9bn Wise Assets). Reporting shifted to US GAAP and USD.<\u002Fli>\n<li><span class=\"ev\">CONFIRMED<\u002Fspan> Group held &gt;£1.29bn CET1 capital vs a £219.8m own-funds requirement (FY2025) — a <strong>590.41% surplus buffer<\u002Fstrong>. The binding requirement is the Fixed Overheads Requirement (£219.8m), not the K-factor (£40.0m) or permanent minimum (£6.4m).<\u002Fli>\n<li><span class=\"ev\">CONFIRMED<\u002Fspan> Customer money is <strong>safeguarded (not deposited)<\u002Fstrong>; roughly ~60% in government securities/money-market funds and ~40% cash at banks (e.g., JPMorgan Chase for EU cash; BlackRock and State Street MMFs). Wise earns interest income on safeguarded balances; separately, \"Wise Assets\" passes MMF returns (managed by BlackRock) to customers.<\u002Fli>\n<li><span class=\"ev\">CONFIRMED<\u002Fspan> Wise depends on <strong>Community Federal Savings Bank (CFSB)<\u002Fstrong> as US card issuer and sponsor bank in states where Wise lacks its own money-transmitter licence — a concentration risk underscored by an OCC AML enforcement action against CFSB.<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<h3 id=\"details\"><span>Details<\u002Fspan><\u002Fh3>\n<h3 id=\"i-1-origin-and-corporate-institutional-evolution\"><span class=\"num\">I.1<\u002Fspan><span>Origin and Corporate Institutional Evolution<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Date<\u002Fsc-raw-th><sc-raw-th>Event<\u002Fsc-raw-th><sc-raw-th>Structural change / capability gained<\u002Fsc-raw-th><sc-raw-th>New dependency or obligation<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>31 Mar 2010<\u002Fsc-raw-td><sc-raw-td>Käärmann registers \"Exchange Solutions\" (England) <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Legal shell created<\u002Fsc-raw-td><sc-raw-td>UK company law<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Jan 2011<\u002Fsc-raw-td><sc-raw-td>TransferWise launches; freelance-built MVP <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>P2P currency-matching model (funds don't cross borders)<\u002Fsc-raw-td><sc-raw-td>Needs two-sided currency flow to net<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Aug 2011<\u002Fsc-raw-td><sc-raw-td>Seedcamp seed ~$72,000 <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>First external capital<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2012<\u002Fsc-raw-td><sc-raw-td>Renamed TransferWise; ~$1.3m seed (IA Ventures, Index, Thiel, Levchin) <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Core tech build<\u002Fsc-raw-td><sc-raw-td>VC governance<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>May 2013<\u002Fsc-raw-td><sc-raw-td>$6m Series A led by Valar Ventures (Thiel) <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Valar becomes long-term anchor investor<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Jun 2014<\u002Fsc-raw-td><sc-raw-td>$25m Series B (incl. Richard Branson/Virgin) <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>European expansion<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Jan 2015<\u002Fsc-raw-td><sc-raw-td>$58m Series C led by Andreessen Horowitz <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>a16z anchor<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2016<\u002Fsc-raw-td><sc-raw-td>Unicorn status (~$1.1bn); total raised ~$117m <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Scale<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2017<\u002Fsc-raw-td><sc-raw-td>Borderless (multi-currency) account + Mastercard debit launched; profitable since 2017 <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Shift from pure remittance to account/card<\u002Fsc-raw-td><sc-raw-td>Card-network + sponsor-bank reliance<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2018<\u002Fsc-raw-td><sc-raw-td>First non-bank direct member of UK Faster Payments + Bank of England settlement account <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Bypasses sponsor banks in GBP; lower cost/faster<\u002Fsc-raw-td><sc-raw-td>Direct BoE settlement obligations<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sep 2020<\u002Fsc-raw-td><sc-raw-td>First EU direct access via Central Bank of Hungary (VIBER/GIRO) <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Domestic HUF rails<\u002Fsc-raw-td><sc-raw-td>Central-bank participant duties<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Feb 2021<\u002Fsc-raw-td><sc-raw-td>Rebrand TransferWise → Wise <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Broader \"money management\" positioning<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>7 Jul 2021<\u002Fsc-raw-td><sc-raw-td>Direct listing on LSE (£8.75bn close) <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Public currency, broadened ownership, OwnWise customer-shareholder programme<\u002Fsc-raw-td><sc-raw-td>Public-market disclosure; dual-class scrutiny (excluded from FTSE 100 due to dual class)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2022–2025<\u002Fsc-raw-td><sc-raw-td>Wise Platform scales (Morgan Stanley, Standard Chartered, Nubank, Monzo, N26, Google Pay) <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>B2B2C infrastructure revenue<\u002Fsc-raw-td><sc-raw-td>Partner concentration<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>28 Oct 2024<\u002Fsc-raw-td><sc-raw-td>FCA fines CEO Käärmann £350k <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Governance/reputational<\u002Fsc-raw-td><sc-raw-td>SMCR scrutiny<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Jan/May 2025<\u002Fsc-raw-td><sc-raw-td>CFPB consent order (amended to ~$45k civil penalty) <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>US conduct remediation<\u002Fsc-raw-td><sc-raw-td>CFPB oversight<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>9 Jul 2025<\u002Fsc-raw-td><sc-raw-td>US six-state AML consent order ($4.2m) <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Remediation, SAR lookback<\u002Fsc-raw-td><sc-raw-td>State supervision<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>28 Jul 2025<\u002Fsc-raw-td><sc-raw-td>Shareholders approve US primary listing + Class B 10-yr extension <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Path to Nasdaq; founder control extended<\u002Fsc-raw-td><sc-raw-td>Governance controversy<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>8–11 May 2026<\u002Fsc-raw-td><sc-raw-td>Jersey topco inserted; Nasdaq primary listing <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>US capital-market access; US GAAP/USD reporting<\u002Fsc-raw-td><sc-raw-td>SEC 20-F regime; securities class action filed<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>1 Jun 2026<\u002Fsc-raw-td><sc-raw-td>Belgian AML criminal probe disclosed (&gt;€500m) <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>Share-price shock (down as much as ~20% intraday)<\u002Fsc-raw-td><sc-raw-td>Criminal-law exposure<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>21–24 Jul 2026<\u002Fsc-raw-td><sc-raw-td>OCC denies Wise National Trust charter <span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><sc-raw-td>US direct-rail ambition delayed<\u002Fsc-raw-td><sc-raw-td>Continued sponsor-bank reliance<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Path dependency.<\u002Fstrong> The founders' P2P \"netting\" insight created a business whose unit economics improve with matched two-way flow and internalisation — which in turn made direct payment-system access (not correspondent banking) the strategic prize. Every later structural choice (own licences over partners; direct rails over sponsors) descends from that original logic. The 2011 idea that \"the funds never crossed the borders\" is, fifteen years later, still the reason Wise builds direct national-rail connections instead of paying correspondent-bank spreads.<\u002Fp>\n<h3 id=\"i-2-group-structure-fy2025-consolidation-basis-topco-changed\"><span class=\"num\">I.2<\u002Fspan><span>Group Structure (FY2025 consolidation basis; topco changed May 2026)<\u002Fspan><\u002Fh3>\n<p><strong>Ultimate parent (from 8 May 2026):<\u002Fstrong> Wise Group plc — Jersey plc, solely UK tax resident, Nasdaq/LSE listed (SEC CIK 2099039; Class A ISIN JE00BQKY0816). Beneath it sits <strong>Wise Limited (formerly Wise plc)<\u002Fstrong> and the operating tree. Prior to that, Wise plc (England &amp; Wales) was the listed parent. Court sanction was 27 April 2026; the scheme became effective at 22:00 London time on 8 May 2026; secondary LSE admission and Nasdaq trading commenced 11 May 2026. <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan>:** the exact Jersey company registration number of Wise Group plc.<\u002Fp>\n<p><strong>Registration-number caution <span class=\"ev\">CONFIRMED / FLAGGED<\u002Fspan>.<\u002Fstrong> Companies House lists <strong>Wise Payments Limited<\u002Fstrong> (the operating EMI) under number <strong>07209813<\u002Fstrong>; the FY2025 MIFIDPRU 8 disclosure footer prints \"Wise plc, Registered number: 07209813,\" which conflates the operating EMI's number. Primary sources indicate the listed holding \"Wise plc\" was a separate England &amp; Wales company (number <strong>13211214<\u002Fstrong>, originally \"456 Newco plc,\" renamed Wise plc on 17 June 2021). This is a caution against treating any single \"Wise\" entity as monolithic — the entity behind a given product, balance, or licence matters.<\u002Fp>\n<p><strong>Economically important entities (from FY2025 MIFIDPRU 8 disclosure; all 100% owned):<\u002Fstrong><\u002Fp>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Entity<\u002Fsc-raw-th><sc-raw-th>Jurisdiction<\u002Fsc-raw-th><sc-raw-th>Function<\u002Fsc-raw-th><sc-raw-th>Regulatory role<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Wise Payments Limited<\u002Fsc-raw-td><sc-raw-td>UK<\u002Fsc-raw-td><sc-raw-td>Core online currency exchange / account<\u002Fsc-raw-td><sc-raw-td>FCA EMI, FRN 900507 — the operational heart<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Europe SA<\u002Fsc-raw-td><sc-raw-td>Belgium<\u002Fsc-raw-td><sc-raw-td>EEA payments<\u002Fsc-raw-td><sc-raw-td>NBB payment institution, No. 0713629988; EEA passport<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Assets Europe AS<\u002Fsc-raw-td><sc-raw-td>Estonia<\u002Fsc-raw-td><sc-raw-td>Investments (Wise Assets EEA)<\u002Fsc-raw-td><sc-raw-td>EFSA investment firm 4.1-1/174; EEA passport<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Assets UK Limited<\u002Fsc-raw-td><sc-raw-td>UK<\u002Fsc-raw-td><sc-raw-td>Investments (Wise Assets UK)<\u002Fsc-raw-td><sc-raw-td>FCA MIFIDPRU investment firm, FRN 839689 — triggers consolidated FCA supervision<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise US Inc<\u002Fsc-raw-td><sc-raw-td>USA (Delaware/NY)<\u002Fsc-raw-td><sc-raw-td>US money transmission<\u002Fsc-raw-td><sc-raw-td>FinCEN MSB; 48-state MTLs + 4 territories; CFSB partner elsewhere<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Australia Pty Ltd<\u002Fsc-raw-td><sc-raw-td>Australia<\u002Fsc-raw-td><sc-raw-td>AU account<\u002Fsc-raw-td><sc-raw-td>ASIC AFSL 513764; APRA ADI (PPF); AUSTRAC<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Asia-Pacific Pte Ltd<\u002Fsc-raw-td><sc-raw-td>Singapore<\u002Fsc-raw-td><sc-raw-td>APAC account<\u002Fsc-raw-td><sc-raw-td>MAS Major Payment Institution + CMS licence<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Payments Japan K.K.<\u002Fsc-raw-td><sc-raw-td>Japan<\u002Fsc-raw-td><sc-raw-td>JP transfers<\u002Fsc-raw-td><sc-raw-td>Type 1 &amp; Type 2 funds-transfer licences (FSA / Kanto Local Finance Bureau, reg. 00040)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Brasil Corretora / Instituição de Pagamentos<\u002Fsc-raw-td><sc-raw-td>Brazil<\u002Fsc-raw-td><sc-raw-td>FX broker / payments &amp; e-money<\u002Fsc-raw-td><sc-raw-td>Central Bank of Brazil<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Payments India Pvt Ltd; Vaho Forex Pvt Ltd<\u002Fsc-raw-td><sc-raw-td>India<\u002Fsc-raw-td><sc-raw-td>Inward PA-CB; outward AD-II<\u002Fsc-raw-td><sc-raw-td>RBI<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Holding cos: Wise Financial Holdings Ltd, Wise Investments Holdings Ltd, Wise Newco Holdings Ltd<\u002Fsc-raw-td><sc-raw-td>UK<\u002Fsc-raw-td><sc-raw-td>Intermediate holding<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Dormant: Wise Switzerland AG, Wise Payments South Africa, Wise Payments Korea, Wise Payments (Thailand), Wise Payments New Zealand, Wise Newco Limited<\u002Fsc-raw-td><sc-raw-td>Various<\u002Fsc-raw-td><sc-raw-td>Placeholder / wind-down / market-entry<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Why functions are separated:<\u002Fstrong> (1) <strong>Regulation/licensing<\u002Fstrong> — each market's law requires a locally licensed entity (dominant driver); (2) <strong>Risk ring-fencing<\u002Fstrong> — safeguarding and customer-money obligations are entity-specific; (3) <strong>Product architecture<\u002Fstrong> — payments (Wise Europe SA) vs investments (Wise Assets Europe AS) split reflects distinct regulatory regimes; (4) <strong>Historical / market-entry<\u002Fstrong> — dormant shells pre-position for expansion or preserve names.<\u002Fp>\n<h3 id=\"i-3-ownership-and-share-structure\"><span class=\"num\">I.3<\u002Fspan><span>Ownership and Share Structure<\u002Fspan><\u002Fh3>\n<p><strong>Dual-class mechanics:<\u002Fstrong> Class A = 1 vote (listed, tradeable); Class B = 9 votes (non-transferable, unlisted, \"golden\" supervoting). Each Class B corresponds to a Class A. At the 2021 IPO the largest external holders were Valar Ventures (~10.2%), IA Ventures (~9.6%), Andreessen Horowitz (~9.3%), Baillie Gifford (~4.9%), D1 Capital (~3.9%), IVP (~3.7%); founders held roughly a third combined.<\u002Fp>\n<p><strong>As of 2026 (post-Nasdaq):<\u002Fstrong> Baillie Gifford filed a Schedule 13G reporting <strong>~10.53% of Class A<\u002Fstrong> (108,011,990 shares; sole voting power over 98,802,398). Käärmann holds ~18% economics; Hinrikus/Skaala ~5%. Total voting rights sit around 2.86–2.95bn depending on issuance date; <strong>Käärmann's votes would exceed 50% but are capped at one vote below 50% while he is CEO<\u002Fstrong> (dropping to below 35% if he ceases to be CEO) — bringing exercisable votes to roughly 2.44bn.<\u002Fp>\n<p><strong>Economic vs voting divergence — the defining governance fact.<\u002Fstrong> Economic ownership is dispersed and institutional; voting control is founder-concentrated by design. Management cannot realistically be removed against Käärmann's wishes while the cap sits just below 50% and Class B carries 9× votes. This is the trade the market accepted in the July 2025 vote, over the objection of co-founder Hinrikus and initial concern from Glass Lewis and ISS.<\u002Fp>\n<h3 id=\"i-4-governance-architecture\"><span class=\"num\">I.4<\u002Fspan><span>Governance Architecture<\u002Fspan><\u002Fh3>\n<p><strong>Board (as of 31 Mar 2025):<\u002Fstrong> David Wells (Chair, ex-Netflix CFO); Kristo Käärmann (CEO); Emmanuel Thomassin (CFO from 1 Oct 2024, after interim Kingsley Kemish and the resignation of Matthew Briers); NEDs Terri Duhon, Clare Gilmartin (Senior Independent Director), Alastair (Alex) Rampell (a16z), Hooi Ling Tan, Ingo Uytdehaage (Audit &amp; Risk Committee Chair), Elizabeth Chambers (Remuneration Committee Chair).<\u002Fp>\n<p><strong>Committees:<\u002Fstrong> Nomination (Wells), Remuneration (Chambers), Disclosure (Jessica Winter), and a combined Audit &amp; Risk Committee (Uytdehaage). A deep management risk-committee stack sits beneath the board: Group Risk Committee, ALCO, plus Financial Crime, Operational, Regulatory, Credit, Prudential, Market and Liquidity risk committees, and an Emerging Risk Forum, all under a Three-Lines-of-Defence model. Notably, the General Counsel and Chief Risk Officer report to the CTO (not the CEO), and the Global Head of Internal Audit reports to the CFO, with CRO and Internal Audit also reporting jointly to the board for independence.<\u002Fp>\n<p><strong>Executive pay:<\u002Fstrong> No company-wide annual bonus; heavy equity weighting. The Hybrid LTIP for Executive Directors comprises performance shares (max 325% of salary; measured on relative TSR, volume growth and customer NPS) plus restricted shares (max 325% of salary), with 3-year vesting, 2-year post-vesting holding, and malus/clawback (5 years for EDs, 4 for others). FY2025 aggregate remuneration: Board incl. NEDs £4.65m (9 beneficiaries); Leadership Team (non-board) £9.57m (10); other SMFs/MRTs £2.05m; <strong>total staff remuneration £412.8m across 6,151 beneficiaries.<\u002Fstrong> All permanent staff receive share awards (\"Wisers\" as owners).<\u002Fp>\n<p><strong>Revealed priorities (Follow-the-Management).<\u002Fstrong> Capital allocation (≈$470m FY2026 share purchases for the Employee Share Trust plus a planned &gt;$500m programme), relentless direct-rail/licence investment, and continuous price cuts (cross-border take rate fell to ~0.51–0.52%) confirm a genuine volume-and-infrastructure flywheel over near-term margin maximisation — behaviour that matches the stated \"mission\" rhetoric rather than contradicting it.<\u002Fp>\n<h3 id=\"i-5-legal-architecture\"><span class=\"num\">I.5<\u002Fspan><span>Legal Architecture<\u002Fspan><\u002Fh3>\n<ul>\n<li><strong>Customer contracts by jurisdiction:<\u002Fstrong> UK customers contract with Wise Payments Limited (English law); EEA customers with Wise Europe SA (Belgian law); US customers with Wise US Inc (plus CFSB under a separate Cardholder Agreement); APAC/others with the local licensed entity. The contracting entity is also the entity that owes the customer their balance.<\u002Fli>\n<li><strong>Card terms:<\u002Fstrong> In the US, the Wise Multi-Currency Card is issued by CFSB (an FDIC-insured member institution); Wise provides servicing and is a named beneficiary of the agreement. Elsewhere Wise entities issue via card-network membership/BIN sponsorship (Mastercard/Visa).<\u002Fli>\n<li><strong>IP / employment / group services:<\u002Fstrong> Software IP is capitalised centrally, though intangibles are modest (£4.0m at FY2025 after most development cost is expensed); the group runs a functional (not divisional) management structure across 30+ offices; intercompany service and cost-allocation arrangements support the licensed entities. Precise transfer-pricing terms are <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan> from public sources.<\u002Fli>\n<li><strong>Litigation/enforcement:<\u002Fstrong> FCA fine of the CEO (£350k, Oct 2024); CFPB order (2025); US six-state AML consent order (Jul 2025); Belgian criminal AML investigation of Wise Europe SA (2026); and a US securities class action (Rosen Law Firm) covering the 11 May–23 Jul 2026 class period, filed after the Belgian disclosure.<\u002Fli>\n<\u002Ful>\n<p><strong>Design logic:<\u002Fstrong> The legal architecture ring-fences each market's customer-money and regulatory liability inside a locally licensed subsidiary while concentrating group capital and technology centrally. This limits contagion (a problem in one market is contained in one entity) but concentrates reputational and financial-crime risk at group level — precisely the fault-line the 2026 Belgian probe exposes.<\u002Fp>\n<h3 id=\"i-6-global-regulatory-map-selected-as-of-research-date\"><span class=\"num\">I.6<\u002Fspan><span>Global Regulatory Map (selected; as of research date)<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Jurisdiction<\u002Fsc-raw-th><sc-raw-th>Entity<\u002Fsc-raw-th><sc-raw-th>Regulator<\u002Fsc-raw-th><sc-raw-th>Authorisation<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>UK<\u002Fsc-raw-td><sc-raw-td>Wise Payments Ltd<\u002Fsc-raw-td><sc-raw-td>FCA<\u002Fsc-raw-td><sc-raw-td>Electronic Money Institution, FRN 900507<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>UK<\u002Fsc-raw-td><sc-raw-td>Wise Assets UK Ltd<\u002Fsc-raw-td><sc-raw-td>FCA<\u002Fsc-raw-td><sc-raw-td>MIFIDPRU investment firm, FRN 839689<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>EEA (Belgium)<\u002Fsc-raw-td><sc-raw-td>Wise Europe SA<\u002Fsc-raw-td><sc-raw-td>National Bank of Belgium<\u002Fsc-raw-td><sc-raw-td>Payment institution No. 0713629988; EEA passport to 29 states<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>EEA (Estonia)<\u002Fsc-raw-td><sc-raw-td>Wise Assets Europe AS<\u002Fsc-raw-td><sc-raw-td>EFSA<\u002Fsc-raw-td><sc-raw-td>Investment firm licence 4.1-1/174; EEA passport<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>USA<\u002Fsc-raw-td><sc-raw-td>Wise US Inc<\u002Fsc-raw-td><sc-raw-td>FinCEN + state regulators + CFPB<\u002Fsc-raw-td><sc-raw-td>MSB; MTLs in 48 states + 4 territories; CFSB partner elsewhere<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Canada<\u002Fsc-raw-td><sc-raw-td>Wise Payments Canada Inc<\u002Fsc-raw-td><sc-raw-td>FINTRAC / Bank of Canada / Revenu Québec<\u002Fsc-raw-td><sc-raw-td>MSB M15193392; PSP; Quebec MSB 902804<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Australia<\u002Fsc-raw-td><sc-raw-td>Wise Australia Pty Ltd<\u002Fsc-raw-td><sc-raw-td>ASIC / APRA / AUSTRAC<\u002Fsc-raw-td><sc-raw-td>AFSL 513764; ADI (PPF); reporting entity<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Singapore<\u002Fsc-raw-td><sc-raw-td>Wise Asia-Pacific Pte Ltd<\u002Fsc-raw-td><sc-raw-td>MAS<\u002Fsc-raw-td><sc-raw-td>Major Payment Institution + CMS licence<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Japan<\u002Fsc-raw-td><sc-raw-td>Wise Payments Japan K.K.<\u002Fsc-raw-td><sc-raw-td>FSA / Kanto Local Finance Bureau<\u002Fsc-raw-td><sc-raw-td>Type 1 &amp; Type 2 funds-transfer licences (reg. 00040)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>India<\u002Fsc-raw-td><sc-raw-td>Wise Payments India / Vaho Forex<\u002Fsc-raw-td><sc-raw-td>RBI<\u002Fsc-raw-td><sc-raw-td>PA-CB (Inward); AD-II (outward)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Brazil<\u002Fsc-raw-td><sc-raw-td>Wise Brasil Corretora / Instituição de Pagamentos<\u002Fsc-raw-td><sc-raw-td>Central Bank of Brazil<\u002Fsc-raw-td><sc-raw-td>FX brokerage; payment institution/e-money<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>New Zealand<\u002Fsc-raw-td><sc-raw-td>Wise Payments NZ Ltd<\u002Fsc-raw-td><sc-raw-td>DIA<\u002Fsc-raw-td><sc-raw-td>AML supervision<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Hong Kong<\u002Fsc-raw-td><sc-raw-td>Wise Payments Hong Kong Ltd<\u002Fsc-raw-td><sc-raw-td>Customs &amp; Excise (C&amp;ED)<\u002Fsc-raw-td><sc-raw-td>MSO licence 25-03-03263<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>UAE<\u002Fsc-raw-td><sc-raw-td>Wise Fintech Network LLC<\u002Fsc-raw-td><sc-raw-td>Central Bank of UAE<\u002Fsc-raw-td><sc-raw-td>Stored Value Facility + Retail Payment Services + remittance<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Malaysia<\u002Fsc-raw-td><sc-raw-td>Wise Payments Malaysia Sdn Bhd<\u002Fsc-raw-td><sc-raw-td>Bank Negara Malaysia<\u002Fsc-raw-td><sc-raw-td>Remittance / money-changing / e-money<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Philippines<\u002Fsc-raw-td><sc-raw-td>Wise Pilipinas Inc<\u002Fsc-raw-td><sc-raw-td>Bangko Sentral ng Pilipinas<\u002Fsc-raw-td><sc-raw-td>RTC + Type C EMI/MC/FXD + OPS (code 53-0044-00-000)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Israel<\u002Fsc-raw-td><sc-raw-td>Wise ILS Ltd<\u002Fsc-raw-td><sc-raw-td>Israel Securities Authority<\u002Fsc-raw-td><sc-raw-td>Payment Services Licence<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Indonesia<\u002Fsc-raw-td><sc-raw-td>PT Wise Payments Indonesia<\u002Fsc-raw-td><sc-raw-td>Bank Indonesia<\u002Fsc-raw-td><sc-raw-td>Category 3 PSP (remittance)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Chile<\u002Fsc-raw-td><sc-raw-td>Wise Chile SpA<\u002Fsc-raw-td><sc-raw-td>UAF<\u002Fsc-raw-td><sc-raw-td>Money Transfer Company<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Mexico<\u002Fsc-raw-td><sc-raw-td>Wise Pagos Mexico<\u002Fsc-raw-td><sc-raw-td>CNBV / UBVA<\u002Fsc-raw-td><sc-raw-td>Money transmitter, reg. 22578 (authorised Mar 2026)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Thailand<\u002Fsc-raw-td><sc-raw-td>Wise Payments (Thailand) Ltd<\u002Fsc-raw-td><sc-raw-td>Bank of Thailand<\u002Fsc-raw-td><sc-raw-td>E-fund transfer / e-money (entity dormant per FY25 list)<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Customer-money treatment:<\u002Fstrong> none of these are deposit-taking banks; balances are <strong>safeguarded, not covered by deposit-insurance<\u002Fstrong> (FSCS/FDIC do not apply to ordinary balances; limited FDIC pass-through applies only to opted-in US interest via a program bank; the Estonian Guarantee Fund up to €20,000 applies to EEA Assets).<\u002Fp>\n<h3 id=\"i-7-own-licence-vs-partner-dependency-matrix\"><span class=\"num\">I.7<\u002Fspan><span>Own-Licence vs Partner Dependency Matrix<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Capability<\u002Fsc-raw-th><sc-raw-th>Structure<\u002Fsc-raw-th><sc-raw-th>Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Account balances / local details<\u002Fsc-raw-td><sc-raw-td><strong>A. Own<\u002Fstrong> authorisation (EMI/PI/local licences)<\u002Fsc-raw-td><sc-raw-td>Core; safeguarded not deposited<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>GBP domestic transfers<\u002Fsc-raw-td><sc-raw-td><strong>A. Own<\u002Fstrong> — direct Faster Payments + BoE settlement<\u002Fsc-raw-td><sc-raw-td>First non-bank direct participant (2018)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>EUR transfers<\u002Fsc-raw-td><sc-raw-td><strong>A. Own<\u002Fstrong> — Wise Europe SA; SEPA access; direct in Hungary<\u002Fsc-raw-td><sc-raw-td>EEA passport<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Other direct rails<\u002Fsc-raw-td><sc-raw-td><strong>A. Own<\u002Fstrong> — 8 live connections (UK FPS, EU SEPA, Hungary, Singapore FAST, Australia NPP, Philippines Pesonet/InstaPay, Brazil Pix, Japan Zengin); Malaysia PayNet added<\u002Fsc-raw-td><sc-raw-td>~75% of transfers arrive &lt;20s<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card issuance (US)<\u002Fsc-raw-td><sc-raw-td><strong>B. Partner<\u002Fstrong> — CFSB issuer/sponsor<\u002Fsc-raw-td><sc-raw-td>Concentration risk<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card issuance (other)<\u002Fsc-raw-td><sc-raw-td><strong>E. Combination<\u002Fstrong> — network membership + BIN sponsorship<\u002Fsc-raw-td><sc-raw-td>Mastercard/Visa<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>US money transmission (states without own MTL)<\u002Fsc-raw-td><sc-raw-td><strong>B. Partner<\u002Fstrong> — CFSB<\u002Fsc-raw-td><sc-raw-td>48 states own; remainder via CFSB<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FX / matching / netting<\u002Fsc-raw-td><sc-raw-td><strong>A. Own<\u002Fstrong> — proprietary treasury engine<\u002Fsc-raw-td><sc-raw-td>Core margin driver<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Interest/returns (Wise Assets)<\u002Fsc-raw-td><sc-raw-td><strong>D. Outsourced<\u002Fstrong> — BlackRock/State Street MMFs<\u002Fsc-raw-td><sc-raw-td>Wise passes through returns<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Safeguarding<\u002Fsc-raw-td><sc-raw-td><strong>E. Combination<\u002Fstrong> — own obligation; cash at JPMorgan + MMFs + govt bonds<\u002Fsc-raw-td><sc-raw-td>~60/40 split<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>US direct Fed rails<\u002Fsc-raw-td><sc-raw-td><strong>Blocked<\u002Fstrong> — sought via national trust charter; OCC denied Jul 2026<\u002Fsc-raw-td><sc-raw-td>Still reliant on partners<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Why:<\u002Fstrong> Wise builds its own licence/rails where volume justifies the fixed cost and removes correspondent-bank margin and latency (GBP, EUR, and the 8 direct rails). It uses partners where local licensing is uneconomic (US minor states) or structurally required (US card issuance). The national-trust-charter push was an attempt to convert partner dependency into owned US infrastructure; its denial preserves CFSB dependency.<\u002Fp>\n<h3 id=\"i-8-regulation-as-a-competitive-asset\"><span class=\"num\">I.8<\u002Fspan><span>Regulation as a Competitive Asset<\u002Fspan><\u002Fh3>\n<ul>\n<li><strong>Easy to replicate:<\u002Fstrong> a single MSB registration or one state MTL.<\u002Fli>\n<li><strong>Hard but obtainable:<\u002Fstrong> a full EMI (UK) or PI (Belgium) licence with EEA passport; MAS MPI; APRA PPF ADI; Japan Type 1 funds-transfer licence.<\u002Fli>\n<li><strong>The real moat — the operating system:<\u002Fstrong> direct settlement participation in national payment systems (being the <em>first non-bank<\u002Fem> into UK FPS, Hungary, and the Japan Zengin/Bank of Japan connection) plus the compliance/treasury operating system to run 80+ licences safely. The 2025–2026 enforcement cluster demonstrates the moat's double edge: the same regulatory density that deters entrants imposes an operating burden that Wise itself has struggled to satisfy. <strong>The moat is real; the operating system to occupy it is the actual bottleneck.<\u002Fstrong><\u002Fli>\n<\u002Ful>\n<h3 id=\"i-9-institutional-dependency-map\"><span class=\"num\">I.9<\u002Fspan><span>Institutional Dependency Map<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Dependency<\u002Fsc-raw-th><sc-raw-th>Function<\u002Fsc-raw-th><sc-raw-th>Substitutability<\u002Fsc-raw-th><sc-raw-th>Criticality<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>FCA (UK)<\u002Fsc-raw-td><sc-raw-td>Authorises core EMI + consolidated supervision<\u002Fsc-raw-td><sc-raw-td>None<\u002Fsc-raw-td><sc-raw-td><strong>Critical<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>National Bank of Belgium<\u002Fsc-raw-td><sc-raw-td>Authorises EEA passport entity<\u002Fsc-raw-td><sc-raw-td>None (short term)<\u002Fsc-raw-td><sc-raw-td><strong>Critical<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Bank of England (RTGS/FPS)<\u002Fsc-raw-td><sc-raw-td>GBP settlement<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td><strong>Critical<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card networks (Mastercard/Visa)<\u002Fsc-raw-td><sc-raw-td>Card rails<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td><strong>Critical<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>CFSB (US sponsor/issuer)<\u002Fsc-raw-td><sc-raw-td>US card + minor-state transmission<\u002Fsc-raw-td><sc-raw-td>Moderate (other sponsors exist)<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>JPMorgan Chase (safeguarding cash)<\u002Fsc-raw-td><sc-raw-td>Custody of client cash<\u002Fsc-raw-td><sc-raw-td>Moderate (diversifiable)<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>BlackRock / State Street (MMFs)<\u002Fsc-raw-td><sc-raw-td>Wise Assets returns<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td><strong>Moderate<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>National payment operators (SEPA, FAST, NPP, Pix, Zengin, etc.)<\u002Fsc-raw-td><sc-raw-td>Direct domestic rails<\u002Fsc-raw-td><sc-raw-td>Low per market<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cloud/infrastructure vendors<\u002Fsc-raw-td><sc-raw-td>Platform hosting<\u002Fsc-raw-td><sc-raw-td>Moderate<\u002Fsc-raw-td><sc-raw-td><strong>High<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Platform partners (Morgan Stanley, Nubank, Standard Chartered, etc.)<\u002Fsc-raw-td><sc-raw-td>B2B revenue<\u002Fsc-raw-td><sc-raw-td>Diversified (85+)<\u002Fsc-raw-td><sc-raw-td><strong>Moderate<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Single points of institutional failure:<\u002Fstrong> loss/restriction of the FCA EMI or NBB PI licence; termination by CFSB before Wise obtains direct US rails; a card-network membership suspension.<\u002Fp>\n<h3 id=\"i-10-tax-and-intercompany-architecture\"><span class=\"num\">I.10<\u002Fspan><span>Tax and Intercompany Architecture<\u002Fspan><\u002Fh3>\n<ul>\n<li>Wise Group plc is <strong>Jersey-incorporated but solely UK tax resident<\u002Fstrong> <span class=\"ev\">CONFIRMED<\u002Fspan>. This is a listing/redomicile structure for US-market access, not evidence of profit-shifting to a tax haven — profits remain within the UK tax net.<\u002Fli>\n<li>FY2025 reported PBT was £565m vs underlying PBT £282.1m; a large deferred tax asset (£84.7m at FY2025) is deducted from CET1 because it relies on future profitability. Effective tax rate and granular geographic profit allocation are <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan> at the level requested; transfer-pricing terms are not public.<\u002Fli>\n<\u002Ful>\n<h3 id=\"i-11-corporate-and-regulatory-risk\"><span class=\"num\">I.11<\u002Fspan><span>Corporate and Regulatory Risk<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Risk<\u002Fsc-raw-th><sc-raw-th>Prob.<\u002Fsc-raw-th><sc-raw-th>Severity<\u002Fsc-raw-th><sc-raw-th>Mitigation<\u002Fsc-raw-th><sc-raw-th>Residual<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>AML/sanctions enforcement<\u002Fsc-raw-td><sc-raw-td>High (materialising)<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Compliance rebuild; SAR lookbacks; ~1/3 staff in financial crime [company claim]<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Belgian criminal probe adverse outcome<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Cooperation; localised in Wise Europe SA<\u002Fsc-raw-td><sc-raw-td>Medium-High<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Partner-bank (CFSB) termination<\u002Fsc-raw-td><sc-raw-td>Low-Med<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Sought own US charter (denied Jul 2026); alternate sponsors<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Licence loss (FCA/NBB)<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Severe<\u002Fsc-raw-td><sc-raw-td>Capital surplus (~590%); governance<\u002Fsc-raw-td><sc-raw-td>Low-Med<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Safeguarding failure<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Severe<\u002Fsc-raw-td><sc-raw-td>Segregation; govt securities; new FCA safeguarding rules (May 2026)<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Governance/founder-control backlash<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Voting cap; independent NEDs<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Capital shortfall<\u002Fsc-raw-td><sc-raw-td>Very low<\u002Fsc-raw-td><sc-raw-td>Severe<\u002Fsc-raw-td><sc-raw-td>£1.29bn CET1 vs £220m requirement<\u002Fsc-raw-td><sc-raw-td>Very low<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<h3 id=\"i-12-reconstruction-answers-to-the-completion-test\"><span class=\"num\">I.12<\u002Fspan><span>Reconstruction — Answers to the Completion Test<\u002Fspan><\u002Fh3>\n<ul>\n<li><strong>Who owns Wise:<\u002Fstrong> Dispersed institutions (Baillie Gifford ~10.5% of Class A) + founders (Käärmann ~18%, Hinrikus ~5%) + early VCs (Valar, IA Ventures, a16z) + employees.<\u002Fli>\n<li><strong>Who controls Wise:<\u002Fstrong> Käärmann, via 9-vote Class B shares, capped one vote below 50% while CEO.<\u002Fli>\n<li><strong>Legal structure:<\u002Fstrong> Jersey topco (Wise Group plc, UK tax resident) → Wise Limited (ex-Wise plc) → licensed operating subsidiaries per market.<\u002Fli>\n<li><strong>Which regulators supervise which entities:<\u002Fstrong> FCA (Wise Payments Ltd, Wise Assets UK Ltd + consolidated group); NBB (Wise Europe SA); EFSA (Wise Assets Europe AS); MAS, APRA/ASIC/AUSTRAC, FSA/KLFB, RBI, Central Bank of Brazil, FinCEN + states + CFPB, and others per market.<\u002Fli>\n<li><strong>Which licences enable which products:<\u002Fstrong> UK EMI → accounts/transfers/card in UK; Belgian PI + EEA passport → EEA accounts/transfers; EFSA/Wise Assets licences → investment returns; local licences → local products.<\u002Fli>\n<li><strong>Partner reliance:<\u002Fstrong> US card + minor-state transmission via CFSB; Wise Assets returns via BlackRock/State Street MMFs.<\u002Fli>\n<li><strong>Most strategically important entity:<\u002Fstrong> <strong>Wise Payments Limited<\u002Fstrong> (UK EMI, FRN 900507) — the operational and licensing heart and the anchor of consolidated FCA supervision.<\u002Fli>\n<li><strong>Hardest permission to replace:<\u002Fstrong> Direct non-bank settlement access to national payment systems (UK FPS/BoE and the Japan Zengin/Bank of Japan first-mover positions).<\u002Fli>\n<li><strong>Greatest dependency:<\u002Fstrong> Core regulators (FCA/NBB) and card networks; among commercial counterparties, CFSB.<\u002Fli>\n<li><strong>Where control sits:<\u002Fstrong> With the founder-CEO, by design.<\u002Fli>\n<li><strong>Most misunderstood:<\u002Fstrong> That Wise is a \"bank.\" It is not; balances are safeguarded, not insured deposits, and Wise does not lend them out.<\u002Fli>\n<li><strong>Longest to rebuild from zero:<\u002Fstrong> The direct payment-system memberships and the multi-jurisdiction compliance/treasury operating system — years, not months.<\u002Fli>\n<\u002Ful>\n<p><strong>Ten most important conclusions:<\u002Fstrong> (1) Control is founder-locked via a sub-50% voting cap. (2) The UK EMI (Wise Payments Ltd) is the indispensable entity. (3) The moat is direct-rail access + the compliance operating system, not licence count. (4) Safeguarding — not deposit insurance — is the customer-money model, and it is widely misunderstood. (5) Interest income on safeguarded balances (~$40m per 25bp) is a large, exogenous profit swing. (6) Financial-crime compliance is now the binding constraint, evidenced by four 2024–2026 enforcement events. (7) The Jersey topco/Nasdaq move is about capital access and US ambition, not tax. (8) CFSB is the sharpest single commercial dependency, and the OCC denial prolongs it. (9) The legal architecture ring-fences market risk but concentrates group-level reputational/criminal risk (Belgium). (10) Capital is not the risk — the ~590% own-funds buffer is enormous; execution and conduct are.<\u002Fp>\n<div class=\"plate long\"><span class=\"plate-label\">Recommendations<\u002Fspan>\n<ol>\n<li><strong>Treat financial-crime compliance as the gating KPI, not licensing breadth.<\u002Fstrong> The 2025–2026 enforcement cluster (US six-state AML consent order of $4.2m on 9 July 2025; CFPB; Belgian criminal probe; OCC denial citing AML deficiencies) shows the binding constraint. <em>Benchmark that would change the rating:<\u002Fem> an indictment or direct summons of Wise Europe SA in Belgium, or an FCA/NBB remediation escalation, would move the risk rating from High to Severe. Conversely, a clean close of the US SAR lookback (covering closed accounts 1 Mar 2023–1 Mar 2025) and no Belgian charges would de-risk it.<\u002Fli>\n<li><strong>Monitor the CFSB dependency and the second US charter attempt.<\u002Fstrong> If Wise refiles a national trust charter under the GENIUS Act framework and the Fed reopens master-account access for uninsured trusts, US direct-rail independence becomes plausible; continued failure prolongs CFSB concentration risk. <em>Watch:<\u002Fem> Fed's finalised \"payment account\" policy (proposed May 2026) and any OCC re-engagement.<\u002Fli>\n<li><strong>Track the founder-control cap as the key governance term.<\u002Fstrong> The one-vote-below-50% cap is the single most important governance provision. Any move to remove or extend it, or a Käärmann CEO transition (which drops the cap to below 35%), would materially change the control map and should trigger re-underwriting of governance risk.<\u002Fli>\n<li><strong>Model the rates sensitivity explicitly.<\u002Fstrong> ~$40m of net interest income moves per 25bp of central-bank rate change on ~$26bn of balances — a profitability swing outside management's control and a key variable for any valuation of the FY2027 guidance (net-revenue growth ~mid-15–20% range; income-before-tax margin near the top of 20–25%).<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<div class=\"plate long\"><span class=\"plate-label\">Caveats<\u002Fspan>\n<ul>\n<li>Some corporate-registry specifics are <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan> from public sources: the exact Jersey registration number of Wise Group plc; precise transfer-pricing terms; and the granular effective tax rate / geographic profit split.<\u002Fli>\n<li>The \"07209813 vs 13211214\" registration-number issue reflects genuine entity-naming complexity (07209813 is Wise Payments Limited's number, also printed on the group MIFIDPRU footer); treat entity-level \"Wise\" claims with care.<\u002Fli>\n<li>FY2026 figures are reported on a new US GAAP/USD basis; comparison with prior IFRS/GBP figures requires care. Where this report cites both £ (through FY2025) and $ (FY2026), the currency reflects the reporting basis of the period.<\u002Fli>\n<li>The Belgian matter is an active criminal investigation of Wise Europe SA with, per Wise, no findings or charges confirmed as of the research date; prosecutors were reported to be finalising a direct summons. Presumption of regularity applies.<\u002Fli>\n<li>Secondary-source items (e.g., the ~60/40 safeguarding split, some Wise Platform partner counts, \"~1/3 of staff in financial crime\") are labelled as company claims or third-party estimates and were not all independently reconciled to primary filings.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<section class=\"part\" id=\"part-ii-product-customer-money-movement-architecture\" data-break=\"page\"><div class=\"part-top\"><span>Part II<\u002Fspan><span>The Wise Enterprise Reverse-Engineering Study<\u002Fspan><\u002Fdiv><div class=\"part-mid\"><div class=\"part-no\">02<\u002Fdiv><h1 class=\"part-title\">Product, Customer &amp; Money-Movement Architecture<\u002Fh1><p class=\"part-sub\">What Wise sells, who buys it, and what physically happens when money moves.<\u002Fp><\u002Fdiv><div class=\"part-rule\"><\u002Fdiv><\u002Fsection>\n<p><em>Analytical cut-off: 8 August 2026. FY2025 = year ended 31 March 2025 (IFRS, GBP, audited). FY2026 = year ended 31 March 2026 (US GAAP, USD; results released 25 June 2026). Where a base is mixed, it is flagged.<\u002Fem><\u002Fp>\n<h3 id=\"ii-0-orientation\"><span class=\"num\">II.0<\u002Fspan><span>Orientation<\u002Fspan><\u002Fh3>\n<p>Wise sells three customer-facing \"solutions\" built on one shared infrastructure: the <strong>Wise Account<\u002Fstrong> (personal), <strong>Wise Business<\u002Fstrong> (SMEs), and <strong>Wise Platform<\u002Fstrong> (banks/enterprises). <span class=\"ev\">CONFIRMED FACT — FY2025 report<\u002Fspan> Beneath them sit shared commercial primitives: cross-border transfer, currency conversion, multi-currency balance holding, local account details, the debit card, receiving, interest/Assets, and the API. This volume takes each apart.<\u002Fp>\n<p>Central operating insight, stated up front: <strong>a \"cross-border\" Wise transfer usually involves no money crossing a border for that specific customer.<\u002Fstrong> Wise holds prefunded local currency pools and local payment-system access at both ends; the sender pays into a Wise account domestically, and Wise pays the recipient from a Wise account domestically in the destination country. The two domestic legs are linked only by an internal ledger entry. Money crosses borders periodically, in bulk, when Wise <strong>rebalances<\u002Fstrong> depleted pools — not per transaction. This is confirmed by Wise's own FY2025 CEO letter, which describes \"a new global payments network that directly connects local banks and payment systems at both ends of every transaction, bypassing the traditional correspondent networks used by banks and other payment services, eliminating costly intermediaries and outdated processes.\" <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<h3 id=\"ii-1-product-universe\"><span class=\"num\">II.1<\u002Fspan><span>Product Universe<\u002Fspan><\u002Fh3>\n<h4 id=\"product-decomposition\">Product decomposition<\u002Fh4>\n<figure class=\"tbl tbl-wide\"><div class=\"rot\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Product / capability<\u002Fsc-raw-th><sc-raw-th>Target customer<\u002Fsc-raw-th><sc-raw-th>Job-to-be-done<\u002Fsc-raw-th><sc-raw-th>Primary legal entity (by region)<\u002Fsc-raw-th><sc-raw-th>Regulatory basis<\u002Fsc-raw-th><sc-raw-th>Pricing mechanism<\u002Fsc-raw-th><sc-raw-th>Revenue type<\u002Fsc-raw-th><sc-raw-th>Classification<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>International transfer<\u002Fsc-raw-td><sc-raw-td>Personal + Business<\u002Fsc-raw-td><sc-raw-td>Move money abroad cheaply/fast<\u002Fsc-raw-td><sc-raw-td>Wise Payments Ltd (UK EMI); Wise Europe SA (BE PI); Wise US Inc (MSB/MTL + CFSB)<\u002Fsc-raw-td><sc-raw-td>E-money / payment institution + MTL<\u002Fsc-raw-td><sc-raw-td>Fixed fee + variable % (from ~0.33%) on converted amount<\u002Fsc-raw-td><sc-raw-td>Cross-border revenue<\u002Fsc-raw-td><sc-raw-td>Monetization / Acquisition<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Currency conversion (in-account)<\u002Fsc-raw-td><sc-raw-td>Both<\u002Fsc-raw-td><sc-raw-td>Convert held balances<\u002Fsc-raw-td><sc-raw-td>Same as above<\u002Fsc-raw-td><sc-raw-td>EMI/PI<\u002Fsc-raw-td><sc-raw-td>From ~0.33–0.43% conversion fee<\u002Fsc-raw-td><sc-raw-td>Cross-border revenue<\u002Fsc-raw-td><sc-raw-td>Monetization<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Multi-currency balance<\u002Fsc-raw-td><sc-raw-td>Both<\u002Fsc-raw-td><sc-raw-td>Hold 40+ currencies<\u002Fsc-raw-td><sc-raw-td>Wise Payments Ltd etc.<\u002Fsc-raw-td><sc-raw-td>E-money issuance<\u002Fsc-raw-td><sc-raw-td>Free to hold<\u002Fsc-raw-td><sc-raw-td>Enables interest income<\u002Fsc-raw-td><sc-raw-td>Retention / Infrastructure<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Local account details<\u002Fsc-raw-td><sc-raw-td>Both<\u002Fsc-raw-td><sc-raw-td>Receive \"like a local\"<\u002Fsc-raw-td><sc-raw-td>Regional entity<\u002Fsc-raw-td><sc-raw-td>Passported partnerships / direct rail access<\u002Fsc-raw-td><sc-raw-td>Free (personal); one-off setup fee for some business details<\u002Fsc-raw-td><sc-raw-td>Indirect (drives balances)<\u002Fsc-raw-td><sc-raw-td>Acquisition / Retention<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise debit card<\u002Fsc-raw-td><sc-raw-td>Both (US business cards discontinued 2023)<\u002Fsc-raw-td><sc-raw-td>Spend balances globally<\u002Fsc-raw-td><sc-raw-td>Issued by CFSB in US; Mastercard/Visa program elsewhere<\u002Fsc-raw-td><sc-raw-td>Card-scheme licence via issuer<\u002Fsc-raw-td><sc-raw-td>FX conversion fee; ATM fees over allowance<\u002Fsc-raw-td><sc-raw-td>Card &amp; other revenue (interchange + fees)<\u002Fsc-raw-td><sc-raw-td>Monetization / Retention / Data<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Digital/virtual cards<\u002Fsc-raw-td><sc-raw-td>Both<\u002Fsc-raw-td><sc-raw-td>Online / mobile-wallet spend<\u002Fsc-raw-td><sc-raw-td>Same as card<\u002Fsc-raw-td><sc-raw-td>Same<\u002Fsc-raw-td><sc-raw-td>Free to generate<\u002Fsc-raw-td><sc-raw-td>Interchange<\u002Fsc-raw-td><sc-raw-td>Retention / Data<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Interest / Assets<\u002Fsc-raw-td><sc-raw-td>Both (30 countries)<\u002Fsc-raw-td><sc-raw-td>Earn yield on idle balances<\u002Fsc-raw-td><sc-raw-td>Wise Assets UK Ltd; Wise Assets Europe AS<\u002Fsc-raw-td><sc-raw-td>Investment-services licences (e.g. AU AFSL)<\u002Fsc-raw-td><sc-raw-td>Annual mgmt fee ~0.27–0.56%<\u002Fsc-raw-td><sc-raw-td>Fee + AUC growth<\u002Fsc-raw-td><sc-raw-td>Retention / Defensive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Batch payments<\u002Fsc-raw-td><sc-raw-td>Business<\u002Fsc-raw-td><sc-raw-td>Pay ≤1,000 payees per file<\u002Fsc-raw-td><sc-raw-td>Regional entity<\u002Fsc-raw-td><sc-raw-td>PI/EMI<\u002Fsc-raw-td><sc-raw-td>Per-transfer fee (each leg priced individually)<\u002Fsc-raw-td><sc-raw-td>Cross-border revenue<\u002Fsc-raw-td><sc-raw-td>Monetization / Retention<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Invoicing / QuickPay (QR)<\u002Fsc-raw-td><sc-raw-td>Business<\u002Fsc-raw-td><sc-raw-td>Get paid<\u002Fsc-raw-td><sc-raw-td>Regional entity<\u002Fsc-raw-td><sc-raw-td>PI/EMI<\u002Fsc-raw-td><sc-raw-td>Free feature<\u002Fsc-raw-td><sc-raw-td>Indirect<\u002Fsc-raw-td><sc-raw-td>Acquisition / Retention<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Direct debits<\u002Fsc-raw-td><sc-raw-td>Business (US) + EEA<\u002Fsc-raw-td><sc-raw-td>Pay recurring bills<\u002Fsc-raw-td><sc-raw-td>Regional entity<\u002Fsc-raw-td><sc-raw-td>PI/EMI<\u002Fsc-raw-td><sc-raw-td>Standard fees<\u002Fsc-raw-td><sc-raw-td>Retention<\u002Fsc-raw-td><sc-raw-td>Retention<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Accounting integrations (Xero, QuickBooks, NetSuite)<\u002Fsc-raw-td><sc-raw-td>Business<\u002Fsc-raw-td><sc-raw-td>Reconcile automatically<\u002Fsc-raw-td><sc-raw-td>N/A (software)<\u002Fsc-raw-td><sc-raw-td>N/A<\u002Fsc-raw-td><sc-raw-td>Free<\u002Fsc-raw-td><sc-raw-td>Switching-cost driver<\u002Fsc-raw-td><sc-raw-td>Retention / Defensive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>API<\u002Fsc-raw-td><sc-raw-td>Business + Platform<\u002Fsc-raw-td><sc-raw-td>Automate payments<\u002Fsc-raw-td><sc-raw-td>Regional entity / partner contract<\u002Fsc-raw-td><sc-raw-td>PI/EMI + partner model<\u002Fsc-raw-td><sc-raw-td>Same transfer fees; integration/licence fees for Platform<\u002Fsc-raw-td><sc-raw-td>Cross-border + Platform<\u002Fsc-raw-td><sc-raw-td>Infrastructure / Strategic optionality<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Platform<\u002Fsc-raw-td><sc-raw-td>Banks, fintechs, enterprises<\u002Fsc-raw-td><sc-raw-td>Embed cross-border, accounts, cards<\u002Fsc-raw-td><sc-raw-td>Partner contracts with Wise entities<\u002Fsc-raw-td><sc-raw-td>Correspondent / embedded / enterprise models<\u002Fsc-raw-td><sc-raw-td>Cost+margin transaction fee; integration/licence fees<\u002Fsc-raw-td><sc-raw-td>Cross-border (partner volume)<\u002Fsc-raw-td><sc-raw-td>Infrastructure / Strategic optionality<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><\u002Ffigure>\n<p><strong>Key confirmations:<\u002Fstrong> batch payments up to 1,000 payees/file, each transfer priced individually <span class=\"ev\">CONFIRMED FACT<\u002Fspan>; US business debit cards discontinued 2023 <span class=\"ev\">CONFIRMED FACT<\u002Fspan>; card conversion fees \"from 0.33%,\" ATM allowances vary by region (US: free up to $100/2 withdrawals then $1.50 + 2% over $100; AU: free to A$400/month then 2.69% from 1 May 2026; India travel card free to $200) <span class=\"ev\">CONFIRMED FACT — Wise pricing pages<\u002Fspan>; Assets/Interest live in 30 countries since first UK launch September 2021 <span class=\"ev\">CONFIRMED FACT — FY2025 report<\u002Fspan>.<\u002Fp>\n<p><strong>Strategic classification logic.<\u002Fstrong> <em>Acquisition:<\u002Fem> international transfer (the original wedge; word-of-mouth driven — Wise's FY2025 report states \"In FY2025 our marketing spend was £53.8 million, an increase of 47%, with our Marketing team growing by 30%\" <span class=\"ev\">CONFIRMED FACT — Wise FY2025 report<\u002Fspan>). <em>Retention:<\u002Fem> Wise Account balances, card, Assets, business integrations. <em>Monetization:<\u002Fem> transfer fees, card FX/interchange, interest income. <em>Infrastructure/optionality:<\u002Fem> Wise Platform and the API.<\u002Fp>\n<h3 id=\"ii-2-customer-segmentation\"><span class=\"num\">II.2<\u002Fspan><span>Customer Segmentation<\u002Fspan><\u002Fh3>\n<p>FY2025 headline: <strong>15.6m active customers<\u002Fstrong> (Personal 14.87m; Business 0.697m). <span class=\"ev\">CONFIRMED FACT<\u002Fspan> FY2026 (Wise Group plc FY2026 results, 25 June 2026): \"support 19 million people and businesses move $243 billion across the world last year… Customer holdings grew 40% in FY26 to $39 billion and card spend grew 37% to $44 billion.\" <span class=\"ev\">CONFIRMED FACT<\u002Fspan> Personal was ~73% of volume (£106.4bn of £145.2bn) and Business ~27% (£38.8bn) in FY2025. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<figure class=\"tbl tbl-wide\"><div class=\"rot\"><sc-raw-table class=\"table\"><sc-raw-thead> iers/contractors<\u002Fsc-raw-td><sc-raw-td>FX transparency, treasury control<\u002Fsc-raw-td><sc-raw-td>Audit trail<\u002Fsc-raw-td><sc-raw-td>Bank + spreadsheets<\u002Fsc-raw-td><sc-raw-td>Accounting integration<\u002Fsc-raw-td><sc-raw-td>Switching cost of integrations<\u002Fsc-raw-td><sc-raw-td>Compliance holds; no lending<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Bank (Platform)<\u002Fsc-raw-td><sc-raw-td>Legacy correspondent too slow/costly<\u002Fsc-raw-td><sc-raw-td>Offer instant cross-border in-app<\u002Fsc-raw-td><sc-raw-td>New fee income, retention<\u002Fsc-raw-td><sc-raw-td>Regulatory comfort<\u002Fsc-raw-td><sc-raw-td>SWIFT correspondent<\u002Fsc-raw-td><sc-raw-td>Wants speed without rebuild<\u002Fsc-raw-td><sc-raw-td>Deep integration<\u002Fsc-raw-td><sc-raw-td>Build own rails<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><\u002Ffigure>\n<p>Usage archetypes to distinguish (per prompt): transfer utility; primary multi-currency account; travel tool; business operating account; cross-border payable/receivable tool; embedded infrastructure. FY2025: ~50% of personal and ~60% of business customers use multiple features — evidence of migration from single-use \"transfer utility\" to \"account.\" <span class=\"ev\">CONFIRMED FACT — FY2025 report<\u002Fspan><\u002Fp>\n<h3 id=\"ii-4-customer-journey-stage-by-stage\"><span class=\"num\">II.4<\u002Fspan><span>Customer Journey (stage-by-stage)<\u002Fspan><\u002Fh3>\n<figure class=\"tbl tbl-wide\"><div class=\"rot\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Stage<\u002Fsc-raw-th><sc-raw-th>Customer action<\u002Fsc-raw-th><sc-raw-th>Wise system<\u002Fsc-raw-th><sc-raw-th>Entity<\u002Fsc-raw-th><sc-raw-th>Data generated<\u002Fsc-raw-th><sc-raw-th>Compliance obligation<\u002Fsc-raw-th><sc-raw-th>Friction / failure point<\u002Fsc-raw-th><sc-raw-th>Cost / KPI<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Dis td>Notifications<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Event<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Support/exception<\u002Fsc-raw-td><sc-raw-td>Contact support<\u002Fsc-raw-td><sc-raw-td>Support/ops<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Ticket<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Manual intervention<\u002Fsc-raw-td><sc-raw-td>Contact rate<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Repeat/cross-sell<\u002Fsc-raw-td><sc-raw-td>Reuse / adopt card<\u002Fsc-raw-td><sc-raw-td>Growth<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Behavior<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Retention, feature adoption<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><\u002Ffigure>\n<p>Rate lock: mid-market rate locked at authenticated quote, \"typically remains valid for 30 minutes\"; if unfunded and the rate moves ≥5% adversely, Wise auto-cancels and refunds. <span class=\"ev\">CONFIRMED FACT — Wise API docs + Help Centre<\u002Fspan> Instant-delivery KPI: Wise's FY2025 report states \"approximately 65% of transactions being completed in under 20 seconds\"; this rose to \"75% of our Q4 payments globally completed in under 20 seconds\" (Wise Group plc FY2026 results, 25 June 2026). <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<h3 id=\"ii-5-money-flow-reconstruction-six-layer-separation\"><span class=\"num\">II.5<\u002Fspan><span>Money-Flow Reconstruction (six-layer separation)<\u002Fspan><\u002Fh3>\n<p>For each corridor we separate <strong>(A) customer-facing event, (B) actual cash movement, (C) internal ledger movement, (D) banking-system movement, (E) payment-system movement, (F) accounting recognition.<\u002Fstrong><\u002Fp>\n<h4 id=\"corridor-1-eur-gbp-balanced-both-ends-direct-rail\">Corridor 1 — EUR → GBP (balanced
