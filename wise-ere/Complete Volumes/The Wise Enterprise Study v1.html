ce is pure-play cost leadership; expect margin pressure and a marketing-spend response (Wise already committed to roughly triple marketing investment).<\u002Fli>\n<li><strong>Stablecoins become mainstream settlement.<\u002Fstrong> Ambiguous — could commoditise the rails (adverse) OR cheapen Wise's own settlement (favourable). Wise's GENIUS-Act pivot positions it to adopt; advantage shifts to the compliance/distribution wrapper.<\u002Fli>\n<li><strong>Governments connect instant-payment systems cheaply (Nexus).<\u002Fstrong> The biggest structural threat to the rail moat, but Nexus provides <em>connectivity<\u002Fem>, not FX conversion, AML, liquidity or UX — Wise could ride Nexus as a participant. APAC-first, ~2027 go-live limits near-term impact.<\u002Fli>\n<li><strong>Loses a major bank.<\u002Fstrong> Short-term corridor disruption; direct rails reduce dependence over time.<\u002Fli>\n<li><strong>Loses direct access to an important rail.<\u002Fstrong> Corridor-specific cost/speed regression plus reputational and competitive damage.<\u002Fli>\n<li><strong>A major regulator restricts Wise.<\u002Fstrong> Already partially materialised (OCC). US growth capped; EU exposure sits with the Belgian case.<\u002Fli>\n<li><strong>Fraud/scam losses double.<\u002Fstrong> Margin and reputation hit; tighter controls raise friction and threaten the word-of-mouth engine.<\u002Fli>\n<li><strong>Customer growth stalls.<\u002Fstrong> Breaks the flywheel; take-rate compression without volume growth would erode absolute contribution.<\u002Fli>\n<li><strong>Business growth disappoints.<\u002Fstrong> Slows the higher-value segment (Business Q4 FY2026 take rate 0.39%) and the account-adoption flywheel.<\u002Fli>\n<li><strong>Wise Platform accelerates dramatically.<\u002Fstrong> The best bull case — moves toward the &gt;50% vision with higher-quality recurring volume and a stronger infrastructure identity.<\u002Fli>\n<li><strong>Founder leadership disappears.<\u002Fstrong> Voting drops below 35%; strategy-continuity risk; potential takeover vulnerability.<\u002Fli>\n<li><strong>Major cyber/operational incident.<\u002Fstrong> In a trust-dependent business, potentially severe and lasting reputational damage.<\u002Fli>\n<\u002Fol>\n<h3 id=\"v-18-what-could-make-wise-obsolete\"><span class=\"num\">V.18<\u002Fspan><span>What Could Make Wise Obsolete?<\u002Fspan><\u002Fh3>\n<p>For each disruptor: does it remove the customer problem, cut Wise's cost, can Wise adopt it, does the distribution/regulatory layer stay valuable, does it commoditise Wise, or strengthen it?<\u002Fp>\n<ul>\n<li><strong>CBDCs:<\u002Fstrong> slow and fragmented; unlikely to solve cross-border FX/compliance soon. Neutral-to-benign.<\u002Fli>\n<li><strong>Stablecoins (GENIUS Act):<\u002Fstrong> commoditise settlement rails but not FX conversion, compliance or distribution. Wise can adopt (rail-agnostic; GENIUS refiling). Net effect: reduces Wise's costs more than it destroys Wise — <em>if<\u002Fem> Wise adopts.<\u002Fli>\n<li><strong>Instant-payment interop (Nexus):<\u002Fstrong> the sharpest threat to the rail moat, but connectivity ≠ FX + AML + liquidity + UX. Wise can participate. 2027 go-live limits near-term impact.<\u002Fli>\n<li><strong>Open banking:<\u002Fstrong> strengthens Wise (cheaper funding, better UX).<\u002Fli>\n<li><strong>Bank modernisation:<\u002Fstrong> slow; banks are becoming Wise Platform customers rather than rebuilding.<\u002Fli>\n<li><strong>AI financial agents:<\u002Fstrong> could commoditise the <em>consumer front-end<\u002Fem> (agents price-shop across providers) — a real threat to consumer stickiness; benign or positive for the infrastructure layer.<\u002Fli>\n<li><strong>Government cross-border infrastructure:<\u002Fstrong> see Nexus.<\u002Fli>\n<\u002Ful>\n<p><strong>Verdict:<\u002Fstrong> Wise's advantage is primarily the licensing/compliance/treasury/distribution wrapper around the rails, not the rails alone. Cheaper rails mostly <em>help<\u002Fem> Wise. The genuine obsolescence risk is a <em>combination<\u002Fem> — Nexus-style interop + stablecoin settlement + AI agents commoditising consumer distribution — playing out over 5–10 years, and only if Wise fails to adopt each.<\u002Fp>\n<h3 id=\"v-19-strategic-optionality-matrix\"><span class=\"num\">V.19<\u002Fspan><span>Strategic Optionality Matrix<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Adjacency<\u002Fsc-raw-th><sc-raw-th>Classification<\u002Fsc-raw-th><sc-raw-th>Rationale<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Deeper business banking / treasury<\u002Fsc-raw-td><sc-raw-td>Natural<\u002Fsc-raw-td><sc-raw-td>Existing Business account; $39bn holdings; direct overlap with Airwallex<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>AP/AR, invoicing, payroll<\u002Fsc-raw-td><sc-raw-td>Plausible<\u002Fsc-raw-td><sc-raw-td>Fits Business; competitive vs Airwallex, Corpay<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Enterprise APIs / Wise Platform expansion<\u002Fsc-raw-td><sc-raw-td>Natural<\u002Fsc-raw-td><sc-raw-td>Already core strategy; the &gt;50% vision<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card capabilities<\u002Fsc-raw-td><sc-raw-td>Natural<\u002Fsc-raw-td><sc-raw-td>$43.6bn card spend; interchange revenue engine<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Savings / investment (Assets)<\u002Fsc-raw-td><sc-raw-td>Plausible<\u002Fsc-raw-td><sc-raw-td>Already live; rolled out to Brazil in FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Stablecoin rails / GENIUS issuer<\u002Fsc-raw-td><sc-raw-td>Plausible-to-Stretch<\u002Fsc-raw-td><sc-raw-td>Post-OCC pivot; requires AML remediation first<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Identity / compliance infrastructure<\u002Fsc-raw-td><sc-raw-td>Stretch<\u002Fsc-raw-td><sc-raw-td>Would monetise a current weakness — implausible near-term<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Working capital / credit<\u002Fsc-raw-td><sc-raw-td>Stretch<\u002Fsc-raw-td><sc-raw-td>Regulatory/capital burden; off the asset-light model<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Full consumer bank (à la Revolut)<\u002Fsc-raw-td><sc-raw-td>Strategic fantasy<\u002Fsc-raw-td><sc-raw-td>Contradicts the asset-light, capped-margin identity<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<h3 id=\"v-20-what-is-wise-becoming-probability-ranked-hypotheses\"><span class=\"num\">V.20<\u002Fspan><span>What Is Wise Becoming? (Probability-ranked hypotheses)<\u002Fspan><\u002Fh3>\n<ol>\n<li><strong>International Payments Network / Global Financial Utility (H3 + H5) — ~45%.<\u002Fstrong> Strongest evidence: the Wise Platform &gt;50% vision, direct rails, \"network for the world's money\" language, and cost-plus infrastructure economics. Management behaviour (rail-building; Platform wins including UniCredit, Raiffeisen, MBSB and Capitec) confirms the trajectory.<\u002Fli>\n<li><strong>B2B Financial Infrastructure (H4) — ~25%.<\u002Fstrong> Platform + Business converging; competes directly with Airwallex and Corpay.<\u002Fli>\n<li><strong>Global Multi-Currency Account (H2) — ~20%.<\u002Fstrong> ~50% of net revenue is now non-cross-border (NII, card, other); account adoption is rising.<\u002Fli>\n<li><strong>Remittance/FX Company (H1) — ~10%.<\u002Fstrong> Increasingly reductive; still the cash engine but not the direction of travel.<\u002Fli>\n<\u002Fol>\n<p><strong>Synthesis:<\u002Fstrong> Wise is becoming a <strong>global payments-infrastructure utility<\u002Fstrong> with a consumer/business account front-end that funds it — a hybrid of H3, H4 and H5.<\u002Fp>\n<h3 id=\"v-21-five-year-and-ten-year-scenarios\"><span class=\"num\">V.21<\u002Fspan><span>Five-Year and Ten-Year Scenarios<\u002Fspan><\u002Fh3>\n<figure class=\"tbl tbl-wide\"><div class=\"rot\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Scenario<\u002Fsc-raw-th><sc-raw-th>Customers<\u002Fsc-raw-th><sc-raw-th>Take rate<\u002Fsc-raw-th><sc-raw-th>Revenue mix<\u002Fsc-raw-th><sc-raw-th>Margin<\u002Fsc-raw-th><sc-raw-th>Platform share<\u002Fsc-raw-th><sc-raw-th>Moat<\u002Fsc-raw-th><sc-raw-th>Strategic identity<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Base case<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>compounding ~15–20%<\u002Fsc-raw-td><sc-raw-td>−1–2 bps/qtr<\u002Fsc-raw-td><sc-raw-td>~50% non-cross-border<\u002Fsc-raw-td><sc-raw-td>20–25% (over-earn) → 15–20%<\u002Fsc-raw-td><sc-raw-td>~10%<\u002Fsc-raw-td><sc-raw-td>intact<\u002Fsc-raw-td><sc-raw-td>infrastructure + account<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Strong execution<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>accelerating<\u002Fsc-raw-td><sc-raw-td>slow decline<\u002Fsc-raw-td><sc-raw-td>balanced across streams<\u002Fsc-raw-td><sc-raw-td>top of 20–25%<\u002Fsc-raw-td><sc-raw-td>&gt;10%<\u002Fsc-raw-td><sc-raw-td>widening<\u002Fsc-raw-td><sc-raw-td>leading global network<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Infrastructure winner<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Platform-led<\u002Fsc-raw-td><sc-raw-td>lower blended<\u002Fsc-raw-td><sc-raw-td>Platform-heavy<\u002Fsc-raw-td><sc-raw-td>infrastructure-style<\u002Fsc-raw-td><sc-raw-td>30–50%<\u002Fsc-raw-td><sc-raw-td>dominant<\u002Fsc-raw-td><sc-raw-td>global financial utility<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Commoditised pricing<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>high volume, low rate<\u002Fsc-raw-td><sc-raw-td>collapses<\u002Fsc-raw-td><sc-raw-td>NII/card-dependent<\u002Fsc-raw-td><sc-raw-td>compressed<\u002Fsc-raw-td><sc-raw-td>mixed<\u002Fsc-raw-td><sc-raw-td>thinner<\u002Fsc-raw-td><sc-raw-td>low-cost utility<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Technology disruption (Nexus/stablecoin)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>pressured<\u002Fsc-raw-td><sc-raw-td>pressured<\u002Fsc-raw-td><sc-raw-td>shifts<\u002Fsc-raw-td><sc-raw-td>lower<\u002Fsc-raw-td><sc-raw-td>adopts rails<\u002Fsc-raw-td><sc-raw-td>narrower<\u002Fsc-raw-td><sc-raw-td>participant, not owner<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Regulatory disruption<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>US capped<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>higher cost<\u002Fsc-raw-td><sc-raw-td>slower<\u002Fsc-raw-td><sc-raw-td>dented<\u002Fsc-raw-td><sc-raw-td>constrained regional player<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Competitive consolidation<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>share loss<\u002Fsc-raw-td><sc-raw-td>pressured<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>lower<\u002Fsc-raw-td><sc-raw-td>contested<\u002Fsc-raw-td><sc-raw-td>eroded<\u002Fsc-raw-td><sc-raw-td>niche specialist<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><\u002Ffigure>\n<h3 id=\"v-22-what-the-market-may-misunderstand\"><span class=\"num\">V.22<\u002Fspan><span>What the Market May Misunderstand<\u002Fspan><\u002Fh3>\n<ol>\n<li><strong>\"Wise is just a remittance company.\"<\u002Fstrong> Reality: ~50% of net revenue is non-cross-border (NII, card, other); it is a payments network plus a multi-currency account. The misconception persists because remittance is the origin story. Implication: the market may under-value the Platform and account optionality.<\u002Fli>\n<li><strong>\"Its moat is only low fees.\"<\u002Fstrong> Reality: low fees are the <em>output<\u002Fem>; the moat is the direct-rail + netting + treasury + organic-CAC cost stack that <em>produces<\u002Fem> them. Copying the price without the cost base is loss-making. Implication: fee cuts are a weapon, not a vulnerability.<\u002Fli>\n<li><strong>\"Licences are the moat.\"<\u002Fstrong> Reality: the OCC denial proves accumulated licences do not guarantee expansion; licences are necessary but not sufficient and can become liabilities. Implication: the regulatory story is more fragile than bulls assume.<\u002Fli>\n<li><strong>\"Interest income is the business.\"<\u002Fstrong> Reality: net interest income (~$609m) is a cyclical tailwind Wise is structurally trying to give back (the intended 80% pass-through); durable margin is 15–20% from transaction economics. Implication: rate-driven earnings are lower-quality than headline margin suggests.<\u002Fli>\n<li><strong>\"Banks can copy Wise easily.\"<\u002Fstrong> Reality: banks' correspondent cost base and legacy technology make cost-plus at ~0.5% structurally unprofitable — which is precisely why 85+ banks white-label Wise Platform instead. Implication: banks are becoming customers, not clones.<\u002Fli>\n<li><strong>\"Wise Platform is merely an API product.\"<\u002Fstrong> Reality: it is a correspondent-banking replacement embedding Wise into banks' payment flows — potentially the majority of future volume. Implication: the Platform is the real long-term equity story.<\u002Fli>\n<\u002Fol>\n<h3 id=\"v-23-management-and-capital-allocation-judgment\"><span class=\"num\">V.23<\u002Fspan><span>Management and Capital-Allocation Judgment<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Decision<\u002Fsc-raw-th><sc-raw-th>Verdict<\u002Fsc-raw-th><sc-raw-th>Evidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Relentless price cuts / reinvest margin<\u002Fsc-raw-td><sc-raw-td>Value-creating<\u002Fsc-raw-td><sc-raw-td>Volume and customer compounding; ~70% organic acquisition<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Direct-rail infrastructure investment<\u002Fsc-raw-td><sc-raw-td>Value-creating<\u002Fsc-raw-td><sc-raw-td>Structural cost moat; unit-cost decline<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2021 LSE direct listing<\u002Fsc-raw-td><sc-raw-td>Strategically sound<\u002Fsc-raw-td><sc-raw-td>First UK tech direct listing; no dilution<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>US primary listing (Nasdaq, May 2026)<\u002Fsc-raw-td><sc-raw-td>Too early to judge<\u002Fsc-raw-td><sc-raw-td>Access to deeper capital markets and higher-multiple peers<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Class B 10-year extension bundling<\u002Fsc-raw-td><sc-raw-td>Questionable<\u002Fsc-raw-td><sc-raw-td>Governance blemish; Hinrikus critique; proxy-adviser concerns; contradicts \"radical transparency\"<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Under-investment in compliance (historical)<\u002Fsc-raw-td><sc-raw-td>Value-destroying<\u002Fsc-raw-td><sc-raw-td>Enforcement cluster; OCC denial capped US expansion<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>First buyback (£405m, executed by Goldman Sachs International, 21 Jul 2026–31 Mar 2027) + EST purchases ($470m/35.9m shares FY2026)<\u002Fsc-raw-td><sc-raw-td>Reasonable<\u002Fsc-raw-td><sc-raw-td>Owner-friendly; ~40% of the programme allocated to the EST to offset dilution<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Platform strategy<\u002Fsc-raw-td><sc-raw-td>Value-creating (early)<\u002Fsc-raw-td><sc-raw-td>85+ partners; structural optionality toward the network vision<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Founder low pay / high equity<\u002Fsc-raw-td><sc-raw-td>Value-creating<\u002Fsc-raw-td><sc-raw-td>Best-in-class management alignment<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<h3 id=\"v-24-volume-v-reconstruction-consolidated-conclusions\"><span class=\"num\">V.24<\u002Fspan><span>Volume V Reconstruction — Consolidated Conclusions<\u002Fspan><\u002Fh3>\n<p><strong>Ten Most Important Conclusions<\u002Fstrong><\u002Fp>\n<ol>\n<li>Wise wins today on a <strong>structural cost advantage<\u002Fstrong> (direct rails + netting + treasury + ~70% organic CAC), converted into price by a deliberate cost-plus policy.<\u002Fli>\n<li>The <strong>strongest moat is the integrated cost stack<\u002Fstrong>, not licences or \"network effects.\"<\u002Fli>\n<li><strong>Most overrated moat: licences and network effects<\u002Fstrong> — the OCC denial and multi-homing consumers expose their limits.<\u002Fli>\n<li><strong>Hardest to replicate:<\u002Fstrong> the organically-acquired ~19m customer base and the netting/liquidity depth that only volume creates.<\u002Fli>\n<li><strong>Easiest to replicate:<\u002Fstrong> the technology stack, individual licences, and individual bank relationships.<\u002Fli>\n<li><strong>Current bottleneck: compliance capacity and credibility<\u002Fstrong> — gating US expansion, the stablecoin ambition, and Platform trust.<\u002Fli>\n<li><strong>Greatest structural risk: the compliance-cost negative flywheel<\u002Fstrong>, intersecting with regulatory expansion denial.<\u002Fli>\n<li><strong>Most dangerous competitor: Revolut<\u002Fstrong> (scale plus profit pools to subsidise FX); <strong>Airwallex<\u002Fstrong> is most dangerous in B2B.<\u002Fli>\n<li><strong>New rails (Nexus/stablecoins) more likely strengthen than obsolete Wise<\u002Fstrong> — provided Wise adopts them; its moat is the wrapper, not the rails.<\u002Fli>\n<li><strong>Wise is becoming a global payments-infrastructure utility<\u002Fstrong> with a consumer/business account funding engine.<\u002Fli>\n<\u002Fol>\n<p><strong>Direct answers to the completion questions<\u002Fstrong><\u002Fp>\n<ul>\n<li><em>Why does Wise win today?<\u002Fem> Lowest structural cost, passed to customers as the lowest price, driving organic volume that lowers cost further — a self-reinforcing cost-and-acquisition flywheel.<\u002Fli>\n<li><em>Strongest moat component?<\u002Fem> The direct-rail + netting + treasury cost stack.<\u002Fli>\n<li><em>Most overrated moat?<\u002Fem> Licences and claimed network effects.<\u002Fli>\n<li><em>Hardest to replicate?<\u002Fem> The organically-acquired customer base and netting depth.<\u002Fli>\n<li><em>Easiest to replicate?<\u002Fem> Technology and purchasable licences/bank links.<\u002Fli>\n<li><em>Current bottleneck?<\u002Fem> Compliance credibility.<\u002Fli>\n<li><em>Single greatest structural risk?<\u002Fem> The AML-enforcement negative flywheel.<\u002Fli>\n<li><em>Most dangerous competitor?<\u002Fem> Revolut in consumer/account; Airwallex in B2B.<\u002Fli>\n<li><em>Could new rails make Wise obsolete, or would it benefit?<\u002Fem> Net benefit if adopted — the wrapper (licensing, compliance, treasury, distribution), not the rail itself, is the moat.<\u002Fli>\n<li><em>What is Wise ultimately becoming?<\u002Fem> A global financial/payments-infrastructure utility (network plus account) — not merely a consumer fintech or a remittance company.<\u002Fli>\n<\u002Ful>\n<p><strong>Key Unknowns<\u002Fstrong><\u002Fp>\n<ul>\n<li>Exact FY2026 per-executive single-figure remuneration (particularly for CFO Thomassin) — not retrievable from available sources; requires direct inspection of the FY2026 Form 20-F/UK Annual Report Compensation Report.<\u002Fli>\n<li>The ultimate outcome and any penalty from the Belgian criminal case against Wise Europe SA.<\u002Fli>\n<li>The timing and success probability of the GENIUS Act stablecoin-charter refiling, and whether a Fed master account would ultimately be granted.<\u002Fli>\n<li>Whether Project Nexus achieves meaningful scale beyond its APAC founding members by the ~2027 go-live, and whether Wise participates as a connected institution.<\u002Fli>\n<\u002Ful>\n<p><em>End of Volume V. The Cross-Volume Synthesis has not been started, per instruction.<\u002Fem><\u002Fp>\n<section class=\"part\" id=\"part-vi-cross-volume-synthesis\" data-break=\"page\"><div class=\"part-top\"><span>Part VI<\u002Fspan><span>The Wise Enterprise Reverse-Engineering Study<\u002Fspan><\u002Fdiv><div class=\"part-mid\"><div class=\"part-no\">06<\u002Fdiv><h1 class=\"part-title\">Cross-Volume Synthesis<\u002Fh1><p class=\"part-sub\">What the five volumes prove together that none of them proves alone.<\u002Fp><\u002Fdiv><div class=\"part-rule\"><\u002Fdiv><\u002Fsection>\n<p><em>This section is new. It exists only in the master edition and draws on all five volumes.<\u002Fem><\u002Fp>\n<h2 id=\"vi-1-the-unified-thesis\">VI.1 The unified thesis<\u002Fh2>\n<p>Read individually, the five volumes describe five different companies: a licensed multi-entity financial group, a consumer money-transfer app, a microservices platform, a rate-geared balance-sheet business, and a price-led competitor. Read together, they describe one thing.<\u002Fp>\n<p><strong>Wise rebuilt the settlement layer for retail cross-border payments, and then wrapped licensing, compliance, treasury and distribution around it.<\u002Fstrong> Everything else — the app, the card, the multi-currency account, the interest income, even Wise Platform — is either an input to that rebuild or a way of monetising it.<\u002Fp>\n<p>The single most important sentence in the entire study is the one established in Volume II and confirmed by every subsequent volume: <strong>a Wise \"cross-border\" transfer is two synchronised domestic payments linked by an internal ledger entry.<\u002Fstrong> Money does not cross a border for the individual customer. It crosses in bulk, periodically, when treasury rebalances a depleted pool. Once that is understood, the licensing architecture (Part I), the direct-rail estate (Part II), the Treasury Ledger (Part III), the ~0.5% take rate (Part IV) and the cost-leadership strategy (Part V) all stop being separate facts and become consequences of one architectural choice made around 2011.<\u002Fp>\n<h2 id=\"vi-2-the-single-causal-model\">VI.2 The single causal model<\u002Fh2>\n<p>The five volumes collectively evidence one flywheel with two revenue cylinders.<\u002Fp>\n<p><strong>The cost engine (the primary loop):<\u002Fstrong><\u002Fp>\n<p>``<code> Local licences + direct payment-system membership   (Part I) ↓ Two synchronised domestic legs + internal netting    (Part II) ↓ Real-time double-entry Treasury Ledger + automation  (Part III) ↓ Falling unit cost per transaction ↓ Deliberate price cut: take rate 0.73% → 0.51%        (Part IV) ↓ Customers tell other customers (~70% organic)        (Part V) ↓ More volume → deeper netting → lower unit cost  ⟲ <\u002Fcode>``<\u002Fp>\n<p><strong>The balance engine (the secondary loop, switched on by rates in FY2023):<\u002Fstrong><\u002Fp>\n<p>``<code> More volume → more customers hold balances ↓ Customer holdings $39.0bn (FY2026) ↓ Net interest income + card interchange ↓ Funds further price cuts on the primary loop  ⟲ <\u002Fcode>``<\u002Fp>\n<p>The second loop is why roughly half of net revenue is now non-cross-border. It is also, as Volume IV establishes, the lower-quality half: rate-driven, regulatory-contingent, and not durable.<\u002Fp>\n<h2 id=\"vi-3-what-the-volumes-prove-together-that-none-proves-alone\">VI.3 What the volumes prove together that none proves alone<\u002Fh2>\n<p><strong>1. The moat is a stack, and the binding agent is demand, not infrastructure.<\u002Fstrong><\u002Fp>\n<p>Volume I catalogues 70+ licences. Volume II catalogues 8+ direct rails. Volume III catalogues the ledger and the netting engine. Read separately, each looks like the moat. Read together with Volume V's replication test, the conclusion inverts: <strong>licences, rails and technology are all purchasable with enough time and capital. What is not purchasable is the ~19m organically-acquired customer base and the corridor liquidity depth that only volume creates.<\u002Fstrong> A well-funded rival could buy every input and still face £5–10bn of customer acquisition cost to reach the volume at which netting makes the cost model work. The moat is the demand, and the infrastructure is what converts demand into a cost advantage.<\u002Fp>\n<p>This reframes the conventional read. Licences are the entry ticket, not the moat — a point the OCC proved in July 2026 by denying Wise a charter <em>despite<\u002Fem> its 70+ existing licences.<\u002Fp>\n<p><strong>2. Reported profitability is being misread, and Wise says so itself.<\u002Fstrong><\u002Fp>\n<p>Volume IV's most consequential finding is not a number but a mechanism. Wise retains the first 1% of yield on customer balances; above 1%, the framework intends to retain 20% and return 80% to customers. It cannot actually return the full 80% — mainly because UK regulation prevents paying interest on e-money balances, and US customers must opt in. The unreturned portion <strong>accrues to profit by accident<\u002Fstrong>.<\u002Fp>\n<p>The consequence: the FY2026 income-before-tax margin of 26.4% is not the structural margin. The durable figure is the <strong>15–20%<\u002Fstrong> Wise itself guides to. The ~6–10 point gap is a regulatory accident that will close as Wise resolves the barriers — which means margin compression is the <em>success<\u002Fem> case, not the failure case. Any reader treating 26% as the run-rate has misunderstood the business.<\u002Fp>\n<p><strong>3. The binding constraint flipped in 2024, and it flipped onto the growth path.<\u002Fstrong><\u002Fp>\n<p>Through roughly 2023, Wise's constraint was infrastructural: get the licence, build the rail, connect the scheme. Volume III and Volume V establish that the constraint is now <strong>compliance credibility<\u002Fstrong> — and that this constraint gates not just remediation but the next strategic move:<\u002Fp>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Event<\u002Fsc-raw-th><sc-raw-th>Date<\u002Fsc-raw-th><sc-raw-th>What it blocked<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>FCA fine of CEO Käärmann (£350,000)<\u002Fsc-raw-td><sc-raw-td>28 Oct 2024<\u002Fsc-raw-td><sc-raw-td>Governance credibility<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>CFPB consent order (reduced to $45,000 + ~$450k redress)<\u002Fsc-raw-td><sc-raw-td>2025<\u002Fsc-raw-td><sc-raw-td>Conduct remediation<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>US six-state AML consent order ($4.2m)<\u002Fsc-raw-td><sc-raw-td>9 Jul 2025<\u002Fsc-raw-td><sc-raw-td>SAR lookback; 2 years of quarterly reporting<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Belgian criminal AML investigation (~€500m)<\u002Fsc-raw-td><sc-raw-td>disclosed 1 Jun 2026<\u002Fsc-raw-td><sc-raw-td>EEA entity exposure; ~20% intraday share fall<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>OCC denial of national trust bank charter<\u002Fsc-raw-td><sc-raw-td>Jul 2026<\u002Fsc-raw-td><sc-raw-td><strong>Direct US rails — the single largest remaining cost opportunity<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p>The OCC denial is the crux. Wise's remaining large cost inefficiency is the US, where it still reaches rails indirectly through Community Federal Savings Bank. The charter was the fix. The charter was denied on AML grounds. <strong>Compliance failure is therefore not a side-issue; it is directly capping the cost engine that is the entire thesis.<\u002Fstrong><\u002Fp>\n<h2 id=\"vi-4-the-central-tension\">VI.4 The central tension<\u002Fh2>\n<p>The culture that built the cost advantage is the culture that produced the compliance failures.<\u002Fp>\n<p>Volume III documents autonomous squads, weak code ownership, no dedicated manual QA, 120+ deploys a day. Volume V documents relentless price cuts, ~70% organic growth and an owner-operator CEO on a ~£200k salary. That combination of speed and alignment is precisely what produced a cost base no incumbent could match.<\u002Fp>\n<p>It is also, on the regulators' own findings, what produced late SAR filings, transaction-monitoring data-integrity failures and inadequate independent AML review. Autonomy optimised for velocity collides with financial-crime control, which is inherently centralising and veto-bearing.<\u002Fp>\n<p><strong>Wise's defining management problem for the next three years is to re-centralise control without killing the engine that made it cheap.<\u002Fstrong> The evidence that it knows this: a Group Chief Compliance Officer hired from Credit Suisse/Goldman in November 2025, FinCrime compliance managers embedded inside product squads, and a claimed third of global staff working on financial crime. The evidence that it is unresolved: the OCC denial in July 2026 and an active Belgian criminal file.<\u002Fp>\n<h2 id=\"vi-5-what-would-falsify-the-thesis\">VI.5 What would falsify the thesis<\u002Fh2>\n<p>Specific, checkable markers — stated so this study can be audited against reality rather than re-narrated:<\u002Fp>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>If this happens<\u002Fsc-raw-th><sc-raw-th>The thesis weakens because<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Take rate falls below ~0.45% <em>without<\u002Fem> a volume acceleration<\u002Fsc-raw-td><sc-raw-td>Price cuts have stopped buying growth; the flywheel has become value destruction<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Organic acquisition share falls materially below ~70%<\u002Fsc-raw-td><sc-raw-td>The near-zero-CAC advantage — the least replicable component — is eroding<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Belgian case results in a criminal conviction or a licence condition on Wise Europe SA<\u002Fsc-raw-td><sc-raw-td>EEA passporting, the second-most-important permission, is impaired<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>A second charter/permission denial after remediation<\u002Fsc-raw-td><sc-raw-td>Compliance is a structural, not fixable, ceiling<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Platform stalls below ~7% of volume by FY2028<\u002Fsc-raw-td><sc-raw-td>The infrastructure identity is aspiration, not trajectory<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Net interest income falls without transaction revenue closing the gap<\u002Fsc-raw-td><sc-raw-td>The balance engine was load-bearing, not supplementary<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<h2 id=\"vi-6-what-wise-is-becoming\">VI.6 What Wise is becoming<\u002Fh2>\n<p>Ranked by probability, on the evidence assembled:<\u002Fp>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Hypothesis<\u002Fsc-raw-th><sc-raw-th>Probability<\u002Fsc-raw-th><sc-raw-th>Strongest evidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>International payments network / global financial utility<\u002Fsc-raw-td><sc-raw-td>~45%<\u002Fsc-raw-td><sc-raw-td>Platform &gt;50% long-term vision; 8+ direct rails; cost-plus infrastructure economics<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>B2B financial infrastructure<\u002Fsc-raw-td><sc-raw-td>~25%<\u002Fsc-raw-td><sc-raw-td>Platform + Business converging; 85+ partners; competes with Airwallex, Corpay<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Global multi-currency account<\u002Fsc-raw-td><sc-raw-td>~20%<\u002Fsc-raw-td><sc-raw-td>~half of net revenue now non-cross-border; $39bn holdings; $43.6bn card spend<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Remittance / FX company<\u002Fsc-raw-td><sc-raw-td>~10%<\u002Fsc-raw-td><sc-raw-td>Still the cash engine, but not the direction of travel<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Synthesis:<\u002Fstrong> a global payments-infrastructure utility with a consumer and business account front-end that funds it. The account is the customer-acquisition and balance-gathering layer; the network is the asset.<\u002Fp>\n<h2 id=\"vi-7-implications-for-a-multi-jurisdictional-fintech-build\">VI.7 Implications for a multi-jurisdictional fintech build<\u002Fh2>\n<p><em>This section applies the study to the reader's own context rather than to Wise. It is analytical inference throughout.<\u002Fem><\u002Fp>\n<p><strong>On sequencing licences.<\u002Fstrong> Wise built UK EMI first, then Belgium for EEA passporting after Brexit forced the split. A build starting from a Lithuanian EMI has the EEA leg first and faces the mirror-image problem: the UK is a separate authorisation, not a passport, and the FCA's post-2023 safeguarding regime is materially more demanding than when Wise was authorised. Budget the UK EMI as a full second application, not an extension.<\u002Fp>\n<p><strong>On sponsor-bank dependency — the single most transferable lesson.<\u002Fstrong> Wise, at $243.5bn of annual volume, fifteen years old, with 70+ licences and BBB investment-grade ratings, <strong>still cannot get its own US rails.<\u002Fstrong> The OCC denied it in July 2026. If Wise cannot clear that bar, no earlier-stage entrant should model sponsor-bank independence into its plan at all. Architect for sponsor <em>substitutability<\u002Fem> from day one: dual-sponsor from launch if the economics tolerate it, contractual portability of the BIN and ledger, and no product feature that only one sponsor can support. The post-Synapse environment makes this a survival question, not an optimisation.<\u002Fp>\n<p><strong>On Nigeria.<\u002Fstrong> Wise's NGN history is the most instructive available case study, precisely because Wise kept failing at it: naira payouts launched 2015, suspended 2016, resumed 2017, suspended 2020, USD-to-Nigeria suspended 2022, resumed 2024 only after the CBN's January 2024 directive requiring remittances be paid in naira. Even now NGN is <strong>payout-only<\u002Fstrong> — not a send currency, not a balance currency, no card. The binding constraints were FX scarcity and regulatory reversal, not technology. Any Nigeria phase should assume the corridor will be suspended at least once and should be architected so that a suspension degrades one corridor rather than breaking the product.<\u002Fp>\n<p><strong>On safeguarding as a financing problem.<\u002Fstrong> Volume IV surfaces the most under-appreciated piece of financial engineering in the study: Wise's <strong>Safeguarding via Comparable Guarantees<\u002Fstrong>, expanded to £845.0m / $1,119.1m backed by investment-grade insurance sureties. Under FCA rules an authorised insurer's guarantee can substitute for holding secure liquid assets — which converts trapped safeguarding cash into deployable operational liquidity. This is only relevant once balances are material, but it is worth knowing it exists before designing the treasury model, because it changes the answer to \"how much working capital does the balance book consume.\"<\u002Fp>\n<p><strong>On price.<\u002Fstrong> Wise's ~0.5% take rate is survivable only because of direct rails plus netting at $243.5bn of volume. It is a <em>consequence<\u002Fem> of scale, not a strategy available to a new entrant. Competing with Wise on headline price without Wise's cost base is a route to funding customers' transfers out of equity. Compete on segment, corridor depth, UX, or a use case Wise underserves — not on the number.<\u002Fp>\n<p><strong>On the compliance budget.<\u002Fstrong> Wise states around a third of its global team works on financial crime, and it still drew four enforcement actions in two years. Treat financial-crime headcount as the cost line that scales closest to linearly with customers and jurisdictions — the one genuine diseconomy in an otherwise beautifully scaling model — and staff it ahead of growth rather than behind it. Wise's own experience is that the regulator arrives before the org chart catches up.<\u002Fp>\n<h2 id=\"vi-8-ten-cross-volume-conclusions\">VI.8 Ten cross-volume conclusions<\u002Fh2>\n<ol>\n<li>Wise is a settlement-layer rebuild wrapped in licences, compliance, treasury and distribution — not a remittance company that scaled.<\u002Fli>\n<li>A cross-border transfer is two domestic payments; money crosses borders only in periodic bulk rebalancing.<\u002Fli>\n<li>The moat is a stack, and its binding agent is the organically acquired customer base plus netting depth — the only components not purchasable.<\u002Fli>\n<li>Licences are the entry ticket, not the moat; the OCC denial proved accumulated licences guarantee nothing.<\u002Fli>\n<li>The 26.4% FY2026 margin is inflated by a regulatory accident; the durable structural margin is 15–20%.<\u002Fli>\n<li>Roughly half of net revenue is now non-cross-border — and it is the lower-quality, rate-driven half.<\u002Fli>\n<li>The binding constraint flipped from infrastructure to compliance credibility in 2024, and now gates the growth path itself.<\u002Fli>\n<li>The culture that produced the cost advantage produced the compliance failures; re-centralising control without killing velocity is the defining management problem.<\u002Fli>\n<li>Cheaper future rails — stablecoins, Nexus-style interoperability — more likely help Wise than kill it, because the moat is the wrapper, not the rail.<\u002Fli>\n<li>Wise is becoming a global payments-infrastructure utility with an account business funding it.<\u002Fli>\n<\u002Fol>\n<section class=\"part\" id=\"appendix-a-canonical-figures-register\" data-break=\"page\"><div class=\"part-top\"><span>Appendix A<\u002Fspan><span>The Wise Enterprise Reverse-Engineering Study<\u002Fspan><\u002Fdiv><div class=\"part-mid\"><div class=\"part-no\">A<\u002Fdiv><h1 class=\"part-title\">Canonical Figures Register<\u002Fh1><p class=\"part-sub\">The single authoritative value for every material number in the study.<\u002Fp><\u002Fdiv><div class=\"part-rule\"><\u002Fdiv><\u002Fsection>\n<p><strong>Where any volume disagrees with this table, this table governs.<\u002Fstrong> Basis: FY2026 US GAAP / USD unless stated. FY ends 31 March. As of 8 August 2026.<\u002Fp>\n<h2 id=\"scale-and-customers\">Scale and customers<\u002Fh2>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Figure<\u002Fsc-raw-th><sc-raw-th>Canonical value<\u002Fsc-raw-th><sc-raw-th>Basis<\u002Fsc-raw-th><sc-raw-th>Note<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Active customers<\u002Fsc-raw-td><sc-raw-td><strong>18.9m<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><sc-raw-td>Wise's own release rounds to \"19 million\"; use 18.9m in tables<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Personal customers<\u002Fsc-raw-td><sc-raw-td>14.87m<\u002Fsc-raw-td><sc-raw-td>FY2025 IFRS<\u002Fsc-raw-td><sc-raw-td>FY2026 split not separately disclosed<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Business customers<\u002Fsc-raw-td><sc-raw-td>0.697m<\u002Fsc-raw-td><sc-raw-td>FY2025 IFRS<\u002Fsc-raw-td><sc-raw-td>FY2026 split not separately disclosed<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cross-border volume<\u002Fsc-raw-td><sc-raw-td><strong>$243.5bn<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><sc-raw-td>£145.2bn on the FY2025 IFRS base<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card spend<\u002Fsc-raw-td><sc-raw-td><strong>$43.6bn<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><sc-raw-td>Some Wise materials round to $44bn<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Customer holdings<\u002Fsc-raw-td><sc-raw-td><strong>$39.0bn<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><sc-raw-td>$30.0bn on balance sheet + ~$9bn Wise Assets<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Transactions per day<\u002Fsc-raw-td><sc-raw-td>~4.7m<\u002Fsc-raw-td><sc-raw-td>2026<\u002Fsc-raw-td><sc-raw-td>Third-party (American Banker)<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<h2 id=\"financials\">Financials<\u002Fh2>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Figure<\u002Fsc-raw-th><sc-raw-th>Canonical value<\u002Fsc-raw-th><sc-raw-th>Basis<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Net revenue<\u002Fsc-raw-td><sc-raw-td><strong>$2,502.8m<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>FY2026 US GAAP<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Transaction revenue<\u002Fsc-raw-td><sc-raw-td>$1,893.6m<\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>— Cross-border<\u002Fsc-raw-td><sc-raw-td>$1,257m<\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>— Card<\u002Fsc-raw-td><sc-raw-td>$392m<\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>— Other<\u002Fsc-raw-td><sc-raw-td>$245m<\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Interest income on customer balances (gross)<\u002Fsc-raw-td><sc-raw-td>$806.1m<\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Interest paid to customers<\u002Fsc-raw-td><sc-raw-td>$196.9m<\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Income before tax<\u002Fsc-raw-td><sc-raw-td><strong>$660.4m (26.4% margin)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Net income<\u002Fsc-raw-td><sc-raw-td>$498.7m<\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Total assets<\u002Fsc-raw-td><sc-raw-td>$33,259.8m<\u002Fsc-raw-td><sc-raw-td>31 Mar 2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Shareholders' equity<\u002Fsc-raw-td><sc-raw-td>$1,925.2m<\u002Fsc-raw-td><sc-raw-td>31 Mar 2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Underlying free cash flow<\u002Fsc-raw-td><sc-raw-td>£332.7m (117.9% conversion)<\u002Fsc-raw-td><sc-raw-td>FY2025 IFRS<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Rate sensitivity<\u002Fsc-raw-td><sc-raw-td>~$40m of IBT per 25bp<\u002Fsc-raw-td><sc-raw-td>H1 FY2026 balances<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<h2 id=\"take-rate\">Take rate<\u002Fh2>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Period<\u002Fsc-raw-th><sc-raw-th>Take rate<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>FY2020<\u002Fsc-raw-td><sc-raw-td>~0.73%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2021<\u002Fsc-raw-td><sc-raw-td>0.70%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2022<\u002Fsc-raw-td><sc-raw-td>0.63%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2023<\u002Fsc-raw-td><sc-raw-td>~0.69%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2024<\u002Fsc-raw-td><sc-raw-td>0.67%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2025 (avg)<\u002Fsc-raw-td><sc-raw-td>0.58%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Q4 FY2025<\u002Fsc-raw-td><sc-raw-td>0.53%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>FY2026 (avg)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>0.52%<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Q4 FY2026<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><strong>0.51%<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Personal Q4 FY2026<\u002Fsc-raw-td><sc-raw-td>0.56%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Business Q4 FY2026<\u002Fsc-raw-td><sc-raw-td>0.39%<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<h2 id=\"regulatory-and-structural\">Regulatory and structural<\u002Fh2>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Figure<\u002Fsc-raw-th><sc-raw-th>Canonical value<\u002Fsc-raw-th><sc-raw-th>Note<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Licences held<\u002Fsc-raw-td><sc-raw-td>70+<\u002Fsc-raw-td><sc-raw-td>Wise statement, FY2025<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Direct payment-system connections<\u002Fsc-raw-td><sc-raw-td><strong>8 live<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Philippines InstaPay was the sixth (FY2025); Brazil Pix and Japan Zengin took it to eight<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Own funds requirement<\u002Fsc-raw-td><sc-raw-td>£293,376k<\u002Fsc-raw-td><sc-raw-td>FY2026; Fixed Overheads Requirement binding<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Eligible CET1 capital<\u002Fsc-raw-td><sc-raw-td>£1,409,993k<\u002Fsc-raw-td><sc-raw-td>FY2026; ~481% surplus<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Safeguarding via Comparable Guarantees<\u002Fsc-raw-td><sc-raw-td>£845.0m / $1,119.1m<\u002Fsc-raw-td><sc-raw-td>31 Mar 2026; investment-grade insurance sureties<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Employee Share Trust purchases<\u002Fsc-raw-td><sc-raw-td>~$470m / 35.9m shares<\u002Fsc-raw-td><sc-raw-td>FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Share buyback<\u002Fsc-raw-td><sc-raw-td>up to £405m<\u002Fsc-raw-td><sc-raw-td>Announced 26 Jun 2026; executing 21 Jul 2026 – 31 Mar 2027<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Credit rating<\u002Fsc-raw-td><sc-raw-td>BBB stable (S&amp;P and Fitch)<\u002Fsc-raw-td><sc-raw-td>Published 3 Apr 2025<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<section class=\"part\" id=\"appendix-b-reconciliation-of-cross-volume-discrepancies\" data-break=\"page\"><div class=\"part-top\"><span>Appendix B<\u002Fspan><span>The Wise Enterprise Reverse-Engineering Study<\u002Fspan><\u002Fdiv><div class=\"part-mid\"><div class=\"part-no\">B<\u002Fdiv><h1 class=\"part-title\">Reconciliation of Cross-Volume Discrepancies<\u002Fh1><p class=\"part-sub\">Where the volumes disagree, and which figure governs.<\u002Fp><\u002Fdiv><div class=\"part-rule\"><\u002Fdiv><\u002Fsection>\n<p>The volumes were written sequentially against a moving evidence base. The following differences are real and are resolved here rather than silently smoothed.<\u002Fp>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>#<\u002Fsc-raw-th><sc-raw-th>Item<\u002Fsc-raw-th><sc-raw-th>Appears as<\u002Fsc-raw-th><sc-raw-th>Resolution<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>Active customers<\u002Fsc-raw-td><sc-raw-td>\"19m\" (Vols II, III) vs \"18.9m\" (Vols IV, V)<\u002Fsc-raw-td><sc-raw-td><strong>18.9m.<\u002Fstrong> Wise's release rounds up; the precise figure governs in tables.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>Card spend<\u002Fsc-raw-td><sc-raw-td>\"$44bn\" (Vol II) vs \"$43.6bn\" (Vols IV, V)<\u002Fsc-raw-td><sc-raw-td><strong>$43.6bn.<\u002Fstrong> Rounding only.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>Direct rail connections<\u002Fsc-raw-td><sc-raw-td>\"sixth direct integration\" (Vol I, FY2025 language) vs \"8+\" (Vols II, III)<\u002Fsc-raw-td><sc-raw-td><strong>8 live.<\u002Fstrong> The \"sixth\" was Philippines InstaPay at FY2025; Pix and Zengin brought it to eight once live. Both statements are true at their respective dates.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>Headcount<\u002Fsc-raw-td><sc-raw-td>6,151 monthly average / &gt;6,500 at 31 Mar 2025 (Vols III, IV) vs ~10,332 (third-party tracker, Vol III)<\u002Fsc-raw-td><sc-raw-td><strong>6,151 monthly average FY2025<\u002Fstrong> is the audited figure. The tracker gap is unreconciled and most plausibly reflects contractors and outsourced servicing — labelled UNKNOWN, not resolved.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>Wise plc registration number<\u002Fsc-raw-td><sc-raw-td>07209813 vs 13211214 (Vol I)<\u002Fsc-raw-td><sc-raw-td><strong>07209813 is Wise Payments Limited<\u002Fstrong>, the operating EMI. The listed holding company was a separate England &amp; Wales entity (13211214, originally \"456 Newco plc\"). The group MIFIDPRU footer conflates them.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>Currency basis<\u002Fsc-raw-td><sc-raw-td>£ figures (Vols I–III) vs $ figures (Vols IV–V)<\u002Fsc-raw-td><sc-raw-td>Not an error. FY2021–25 IFRS/GBP; FY2026 US GAAP/USD. <strong>Never spliced.<\u002Fstrong> See front matter.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td>\"Underlying\" measures<\u002Fsc-raw-td><sc-raw-td>Used in Vols I–IV, absent in FY2026<\u002Fsc-raw-td><sc-raw-td>The underlying income / underlying PBT APMs were discontinued at the US GAAP transition. The same economics reappear as the gap between the 15–20% target margin and the 20–25% reported range.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td>Interest income framing<\u002Fsc-raw-td><sc-raw-td>\"first 1% / above 1%\" (IFRS) vs \"net interest income\" (US GAAP)<\u002Fsc-raw-td><sc-raw-td>Same mechanism, different presentation. Appendix A carries the US GAAP figures.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td>CFPB penalty<\u002Fsc-raw-td><sc-raw-td>\"$2m originally\" vs \"$45,000\"<\u002Fsc-raw-td><sc-raw-td>Both correct: originally $2m, <strong>amended down to $45,000<\u002Fstrong> plus ~$450k redress.<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>10<\u002Fsc-raw-td><sc-raw-td>Platform share of volume<\u002Fsc-raw-td><sc-raw-td>\"4%\" (FY2025) vs \"~5%\" (H1 FY2026)<\u002Fsc-raw-td><sc-raw-td>Both correct at their dates; <strong>~5%<\u002Fstrong> is current. Targets: ~10% medium-term, &gt;50% long-term vision.<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<h2 id=\"known-unknowns-carried-forward\">Known unknowns carried forward<\u002Fh2>\n<p>These were not resolvable from public evidence and are recorded rather than guessed:<\u002Fp>\n<ul>\n<li>FY2026 per-executive single-figure remuneration (particularly the CFO).<\u002Fli>\n<li>Wise Group plc's Jersey registration number.<\u002Fli>\n<li>Internal chart-of-accounts and ledger schema; reconciliation break-handling.<\u002Fli>\n<li>Current KYC and sanctions-screening vendor stack (build vs buy split).<\u002Fli>\n<li>Published SLOs, availability targets and major-incident history.<\u002Fli>\n<li>Per-corridor economics, internal match rates, and the Wise Platform take rate.<\u002Fli>\n<li>Disclosed fraud-loss figures.<\u002Fli>\n<li>Outcome of the Belgian criminal investigation into Wise Europe SA.<\u002Fli>\n<li>Whether a GENIUS Act stablecoin refiling succeeds, and whether a Fed master account follows.<\u002Fli>\n<\u002Ful>\n<section class=\"part\" id=\"appendix-c-source-hierarchy-evidence-conventions\" data-break=\"page\"><div class=\"part-top\"><span>Appendix C<\u002Fspan><span>The Wise Enterprise Reverse-Engineering Study<\u002Fspan><\u002Fdiv><div class=\"part-mid\"><div class=\"part-no\">C<\u002Fdiv><h1 class=\"part-title\">Source Hierarchy &amp; Evidence Conventions<\u002Fh1><p class=\"part-sub\">How claims were graded, and the source hierarchy behind them.<\u002Fp><\u002Fdiv><div class=\"part-rule\"><\u002Fdiv><\u002Fsection>\n<p>Sources were prioritised in the following order, and primary evidence was preferred wherever it existed:<\u002Fp>\n<ol>\n<li>Wise annual reports and regulatory filings (including MIFIDPRU 8 disclosures)<\u002Fli>\n<li>SEC filings (Form 20-F, 6-K) and LSE RNS announcements<\u002Fli>\n<li>Investor presentations, earnings releases and call transcripts<\u002Fli>\n<li>Wise customer agreements, pricing disclosures and product documentation<\u002Fli>\n<li>Wise engineering publications, API/Platform documentation, job descriptions and open-source repositories<\u002Fli>\n<li>Regulators and central banks — FCA, National Bank of Belgium, Bank of England, OCC, CFPB, FinCEN and US state regulators, MAS, APRA/ASIC/AUSTRAC, RBI, Central Bank of Brazil, Japan FSA<\u002Fli>\n<li>Corporate registries, court records and official legal documents<\u002Fli>\n<li>Reputable academic research and financial journalism<\u002Fli>\n<li>Specialist payments publications<\u002Fli>\n<\u002Fol>\n<p>SEO-oriented fintech blogs, comparison sites and affiliate content were not relied on where primary evidence existed. For strategically significant claims, sources were triangulated. Where reputable sources disagreed, the disagreement is identified, dates compared, and uncertainty preserved rather than resolved by false precision.<\u002Fp>\n<p><em>End of the Wise Enterprise Reverse-Engineering Study.<\u002Fem><\u002Fp>\n\n<\u002Fdiv>\n<\u002Fdoc-page>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;bodyScale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:100,&quot;min&quot;:88,&quot;max&quot;:116,&quot;step&quot;:2,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Reading&quot;},&quot;showEvidenceLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Reading&quot;},&quot;dividerPages&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Reading&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() { this.apply(); requestAnimationFrame(() => this.paginate()); }\n  componentDidUpdate() { this.apply(); requestAnimationFrame(() => this.paginate()); }\n\n  apply() {\n    const b = document.querySelector('.doc-body');\n    if (!b) return;\n    b.style.setProperty('--doc-scale', String((this.props.bodyScale ?? 100) / 100));\n    b.classList.toggle('hide-ev', this.props.showEvidenceLabels === false);\n    b.classList.toggle('flat', this.props.dividerPages === false);\n    const cv = document.getElementById('cover');\n    if (cv) cv.dataset.field = ({ 'Deep steel': 'deep', 'Steel': 'steel', 'Graphite': 'graphite', 'Paper': 'paper' })[this.props.coverField] || 'deep';\n\n\n  }\n\n  paginate() {\n    const b = document.querySelector('.doc-body');\n    if (!b) return;\n    const probe = document.createElement('div');\n    probe.style.cssText = 'position:absolute;visibility:hidden;height:100mm;width:1px';\n    b.appendChild(probe);\n    const mm = probe.getBoundingClientRect().height / 100;\n    probe.remove();\n    if (!mm) return;\n    const usable = 297 * mm - 2 * 0.8 * 96 - 56; // A4 less margins less running header/footer\n    const pageOf = {};\n    let page = 1, y = 0;\n    for (const el of b.children) {\n      const cs = getComputedStyle(el);\n      const forced = el.dataset.break === 'page' || cs.breakBefore === 'page';\n      if (forced && y > 0) { page++; y = 0; }\n      if (el.id) pageOf[el.id] = page;\n      el.querySelectorAll('[id]').forEach(n => { if (!(n.id in pageOf)) pageOf[n.id] = page; });\n      if (el.classList.contains('part')) { page++; y = 0; continue; } // full-bleed: exactly one page\n      y += el.getBoundingClientRect().height + parseFloat(cs.marginBottom || 0);\n      while (y > usable) { y -= usable; page++; }\n    }\n    document.querySelectorAll('[data-pageno]').forEach(n => {\n      const p = pageOf[n.dataset.pageno];\n      if (p) n.textContent = String(p);\n    });\n  }\n\n  renderVals() { return {}; }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
