>, <strong>Spark on EMR<\u002Fstrong>, SageMaker <strong>Feature Store<\u002Fstrong>, <strong>MLflow<\u002Fstrong>, in-house prediction service on <strong>Ray Serve<\u002Fstrong>; LLM gateway to <strong>Anthropic (Claude), AWS Bedrock, Google Gemini, OpenAI<\u002Fstrong> + custom <strong>RAG<\u002Fstrong> <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<\u002Ful>\n<h3 id=\"iii-5-build-vs-buy\"><span class=\"num\">III.5<\u002Fspan><span>Build vs Buy<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>System<\u002Fsc-raw-th><sc-raw-th>Approach<\u002Fsc-raw-th><sc-raw-th>Rationale<\u002Fsc-raw-th><sc-raw-th>Lock-in/risk<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Payment routing / scheme connectivity<\u002Fsc-raw-td><sc-raw-td><strong>Build<\u002Fstrong> + direct membership<\u002Fsc-raw-td><sc-raw-td>Cost, speed, regulatory control, moat<\u002Fsc-raw-td><sc-raw-td>High (the point)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Ledger (product + treasury)<\u002Fsc-raw-td><sc-raw-td><strong>Build<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Real-time correctness, FX/liquidity feed<\u002Fsc-raw-td><sc-raw-td>Proprietary; deep moat<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FX / treasury execution<\u002Fsc-raw-td><sc-raw-td><strong>Build<\u002Fstrong> ledger + market counterparties<\u002Fsc-raw-td><sc-raw-td>Netting efficiency<\u002Fsc-raw-td><sc-raw-td>Execution counterparty risk<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Reconciliation<\u002Fsc-raw-td><sc-raw-td><strong>Build<\u002Fstrong> tooling + human ops<\u002Fsc-raw-td><sc-raw-td>Safeguarding integrity<\u002Fsc-raw-td><sc-raw-td>Enforcement risk if weak<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card processing<\u002Fsc-raw-td><sc-raw-td><strong>Build<\u002Fstrong> (cloud-first AWS/Kubernetes, Mastercard connector)<\u002Fsc-raw-td><sc-raw-td>World-first cloud card processing<\u002Fsc-raw-td><sc-raw-td>Scheme dependence<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Compliance/monitoring/fraud<\u002Fsc-raw-td><sc-raw-td><strong>Build<\u002Fstrong> (in-house ML)<\u002Fsc-raw-td><sc-raw-td>Speed-vs-safety tuning<\u002Fsc-raw-td><sc-raw-td>Enforcement risk (§III.10)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Identity doc capture / KYC<\u002Fsc-raw-td><sc-raw-td><strong>Buy/blend<\u002Fstrong> (Onfido widely used; Wise runs hosted + API KYC)<\u002Fsc-raw-td><sc-raw-td>Commodity capture; decisioning is Wise's<\u002Fsc-raw-td><sc-raw-td>Vendor dependence <span class=\"ev\">INFERENCE<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>CRM / support desk<\u002Fsc-raw-td><sc-raw-td><strong>Buy<\u002Fstrong> (Zendesk)<\u002Fsc-raw-td><sc-raw-td>Commodity<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Data infra<\u002Fsc-raw-td><sc-raw-td><strong>Buy managed + build glue<\u002Fstrong> (RDS/Snowflake/Atlas/SageMaker)<\u002Fsc-raw-td><sc-raw-td>Reduce toil<\u002Fsc-raw-td><sc-raw-td>Concentration<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cloud<\u002Fsc-raw-td><sc-raw-td><strong>Buy<\u002Fstrong> (AWS)<\u002Fsc-raw-td><sc-raw-td>Elasticity<\u002Fsc-raw-td><sc-raw-td>High concentration<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Observability<\u002Fsc-raw-td><sc-raw-td><strong>Buy OSS/managed + self-run<\u002Fstrong> (LGTM)<\u002Fsc-raw-td><sc-raw-td>Cost/control<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>CI/CD<\u002Fsc-raw-td><sc-raw-td><strong>Buy + glue<\u002Fstrong> (GitHub Actions/Spinnaker)<\u002Fsc-raw-td><sc-raw-td>Velocity<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Security testing<\u002Fsc-raw-td><sc-raw-td><strong>Buy<\u002Fstrong> (Bugcrowd)<\u002Fsc-raw-td><sc-raw-td>Continuous real-world testing<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p>Coherent doctrine: <strong>build where correctness, speed, cost-at-scale or regulatory control matter; buy commodity.<\u002Fstrong> The KYC-vendor attribution is <span class=\"ev\">INFERENCE<\u002Fspan> — Wise runs both hosted and API KYC flows but has not published its current document-capture vendor list.<\u002Fp>\n<h3 id=\"iii-6-payment-infrastructure-software\"><span class=\"num\">III.6<\u002Fspan><span>Payment Infrastructure Software<\u002Fspan><\u002Fh3>\n<ul>\n<li><strong>Idempotency <span class=\"ev\">CONFIRMED<\u002Fspan>:<\u002Fstrong> create-transfer uses <code>customerTransactionId<\u002Fcode>; balance conversions and card orders use an <code>X-idempotence-uuid<\u002Fcode> header — the documented duplicate-prevention mechanism at the API boundary.<\u002Fli>\n<li><strong>State machine <span class=\"ev\">CONFIRMED<\u002Fspan>:<\u002Fstrong> explicit lifecycle with rollback transitions; events reconciled by <code>occurred_at<\u002Fcode> because ordering is not guaranteed (consistent with Kafka event-driven design).<\u002Fli>\n<li><strong>Routing / rail selection <span class=\"ev\">INFERENCE<\u002Fspan>:<\u002Fstrong> direct-scheme-vs-partner-bank logic is Wise-controlled; the specific routing engine is undocumented.<\u002Fli>\n<li><strong>Retries <span class=\"ev\">CONFIRMED pattern<\u002Fspan>:<\u002Fstrong> event-driven Kafka with idempotent consumers; interview material stresses storing the key with a request hash so retries return the original result.<\u002Fli>\n<li><strong>Settlement/treasury handoff, ledger entries, in-line compliance/fraud scoring (Ray Serve), webhooks <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fstrong><\u002Fli>\n<\u002Ful>\n<p><strong>Confirmed vs inferred boundary:<\u002Fstrong> the <em>existence and shape<\u002Fem> of the state machine, idempotency mechanism, and event-reconciliation-by-timestamp are confirmed; the <em>internal orchestration engine<\u002Fem> (saga/orchestrator vs Kafka choreography) is <span class=\"ev ev-soft\">HYPOTHESIS<\u002Fspan> — a StatefulJ-style FSM is documented at Airbnb, not confirmed at Wise.<\u002Fp>\n<h3 id=\"iii-7-ledger-architecture\"><span class=\"num\">III.7<\u002Fspan><span>Ledger Architecture<\u002Fspan><\u002Fh3>\n<p><span class=\"ev\">CONFIRMED<\u002Fspan>: a <strong>real-time double-entry Treasury Ledger<\u002Fstrong>; <strong>event-driven<\u002Fstrong> with <strong>complete history in compacted Kafka topics<\u002Fstrong> (enabling recomputation of aggregations); reconciliation links internal balances to external bank statements via a dedicated Recon function.<\u002Fp>\n<p>Conceptual separation (partly <span class=\"ev\">INFERENCE<\u002Fspan>): customer-facing balance · product ledger (Spend/Assets/Business/Platform) · payment state (the transfer FSM) · treasury balances (real-time per entity) · bank-account records (safeguarding banks, BoE) · safeguarding records · reconciliation state · general ledger (US GAAP/USD from FY2026).<\u002Fp>\n<p>Prompt questions answered: double-entry — <strong>yes<\u002Fstrong> for the Treasury Ledger <span class=\"ev\">CONFIRMED<\u002Fspan>; multi-currency per pool <span class=\"ev\">INFERENCE<\u002Fspan>; pending-vs-settled modelled via the FSM + <code>occurred_at<\u002Fcode> <span class=\"ev\">CONFIRMED<\u002Fspan>; reversals via rollback transitions and <code>funds_refunded<\u002Fcode>/<code>charged_back<\u002Fcode> <span class=\"ev\">CONFIRMED<\u002Fspan>; internal chart-of-accounts and fee-recognition schema <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan> (unpublished).<\u002Fp>\n<h3 id=\"iii-8-reconciliation-architecture\"><span class=\"num\">III.8<\u002Fspan><span>Reconciliation Architecture<\u002Fspan><\u002Fh3>\n<p>A <strong>first-class, staffed operational system<\u002Fstrong> (Tallinn, Austin) covering bank-account, payments/transactions, card, customer-balance, safeguarding, treasury and GL reconciliation, plus compensations reconciliation and audit coordination <span class=\"ev\">CONFIRMED, job descriptions<\u002Fspan>. Specialists \"investigate, resolve … and escalate discrepancies in a timely manner,\" build recon tooling with engineers, and run month-end close.<\u002Fp>\n<p><strong>Regulatory weight:<\u002Fstrong> the US multistate consent order cited \"transaction monitoring <strong>data integrity<\u002Fstrong> issues,\" and required Wise to \"institute a <strong>more robust program to ensure customer information is accurate, complete, valid, and properly reflected in regulatory reporting<\u002Fstrong>\" within 90 days, plus <strong>quarterly independent testing of transaction data to verify … internal controls and data integrity<\u002Fstrong> <span class=\"ev\">CONFIRMED, Mass.gov, 9 July 2025<\u002Fspan>. A reconciliation failure therefore threatens (a) safeguarding integrity, (b) regulatory-reporting accuracy, and (c) in extremis, licence conditions — the regulatory exposure exceeds the direct financial exposure.<\u002Fp>\n<h3 id=\"iii-9-data-architecture\"><span class=\"num\">III.9<\u002Fspan><span>Data Architecture<\u002Fspan><\u002Fh3>\n<p>Ingestion via CDC + in-house data-movement service; storage across RDS/Mongo/Redis (operational), Kafka (streaming/history), Snowflake + S3-Iceberg (analytical); transformation dbt + Airflow; query Trino; BI Looker/Superset; ML SageMaker/EMR/MLflow/Ray Serve [all CONFIRMED]. Wise built an automated <strong>data-inventory + governance portal<\u002Fstrong> (discovery of what data exists, who created it, its category) feeding deletion, privacy and compliance — a direct response to GDPR and the AML data-integrity findings <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fp>\n<p><strong>Genuine data flywheels (assessed):<\u002Fstrong><\u002Fp>\n<ol>\n<li><strong>Fraud/AML ML with volume<\u002Fstrong> — <span class=\"ev\">CONFIRMED direction<\u002Fspan> Wise's FDIC submission: ML \"uses <strong>over 110 data points<\u002Fstrong>, with each data point assigned a risk aspect.\" Real, but the enforcement cluster shows volume outran control quality — the flywheel is genuine yet not self-sufficient.<\u002Fli>\n<li><strong>Routing/liquidity netting<\u002Fstrong> — <span class=\"ev\">INFERENCE<\u002Fspan> more corridor flow → better netting/forecasting → lower FX cost.<\u002Fli>\n<li><strong>Pricing<\u002Fstrong> — <span class=\"ev\">INFERENCE<\u002Fspan> elasticity data supports price setting.<\u002Fli>\n<li><strong>Support automation<\u002Fstrong> — <span class=\"ev\">CONFIRMED<\u002Fspan> LLM QA agent trained on hundreds of cases; ~50% of chat handled by LLMs (FY2026).<\u002Fli>\n<\u002Fol>\n<p>Strongest, most durable flywheels: <strong>fraud/AML<\u002Fstrong> and <strong>matching/liquidity<\u002Fstrong>, because both compound with proprietary volume competitors cannot replicate.<\u002Fp>\n<h3 id=\"iii-10-fraud-and-financial-crime-technology\"><span class=\"num\">III.10<\u002Fspan><span>Fraud and Financial-Crime Technology<\u002Fspan><\u002Fh3>\n<p><strong>Architecture:<\u002Fstrong> in-house <strong>ML for both fraud and AML<\u002Fstrong>; FDIC submission — \"over 110 data points,\" an \"advanced <strong>Model Validation Team<\u002Fstrong>,\" a named <strong>MLRO<\u002Fstrong>, periodic external audits <span class=\"ev\">COMPANY CLAIM/CONFIRMED submission<\u002Fspan>. Onboarding blends hosted and API KYC/KYB, with vendor-assisted document capture <span class=\"ev\">INFERENCE<\u002Fspan>. High scores/rule hits route to human review; the consent-order remediation explicitly commits to \"ensure adequate levels of personnel and resources … to manage the amount and complexity of case alerts to ensure timely SAR filings\" <span class=\"ev\">CONFIRMED<\u002Fspan> — an admission that alert volume had outpaced human review capacity.<\u002Fp>\n<p><strong>The enforcement cluster (what the orders actually said):<\u002Fstrong><\u002Fp>\n<ul>\n<li><strong>US multistate consent order (9 July 2025, $4.2m, six states — California, Massachusetts, Minnesota, Nebraska, New York, Texas):<\u002Fstrong> based on a Jan–Feb 2024 exam covering Jul 2022–Sep 2023; Report of Examination (20 Aug 2024) cited failure to provide independent AML review at adequate frequency; <strong>failure to timely file SARs<\u002Fstrong>; <strong>transaction-monitoring data-integrity issues<\u002Fstrong>; <strong>failure to timely correct past deficiencies<\u002Fstrong>; and <strong>Remittance Transfer Rule<\u002Fstrong> violations. Remediation: updated AML/CFT program; <strong>SAR lookback on closed accounts 1 Mar 2023–1 Mar 2025<\u002Fstrong> (customers deactivated, &gt;$2,000 aggregate, no prior SAR); <strong>independent validation<\u002Fstrong> with quarterly testing; <strong>two years of quarterly progress reports<\u002Fstrong>; independent monitor <span class=\"ev\">CONFIRMED, Mass.gov; signed by Wise US President Harsh Sinha<\u002Fspan>.<\u002Fli>\n<li><strong>CFPB order (2025):<\u002Fstrong> originally penalised, later <strong>amended down to $45,000<\u002Fstrong> plus ~<strong>$450,000<\u002Fstrong> set aside as consumer redress <span class=\"ev\">CONFIRMED, Banking Dive<\u002Fspan>.<\u002Fli>\n<li><strong>OCC denial of national trust-bank charter (July 2026):<\u002Fstrong> the multistate AML action \"played a central role\"; the OCC concluded the application should not be reconsidered \"until Wise has addressed existing deficiencies and built a more robust enterprise-wide compliance program\" <span class=\"ev\">CONFIRMED<\u002Fspan>. Wise subsequently signalled a pivot toward a <strong>GENIUS Act stablecoin framework<\u002Fstrong> application [THIRD-PARTY].<\u002Fli>\n<li><strong>Belgian criminal AML investigation of Wise Europe SA (disclosed 1 June 2026):<\u002Fstrong> the Brussels Public Prosecutor's Office says the amount <strong>\"would exceed half a billion euros ($582.5m) in suspicious transactions,\"<\u002Fstrong> tied to hundreds of criminal files from \"more than 30 countries across Europe,\" with prosecutors \"finalising a direct summons before the criminal court\" <span class=\"ev\">CONFIRMED, per EPI/Yahoo Finance and TBIJ, 1 June 2026<\u002Fspan>. Wise's Belgian office handles EEA law-enforcement requests.<\u002Fli>\n<\u002Ful>\n<p><strong>Interpretation:<\u002Fstrong> the controls are technologically sophisticated (in-house ML, model validation) but the enforcement pattern reveals a <strong>speed-vs-safety tension<\u002Fstrong> — Wise's autonomy-and-velocity culture and instant-payment product created growth that outpaced control maturity, particularly in SAR timeliness and data integrity. <strong>Fraud-loss economics:<\u002Fstrong> card chargebacks can fall on Wise; APP scam losses are shaped by the UK reimbursement regime. Wise's specific disclosed fraud-loss figures are <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan> in the material gathered here and should be sourced from the 20-F risk section for a definitive number.<\u002Fp>\n<h3 id=\"iii-11-security-architecture\"><span class=\"num\">III.11<\u002Fspan><span>Security Architecture<\u002Fspan><\u002Fh3>\n<p><span class=\"ev\">CONFIRMED<\u002Fspan>: <strong>PCI-DSS<\u002Fstrong> is a first-order constraint shaping the card platform and Kubernetes controls; <strong>bug bounty via Bugcrowd<\u002Fstrong> (moved from traditional pen-testing to crowdsourced; a private program surfaced a \"P1 Business Critical\" vulnerability within 24 hours; CISO <strong>Shan Lee<\u002Fstrong>); <strong>SLSA<\u002Fstrong> supply-chain rollout; automated code/documentation quality gates as part of passing financial audits; <strong>OAuth<\u002Fstrong> on the public API; <strong>Envoy<\u002Fstrong> for controlled service-to-service traffic.<\u002Fp>\n<p><span class=\"ev ev-soft\">UNKNOWN<\u002Fspan>/<span class=\"ev ev-soft\">HYPOTHESIS<\u002Fspan>: key management (KMS vs HSM), secrets tooling, privileged-access management, and insider-threat controls are not publicly detailed and are not invented here.<\u002Fp>\n<p>Security failures map to (a) direct financial loss (fraud, card e-skimming — the explicit Bugcrowd rationale), (b) regulatory exposure (PCI, data protection), (c) customer trust (the core asset of a money mover), and (d) continuity. Security is treated as business-critical, not IT hygiene.<\u002Fp>\n<h3 id=\"iii-12-reliability-engineering\"><span class=\"num\">III.12<\u002Fspan><span>Reliability Engineering<\u002Fspan><\u002Fh3>\n<p><strong>Why the bar exceeds ordinary SaaS:<\u002Fstrong> a failed SaaS request is an inconvenience; a failed Wise operation can mean <strong>money moved but not recorded, recorded but not moved, or moved twice<\u002Fstrong>, and Faster Payments credits are <strong>irrevocable at initiation<\u002Fstrong>. Correctness and durability are financial and sometimes legally irreversible.<\u002Fp>\n<p><span class=\"ev\">CONFIRMED<\u002Fspan> practices: <strong>Automated Canary Analysis<\u002Fstrong> (Spinnaker); <strong>Kafka rack-awareness / standby replicas<\u002Fstrong> (Kafka Streams described as \"a critical component of Wise's money movement\"); DB HA via <strong>Patroni/Orchestrator<\u002Fstrong> and <strong>Temporal<\u002Fstrong>-automated switchovers reducing <strong>RDS maintenance downtime \"from 10 minutes to 100 milliseconds\"<\u002Fstrong>; <strong>Pod Topology Spread Constraints<\u002Fstrong> across AWS AZs (to avoid losing 2/3 of pods on an AZ failure); LGTM observability.<\u002Fp>\n<p>Hard-question answers: service fails after money moves but before state updates — event history in compacted Kafka topics + reconciliation-by-<code>occurred_at<\u002Fcode> allows state to be recomputed and residual breaks caught by the Recon function <span class=\"ev\">CONFIRMED pattern<\u002Fspan>; runbooks <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan>. Late bank settlement — the FSM holds the transfer in-transit; treasury forecasts absorb timing; recon matches on statement arrival <span class=\"ev\">INFERENCE<\u002Fspan>. Duplicate prevention — idempotency keys + idempotent consumers <span class=\"ev\">CONFIRMED<\u002Fspan>. **Known-incident catalogue and published SLOs/availability targets are <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan> from the gathered material and are not asserted.<\u002Fp>\n<h3 id=\"iii-13-infrastructure-resilience\"><span class=\"num\">III.13<\u002Fspan><span>Infrastructure Resilience<\u002Fspan><\u002Fh3>\n<p><strong>Concentration risks and single points of failure:<\u002Fstrong><\u002Fp>\n<ul>\n<li><strong>AWS concentration<\u002Fstrong> — near-total, with mitigations <em>within<\u002Fem> AWS (multi-AZ, Transit Gateway, Outposts) rather than multi-cloud; <strong>no public evidence of a multi-cloud posture<\u002Fstrong> <span class=\"ev\">CONFIRMED gap<\u002Fspan>. This is the most material single point of failure.<\u002Fli>\n<li><strong>Payment-scheme / bank dependencies<\u002Fstrong> — direct scheme membership reduces single-correspondent reliance, but each corridor depends on its scheme's availability and on named safeguarding banks (Barclays, Citibank N.A., JPMorgan Chase N.A., Deutsche Bank AG London, Hamburg Commercial Bank, Bank of America — from prior volumes) and, in the US, partner bank CFSB.<\u002Fli>\n<li><strong>Card scheme<\u002Fstrong> — Mastercard dependency for card processing.<\u002Fli>\n<li><strong>Vendors<\u002Fstrong> — Zendesk, Bugcrowd, Snowflake, MongoDB Atlas, GitHub Actions.<\u002Fli>\n<li><strong>Geographic redundancy<\u002Fstrong> — multi-AZ confirmed; multi-region partially evidenced; full DR/BC design <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan>.<\u002Fli>\n<\u002Ful>\n<p>The most material <em>institutional<\u002Fem> dependencies (schemes and safeguarding/partner banks) are simultaneously the <strong>source of the moat<\u002Fstrong> (§III.19).<\u002Fp>\n<h3 id=\"iii-14-employee-architecture\"><span class=\"num\">III.14<\u002Fspan><span>Employee Architecture<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Metric<\u002Fsc-raw-th><sc-raw-th>Value<\u002Fsc-raw-th><sc-raw-th>Evidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Monthly-average employees FY2025<\u002Fsc-raw-td><sc-raw-td>~6,151 (remuneration £412.8m)<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Engineers (early 2025)<\u002Fsc-raw-td><sc-raw-td>&gt;850<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Engineer trajectory<\u002Fsc-raw-td><sc-raw-td>~120 (2016) → 400+ (2019/20) → 850+ (2025)<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Total workforce (trackers)<\u002Fsc-raw-td><sc-raw-td>~7,713 (2024) → ~10,332 (2025)<\u002Fsc-raw-td><sc-raw-td>[THIRD-PARTY, Revelio]<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Financial-crime share<\u002Fsc-raw-td><sc-raw-td>\"around a third of staff\"<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">COMPANY CLAIM<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Transactions/day<\u002Fsc-raw-td><sc-raw-td>~4.7 million<\u002Fsc-raw-td><sc-raw-td>[THIRD-PARTY, American Banker]<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Support hubs<\u002Fsc-raw-td><sc-raw-td>Tallinn, Budapest (EMEA); Tampa (Americas); Singapore (APAC)<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Other key offices<\u002Fsc-raw-td><sc-raw-td>London HQ, Austin, Tokyo, São Paulo, Brussels<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Composition (assessed):<\u002Fstrong> engineering ~14% of the ~6,151 average; financial crime/compliance ~one-third <span class=\"ev\">COMPANY CLAIM<\u002Fspan>; a large but automation-leveraged support block; a small, high-impact treasury desk; Wise Platform a \"start-up within a scale-up.\" The two largest people investments — <strong>financial crime<\u002Fstrong> and <strong>customer support<\u002Fstrong> — are precisely the functions hardest to fully automate, which shapes operating leverage (§III.18). The Revelio-vs-Wise headcount gap (~10,332 vs ~6,151) is left explicitly unreconciled <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan>; contractor/outsourced-support inclusion is the likely but <span class=\"ev ev-soft\">HYPOTHESIS<\u002Fspan> explanation.<\u002Fp>\n<h3 id=\"iii-15-organizational-design\"><span class=\"num\">III.15<\u002Fspan><span>Organizational Design<\u002Fspan><\u002Fh3>\n<p>Wise runs a <strong>mission/team-oriented, highly decentralised<\u002Fstrong> model derived from the Spotify \"squads/tribes/guilds/chapters\" template <span class=\"ev\">CONFIRMED, multiple Wise/TransferWise engineering posts<\u002Fspan>:<\u002Fp>\n<ul>\n<li><strong>Autonomous product teams<\u002Fstrong> (\"~46 teams\" c.2018; each owns a customer problem; contains engineers, PM, sometimes analyst, designer, plus Operations/CS contacts).<\u002Fli>\n<li><strong>Tribes<\u002Fstrong> = alliances of teams in a domain with embedded leadership; <strong>VPs<\u002Fstrong> above tribes.<\u002Fli>\n<li><strong>Guilds/Chapters<\u002Fstrong> = cross-team skill communities (iOS, Android, Analytics).<\u002Fli>\n<li><strong>Weak code ownership / historically no central architect<\u002Fstrong> — \"every engineer is empowered to change any code in any service,\" owning team advises/reviews.<\u002Fli>\n<li><strong>OKRs<\u002Fstrong>; quarterly planning open to all; devolved tool choice.<\u002Fli>\n<\u002Ful>\n<p><strong>Decision rights vs operational power:<\u002Fstrong> product/engineering rights are genuinely devolved (teams pick problems, tools, even currencies to launch — \"no-one tells the team what currencies to launch\"). <strong>But<\u002Fstrong> the risk/compliance overlay is a formal counterweight: Three-Lines-of-Defence, Group Risk Committee, ALCO and sub-committees, plus (Volume I) GC and CRO reporting to the CTO and Internal Audit to the CFO and jointly to the board. The critical tension the enforcement cluster exposes is that <strong>autonomy optimised for velocity collides with financial-crime control as an inherently centralising, veto-bearing function.<\u002Fstrong> Wise's remediation (independent validation, more personnel for alerts, governance portal) is effectively a <strong>re-centralisation of control<\u002Fstrong>; simultaneously Wise embeds <strong>FinCrime Product Compliance managers inside product/Platform squads<\u002Fstrong> to reconcile autonomy with veto rights by putting compliance SMEs <em>in<\u002Fem> the teams rather than only above them <span class=\"ev\">CONFIRMED, job descriptions<\u002Fspan>.<\u002Fp>\n<h3 id=\"iii-16-product-development-system\"><span class=\"num\">III.16<\u002Fspan><span>Product Development System<\u002Fspan><\u002Fh3>\n<p><span class=\"ev\">CONFIRMED<\u002Fspan>: autonomous roadmaps; heavy <strong>A/B testing<\u002Fstrong>; <strong>OKRs<\u002Fstrong>; <strong>continuous delivery<\u002Fstrong> (120+ deploys/day historically; no dedicated manual QA — quality enforced by automated tests, canary analysis, observability); <strong>Storybook/Chromatic<\u002Fstrong> visual regression; 12-language localisation. The balancing mechanism is <strong>standardisation as the enabler of autonomy<\u002Fstrong> — the microservice chassis, standard Gradle/GitHub-Actions plugins, CRP and canary analysis let teams move fast <em>within<\u002Fem> guardrails that bake in security, observability and compliance defaults. Regulatory-product development is increasingly co-owned by embedded FinCrime managers. Technical debt is managed via the language-agnostic automation service that mass-upgrades dependencies across 700+ repos.<\u002Fp>\n<h3 id=\"iii-17-customer-support-operating-model\"><span class=\"num\">III.17<\u002Fspan><span>Customer Support Operating Model<\u002Fspan><\u002Fh3>\n<p><span class=\"ev\">CONFIRMED<\u002Fspan>: channels are email + Help Centre (Zendesk Support/Guide), phone and chat, all integrated into Zendesk; four hubs — <strong>Tallinn &amp; Budapest<\u002Fstrong> (Europe), <strong>Tampa<\u002Fstrong> (Americas), <strong>Singapore<\u002Fstrong> (APAC); <strong>English plus 11 other languages<\u002Fstrong> (12-language website). Automation: ticket auto-enrichment and routing, self-service deflection, <strong>~50% of chat contacts handled with LLMs (FY2026)<\u002Fstrong>, and a <strong>Credal LLM QA agent<\u002Fstrong> evaluating interactions across <strong>14 Wise-specific criteria<\u002Fstrong> (built because \"the volume of customer inquiries was outpacing the company's ability to hire and train\"). Escalation routes restricted accounts to fraud/compliance.<\u002Fp>\n<p>Support functions as <strong>four things at once<\u002Fstrong>: a cost centre (attacked with automation), a <strong>trust mechanism<\u002Fstrong> (core to a money mover), a <strong>regulatory function<\u002Fstrong> (complaint handling; the front line for fraud/scam reports feeding SAR processes), and a <strong>product-quality feedback loop<\u002Fstrong> into autonomous teams (CS contacts embedded in teams).<\u002Fp>\n<h3 id=\"iii-18-operating-leverage\"><span class=\"num\">III.18<\u002Fspan><span>Operating Leverage<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Function<\u002Fsc-raw-th><sc-raw-th>Scaling<\u002Fsc-raw-th><sc-raw-th>Mechanism<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Engineering / core platform<\u002Fsc-raw-td><sc-raw-td><strong>Nearly automatic → sublinear<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Fixed R&amp;D amortised over volume; standardisation lowers marginal cost<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Payments ops (happy path)<\u002Fsc-raw-td><sc-raw-td><strong>Nearly automatic<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>75% fully automated in &lt;20s<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Payments ops (exceptions/recon)<\u002Fsc-raw-td><sc-raw-td><strong>Sublinear, real<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Tooling helps; breaks need humans<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Treasury<\u002Fsc-raw-td><sc-raw-td><strong>Sublinear<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Netting improves with scale; desk grows slowly<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Customer support<\u002Fsc-raw-td><sc-raw-td><strong>Sublinear (improving)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>LLM automation (~50% chat) breaks linear link<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Compliance / AML / fraud<\u002Fsc-raw-td><sc-raw-td><strong>Linear → disproportionate<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Alert volume, SAR duty, jurisdictions, remediation<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Finance<\u002Fsc-raw-td><sc-raw-td><strong>Sublinear<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Automated close<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Legal / regulatory affairs<\u002Fsc-raw-td><sc-raw-td><strong>Step-fixed / disproportionate<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Each new licence/jurisdiction is lumpy<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wise Platform sales<\u002Fsc-raw-td><sc-raw-td><strong>Linear-ish<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Relationship-driven, long cycles<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Margin expansion<\u002Fstrong> comes from the technology and payments-operations layers, amplified by treasury netting and support automation — confirmed by FY2026 unit economics (<strong>net revenue $2,502.8m, +19%; average cross-border take rate 0.52%<\u002Fstrong>, down from 0.58%; 75% of payments instant). <strong>Diseconomy threat:<\u002Fstrong> <strong>financial crime/compliance and regulatory affairs<\u002Fstrong>, where the enforcement cluster is direct evidence that complexity can scale <em>faster<\u002Fem> than volume, and where remediation (more personnel, independent validation, two years of quarterly reporting) is a live example of compliance cost rising disproportionately.<\u002Fp>\n<h3 id=\"iii-19-technology-as-competitive-advantage\"><span class=\"num\">III.19<\u002Fspan><span>Technology as Competitive Advantage<\u002Fspan><\u002Fh3>\n<p>Scored against six criteria (Proprietary? Hard to reproduce? Cost? Speed/conversion? Regulatory control? Compounds with volume?). ●●● strong, ●● moderate, ● weak.<\u002Fp>\n<figure class=\"tbl tbl-wide\"><div class=\"rot\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Advantage<\u002Fsc-raw-th><sc-raw-th>Prop.<\u002Fsc-raw-th><sc-raw-th>Hard-repro<\u002Fsc-raw-th><sc-raw-th>Cost<\u002Fsc-raw-th><sc-raw-th>Speed<\u002Fsc-raw-th><sc-raw-th>Reg.<\u002Fsc-raw-th><sc-raw-th>Compounds<\u002Fsc-raw-th><sc-raw-th>Verdict<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Payment routing + direct scheme membership<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td><strong>Deepest moat<\u002Fstrong> — years + regulatory approval; 8+ direct connections<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Treasury Ledger + netting<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>Core proprietary asset; compounds with volume<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Automation (happy-path)<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>Strong cost/speed lever<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Reconciliation<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>Necessary; must improve (enforcement)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FX systems<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>Netting efficiency compounds<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Fraud/AML ML<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>Real flywheel; control gaps exposed<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Compliance infra / licences<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>Accumulated licences = moat; costly<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card processing (cloud-first)<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>World-first cloud card processing<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>API / Wise Platform<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>Distribution moat; embeds Wise in banks<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Dev productivity (chassis/CI-CD/canary)<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>Enables velocity; reproducible<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Reliability<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>Table stakes, done well<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Data<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●<\u002Fsc-raw-td><sc-raw-td>●●●<\u002Fsc-raw-td><sc-raw-td>Compounds; strongest in fraud + matching<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><\u002Ffigure>\n<h3 id=\"iii-20-volume-iii-reconstruction\"><span class=\"num\">III.20<\u002Fspan><span>Volume III Reconstruction<\u002Fspan><\u002Fh3>\n<p><strong>1. Operating-Model Diagram (textual):<\u002Fstrong> Customer apps (web/iOS/Android) → API/BFF → 1,000+ Java/Kotlin microservices (Kafka-connected) → {transfer FSM, product ledgers, fraud/AML ML on Ray Serve, card platform} → Treasury Ledger (real-time double-entry) → trading desks (FX/liquidity) + payment-scheme connectors → safeguarding banks / BoE RTGS / local pools. Cross-cutting: Reconciliation; Compliance/Risk (3 lines); Support (Zendesk+LLM); Data platform (Snowflake/Iceberg/SageMaker); Observability (LGTM); Security (PCI/Bugcrowd).<\u002Fp>\n<p><strong>2. Transaction Workflow:<\u002Fstrong> quote-lock → fund → confirm (<code>incoming_payment_waiting<\u002Fcode>) → compliance+fraud screen → convert (<code>processing<\u002Fcode>→<code>funds_converted<\u002Fcode>) → local payout (<code>outgoing_payment_sent<\u002Fcode>) → beneficiary credit → reconcile → recognise revenue. Abnormal branches: <code>bounced_back<\u002Fcode>, <code>charged_back<\u002Fcode>, <code>cancelled<\u002Fcode>, <code>funds_refunded<\u002Fcode>, sanctions/SAR holds.<\u002Fp>\n<p><strong>3. Treasury OS:<\u002Fstrong> product events → Treasury Ledger (real-time A/L) → imbalance detection → {internal netting, FX execution 10s–100s £m/trade, pool rebalancing, scheme prefunding} → yield management (MMFs/gov securities within safeguarding rules) → reconciliation.<\u002Fp>\n<p><strong>4–15.<\u002Fstrong> Technology architecture (§III.4); payment-state architecture (§III.2/6); 8-layer ledger model (§III.7); multi-domain reconciliation (§III.8); Kafka-CDC→Snowflake/Iceberg→Trino→BI/ML data flow (§III.9); ML-score→rules→human-review→SAR fraud/compliance workflow (§III.10); PCI+Bugcrowd+canary+Kafka-rack-awareness+LGTM security/reliability map (§III.11–12); squads/tribes/guilds + risk-committee org and decision-rights map (§III.15); build-vs-buy matrix (§III.5); employee/function map (§III.14); operating-leverage matrix (§III.18).<\u002Fp>\n<p><strong>16. Operational Bottleneck Analysis (ranked):<\u002Fstrong> (1) <strong>AML alert handling / SAR timeliness<\u002Fstrong> (human-bound, enforcement-critical); (2) <strong>reconciliation breaks<\u002Fstrong> (human-bound, safeguarding-critical); (3) <strong>new-jurisdiction licensing<\u002Fstrong> (step-fixed, lumpy); (4) <strong>corridor liquidity imbalance<\u002Fstrong> (treasury/FX cost); (5) <strong>AWS concentration<\u002Fstrong> (systemic single point of failure).<\u002Fp>\n<p><strong>17. Technology-Moat Assessment:<\u002Fstrong> durable moats are <strong>direct payment-scheme connectivity + the Treasury Ledger/netting engine + accumulated regulatory licences<\u002Fstrong>, reinforced by the <strong>Wise Platform API<\u002Fstrong> distribution moat. Pure software (CI/CD, observability) is excellent but reproducible — an <em>enabler<\u002Fem>, not the moat.<\u002Fp>\n<p><strong>18. Key Unknowns:<\u002Fstrong> internal chart-of-accounts/ledger schema; specific current KYC and sanctions/PEP-screening vendors (ComplyAdvantage/World-Check/Napier vs in-house); DR/BC and multi-region failover design; key-management/secrets/PAM specifics; disclosed fraud-loss figures; published SLOs and major-outage catalogue; reconciliation of Wise-reported (~6,151 avg) vs third-party (~10,332) headcount.<\u002Fp>\n<p><strong>19. Ten Most Important Conclusions:<\u002Fstrong><\u002Fp>\n<ol>\n<li><strong>The moat is the payments-plus-treasury machine, not the app.<\u002Fstrong> Direct scheme membership + real-time Treasury Ledger + netting is what makes Wise structurally cheaper and faster; software velocity is an enabler.<\u002Fli>\n<li><strong>Local-in/local-out with internal netting<\u002Fstrong> means most \"cross-border\" transfers never cross a border.<\u002Fli>\n<li><strong>Interest income is a large but rate-cyclical pillar<\u002Fstrong> ($806.1m FY2026; ~$40m per 25bp), governed by a 1%/20%/80% retention framework currently over-earning (26% IBT margin) due to UK pass-through restrictions.<\u002Fli>\n<li><strong>Financial crime is the single largest function<\u002Fstrong> (~one-third of staff, company claim) — the clearest revealed priority and the clearest diseconomy.<\u002Fli>\n<li><strong>The enforcement cluster is an operating-model failure, not just a legal event:<\u002Fstrong> autonomy-and-velocity outran centralising control (SAR timeliness, data integrity).<\u002Fli>\n<li><strong>Reconciliation is a first-class, staffed system<\u002Fstrong> whose failure is primarily a <em>regulatory<\u002Fem> rather than direct-financial risk.<\u002Fli>\n<li><strong>Wise builds where correctness/speed/cost-at-scale/regulatory-control matter and buys commodity<\u002Fstrong> — a disciplined build-vs-buy doctrine.<\u002Fli>\n<li><strong>Operating leverage is strongest in engineering, happy-path payments, treasury and (now) support automation; weakest in compliance and licensing.<\u002Fstrong><\u002Fli>\n<li><strong>AWS is the dominant single point of failure<\u002Fstrong>; institutional dependencies (schemes, safeguarding/partner banks, Mastercard) are simultaneously moat and risk.<\u002Fli>\n<li><strong>Standardisation is the enabler of autonomy<\u002Fstrong> — chassis, CI/CD, canary analysis and the governance portal let decentralised teams move fast within compliant guardrails; Wise is now <em>re-centralising<\u002Fem> control over risk.<\u002Fli>\n<\u002Fol>\n<p><strong>20. Final answers to the completion questions:<\u002Fstrong><\u002Fp>\n<ul>\n<li><strong>Most critical operating subsystem:<\u002Fstrong> the <strong>Treasury Ledger + payment-scheme connectivity<\u002Fstrong> complex — without it neither instant speed nor low cost survives.<\u002Fli>\n<li><strong>Hardest to replicate:<\u002Fstrong> the <strong>combination of direct scheme memberships + accumulated regulatory licences + the netting/treasury engine<\u002Fstrong> — years, capital and regulator trust, not just code.<\u002Fli>\n<li><strong>Scales most efficiently:<\u002Fstrong> core engineering, happy-path payment processing, treasury netting, and increasingly LLM-assisted support.<\u002Fli>\n<li><strong>Requires human headcount to keep growing:<\u002Fstrong> financial-crime/AML alert handling, reconciliation exceptions, and per-jurisdiction regulatory/licensing work.<\u002Fli>\n<li><strong>Most dependent on third parties:<\u002Fstrong> <strong>AWS<\u002Fstrong> (technology) and <strong>payment schemes + safeguarding/partner banks + Mastercard<\u002Fstrong> (institutions).<\u002Fli>\n<li><strong>Is technology the moat, or an enabler?<\u002Fstrong> <strong>Technology is primarily an enabler of a broader operating and regulatory moat.<\u002Fstrong> The genuinely defensible assets are the payments-network position, the treasury/netting engine, and the licence stack; Wise's excellent-but-reproducible software is what lets it operate that moat cheaply, fast and at scale.<\u002Fli>\n<\u002Ful>\n<p><em>Volume III ends here at a logical section boundary, with all analytical questions addressed. Volume IV has not been started, per instruction. Material gaps that are discoverable but unresolved are listed explicitly in §III.20(18) as Key Unknowns rather than papered over.<\u002Fem><\u002Fp>\n<section class=\"part\" id=\"part-iv-financial-statements-revenue-architecture-unit-econo\" data-break=\"page\"><div class=\"part-top\"><span>Part IV<\u002Fspan><span>The Wise Enterprise Reverse-Engineering Study<\u002Fspan><\u002Fdiv><div class=\"part-mid\"><div class=\"part-no\">04<\u002Fdiv><h1 class=\"part-title\">Financial Statements, Revenue Architecture, Unit Economics &amp; Capital<\u002Fh1><p class=\"part-sub\">How the economic machine earns, spends and retains money.<\u002Fp><\u002Fdiv><div class=\"part-rule\"><\u002Fdiv><\u002Fsection>\n<h3 id=\"wise-plc-wise-group-plc-institutional-forensic-reverse-engin\"><span>Wise plc / Wise Group plc — Institutional Forensic Reverse-Engineering Study<\u002Fspan><\u002Fh3>\n<p><strong>Reporting-basis warning (critical for the entire volume).<\u002Fstrong> FY2020–FY2025 figures are IFRS / GBP, reported by Wise plc (financial year ending 31 March). FY2026 is US GAAP / USD, following the reorganisation completed 8 May 2026 in which the Jersey-incorporated, UK-tax-resident <strong>Wise Group plc<\u002Fstrong> (Nasdaq: WSE; LSE: WISE) became the ultimate holding company and the former listed parent was renamed <strong>Wise Limited<\u002Fstrong>. The conversion involved three simultaneous changes — (i) IFRS → US GAAP, (ii) GBP → USD presentation, and (iii) discontinuation of the earnings-adjusted \"underlying basis\" alternative performance measure. <strong>This is a reporting-basis change, not an economic change.<\u002Fstrong> The two series are presented separately with the break flagged; they are not spliced. The bridging source is Wise's \"Translation of IFRS financials into US GAAP\" RNS dated 13 April 2026.<\u002Fp>\n<h3 id=\"iv-1-multi-year-financial-history\"><span class=\"num\">IV.1<\u002Fspan><span>Multi-Year Financial History<\u002Fspan><\u002Fh3>\n<div class=\"chart-grid\">\n<figure class=\"chart full\"><p class=\"chart-t\">Cross-border volume<\u002Fp><p class=\"chart-s\">£bn, FY2020–FY2026. One consistent GBP volume series across the basis break; FY2026 (dark) is the £181.7bn equivalent of the $243.5bn reported under US GAAP.<\u002Fp>\n<svg sc-camel-view-box=\"0 0 100 52\" width=\"100%\" style=\"display:block\" sc-camel-preserve-aspect-ratio=\"none\" role=\"img\"><line x1=\"0\" y1=\"46\" x2=\"100\" y2=\"46\" stroke=\"rgba(29,31,32,0.14)\" stroke-width=\"0.25\"><\u002Fline><line x1=\"0\" y1=\"23\" x2=\"100\" y2=\"23\" stroke=\"rgba(29,31,32,0.14)\" stroke-width=\"0.25\"><\u002Fline><line x1=\"0\" y1=\"0\" x2=\"100\" y2=\"0\" stroke=\"rgba(29,31,32,0.14)\" stroke-width=\"0.25\"><\u002Fline><rect x=\"2.71\" y=\"36.51\" width=\"8.86\" height=\"9.49\" fill=\"#5980a6\"><\u002Frect><rect x=\"17.00\" y=\"33.70\" width=\"8.86\" height=\"12.30\" fill=\"#5980a6\"><\u002Frect><rect x=\"31.29\" y=\"28.73\" width=\"8.86\" height=\"17.27\" fill=\"#5980a6\"><\u002Frect><rect x=\"45.57\" y=\"22.38\" width=\"8.86\" height=\"23.62\" fill=\"#5980a6\"><\u002Frect><rect x=\"59.86\" y=\"19.21\" width=\"8.86\" height=\"26.79\" fill=\"#5980a6\"><\u002Frect><rect x=\"74.14\" y=\"13.18\" width=\"8.86\" height=\"32.82\" fill=\"#5980a6\"><\u002Frect><rect x=\"88.43\" y=\"4.93\" width=\"8.86\" height=\"41.07\" fill=\"#1d2d3d\"><\u002Frect><\u002Fsvg><div style=\"display:grid;grid-template-columns:repeat(7,1fr);margin-top:5px\"><div style=\"text-align:center;font-size:9px;font-family:var(--font-heading);letter-spacing:0.06em;color:var(--color-neutral-700)\">FY20<\u002Fdiv><div style=\"text-align:center;font-size:9px;font-family:var(--font-heading);letter-spacing:0.06em;color:var( u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Other income/(loss), net<\u002Fsc-raw-td><sc-raw-td>6.6<\u002Fsc-raw-td><sc-raw-td>(10.7)<\u002Fsc-raw-td><sc-raw-td>69.7<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Income before tax<\u002Fsc-raw-td><sc-raw-td>656.7<\u002Fsc-raw-td><sc-raw-td>717.5<\u002Fsc-raw-td><sc-raw-td>660.4<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>IBT margin<\u002Fsc-raw-td><sc-raw-td>37.0%<\u002Fsc-raw-td><sc-raw-td>34.2%<\u002Fsc-raw-td><sc-raw-td>26.4%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Income tax<\u002Fsc-raw-td><sc-raw-td>(155.2)<\u002Fsc-raw-td><sc-raw-td>(167.2)<\u002Fsc-raw-td><sc-raw-td>(161.7)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Net income<\u002Fsc-raw-td><sc-raw-td>501.5<\u002Fsc-raw-td><sc-raw-td>550.3<\u002Fsc-raw-td><sc-raw-td>498.7<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Basic EPS (cents)<\u002Fsc-raw-td><sc-raw-td>48.57<\u002Fsc-raw-td><sc-raw-td>53.31<\u002Fsc-raw-td><sc-raw-td>48.92<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Diluted EPS (cents)<\u002Fsc-raw-td><sc-raw-td>47.81<\u002Fsc-raw-td><sc-raw-td>52.63<\u002Fsc-raw-td><sc-raw-td>48.43<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Weighted avg shares — basic (m)<\u002Fsc-raw-td><sc-raw-td>1,032.6<\u002Fsc-raw-td><sc-raw-td>1,032.3<\u002Fsc-raw-td><sc-raw-td>1,019.5<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Growth rates.<\u002Fstrong> Revenue CAGR FY2020→FY2025 (IFRS): £302.6m → £1,211.9m = <strong>32% p.a.<\u002Fstrong> Underlying-income CAGR FY2023→FY2025 ≈ 19%. Net-revenue growth (US GAAP) FY2024→FY2026 = <strong>19% p.a.<\u002Fstrong> Cross-border volume grew from £42bn (FY2020) to £181.7bn (FY2026, ≈ $243.5bn), a ≈ 28% CAGR. Active-customer CAGR FY2020→FY2026 ≈ 21%.<\u002Fp>\n<p><strong>Accounting-definition vs genuine economic change.<\u002Fstrong> The single most important <em>economic<\u002Fem> change across the whole series is the FY2023–FY2024 arrival of positive central-bank interest rates, which turned a ~£4m interest line (FY2022) into $806m of gross interest income (FY2026) — the dominant driver of the reported-PBT explosion (from £43.9m in FY2022 to £564.8m in FY2025). The FY2020 restatement, the 2021 share split and the FY2026 IFRS→US GAAP/GBP→USD conversion are all <em>definitional<\u002Fem> and must not be read as economic inflections.<\u002Fp>\n<h3 id=\"iv-2-revenue-taxonomy\"><span class=\"num\">IV.2<\u002Fspan><span>Revenue Taxonomy<\u002Fspan><\u002Fh3>\n<p>Wise has nine economically distinct income lines. Under US GAAP these consolidate into two headline categories — <strong>Transaction revenue<\u002Fstrong> and <strong>Net interest income<\u002Fstrong> (interest income on customer balances less interest expense on customer liabilities).<\u002Fp>\n<h4 id=\"table-2-revenue-taxonomy-confirmed-fact-analytical-inference\">Table 2 — Revenue taxonomy <span class=\"ev\">CONFIRMED FACT / ANALYTICAL INFERENCE on splits<\u002Fspan><\u002Fh4>\n<figure class=\"tbl tbl-wide\"><div class=\"rot\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>#<\u002Fsc-raw-th><sc-raw-th>Stream<\u002Fsc-raw-th><sc-raw-th>Payer<\u002Fsc-raw-th><sc-raw-th>Trigger<\u002Fsc-raw-th><sc-raw-th>Pricing basis<\u002Fsc-raw-th><sc-raw-th>FY2026 ($m)<\u002Fsc-raw-th><sc-raw-th>Quality<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>Cross-border transfer fee<\u002Fsc-raw-td><sc-raw-td>Sender<\u002Fsc-raw-td><sc-raw-td>Completed transfer<\u002Fsc-raw-td><sc-raw-td>Variable % + fixed<\u002Fsc-raw-td><sc-raw-td>1,257 (with #2)<\u002Fsc-raw-td><sc-raw-td>Transactional, volume-driven, price-competitive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>FX conversion spread<\u002Fsc-raw-td><sc-raw-td>Converting customer<\u002Fsc-raw-td><sc-raw-td>Currency conversion<\u002Fsc-raw-td><sc-raw-td>Mid-market + margin<\u002Fsc-raw-td><sc-raw-td>(in #1)<\u002Fsc-raw-td><sc-raw-td>Transactional<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>Card interchange + cross-currency<\u002Fsc-raw-td><sc-raw-td>Cardholder / merchant<\u002Fsc-raw-td><sc-raw-td>Card spend<\u002Fsc-raw-td><sc-raw-td>Interchange + FX margin<\u002Fsc-raw-td><sc-raw-td>~330 of card<\u002Fsc-raw-td><sc-raw-td>Recurring-ish, high-retention<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>Card issuance / ATM fees<\u002Fsc-raw-td><sc-raw-td>Cardholder<\u002Fsc-raw-td><sc-raw-td>Card order / ATM over-limit<\u002Fsc-raw-td><sc-raw-td>Fixed<\u002Fsc-raw-td><sc-raw-td>~60 of card<\u002Fsc-raw-td><sc-raw-td>Ancillary<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>Account / other / domestic fees<\u002Fsc-raw-td><sc-raw-td>Account holder<\u002Fsc-raw-td><sc-raw-td>Domestic txn, opening<\u002Fsc-raw-td><sc-raw-td>Fixed / %<\u002Fsc-raw-td><sc-raw-td>245 (other)<\u002Fsc-raw-td><sc-raw-td>Growing, higher-margin<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>Wise Platform (embedded)<\u002Fsc-raw-td><sc-raw-td>Partner (B2B)<\u002Fsc-raw-td><sc-raw-td>Partner-routed txn<\u002Fsc-raw-td><sc-raw-td>Cost + margin (+ integration/licence fees)<\u002Fsc-raw-td><sc-raw-td>(in #1) ~5% vol<\u002Fsc-raw-td><sc-raw-td>Contractual, sticky, scaling<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td>Interest income on customer balances<\u002Fsc-raw-td><sc-raw-td>Wise earns<\u002Fsc-raw-td><sc-raw-td>Holding safeguarded funds<\u002Fsc-raw-td><sc-raw-td>Central-bank rate<\u002Fsc-raw-td><sc-raw-td>806.1 gross<\u002Fsc-raw-td><sc-raw-td>Balance-driven, rate-sensitive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td>Wise Assets (custody fee)<\u002Fsc-raw-td><sc-raw-td>Investing customer<\u002Fsc-raw-td><sc-raw-td>AUC holding<\u002Fsc-raw-td><sc-raw-td>% of AUC<\u002Fsc-raw-td><sc-raw-td>(in other)<\u002Fsc-raw-td><sc-raw-td>Recurring, balance-driven<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td>Net interest on corporate investments<\u002Fsc-raw-td><sc-raw-td>Wise earns<\u002Fsc-raw-td><sc-raw-td>Own cash<\u002Fsc-raw-td><sc-raw-td>Rate<\u002Fsc-raw-td><sc-raw-td>~40 (in other income)<\u002Fsc-raw-td><sc-raw-td>Rate-driven<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><\u002Ffigure>\n<p><strong>Revenue-quality picture.<\u002Fstrong> Recurring / balance-driven lines (3, 5, 7, 8) now approach half of net revenue: at the FY2026 results (12 months to 31 March 2026) Wise confirmed net revenue rose 19% to $2.50bn \"with nearly half coming from non-cross-border revenue.\" Within transaction revenue, card + other reached 33.6% in FY2026 (card 20.7%, other 12.9%), up from ~24% in FY2024. Cross-border (streams 1–2) remains the largest but slowest-growing and most price-competitive line: FY2024→FY2026 CAGRs are cross-border ~12%, card ~37%, other ~45%.<\u002Fp>\n<h3 id=\"iv-3-revenue-flow-by-product\"><span class=\"num\">IV.3<\u002Fspan><span>Revenue Flow by Product<\u002Fspan><\u002Fh3>\n<h4 id=\"3a-consumer-transfer-1-000-representative-analytical-inferen\">3A — Consumer transfer (€1,000, representative) <span class=\"ev\">ANALYTICAL INFERENCE, calibrated to the 52bps FY2026 take rate<\u002Fspan><\u002Fh4>\n<p>``<code> Customer sends                         €1,000.00 Wise fee (~0.52%)                        €5.20   ← gross transaction revenue Amount converted at mid-market        €994.80 Third-party / variable direct costs: Payout/rail cost (local-out)          ~€1.20   ← declining as direct rails expand FX execution / liquidity cost         ~€0.60 Fraud / compliance variable           ~€0.40 = Cost of sales (~40% of fee)         ~€2.20 Contribution profit                     ~€3.00   (~58% contribution margin) Recognition: €5.20 revenue at completion; cash realised same day <\u002Fcode>`` Wise's reported ~75% underlying gross margin (FY2025) exceeds this per-transfer contribution because the gross-margin denominator (underlying income) includes the first-1% interest income, which carries near-zero direct cost.<\u002Fp>\n<h4 id=\"3b-wise-card-purchase-100-abroad\">3B — Wise Card purchase ($100 abroad)<\u002Fh4>\n<p>Wise earns (i) the cross-currency conversion margin (~0.4–0.5%) and (ii) scheme interchange via the issuing entity; direct cost = scheme fees + processor. Card revenue reached <strong>$392m in FY2026 (+40%)<\u002Fstrong>, the fastest-growing transaction line, driven by adoption in the EU, Australia and the UK.<\u002Fp>\n<h4 id=\"3c-wise-business-payment\">3C — Wise Business payment<\u002Fh4>\n<p>Higher average value (business VPC ≈ £62k/yr vs personal ≈ £7.3k/yr), lower take rate (Q4 FY2026 business cross-border <strong>0.39%<\u002Fstrong> vs personal <strong>0.56%<\u002Fstrong>) reflecting volume-tiering, but disproportionate balances ($11.2bn) generating interest income and stickier deposits (payroll, supplier payments, FX hedging).<\u002Fp>\n<h4 id=\"3d-wise-platform-transaction\">3D — Wise Platform transaction<\u002Fh4>\n<p>A partner (e.g. Morgan Stanley, Standard Chartered, UniCredit, Raiffeisen Bank, MBSB Bank, Capitec) routes an end-customer payment through Wise's rails and licences via API. Commercial model = \"cost + margin\" transaction fee, plus potential integration and software-licensing fees. ~5% of cross-border volume in FY2026 (up from 4% in FY2025); medium-term target ~10%, long-term vision &gt;50%.<\u002Fp>\n<h4 id=\"3e-customer-balance-interest-income\">3E — Customer balance / interest income<\u002Fh4>\n<p>A customer holding €10,000 has that money safeguarded in cash / MMFs / government bonds earning the central-bank-linked yield (~3.0% average gross FY2026). Wise retains the first 1% (€100/yr) to fund account operating costs; of yield above 1%, the framework aims to retain 20% and return 80%. In practice only about half the 80% is returned (mainly UK regulatory restrictions), so the shortfall accrues incidentally to Wise (see IV.12).<\u002Fp>\n<h3 id=\"iv-4-take-rate\"><span class=\"num\">IV.4<\u002Fspan><span>Take Rate<\u002Fspan><\u002Fh3>\n<h4 id=\"table-4-cross-border-take-rate-history-confirmed-fact\">Table 4 — Cross-border take-rate history <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fh4>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Period<\u002Fsc-raw-th><sc-raw-th>Cross-border take rate<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>FY2020<\u002Fsc-raw-td><sc-raw-td>~0.73% (total); cross-currency n/a<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2021<\u002Fsc-raw-td><sc-raw-td>0.70%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2022<\u002Fsc-raw-td><sc-raw-td>0.63%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2023<\u002Fsc-raw-td><sc-raw-td>~0.69%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2024<\u002Fsc-raw-td><sc-raw-td>0.67%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2025 (avg)<\u002Fsc-raw-td><sc-raw-td>0.58%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Q4 FY2025<\u002Fsc-raw-td><sc-raw-td>0.53%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>FY2026 (avg)<\u002Fsc-raw-td><sc-raw-td>0.52%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Q4 FY2026<\u002Fsc-raw-td><sc-raw-td>0.51%<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p>Quarterly FY2025→FY2026 (US GAAP): 0.64 → 0.59 → 0.56 → 0.53 → 0.52 → 0.52 → 0.52 → 0.51. Personal Q4 FY2026 0.56%; Business Q4 FY2026 0.39%.<\u002Fp>\n<p><strong>Drivers of compression.<\u002Fstrong> (1) <strong>Deliberate price cuts<\u002Fstrong> funded by unit-cost reductions — the primary driver, and the core of Wise's \"Sustainable Efficiency-driven Sales\" (SES) flywheel: lower price → more volume/balances → more scale → lower unit cost → lower price. The CFO stated on the FY2026 call that price is \"the number one argument for customers to come to us\" and the company puts \"no floor, any limits\" on it. (2) <strong>Mix:<\u002Fstrong> the rise of card-only customers (~3% of active personal in Q1 FY2021 to ~20% in Q4 FY2025) and business volume-tiering mechanically lower the blended cross-border take rate. (3) <strong>Corridor mix<\u002Fstrong> as direct rails cut cost. FY2027 guidance: 1–2bps of quarterly take-rate reduction.<\u002Fp>\n<p><strong>How low can take rate go?<\u002Fstrong> Cross-border cost of sales is ~40% of the cross-border fee, and direct rails plus internal netting keep cutting the numerator. The strategic point is that Wise no longer needs cross-border take rate to carry group profitability — card, other and interest income now fund ~half of net revenue — so cross-border take rate can plausibly fall toward <strong>~40bps<\u002Fstrong> over the medium term without impairing group margins, provided volume growth (25–31%) continues to reward the cuts. If volume elasticity fails and take rate drops below ~50bps without a volume step-up, that would signal competition overwhelming (rather than enabling) the scale economies.<\u002Fp>\n<h3 id=\"iv-5-cost-architecture\"><span class=\"num\">IV.5<\u002Fspan><span>Cost Architecture<\u002Fspan><\u002Fh3>\n<h4 id=\"table-5-cost-decomposition-us-gaap-m-confirmed-fact-classifi\">Table 5 — Cost decomposition, US GAAP ($m) <span class=\"ev\">CONFIRMED FACT + classification INFERENCE<\u002Fspan><\u002Fh4>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Cost bucket<\u002Fsc-raw-th><sc-raw-th>FY2024<\u002Fsc-raw-th><sc-raw-th>FY2025<\u002Fsc-raw-th><sc-raw-th>FY2026<\u002Fsc-raw-th><sc-raw-th>Behaviour<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Transaction expense<\u002Fsc-raw-td><sc-raw-td>331.5<\u002Fsc-raw-td><sc-raw-td>378.0<\u002Fsc-raw-td><sc-raw-td>513.6<\u002Fsc-raw-td><sc-raw-td>Variable (banking fees, FX, card, product losses)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Transaction &amp; credit losses<\u002Fsc-raw-td><sc-raw-td>15.7<\u002Fsc-raw-td><sc-raw-td>11.6<\u002Fsc-raw-td><sc-raw-td>13.9<\u002Fsc-raw-td><sc-raw-td>Volume/risk-sensitive<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Technology &amp; development<\u002Fsc-raw-td><sc-raw-td>287.6<\u002Fsc-raw-td><sc-raw-td>314.1<\u002Fsc-raw-td><sc-raw-td>434.3<\u002Fsc-raw-td><sc-raw-td>Step-fixed (engineers, cloud, AI)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Servicing<\u002Fsc-raw-td><sc-raw-td>216.9<\u002Fsc-raw-td><sc-raw-td>287.5<\u002Fsc-raw-td><sc-raw-td>396.6<\u002Fsc-raw-td><sc-raw-td>Semi-variable (support, payment ops, compliance)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Marketing &amp; sales<\u002Fsc-raw-td><sc-raw-td>79.6<\u002Fsc-raw-td><sc-raw-td>106.1<\u002Fsc-raw-td><sc-raw-td>171.8<\u002Fsc-raw-td><sc-raw-td>Discretionary<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>General &amp; administrative<\u002Fsc-raw-td><sc-raw-td>194.7<\u002Fsc-raw-td><sc-raw-td>273.4<\u002Fsc-raw-td><sc-raw-td>381.9<\u002Fsc-raw-td><sc-raw-td>Semi-fixed (finance, legal, offices, D&amp;A, SBC)<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>FY2026 one-off distortions.<\u002Fstrong> Transaction expense rose to 21% of net revenue (from 19%) mainly because of a <strong>~$70m one-off US GAAP FX adjustment on government bonds<\u002Fstrong> (offset in other comprehensive income). Excluding it, transaction cost grew ~17% — below both volume (+31%) and transaction revenue (+22%), evidencing genuine unit-cost decline. Two further one-offs compressed FY2026 margin: <strong>~$45m of Nasdaq-listing core-function costs<\u002Fstrong> and the $70m FX item; excluding these, the operating margin is ~28% vs 26.4% reported.<\u002Fp>\n<p><strong>Cost classification.<\u002Fstrong><\u002Fp>\n<ul>\n<li><strong>Variable (scale with volume):<\u002Fstrong> banking/rail fees, FX execution, card-scheme fees, product/fraud losses.<\u002Fli>\n<li><strong>Semi-variable (scale with customers, sub-linearly):<\u002Fstrong> servicing/support, KYC/onboarding, compliance/manual review.<\u002Fli>\n<li><strong>Step-fixed:<\u002Fstrong> engineering (&gt;850 engineers), cloud, data infrastructure.<\u002Fli>\n<li><strong>Fixed:<\u002Fstrong> finance, legal, HR, offices, audit, insurance, depreciation.<\u002Fli>\n<li><strong>Balance-sensitive:<\u002Fstrong> interest expense to customers; safeguarding/custody operations.<\u002Fli>\n<\u002Ful>\n<p><strong>IFRS admin-expense detail FY2025 (£m):<\u002Fstrong> employee benefits 412.7; consultancy/outsourced 128.1; other admin 78.2; technology 65.9; marketing 53.8; D&amp;A 18.4; PPE impairment 11.5. Employee-benefit split: salaries 290.5; SBC 58.4; social security 41.1; pension 10.2. Monthly average employees 6,151 (Servicing 3,915; Product Development 1,411; Other functions 534; Marketing 291). Under US GAAP, product-engineering costs expensed rose to $226.8m (FY2026) from $164.6m (FY2025); advertising within marketing was $100.5m (FY2026).<\u002Fp>\n<h3 id=\"iv-6-cost-per-transaction\"><span class=\"num\">IV.6<\u002Fspan><span>Cost per Transaction<\u002Fspan><\u002Fh3>\n<p>At ~4.7m transactions/day (~1.7bn/yr) and FY2026 transaction expense of $513.6m, blended direct transaction cost ≈ <strong>$0.30 per transaction<\u002Fstrong> on that gross basis — though this conflates transfers and card taps. On a cross-border-volume basis, cost of sales ≈ 40% of the ~52bps fee ≈ <strong>21bps of volume<\u002Fstrong>. Scale economies arise from five identifiable sources: (1) <strong>direct rail access<\u002Fstrong> — 8+ direct payment-system connections, including Pix (Brazil) and Zengin (Japan) added in FY2026, each cutting correspondent/SWIFT cost on that corridor; (2) <strong>internal matching/netting<\u002Fstrong> via local-in/local-out, so most currency legs never cross a border and Wise pays only domestic rail fees, not correspondent-banking spreads; (3) <strong>automation<\u002Fstrong> of servicing and fraud models; (4) <strong>vendor pricing<\u002Fstrong> improving with volume; (5) <strong>fixed-cost absorption<\u002Fstrong> across a larger base. The principal <strong>diseconomy<\u002Fstrong> is financial-crime/compliance headcount (≈ a third of staff — company claim), which scales closer to linearly with customers and jurisdictions.<\u002Fp>\n<h3 id=\"iv-7-unit-economics\"><span class=\"num\">IV.7<\u002Fspan><span>Unit Economics<\u002Fspan><\u002Fh3>\n<h4 id=\"table-7-unit-economics-confirmed-inputs-ratios-analytical-in\">Table 7 — Unit economics <span class=\"ev\">CONFIRMED inputs; ratios ANALYTICAL INFERENCE<\u002Fspan><\u002Fh4>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Metric<\u002Fsc-raw-th><sc-raw-th>FY2025<\u002Fsc-raw-th><sc-raw-th>FY2026<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Active customers (m)<\u002Fsc-raw-td><sc-raw-td>15.6<\u002Fsc-raw-td><sc-raw-td>18.9<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Revenue / underlying income per active customer<\u002Fsc-raw-td><sc-raw-td>£87.5 (underlying £1,362m ÷ 15.6m)<\u002Fsc-raw-td><sc-raw-td>~$132 net revenue/customer<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Cross-border volume per active customer<\u002Fsc-raw-td><sc-raw-td>£9,309<\u002Fsc-raw-td><sc-raw-td>~$12,900<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Personal VPC (quarterly)<\u002Fsc-raw-td><sc-raw-td>£3,200<\u002Fsc-raw-td><sc-raw-td>~£3,400<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Business VPC<\u002Fsc-raw-td><sc-raw-td>~£55k/yr<\u002Fsc-raw-td><sc-raw-td>~£62k/yr<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>New customers (first cross-border txn)<\u002Fsc-raw-td><sc-raw-td>5.9m<\u002Fsc-raw-td><sc-raw-td>7.0m<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Marketing spend<\u002Fsc-raw-td><sc-raw-td>£53.8m<\u002Fsc-raw-td><sc-raw-td>$171.8m<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Blended \"CAC\" (marketing ÷ new)<\u002Fsc-raw-td><sc-raw-td>~£9<\u002Fsc-raw-td><sc-raw-td>~$25<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>CAC honesty.<\u002Fstrong> The naïve £53.8m ÷ 5.9m ≈ <strong>£9<\u002Fstrong> blended figure is <em>not<\u002Fem> a true CAC because it spreads paid spend across all new customers, most of whom arrive organically. Word-of-mouth is reported at <strong>~70% of customer growth<\u002Fstrong> (company claim; ~66% in FY2023). The correct framing: paid CAC applies only to the paid-acquired minority (~30%); attributing all marketing to that minority gives paid CAC ≈ £53.8m ÷ (0.30 × 5.9m) ≈ <strong>£30<\u002Fstrong>. Even at £30, against revenue/customer of ~£87 and multi-year retention, payback is well under one year.<\u002Fp>\n<p><strong>LTV (illustrative, labelled) <span class=\"ev ev-soft\">HYPOTHESIS — Wise discloses no LTV/retention curves<\u002Fspan>.<\u002Fstrong> Using revenue/active customer ~£87, ~55% blended contribution (transaction + interest), and a 5-year average life with modest revenue retention: LTV ≈ £87 × 0.55 × ~4 (discounted life) ≈ <strong>~£190<\u002Fstrong>. Against paid CAC ~£30, LTV/CAC ≈ <strong>6x<\u002Fstrong>; against blended CAC ~£9, &gt;20x. Sensitivity: at a 3-year life LTV/CAC (paid) ≈ 4x; at 7-year ≈ 8x.<\u002Fp>\n<h3 id=\"iv-8-customer-cohort-economics\"><span class=\"num\">IV.8<\u002Fspan><span>Customer Cohort Economics<\u002Fspan><\u002Fh3>\n<ul>\n<li><strong>Multi-product adoption:<\u002Fstrong> ~50% of personal and ~60% of business customers use more than one product (FY2025).<\u002Fli>\n<li><strong>Card-only cohort:<\u002Fstrong> ~20% of active personal customers (Q4 FY2025), up from ~3% in Q1 FY2021 — low cross-border VPC (£500–£1,000/q) but high card engagement and retention.<\u002Fli>\n<li><strong>Balances compound:<\u002Fstrong> customer holdings grew ~5.7x over four years, from £2bn (FY2020) to $39bn (FY2026), evidencing the shift from transactional remittance to a recurring financial account.<\u002Fli>\n<li><strong>Business stickiness:<\u002Fstrong> business balances ($11.2bn) fund payroll/supplier/hedging and are stickier than personal.<\u002Fli>\n<\u002Ful>\n<p><strong>Economic character.<\u002Fstrong> Wise is a <strong>hybrid<\u002Fstrong>: (a) transactional remittance at the cross-border core; (b) a recurring financial account (balances + card + interest); (c) an infrastructure usage model (Wise Platform). The trajectory is decisively toward (b) and (c) — balance-driven and recurring lines now fund ~half of net revenue and carry higher retention and margin.<\u002Fp>\n<h3 id=\"iv-9-income-statement-teardown-us-gaap-fy2026\"><span class=\"num\">IV.9<\u002Fspan><span>Income Statement Teardown (US GAAP, FY2026)<\u002Fspan><\u002Fh3>\n<ul>\n<li><strong>Transaction revenue $1,893.6m:<\u002Fstrong> customer-/transaction-driven; recurring at the account level; ~58% contribution; highly scalable.<\u002Fli>\n<li><strong>Interest income $806.1m:<\u002Fstrong> balance- and rate-driven; near-zero direct cost; only +6% in FY2026 despite +36% balances, because average gross yield fell 3.9% → 3.0%.<\u002Fli>\n<li><strong>Interest expense to customers $196.9m:<\u002Fstrong> balance-/framework-driven; will rise as Wise resolves regulatory barriers to paying the target 80%.<\u002Fli>\n<li><strong>Transaction expense $513.6m:<\u002Fstrong> variable; distorted by the $70m one-off FX item.<\u002Fli>\n<li><strong>Technology $434.3m, Servicing $396.6m, Marketing $171.8m, G&amp;A $381.9m:<\u002Fstrong> step-fixed / semi-variable / discretionary. Ex-one-offs, operating expenses grew ~17% versus net revenue +19%, so underlying operating leverage is positive but deliberately reinvested.<\u002Fli>\n<li><strong>Operating leverage evidence:<\u002Fstrong> IBT margin fell 37% → 34.2% → 26.4% (FY2024→FY2026), but this is <strong>deliberate reinvestment plus rate compression<\u002Fstrong>, not deteriorating economics.<\u002Fli>\n<\u002Ful>\n<p><strong>Statutory vs adjusted.<\u002Fstrong> Under IFRS, \"underlying\" PBT (revenue + first-1% interest, excluding interest above 1% and benefits paid) versus \"reported\" PBT differed sharply: FY2025 underlying PBT £282.1m vs reported PBT £564.8m — the £282.7m gap being retained interest above the first 1% not returned to customers. US GAAP abolishes the \"underlying\" APM; the same economics reappear as the gap between the 15–20% target IBT margin and the 20–25% \"over-earning\" margin.<\u002Fp>\n<h3 id=\"iv-10-balance-sheet-teardown-us-gaap-31-march-2026-m-confirm\"><span class=\"num\">IV.10<\u002Fspan><span>Balance Sheet Teardown (US GAAP, 31 March 2026, $m) <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Item<\u002Fsc-raw-th><sc-raw-th>FY2026<\u002Fsc-raw-th><sc-raw-th>FY2025<\u002Fsc-raw-th><sc-raw-th>Nature<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Cash &amp; cash equivalents<\u002Fsc-raw-td><sc-raw-td>27,802.2<\u002Fsc-raw-td><sc-raw-td>18,066.3<\u002Fsc-raw-td><sc-raw-td>Incl. $14,824.1m safeguarded customer funds<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Available-for-sale debt securities<\u002Fsc-raw-td><sc-raw-td>4,582.7<\u002Fsc-raw-td><sc-raw-td>6,013.6<\u002Fsc-raw-td><sc-raw-td>Customer-fund investments<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Accounts receivable<\u002Fsc-raw-td><sc-raw-td>391.3<\u002Fsc-raw-td><sc-raw-td>347.8<\u002Fsc-raw-td><sc-raw-td>Settlement in transit<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Total current assets<\u002Fsc-raw-td><sc-raw-td>32,980.6<\u002Fsc-raw-td><sc-raw-td>24,550.7<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Property, plant &amp; equipment<\u002Fsc-raw-td><sc-raw-td>189.9<\u002Fsc-raw-td><sc-raw-td>150.8<\u002Fsc-raw-td><sc-raw-td>Offices, equipment<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Total assets<\u002Fsc-raw-td><sc-raw-td>33,259.8<\u002Fsc-raw-td><sc-raw-td>24,781.1<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Funds payable &amp; due to customers<\u002Fsc-raw-td><sc-raw-td>30,254.2<\u002Fsc-raw-td><sc-raw-td>22,279.9<\u002Fsc-raw-td><sc-raw-td>Customer liability (Wise Accounts)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Short-term debt<\u002Fsc-raw-td><sc-raw-td>6.0<\u002Fsc-raw-td><sc-raw-td>128.4<\u002Fsc-raw-td><sc-raw-td>RCF<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Long-term debt<\u002Fsc-raw-td><sc-raw-td>328.7<\u002Fsc-raw-td><sc-raw-td>0.0<\u002Fsc-raw-td><sc-raw-td>New debt issuance FY2026<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Total liabilities<\u002Fsc-raw-td><sc-raw-td>31,334.6<\u002Fsc-raw-td><sc-raw-td>23,043.7<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Treasury stock<\u002Fsc-raw-td><sc-raw-td>(422.8)<\u002Fsc-raw-td><sc-raw-td>(85.0)<\u002Fsc-raw-td><sc-raw-td>Employee Share Trust purchases<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Retained earnings<\u002Fsc-raw-td><sc-raw-td>2,111.1<\u002Fsc-raw-td><sc-raw-td>1,655.9<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Total shareholders' equity<\u002Fsc-raw-td><sc-raw-td>1,925.2<\u002Fsc-raw-td><sc-raw-td>1,737.4<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Why the balance sheet looks large.<\u002Fstrong> Of $33.3bn total assets, $30.3bn is customer money (funds payable). Shareholder equity is only <strong>$1.9bn<\u002Fstrong>. The balance sheet is inflated by customer funds recognised as both an asset (safeguarded cash/investments) and an offsetting liability (funds due to customers), because Wise concludes it controls the economic benefit of the cash flows and has no enforceable right of set-off. This does <strong>not<\u002Fstrong> represent shareholder capital at risk in a lending sense — Wise does not lend customer money.<\u002Fp>\n<h3 id=\"iv-11-customer-funds\"><span class=\"num\">IV.11<\u002Fspan><span>Customer Funds<\u002Fspan><\u002Fh3>\n<h4 id=\"table-11-safeguarding-composition-confirmed-fact\">Table 11 — Safeguarding composition <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fh4>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Asset class<\u002Fsc-raw-th><sc-raw-th>FY2026 ($m)<\u002Fsc-raw-th><sc-raw-th>FY2025 ($m)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Cash in segregated safeguarding accounts / term deposits<\u002Fsc-raw-td><sc-raw-td>14,824.1<\u002Fsc-raw-td><sc-raw-td>7,503.0<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Money market funds (MMFs)<\u002Fsc-raw-td><sc-raw-td>7,592.1<\u002Fsc-raw-td><sc-raw-td>7,034.4<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Investment-grade fixed income (govt/treasury)<\u002Fsc-raw-td><sc-raw-td>4,582.7 (AFS)<\u002Fsc-raw-td><sc-raw-td>6,013.6<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>UK safeguarding via Comparable Guarantee<\u002Fsc-raw-td><sc-raw-td>1,119.1 (£845.0m)<\u002Fsc-raw-td><sc-raw-td>~690 (£520.0m)<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Follow-the-money.<\u002Fstrong> Customer money is legally the customer's; Wise holds it in segregated safeguarding accounts by entity — Wise Payments Ltd (UK: Barclays, Citibank, JPMorgan, Deutsche Bank, Hamburg Commercial Bank, Bank of America), Wise Europe SA (JPMorgan + BlackRock/State Street MMFs, regulated by the National Bank of Belgium), and Wise US Inc (Goldman Sachs Bank USA, JPMorgan). It is <strong>not<\u002Fstrong> covered by FSCS or FDIC deposit insurance (except US interest-opt-in pass-through up to $250k). Wise may <strong>not<\u002Fstrong> lend it and may invest only in permitted liquid assets (US: max 2-year single-bond maturity, ≤1-year portfolio duration). On insolvency, safeguarded funds are ring-fenced for customers.<\u002Fp>\n<p><strong>The Comparable Guarantee is a liquidity-financing instrument.<\u002Fstrong> Under FCA safeguarding rules Wise may protect UK customer money by holding secure liquid assets <strong>or<\u002Fstrong> by a \"comparable guarantee given by authorised insurers.\" Entered in FY2025 at £520m and expanded to <strong>£845.0m / $1,119.1m<\u002Fstrong> by 31 March 2026, this arrangement lets an authorised insurer guarantee an amount of customer funds, freeing Wise to deploy that customer money into its own customer network for operational liquidity/prefunding rather than parking it in safeguarding accounts. Economically it converts trapped safeguarding cash into working liquidity, substituting an insurance premium for tied-up corporate cash — a genuine financial innovation with direct relevance to capital (IV.14). (Exact surety count and term are disclosed by Wise but were not independently re-confirmed in this review.)<\u002Fp>\n<h4 id=\"money-flow-map-four-distinct-pools\">Money-flow map (four distinct pools)<\u002Fh4>\n<p>``<code> CUSTOMER MONEY (~$30.3bn)      → segregated safeguarding; customer-owned; Wise earns interest, cannot lend ├─ cash in banks   $14.8bn ├─ MMFs            $7.6bn ├─ IG fixed income $4.6bn └─ freed via Comparable Guarantee $1.1bn → operational liquidity WISE CORPORATE MONEY (~$1.9bn) → shareholder cash; RCF + debt; funds investment/buybacks REGULATORY CAPITAL (£1.41bn)   → CET1 own funds; must exceed £293.4m requirement SETTLEMENT LIQUIDITY           → prefunding across direct-rail markets + BoE Faster Payments collateral <\u002Fcode>``<\u002Fp>\n<h3 id=\"iv-12-interest-income\"><span class=\"num\">IV.12<\u002Fspan><span>Interest Income<\u002Fspan><\u002Fh3>\n<h4 id=\"table-12-interest-income-mechanics-confirmed-fact\">Table 12 — Interest income mechanics <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fh4>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Item<\u002Fsc-raw-th><sc-raw-th>FY2025 (IFRS £m)<\u002Fsc-raw-th><sc-raw-th>FY2026 (US GAAP $m)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Gross interest income on customer balances<\u002Fsc-raw-td><sc-raw-td>594.3<\u002Fsc-raw-td><sc-raw-td>806.1<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>— cash at banks<\u002Fsc-raw-td><sc-raw-td>220.6<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>— money market funds<\u002Fsc-raw-td><sc-raw-td>202.4<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>— listed bonds<\u002Fsc-raw-td><sc-raw-td>171.3<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Interest expense / benefits paid to customers<\u002Fsc-raw-td><sc-raw-td>161.2<\u002Fsc-raw-td><sc-raw-td>196.9<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Average gross yield on balances<\u002Fsc-raw-td><sc-raw-td>~3.9%<\u002Fsc-raw-td><sc-raw-td>~3.0%<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Rate sensitivity (per 25bp move)<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>~$40m/yr<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>The interest framework (mechanism).<\u002Fstrong> Wise retains the <strong>first 1%<\u002Fstrong> of yield on customer balances to fund Wise-Account operating costs. On yield <strong>above 1%<\u002Fstrong>, the framework splits <strong>20% retained / 80% available to customers<\u002Fstrong>. In pr
