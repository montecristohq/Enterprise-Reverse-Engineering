, both ends direct rail)<\u002Fh4>\n<ul>\n<li><strong>A:<\u002Fstrong> Sender in Germany pays EUR; recipient in UK gets GBP; sees mid-market rate, upfront fee, often \"instant.\"<\u002Fli>\n<li><strong>B:<\u002Fstrong> EUR moves domestically from sender's bank to Wise's EUR account (SEPA / SEPA Instant); GBP moves domestically from Wise's GBP account to the recipient via UK Faster Payments. No EUR or GBP crosses a border for this transaction.<\u002Fli>\n<li><strong>C:<\u002Fstrong> Wise Europe SA's EUR pool credited; Wise Payments Ltd's GBP pool debited; internal FX conversion booked at wholesale rate; the two legs linked by a single ledger transaction ID.<\u002Fli>\n<li><strong>D:<\u002Fstrong> Wise's EUR safeguarding account (JPMorgan Chase is the named EU-cash bank per Volume I) receives; Wise's GBP account / Bank of England settlement account pays.<\u002Fli>\n<li><strong>E:<\u002Fstrong> Inbound SEPA / SEPA Instant; outbound UK Faster Payments (Wise is a direct participant with a Bank of England settlement account).<\u002Fli>\n<li><strong>F:<\u002Fstrong> Wise recognises fee revenue on conversion; the spread between the customer mid-market rate and wholesale execution is a treasury item; the customer balance is a liability throughout.<\u002Fli>\n<li><strong>Cross-border reality:<\u002Fstrong> ~0% for this transaction; periodic rebalancing only. <span class=\"ev\">ANALYTICAL INFERENCE + CONFIRMED FACT on rail access<\u002Fspan><\u002Fli>\n<\u002Ful>\n<h4 id=\"corridor-2-gbp-usd\">Corridor 2 — GBP → USD<\u002Fh4>\n<p>Inbound GBP via Faster Payments to Wise UK; outbound USD via US rails (ACH / wire) from Wise US Inc's USD account. Sender-contracting entity = Wise Payments Ltd (UK); payout entity = Wise US Inc. Internal ledger links the legs; the USD pool depletes over time and needs rebalancing.<\u002Fp>\n<h4 id=\"corridor-3-usd-eur\">Corridor 3 — USD → EUR<\u002Fh4>\n<p>Inbound USD via ACH to Wise US; outbound EUR via SEPA from Wise Europe SA — the reverse of Corridor 1's dollar leg.<\u002Fp>\n<h4 id=\"corridor-4-africa-emerging-market-payout-ngn-status\">Corridor 4 — Africa / emerging-market payout (NGN status)<\u002Fh4>\n<ul>\n<li><strong>NGN caveat (per prompt):<\u002Fstrong> Wise's NGN history is stop-start — naira payouts launched 2015, suspended May 2016, resumed October 2017, suspended 2020, USD-to-Nigeria suspended November 2022, and NGN payouts resumed 2024 after the Central Bank of Nigeria's January 2024 directive requiring remittances be paid in naira (to bank accounts, or cash below the $200 equivalent). As of 2026 Wise supports <strong>sending to Nigeria in NGN<\u002Fstrong> (recipient credited in naira \"directly from Wise's local bank account\"), but **NGN is not a supported <em>sending<\u002Fem> currency** and Wise does not offer NGN balances/cards to Nigerian-resident users. <span class=\"ev\">CONFIRMED FACT — Wise send-money page + Tekedia / Fintech Magazine Africa<\u002Fspan> Why NGN is hard: FX scarcity, repeated regulatory reversals, inability to source true mid-market liquidity, and reliance on local partners. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li><strong>Six-layer:<\u002Fstrong> Sender pays USD/GBP/EUR domestically; Wise converts; the NGN payout is made locally through a Nigerian partner/liquidity arrangement to the recipient's bank account. The inbound leg never reaches Nigeria; only the NGN payout is local.<\u002Fli>\n<\u002Ful>\n<h4 id=\"corridor-5-usd-inr-regulatorily-distinctive\">Corridor 5 — USD → INR (regulatorily distinctive)<\u002Fh4>\n<ul>\n<li><strong>Inward to India<\u002Fstrong> runs under RBI's cross-border regime. <strong>Wise Payments India Private Limited<\u002Fstrong> holds RBI <strong>Payment Aggregator – Cross-Border (PA-CB Inward)<\u002Fstrong> authorisation (in-principle June 2025) for business receipts; historically Wise UK worked with <strong>local partner banks in India<\u002Fstrong> — e.g. <strong>IndusInd Bank's \"Indus Fast Remit\"<\u002Fstrong> platform, integrated via Wise Platform from June 2023 (Wise's first India partner) — to deliver inward remittances with RBI approval. <strong>Vaho Forex Private Limited<\u002Fstrong> holds RBI <strong>Authorised Dealer Category II (AD-II)<\u002Fstrong> for <strong>outward<\u002Fstrong> remittance and forex cards. <span class=\"ev\">CONFIRMED FACT — Wise regulatory page + IndusInd/PRNewswire<\u002Fspan><\u002Fli>\n<li><strong>Purpose codes:<\u002Fstrong> every inbound INR credit must carry an RBI purpose code (e.g. family maintenance, P0802 software services, P1002 commissions); Wise builds purpose-code selection into the flow. <span class=\"ev\">CONFIRMED FACT — Wise India blog<\u002Fspan><\u002Fli>\n<li><strong>Payout rails:<\u002Fstrong> INR delivered to bank accounts (including NRE/NRO) or UPI IDs via India's domestic rails (IMPS/NEFT and UPI). <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li><strong>Outward from India:<\u002Fstrong> operationalised under AD-II in FY2025, removing the historical ~US$5,000 per-transaction cap; per-transaction limit later ~₹25 lakh (~$30,000) after the June 2025 PA-CB approval; subject to LRS and permitted-purpose constraints (education, travel, medical). <span class=\"ev\">CONFIRMED FACT — FY2025 report + third-party<\u002Fspan><\u002Fli>\n<li><strong>Six-layer:<\u002Fstrong> Sender in the US pays USD domestically to Wise US; Wise converts USD→INR; the INR payout is made locally in India via partner/rails to the beneficiary. Documentation (purpose code and beneficiary details for inward; LRS declarations for outward) is required.<\u002Fli>\n<\u002Ful>\n<h4 id=\"corridor-6-wise-business-payment-batch\">Corridor 6 — Wise Business payment (batch)<\u002Fh4>\n<p>An SME uploads a file of ≤1,000 payees; each payment is a discrete transfer object priced individually; funding is one debit from the business's Wise balance; each payout routes to the cheapest local rail. The ledger books each leg; reconciliation is by transfer ID.<\u002Fp>\n<h4 id=\"corridors-7-9-card-purchase-atm-withdrawal-wise-platform-tra\">Corridors 7–9 — card purchase, ATM withdrawal, Wise Platform transaction — see II.11 and II.13.<\u002Fh4>\n<h3 id=\"ii-6-transaction-teardown-representative-eur-gbp-18-steps\"><span class=\"num\">II.6<\u002Fspan><span>Transaction Teardown (representative EUR→GBP, ~18 steps)<\u002Fspan><\u002Fh3>\n<ol>\n<li>Sender initiates; the <strong>Quote API<\u002Fstrong> returns a locked mid-market rate + fee (30-min validity). <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li>Sender selects recipient; recipient added to quote (fees, delivery estimate, payout network confirmed).<\u002Fli>\n<li>Sender funds via SEPA / SEPA Instant into Wise Europe SA's EUR account. Transfer state = <code>incoming_payment_waiting<\u002Fcode>. <span class=\"ev\">CONFIRMED FACT — Wise API<\u002Fspan><\u002Fli>\n<li>Funds arrive; state → <code>processing<\u002Fcode>; <strong>the exchange rate locks and the transfer can no longer be cancelled via API.<\u002Fstrong> <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li><strong>KYC status<\u002Fstrong> confirmed (already-verified sender).<\u002Fli>\n<li><strong>Sanctions screening<\u002Fstrong> on sender, recipient, and payment.<\u002Fli>\n<li><strong>Transaction monitoring / fraud scoring<\u002Fstrong> (Wise: \"Processing… means we're doing behind-the-scene activities before the money gets sent to the recipient, such as AML, compliance and fraud checks\"). <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li>On pass, state → <code>funds_converted<\u002Fcode> (FX booked source→target). <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li>The <strong>Treasury Ledger<\u002Fstrong> posts double-entry: EUR pool +, GBP pool −, at wholesale rate, \"calculating our assets and liabilities with unwavering accuracy and in real time\" and feeding \"trading teams to manage foreign exchange exposure risks and to ensure each entity has enough liquidity.\" <span class=\"ev\">CONFIRMED FACT — Wise Treasury Ledger engineering job specs<\u002Fspan><\u002Fli>\n<li>Liquidity check on the GBP pool; payout initiated.<\u002Fli>\n<li>Outbound GBP via <strong>UK Faster Payments<\u002Fstrong> from Wise's settlement account. State → <code>outgoing_payment_sent<\u002Fcode> — \"the final state… it doesn't mean the money has arrived in the recipient's bank account, just that we have sent it from ours.\" <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li>Recipient's bank credits recipient (often &lt;20s).<\u002Fli>\n<li><strong>Notification<\u002Fstrong> to sender and (if email given) recipient.<\u002Fli>\n<li><strong>Reconciliation:<\u002Fstrong> ledger postings matched to bank-statement lines / payment-system position (events reconciled by <code>occurred_at<\u002Fcode> since ordering isn't guaranteed). <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li><strong>Fee<\u002Fstrong> recognised as revenue; <strong>FX spread<\u002Fstrong> recognised as treasury income/cost.<\u002Fli>\n<li><strong>Third-party cost:<\u002Fstrong> rail fees (Faster Payments marginal cost is very low), any partner cost.<\u002Fli>\n<li><strong>Failure branches:<\u002Fstrong> <code>bounced_back<\u002Fcode> (wrong details) → redelivery or <code>funds_refunded<\u002Fcode>; <code>charged_back<\u002Fcode> (pay-in problem, \"can happen from any other state\"); <code>cancelled<\u002Fcode> (never funded). Rollback transitions supported. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li><strong>Counterparty / liquidity risk<\u002Fstrong> borne by Wise on its pools and safeguarding banks; the customer bears authorised push-payment fraud risk.<\u002Fli>\n<\u002Fol>\n<p>The full Wise API happy-path state chain is <code>incoming_payment_waiting → processing → funds_converted → outgoing_payment_sent<\u002Fcode>, with the unhappy path <code>outgoing_payment_sent → bounced_back → processing → cancelled → funds_refunded<\u002Fcode>, plus <code>charged_back<\u002Fcode> and <code>unknown<\u002Fcode>. <span class=\"ev\">CONFIRMED FACT — Wise API docs<\u002Fspan><\u002Fp>\n<h3 id=\"ii-7-local-payment-rail-architecture\"><span class=\"num\">II.7<\u002Fspan><span>Local Payment-Rail Architecture<\u002Fspan><\u002Fh3>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Rail<\u002Fsc-raw-th><sc-raw-th>Access type<\u002Fsc-raw-th><sc-raw-th>Entity / mechanism<\u002Fsc-raw-th><sc-raw-th>Significance<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>UK Faster Payments<\u002Fsc-raw-td><sc-raw-td><strong>Direct<\u002Fstrong> participant since 2018 — first non-bank, with a Bank of England RTGS settlement account<\u002Fsc-raw-td><sc-raw-td>Wise Payments Ltd<\u002Fsc-raw-td><sc-raw-td>Instant GBP in/out; foundational<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>CHAPS<\u002Fsc-raw-td><sc-raw-td>Indirect / via BoE where needed<\u002Fsc-raw-td><sc-raw-td>Wise Payments Ltd<\u002Fsc-raw-td><sc-raw-td>High-value GBP<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>SEPA / SEPA Instant<\u002Fsc-raw-td><sc-raw-td>Access in EEA<\u002Fsc-raw-td><sc-raw-td>Wise Europe SA<\u002Fsc-raw-td><sc-raw-td>EUR in/out<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Hungary (MNB instant)<\u002Fsc-raw-td><sc-raw-td>Direct (2020)<\u002Fsc-raw-td><sc-raw-td>Wise Europe SA<\u002Fsc-raw-td><sc-raw-td>First non-bank in HU<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Singapore FAST<\u002Fsc-raw-td><sc-raw-td>Direct<\u002Fsc-raw-td><sc-raw-td>Wise Asia-Pacific<\u002Fsc-raw-td><sc-raw-td>SGD instant<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Australia NPP<\u002Fsc-raw-td><sc-raw-td>Direct<\u002Fsc-raw-td><sc-raw-td>Wise Australia<\u002Fsc-raw-td><sc-raw-td>AUD instant<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Philippines InstaPay / PesoNet<\u002Fsc-raw-td><sc-raw-td>Direct (2024)<\u002Fsc-raw-td><sc-raw-td>Local arrangement<\u002Fsc-raw-td><sc-raw-td>PHP instant — sixth direct connection<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Brazil Pix<\u002Fsc-raw-td><sc-raw-td>Direct (approval FY2025, live)<\u002Fsc-raw-td><sc-raw-td>Wise Brasil<\u002Fsc-raw-td><sc-raw-td>BRL instant<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Japan Zengin<\u002Fsc-raw-td><sc-raw-td>Direct (first non-bank approval FY2025)<\u002Fsc-raw-td><sc-raw-td>Wise Payments Japan<\u002Fsc-raw-td><sc-raw-td>JPY<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Malaysia PayNet<\u002Fsc-raw-td><sc-raw-td>Direct<\u002Fsc-raw-td><sc-raw-td>Local arrangement<\u002Fsc-raw-td><sc-raw-td>MYR<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>US ACH / Fedwire / RTP / FedNow<\u002Fsc-raw-td><sc-raw-td><strong>Indirect<\u002Fstrong> via CFSB / partner banks<\u002Fsc-raw-td><sc-raw-td>Wise US Inc + CFSB<\u002Fsc-raw-td><sc-raw-td>USD — no direct Fed access<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>India IMPS / NEFT / UPI<\u002Fsc-raw-td><sc-raw-td><strong>Indirect<\u002Fstrong> via partner banks<\u002Fsc-raw-td><sc-raw-td>Wise India / Vaho / partners<\u002Fsc-raw-td><sc-raw-td>INR payout<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Canada<\u002Fsc-raw-td><sc-raw-td>Payments Canada member (for the upcoming Real-Time Rail)<\u002Fsc-raw-td><sc-raw-td>Wise entity<\u002Fsc-raw-td><sc-raw-td>Prospective<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Direct-connection count is a moving target.<\u002Fstrong> The FY2025 report says the Philippines was \"our sixth direct integration to date\" and that Brazil Pix and Japan Zengin \"will increase our direct connections to eight once live\"; some marketing materials still cite \"5 direct connections.\" <span class=\"ev\">CONFIRMED FACT — disagreement reflects timing<\u002Fspan> <strong>Do not infer direct access from the ability to pay a market<\u002Fstrong> — most markets are reached via partners/local pools. <span class=\"ev\">CONFIRMED — prompt discipline<\u002Fspan><\u002Fp>\n<p>Faster Payments mechanics: as a directly connected settling participant, Wise holds a Bank of England settlement account and prefunds cash to cover its maximum possible net debit position — which is why it can settle GBP without a sponsor bank and capture the marginal-cost advantage. Wise was the first non-bank PSP granted a BoE RTGS settlement account (2018), a change enabled by the 2017 opening of RTGS to non-banks. <span class=\"ev\">CONFIRMED FACT — Pay.UK / Bank of England / UK Finance / Forbes<\u002Fspan><\u002Fp>\n<h3 id=\"ii-8-wise-s-cross-border-network\"><span class=\"num\">II.8<\u002Fspan><span>Wise's Cross-Border Network<\u002Fspan><\u002Fh3>\n<p><strong>Traditional correspondent banking (baseline):<\u002Fstrong> a payment hops through multiple nostro/vostro-holding banks over SWIFT; each hop adds fees, an FX markup, delay, and opacity. Wise replaces the multi-hop chain with <strong>two synchronized domestic payments<\u002Fstrong> linked by an internal ledger.<\u002Fp>\n<p><strong>Wise architecture components:<\u002Fstrong> local collection accounts; local payout accounts; prefunded local currency pools; internal matching/netting; treasury rebalancing; residual correspondent usage for thin corridors; direct payment-system connectivity in up to 8 markets; liquidity buffers; safeguarding accounts; operational reconciliation. Wise cites \"50+ local liquidity partners\" and \"90+ banking partners.\" <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>Answers to the prompt's network questions:<\u002Fstrong><\u002Fp>\n<ul>\n<li><strong>What actually crosses a border?<\u002Fstrong> For an individual transaction on a well-covered corridor, essentially nothing — both legs are domestic. Cross-border movement occurs only in periodic bulk <strong>rebalancing<\u002Fstrong>. <span class=\"ev\">ANALYTICAL INFERENCE, strongly supported<\u002Fspan><\u002Fli>\n<li><strong>When can Wise satisfy both sides from local pools?<\u002Fstrong> When corridor flows are roughly balanced or the target pool has liquidity (GBP-EUR, USD-CAD are near-symmetric). <span class=\"ev\">THIRD-PARTY ESTIMATE<\u002Fspan><\u002Fli>\n<li><strong>When must funds move internationally?<\u002Fstrong> When a pool is structurally depleted by one-directional flow (e.g. net-outbound remittance corridors), requiring wholesale FX + international funding to top up.<\u002Fli>\n<li><strong>What creates rebalancing needs?<\u002Fstrong> Net directional imbalance in a corridor.<\u002Fli>\n<li><strong>How does scale affect matching?<\u002Fstrong> Higher volume raises the probability of internal offset and reduces the share of flow needing external FX/rebalancing — a genuine scale economy that lowers unit cost, which Wise recycles into lower prices. Evidence: the take rate fell from 0.67% to 0.53% in Q4 FY2025 (Wise's CEO letter: \"this year, our global take rate reduced from 0.67% to 0.53% in Q4 FY2025 — our lowest to date\"), then to ~0.52% by Q1 FY2026 and averaged ~52bps for FY2026. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li><strong>Where does Wise still depend on correspondents?<\u002Fstrong> Thin/illiquid or tightly regulated corridors (parts of Africa, some emerging markets), and USD, where it relies on CFSB and partner banks.<\u002Fli>\n<\u002Ful>\n<h3 id=\"ii-9-fx-engine\"><span class=\"num\">II.9<\u002Fspan><span>FX Engine<\u002Fspan><\u002Fh3>\n<p><strong>Five-way rate decomposition (per prompt):<\u002Fstrong><\u002Fp>\n<ol>\n<li><strong>Reference/mid-market rate<\u002Fstrong> — the midpoint of interbank buy/sell. Wise states it sources this from \"multiple independent rate providers,\" updated in real time during market hours, to 6 significant digits (rounding the 7th digit ≥5 up). <span class=\"ev\">CONFIRMED FACT — Wise Help Centre<\u002Fspan> Wise does <strong>not<\u002Fstrong> name a specific vendor (Reuters/Bloomberg). <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan><\u002Fli>\n<li><strong>Customer quoted rate<\u002Fstrong> = the mid-market rate (no markup) — Wise's core promise.<\u002Fli>\n<li><strong>Explicit fee<\u002Fstrong> = fixed + variable %, shown upfront.<\u002Fli>\n<li><strong>Wholesale execution rate<\u002Fstrong> — the rate at which Wise actually converts/holds inventory.<\u002Fli>\n<li><strong>Wise's realized economic spread<\u002Fstrong> = the gap between wholesale execution and the customer mid-market rate, plus net treasury gains/losses on inventory.<\u002Fli>\n<\u002Fol>\n<p><strong>Operational meaning of \"mid-market rate\":<\u002Fstrong> it is not a marketing abstraction but a real, externally verifiable benchmark Wise commits to give customers, monetising via the visible fee rather than a hidden spread. This is the structural reason Wise is cheaper than banks: its cost is the visible fee, whereas banks bury a 2–5% markup in the rate. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>Rate refresh &amp; lock:<\u002Fstrong> the public converter refreshes roughly every 60 seconds; a transaction quote locks for ~30 minutes; a 5% adverse-move safeguard auto-cancels unfunded transfers (\"If the mid-market rate drops by 5% or more before we receive your funds, we will automatically cancel and refund your transfer\"). The market closes Friday 5pm New York and reopens Monday 9am Auckland. <span class=\"ev\">CONFIRMED FACT — Wise Help Centre<\u002Fspan><\u002Fp>\n<p><strong>Treasury, exposure &amp; hedging:<\u002Fstrong> the Treasury Ledger feeds trading teams that \"manage foreign exchange exposure risks\" and \"ensure each entity has enough liquidity.\" <span class=\"ev\">CONFIRMED FACT — Wise engineering job specs<\u002Fspan> Wise's US Form 20-F confirms exposure to FX and interest-rate market risk and mitigation \"through financial hedges or collateralization.\" <span class=\"ev\">CONFIRMED FACT — Wise Group plc 20-F draft<\u002Fspan> Internal matching/netting reduces net open exposure; residual exposure is short-duration and hedged. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan> A discrete FX-trading P&amp;L line is not separately disclosed in preliminary results. <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan><\u002Fp>\n<h3 id=\"ii-10-the-wise-account-legal-economic-model\"><span class=\"num\">II.10<\u002Fspan><span>The Wise Account — Legal &amp; Economic Model<\u002Fspan><\u002Fh3>\n<p><strong>What it legally is:<\u002Fstrong> an <strong>e-money / payment account<\u002Fstrong>, NOT a bank deposit. In the UK the contract is with <strong>Wise Payments Ltd<\u002Fstrong> (FCA-authorised EMI, FRN 900507), governed by English law. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>Why it looks bank-like but isn't:<\u002Fstrong> it offers local account details (IBAN, sort code, US routing/account number), a debit card, direct debits, and multi-currency balances — but Wise <strong>does not lend out<\u002Fstrong> customer money. Instead it <strong>safeguards<\u002Fstrong>: 100% of customer funds held separately from Wise's own money. Wise's own framing: \"We don't lend out your money. Banks do… Because we're not lending your money, we handle it differently by safeguarding it.\" <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>Follow-the-money — safeguarding structure:<\u002Fstrong> roughly ~60% in secure liquid assets (government securities/MMFs) and ~40% cash at banks (Volume-I figure). The UK entity's named safeguarding institutions: Barclays Bank PLC (cash + secure liquid assets), Citibank N.A., JPMorgan Chase Bank N.A., Deutsche Bank AG London, Hamburg Commercial Bank, Bank of America. <span class=\"ev\">CONFIRMED FACT — Wise UK safeguarding disclosure<\u002Fspan> Assets/Interest money (Wise Assets UK Ltd) is held differently as investment products, with distinct FSCS treatment. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>Deposit insurance:<\u002Fstrong> <strong>No FSCS/FDIC deposit insurance<\u002Fstrong> on Wise balances (they are e-money, not deposits). US customers may receive <strong>FDIC pass-through<\u002Fstrong> insurance where funds sit at FDIC-insured partner banks under specific conditions. <span class=\"ev\">CONFIRMED FACT — Wise blogs<\u002Fspan> On insolvency, safeguarded funds are ring-fenced from Wise's creditors; an administrator returns them to customers, typically over weeks, with no top-up if a shortfall arises inside the pool. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>Customer holdings scale:<\u002Fstrong> £21.5bn customer holdings FY2025 (incl. £4.5bn Assets under custody); Wise states \"As of 30 June 2025, our customers are trusting us with the equivalent of 18.1 billion GBP in their Wise accounts.\" FY2026: $39bn customer holdings, of which ~$9bn in Wise Assets (Volume I). <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<h3 id=\"ii-11-wise-card-transaction-teardown\"><span class=\"num\">II.11<\u002Fspan><span>Wise Card — Transaction Teardown<\u002Fspan><\u002Fh3>\n<p><strong>Issuance &amp; network:<\u002Fstrong> In the US the card is issued by <strong>Community Federal Savings Bank (CFSB), member FDIC, under licence from Mastercard International<\u002Fstrong>; you must hold a Wise Account with a ≥$20 balance to obtain a card; the Cardholder Agreement (v2.2, last updated 21 August 2025) is between the customer and CFSB, with Wise providing servicing \"on behalf of CFSB.\" <span class=\"ev\">CONFIRMED FACT<\u002Fspan> Elsewhere Wise issues via Mastercard/Visa programs through regional BIN sponsorship. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>Processing:<\u002Fstrong> Wise built the <strong>world's first cloud-based card processing<\u002Fstrong> (AWS/Kubernetes microservices), moving processing in-house to shorten the message chain and cut per-transaction cost. Its services cover card ordering, authorization, and scheme settlement; a \"Mastercard connector\" normalises scheme messages into a unified Wise interface. <span class=\"ev\">CONFIRMED FACT — Wise Engineering; Kravtsov, Weiming, Menon; Sep 2022<\u002Fspan><\u002Fp>\n<p><strong>Authorization + balance-check + conversion waterfall:<\u002Fstrong><\u002Fp>\n<ol>\n<li>Terminal → acquirer → scheme (Mastercard/Visa) → Wise (as processor/issuer via CFSB in the US).<\u002Fli>\n<li>Wise checks the available balance in the transaction currency.<\u002Fli>\n<li><strong>Currency selection logic:<\u002Fstrong> if the customer holds enough of the spending currency, no conversion (free). If not, \"smart conversion\" converts from the balance carrying the <strong>lowest possible fee<\u002Fstrong>, at the mid-market rate. <span class=\"ev\">CONFIRMED FACT — Wise Help/AU blog<\u002Fspan><\u002Fli>\n<li>Fraud/limit checks; approve/decline flows back to the terminal in seconds.<\u002Fli>\n<li>Customers are advised to always pay in the <strong>local currency<\u002Fstrong> to avoid merchant dynamic currency conversion (DCC). Independent research (German consumer group Stiftung Warentest, reported by The Motley Fool) found DCC raised prices \"by amounts ranging from 2.6% to 12.0%,\" with extreme cases to 18%. [THIRD-PARTY — Stiftung Warentest]<\u002Fli>\n<\u002Fol>\n<p><strong>Economics:<\u002Fstrong><\u002Fp>\n<ul>\n<li><strong>Interchange:<\u002Fstrong> merchant-side; flows to the issuer (CFSB) and is shared with Wise — a \"card &amp; other\" revenue stream. Wise's investor materials confirm revenue \"from our account features, such as debit card interchange fees.\" <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li><strong>FX conversion fee:<\u002Fstrong> from 0.33% when the held currency is insufficient.<\u002Fli>\n<li><strong>ATM:<\u002Fstrong> region-specific free allowances then percentage fees (US: $1.50 + 2% over $100 / 2 withdrawals; AU: 2.69% over A$400/month from 1 May 2026; India travel card free to $200).<\u002Fli>\n<li><strong>Scheme/processor fees:<\u002Fstrong> paid to Mastercard/Visa; reduced by in-house processing.<\u002Fli>\n<li><strong>Chargebacks/fraud:<\u002Fstrong> handled via scheme dispute rules; card fraud loss borne partly by Wise/issuer per scheme allocation. <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan><\u002Fli>\n<\u002Ful>\n<p><strong>Strategic role:<\u002Fstrong> the card is primarily a <strong>retention + balance-usage + data<\u002Fstrong> tool that also monetises via interchange/FX — it converts a transfer utility into a daily-use account. FY2026 card spend grew 37% to $44bn (Wise Group FY2026 results). <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<h3 id=\"ii-12-wise-business\"><span class=\"num\">II.12<\u002Fspan><span>Wise Business<\u002Fspan><\u002Fh3>\n<p><strong>Segment &amp; onboarding:<\u002Fstrong> SMEs, incorporated freelancers, e-commerce sellers, marketplaces, agencies paying contractors. Onboarding requires KYB (registration docs, directors, 25%+ shareholders); complex structures can take up to 10 business days. <span class=\"ev\">CONFIRMED FACT<\u002Fspan> A one-off setup fee unlocks \"Advanced\"/receiving features (e.g. £50 UK, $31 US); no monthly fee. UK pricing was restructured on 26 November 2025 (free \"Essential\" plan without receiving; paid \"Advanced\"). <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>Features:<\u002Fstrong> multi-currency hold (40+); local details (up to ~9–10 send currencies / 20+ receiving); batch payments (≤1,000); multi-user permissions; business debit/expense cards (not US business); direct debits (US); invoicing; QuickPay QR; accounting integrations (Xero, QuickBooks, NetSuite); API. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>Economics vs Personal:<\u002Fstrong> Business is <strong>structurally superior<\u002Fstrong> on volume per customer (~£55.6k vs £7.2k) and holds large balances (£6.6bn FY2025). But it grows slower in customer count (+11% vs Personal +22% FY2025) and has faced onboarding/compliance friction in Europe (paused registrations at points). Business underlying income was £321.8m FY2025 (~24% of £1,362.3m group underlying income). Higher frequency + accounting integrations create higher switching costs and retention. <span class=\"ev\">CONFIRMED FACT / ANALYTICAL INFERENCE<\u002Fspan><\u002Fp>\n<h3 id=\"ii-13-wise-platform-substantial-depth\"><span class=\"num\">II.13<\u002Fspan><span>Wise Platform (substantial depth)<\u002Fspan><\u002Fh3>\n<p><strong>What it is:<\u002Fstrong> Wise's infrastructure-as-a-service offering — banks, fintechs, and enterprises embed Wise's cross-border payments, multi-currency accounts, and card issuing via API or SWIFT. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>Three integration models (Wise docs):<\u002Fstrong><\u002Fp>\n<ol>\n<li><strong>Embedded<\u002Fstrong> — regulated FIs/fintechs offer Wise inside their own UI; the partner's customers have Wise accounts linked to the partner platform, which transacts on their behalf.<\u002Fli>\n<li><strong>Enterprise<\u002Fstrong> — a business uses the API to move its <strong>own<\u002Fstrong> funds (payroll, vendors); Wise's relationship is with the enterprise only, not its customers/recipients.<\u002Fli>\n<li><strong>Correspondent<\u002Fstrong> — regulated FIs (Tier-1 banks, challengers, EMIs, brokerages) route their customers' cross-border payments through Wise; the partner holds a Wise account; the originators usually \"are often not aware that Wise is being used to process their transactions.\" Includes <strong>Correspondent Services<\u002Fstrong> (launched at Sibos with SWIFT) — banks redirect MT/MX (SWIFT) messages to Wise, which \"translate[s] them into a local payout executed on Wise's network.\" <span class=\"ev\">CONFIRMED FACT — Wise docs<\u002Fspan><\u002Fli>\n<\u002Fol>\n<p><strong>KYC ownership:<\u002Fstrong> depends on model — Wise-performed or partner-performed CDD/KYC, defined per integration; regulated partners typically retain CDD. <span class=\"ev\">CONFIRMED FACT — Wise docs<\u002Fspan><\u002Fp>\n<p><strong>Settlement/prefunding:<\u002Fstrong> for correspondent, a settlement journal (a list of transfer IDs) precedes a single bank payment; on linking, transfers move to <code>processing<\u002Fcode>; with prefunding, \"settlement funds must reach Wise before the payout is initiated to the recipient.\" Sender-name mismatches on the incoming bank payment may require manual intervention. <span class=\"ev\">CONFIRMED FACT — Wise docs<\u002Fspan><\u002Fp>\n<p><strong>Named public partners (role/date where public):<\u002Fstrong><\u002Fp>\n<ul>\n<li><strong>Correspondent/enterprise banks:<\u002Fstrong> Morgan Stanley (corporate cross-border settlements, Dec 2024), Standard Chartered (SC Remit via Wise Platform API), Raiffeisen Bank International (Central/Eastern Europe), UniCredit, BPCE (France), Shinhan Bank (Korea), IndusInd Bank (India inward, June 2023 — first India partner).<\u002Fli>\n<li><strong>Embedded accounts/cards:<\u002Fstrong> Nubank (Brazil — global account + international debit card for premium clients), Bank Mandiri (Indonesia), Mox (Standard Chartered's HK digital bank), Tiger Brokers (Singapore debit card), Interactive Brokers (US), Google Pay, Monzo, N26.<\u002Fli>\n<li><strong>Other/SME distribution:<\u002Fstrong> Qonto (France — doubled international-transfer adoption), Swan (embedded international payments across Europe), Allica Bank (UK), Moin (Korea), Brex, Bolt, EQ Bank and Wealthsimple (Canada), Itaú Unibanco (Brazil).<\u002Fli>\n<li>Wise reported <strong>85+ Platform partners<\u002Fstrong> by the Nubank announcement. <span class=\"ev\">CONFIRMED FACT — Finextra / Wise / press<\u002Fspan><\u002Fli>\n<\u002Ful>\n<p><strong>Commercial model (Wise's own words):<\u002Fstrong> \"Wise Platform pricing follows a cost+margin framework. Because Wise Platform leverages the exact same underlying payment network and infrastructure built for our direct consumers, the marginal cost of processing partner volumes is extremely low, leading to highly attractive unit economics.\" Revenue = transaction fees + \"potential integration and software licensing fees depending on the partnership structure.\" <span class=\"ev\">CONFIRMED FACT — Wise investor-topics page<\u002Fspan><\u002Fp>\n<p><strong>Scale:<\u002Fstrong> Wise's H1 FY2026 interim report (6 Nov 2025) states: \"around 5% of Wise's cross-border volume is driven by Wise Platform, up from 4% as reported at our Owners' Day… we continue to expect this to increase materially, to around 10% in the medium term, and over 50% in our long-term vision.\" (FY2025 ≈ 4%, up from 3%.) <span class=\"ev\">CONFIRMED FACT<\u002Fspan> Implementation is quoted in \"weeks or months.\" <span class=\"ev\">COMPANY CLAIM<\u002Fspan><\u002Fp>\n<p><strong>Strategic verdict:<\u002Fstrong> Platform <strong>does<\u002Fstrong> transform Wise from a consumer fintech into payments infrastructure / a financial network. Because Wise monetises regardless of whether the end customer chooses Wise or a partner wrapper (Monzo and N26 run cross-border on Wise rails), Platform is a <strong>flywheel amplifier<\u002Fstrong>: partner volume lowers network unit cost, which funds lower consumer prices, which drives volume. It is plausibly <strong>more strategically valuable long-term than direct consumer distribution<\u002Fstrong> — Wise's own \"over 50% in our long-term vision\" target for Platform volume signals this — even though the Personal segment (~78% of revenue/income) dwarfs it today. <span class=\"ev\">ANALYTICAL INFERENCE, well-supported<\u002Fspan><\u002Fp>\n<h3 id=\"ii-14-product-dependency-flywheel-map\"><span class=\"num\">II.14<\u002Fspan><span>Product Dependency / Flywheel Map<\u002Fspan><\u002Fh3>\n<p>Verified loops:<\u002Fp>\n<ol>\n<li><strong>Transfer → Account → Balances → Card → Frequency → Retention.<\u002Fstrong> Supported: ~50% personal / ~60% business use multiple features; card spend $44bn FY2026; balances £17.1bn FY2025. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li><strong>Balances → Interest income → Profit → Price cuts → Volume.<\u002Fstrong> Supported: interest income is material (FY2025 \"first 1% yield\" £150.4m + \"above first 1% yield\" £443.9m); take rate cut to 0.53% (Q4 FY2025) and ~0.52% (FY2026). <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li><strong>Business → Integrations/API → Switching costs → Retention.<\u002Fstrong> Supported: accounting integrations, batch, permissions. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fli>\n<li><strong>Infrastructure → Platform partners → Volume → Lower unit cost → Better consumer pricing.<\u002Fstrong> Supported by Wise's cost+margin statement and the take-rate trend. <span class=\"ev\">CONFIRMED FACT / INFERENCE<\u002Fspan><\u002Fli>\n<li><strong>Internal matching improves with scale → fewer external FX/rebalancing legs → lower cost.<\u002Fstrong> <span class=\"ev\">ANALYTICAL INFERENCE<\u002Fspan><\u002Fli>\n<\u002Fol>\n<h3 id=\"ii-15-product-economics-by-use-case\"><span class=\"num\">II.15<\u002Fspan><span>Product Economics by Use Case<\u002Fspan><\u002Fh3>\n<figure class=\"tbl tbl-wide\"><div class=\"rot\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Use case<\u002Fsc-raw-th><sc-raw-th>Fee mechanism<\u002Fsc-raw-th><sc-raw-th>Direct payment cost<\u002Fsc-raw-th><sc-raw-th>FX cost<\u002Fsc-raw-th><sc-raw-th>Card/network cost<\u002Fsc-raw-th><sc-raw-th>Support/fraud/compliance<\u002Fsc-raw-th><sc-raw-th>Contribution economics<\u002Fsc-raw-th><sc-raw-th>Capital/liquidity need<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Major-corridor transfer (EUR-GBP)<\u002Fsc-raw-td><sc-raw-td>Fixed + ~0.33–0.43%<\u002Fsc-raw-td><sc-raw-td>Very low (direct rails)<\u002Fsc-raw-td><sc-raw-td>Near-zero (matched)<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Low (automated)<\u002Fsc-raw-td><sc-raw-td>High margin<\u002Fsc-raw-td><sc-raw-td>Prefunded pools<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Thin-corridor transfer<\u002Fsc-raw-td><sc-raw-td>Higher variable %<\u002Fsc-raw-td><sc-raw-td>Partner fees<\u002Fsc-raw-td><sc-raw-td>Wholesale FX + rebalancing<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Higher<\u002Fsc-raw-td><sc-raw-td>Lower margin<\u002Fsc-raw-td><sc-raw-td>Higher buffers<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card spend (currency held)<\u002Fsc-raw-td><sc-raw-td>Free<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>0<\u002Fsc-raw-td><sc-raw-td>Scheme fee (offset by interchange)<\u002Fsc-raw-td><sc-raw-td>Fraud loss<\u002Fsc-raw-td><sc-raw-td>Interchange-positive<\u002Fsc-raw-td><sc-raw-td>Balance float<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card spend (conversion)<\u002Fsc-raw-td><sc-raw-td>0.33%+<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Small<\u002Fsc-raw-td><sc-raw-td>Scheme fee<\u002Fsc-raw-td><sc-raw-td>Fraud<\u002Fsc-raw-td><sc-raw-td>Positive<\u002Fsc-raw-td><sc-raw-td>Float<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>ATM over allowance<\u002Fsc-raw-td><sc-raw-td>$1.50 + 2% (US)<\u002Fsc-raw-td><sc-raw-td>ATM operator<\u002Fsc-raw-td><sc-raw-td>Small<\u002Fsc-raw-td><sc-raw-td>Scheme<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Positive<\u002Fsc-raw-td><sc-raw-td>Float<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Business batch<\u002Fsc-raw-td><sc-raw-td>Per-leg fee<\u002Fsc-raw-td><sc-raw-td>Local rails<\u002Fsc-raw-td><sc-raw-td>Matched/wholesale<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Pools<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Platform<\u002Fsc-raw-td><sc-raw-td>Cost+margin txn fee (+ integration/licence)<\u002Fsc-raw-td><sc-raw-td>Shared infra (near-zero marginal)<\u002Fsc-raw-td><sc-raw-td>Matched<\u002Fsc-raw-td><sc-raw-td>Optional card<\u002Fsc-raw-td><sc-raw-td>Partner-shared<\u002Fsc-raw-td><sc-raw-td>\"Highly attractive\"<\u002Fsc-raw-td><sc-raw-td>Shared<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Interest/Assets<\u002Fsc-raw-td><sc-raw-td>0.27–0.56% mgmt fee<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Fee + retention<\u002Fsc-raw-td><sc-raw-td>Custody<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><\u002Ffigure>\n<p>FY2025 group economics: underlying income £1,362.3m; underlying gross profit £1,025.1m (75% margin); underlying PBT £282.1m (21% margin); reported PBT £564.8m; profit £416.7m; cost of sales £328.1m. <span class=\"ev\">CONFIRMED FACT — FY2025 report<\u002Fspan><\u002Fp>\n<h3 id=\"ii-16-failure-exception-paths\"><span class=\"num\">II.16<\u002Fspan><span>Failure &amp; Exception Paths<\u002Fspan><\u002Fh3>\n<figure class=\"tbl tbl-wide\"><div class=\"rot\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Failure<\u002Fsc-raw-th><sc-raw-th>Owner<\u002Fsc-raw-th><sc-raw-th>Customer experience<\u002Fsc-raw-th><sc-raw-th>Money location<\u002Fsc-raw-th><sc-raw-th>Ledger state<\u002Fsc-raw-th><sc-raw-th>Regulatory obligation<\u002Fsc-raw-th><sc-raw-th>Loss exposure<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Failed funding<\u002Fsc-raw-td><sc-raw-td>Wise/customer<\u002Fsc-raw-td><sc-raw-td>Transfer stalls<\u002Fsc-raw-td><sc-raw-td>Never left sender bank<\u002Fsc-raw-td><sc-raw-td><code>cancelled<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>None<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Rate expiry (unfunded)<\u002Fsc-raw-td><sc-raw-td>Wise<\u002Fsc-raw-td><sc-raw-td>Re-quote<\u002Fsc-raw-td><sc-raw-td>With sender<\u002Fsc-raw-td><sc-raw-td>Refund/cancel<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>None<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>≥5% adverse move<\u002Fsc-raw-td><sc-raw-td>Wise<\u002Fsc-raw-td><sc-raw-td>Auto-cancel + refund<\u002Fsc-raw-td><sc-raw-td>Returned<\u002Fsc-raw-td><sc-raw-td><code>funds_refunded<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Wise avoids FX loss<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Compliance hold<\u002Fsc-raw-td><sc-raw-td>Wise<\u002Fsc-raw-td><sc-raw-td>Balance frozen pending review<\u002Fsc-raw-td><sc-raw-td>In safeguarding<\u002Fsc-raw-td><sc-raw-td><code>processing<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>AML/sanctions<\u002Fsc-raw-td><sc-raw-td>Reputational<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sanctions match<\u002Fsc-raw-td><sc-raw-td>Wise<\u002Fsc-raw-td><sc-raw-td>Blocked/reported<\u002Fsc-raw-td><sc-raw-td>Held<\u002Fsc-raw-td><sc-raw-td><code>processing<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Report to authority<\u002Fsc-raw-td><sc-raw-td>Regulatory<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Fraud suspicion<\u002Fsc-raw-td><sc-raw-td>Wise<\u002Fsc-raw-td><sc-raw-td>Delay/review<\u002Fsc-raw-td><sc-raw-td>Held<\u002Fsc-raw-td><sc-raw-td><code>processing<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>SAR<\u002Fsc-raw-td><sc-raw-td>Fraud loss<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Wrong beneficiary details<\u002Fsc-raw-td><sc-raw-td>Customer/Wise<\u002Fsc-raw-td><sc-raw-td>Delay or return<\u002Fsc-raw-td><sc-raw-td>Payout bank / en route<\u002Fsc-raw-td><sc-raw-td><code>bounced_back<\u002Fcode> → redelivery or refund<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Possible mis-payment<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Beneficiary bank rejection<\u002Fsc-raw-td><sc-raw-td>Beneficiary bank<\u002Fsc-raw-td><sc-raw-td>Returned<\u002Fsc-raw-td><sc-raw-td>Returned to Wise<\u002Fsc-raw-td><sc-raw-td><code>bounced_back<\u002Fcode> → <code>funds_refunded<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Card dispute/chargeback<\u002Fsc-raw-td><sc-raw-td>Issuer/scheme<\u002Fsc-raw-td><sc-raw-td>Provisional credit process<\u002Fsc-raw-td><sc-raw-td>Merchant/issuer<\u002Fsc-raw-td><sc-raw-td><code>charged_back<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Scheme rules<\u002Fsc-raw-td><sc-raw-td>Shared<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Payout-rail outage<\u002Fsc-raw-td><sc-raw-td>Rail/Wise<\u002Fsc-raw-td><sc-raw-td>Delay<\u002Fsc-raw-td><sc-raw-td>In Wise pool<\u002Fsc-raw-td><sc-raw-td><code>processing<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Operational<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Insufficient pool liquidity<\u002Fsc-raw-td><sc-raw-td>Wise treasury<\u002Fsc-raw-td><sc-raw-td>Delay<\u002Fsc-raw-td><sc-raw-td>Pool<\u002Fsc-raw-td><sc-raw-td><code>processing<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Rebalancing cost<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><\u002Ffigure>\n<p>Rollback transitions let transfers return to prior states; events are reconciled by <code>occurred_at<\u002Fcode> timestamp since ordering isn't guaranteed. <span class=\"ev\">CONFIRMED FACT — Wise API<\u002Fspan><\u002Fp>\n<h3 id=\"ii-17-volume-ii-reconstruction\"><span class=\"num\">II.17<\u002Fspan><span>Volume II Reconstruction<\u002Fspan><\u002Fh3>\n<p><strong>1. Product architecture:<\u002Fstrong> one infrastructure (licences + banking partners + rail connections + Treasury Ledger + FX engine + card processing) → three solutions (Account, Business, Platform) → shared primitives (transfer, convert, hold, receive, card, interest, API).<\u002Fp>\n<p><strong>2. Customer-segment map:<\u002Fstrong> see II.2 — remittance senders, expats, workers/nomads, travelers, freelancers, SMEs, larger businesses/marketplaces, Platform FIs.<\u002Fp>\n<p><strong>3. Jobs-to-be-done matrix:<\u002Fstrong> see II.3.<\u002Fp>\n<p><strong>4. Customer lifecycle:<\u002Fstrong> see II.4.<\u002Fp>\n<p><strong>5. End-to-end transfer maps:<\u002Fstrong> see II.5–II.6 (EUR-GBP, GBP-USD, USD-EUR, Nigeria/NGN, USD-INR, business batch).<\u002Fp>\n<p><strong>6. Money vs ledger vs accounting:<\u002Fstrong> the customer-facing balance (a liability), the internal Treasury Ledger (double-entry, real-time), the bank-account balances (safeguarding + operating), the payment-system position, the settlement obligation, and the GL recognition <strong>do not move simultaneously<\u002Fstrong> — the ledger and customer view update in seconds while actual bank/rail settlement and rebalancing lag. <span class=\"ev\">CONFIRMED FACT<\u002Fspan><\u002Fp>\n<p><strong>7. Local payment-rail map:<\u002Fstrong> see II.7 — up to 8 direct connections; US/India/Nigeria via partners.<\u002Fp>\n<p><strong>8. Wise network architecture:<\u002Fstrong> local pools + two synchronized domestic legs + periodic rebalancing; see II.8.<\u002Fp>\n<p><strong>9. FX architecture:<\u002Fstrong> mid-market from multiple independent providers; five-way rate decomposition; matching + short-duration hedging; see II.9.<\u002Fp>\n<p><strong>10. Wise Account legal/economic model:<\u002Fstrong> e-money, safeguarded, not deposit-insured; see II.10.<\u002Fp>\n<p><strong>11. Card transaction map:<\u002Fstrong> CFSB-issued (US), cloud processing, conversion waterfall; see II.11.<\u002Fp>\n<p><strong>12. Wise Business architecture:<\u002Fstrong> see II.12.<\u002Fp>\n<p><strong>13. Wise Platform architecture:<\u002Fstrong> three models, 85+ partners, cost+margin; see II.13.<\u002Fp>\n<p><strong>14. Product dependency/flywheel:<\u002Fstrong> see II.14.<\u002Fp>\n<p><strong>15. Exception/failure map:<\u002Fstrong> see II.16.<\u002Fp>\n<p><strong>16. Major dependencies:<\u002Fstrong> (i) CFSB for US issuing/USD access (the OCC denied Wise's national trust-bank charter in July 2026 per Volume I, preserving CFSB dependency); (ii) safeguarding banks (Barclays, Citi, JPMorgan, Deutsche, Hamburg Commercial, Bank of America); (iii) Mastercard/Visa schemes; (iv) local rails + 90+ banking partners + 50+ liquidity partners; (v) partner banks in India/Nigeria/US; (vi) 65–70+ regulatory licences; (vii) SWIFT for correspondent Platform; (viii) cloud (AWS).<\u002Fp>\n<p><strong>17. Key unknowns:<\u002Fstrong> exact FX-trading P&amp;L; precise wholesale-execution mechanics and rate vendor; per-corridor internal-match rates; per-partner Platform revenue; exact interchange split with CFSB; internal reconciliation algorithm details.<\u002Fp>\n<p><strong>18. Ten most important conclusions:<\u002Fstrong><\u002Fp>\n<ol>\n<li>A Wise \"cross-border\" transfer is two domestic payments; money crosses borders only in periodic rebalancing.<\u002Fli>\n<li>Scale improves internal matching, lowering unit cost — a genuine, self-reinforcing moat, evidenced by the take-rate decline from 0.67% to 0.53% (Q4 FY2025) and ~0.52% (FY2026).<\u002Fli>\n<li>The Wise Account (e-money, safeguarded, not deposit-insured) is the retention engine that turned a transfer utility into an account; balances (£17.1bn FY2025 / holdings £21.5bn; $39bn FY2026) now drive material interest income.<\u002Fli>\n<li>Interest income on customer balances is a large, rate-sensitive profit contributor — and a strategic vulnerability if rates fall.<\u002Fli>\n<li>The card is a retention/data/interchange tool, not primarily a standalone revenue engine; in-house cloud processing lowers its cost.<\u002Fli>\n<li>Wise Business has structurally superior unit economics (VPC ~£55.6k) but slower customer growth and heavier compliance friction.<\u002Fli>\n<li>Wise Platform is the strongest infrastructure play and likely the highest strategic-optionality product, monetising even when competitors win the end customer.<\u002Fli>\n<li>Direct payment-rail membership (especially UK Faster Payments with a BoE settlement account) is the hard-won, hard-to-replicate core of the speed/cost advantage.<\u002Fli>\n<li>Emerging-market corridors (NGN, and to a lesser degree INR) remain the fragile edge — regulation and FX liquidity, not technology, are the binding constraints.<\u002Fli>\n<li>Wise is best understood as <strong>payments infrastructure with a consumer distribution front-end<\u002Fstrong> — a network, not a remittance app.<\u002Fli>\n<\u002Fol>\n<p><strong>Prompt questions answered:<\u002Fstrong><\u002Fp>\n<ul>\n<li><strong>What part is actually cross-border?<\u002Fstrong> Essentially none for a given transaction on covered corridors; only periodic bulk rebalancing.<\u002Fli>\n<li><strong>Central operating insight?<\u002Fstrong> Convert one cross-border payment into two synchronized domestic payments linked by an internal ledger, and net flows at scale.<\u002Fli>\n<li><strong>Strongest retention product?<\u002Fstrong> The Wise Account (balances + card + local details + Assets).<\u002Fli>\n<li><strong>Strongest infrastructure product?<\u002Fstrong> Wise Platform (and the rail/licence/ledger stack beneath it).<\u002Fli>\n<li><strong>Most strategically important despite not being the largest?<\u002Fstrong> Wise Platform.<\u002Fli>\n<li><strong>What is Wise?<\u002Fstrong> A cross-border <strong>payments network / infrastructure platform<\u002Fstrong> with multi-currency accounts and a consumer/business distribution layer on top — not merely a remittance product.<\u002Fli>\n<\u002Ful>\n<div class=\"plate long\"><span class=\"plate-label\">Caveats<\u002Fspan>\n<ul>\n<li>FY2026 figures (19m customers; $243bn volume; $39bn holdings; $44bn card spend) are US-GAAP/USD; FY2025 figures are IFRS/GBP audited. Mixing bases requires care.<\u002Fli>\n<li>Several mechanism details (wholesale FX rate vendor, internal reconciliation algorithm, per-partner Platform economics, the interchange split with CFSB, discrete FX P&amp;L) are not publicly disclosed and are labelled UNKNOWN or ANALYTICAL INFERENCE.<\u002Fli>\n<li>Rail-connection counts and Platform partner counts are time-sensitive and cited as of FY2025/2026 sources; the \"5 vs 6 vs 8 direct connections\" discrepancy reflects go-live timing, not conflicting facts.<\u002Fli>\n<li>The DCC cost range (2.6–12%, up to 18%) is from a Stiftung Warentest study reported by third parties, not a Wise publication.<\u002Fli>\n<li>The Belgian AML criminal investigation of Wise Europe SA (disclosed 1 June 2026, per Volume I) is regulatory context, not a product mechanism, and is not analysed here.<\u002Fli>\n<li>This is Volume II only. Volume III is not begun.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<section class=\"part\" id=\"part-iii-operations-technology-data-organisational-infrastru\" data-break=\"page\"><div class=\"part-top\"><span>Part III<\u002Fspan><span>The Wise Enterprise Reverse-Engineering Study<\u002Fspan><\u002Fdiv><div class=\"part-mid\"><div class=\"part-no\">03<\u002Fdiv><h1 class=\"part-title\">Operations, Technology, Data &amp; Organisational Infrastructure<\u002Fh1><p class=\"part-sub\">How roughly 4.7 million transactions a day actually get processed safely.<\u002Fp><\u002Fdiv><div class=\"part-rule\"><\u002Fdiv><\u002Fsection>\n<p><em>An institutional-grade forensic reconstruction of how Wise actually operates at scale. Volumes I (Corporate/Legal/Regulatory/Institutional) and II (Product/Customer/Money-Movement) are treated as established background and are not re-derived. Volume IV is not begun.<\u002Fem><\u002Fp>\n<h3 id=\"preface-scope-method-and-evidence-conventions\"><span>Preface: scope, method, and evidence conventions<\u002Fspan><\u002Fh3>\n<p>This volume reconstructs <em>how Wise runs at scale<\u002Fem> — the software systems, treasury machinery, data platform, financial-crime controls, reliability practices, and organisational design that let <strong>~19 million (18.9m) customers move $243.5bn across borders in FY2026<\u002Fstrong> (year ended 31 March 2026), processing <strong>about 4.7 million transactions a day<\u002Fstrong> [American Banker, 2 June 2026].<\u002Fp>\n<p>Evidence labels: <span class=\"ev\">CONFIRMED<\u002Fspan> (primary/reliable), <span class=\"ev\">COMPANY CLAIM<\u002Fspan> (Wise-stated, not independently verified), <strong>[THIRD-PARTY]<\u002Fstrong> (external report/estimate), <span class=\"ev\">INFERENCE<\u002Fspan> (reasoned from multiple facts), <span class=\"ev ev-soft\">HYPOTHESIS<\u002Fspan> (plausible, needs evidence), <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan>. Current-state claims carry \"As of [date]\" where material.<\u002Fp>\n<p>A structural sourcing note: Wise is unusually transparent about engineering (the Wise Engineering Medium publication; \"Tech Stack\" posts of 2016/2020/2022/2025; conference talks; detailed job descriptions) but far more opaque about the internal chart-of-accounts, reconciliation break-handling, and treasury execution mechanics. Where Wise has published nothing, this report labels the gap <span class=\"ev ev-soft\">UNKNOWN<\u002Fspan> rather than inventing architecture, as the research brief requires.<\u002Fp>\n<h3 id=\"iii-1-operating-model\"><span class=\"num\">III.1<\u002Fspan><span>Operating Model<\u002Fspan><\u002Fh3>\n<p>Wise is best understood as a <strong>regulated payments-network operator wrapped around a software company<\u002Fstrong>. The revealed design doctrine — visible in capital allocation, hiring and org structure — is to <em>internalise<\u002Fem> functions that create cost, speed or regulatory advantage (payment-scheme connectivity, ledgering, treasury, fraud/AML tooling, card processing) and <em>buy/outsource<\u002Fem> commodity capability (CRM/help-desk, cloud primitives, identity-document capture).<\u002Fp>\n<h4 id=\"function-map\">Function map<\u002Fh4>\n<figure class=\"tbl\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Function<\u002Fsc-raw-th><sc-raw-th>Mandate<\u002Fsc-raw-th><sc-raw-th>Key systems<\u002Fsc-raw-th><sc-raw-th>Automation<\u002Fsc-raw-th><sc-raw-th>Evidence<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td><strong>Product<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Own customer problems by mission team; roadmap<\u002Fsc-raw-td><sc-raw-td>Autonomous teams; A/B experimentation<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Engineering<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Build &amp; run &gt;1,000 backend services, 40+ web apps<\u002Fsc-raw-td><sc-raw-td>Java/Kotlin; React/Next.js (CRAB); Kubernetes<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Payments Operations<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Process transfers, resolve exceptions, reconcile<\u002Fsc-raw-td><sc-raw-td>Recon tooling; exception queues; 24/7 global ops<\u002Fsc-raw-td><sc-raw-td>Med (manual for breaks)<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Treasury<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Local liquidity, prefunding, FX execution<\u002Fsc-raw-td><sc-raw-td>Treasury Ledger; trading desks<\u002Fsc-raw-td><sc-raw-td>Med-high<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Finance<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Statutory accounts, GL, regulatory capital<\u002Fsc-raw-td><sc-raw-td>US GAAP/USD from FY2026<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Compliance/AML/Sanctions/Fraud<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>KYC/KYB, monitoring, SAR filing, screening<\u002Fsc-raw-td><sc-raw-td>In-house ML (&gt;110 data points)<\u002Fsc-raw-td><sc-raw-td>High + human review<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">COMPANY CLAIM<\u002Fspan>/<span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Risk<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Three-Lines-of-Defence; risk committees<\u002Fsc-raw-td><sc-raw-td>Group Risk Cttee, ALCO, sub-committees<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Customer Support<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Multi-channel service, 4 hubs<\u002Fsc-raw-td><sc-raw-td>Zendesk; LLM-assisted<\u002Fsc-raw-td><sc-raw-td>Rising<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Legal/Reg. Affairs<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Licensing, scheme membership, enforcement<\u002Fsc-raw-td><sc-raw-td>GC reports to CTO<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Wise Platform (BD)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Enterprise/bank API distribution<\u002Fsc-raw-td><sc-raw-td>REST + OAuth; 40+ currencies<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Data<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>DBs, streaming, analytics, ML platform<\u002Fsc-raw-td><sc-raw-td>Kafka, Snowflake, Iceberg, SageMaker<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Security<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>AppSec, infra, PCI-DSS, IR<\u002Fsc-raw-td><sc-raw-td>Bugcrowd; CISO Shan Lee<\u002Fsc-raw-td><sc-raw-td>Med<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Infrastructure/Platform<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>CRP, CI/CD, observability<\u002Fsc-raw-td><sc-raw-td>Kubernetes/RKE2/Rancher, Spinnaker, LGTM<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td><strong>Internal Audit<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>3rd-line assurance<\u002Fsc-raw-td><sc-raw-td>Head of IA to CFO + board<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td><span class=\"ev\">CONFIRMED<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Ffigure>\n<p><strong>Headcount context:<\u002Fstrong> Wise reported a monthly-average of <strong>~6,151 employees in FY2025<\u002Fstrong> (aggregate remuneration £412.8m) <span class=\"ev\">CONFIRMED, FY2025 annual report<\u002Fspan> and <strong>more than 850 engineers as of early 2025<\u002Fstrong> <span class=\"ev\">CONFIRMED, Tech Stack 2025<\u002Fspan>. A third-party tracker (Revelio Labs) puts total workforce materially higher (~10,332 in 2025) [THIRD-PARTY] — a gap most plausibly explained by contractor/outsourced-support inclusion <span class=\"ev ev-soft\">HYPOTHESIS<\u002Fspan>, left unreconciled.<\u002Fp>\n<p><strong>Revealed priority — financial crime is the largest functional concentration.<\u002Fstrong> Wise states that <strong>\"around a third of staff is 'dedicated to fighting financial crime'\"<\u002Fstrong> <span class=\"ev\">COMPANY CLAIM, verbatim per The Bureau of Investigative Journalism, 1 June 2026<\u002Fspan>; American Banker (2 June 2026) corroborates that Wise \"assigns roughly a third of its global staff\" to financial crime and \"processes about 4.7 million transactions a day.\" This is corroborated in direction by Wise's own FDIC submission (\"Compliance is one of our largest teams at Wise\") and by the density of open FinCrime roles. It is the single clearest quantitative signal of revealed priorities in the operating model.<\u002Fp>\n<h3 id=\"iii-2-transaction-operations\"><span class=\"num\">III.2<\u002Fspan><span>Transaction Operations<\u002Fspan><\u002Fh3>\n<h4 id=\"normal-path\">Normal path<\u002Fh4>\n<p>Public transfer state machine (Wise API + engineering material):<\u002Fp>\n<p><code>incoming_payment_waiting → processing → funds_converted → outgoing_payment_sent<\u002Fcode><\u002Fp>\n<p>with terminal/abnormal states <code>bounced_back<\u002Fcode>, <code>charged_back<\u002Fcode>, <code>cancelled<\u002Fcode>, <code>funds_refunded<\u002Fcode>, <code>unknown<\u002Fcode> <span class=\"ev\">CONFIRMED<\u002Fspan>. Lifecycle after a customer confirms:<\u002Fp>\n<ol>\n<li><strong>Quote lock<\u002Fstrong> — mid-market rate locked ~30 minutes; 5% adverse-move auto-cancel <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li><strong>Funding<\u002Fstrong> via local rail (Faster Payments, SEPA, ACH via partner bank, card, or existing balance).<\u002Fli>\n<li><strong>Funding confirmation<\u002Fstrong> — <code>incoming_payment_waiting<\u002Fcode> clears on receipt into the local collection/safeguarding account.<\u002Fli>\n<li><strong>Compliance checks<\u002Fstrong> — sanctions/PEP screening + risk scoring.<\u002Fli>\n<li><strong>Fraud checks<\u002Fstrong> — ML scoring on device/behavioural/transaction signals.<\u002Fli>\n<li><strong>Conversion<\u002Fstrong> — <code>processing → funds_converted<\u002Fcode>; the FX leg is booked internally against a local pool (not necessarily a per-transaction market trade).<\u002Fli>\n<li><strong>Payout<\u002Fstrong> — instruction from the <em>destination<\u002Fem> pool via a domestic rail; <code>outgoing_payment_sent<\u002Fcode>.<\u002Fli>\n<li><strong>Beneficiary credit<\u002Fstrong> — for <strong>75% of Q4 FY2026 payments this completed in under 20 seconds<\u002Fstrong> (CEO Kristo Käärmann: <em>\"instant payments, with 75% of our Q4 payments globally completed in under 20 seconds\"<\u002Fem>, FY2026 results, 25 June 2026) <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li><strong>Reconciliation &amp; recognition<\u002Fstrong> — ledger reconciled to bank/scheme records; revenue and cost of sales recognised.<\u002Fli>\n<\u002Fol>\n<p>The architectural key (from Volume II): the cross-border \"movement\" is usually <strong>local-in / local-out with internal netting<\u002Fstrong> — money paid in stays in-country; a pre-positioned destination pool pays out; treasury rebalances the residual imbalance (§III.3).<\u002Fp>\n<h4 id=\"abnormal-paths\">Abnormal paths<\u002Fh4>\n<figure class=\"tbl tbl-wide\"><div class=\"rot\"><sc-raw-table class=\"table\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Path<\u002Fsc-raw-th><sc-raw-th>Owner<\u002Fsc-raw-th><sc-raw-th>Detection<\u002Fsc-raw-th><sc-raw-th>Customer impact<\u002Fsc-raw-th><sc-raw-th>Ledger status<\u002Fsc-raw-th><sc-raw-th>Regulatory dimension<\u002Fsc-raw-th><sc-raw-th>Loss exposure<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead><sc-raw-tbody><sc-raw-tr><sc-raw-td>Failed transfer<\u002Fsc-raw-td><sc-raw-td>Payment Ops<\u002Fsc-raw-td><sc-raw-td>Rail reject<\u002Fsc-raw-td><sc-raw-td>Delay<\u002Fsc-raw-td><sc-raw-td>Held / may roll back<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Returned / beneficiary rejection<\u002Fsc-raw-td><sc-raw-td>Payment Ops<\u002Fsc-raw-td><sc-raw-td>Rail return → <code>bounced_back<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Delay<\u002Fsc-raw-td><sc-raw-td>Returned to source pool<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Refund<\u002Fsc-raw-td><sc-raw-td>Payment Ops<\u002Fsc-raw-td><sc-raw-td><code>funds_refunded<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Money back<\u002Fsc-raw-td><sc-raw-td>Reversal entries<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>FX slippage<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Chargeback (card-funded)<\u002Fsc-raw-td><sc-raw-td>Payments/Fraud<\u002Fsc-raw-td><sc-raw-td>Scheme dispute → <code>charged_back<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Clawback<\u002Fsc-raw-td><sc-raw-td>Liability booked<\u002Fsc-raw-td><sc-raw-td>Scheme rules<\u002Fsc-raw-td><sc-raw-td>Moderate (can land on Wise)<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Sanctions review<\u002Fsc-raw-td><sc-raw-td>Sanctions/Compliance<\u002Fsc-raw-td><sc-raw-td>Screening hit<\u002Fsc-raw-td><sc-raw-td>Hold/freeze<\u002Fsc-raw-td><sc-raw-td>Frozen<\u002Fsc-raw-td><sc-raw-td>Mandatory reporting<\u002Fsc-raw-td><sc-raw-td>Regulatory &gt; financial<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>SAR review<\u002Fsc-raw-td><sc-raw-td>AML<\u002Fsc-raw-td><sc-raw-td>Monitoring alert<\u002Fsc-raw-td><sc-raw-td>Hold, possible closure + SAR<\u002Fsc-raw-td><sc-raw-td>Frozen<\u002Fsc-raw-td><sc-raw-td>SAR duty (31 CFR 1022.320)<\u002Fsc-raw-td><sc-raw-td>Regulatory<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Account restriction<\u002Fsc-raw-td><sc-raw-td>Fraud/Compliance<\u002Fsc-raw-td><sc-raw-td>Rules/ML<\u002Fsc-raw-td><sc-raw-td>Access limited<\u002Fsc-raw-td><sc-raw-td>Frozen<\u002Fsc-raw-td><sc-raw-td>Consumer-protection tension<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Stale payment<\u002Fsc-raw-td><sc-raw-td>Payment Ops<\u002Fsc-raw-td><sc-raw-td>Ageing in <code>processing<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Delay<\u002Fsc-raw-td><sc-raw-td>In-transit<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><sc-raw-td>Operational<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Reconciliation break<\u002Fsc-raw-td><sc-raw-td>Payment Ops Recon<\u002Fsc-raw-td><sc-raw-td>Recon tooling<\u002Fsc-raw-td><sc-raw-td>Usually invisible<\u002Fsc-raw-td><sc-raw-td>Mismatch flagged<\u002Fsc-raw-td><sc-raw-td>Safeguarding integrity<\u002Fsc-raw-td><sc-raw-td>Potentially high if systemic<\u002Fsc-raw-td><\u002Fsc-raw-tr><sc-raw-tr><sc-raw-td>Settlement mismatch<\u002Fsc-raw-td><sc-raw-td>Treasury/Payment Ops<\u002Fsc-raw-td><sc-raw-td>Ledger vs statement<\u002Fsc-raw-td><sc-raw-td>Invisible<\u002Fsc-raw-td><sc-raw-td>Position discrepancy<\u002Fsc-raw-td><sc-raw-td>Prudential<\u002Fsc-raw-td><sc-raw-td>Scale-dependent<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv><\u002Ffigure>\n<p><strong>Ownership evidence:<\u002Fstrong> Wise's <strong>Payment Operations Reconciliation<\u002Fstrong> teams in Tallinn and Austin \"investigate, resolve … and escalate reconciliation discrepancies,\" \"perform month-end close activities and reporting to Finance,\" and \"support building of reconciliation tooling\" across \"Spend, Treasury, Assets, Wise Platform\" <span class=\"ev\">CONFIRMED, Wise job descriptions<\u002Fspan>. Reconciliation is a first-class, staffed discipline, not an afterthought — a point that matters directly to the enforcement cluster (§III.10).<\u002Fp>\n<h3 id=\"iii-3-treasury-operations\"><span class=\"num\">III.3<\u002Fspan><span>Treasury Operations<\u002Fspan><\u002Fh3>\n<p>Treasury is the economic engine that makes \"instant and cheap\" possible, and Wise invests real internal engineering in it.<\u002Fp>\n<h4 id=\"the-treasury-ledger\">The Treasury Ledger<\u002Fh4>\n<p>At the centre sits the <strong>Treasury Ledger<\u002Fstrong> — a service Wise describes as \"the backbone for <strong>calculating our assets and liabilities with unwavering accuracy and in real time<\u002Fstrong>,\" seamlessly integrating with the full product spectrum <span class=\"ev\">CONFIRMED, Wise job descriptions<\u002Fspan>. It is a <strong>real-time, double-entry<\u002Fstrong> system that turns product events into actual and forecasted money movements, and its output feeds <strong>trading teams who manage FX exposure and per-entity liquidity, \"executing trades in the order of 10s to 100s of millions of pounds\"<\u002Fstrong> on the ledger's data <span class=\"ev\">CONFIRMED, \"Software Engineer – Treasury Ledger\" / \"Senior Software Engineer – FX Markets\" postings<\u002Fspan>. Its engineering mandate is \"real-time data streaming flows … relied upon for critical downstream processing — such as risk hedging and liquidity management.\"<\u002Fp>\n<h4 id=\"treasury-operating-cycle-reconstructed\">Treasury operating cycle (reconstructed)<\u002Fh4>\n<p>Local pools pre-positioned by corridor → real-time per-entity position calculation → internal netting of opposing flows → imbalance detection → market execution (FX trades of tens-to-hundreds of millions; physical liquidity moves between pools) → scheme prefunding → yield management (MMFs/government securities within safeguarding rules) → reconciliation against bank/scheme records.<\u002Fp>\n<h4 id=\"safeguarding-vs-treasury-freedom-follow-the-money\">Safeguarding vs treasury freedom (follow-the-money)<\u002Fh4>\n<p>The binding constraint is that most customer money is <strong>safeguarded<\u002Fstrong>, not free corporate cash. As of 31 March 2026, safeguarded customer deposits sat in <strong>highly liquid money market funds ($7,592.1m)<\u002Fstrong>, <strong>investment-grade fixed-income securities — government treasury bonds and highly-rated corporate paper ($4,582.7m)<\u002Fstrong>, cash at banks, and — for UK funds — <strong>Safeguarding via Comparable Guarantees valued at $1,119.1m (£845.0m) backed by nine investment-grade sureties<\u002Fstrong> <span class=\"ev\">CONFIRMED, FY2026 results / Form 20-F<\u002Fspan>. The MMFs are managed by institutions including <strong>BlackRock<\u002Fstrong> — Wise's own Assets (Interest) customer agreement names the <strong>BlackRock ICS Sterling/Euro Government Liquidity and US Treasury funds<\u002Fstrong>, with <strong>BlackRock Asset Management Ireland Limited<\u002Fstrong> as manager <span class=\"ev\">CONFIRMED, Wise Assets Customer Agreement, 24 Sept 2025<\u002Fspan>; State Street is also reported [THIRD-PARTY]. Safeguarding rules mean Wise can invest in permitted liquid, low-risk instruments and earn interest, but cannot lend the money out or take meaningful credit/duration risk. This is precisely why Wise is <em>not<\u002Fem> a bank in economic substance despite bank-like balances — and why its national-trust-bank ambition (denied by the OCC in July 2026, §III.10) mattered strategically.<\u002Fp>\n<h4 id=\"faster-payments-prefunding-a-concrete-liquidity-constraint\">Faster Payments prefunding (a concrete liquidity constraint)<\u002Fh4>\n<p>As the first non-bank direct participant in UK Faster Payments (2018) with a Bank of England RTGS settlement account, Wise must post <strong>prefunding<\u002Fstrong> into a dedicated BoE account covering its maximum net settlement obligation. Because non-bank PSPs are ineligible for interest-bearing reserves accounts, that prefunding sits in a <strong>\"settlement collateralisation account\" (own funds)<\u002Fstrong> or <strong>\"completion funds account\" (client funds)<\u002Fstrong> <span class=\"ev\">CONFIRMED, Bank of England RTGS documentation<\u002Fspan>. Economic consequence: direct participation buys speed and cost advantage but ties up liquidity (a step-fixed cost of membership) that — for a non-bank — does <em>not<\u002Fem> earn the reserve rate, a subtle drag banks avoid.<\u002Fp>\n<h4 id=\"interest-rate-economics-and-yield-management\">Interest-rate economics and yield management<\u002Fh4>\n<p>Customer holdings reached <strong>$39.0bn in FY2026 (+40%)<\u002Fstrong>: <strong>$30.0bn on-balance-sheet<\u002Fstrong> ($18.8bn Personal / $11.2bn Business) and <strong>$9bn off-balance-sheet Wise Assets<\u002Fstrong> <span class=\"ev\">CONFIRMED, FY2026 results / 6-K<\u002Fspan>. Wise generated <strong>$806.1m of net interest income (+6% YoY; FY2025 ≈ $758.3m)<\u002Fstrong>, <em>\"made possible by the $39 billion now held in customer accounts, up 40%\"<\u002Fem> <span class=\"ev\">CONFIRMED, FY2026 results<\u002Fspan>, and <strong>paid $196.9m of interest to customers<\u002Fstrong> <span class=\"ev\">CONFIRMED, FY2026 6-K<\u002Fspan>.<\u002Fp>\n<p>The retention framework is mechanical and P&amp;L-material: the <strong>first 1% of yield<\u002Fstrong> covers Wise Account operating costs; interest <strong>above 1% is split 20% retained / 80% available to customers<\u002Fstrong> <span class=\"ev\">CONFIRMED, Wise \"Translation of IFRS financials into US GAAP,\" 13 April 2026<\u002Fspan>. Because of (mainly UK) regulatory restrictions, Wise returned only about half of the intended 80% in FY2026, so the unreturned portion \"incidentally\" flows to profit — producing a <strong>FY2026 income-before-tax margin of 26% (income before tax $660.4m), \"slightly above our guided range of 20-25%\"<\u002Fstrong> <span class=\"ev\">CONFIRMED, FY2026 results, 25 June 2026<\u002Fspan>, versus a medium-term 15–20% target once full pass-through is achieved.<\u002Fp>\n<p><strong>Rate sensitivity (verified):<\u002Fstrong> a 25bp simultaneous move in central bank rates changes net interest income / net revenue / income before tax by <strong>approximately $40m per year<\u002Fstrong> (measured on H1 FY2026 balances) — i.e. the figure is <strong>$40m per 25bp in US dollars<\u002Fstrong>, not pounds as sometimes reported secondhand <span class=\"ev\">CONFIRMED, Wise US-GAAP translation, 13 April 2026<\u002Fspan>. Average gross yield on balances compressed from <strong>~3.9% (FY2025) to ~3.0% (FY2026)<\u002Fstrong> [THIRD-PARTY, investor presentation]. Interest income is thus a genuine but rate-cyclical earnings pillar: a full 100bp of cuts would remove roughly $160m of income on the H1 FY2026 base, partially cushioned because Wise then owes customers less pass-through.<\u002Fp>\n<h4 id=\"where-liquidity-binds\">Where liquidity binds<\u002Fh4>\n<p>Hardest in <strong>imbalanced corridors<\u002Fstrong> (one-directional remittance flows), in <strong>volatile/capital-controlled currencies<\u002Fstrong>, and at <strong>scheme-prefunding step points<\u002Fstrong>. Scale helps (more netting, deeper matching) but does not eliminate corridor imbalance — the fundamental reason Wise still executes hundreds of millions in FX trades.<\u002Fp>\n<h3 id=\"iii-4-technology-architecture-as-of-early-2025-unless-noted\"><span class=\"num\">III.4<\u002Fspan><span>Technology Architecture (as of early 2025 unless noted)<\u002Fspan><\u002Fh3>\n<h4 id=\"client-layer\">Client layer<\u002Fh4>\n<ul>\n<li><strong>Web:<\u002Fstrong> <strong>CRAB<\u002Fstrong> (Wise abstraction over <strong>Next.js<\u002Fstrong>), <strong>40 distinct apps<\u002Fstrong>; <strong>React<\u002Fstrong> components tested with <strong>Storybook<\u002Fstrong> + <strong>Chromatic<\u002Fstrong> visual-regression snapshots <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li><strong>iOS:<\u002Fstrong> 250+ Xcode modules migrated Xcodegen→<strong>Tuist<\u002Fstrong>, CocoaPods→<strong>Swift Package Manager<\u002Fstrong>; zero-change build times cut <strong>28s → 2s<\u002Fstrong> <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li><strong>Android:<\u002Fstrong> primary repo of 300+ Gradle modules, ~1m LOC; <strong>Jetpack Compose<\u002Fstrong>, <strong>Kotlin 2.x<\u002Fstrong>, Coroutines/Flows, MVVM; exploring <strong>Kotlin Multiplatform<\u002Fstrong> and BFF sharing <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li><strong>Auth:<\u002Fstrong> public API uses <strong>REST + OAuth<\u002Fstrong> <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<\u002Ful>\n<h4 id=\"backend\">Backend<\u002Fh4>\n<ul>\n<li><strong>Over 1,000 services<\u002Fstrong>, primarily <strong>Java and Kotlin<\u002Fstrong> (history: ~50 services in 2016 → ~250 by 2020 → &gt;1,000 by 2025 — a clear monolith-to-microservices trajectory) <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li><strong>In-house microservice chassis framework<\u002Fstrong> (shipped as an artifact) pre-configures security, observability, DB access, Kafka <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li>Standardised builds via in-house <strong>Gradle plugins<\u002Fstrong> across <strong>700+ Java repos<\u002Fstrong>; a language-agnostic automation service performs mass codebase changes and dependency upgrades <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li><strong>Envoy<\u002Fstrong> service mesh for service/DB discovery <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<\u002Ful>\n<h4 id=\"data-transactional-analytical\">Data (transactional + analytical)<\u002Fh4>\n<ul>\n<li><strong>Transactional:<\u002Fstrong> <strong>MariaDB<\u002Fstrong> + <strong>PostgreSQL<\u002Fstrong> migrated to <strong>Amazon RDS<\u002Fstrong> (HA via <strong>Patroni<\u002Fstrong>/Postgres and <strong>Orchestrator<\u002Fstrong>/MariaDB); <strong>MongoDB → MongoDB Atlas<\u002Fstrong>; <strong>Redis<\u002Fstrong>; exploring distributed relational DBs <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li><strong>Streaming:<\u002Fstrong> <strong>Apache Kafka<\u002Fstrong> processes \"billions of messages a day\" — async messaging, log collection, streaming aggregations; moved onto Kubernetes with <strong>rack-aware standby replicas<\u002Fstrong>; <strong>complete history retained in compacted Kafka topics<\u002Fstrong>; own streaming engine + custom DSL over <strong>Kafka Streams<\u002Fstrong> and <strong>Flink<\u002Fstrong> <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li><strong>Analytics:<\u002Fstrong> <strong>Snowflake<\u002Fstrong> core store + <strong>S3 data lake on Apache Iceberg<\u002Fstrong>; <strong>Trino<\u002Fstrong> query layer (fault-tolerant gateway) over Iceberg/Snowflake/Kafka; <strong>Airflow + dbt-core<\u002Fstrong>; BI via <strong>Looker/Superset<\u002Fstrong>; in-house data-movement service + \"Data Archives\" (100bn+ records) <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<\u002Ful>\n<h4 id=\"infrastructure\">Infrastructure<\u002Fh4>\n<ul>\n<li><strong>AWS is the primary cloud<\u002Fstrong> (workloads migrated off on-prem by ~2020); networking centralised via <strong>AWS Transit Gateways<\u002Fstrong>; UK/Hungary/Australia scheme integrations require physical data centres, with <strong>Australia among the first AWS Outpost Servers deployments<\u002Fstrong> <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li><strong>Compute Runtime Platform (CRP)<\u002Fstrong> on Kubernetes: <strong>RKE2<\u002Fstrong> bootstrap, <strong>Rancher<\u002Fstrong> state, <strong>Helm<\u002Fstrong> (replacing JSONNET), GitOps via <strong>ArgoCD<\u002Fstrong>, Terraform provisioning; grew from <strong>6 → 20+ clusters<\u002Fstrong>; autoscaling via <strong>VPA<\u002Fstrong> + <strong>KEDA<\u002Fstrong> <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<\u002Ful>\n<h4 id=\"delivery\">Delivery<\u002Fh4>\n<ul>\n<li>CI: <strong>CircleCI → GitHub Actions<\u002Fstrong>, ~<strong>500K monthly builds<\u002Fstrong>, ~15% faster via cache pre-population, <strong>SLSA<\u002Fstrong> rollout <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<li>CD: in-house <strong>Octopus → Spinnaker<\u002Fstrong> with <strong>Automated Canary Analysis<\u002Fstrong> (5% traffic, 30-min metric analysis, auto-rollback) that \"automatically prevented hundreds of potentially incident-causing deployments\" in 2024 <span class=\"ev\">CONFIRMED/COMPANY CLAIM<\u002Fspan>; historically 120+ production deploys/day and no dedicated manual QA <span class=\"ev\">CONFIRMED, 2020<\u002Fspan>; <strong>Temporal<\u002Fstrong> automates DB switchovers/recovery tests <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<\u002Ful>\n<h4 id=\"reliability-observability\">Reliability/observability<\u002Fh4>\n<ul>\n<li>Full <strong>LGTM stack<\u002Fstrong> — <strong>Loki<\u002Fstrong> (logs), <strong>Grafana<\u002Fstrong> (dashboards), <strong>Tempo<\u002Fstrong> (traces), <strong>Mimir<\u002Fstrong> (metrics, migrated from Thanos); piloting <strong>Pyroscope<\u002Fstrong>; ~<strong>6m metric samples/sec<\u002Fstrong>, <strong>150m active series<\u002Fstrong> for the largest tenant <span class=\"ev\">CONFIRMED<\u002Fspan>.<\u002Fli>\n<\u002Ful>\n<h4 id=\"ml-platform\">ML platform<\u002Fh4>\n<ul>\n<li><strong>SageMaker Studio<\u002Fstrong
